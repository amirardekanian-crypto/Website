<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF7F2">
<title>Habits — AA Performance</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<!-- Dynamic manifest: bakes the CURRENT client link (incl. &key=) into start_url
     so an installed app keeps its identity and cloud writes keep working. -->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var client = params.get('client');
    var clientKey = params.get('key');
    window.IS_DEMO = (client === 'demo');
    var startUrl = client
      ? 'habits.html?client=' + encodeURIComponent(client) +
        (clientKey ? '&key=' + encodeURIComponent(clientKey) : '')
      : 'habits.html';
    var manifest = {
      name: "AA Habits",
      short_name: "AA Habits",
      description: "Daily health & fitness habit tracker.",
      start_url: startUrl,
      scope: "/",
      display: "standalone",
      orientation: "portrait",
      background_color: "#FAF7F2",
      theme_color: "#FAF7F2",
      lang: "en-GB",
      categories: ["fitness", "health", "sports"],
      icons: [
        { src: "/assets/img/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: "/assets/img/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green: #0E4A36;
    --green-dim: rgba(14,74,54,0.08);
    --green-mid: rgba(14,74,54,0.22);
    --clay: #C7552F;
    --clay-dim: rgba(199,85,47,0.08);
    --clay-mid: rgba(199,85,47,0.22);
    --ochre: #A8741C;
    --ochre-dim: rgba(168,116,28,0.08);
    --bg: #FAF7F2;
    --card: #FFFFFF;
    --card-alt: #EDE8E0;
    --line: #D8D1C5;
    --ink: #1A1A1A;
    --muted: #5C5C5C;
    --on-accent: #FFFFFF;
  }
  body[data-dark] {
    --bg: #181818;
    --card: #202020;
    --card-alt: #262626;
    --line: #3A3A3A;
    --ink: #EDEAE4;
    --muted: #9A9690;
    --green: #2E8663;
    --green-dim: rgba(46,134,99,0.14);
    --green-mid: rgba(46,134,99,0.32);
    --clay: #E06B43;
    --clay-dim: rgba(224,107,67,0.12);
    --clay-mid: rgba(224,107,67,0.3);
    --ochre: #C99435;
    --ochre-dim: rgba(201,148,53,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 80px; }

  /* ── Loading / error ── */
  .loading-screen {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 40px; height: 40px; border: 3px solid var(--line);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text, .eyebrow {
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
  }
  .loading-text { margin-top: 20px; }
  .error-screen {
    position: fixed; inset: 0; z-index: 9998; background: var(--bg);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center;
  }
  .error-screen.show { display: flex; }
  .error-screen h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .error-screen p { color: var(--muted); font-size: 14px; white-space: pre-line; line-height: 1.6; }

  /* ── Header ── */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .brand .eyebrow { color: var(--muted); }
  .brand h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1; }
  .hdr-btns { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; transition: all 0.15s ease;
  }
  .icon-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* ── Greeting / stats ── */
  .greet { margin-bottom: 16px; }
  .greet .name {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 44px; text-transform: uppercase; letter-spacing: 1px; line-height: 1;
  }
  .greet .sub { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 10px 10px; text-align: center; position: relative; overflow: hidden;
  }
  .stat::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--green); }
  .stat:nth-child(2)::before { background: var(--clay); }
  .stat:nth-child(3)::before { background: var(--ochre); }
  .stat .v { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 30px; line-height: 1; }
  .stat .l { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  /* ── Week strip ── */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
  .wday { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 8px 0 9px; border-radius: 12px; border: 1px solid transparent; transition: all 0.15s ease; }
  .wday.sel { border-color: var(--line); background: var(--card); }
  .wday .dl { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .wday .ring { width: 30px; height: 30px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
  .wday .ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--line) 0); }
  .wday .ring::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg); }
  .wday.sel .ring::after { background: var(--card); }
  .wday .dn { position: relative; z-index: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; }
  .wday.done .ring::before { background: var(--green); }
  .wday.done .ring::after { display: none; }
  .wday.done .dn { color: var(--on-accent); }

  /* ── Day heading ── */
  .day-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .day-head h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
  .day-head .pct { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1px; color: var(--muted); }
  .not-today {
    display: none; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--clay); margin: -6px 0 12px; cursor: pointer;
  }
  .not-today.show { display: block; }

  /* ── Groups & habits ── */
  .group { margin-bottom: 18px; }
  .group-label {
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .group-label .dot { width: 7px; height: 7px; border-radius: 2px; }
  .habit {
    display: flex; align-items: center; gap: 13px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 14px; margin-bottom: 8px; cursor: pointer; user-select: none;
    position: relative; overflow: hidden; transition: transform 0.1s ease;
  }
  .habit:active { transform: scale(0.985); }
  .habit::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gc, var(--green)); }
  .hb-check {
    width: 26px; height: 26px; min-width: 26px; border-radius: 50%;
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    transition: all 0.18s ease;
  }
  .hb-check svg { width: 13px; height: 13px; stroke: var(--on-accent); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset 0.22s ease 0.05s; }
  .habit.on .hb-check { background: var(--gc, var(--green)); border-color: var(--gc, var(--green)); }
  .habit.on .hb-check svg { stroke-dashoffset: 0; }
  .hb-name { flex: 1; font-size: 15px; font-weight: 500; line-height: 1.25; transition: color 0.18s ease; }
  .habit.on .hb-name { color: var(--muted); }
  .hb-streak {
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.5px;
    color: var(--gc, var(--green)); background: var(--gcd, var(--green-dim));
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .hb-del {
    display: none; width: 26px; height: 26px; min-width: 26px; border-radius: 8px;
    border: 1px solid var(--line); background: none; color: var(--muted);
    font-size: 14px; cursor: pointer; align-items: center; justify-content: center;
  }
  body.editing .hb-del { display: flex; }
  body.editing .hb-streak { display: none; }
  .habit.hidden-habit { opacity: 0.45; }
  .habit.hidden-habit .hb-name { text-decoration: line-through; }

  /* ── Add habit ── */
  .add-card { display: none; background: var(--card-alt); border: 1px dashed var(--line); border-radius: 14px; padding: 14px; margin-bottom: 18px; }
  body.editing .add-card { display: block; }
  .add-card .row { display: flex; gap: 8px; }
  .add-card input, .add-card select {
    font-family: 'Barlow', sans-serif; font-size: 14px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .add-card input { flex: 1; min-width: 0; }
  .add-card button {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--on-accent);
    background: var(--green); border: none; border-radius: 10px; padding: 10px 16px; cursor: pointer;
  }
  .add-card .hint { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 8px; }

  /* ── Heatmap ── */
  .heat-sec { margin-top: 26px; }
  .heat-sec h3 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
  .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .heat .cell { aspect-ratio: 1; border-radius: 6px; background: var(--card-alt); position: relative; }
  .heat .cell.lv1 { background: var(--green-dim); }
  .heat .cell.lv2 { background: var(--green-mid); }
  .heat .cell.lv3 { background: var(--green); opacity: 0.65; }
  .heat .cell.lv4 { background: var(--green); }
  .heat .cell.today-cell { outline: 2px solid var(--clay); outline-offset: 1px; }
  .heat-legend { display: flex; align-items: center; gap: 5px; justify-content: flex-end; margin-top: 8px; }
  .heat-legend span { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .heat-legend .cell { width: 12px; height: 12px; border-radius: 3px; aspect-ratio: auto; }

  .sync-note { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 30px; }
  .sync-note .sdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--line); margin-right: 5px; vertical-align: 1px; }
  .sync-note.ok .sdot { background: var(--green); }
  .demo-banner {
    display: none; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; text-align: center; color: var(--on-accent);
    background: var(--clay); border-radius: 10px; padding: 8px; margin-bottom: 16px;
  }
  body.is-demo .demo-banner { display: block; }
</style>
</head>
<body>

<div class="loading-screen" id="loading"><div class="loading-spinner"></div><div class="loading-text">Loading habits</div></div>
<div class="error-screen" id="error"><h2>Can't load</h2><p id="error-msg"></p></div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="brand">
      <img src="/assets/img/icon-192.png" alt="" width="34" height="34">
      <div>
        <div class="eyebrow">AA Performance</div>
        <h1>Habits</h1>
      </div>
    </div>
    <div class="hdr-btns">
      <button class="icon-btn" id="btn-dark" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="btn-edit" aria-label="Edit habits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
  </header>

  <div class="demo-banner">Demo mode — nothing is saved to the cloud</div>

  <div class="greet">
    <div class="name" id="greet-name"></div>
    <div class="sub" id="greet-date"></div>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="v" id="st-streak">0</div><div class="l">Day streak</div></div>
    <div class="stat"><div class="v" id="st-today">0%</div><div class="l">Today</div></div>
    <div class="stat"><div class="v" id="st-week">0%</div><div class="l">This week</div></div>
  </div>

  <div class="week" id="week"></div>

  <div class="day-head">
    <h2 id="day-title">Today</h2>
    <div class="pct" id="day-pct"></div>
  </div>
  <div class="not-today" id="back-today">‹ Back to today</div>

  <div id="groups"></div>

  <div class="add-card">
    <div class="row">
      <input type="text" id="add-name" maxlength="60" placeholder="New habit — e.g. Stretch 10 min">
      <select id="add-group"></select>
      <button id="add-btn">Add</button>
    </div>
    <div class="hint">Tap ✕ to hide a default habit or remove a custom one. Tap a hidden habit's ↺ to bring it back.</div>
  </div>

  <div class="heat-sec">
    <h3>Last 4 weeks</h3>
    <div class="heat" id="heat"></div>
    <div class="heat-legend">
      <span>Less</span>
      <div class="cell"></div><div class="cell lv1"></div><div class="cell lv2"></div><div class="cell lv3"></div><div class="cell lv4"></div>
      <span>More</span>
    </div>
  </div>

  <div class="sync-note" id="sync-note"><span class="sdot"></span><span id="sync-text">Saved on this device</span></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
//  AA HABITS — standalone daily habit tracker for coaching clients.
//  Same identity model as program.html: habits.html?client=<id>&key=<key>.
//  localStorage is the source of truth; the cloud mirror reuses the
//  existing save_progress/get_progress RPCs (jsonb top-level merge), so
//  no new backend objects are needed and program.html's own snapshot
//  carries these keys too.
// ════════════════════════════════════════════════════════════════════
const SB_URL = 'https://bvipfipbdcyqnbczjmaq.supabase.co';
const SB_KEY = 'sb_publishable_BuDVTTC1E0eg3wc7F1Pcig_1A_tqYCy';

const GROUPS = {
  train:   { label: 'Train',     color: 'var(--clay)',  dim: 'var(--clay-dim)'  },
  recover: { label: 'Recover',   color: 'var(--green)', dim: 'var(--green-dim)' },
  fuel:    { label: 'Fuel',      color: 'var(--ochre)', dim: 'var(--ochre-dim)' },
  move:    { label: 'Move',      color: 'var(--clay)',  dim: 'var(--clay-dim)'  },
  stack:   { label: 'The Stack', color: 'var(--green)', dim: 'var(--green-dim)' }
};
const DEFAULT_HABITS = [
  { id: 'train',    name: 'Training session done',      group: 'train'   },
  { id: 'mobility', name: '10 min mobility / warm-up',  group: 'train'   },
  { id: 'sleep',    name: 'Sleep 7+ hours',             group: 'recover' },
  { id: 'unwind',   name: 'Wind down — no screens in bed', group: 'recover' },
  { id: 'protein',  name: 'Hit protein target',         group: 'fuel'    },
  { id: 'water',    name: '2L+ water',                  group: 'fuel'    },
  { id: 'steps',    name: '8,000+ steps',               group: 'move'    },
  { id: 'vitd',     name: 'Vitamin D',                  group: 'stack'   },
  { id: 'creatine', name: 'Creatine',                   group: 'stack'   },
  { id: 'omega3',   name: 'Omega-3',                    group: 'stack'   }
];

let ATHLETE_ID = '', ATHLETE_NAME = '', KEY = null;
let CFG = { custom: [], hidden: [], updatedAt: 0 };   // custom: [{id,name,group}]
let LOG = {};                                          // { 'YYYY-MM-DD': { habitId: 1|0 } }
let viewDate = null;                                   // Date being viewed/edited

const K_CFG = () => ATHLETE_ID + '_hab_cfg';
const K_LOG = () => ATHLETE_ID + '_hab_log';

function fmtKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function allHabits() { return DEFAULT_HABITS.concat(CFG.custom || []); }
function activeHabits() { return allHabits().filter(h => (CFG.hidden || []).indexOf(h.id) === -1); }
function isChecked(dayKey, id) { return !!(LOG[dayKey] && LOG[dayKey][id] === 1); }
function dayPct(dayKey) {
  const hs = activeHabits();
  if (!hs.length) return 0;
  return Math.round(hs.filter(h => isChecked(dayKey, h.id)).length / hs.length * 100);
}

// ── Persistence ──────────────────────────────────────────────────────
function loadLocal() {
  try { CFG = Object.assign({ custom: [], hidden: [], updatedAt: 0 }, JSON.parse(localStorage.getItem(K_CFG()) || '{}')); } catch (e) {}
  try { LOG = JSON.parse(localStorage.getItem(K_LOG()) || '{}') || {}; } catch (e) {}
}
function saveCfg() {
  CFG.updatedAt = Date.now();
  try { localStorage.setItem(K_CFG(), JSON.stringify(CFG)); } catch (e) {}
  schedulePush();
}
function saveLog() {
  try { localStorage.setItem(K_LOG(), JSON.stringify(LOG)); } catch (e) {}
  schedulePush();
}

// ── Cloud mirror (reuses program.html's RPC pair) ────────────────────
let _sbClient = null, _pushTimer = null;
function _sb() {
  if (_sbClient) return _sbClient;
  if (!window.supabase || !window.supabase.createClient) return null;
  _sbClient = window.supabase.createClient(SB_URL, SB_KEY);
  return _sbClient;
}
function schedulePush() {
  if (window.IS_DEMO || !ATHLETE_ID) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(async () => {
    try {
      const sb = _sb();
      if (!sb) return;
      const payload = {};
      payload[K_CFG()] = localStorage.getItem(K_CFG()) || '{}';
      payload[K_LOG()] = localStorage.getItem(K_LOG()) || '{}';
      const { error } = await sb.rpc('save_progress', {
        p_athlete_id: ATHLETE_ID, p_athlete_name: ATHLETE_NAME,
        p_data: payload, p_key: KEY
      });
      setSyncState(!error);
    } catch (e) { setSyncState(false); }
  }, 1200);
}
async function syncFromCloud() {
  if (window.IS_DEMO || !ATHLETE_ID) return;
  for (let i = 0; i < 30 && !(window.supabase && window.supabase.createClient); i++) {
    await new Promise(r => setTimeout(r, 100));
  }
  try {
    const sb = _sb();
    if (!sb) return;
    const { data, error } = await sb.rpc('get_progress', { p_athlete_id: ATHLETE_ID, p_key: KEY });
    if (error || !data || typeof data !== 'object') return;
    // Deep-merge the habit log: union of days; per habit, an explicit value
    // (1 checked / 0 unchecked) wins over absence, cloud wins a true conflict.
    try {
      const cloudLog = JSON.parse(data[K_LOG()] || '{}') || {};
      Object.keys(cloudLog).forEach(day => {
        LOG[day] = Object.assign({}, LOG[day] || {}, cloudLog[day]);
      });
    } catch (e) {}
    // Config: newest updatedAt wins wholesale.
    try {
      const cloudCfg = JSON.parse(data[K_CFG()] || '{}');
      if (cloudCfg && (cloudCfg.updatedAt || 0) > (CFG.updatedAt || 0)) {
        CFG = Object.assign({ custom: [], hidden: [], updatedAt: 0 }, cloudCfg);
      }
    } catch (e) {}
    try {
      localStorage.setItem(K_LOG(), JSON.stringify(LOG));
      localStorage.setItem(K_CFG(), JSON.stringify(CFG));
    } catch (e) {}
    setSyncState(true);
  } catch (e) { /* offline — local still works */ }
}
function setSyncState(ok) {
  const n = document.getElementById('sync-note');
  const t = document.getElementById('sync-text');
  if (window.IS_DEMO) { t.textContent = 'Demo — saved on this device only'; return; }
  n.classList.toggle('ok', !!ok);
  t.textContent = ok ? 'Synced with your coach' : 'Saved on this device — will sync when online';
}

// ── Streaks & stats ──────────────────────────────────────────────────
function habitStreak(id) {
  const tk = fmtKey(today());
  let d = isChecked(tk, id) ? today() : addDays(today(), -1);
  let n = 0;
  while (isChecked(fmtKey(d), id)) { n++; d = addDays(d, -1); }
  return n;
}
function dayStreak() {
  // Consecutive days with at least 80% of habits done; today counts once it qualifies.
  const qualifies = k => dayPct(k) >= 80;
  let d = qualifies(fmtKey(today())) ? today() : addDays(today(), -1);
  let n = 0;
  while (qualifies(fmtKey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function weekPct() {
  let sum = 0;
  for (let i = 0; i < 7; i++) sum += dayPct(fmtKey(addDays(today(), -i)));
  return Math.round(sum / 7);
}

// ── Render ───────────────────────────────────────────────────────────
const DAY_LETTERS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
function render() {
  const vk = fmtKey(viewDate);
  const tk = fmtKey(today());
  const isToday = vk === tk;

  document.getElementById('st-streak').textContent = dayStreak();
  document.getElementById('st-today').textContent = dayPct(tk) + '%';
  document.getElementById('st-week').textContent = weekPct() + '%';

  // Week strip: trailing 7 days ending today.
  const week = document.getElementById('week');
  week.innerHTML = '';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(today(), -i);
    const k = fmtKey(d);
    const p = dayPct(k);
    const el = document.createElement('div');
    el.className = 'wday' + (k === vk ? ' sel' : '') + (p === 100 ? ' done' : '');
    el.style.setProperty('--p', p);
    el.innerHTML = '<span class="dl">' + DAY_LETTERS[d.getDay()] + '</span>' +
      '<span class="ring"><span class="dn">' + d.getDate() + '</span></span>';
    el.addEventListener('click', () => { viewDate = d; render(); });
    week.appendChild(el);
  }

  document.getElementById('day-title').textContent = isToday ? 'Today'
    : viewDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  document.getElementById('day-pct').textContent = dayPct(vk) + '% done';
  document.getElementById('back-today').classList.toggle('show', !isToday);

  // Habit groups.
  const wrap = document.getElementById('groups');
  wrap.innerHTML = '';
  const hiddenIds = CFG.hidden || [];
  const editing = document.body.classList.contains('editing');
  Object.keys(GROUPS).forEach(gid => {
    const g = GROUPS[gid];
    let hs = allHabits().filter(h => h.group === gid);
    if (!editing) hs = hs.filter(h => hiddenIds.indexOf(h.id) === -1);
    if (!hs.length) return;
    const sec = document.createElement('div');
    sec.className = 'group';
    const lbl = document.createElement('div');
    lbl.className = 'group-label';
    lbl.innerHTML = '<span class="dot" style="background:' + g.color + '"></span>' + g.label;
    sec.appendChild(lbl);
    hs.forEach(h => {
      const hidden = hiddenIds.indexOf(h.id) !== -1;
      const on = isChecked(vk, h.id);
      const row = document.createElement('div');
      row.className = 'habit' + (on ? ' on' : '') + (hidden ? ' hidden-habit' : '');
      row.style.setProperty('--gc', g.color);
      row.style.setProperty('--gcd', g.dim);
      const streak = habitStreak(h.id);
      row.innerHTML =
        '<span class="hb-check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span>' +
        '<span class="hb-name">' + escapeHtml(h.name) + '</span>' +
        (streak >= 2 ? '<span class="hb-streak">' + streak + '-day</span>' : '');
      if (!hidden) row.addEventListener('click', () => toggleHabit(vk, h.id));
      if (editing) {
        const del = document.createElement('button');
        del.className = 'hb-del';
        const isCustom = DEFAULT_HABITS.every(d => d.id !== h.id);
        del.textContent = hidden ? '↺' : '✕';
        del.setAttribute('aria-label', hidden ? 'Restore habit' : (isCustom ? 'Remove habit' : 'Hide habit'));
        del.addEventListener('click', ev => {
          ev.stopPropagation();
          if (hidden) CFG.hidden = hiddenIds.filter(x => x !== h.id);
          else if (isCustom) CFG.custom = (CFG.custom || []).filter(c => c.id !== h.id);
          else CFG.hidden = hiddenIds.concat([h.id]);
          saveCfg(); render();
        });
        row.appendChild(del);
      }
      sec.appendChild(row);
    });
    wrap.appendChild(sec);
  });

  // Heatmap: 28 cells ending today, week rows aligned so today is last.
  const heat = document.getElementById('heat');
  heat.innerHTML = '';
  for (let i = 27; i >= 0; i--) {
    const k = fmtKey(addDays(today(), -i));
    const p = dayPct(k);
    const lv = p === 0 ? 0 : p <= 30 ? 1 : p <= 60 ? 2 : p < 100 ? 3 : 4;
    const c = document.createElement('div');
    c.className = 'cell' + (lv ? ' lv' + lv : '') + (i === 0 ? ' today-cell' : '');
    c.title = k + ' — ' + p + '%';
    heat.appendChild(c);
  }
}
function toggleHabit(dayKey, id) {
  if (!LOG[dayKey]) LOG[dayKey] = {};
  LOG[dayKey][id] = isChecked(dayKey, id) ? 0 : 1;   // explicit 0 so an uncheck syncs too
  saveLog(); render();
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error').classList.add('show');
}

// ── Boot ─────────────────────────────────────────────────────────────
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('client');
  const clientKey = params.get('key');
  if (!clientId) {
    showError('No client specified.\n\nOpen this page from your personal link:\nhabits.html?client=your_id');
    return;
  }
  if (window.IS_DEMO) document.body.classList.add('is-demo');

  let athlete = null;
  try {
    const res = await fetch('data/' + encodeURIComponent(clientId) + '.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    athlete = (await res.json()).athlete || {};
  } catch (e) {
    showError('Could not load data for "' + clientId + '".\n\nCheck your link, or ask your coach for a fresh one.');
    return;
  }

  ATHLETE_ID = athlete.id || clientId;
  ATHLETE_NAME = [athlete.firstName, athlete.lastName].filter(Boolean).join(' ');

  // Same 3-tier key resolution as program.html: URL → device copy → program JSON.
  if (!window.IS_DEMO) {
    const ks = ATHLETE_ID + '_skey';
    try {
      KEY = clientKey || localStorage.getItem(ks) || athlete.key || null;
      if (KEY) localStorage.setItem(ks, KEY);
    } catch (e) { KEY = clientKey || athlete.key || null; }
  }

  loadLocal();
  await syncFromCloud();

  if (localStorage.getItem('dark_mode')) document.body.setAttribute('data-dark', '');
  document.querySelector('meta[name="theme-color"]').setAttribute('content',
    document.body.hasAttribute('data-dark') ? '#181818' : '#FAF7F2');

  document.getElementById('greet-name').textContent = athlete.firstName || 'Athlete';
  document.getElementById('greet-date').textContent =
    today().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

  const sel = document.getElementById('add-group');
  Object.keys(GROUPS).forEach(gid => {
    const o = document.createElement('option');
    o.value = gid; o.textContent = GROUPS[gid].label;
    sel.appendChild(o);
  });

  document.getElementById('btn-dark').addEventListener('click', () => {
    const dark = document.body.hasAttribute('data-dark');
    if (dark) { document.body.removeAttribute('data-dark'); localStorage.removeItem('dark_mode'); }
    else { document.body.setAttribute('data-dark', ''); localStorage.setItem('dark_mode', '1'); }
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#FAF7F2' : '#181818');
  });
  document.getElementById('btn-edit').addEventListener('click', () => {
    document.body.classList.toggle('editing');
    document.getElementById('btn-edit').classList.toggle('active');
    render();
  });
  document.getElementById('back-today').addEventListener('click', () => { viewDate = today(); render(); });
  document.getElementById('add-btn').addEventListener('click', () => {
    const inp = document.getElementById('add-name');
    const name = inp.value.trim();
    if (!name) return;
    const id = 'c_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24) + '_' + Date.now().toString(36);
    CFG.custom = (CFG.custom || []).concat([{ id: id, name: name, group: sel.value }]);
    inp.value = '';
    saveCfg(); render();
  });
  window.addEventListener('visibilitychange', () => { if (document.hidden) schedulePush(); });

  viewDate = today();
  setSyncState(false);
  render();

  document.getElementById('app').style.display = '';
  document.getElementById('loading').classList.add('hidden');

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
})();
</script>
