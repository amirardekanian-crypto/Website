<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF7F2">
<title>Proof — AA Performance</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<!-- Dynamic manifest: bakes the CURRENT client link (incl. &key=) into start_url
     so an installed app keeps its identity and cloud writes keep working. -->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var client = params.get('client');
    var clientKey = params.get('key');
    window.IS_DEMO = (client === 'demo');
    var startUrl = client
      ? 'habits.html?client=' + encodeURIComponent(client) +
        (clientKey ? '&key=' + encodeURIComponent(clientKey) : '')
      : 'habits.html';
    var manifest = {
      name: "Proof", short_name: "Proof",
      description: "Daily health habits, tracked and coached.",
      start_url: startUrl, scope: "/", display: "standalone", orientation: "portrait",
      background_color: "#FAF7F2", theme_color: "#FAF7F2", lang: "en-GB",
      categories: ["fitness", "health", "sports"],
      icons: [
        { src: "/assets/img/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: "/assets/img/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    var link = document.createElement('link');
    link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── Tokens ────────────────────────────────────────────────────────────
     PROOF's modernist structure on the AA Performance palette (the "green
     machine" mapping from the handoff's Color Options sheet): green is the
     accent, clay carries the coach's voice and mono meta. Zero radius
     anywhere, 2px section rules, 1px row rules, everything flush left. */
  :root {
    --bg: #FAF7F2;
    --surface: #EDE8E0;
    --ink: #1A1A1A;
    --accent: #0E4A36;
    --accent-600: #0B3B2B;
    --accent-700: #08301F;
    --accent-100: rgba(14,74,54,0.08);
    --clay: #C7552F;
    --clay-deep: #8E3A1E;
    /* Text that sits ON a clay background. Clay inverts between themes — deep
       clay is a dark brown in light mode and a light salmon in dark — so the
       text on it has to invert too. Hard-coding white gave 2.4:1 in dark mode
       on exactly the three surfaces that exist to warn you. */
    --on-clay: #FAF7F2;
    --scrim: rgba(26,26,26,0.45);
    --divider: rgba(26,26,26,0.40);
    --rule: rgba(26,26,26,0.20);
    --muted: rgba(26,26,26,0.58);
    --muted-soft: rgba(26,26,26,0.50);
    --track: rgba(26,26,26,0.12);
    --box: rgba(26,26,26,0.45);
  }
  body[data-dark] {
    --bg: #0F1A15;
    --surface: #172219;
    --ink: #F0EDE6;
    --accent: #3E9C74;
    --accent-600: #4FAF85;
    --accent-700: #7FD0AC;
    --accent-100: rgba(62,156,116,0.14);
    --clay: #E06B43;
    --clay-deep: #F09068;
    --on-clay: #14120F;
    --scrim: rgba(0,0,0,0.55);
    --divider: rgba(240,237,230,0.34);
    --rule: rgba(240,237,230,0.18);
    --muted: rgba(240,237,230,0.60);
    --muted-soft: rgba(240,237,230,0.50);
    --track: rgba(240,237,230,0.14);
    --box: rgba(240,237,230,0.45);
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; line-height: 1.55;
    overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: transparent; border: 0; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hd { font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 900; text-transform: uppercase; }
  .mono { font-family: 'Space Mono', ui-monospace, Menlo, monospace; }
  .eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
  }

  @keyframes pop { 0% { transform: scale(.6) } 60% { transform: scale(1.12) } 100% { transform: scale(1) } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes spin { to { transform: rotate(360deg) } }
  /* Screens travel in the direction you navigated, so the tab bar and the
     content agree about which way you just moved. House ease throughout. */
  @keyframes slideFromRight { from { opacity: 0; transform: translateX(24px) } to { opacity: 1; transform: none } }
  @keyframes slideFromLeft  { from { opacity: 0; transform: translateX(-24px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ── Shell ── */
  .app {
    height: 100%; max-width: 520px; margin: 0 auto;
    display: none; flex-direction: column; position: relative; overflow: hidden;
    background: var(--bg);
  }
  .app.on { display: flex; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { width: 0; }

  .loading, .errscreen {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center; transition: opacity .4s ease;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .errmark { font-size: 15px; letter-spacing: .22em; color: var(--accent); margin-bottom: 22px; }
  .errhint { margin-top: 22px; font-size: 11px; line-height: 1.6; color: var(--muted-soft); }
  .errhint code { font-family: 'Space Mono', monospace; font-size: 10px; }
  .spinner { width: 38px; height: 38px; border: 3px solid var(--track); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .errscreen { display: none; z-index: 9998; }
  .errscreen.on { display: flex; }
  .errscreen h2 { font-size: 30px; line-height: 1; letter-spacing: -.02em; margin-bottom: 12px; }
  .errscreen p { font-size: 14px; color: var(--muted); white-space: pre-line; }

  /* ── Header ── */
  .apphd {
    padding: calc(20px + env(safe-area-inset-top)) 20px 12px;
    border-bottom: 2px solid var(--divider);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    background: var(--bg);
  }
  .apphd .title { font-size: 24px; line-height: 1; letter-spacing: -.02em; margin-top: 4px; }
  .apphd .right { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--clay-deep); white-space: nowrap; }

  /* ── Blocks & rules ── */
  .block { padding: 20px; border-bottom: 2px solid var(--divider); }
  .row-rule { border-bottom: 1px solid var(--rule); }

  .bar { height: 10px; background: var(--track); }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .35s cubic-bezier(.2,.8,.2,1); }
  .bar.thin { height: 8px; }

  .figure { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; color: var(--accent); letter-spacing: -.04em; }

  /* ── Habit rows ── */
  .hrow { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); }
  .hrow.done { background: var(--accent-100); }
  .hrow .checkcell {
    flex: none; width: 64px; border-right: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center;
  }
  .boxmark { width: 28px; height: 28px; border: 2px solid var(--box); display: block; transition: border-color .18s ease, background-color .18s ease; }
  .boxmark.on {
    border-color: var(--accent); background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    animation: pop .28s ease;
  }
  /* The tick DRAWS rather than appearing — 300ms of stroke is the difference
     between "the state changed" and "you just did that". Scoped to .tick on
     purpose: the same cell also holds the lock glyph on a locked habit, and
     these rules would otherwise dash and redraw its shackle. */
  /* The stroke rules are GLOBAL, because the tick is reused outside a checkbox
     (a cleared quest, for one) and a path with no fill rule renders as a solid
     blob rather than a drawn line. Only the size and the draw animation belong
     to the habit checkbox. */
  svg.tick { display: block; width: 100%; height: 100%; }
  svg.tick path {
    fill: none; stroke: currentColor; stroke-width: 3.4;
    stroke-linecap: square; stroke-linejoin: miter;
  }
  .boxmark svg.tick { width: 20px; height: 20px; }
  .boxmark svg.tick path {
    stroke-dasharray: 24; stroke-dashoffset: 24;
    animation: drawTick .3s cubic-bezier(.5,0,.3,1) .04s forwards;
  }
  @keyframes drawTick { to { stroke-dashoffset: 0 } }
  .hrow .body {
    flex: 1; min-width: 0; text-align: left; padding: 13px 12px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .hrow .body .line1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hrow .body .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
  .hrow .body .stk { font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--muted-soft); }
  .hrow .body .status { font-size: 11px; line-height: 1; color: var(--muted); }
  .hrow .body .track { display: block; width: 100%; height: 4px; background: var(--track); margin-top: 2px; }
  .hrow .body .track > span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
  /* No border-left. It only existed on rows that HAVE a plus, so the vertical
     rule appeared on the counter habits and vanished on the check-off ones,
     making the right edge of the list look broken halfway down. */
  .hrow .pluscell {
    flex: none; width: 54px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; color: var(--accent);
  }
  .hrow .pluscell:hover { background: var(--accent-100); }
  /* A locked habit is owned by another system — it reads as unavailable rather
     than merely unticked, so nobody taps it expecting a tick. */
  .hrow.locked .checkcell { cursor: default; }
  .boxmark.lock {
    border-style: dashed; border-color: var(--muted-soft); color: var(--muted-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .boxmark.lock svg { width: 15px; height: 15px; }
  .hrow.locked .nm, .hrow.locked .status { color: var(--muted); }

  /* ── Coach card ── */
  .coachcard {
    background: var(--clay); color: var(--on-clay); padding: 20px;
    border-bottom: 2px solid var(--divider);
    display: flex; flex-direction: column; gap: 12px; animation: riseIn .3s ease;
  }
  .coachcard .eyebrow { color: var(--on-clay); opacity: .8; }
  /* The nudge changes copy as the day goes, and the lines are not all the same
     length. Without a floor the card resizes on a tick and shoves the habit list
     under the athlete's finger — a smaller version of the scroll bug the renderer
     was rewritten to kill. Four lines holds almost every nudge in the library. */
  .coachcard .say { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 21px; line-height: 1.08; letter-spacing: -.01em; text-transform: uppercase; text-wrap: pretty; min-height: 3.3em; }

  /* The level hero. One bar, not two — see the comment in renderToday(). */
  .hero-lv { display: flex; flex-direction: column; gap: 12px; }

  /* Progress's slim level strip — the same information as Today's hero at a
     fifth of the height, so the tab can lead with something of its own. */
  .lvstrip {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 12px 20px; background: none; border-bottom: 2px solid var(--divider);
  }
  .lvstrip-num { font-size: 20px; line-height: 1; color: var(--accent); flex: none; }
  .lvstrip-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .lvstrip-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .lvstrip-top .hd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lvstrip-top .go { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; color: var(--clay-deep); }
  .lvstrip-next { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); }
  .lvstrip-next span { font-size: 8px; letter-spacing: .08em; color: var(--muted-soft); display: block; }

  /* Four season facts, equal weight. The old two-up made the day streak the
     biggest number on the tab, so a rebuilding athlete opened Progress to a
     giant zero. */
  .statgrid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    border-bottom: 2px solid var(--divider);
  }
  .statgrid > div {
    padding: 13px 20px; display: flex; flex-direction: column; gap: 3px;
    border-bottom: 1px solid var(--rule);
  }
  .statgrid > div:nth-child(odd) { border-right: 1px solid var(--rule); }
  .statgrid > div:nth-last-child(-n+2) { border-bottom: 0; }
  .statgrid .figure, .statgrid .statfrac { font-size: 27px; line-height: .95; letter-spacing: -.02em; }
  .statgrid .statfrac { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; color: var(--accent); }
  .statgrid .statfrac .of { font-size: 15px; color: var(--muted-soft); }
  .statgrid .eyebrow { letter-spacing: .1em; }

  /* The pips had no legend anywhere in the app and are empty for the first
     five days, so they read as decoration. Said once, above the list. */
  .pipkey {
    display: flex; align-items: center; gap: 9px; padding: 0 20px 12px;
    font-size: 11px; line-height: 1.4; color: var(--muted-soft);
  }
  .pipkey .pips { flex: none; }

  /* A figure with its unit set inside it, rather than welded on at full size. */
  .statnum { font-size: 26px; line-height: 1; letter-spacing: -.02em; }
  .statnum .su { font-size: 13px; color: var(--muted-soft); margin-left: 2px; letter-spacing: 0; }

  /* Today's cell in the 35-day grid, and the key that says which end is which. */
  .grid35 .c.now { outline: 2px solid var(--clay-deep); outline-offset: 1px; }
  .gridkey {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-soft);
  }
  .gridkey .gk { display: flex; align-items: center; gap: 5px; }
  .gridkey .gk .c {
    width: 9px; height: 9px; display: inline-block; flex: none;
    border: 1px solid var(--rule); background: none; margin-left: 4px;
  }
  .gridkey .gk .c:first-child { margin-left: 0; }
  .gridkey .gk .c.hit { background: var(--accent); border-color: var(--accent); }
  .gridkey .gk .c.part { background: var(--accent-100); border-color: var(--accent); }

  /* ── The manual ──────────────────────────────────────────────────────────
     A dozen sections of prose. Without a way in it is a wall you scroll past
     rather than a reference you use. */
  .manh2 { font-size: 22px; line-height: 1; margin-bottom: 10px; scroll-margin-top: 8px; }
  .manp { font-size: 14px; line-height: 1.62; color: var(--ink); margin-bottom: 12px; }
  .mancontents { border-bottom: 2px solid var(--divider); }
  .manlinks { display: flex; flex-wrap: wrap; gap: 6px; }
  .manlink {
    border: 1px solid var(--divider); background: none; color: var(--ink);
    padding: 7px 10px; text-align: left;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 12px; letter-spacing: .03em; text-transform: uppercase; line-height: 1;
  }
  .manlink:hover { border-color: var(--accent); color: var(--accent); }

  /* Board chrome, compressed. */
  .boardbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 20px; border-bottom: 2px solid var(--divider);
  }
  .boardbar.sub { padding: 11px 20px; border-bottom-width: 1px; border-color: var(--rule); }
  .boardbar .chips { flex: 1; min-width: 0; }
  .boardbar .chip { flex: 1; text-align: center; }
  .boardday { flex: none; font-size: 10px; letter-spacing: .08em; color: var(--clay-deep); font-weight: 700; }
  .boardnote { padding: 10px 20px 12px; font-size: 11.5px; line-height: 1.45; color: var(--muted-soft); }

  /* At-risk used to be said three ways at once: a clay card, a clay day-bar and
     a header flag. Now the day bar is gone it gets one unmissable strip, sitting
     directly above the list of things that would fix it. */
  .riskbar {
    background: var(--clay-deep); color: var(--on-clay); padding: 9px 20px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 13px; letter-spacing: .05em; text-transform: uppercase;
  }
  .coachcard .cta {
    align-self: flex-start; background: var(--on-clay); color: var(--clay); padding: 10px 14px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: flex-start; gap: 6px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px;
    letter-spacing: .04em; text-transform: uppercase; line-height: 1.2;
    padding: 14px 16px; border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: var(--accent-600); }
  .btn-primary:active { background: var(--accent-700); }
  .btn-secondary { border-color: var(--divider); }
  .btn-secondary:hover { background: rgba(128,128,128,.10); }
  .btn-block { width: 100%; }

  .input {
    width: 100%; min-height: 42px; padding: 8px 10px; font-size: 14px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); caret-color: var(--accent);
  }
  .input:focus-visible { border-color: var(--accent); outline-offset: 0; }

  /* ── Toggle (square, 44×24) ── */
  /* Off recedes. It used to be drawn in --ink for both border and knob, which
     made it heavier than any type beside it — so Settings drew the eye
     straight to whichever switches were turned OFF. */
  .sw { width: 44px; height: 24px; flex: none; border: 2px solid var(--muted-soft); display: flex; align-items: center; padding: 2px; }
  .sw > i { width: 16px; height: 16px; display: block; background: var(--muted-soft); }
  .sw.on { background: var(--accent); justify-content: flex-end; border-color: var(--accent); }
  .sw.on > i { background: var(--bg); }

  /* ── Select rows (goals, coach volume, motivation) ── */
  /* 20px, like every other list row in the app. At 14px these rows sat six
     pixels inside their own section headings, so Settings had no single left
     edge — the cheapest possible reason for a screen to feel subtly wrong.
     The border is 1px rule here rather than 2px divider because every instance
     was already overriding it inline to exactly that. */
  .selrow {
    width: 100%; text-align: left; padding: 15px 20px;
    border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .selrow.on { background: var(--accent); color: var(--bg); }
  .sectlbl { padding: 18px 20px 8px; letter-spacing: .12em; display: flex; justify-content: space-between; gap: 12px; }
  .selrow .lbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; line-height: 1.15; text-transform: uppercase; }
  .selrow .desc { font-size: 12px; line-height: 1.35; opacity: .75; margin-top: 5px; }
  .selrow .mark { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em; }

  /* ── Tab bar ── */
  /* The active-tab block used to be a background on the button, so it teleported.
     It is now one slab that SLIDES between cells, with the labels inverting under
     it — same modernist look, but the bar shows you where you went. */
  /* minmax(0,1fr) — NOT plain 1fr. `1fr` is minmax(auto,1fr), so the longest
     label forced its own column wider than the rest: the cells were 91/91/91/116
     at 390px and the whole bar overflowed the viewport at 320px. Equal columns
     are also what lets the sliding slab line up with a cell at all. */
  .tabs {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    border-top: 2px solid var(--divider); background: var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
    position: relative;
  }
  .tabslab {
    position: absolute; top: 0; bottom: env(safe-area-inset-bottom); left: 0;
    background: var(--ink); z-index: 0;
    transition: transform .32s cubic-bezier(.16,1,.3,1);
  }
  .tabs button {
    padding: 12px 8px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start;
    border-right: 1px solid var(--rule); position: relative; z-index: 1;
    transition: color .2s ease; overflow: hidden;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button.on { color: var(--bg); }
  .tabs .num { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: .06em; opacity: .6; }
  .tabs .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }

  /* ── Grid (35-day history) ── */
  /* Thirty-five squares appearing at once reads as a static block; cascading them
     reads as five weeks of data arriving. */
  @keyframes cellIn { from { opacity: 0; transform: scale(.7) } to { opacity: 1; transform: none } }
  .grid35 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .grid35 .c {
    aspect-ratio: 1; border: 1px solid rgba(128,128,128,.35);
    animation: cellIn .28s cubic-bezier(.16,1,.3,1) both;
  }
  .grid35 .c.hit { background: var(--accent); border-color: var(--accent); }
  .grid35 .c.part { background: var(--accent-100); border-color: var(--accent); }
  .grid35 .c.future { opacity: .25; }

  /* ── Sheet & toast ── */
  .scrim { position: absolute; inset: 0; z-index: 80; background: var(--scrim); animation: fadeIn .2s ease; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 90;
    background: var(--bg); border-top: 2px solid var(--ink);
    padding: 20px 20px calc(28px + env(safe-area-inset-bottom));
    animation: sheetUp .3s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; gap: 16px;
  }
  .stepper { display: flex; align-items: center; border: 2px solid var(--ink); }
  .stepper button { width: 58px; height: 64px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px; }
  .stepper .minus { border-right: 2px solid var(--ink); }
  .stepper .plus { border-left: 2px solid var(--ink); }
  .stepper .val { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .toast {
    position: absolute; left: 20px; right: 20px; bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 70;
    background: var(--ink); color: var(--bg); padding: 13px 15px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; line-height: 1.25;
    text-transform: uppercase; animation: riseIn .25s ease;
  }

  .demo-banner { background: var(--clay); color: var(--on-clay); padding: 8px 20px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; text-align: center; }

  /* ── The XP flight ──────────────────────────────────────────────────────
     Points you just earned leave the habit that earned them and land in the
     level that owns them. Two nested elements so the path is an ARC, not a
     straight line: the outer carries X on an ease-out, the inner carries Y on
     an ease-in with a small hop first. `#fx` is a `data-static` island, so the
     renderer leaves whatever is mid-flight alone. */
  #fx { position: absolute; inset: 0; z-index: 120; pointer-events: none; overflow: hidden; }
  .xpfly {
    position: absolute; will-change: transform;
    transform: translate(-50%, -50%);
    animation: xpFlyX .74s cubic-bezier(.35,.75,.25,1) both;
  }
  .xpfly > i {
    display: block; white-space: nowrap;
    background: var(--clay); color: var(--on-clay); padding: 4px 8px;
    font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    animation: xpFlyY .74s cubic-bezier(.6,.04,.75,.6) both;
  }
  @keyframes xpFlyX { to { transform: translate(calc(-50% + var(--dx)), -50%) } }
  @keyframes xpFlyY {
    0%   { transform: translateY(0) scale(.7); opacity: 0 }
    16%  { transform: translateY(-15px) scale(1.06); opacity: 1 }
    78%  { opacity: 1 }
    100% { transform: translateY(var(--dy)) scale(.55); opacity: 0 }
  }

  /* ── Level-up takeover ──────────────────────────────────────────────────
     The game moment. Square badge and hard edges keep it inside the modernist
     system — the drama comes from the ray burst, the scale-punch and the
     shards, not from rounded corners or glows. */
  @keyframes lvScrim  { from { opacity: 0 } to { opacity: 1 } }
  @keyframes lvRays   { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  @keyframes lvRaysIn { from { opacity: 0; transform: scale(.3) } to { opacity: .55; transform: scale(1) } }
  @keyframes lvBadge  {
    0%   { transform: scale(0) rotate(-25deg); opacity: 0 }
    55%  { transform: scale(1.25) rotate(6deg); opacity: 1 }
    75%  { transform: scale(.94) rotate(-2deg) }
    100% { transform: scale(1) rotate(0deg); opacity: 1 }
  }
  @keyframes lvShock  { 0% { transform: scale(.2); opacity: .9 } 100% { transform: scale(2.6); opacity: 0 } }
  @keyframes lvUp     { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
  @keyframes lvShard  { 0% { transform: translate(0,0) scale(1); opacity: 1 } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0 } }
  @keyframes lvFill   { from { width: 0 } to { width: var(--w) } }

  /* Two opaque variants so the moment never fights the screen behind it:
     a routine level lands on near-black with clay rays; a rank promotion goes
     full clay. Both are dark grounds, so all type is paper in both. */
  .lvwrap {
    position: absolute; inset: 0; z-index: 200;
    background: #14120F;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 26px; text-align: center; overflow: hidden;
    color: #FAF7F2;
    animation: lvScrim .22s ease;
  }
  /* Pinned, not tokenised. The takeover is a full-bleed moment that should
     look the same in both themes, and its type is white throughout — against
     the dark theme's lighter clay that white drops to ~3:1. */
  .lvwrap.rank { background: #C7552F; }
  .lvstage { position: relative; display: flex; align-items: center; justify-content: center; width: 200px; height: 200px; margin-bottom: 30px; }
  /* The burst is masked to a soft disc so it never collides with the type below. */
  .lvrays {
    position: absolute; width: 460px; height: 460px; opacity: .5;
    background: repeating-conic-gradient(var(--clay) 0deg 7deg, transparent 7deg 22deg);
    -webkit-mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.35) 42%, transparent 66%);
            mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.35) 42%, transparent 66%);
    animation: lvRaysIn .5s ease both, lvRays 16s linear .5s infinite;
  }
  .lvwrap.rank .lvrays { background: repeating-conic-gradient(#FAF7F2 0deg 6deg, transparent 6deg 20deg); opacity: .38; }
  .lvshock { position: absolute; width: 150px; height: 150px; border: 3px solid var(--clay); animation: lvShock .7s cubic-bezier(.2,.7,.3,1) .18s both; }
  .lvwrap.rank .lvshock { border-color: #FAF7F2; }
  .lvbadge {
    position: relative; width: 128px; height: 128px;
    background: #FAF7F2; color: var(--clay);
    border: 4px solid var(--clay);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    animation: lvBadge .72s cubic-bezier(.2,.8,.25,1) .1s both;
  }
  .lvwrap.rank .lvbadge { border-color: #FAF7F2; color: var(--clay); }
  .lvbadge .n { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 58px; line-height: .85; letter-spacing: -.04em; }
  .lvbadge .l { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .18em; color: rgba(26,26,26,.55); }
  .lvshards { position: absolute; inset: 0; pointer-events: none; }
  .lvshards i {
    position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; background: var(--clay);
    animation: lvShard .95s cubic-bezier(.15,.75,.3,1) .22s both;
  }
  .lvwrap.rank .lvshards i { background: #FAF7F2; }
  .lvkicker {
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .34em;
    text-transform: uppercase; color: var(--clay-2, #E06B43); animation: lvUp .4s ease .5s both;
  }
  .lvwrap.rank .lvkicker { color: rgba(250,247,242,.9); }
  .lvrank {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: 46px; line-height: .95; letter-spacing: -.02em; margin-top: 10px;
    color: #FAF7F2; animation: lvUp .45s ease .6s both;
  }
  .lvsub { font-size: 13px; color: rgba(250,247,242,.72); margin-top: 10px; animation: lvUp .45s ease .72s both; }
  .lvbar { width: 200px; height: 8px; background: rgba(250,247,242,.22); margin-top: 18px; animation: lvUp .45s ease .8s both; }
  .lvbar > span { display: block; height: 100%; background: #FAF7F2; animation: lvFill .8s cubic-bezier(.2,.8,.2,1) .95s both; }
  .lvgo {
    margin-top: 28px; background: #FAF7F2; color: #14120F; padding: 14px 26px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px;
    letter-spacing: .1em; text-transform: uppercase; animation: lvUp .45s ease .9s both;
  }
  .lvwrap.rank .lvgo { color: var(--clay); }
  /* Was pinned to the bottom of the viewport, which stranded it ~340px below
     the button under a band of empty clay and made the stack read top-heavy.
     It belongs with the button it describes: "Next" only means something if
     you can see there is a next. */
  .lvqueue { margin-top: 14px; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .16em; color: rgba(250,247,242,.6); }

  /* A third ground for the things that are NOT a level: consistency tiers,
     milestones and a perfect day. Deep green with clay-2 rays, so an athlete
     can tell what kind of win landed before they read a word of it. */
  .lvwrap.badge { background: #0B3B2B; }
  .lvwrap.badge .lvrays { background: repeating-conic-gradient(#E06B43 0deg 7deg, transparent 7deg 22deg); opacity: .42; }
  .lvwrap.badge .lvshock { border-color: #E06B43; }
  .lvwrap.badge .lvbadge { background: #FAF7F2; color: #0B3B2B; border-color: #E06B43; }
  .lvwrap.badge .lvshards i { background: #E06B43; }
  .lvwrap.badge .lvkicker { color: #E9A183; }
  .lvwrap.badge .lvgo { color: #0B3B2B; }
  /* Milestone codes are two letters, not a two-digit number — same box, smaller type. */
  .lvbadge .n.code { font-size: 44px; letter-spacing: -.02em; }

  /* Inline flash for routine habit level-ups (no takeover) */
  @keyframes lvPop { 0% { transform: scale(.4); opacity: 0 } 55% { transform: scale(1.22) } 100% { transform: scale(1); opacity: 1 } }
  .lvchip {
    background: var(--clay); color: #FAF7F2; padding: 3px 7px;
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .06em;
    animation: lvPop .45s cubic-bezier(.2,.8,.25,1) both;
  }
  .hlv { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--muted-soft); }
  /* The streak was the smallest type in the row and the most motivating number
     in it. It now reads as a figure with a unit rather than "9D". */
  .hlv .ember { font-size: 11px; }
  /* The ember used to sit after "LV 10" and carried a left margin for it. */
  .hlv .ember:first-child { margin-left: 0; }
  .hlv .ember .u { font-size: 8px; opacity: .75; margin-left: 1px; }

  /* Cross-link back to the training programme — the other half of the pair.
     Mirrors the Daily Habits card in program.html so the two apps read as one
     product rather than two separate tools. */
  .crosslink-wrap { padding: 4px 20px 22px; }
  .crosslink {
    width: 100%; display: flex; align-items: center; gap: 13px; text-align: left;
    padding: 14px 15px; background: var(--surface); border: 1px solid var(--divider);
  }
  .crosslink:active { transform: scale(0.99); }
  .crosslink-mark {
    flex: none; width: 42px; height: 42px; background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .crosslink-mark svg { width: 21px; height: 21px; }
  .crosslink-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .crosslink-title {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px;
    line-height: 1; text-transform: uppercase; letter-spacing: .02em;
  }
  .crosslink-sub { font-size: 11px; line-height: 1.3; color: var(--muted); }
  .crosslink-go {
    flex: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 19px; color: var(--clay-deep);
  }

  /* Scope chips (leaderboard: this week / all time) */
  .chips { display: flex; gap: 8px; }
  .chip {
    border: 2px solid var(--divider); padding: 8px 12px; color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .chip.chip-on { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  /* ── Roll call ───────────────────────────────────────────────────────────
     The compose box, and the wall it posts to. Flat, square, no bubbles: this
     is a noticeboard, not a chat app. */
  .notebox { display: flex; flex-direction: column; gap: 10px; }
  .noteq { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
           font-size: 20px; line-height: 1.05; letter-spacing: .005em; }
  .noterow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .noterow .mono { font-size: 11px; font-weight: 700; color: var(--muted-soft); }
  .noterow .mono.tight { color: var(--clay-deep); }
  .notebox .btn[disabled] { opacity: .4; }

  .rcday { display: flex; align-items: baseline; justify-content: space-between;
           padding: 16px 20px 8px; font-family: 'Barlow Condensed', sans-serif;
           font-weight: 900; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
  .rcday .mono { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--muted-soft); }
  .rcline { padding: 12px 20px; border-bottom: 1px solid var(--rule);
            display: flex; flex-direction: column; gap: 5px;
            animation: riseIn .34s cubic-bezier(.16,1,.3,1) both; }
  .rcline.me { background: var(--accent-100); }
  .rcline.coach { border-left: 4px solid var(--clay-deep); }
  .rc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .rc-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
             font-size: 16px; line-height: 1; }
  .rc-meta { flex: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 9px; font-weight: 700; letter-spacing: .07em; color: var(--muted-soft); }
  .rcline.coach .rc-meta { color: var(--clay-deep); }
  .rc-say { font-size: 14px; line-height: 1.45; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .rcline { animation: none; } }

  /* ── The backfill day strip ──────────────────────────────────────────────
     Four days, today first. Each carries its own completion so you can see at
     a glance which one you forgot — the whole reason the strip exists. */
  .daystrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
              gap: 6px; padding: 14px 20px 0; }
  .daychip { display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
             border: 2px solid var(--divider); padding: 8px 8px 7px; background: none;
             color: var(--ink); text-align: left; min-width: 0; }
  .daychip .dl { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
                 font-size: 12px; letter-spacing: .05em; line-height: 1;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .daychip .dp { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                 font-size: 9px; font-weight: 700; color: var(--muted-soft); line-height: 1; }
  .daychip .dbar { display: block; width: 100%; height: 3px; background: var(--divider); }
  .daychip .dbar > span { display: block; height: 100%; background: var(--muted-soft); }
  .daychip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .daychip.on .dp { color: rgba(255,255,255,.7); }
  .daychip.on .dbar { background: rgba(255,255,255,.25); }
  .daychip.on .dbar > span { background: var(--bg); }
  .daychip.full .dbar > span { background: var(--accent); }
  .daychip.on.full .dbar > span { background: var(--bg); }

  /* Editing a day that is not today is a state you must never be in by
     accident, so it is announced in clay rather than implied by a highlight. */
  .backfill { display: flex; align-items: center; justify-content: space-between; gap: 12px;
              margin: 12px 20px 0; padding: 12px 14px; background: var(--clay-deep); color: var(--on-clay); }
  .backfill .eyebrow { color: var(--on-clay); opacity: .72; }
  .backfill .bf-day { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
                      font-size: 19px; line-height: 1; text-transform: capitalize; }
  .backfill button { flex: none; border: 2px solid currentColor; background: none;
                     color: var(--on-clay); padding: 7px 11px; font-family: 'Barlow Condensed', sans-serif;
                     font-weight: 900; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }

  /* ── The streak ember ────────────────────────────────────────────────────
     A streak was 9px of grey mono. It is now an object that gets hotter as the
     run gets longer — a slow breath at 5 days, a real flicker past 30 — so the
     number stops being a fact and starts being something you don't want to lose.
     Squares and opacity only; no glow, no radius. */
  @keyframes emberPulse {
    0%, 100% { opacity: .5;  transform: scale(1) }
    50%      { opacity: 1;   transform: scale(1.35) }
  }
  @keyframes emberFlicker {
    0%, 100% { opacity: 1;  transform: scale(1.25) }
    18%      { opacity: .45; transform: scale(.85) }
    34%      { opacity: 1;  transform: scale(1.4) }
    52%      { opacity: .7; transform: scale(1.05) }
    68%      { opacity: 1;  transform: scale(1.32) }
    84%      { opacity: .6; transform: scale(.95) }
  }
  .ember { position: relative; padding-left: 9px; margin-left: 7px; }
  .ember::before {
    content: ''; position: absolute; left: 0; top: 50%;
    width: 5px; height: 5px; margin-top: -2.5px;
    background: var(--muted-soft);
  }
  .ember[data-lvl="1"], .ember[data-lvl="2"], .ember[data-lvl="3"] { color: var(--clay-deep); }
  .ember[data-lvl="1"]::before,
  .ember[data-lvl="2"]::before,
  .ember[data-lvl="3"]::before { background: var(--clay); }
  .ember[data-lvl="3"] { font-weight: 700; }
  /* ONLY THE LONGEST RUN MOVES. Every streak used to animate, so a consistent
     athlete opened Today to six clay dots pulsing at once — the effect was
     designed for one. `.lead` marks the best current run on the screen; the
     rest keep the colour and the weight, and hold still. */
  .ember.lead[data-lvl="1"]::before { animation: emberPulse 2.8s ease-in-out infinite; }
  .ember.lead[data-lvl="2"]::before { animation: emberPulse 1.5s ease-in-out infinite; }
  .ember.lead[data-lvl="3"]::before { animation: emberFlicker 1.9s ease-in-out infinite; }

  /* The app noticing you have stalled. Breathes the box of the most valuable
     habit still undone, ~20s after you last touched anything. */
  @keyframes idleBreathe {
    0%, 100% { transform: scale(1);    border-color: var(--box) }
    50%      { transform: scale(1.14); border-color: var(--clay) }
  }
  .boxmark.nudge { animation: idleBreathe 2.6s ease-in-out infinite; }

  /* A day that is about to break a real streak. The coach's card goes darker,
     and the day bar stops being green about it. */
  .coachcard.risk { background: var(--clay-deep); }
  .coachcard.risk .cta { color: var(--clay-deep); }
  .bar.risk > span { background: var(--clay); }
  /* The nudge types itself on first paint — it is the coach talking, not a label. */
  /* Zero-width on purpose: the caret is drawn by a positioned ::before so it
     takes no space in the line, and the text never reflows as it types. */
  .caret { display: inline-block; width: 0; height: .92em; vertical-align: -.1em; position: relative; }
  .caret::before {
    content: ''; position: absolute; left: 1px; top: 0; width: .46em; height: 100%;
    background: #FAF7F2; animation: caretBlink .7s steps(1) infinite;
  }
  @keyframes caretBlink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }

  /* Leaderboard rows arrive in order, each with its share of the leader's score. */
  .brow { animation: riseIn .34s cubic-bezier(.16,1,.3,1) both; }
  /* Movement, not just standing. Green for climbing, muted for slipping — a drop
     is information, not a punishment, so it never gets the accent. */
  .delta { font-size: 9px; font-weight: 700; letter-spacing: .04em; line-height: 1; }
  .delta.up { color: var(--accent); }
  .delta.down { color: var(--muted-soft); }
  .passline {
    background: var(--accent); color: var(--bg); padding: 11px 20px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px;
    line-height: 1.2; text-transform: uppercase; letter-spacing: .01em;
    animation: riseIn .3s cubic-bezier(.16,1,.3,1);
  }

  /* ── Rank insignia ── */
  .rankart { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
  /* The rank label on a level hero is a door to the ladder, so it looks like one. */
  .ranklink { display: flex; align-items: center; gap: 8px; text-align: left; color: inherit; }
  .ranklink .go { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: var(--clay-deep); }
  /* One row per rank on the ladder screen. */
  .rankrow { display: flex; gap: 14px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  .rankrow .badge {
    width: 46px; height: 46px; flex: none; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--rule); color: var(--muted-soft);
  }
  .rankrow.passed .badge { border-color: var(--accent); color: var(--accent); }
  .rankrow.here { background: var(--accent); color: var(--bg); }
  .rankrow.here .badge { border-color: var(--bg); color: var(--bg); }
  .rankrow.locked { opacity: .5; }
  .rankrow .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px; line-height: 1; text-transform: uppercase; }
  .rankrow .meta { font-size: 11px; line-height: 1.3; color: var(--muted); }
  .rankrow.here .meta { color: rgba(250,247,242,.8); }
  .rankrow .tag { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: .1em; white-space: nowrap; }
  /* Five sub-level ticks per rank. */
  .subs { display: flex; gap: 3px; }
  .subs i { width: 8px; height: 8px; border: 1.5px solid var(--box); display: block; }
  .subs i.on { background: var(--accent); border-color: var(--accent); }
  .rankrow.here .subs i { border-color: rgba(250,247,242,.7); }
  .rankrow.here .subs i.on { background: var(--bg); border-color: var(--bg); }

  /* Consistency pip ladder */
  .pips { display: flex; gap: 4px; }
  .pips i { width: 13px; height: 13px; border: 1.5px solid var(--box); display: block; }
  .pips i.on { background: var(--accent); border-color: var(--accent); }
</style>

function questProgress(q, run) {
  const start = parseKey(run.start);
  const parts = String(q.kind || '').split(':');
  const kind = parts[0], hid = parts[1];
  const h = hid ? habitById(hid) : null;
  let have = 0, doneDay = null;
  for (let i = 0; i < QUEST_RUN_DAYS; i++) {
    const k = fmtKey(addDays(start, i));

    // Season-bounded like everything else that pays: a run straddling the season
    // opening must not count the days before it, or the server (which never sees
    // them) would score the same quest differently.
    if (!inSeason(k)) continue;
    if (kind === 'daysHit') { if (h && isDone(h, k)) have++; }
    else if (kind === 'total') { have += valOf(k, hid); }
    else if (kind === 'qualify') { if (dayQualifies(k)) have++; }
    else if (kind === 'perfect') { if (isPerfect(k)) have++; }
    if (!doneDay && have >= q.need) doneDay = k;
  }

           pct: Math.max(0, Math.min(100, Math.round(have / q.need * 100))) };

// Stable within a day, different the next: the same situation gives the same line

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 2147483647;
  return h;
}
function pickLine(bucket, seedKey, tokens) {
  const arr = NUDGES[bucket] || NUDGES.empty;
  let line = arr[hashStr(TKEY() + '|' + seedKey) % arr.length];
  Object.keys(tokens || {}).forEach(k => {
    line = line.split('{' + k + '}').join(String(tokens[k]));
  });
  // Counts are substituted into fixed prose, so a streak of one produced
  // "1 days on the board". Fixed once here rather than in forty separate lines.
  return line.replace(/\b1 (days|habits|glasses|sessions|nights|more)\b/g,
    (m, w) => '1 ' + ({ days:'day', habits:'habit', glasses:'glass',

  const on = {}; HABITS.forEach(h => on[h.id] = true);
  return { v:3, on, custom:[], onboarded:false, dark:false, seen:null, rulesSig:null,
           seenTiers:null, seenAch:null, seenPerfect:null, seenQuests:null,
           questPool:null, questRuns:null, sound:false, lbSeen:null,
           onBoard:false, boardName:null, notes:null, updatedAt:0 };
}

// ── Dates ─────────────────────────────────────────────────────────────────
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const TKEY = () => fmtKey(today());
function parseKey(k) { return new Date(k + 'T00:00:00'); }

// ── The backfill window ───────────────────────────────────────────────────
// Nobody remembers to log on the day, every day. You can fill in or correct
// the last few days; past that the log closes. The limit is the point — a
// record you can rewrite whenever you like is a diary, not evidence.
//
// UI.day is the day being EDITED (null = today). Everything else in the app —
// streaks, nudges, the perfect-day celebration — stays anchored to the real
// today, because those are statements about now, not about the day you happen
// to be filling in. AKEY() self-heals: leave the app open past midnight on
// "3 days ago" and the window slides out from under it, so it falls back to
// today rather than writing to a day that has since closed.
const BACKFILL_DAYS = 3;                                 // today plus this many days back
function oldestLoggable() { return fmtKey(addDays(today(), -BACKFILL_DAYS)); }
function canLog(dayKey) { return !!dayKey && dayKey <= TKEY() && dayKey >= oldestLoggable(); }
const AKEY = () => (canLog(UI.day) ? UI.day : TKEY());   // the day being edited
function editingPast() { return AKEY() !== TKEY(); }
function editableDays() {
  const out = [];
  for (let i = 0; i <= BACKFILL_DAYS; i++) out.push(fmtKey(addDays(today(), -i)));
  return out;
}
function dayShort(k) {
  return k === TKEY() ? 'TODAY' : parseKey(k).toLocaleDateString('en-GB', { weekday:'short' }).toUpperCase();
}
function dayLong(k) {
  if (k === TKEY()) return 'today';
  if (k === fmtKey(addDays(today(), -1))) return 'yesterday';
  return parseKey(k).toLocaleDateString('en-GB', { weekday:'long' });
}
// Appended to the toast when the tap did not land on today, so a mis-tap on the
// day strip announces itself instead of quietly filing Tuesday under Saturday.
function dayTag() { return editingPast() ? ' for ' + dayLong(AKEY()) : ''; }
function setDay(k) {
  UI.day = (k === TKEY() ? null : k);
  haptic('tick');
  render();
}

// ── Habit helpers ─────────────────────────────────────────────────────────
function allHabits() {
  return HABITS.concat((CFG.custom || []).map(c => Object.assign({
    kind:'check', target:1, unit:'session', source:'Custom', code:(c.name||'??').slice(0,2).toUpperCase()
  }, c)));
}
function habitById(id) { return allHabits().find(h => h.id === id) || HABITS[0]; }
function live() { return allHabits().filter(h => CFG.on[h.id] !== false); }
function offHabits() { return allHabits().filter(h => CFG.on[h.id] === false); }
function valOf(dayKey, id) { const d = LOG[dayKey]; return (d && typeof d[id] === 'number') ? d[id] : 0; }
function isDone(h, dayKey) { return valOf(dayKey || TKEY(), h.id) >= h.target; }
function fmtVal(h, v) { return h.dec ? Number(v).toFixed(h.dec) : Math.round(v).toLocaleString(); }

// ── Persistence ───────────────────────────────────────────────────────────
function loadLocal() {
  CFG = defaultCfg();
  try {
    const raw = JSON.parse(localStorage.getItem(K_CFG()) || '{}');
    CFG = Object.assign(CFG, raw);
    CFG.on = Object.assign(defaultCfg().on, raw.on || {});
  } catch (e) {}
  try { LOG = JSON.parse(localStorage.getItem(K_LOG()) || '{}') || {}; } catch (e) {}
  try {
    const m = JSON.parse(localStorage.getItem(K_META()) || '{}');
    SYNC.dirty = !!m.dirty; SYNC.lastOk = m.lastOk || null;
  } catch (e) {}
  migrateOld();
}
// Fold forward the two earlier shipped shapes: v1 stored 0/1 flags under a
// different habit set, and v2 carried coach/motivation settings this build no
// longer has. Runs once, then never again.
function migrateOld() {
  if (CFG.v === 3 && CFG.migrated3) return;
  const MAP = { train:'strength', mobility:'mobility', sleep:'sleep', unwind:'breathe',
                protein:'fuel', water:'water', steps:'steps', vitd:'supps', creatine:'supps', omega3:'supps' };
  let touched = false;
  Object.keys(LOG).forEach(day => {
    const src = LOG[day] || {}, out = {};
    Object.keys(src).forEach(k => {
      const v = src[k];
      if (HABITS.some(h => h.id === k) || (CFG.custom || []).some(c => c.id === k)) { out[k] = v; return; }
      const to = MAP[k];
      if (to && v === 1) { out[to] = habitById(to).target; touched = true; }
    });
    LOG[day] = out;
  });
  delete CFG.coach; delete CFG.motiv; delete CFG.goals;   // retired settings
  CFG.v = 3; CFG.migrated3 = true;
  if (touched) saveLog();
  saveCfg();
}
// Both of these drop the bonus cache: the log obviously moves it, and so does
// the config, because which habits are TRACKED decides what counts as a perfect
// day and as a three-habit day. Anything that mutates LOG or CFG without going
// through these two has to invalidate by hand — see syncFromCloud.
function saveCfg() {
  CFG.updatedAt = Date.now();
  invalidateBonus();
  try { localStorage.setItem(K_CFG(), JSON.stringify(CFG)); } catch (e) {}
  markDirty();
}
function saveLog() {
  invalidateBonus();
  try { localStorage.setItem(K_LOG(), JSON.stringify(LOG)); } catch (e) {}
  markDirty();
  refreshNotePct();
}
// ── The WORKOUT habit is fed by the training app, via the server ───────────
// These are two separate apps and neither writes into the other's storage. The
// one shared fact — "did they train that day" — comes from the server:
// program.html records every finished session to session_history, and this
// read-only RPC hands back the dates.
async function fetchWorkoutDays() {
  if (window.IS_DEMO || !ATHLETE_ID) return [];
  try {
    const sb = _sb();
    if (!sb) return [];
    // Never reach back before the season started — a new athlete (or a new
    // season) must not have months of past sessions backfilled into their score.
    const since = seasonStart();
    const { data, error } = await sb.rpc('get_workout_days', {
      p_athlete_id: ATHLETE_ID, p_key: KEY, p_since: since
    });
    if (error || !Array.isArray(data)) return [];
    return data.map(d => String(d).slice(0, 10));
  } catch (e) { return []; }   // offline, or the migration is not applied yet
}
// The habit is locked, so the server is simply the truth: every date it reports
// is ticked. Idempotent — no bookkeeping needed, because the athlete cannot
// untick it and disagree.
function importWorkoutDays(src) {
  if (!Array.isArray(src) || !src.length) return false;
  const h = habitById('strength');
  // Even a no-op import can add an empty day to LOG below, which moves the run
  // lengths the badge walk depends on — so drop the cache regardless of `changed`.
  invalidateBonus();
  let changed = false;
  src.forEach(d => {
    if (typeof d !== 'string') return;
    if (!LOG[d]) LOG[d] = {};
    if ((Number(LOG[d].strength) || 0) < h.target) { LOG[d].strength = h.target; changed = true; }
  });
  if (changed) saveLog();
  return changed;
}

function saveMeta() {
  try { localStorage.setItem(K_META(), JSON.stringify({ dirty: SYNC.dirty, lastOk: SYNC.lastOk })); } catch (e) {}
}

// ── Durable sync ──────────────────────────────────────────────────────────
// Contract: the athlete's phone is the record. Every change is written to
// localStorage FIRST and flagged dirty; the flag itself is persisted, so an
// app killed while offline still knows there is unsent work next launch. We
// always push the complete current snapshot, so a newer push simply supersedes
// an older one and no intermediate state can be lost or applied out of order.
// Retries run with exponential backoff and fire again on reconnect, on
// foreground, and at boot — nothing is dropped silently.
const SYNC = { dirty:false, syncing:false, lastOk:null, lastErr:null, attempts:0 };
const RETRY_MS = [5000, 15000, 45000, 120000, 300000];
let _sbClient = null, _pushTimer = null, _retryTimer = null;

function _sb() {
  if (_sbClient) return _sbClient;
  if (!window.supabase || !window.supabase.createClient) return null;
  _sbClient = window.supabase.createClient(SB_URL, SB_KEY);
  return _sbClient;
}
function markDirty() {
  if (window.IS_DEMO) return;
  SYNC.dirty = true; saveMeta();
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushNow, 1200);
}
async function pushNow() {
  if (window.IS_DEMO || !ATHLETE_ID || SYNC.syncing || !SYNC.dirty) return SYNC.dirty === false;
  if (navigator.onLine === false) { scheduleRetry(); return false; }
  SYNC.syncing = true; refreshSyncBadge();
  let okay = false;
  try {
    const sb = _sb();
    if (!sb) throw new Error('Supabase not loaded');
    const payload = {};
    payload[K_CFG()] = localStorage.getItem(K_CFG()) || '{}';
    payload[K_LOG()] = localStorage.getItem(K_LOG()) || '{}';
    const { error } = await sb.rpc('save_progress', {
      p_athlete_id: ATHLETE_ID, p_athlete_name: ATHLETE_NAME, p_data: payload, p_key: KEY
    });
    if (error) throw new Error(error.message || 'save rejected');
    SYNC.dirty = false; SYNC.attempts = 0; SYNC.lastErr = null; SYNC.lastOk = Date.now();
    clearTimeout(_retryTimer);
    okay = true;
  } catch (e) {
    SYNC.lastErr = String((e && e.message) || e);
    SYNC.attempts++;
    scheduleRetry();
  }
  SYNC.syncing = false;
  saveMeta();
  refreshSyncBadge();
  return okay;
}
function scheduleRetry() {
  clearTimeout(_retryTimer);
  if (!SYNC.dirty || window.IS_DEMO) return;
  const delay = RETRY_MS[Math.min(SYNC.attempts, RETRY_MS.length - 1)];
  _retryTimer = setTimeout(pushNow, delay);
}
function syncLabel() {
  if (window.IS_DEMO) return 'DEMO — THIS DEVICE ONLY';
  if (SYNC.syncing) return 'SAVING…';
  if (SYNC.dirty) return navigator.onLine === false ? 'OFFLINE — SAVED ON THIS PHONE' : 'WAITING TO SYNC';
  return SYNC.lastOk ? 'SYNCED ' + agoLabel(SYNC.lastOk) : 'SAVED ON THIS PHONE';
}
function agoLabel(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return 'JUST NOW';
  const m = Math.round(s / 60);
  if (m < 60) return m + ' MIN AGO';
  const h = Math.round(m / 60);
  return h < 24 ? h + 'H AGO' : Math.round(h / 24) + 'D AGO';
}
// Patch the badge in place rather than re-rendering: a full render would steal
// focus from the add-habit field mid-typing.
function refreshSyncBadge() {
  document.querySelectorAll('[data-sync]').forEach(el => { el.textContent = syncLabel(); });
}

async function syncFromCloud() {
  if (window.IS_DEMO || !ATHLETE_ID) return;
  for (let i = 0; i < 30 && !(window.supabase && window.supabase.createClient); i++) await new Promise(r => setTimeout(r, 100));
  try {
    const sb = _sb();
    if (!sb) return;
    const { data, error } = await sb.rpc('get_progress', { p_athlete_id: ATHLETE_ID, p_key: KEY });
    if (error || !data || typeof data !== 'object') return;
    // Log merge: union of days, and per habit the LARGER logged value wins —
    // so a stale device can never erase a real number recorded elsewhere.
    try {
      const cloudLog = JSON.parse(data[K_LOG()] || '{}') || {};
      Object.keys(cloudLog).forEach(day => {
        const mine = LOG[day] || {}, theirs = cloudLog[day] || {}, out = Object.assign({}, mine);
        Object.keys(theirs).forEach(id => { out[id] = Math.max(Number(theirs[id]) || 0, Number(mine[id]) || 0); });
        LOG[day] = out;
      });
      localStorage.setItem(K_LOG(), JSON.stringify(LOG));
    } catch (e) {}
    // Config: newest wins wholesale, but never clobber unsent local settings.
    try {
      const cloudCfg = JSON.parse(data[K_CFG()] || '{}');
      if (cloudCfg && !SYNC.dirty && (cloudCfg.updatedAt || 0) > (CFG.updatedAt || 0)) {
        const keepSeen = CFG.seen, keepSig = CFG.rulesSig;
        const keepTiers = CFG.seenTiers, keepAch = CFG.seenAch, keepPerfect = CFG.seenPerfect;
        const keepQuests = CFG.seenQuests;
        CFG = Object.assign(defaultCfg(), cloudCfg);
        CFG.on = Object.assign(defaultCfg().on, cloudCfg.on || {});
        if (!CFG.seen) CFG.seen = keepSeen;
        if (!CFG.rulesSig) CFG.rulesSig = keepSig;
        // Same reasoning as `seen`: a cloud row written before this build has no
        // unlock baseline, and inheriting nothing would replay every badge the
        // athlete already owns as a fresh takeover.
        if (!CFG.seenTiers) CFG.seenTiers = keepTiers;
        if (!Array.isArray(CFG.seenAch)) CFG.seenAch = keepAch;
        if (!CFG.seenPerfect) CFG.seenPerfect = keepPerfect;
        if (!Array.isArray(CFG.seenQuests)) CFG.seenQuests = keepQuests;
        localStorage.setItem(K_CFG(), JSON.stringify(CFG));
      }
    } catch (e) {}
    // Both merges above write straight to LOG/CFG and localStorage without going
    // through saveLog/saveCfg, so the bonus cache has to be dropped by hand.
    invalidateBonus();
    migrateOld();
  } catch (e) { /* offline — the phone still holds everything */ }
}

// ── Derived stats, all from real history ──────────────────────────────────
function loggedDays() { return Object.keys(LOG).sort(); }
function dayPct(dayKey) {
  const hs = live(); if (!hs.length) return 0;
  return Math.round(hs.filter(h => isDone(h, dayKey)).length / hs.length * 100);
}
function isPerfect(dayKey) { const hs = live(); return hs.length > 0 && hs.every(h => isDone(h, dayKey)); }
function dayQualifies(dayKey) { return dayPct(dayKey) >= XP_RULES.streakQualifyPct; }
function currentDayStreak() {
  let d = dayQualifies(TKEY()) ? today() : addDays(today(), -1), n = 0;
  while (dayQualifies(fmtKey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function runLength(days) {
  let best = 0, run = 0, prev = null;
  days.forEach(k => {
    run = (prev && fmtKey(addDays(parseKey(prev), 1)) === k) ? run + 1 : 1;
    best = Math.max(best, run); prev = k;
  });
  return best;
}
function bestDayStreak() { return Math.max(runLength(loggedDays().filter(dayQualifies)), currentDayStreak()); }
function habitStreak(h) {
  let d = isDone(h, TKEY()) ? today() : addDays(today(), -1), n = 0;
  while (isDone(h, fmtKey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function habitBest(h) { return Math.max(runLength(loggedDays().filter(k => isDone(h, k))), habitStreak(h)); }
function habitWeek(h) { let n = 0; for (let i = 0; i < 7; i++) if (isDone(h, fmtKey(addDays(today(), -i)))) n++; return n; }
function habitRate35(h) { let n = 0; for (let i = 0; i < 35; i++) if (isDone(h, fmtKey(addDays(today(), -i)))) n++; return Math.round(n / 35 * 100); }

// ── XP ────────────────────────────────────────────────────────────────────
function baseXp(h) {
  const w = XP_RULES.weights[h.id];
  return typeof w === 'number' ? w : XP_RULES.customXp;
}
// Pro-rata while part way, with a bonus once the target is actually met — so a
// near-miss still pays, but finishing pays more.
function xpFor(h, v) {
  if (v <= 0) return 0;
  const base = baseXp(h);
  return Math.round(v >= h.target ? base * XP_RULES.completionBonus : base * (v / h.target));
}
// ── Seasons ───────────────────────────────────────────────────────────────
// Scores run in seasons, like ranked play. Days before the season started stay
// in the athlete's history — visible in the grid, still counting toward streaks
// and consistency badges — but they earn no XP. Starting a new season is
// therefore a clean scoreboard reset that deletes nothing.
function seasonStart() { return (CFG.season && CFG.season.startsOn) || XP_RULES.seasonStart; }
function seasonName()  { return (CFG.season && CFG.season.name)     || XP_RULES.seasonName; }
function inSeason(dayKey) { return dayKey >= seasonStart(); }   // ISO dates compare as strings
function seasonDays() { return loggedDays().filter(inSeason); }
async function fetchSeason() {
  if (window.IS_DEMO || !ATHLETE_ID) return;
  try {
    const sb = _sb();
    if (!sb) return;
    const { data, error } = await sb.rpc('get_season', { p_athlete_id: ATHLETE_ID, p_key: KEY });
    const row = Array.isArray(data) ? data[0] : data;
    if (error || !row || !row.starts_on) return;   // offline / not deployed → keep the cached one
    const next = { name: row.name || 'Season', startsOn: String(row.starts_on).slice(0, 10) };
    const cur = CFG.season || {};
    if (cur.startsOn !== next.startsOn || cur.name !== next.name) {
      CFG.season = next;
      saveCfg();
    }
  } catch (e) { /* keep whatever we last cached */ }
}

// The quest pool lives on the server so the board and the app score the same
// week. Cached in CFG, exactly like the season, so a phone with no signal keeps
// working off whatever it last saw (and the built-in pool before that).
async function fetchQuests() {
  if (window.IS_DEMO || !ATHLETE_ID) return;
  try {
    const sb = _sb();
    if (!sb) return;
    const { data, error } = await sb.rpc('get_quests', { p_athlete_id: ATHLETE_ID, p_key: KEY });
    const row = Array.isArray(data) ? data[0] : data;
    if (error || !row) return;                   // offline / not deployed → keep the cache
    const pool = row.pool, runs = row.runs;
    let changed = false;
    if (Array.isArray(pool) && JSON.stringify(pool) !== JSON.stringify(CFG.questPool)) { CFG.questPool = pool; changed = true; }
    if (Array.isArray(runs) && JSON.stringify(runs) !== JSON.stringify(CFG.questRuns)) { CFG.questRuns = runs; changed = true; }
    if (changed) { invalidateBonus(); saveCfg(); }
  } catch (e) { /* keep whatever we last cached */ }
}

// A habit's own XP pool for the CURRENT SEASON. Counted even when the habit is
// currently switched off — XP you earned is never taken back mid-season.
function habitXp(h) { return seasonDays().reduce((s, k) => s + xpFor(h, valOf(k, h.id)), 0); }
// ── What the badges pay ───────────────────────────────────────────────────
// Consistency tiers and milestones are worth real points, and each is paid ON
// THE DAY IT WAS CROSSED. Dating them is the whole trick: a bonus is then just
// an ordinary dated amount, so the season window and both leaderboard windows
// filter it with no special cases, and XP stays a pure function of the log —
// nothing new is stored, exactly as before.
//
// Bonuses land on the OVERALL ladder only, never on a habit's own. A habit's
// level has to stay a pure count of how often it was done (see XP_SYSTEM.md §2),
// and paying its ladder for its own streak would quietly break that.
function tierXp(h, i) {
  const t = CONSISTENCY_TIERS[i];
  if (!t) return 0;
  return Math.max(10, Math.round(baseXp(h) * XP_RULES.completionBonus * t.mult / 10) * 10);
}
// Recomputing this on every level read would be thousands of operations per
// render, so it is cached and dropped whenever the log or the tracked set moves.
let _bonusCache = null;
function invalidateBonus() { _bonusCache = null; }
// Runs and counts are measured FROM THE SEASON START, not from all of history.
// That is a fairness rule, not an implementation detail: a tier crosses once, so
// scoring it against all-time runs would mean an athlete whose streak began
// before the season could never earn tier points again, while someone who joined
// yesterday could earn every one of them. The season resets the run for PAYMENT;
// the badge itself is judged on the best run ever and is never given back.
function bonusEvents() {
  if (_bonusCache) return _bonusCache;
  const days = seasonDays(), out = [];
  if (!days.length) { _bonusCache = out; return out; }
  const hs = allHabits();

  // Tiers — one ordered pass per habit, watching the run length.
  hs.forEach(h => {
    let run = 0, prev = null, next = 0;
    days.forEach(k => {
      if (!isDone(h, k)) { run = 0; return; }
      run = (prev && fmtKey(addDays(parseKey(prev), 1)) === k) ? run + 1 : 1;
      prev = k;
      while (next < CONSISTENCY_TIERS.length && run >= CONSISTENCY_TIERS[next].days) {
        out.push({ day: k, xp: tierXp(h, next), kind: 'tier', id: h.id, tier: next });
        next++;
      }
    });
  });

  // Milestones — one ordered pass maintaining every counter at once, recording
  // the day each measure first reaches its target.
  const streak = {}, lastDone = {}, hits = {}, claimed = {};
  let with3 = 0, perfect = 0;
  days.forEach(k => {
    hs.forEach(h => {
      if (!isDone(h, k)) { streak[h.id] = 0; return; }
      streak[h.id] = (lastDone[h.id] && fmtKey(addDays(parseKey(lastDone[h.id]), 1)) === k) ? (streak[h.id] || 0) + 1 : 1;
      lastDone[h.id] = k;
      hits[h.id] = (hits[h.id] || 0) + 1;
    });
    if (live().filter(h => isDone(h, k)).length >= 3) with3++;
    if (isPerfect(k)) perfect++;
    ACHIEVEMENTS.forEach(a => {
      if (claimed[a.code]) return;
      let have = 0;
      if (a.measure === 'perfectDays') have = perfect;
      else if (a.measure === 'daysWith3') have = with3;
      else {
        const p = a.measure.split(':');
        if (p[0] === 'streak') have = streak[p[1]] || 0;
        else if (p[0] === 'daysHit') have = hits[p[1]] || 0;
      }
      if (have < a.need) return;
      claimed[a.code] = true;
      out.push({ day: k, xp: a.xp, kind: 'milestone', id: a.code });
    });
  });

  // Weekly quests pay the same way: dated, so windows filter them for free.
  questEvents().forEach(e => out.push(e));

  _bonusCache = out;
  return out;
}
// Every event is already inside the season by construction, so these only have
// to window it.
function bonusXp() { return bonusEvents().reduce((s, e) => s + e.xp, 0); }
// What a specific badge ACTUALLY paid, read off the same ledger everything else
// is scored from. A badge is judged on the athlete's best run ever, but it is
// only PAID when that run falls inside the season (XP_SYSTEM.md §4.5) — so the
// two legitimately disagree, and anything quoting a payout has to ask the ledger
// rather than read the figure off CONSISTENCY_TIERS or ACHIEVEMENTS.
function tierPaid(h, tierIndex) {
  return bonusEvents().reduce((s, e) =>
    (e.kind === 'tier' && e.id === h.id && e.tier === tierIndex) ? s + e.xp : s, 0);
}
function milestonePaid(code) {
  return bonusEvents().reduce((s, e) => (e.kind === 'milestone' && e.id === code) ? s + e.xp : s, 0);
}
function bonusXpBetween(fromDate, toDate) {
  return bonusEvents().reduce((s, e) => {
    const d = parseKey(e.day);
    return (d < fromDate || d > toDate) ? s : s + e.xp;
  }, 0);
}
function overallXp() { return allHabits().reduce((s, h) => s + habitXp(h), 0) + bonusXp(); }
// What a single day actually paid, badges included — the perfect-day takeover
// quotes it, so it has to match what the athlete's total just moved by.
function dayXp(dayKey) {
  if (!inSeason(dayKey)) return 0;
  const d = parseKey(dayKey);
  return allHabits().reduce((s, h) => s + xpFor(h, valOf(dayKey, h.id)), 0) + bonusXpBetween(d, d);
}
// Habit ladders reuse the curve, scaled to that habit's daily value, so every
// habit levels at the same RATE — which is what makes your level in a habit
// track how often you actually do it.
function baseFor(h) { return h ? Math.max(10, Math.round(baseXp(h) * XP_RULES.completionBonus)) : XP_RULES.base; }

    pct: Math.max(0, Math.min(100, Math.round(into / cost * 100))),

    allHabits().forEach(h => { sum += xpFor(h, valOf(k, h.id)); });
  });

// ── Consistency ladders ───────────────────────────────────────────────────
// Tier is earned on the BEST run ever, so a broken streak never revokes a badge.

  return { best, cur, tier, next: CONSISTENCY_TIERS[tier] || null, total: CONSISTENCY_TIERS.length };
}

  const parts = a.measure.split(':'), kind = parts[0], h = habitById(parts[1]);

}

// How hot a streak reads: 0 none · 1 warm from 5 days · 2 burning from 15 · 3 from 30.
function emberLevel(st) { return st >= 30 ? 3 : st >= 15 ? 2 : st >= 5 ? 1 : 0; }

// ── The app noticing you have stalled ─────────────────────────────────────
// Twenty seconds after the last tap, the most valuable habit still undone starts

// locked habit the athlete cannot action from here.
let _idleTimer = null;

  clearTimeout(_idleTimer);

    if (UI.screen !== 'today' || UI.celebrate.length || UI.sheet || reduced()) return;
    const cand = live().filter(h => !isDone(h) && !h.locked)
                       .sort((a, b) => baseXp(b) - baseXp(a))[0];
    if (!cand) return;

// A day that is about to break a streak the athlete actually has. Late enough to

function atRisk() {

}
// How many more habits would rescue the day.
function shortOfQualifying() {
  const hs = live();

  return Math.max(1, need - hs.filter(h => isDone(h)).length);

// ── The nudge (one a day, driven by what is actually missing) ─────────────
// Every nudge carries a `key` describing the SITUATION rather than the sentence.
// The typing card keys off that, so logging another glass of water updates the
// number in place instead of retyping the whole line from scratch.
function nudge() {
  const hs = live(), missing = hs.filter(h => !isDone(h));

  // Loss beats gain: a real streak on the line tonight outranks everything.
  if (atRisk()) {
    const st = currentDayStreak(), short = shortOfQualifying();
    const t = missing.filter(h => !h.locked).sort((a, b) => baseXp(b) - baseXp(a))[0];
    return { risk: true, key: 'risk',
             line: pickLine('risk', 'risk', { st: st, n: short }),
             cta: t ? 'SAVE IT · ' + t.name : 'SEE THE RECAP',
             target: t ? t.id : null };
  }

  // Everything done — the only nudge with nothing to ask for.
  if (!missing.length) {
    return { key: 'done', line: pickLine('allDone', 'done'), cta: 'SEE THE RECAP', target: null };
  }

  // Nothing logged at all yet: point at the cheapest win rather than the biggest.
  const doneCount = hs.length - missing.length;
  if (doneCount === 0) {
    const easy = missing.filter(h => !h.locked).sort((a, b) => baseXp(a) - baseXp(b))[0] || missing[0];
    return { key: 'empty', line: pickLine('empty', 'empty'),
             cta: 'START WITH ' + easy.name, target: easy.id };
  }

  // Down to one. Name it — being specific is what makes it land.
  if (missing.length === 1) {
    const only = missing[0];
    return { key: 'last:' + only.id,
             line: pickLine('lastOne', 'last:' + only.id, { name: only.name.toLowerCase() }),
             cta: only.locked ? 'OPEN YOUR PROGRAMME' : 'FINISH ' + only.name,
             target: only.locked ? null : only.id };
  }

  // A run going well and today already qualifies: say so instead of inventing a
  // complaint. The coach notices both directions.
  const st = currentDayStreak();
  if (st >= 5 && dayQualifies(TKEY())) {
    return { key: 'rolling', line: pickLine('rolling', 'rolling', { st: st }),
             cta: 'SEE THE RECAP', target: null };
  }

  // Otherwise: the most valuable thing they can still action, in its own words.
  const t = missing.filter(h => !h.locked).sort((a, b) => baseXp(b) - baseXp(a))[0] || missing[0];
  const left = t.kind === 'count'
    ? Math.max(1, Math.ceil(t.target - valOf(TKEY(), t.id)))
    : 1;
  return { key: 'h:' + t.id,
           line: pickLine(NUDGES[t.id] ? t.id : 'empty', 'h:' + t.id,
                          { n: fmtVal(t, left), name: t.name.toLowerCase(), unit: t.unit }),
           cta: t.locked ? 'OPEN YOUR PROGRAMME' : 'SORT ' + t.name,
           target: t.locked ? null : t.id };
}

// ── Level-up detection ────────────────────────────────────────────────────
// Levels are derived, never stored, so instead of catching every mutation we

// against it. That covers local check-offs, a cloud sync arriving with new XP,
// and migrations alike.
function currentLevels() {
  const out = { _overall: overallLevel().lv };
  allHabits().forEach(h => { out[h.id] = habitLevel(h).lv; });
  return out;
}

function rulesSignature() {
  const src = JSON.stringify([
    XP_RULES.base, XP_RULES.growth, XP_RULES.completionBonus, XP_RULES.customXp,
    XP_RULES.weights, HABITS.map(h => [h.id, h.target]),
    // Tier days AND their multipliers, plus every milestone's cost and payout —
    // all of these now move real XP, so retuning any of them has to re-baseline
    // rather than fire a wall of celebrations nobody earned today.
    CONSISTENCY_TIERS.map(t => [t.days, t.mult]),
    ACHIEVEMENTS.map(a => [a.code, a.need, a.xp]),
    seasonStart()   // a new season resets every score, so re-baseline instead of celebrating
  ]);

  for (let i = 0; i < src.length; i++) hash = (hash * 31 + src.charCodeAt(i)) % 2147483647;

    const wasSeason = CFG.seenSeason && CFG.seenSeason !== seasonStart();
    CFG.seenSeason = seasonStart();
    seedSeenLevels();
    if (rescored) toast(wasSeason ? seasonName().toUpperCase() + ' has begun — scores start from zero.'
                                  : 'XP system updated — your levels were rescored.');
    return;

    const a = rankFor(now[id]), b = rankFor(from);
    const rankChanged = a.name !== b.name || a.star !== b.star;

    events.push({ id, overall, from, to: now[id], rankChanged,
                  name: overall ? 'OVERALL' : habitById(id).name,
                  big: overall || rankChanged });

    if (e.big) { UI.celebrate.push(e); haptic(e.rankChanged ? 'rank' : 'level'); }
    else UI.flash[e.id] = e.to;

// ── Unlock detection ──────────────────────────────────────────────────────

// milestones and a perfect day all landed in total silence — a pip quietly
// filling on a tab the athlete might not open that day. They are the biggest
// moments the system has, so now they get seen.

// them gets it recorded, not replayed at them.

    if (tiers[h.id] <= was) return;

    // the highest reached — the lower ones are implied by it.

    // not a moment.

function dismissCelebration() { UI.celebrate.shift(); haptic('tick'); render(); }

// ── Actions ───────────────────────────────────────────────────────────────

}
// The one door into the log, so the ceiling belongs here rather than on each

function capFor(h) { return (h.target || 1) * XP_RULES.dailyCap; }
function setVal(id, v) {

  saveLog();

  render();

// Navigating to a screen starts at its top; ticking a habit does not move you at

function resetScroll() {

}
function openSheet(h) { UI.sheet = h.id; UI.sheetVal = valOf(AKEY(), h.id); render(); }

// ── Leaderboard ───────────────────────────────────────────────────────────
// Opt-in only, and scored entirely server-side: the app submits no number at
// all, the RPC recomputes XP from the log already stored in athlete_progress.
// That means a tampered localStorage cannot buy a place on the board. The RPC

// /data/<id>.json and read another athlete's whole programme.
const LB = { scope:'season', view:'board', rows:[], joined:false, loading:false, error:null, loaded:false,
             nameDraft:'', deltas:{}, passed:[] };

// The board only ever showed a standing. What actually lands is MOVEMENT — that

function applyBoardDeltas() {
  const seen = (CFG.lbSeen && CFG.lbSeen[LB.scope]) || null;
  LB.deltas = {}; LB.passed = [];
  if (seen) {
    LB.rows.forEach(r => {
      const was = seen[r.display_name];

    });
    const me = LB.rows.find(r => r.is_me), myWas = me && seen[me.display_name];

        .filter(r => !r.is_me && r.pos > me.pos

// ── Roll call ─────────────────────────────────────────────────────────────
// One sentence a day, visible to everyone else on the board. Deliberately not

//
// It pays NO XP, on purpose. The moment a sentence earns points you get one
// character of gibberish every night at 23:58.
//

const NOTE_MAX = 200;

  CFG.notes = next;

async function postNote(body) {

// ── Render helpers ────────────────────────────────────────────────────────

//     the bottom of Today threw the athlete back up to the level hero;
//   · every `transition: width` was dead code, because the bar it animated was
//     a brand new element born at its final width — bars snapped, always;

//     when the toast cleared, which reads as a flicker rather than a reaction.

let _mounted = false;

  _handlers = {};

  } else {
    const next = document.createElement('div');

// ── Numbers that count ────────────────────────────────────────────────────

// ── The nudge types itself ────────────────────────────────────────────────
// The clay card is the coach talking, so it arrives one character at a time. The
// element is `data-static` (the renderer must not fight the typer for its text)
// and keyed by the LINE, so a new nudge replaces the node and retypes while an
// unchanged one is left alone. The caret is a child element rather than a class,
// because attributes on a static node are still patched from the template.
