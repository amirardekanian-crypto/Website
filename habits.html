// ── The shareable rank card ───────────────────────────────────────────────
// 1080×1080, drawn on a canvas so it can be shared straight out of the app. The
// insignia is the SAME path data the app draws, run through Path2D — one source
// of truth, so a rank can never look different on the card than it does in here.
// Brand rules apply: ink ground, grape glow, gold for the earned things,
// Outfit type, round caps — the same MEADOW the app wears.
const CARD = { ink:'#17142B', card:'#231F35', paper:'#F6F4FF', gold:'#F2B23C', grape:'#6C5CE7', teal:'#35D0BA', orange:'#FF8A5B' };
// The five card grounds, painted rather than imported so the export needs no
// assets and stays offline-safe. Every one of them is green, clay, paper or
// near-black — a card treatment is a change of structure, not of palette.
function paintCardGround(x, S, id) {
  const grid = (alpha, n) => {
    x.strokeStyle = 'rgba(246,244,255,' + alpha + ')'; x.lineWidth = 2;
    for (let i = 1; i < n; i++) {
      x.beginPath(); x.moveTo(i * S / n, 0); x.lineTo(i * S / n, S); x.stroke();
      x.beginPath(); x.moveTo(0, i * S / n); x.lineTo(S, i * S / n); x.stroke();
    }
  };
  if (id === 'c_paper') {
    const g = x.createLinearGradient(0, 0, 0, S);
    g.addColorStop(0, '#6C5CE7'); g.addColorStop(1, '#4B3FBF');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
    grid(0.07, 9);
    return;
  }
  if (id === 'c_blueprint') {
    x.fillStyle = '#5A4BD4'; x.fillRect(0, 0, S, S);
    grid(0.22, 27);
    return;
  }
  // The three dark grounds share the ink base.
  x.fillStyle = CARD.ink; x.fillRect(0, 0, S, S);
  if (id === 'c_ember') {
    const g = x.createRadialGradient(S * 0.15, S, 0, S * 0.15, S, S * 1.15);
    g.addColorStop(0, 'rgba(255,138,91,0.9)');
    g.addColorStop(0.35, 'rgba(199,78,40,0.55)');
    g.addColorStop(0.75, 'rgba(23,20,43,0)');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
    grid(0.045, 9);
    return;
  }
  if (id === 'c_flare') {
    // The celebration's ray burst, held still — grape and orange wedges.
    x.save(); x.translate(S / 2, S * 0.33);
    for (let i = 0; i < 14; i++) {
      x.fillStyle = i % 2 ? 'rgba(255,138,91,0.5)' : 'rgba(108,92,231,0.55)';
      x.beginPath(); x.moveTo(0, 0);
      const a = (i / 14) * Math.PI * 2, w = 0.032;
      x.arc(0, 0, S * 1.2, a - w, a + w);
      x.closePath(); x.fill();
    }
    x.restore();
    // Ink veil over the reading half so type survives the burst.
    const veil = x.createLinearGradient(0, S * 0.34, 0, S);
    veil.addColorStop(0, 'rgba(23,20,43,0)');
    veil.addColorStop(0.4, 'rgba(23,20,43,0.82)');
    veil.addColorStop(1, 'rgba(23,20,43,0.96)');
    x.fillStyle = veil; x.fillRect(0, 0, S, S);
    return;
  }
  // NIGHTFALL — the grape glow ground the whole system leans on.
  const g = x.createRadialGradient(S / 2, 0, 0, S / 2, 0, S * 0.9);
  g.addColorStop(0, 'rgba(108,92,231,0.5)');
  g.addColorStop(1, 'rgba(108,92,231,0)');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  grid(0.045, 9);
}
async function buildShareCard(kind, sizeKey) {
  const dim = SHARE_SIZES[sizeKey] || SHARE_SIZES.post;
  const W = dim[0], H = dim[1];
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  try {
    if (document.fonts && document.fonts.load) {
      await Promise.all(['800 104px "Outfit"', '800 84px "Outfit"', '800 34px "Outfit"',
                         '700 27px "Outfit"', '700 22px "Outfit"', '600 33px "Outfit"',
                         '600 26px "Outfit"'].map(f => document.fonts.load(f)));
    }
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
  } catch (e) { /* system type beats no card */ }
  await loadBrandMark();

  const painter = SHARE_PAINT[kind] || SHARE_PAINT.rank;
  const footTop = H - 176;
  const area = { top: 120, bottom: footTop - 24, cx: W / 2 };
  area.cy = (area.top + area.bottom) / 2;
  const ink = painter.ground(x, W, H, area);
  painter.body(x, W, H, area);
  scFooter(x, W, H, ink !== false);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

// ── The share picker ────────────────────────────────────────────────
// Five cards × three formats. The athlete sees the real thing before they post
// it — the preview IS the export, painted by the same code.
function openShare(kind) {
  UI.share = { kind: kind || 'rank', size: 'post', busy: true };
  render();
  paintSharePreview();
}
function setShare(patch) {
  if (!UI.share) return;
  Object.assign(UI.share, patch, { busy: true });
  render();
  paintSharePreview();
}
let SHARE_URL = null;
async function paintSharePreview() {
  if (!UI.share) return;
  const want = UI.share.kind + ':' + UI.share.size;
  try {
    const blob = await buildShareCard(UI.share.kind, UI.share.size);
    if (!UI.share || UI.share.kind + ':' + UI.share.size !== want) return;   // superseded
    if (SHARE_URL) URL.revokeObjectURL(SHARE_URL);
    SHARE_URL = URL.createObjectURL(blob);
    UI.share.blob = blob;
    UI.share.busy = false;
    const img = document.getElementById('shareprev');
    if (img) { img.src = SHARE_URL; img.style.opacity = '1'; }
    const wrap = document.getElementById('sharepwrap');
    if (wrap) wrap.style.aspectRatio = SHARE_SIZES[UI.share.size][0] + ' / ' + SHARE_SIZES[UI.share.size][1];
  } catch (e) {
    UI.share.busy = false;
    toast('Could not build the card on this phone.');
  }
}
async function doShare(saveOnly) {
  if (!UI.share) return;
  const blob = UI.share.blob || await buildShareCard(UI.share.kind, UI.share.size);
  if (!blob) { toast('Could not build the card on this phone.'); return; }
  const card = SHARE_CARDS.find(s => s.id === UI.share.kind) || SHARE_CARDS[0];
  const name = 'aa-proof-' + UI.share.kind + '-' + UI.share.size + '.png';
  const LI = overallLevel();
  const text = card.caption(LI) + ' — tracked on AA Proof · amirardekani.com';
  try {
    const file = new File([blob], name, { type: 'image/png' });
    if (!saveOnly && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      await navigator.share({ files: [file], text: text });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Saved to your downloads.');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    toast('Could not share the card just now.');
  }
}

// ── Canvas kit ─────────────────────────────────────────────────────
let BRAND_MARK = null, BRAND_TRIED = false;
function loadBrandMark() {
  return new Promise(res => {
    if (BRAND_MARK || BRAND_TRIED) return res(BRAND_MARK);
    const im = new Image();
    im.onload = () => { BRAND_MARK = im; BRAND_TRIED = true; res(im); };
    im.onerror = () => { BRAND_TRIED = true; res(null); };
    im.src = 'assets/img/icon-192.png';
  });
}
function scRR(x, px, py, w, h, r) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
}
function scGrid(x, W, H, alpha, step) {
  x.strokeStyle = 'rgba(246,244,255,' + alpha + ')'; x.lineWidth = 2;
  for (let i = step; i < W; i += step) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
  for (let j = step; j < H; j += step) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
}
function scInk(x, W, H, glow) {
  x.fillStyle = CARD.ink; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W / 2, H * 0.16, 0, W / 2, H * 0.16, W * 0.95);
  g.addColorStop(0, glow || 'rgba(108,92,231,0.5)');
  g.addColorStop(1, 'rgba(108,92,231,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  scGrid(x, W, H, 0.04, 108);
}
// Deterministic sprinkle — the same card always exports the same confetti.
function scConfetti(x, W, H, top, colors) {
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 26; i++) {
    const px = rnd() * W, py = top + rnd() * (H * 0.4);
    const w = 10 + rnd() * 8, h = 16 + rnd() * 12;
    x.save(); x.translate(px, py); x.rotate(rnd() * Math.PI);
    x.globalAlpha = 0.5 + rnd() * 0.5;
    x.fillStyle = colors[i % colors.length];
    if (i % 3 === 0) { x.beginPath(); x.arc(0, 0, w / 2, 0, Math.PI * 2); x.fill(); }
    else x.fillRect(-w / 2, -h / 2, w, h);
    x.restore();
  }
  x.globalAlpha = 1;
}
function scCrest(x, cx, cy, w, rankName) {
  const key = rankMetalKey(rankName), m = METALS[key];
  const h = w * 1.12, bw = Math.max(4, w * 0.085);
  crestPath(x, cx, cy, w, h, key);
  x.fillStyle = metalFill(x, cx - w / 2, cy - h / 2, w, h, key);
  x.fill();
  crestPath(x, cx, cy, w - bw * 2, h - bw * 2, key);
  x.fillStyle = '#2B2547'; x.fill();
  x.save();
  const g = w * 0.46;
  x.translate(cx - g / 2, cy - g / 2);
  x.scale(g / 24, g / 24);
  x.strokeStyle = key === 'prisma' ? '#F6F4FF' : m.ink;
  x.lineWidth = 2; x.lineCap = 'round'; x.lineJoin = 'round';
  x.stroke(new Path2D(RANK_ART[(rankName && rankName.name) || rankName] || RANK_ART.ROOKIE));
  x.restore();
}
function scMedal(x, cx, cy, r, metalKey, tint, emoji) {
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2);
  x.fillStyle = metalFill(x, cx - r, cy - r, r * 2, r * 2, metalKey); x.fill();
  x.beginPath(); x.arc(cx, cy, r * 0.82, 0, Math.PI * 2);
  x.fillStyle = tint; x.fill();
  x.font = (r * 0.85) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(emoji, cx, cy + r * 0.04);
  x.textBaseline = 'alphabetic';
}
// The plate a title is worn on, canvas-side.
function scPlate(x, cx, y, text, metalKey) {
  x.font = '800 29px "Outfit", sans-serif';
  x.letterSpacing = '6px';
  const tw = x.measureText(text).width + 92, th = 68;
  scRR(x, cx - tw / 2, y, tw, th, th / 2);
  x.fillStyle = metalFill(x, cx - tw / 2, y, tw, th, metalKey); x.fill();
  scRR(x, cx - tw / 2 + 5, y + 5, tw - 10, th - 10, (th - 10) / 2);
  x.fillStyle = CARD.ink; x.fill();
  x.fillStyle = metalKey === 'prisma' ? '#CBC6E4' : METALS[metalKey].ink;
  x.textAlign = 'center';
  x.fillText(text, cx + 3, y + 45);
  x.letterSpacing = '0px';
  return th;
}
function scEyebrow(x, cx, y, text, colour) {
  x.textAlign = 'center';
  x.fillStyle = colour || CARD.gold;
  x.font = '700 25px "Outfit", sans-serif';
  x.letterSpacing = '9px';
  x.fillText(text, cx + 4, y);
  x.letterSpacing = '0px';
}
function scFit(x, text, max, start, min, weight) {
  let s = start;
  x.font = (weight || 800) + ' ' + s + 'px "Outfit", sans-serif';
  while (s > min && x.measureText(text).width > max) {
    s -= 4;
    x.font = (weight || 800) + ' ' + s + 'px "Outfit", sans-serif';
  }
  return s;
}
function scStats(x, W, y, stats, ink) {
  const PAD = 96;
  x.strokeStyle = ink ? 'rgba(246,244,255,0.16)' : 'rgba(35,31,53,0.12)';
  x.lineWidth = 2;
  x.beginPath(); x.moveTo(PAD, y); x.lineTo(W - PAD, y); x.stroke();
  x.textAlign = 'center';
  stats.forEach((st, i) => {
    const sx = W / (stats.length * 2) + i * (W / stats.length);
    x.fillStyle = st[2] || (ink ? CARD.paper : CARD.card);
    x.font = '800 76px "Outfit", sans-serif';
    x.fillText(st[0], sx, y + 96);
    x.fillStyle = ink ? 'rgba(246,244,255,0.5)' : 'rgba(35,31,53,0.5)';
    x.font = '700 20px "Outfit", sans-serif';
    x.letterSpacing = '4px';
    x.fillText(st[1], sx, y + 136);
    x.letterSpacing = '0px';
  });
}
// The fixed brand lockup. Every card carries it, so a stranger who has never
// heard of this app learns three things: the mark, the name, and where to go.
function scFooter(x, W, H, ink) {
  const PAD = 96, mark = 68, my = H - PAD - 34, baseline = my + 30;
  x.strokeStyle = ink ? 'rgba(246,244,255,0.12)' : 'rgba(35,31,53,0.12)';
  x.lineWidth = 2;
  x.beginPath(); x.moveTo(PAD, my - 40); x.lineTo(W - PAD, my - 40); x.stroke();
  scRR(x, PAD, my - 22, mark, mark, 20);
  if (BRAND_MARK) { x.save(); x.clip(); x.drawImage(BRAND_MARK, PAD, my - 22, mark, mark); x.restore(); }
  else {
    x.fillStyle = CARD.grape; x.fill();
    x.textAlign = 'center'; x.fillStyle = '#fff';
    x.font = '800 26px "Outfit", sans-serif';
    x.fillText('AA', PAD + mark / 2, my + 12);
  }
  x.textAlign = 'left';
  x.fillStyle = ink ? CARD.paper : CARD.card;
  x.font = '800 30px "Outfit", sans-serif';
  x.letterSpacing = '3px';
  x.fillText('AA PROOF', PAD + mark + 24, baseline - 24);
  x.letterSpacing = '0px';
  x.fillStyle = ink ? 'rgba(246,244,255,0.55)' : 'rgba(35,31,53,0.55)';
  x.font = '600 22px "Outfit", sans-serif';
  x.fillText('The habit tracker that keeps score', PAD + mark + 24, baseline + 8);
  x.textAlign = 'right';
  x.fillStyle = ink ? CARD.gold : CARD.grape;
  x.font = '700 22px "Outfit", sans-serif';
  x.letterSpacing = '2px';
  x.fillText('AMIRARDEKANI.COM', W - PAD, baseline - 8);
  x.letterSpacing = '0px';
  x.textAlign = 'left';
}
// The newest thing worth showing off: a milestone if there is one, otherwise the
// habit carrying the longest run.
function latestMedal() {
  const codes = currentAch();
  if (codes.length) {
    const a = ACHIEVEMENTS.filter(z => codes.indexOf(z.code) !== -1).slice(-1)[0];
    const part = String(a.measure || '').split(':');
    const h = part[1] ? habitById(part[1]) : null;
    return { metal: a.tier === 'rare' ? 'gold' : a.tier === 'long' ? 'silver' : 'bronze',
             tint: h ? habitHue(h)[1] : '#EFECFB',
             emoji: h ? (splitEmoji(h.name)[0] || '✨') : (MEASURE_EMOJI[part[0]] || '✨'),
             name: a.name, note: a.note, xp: a.xp,

             tierName: a.tier === 'rare' ? 'GOLD · RARE' : a.tier === 'long' ? 'SILVER · THE LONG HAUL' : 'BRONZE · A GOOD WEEK' };
  }
  const best = live().slice().sort((a, b) => habitStreak(b) - habitStreak(a))[0];
  if (!best || habitStreak(best) < 2) return null;
  const c = consistencyFor(best), st = habitStreak(best);
  return { metal: c.tier >= 4 ? 'gold' : c.tier >= 2 ? 'silver' : 'bronze',
           tint: habitHue(best)[1], emoji: splitEmoji(best.name)[0] || '✨',
           name: (c.name || 'ON A RUN'), note: st + ' days of ' + splitEmoji(best.name)[1].toLowerCase() + ' in a row',
           xp: 0, stars: Math.max(1, Math.min(3, c.tier)), tierName: 'CONSISTENCY' };
}

      const cell = (W - PAD * 2 - gap * (cols - 1)) / cols;

        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left">
          <span class="lbl" style="font-size:15px">${isFree() ? 'See about coaching' : 'Open your programme'}</span>
          <span style="font-size:11px;line-height:1.3;color:var(--muted);text-transform:none;letter-spacing:0;font-family:'Barlow',sans-serif;font-weight:400">${isFree() ? 'A programme built for you, your sport and your week' : "Today's session, your plan and the library"}</span>
        </span>
        <span class="hd" style="font-size:19px;color:var(--clay-deep)">→</span>
      </button>

      ${sectionLabel('Your data')}
      <div class="row-rule" style="padding:13px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <span class="hd" style="font-size:14px;line-height:1">Sync</span>
          <span class="mono" style="font-size:10px;letter-spacing:.08em;color:var(--muted)" data-sync>${syncLabel()}</span>
        </span>
        <button class="btn btn-secondary" style="padding:10px 14px;font-size:13px"
          ${on(async () => { if (window.IS_DEMO) { toast('Demo mode — nothing is sent.'); return; } markDirty(); await pushNow(); toast(SYNC.dirty ? 'Still offline — it is saved here and will go up on its own.' : 'Everything is up to date.'); })}>Sync now</button>
      </div>
      <div style="padding:10px 20px 4px;font-size:11px;line-height:1.5;color:var(--muted-soft)">
        Every tick is written to this phone the moment you make it, then sent up when there's a connection. Close the app, lose signal, fly somewhere — nothing is lost.
      </div>
      <!-- There is no password, no sign-in and no account screen, so the app
           never had a reason to mention any of it — and therefore never told
           anyone that the WhatsApp link IS the account. Losing it is the one
           way to lose the lot, and it is worth one sentence. -->
      <div style="padding:8px 20px 4px;font-size:11px;line-height:1.5;color:var(--muted-soft)">
        There is no password here — <strong style="color:var(--muted)">your link is your account</strong>. Put it on your home screen, or keep the message. If you lose it, ask ${isFree() ? 'Amir' : 'your coach'} for a fresh one; nothing is gone.
      </div>

      ${sectionLabel('Leaderboard')}
      <button class="selrow" ${on(() => go('crew'))}>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left">
          <span class="lbl" style="font-size:15px">${CFG.onBoard ? 'You are on the board' : 'Not on the board'}</span>
          <span style="font-size:11px;line-height:1.3;color:var(--muted);text-transform:none;letter-spacing:0;font-family:'Barlow',sans-serif;font-weight:400">
            ${CFG.onBoard ? 'Appearing as ' + esc(CFG.boardName || defaultDisplayName()) + ' · tap to rename or leave'
                          : 'Other athletes only see you if you join · tap to have a look'}
          </span>
        </span>
        <!-- An arrow, like every other row that navigates somewhere. This was a
             clay ON/OFF, which made Settings express the same yes/no idea three
             different ways on one screen — a switch, a word, and a tap-through.
             The state is already in the label and the line beneath it. -->
        <span class="hd" style="font-size:19px;color:var(--clay-deep)">→</span>
      </button>

      ${sectionLabel('Appearance')}
      <button class="selrow" ${on(() => { CFG.dark = !CFG.dark; document.body.toggleAttribute('data-dark', CFG.dark); saveCfg(); render(); })}>
        <span class="lbl" style="font-size:15px">Dark mode</span>
        <span class="sw ${CFG.dark ? 'on' : ''}"><i></i></span>
      </button>
      <button class="selrow" ${on(() => { CFG.sound = !CFG.sound; saveCfg(); render(); if (CFG.sound) haptic('done'); })}>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left">
          <span class="lbl" style="font-size:15px">Sound</span>
          <span style="font-size:11px;line-height:1.3;color:var(--muted);text-transform:none;letter-spacing:0;font-family:'Barlow',sans-serif;font-weight:400">A short blip when you tick something. Off by default.</span>
        </span>
        <span class="sw ${CFG.sound ? 'on' : ''}"><i></i></span>
      </button>

      <div data-k="tracked" data-tour="tracked">
      ${sectionLabel('The five', 'Everyone tracks these')}
      <div style="padding:10px 20px 12px;font-size:11.5px;line-height:1.5;color:var(--muted)">
        These are the job, and they are the same for every athlete on the board — which is
        what makes a day score mean the same thing for all of you. There is no off switch.
      </div>
      ${allHabits().filter(h => h.core).map(h => `<div class="row-rule" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px">
          <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
            <span class="hd" style="font-size:14px;line-height:1">${esc(h.name)}</span>
            <span style="font-size:11px;line-height:1.2;color:var(--muted)">${esc(h.goal || h.source)} · ${baseXp(h)} XP</span>
          </span>
          <span class="mono" style="flex:none;font-size:8.5px;letter-spacing:.09em;color:var(--muted-soft);border:1px solid var(--rule);padding:4px 7px">ALWAYS ON</span>
        </div>`).join('')}

      ${sectionLabel('Add-ons', 'Extra points, extra badges')}
      <!-- The warning is permanent, not a one-off toast. It is the rule the whole
           thing turns on, and an athlete who switched something on three weeks
           ago should still be able to find out why it is counting against them. -->
      <div style="padding:10px 20px 12px;font-size:11.5px;line-height:1.5;color:var(--muted)">
        Optional, and worth real points on top of the five. <strong style="color:var(--ink)">Once you
        switch one on it counts</strong> — miss it and it costs you the same as missing anything
        else, so only add what you will actually do. Switching one on applies
        <strong style="color:var(--ink)">today</strong>; switching it off applies
        <strong style="color:var(--ink)">tomorrow</strong>, so you cannot drop one at midnight to
        hide a miss. Days already gone never change either way.
      </div>
      ${addOnHabits().map(h => {
        const custom = (CFG.custom || []).some(c => c.id === h.id);
        const isOn = CFG.on[h.id] !== false, heldToday = lockedOnToday(h);
        // Armed by a first tap on OFF→ON, cleared by a second tap or by the
        // timeout — see the comment inside the handler below.
        const arming = UI.confirmOnId === h.id;
        return `<div class="row-rule" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px">
          <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
            <span class="hd" style="font-size:14px;line-height:1">${esc(h.name)}</span>
            <span style="font-size:11px;line-height:1.2;color:${arming ? 'var(--clay-deep)' : 'var(--muted)'}">${arming
              ? 'Tap again to turn it on — you cannot turn it back off until tomorrow.'
              : esc(h.goal || h.source) + ' · ' + baseXp(h) + ' XP' + (!isOn && heldToday ? ' · still counts today' : '')}</span>
          </span>
          <span style="display:flex;gap:10px;align-items:center">
            ${custom ? `<button class="mono" style="font-size:12px;color:var(--clay-deep);padding:4px 6px"
              ${on(() => removeCustom(h))} aria-label="Remove ${esc(h.name)}">✕</button>` : ''}
            <button class="sw ${isOn ? 'on' : ''}${arming ? ' confirm' : ''}" ${on(() => {
              const turningOn = CFG.on[h.id] === false;
              // Turning ON locks in today per stampRoster()'s TODAY-not-tomorrow
              // rule — the permanent paragraph above this list says so, but a
              // paragraph is easy to have never read. A first tap only ARMS the
              // switch and restates the rule on the row itself; only a second
              // tap, within the window, actually commits it. Turning off needs
              // no such gate — it never takes effect before tomorrow either way.
              if (turningOn && !arming) {
                UI.confirmOnId = h.id; render();
                clearTimeout(_confirmOnTimer);
                _confirmOnTimer = setTimeout(() => {
                  if (UI.confirmOnId === h.id) { UI.confirmOnId = null; render(); }
                }, 3200);
                return;
              }
              UI.confirmOnId = null;
              CFG.on[h.id] = !turningOn ? false : true;
              saveCfg(); render();
              toast(turningOn
                ? h.name.replace(/^[^A-Za-z]+/, '') + ' is on from today. Miss it and it counts against your day.'
                : h.name.replace(/^[^A-Za-z]+/, '') + ' comes off tomorrow. Today still counts it.');
            })} aria-label="${arming ? 'Confirm turning ' + esc(h.name) + ' on' : 'Toggle ' + esc(h.name)}"><i></i></button>
          </span>
        </div>`;
      }).join('')}
      <div style="padding:14px 20px 4px;display:flex;gap:8px">
        <input class="input" id="newhabit" maxlength="40" placeholder="Add a habit — e.g. No screens in bed" value="${esc(UI._newName || '')}" style="flex:1">
        <button class="btn btn-primary" style="padding:0 16px" ${on(() => {
          const name = String(UI._newName || '').trim();
          if (!name) return;
          const id = 'c_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 20) + '_' + Date.now().toString(36);
          CFG.custom = (CFG.custom || []).concat([{ id, name: name.toUpperCase(), goal: name }]);
          CFG.on[id] = true; UI._newName = '';
          if (CFG.seen) CFG.seen[id] = 1;
          saveCfg(); render(); toast(name.toUpperCase() + ' added · ' + XP_RULES.customXp + ' XP a day.');
        })}>Add</button>
      </div>
      <div style="padding:6px 20px 0;font-size:11px;color:var(--muted-soft)">Custom habits are worth ${XP_RULES.customXp} XP a day. Switch one off to pause it and keep its points; ✕ removes it and its history for good.</div>
      </div>

      <div style="padding:22px 20px 34px">
        <button class="btn ${UI.confirmReset ? 'confirmr' : 'btn-secondary'} btn-block" ${on(() => {
          // Destructive, so it asks once. The armed state disarms itself after a
          // couple of seconds if the second tap never comes.
          if (!UI.confirmReset) {
            UI.confirmReset = true; render();
            setTimeout(() => { if (UI.confirmReset) { UI.confirmReset = false; render(); } }, 2600);
            return;
          }
          UI.confirmReset = false;
          LOG[TKEY()] = {}; saveLog(); go('today'); toast('Clean slate. Try not to waste it.');
        })}>${UI.confirmReset ? 'Sure? Tap again to wipe today' : "Reset today's log"}</button>
      </div>
    </div>`;
}

// ── Log sheet ─────────────────────────────────────────────────────────────
function renderSheet() {
  const h = habitById(UI.sheet);
  const stepBy = h.step || 1;
  const cap = capFor(h), atCap = UI.sheetVal >= cap;
  const gain = previewXp(h, UI.sheetVal);
  return `
    <div class="scrim" data-k="scrim" ${on(() => { UI.sheet = null; render(); })}></div>
    <div class="sheet" data-k="sheet:${h.id}">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div class="hd" style="font-size:21px;line-height:1">Log ${esc(h.name)}${editingPast() ? ' · ' + esc(dayLong(AKEY())) : ''}</div>
        <button class="hd" style="font-size:13px;color:var(--clay-deep)" ${on(() => { UI.sheet = null; render(); })}>Close</button>
      </div>
      <div style="font-size:13px;line-height:1.4;color:var(--muted)">${atCap
        ? fmtVal(h, cap) + ' ' + esc(h.unit) + ' is the most this will take in a day. Anything past that is not a number, it is a typo.'
        : 'Target is ' + fmtVal(h, h.target) + ' ' + esc(h.unit) + ' a day. Round up generously, I will never know.'}</div>
      <div class="stepper">
        <button class="minus" ${on(() => { UI.sheetVal = Math.max(0, UI.sheetVal - stepBy); render(); })}>–</button>
        <div class="val">
          <span class="figure" style="font-size:36px;line-height:1">${fmtVal(h, UI.sheetVal)}</span>
          <span class="eyebrow">${esc(h.unit)}</span>
        </div>
        <button class="plus" ${on(() => { UI.sheetVal = Math.min(cap, UI.sheetVal + stepBy); render(); })}>+</button>
      </div>
      <button class="btn btn-primary btn-block" ${on(() => {
        const before = habitXp(h), rect = UI._tapRect, logged = UI.sheetVal;
        setVal(h.id, logged);
        UI.sheet = null;
        checkLevelUps();
        render();
        const gained = Math.max(0, habitXp(h) - before);
        haptic(logged >= h.target ? 'done' : 'tick');
        toast(h.name + ' updated' + dayTag() + ' · +' + gained + ' XP.');
        flyXp(gained, rect);
      })}>Save it${gain > 0 ? `<span class="savexp">banks +${gain} XP</span>` : ''}</button>
    </div>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error').classList.add('on');
}
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('client');
  const clientKey = params.get('key');
  if (!clientId) {
    showError('No client specified.\n\nOpen this page from your personal link:\nhabits.html?client=your_id');
    return;
  }
  try {
    const res = await fetch('data/' + encodeURIComponent(clientId) + '.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ATHLETE = (await res.json()).athlete || {};
  } catch (e) {
    showError('Could not load data for "' + clientId + '".\n\nCheck your link, or ask your coach for a fresh one.');
    return;
  }
  ATHLETE_ID = ATHLETE.id || clientId;
  ATHLETE_NAME = [ATHLETE.firstName, ATHLETE.lastName].filter(Boolean).join(' ');

  // Same 3-tier key resolution as program.html: URL → device copy → program JSON.
  if (!window.IS_DEMO) {
    const ks = ATHLETE_ID + '_skey';
    try {
      KEY = clientKey || localStorage.getItem(ks) || ATHLETE.key || null;
      if (KEY) localStorage.setItem(ks, KEY);
    } catch (e) { KEY = clientKey || ATHLETE.key || null; }
  }

  loadLocal();
  // NOTHING BELOW MAY HOLD THE SPINNER OPEN INDEFINITELY. Four server round
  // trips run before the first paint, and on a bad connection — the hotel wifi
  // that answers the handshake and then stalls — a fetch neither resolves nor
  // rejects, so "Loading proof" is the entire app, for ever. The phone is the
  // source of truth and every one of these is a refinement of what is already
  // in localStorage, so each gets a ceiling and the app opens without it.
  // A late answer is not lost: syncFromCloud runs again on foreground, and the
  // season, quests and workout days are all re-fetched on the next launch.
  const within = (p, ms, fallback) => Promise.race([
    Promise.resolve(p).catch(() => fallback),
    new Promise(res => setTimeout(() => res(fallback), ms))
  ]);
  await within(syncFromCloud(), 6000, null);
  // Which season we are in decides what scores, so settle that before anything
  // reads XP — including the workout import, which must not reach back further.
  await within(fetchSeason(), 4000, null);
  await within(fetchQuests(), 4000, null);
  // Sessions finished in the training app tick the WORKOUT habit here. The
  // dates come from the server, not from the other app's storage.
  importWorkoutDays(await within(fetchWorkoutDays(), 4000, null));
  // Every source of logged days has now reported — local, cloud, and the
  // training app. Settle the roster timeline against the full log before
  // anything scores off it.
  stampRoster();
  anchorRoster();
  // Levels that arrived with a sync still get their moment; a first run (or a
  // changed XP system) only re-baselines, so nobody is ambushed by a queue.
  checkLevelUps();
  if (CFG.dark) document.body.setAttribute('data-dark', '');
  document.title = 'AA Proof — ' + (ATHLETE.firstName || 'AA Performance');

  // An athlete who arrives with history owns whatever their level already
  // reached — silently, the same baselining every other unlock does, so opening
  // the app for the first time after this ships is not fourteen takeovers.
  //
  // Unconditional, not `if (!CFG.pass)`: the config loader fills defaults from
  // defaultCfg(), so CFG.pass always exists and that guard never fired. It is
  // idempotent anyway — claimRewards only ever adds what is missing.
  claimRewards(true);
  claimEventTitles(true);
  // And the other half of the same record. Minting on boot is what makes the
  // server's copy keep up with a level that is about to reset: the peak is
  // captured on the day it happens, while the level is still there to prove it.
  syncTitles();

  render();
  armIdle();
  document.getElementById('loading').classList.add('hidden');

  // Anything still unsent from a previous session goes up now.
  if (SYNC.dirty) pushNow();

  window.addEventListener('online', () => { SYNC.attempts = 0; pushNow(); refreshSyncBadge(); });
  window.addEventListener('offline', refreshSyncBadge);
  // Coming back to the app is a fresh start: never resume pointed at an
  // earlier day, or the first tap after lunch quietly lands on Saturday.
  window.addEventListener('visibilitychange', () => {
    if (document.hidden) pushNow();
    else { if (UI.day) { UI.day = null; render(); } refreshSyncBadge(); }
  });
  // Last-ditch attempt on the way out; keepalive is not available through the
  // client library, so this is best effort on top of the durable dirty flag.
  window.addEventListener('pagehide', () => { if (SYNC.dirty) pushNow(); });
  // Registered here rather than beside beforeinstallprompt: it touches CFG,
  // which does not exist until boot has run.
  window.addEventListener('appinstalled', () => {
    deferredInstall = null;
    UI.install = false;
    CFG.installAsked = true; saveCfg();
    render();                       // drops the Settings row — it has no job now
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>
</body>
</html>
