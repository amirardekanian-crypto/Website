  #app .tabs button { align-items: center; gap: 3px; border-right: 0; padding: 10px 8px; }
  #app .tabs button.on { color: #fff; }
  #app .tabs .num { display: none; }
  #app .tabs .nm { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.02em; }

  /* Stat grid → cards */
  #app .statgrid { border-bottom: 0; padding: 4px 16px 10px; gap: 10px; }
  #app .statgrid > div, #app .statgrid > div:nth-child(odd), #app .statgrid > div:nth-last-child(-n+2) {
    border: 0; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); padding: 12px 14px;
  }
  /* Grids & heat map */
  #app .grid35 .c { border: 0; border-radius: 6px; background: var(--surface); }
  #app .grid35 .c.hit { background: var(--hcol, var(--accent)); }
  #app .grid35 .c.part { background: var(--accent-100); }
  #app .grid35 .c.pre { background: none; border: 1.5px dotted var(--box); opacity: 0.6; }
  #app .grid35 .c.now { outline: 2px solid var(--ink); outline-offset: 1px; border-radius: 6px; }
  #app .heat .hc { border: 0; border-radius: 4px; background: var(--surface); height: 16px; }
  #app .heat .hc.hit { background: var(--accent); }
  #app .heat .hc.part { background: var(--accent-100); }
  #app .heat .hc.pre { background: none; border: 1px dotted var(--box); opacity: 0.6; }
  #app .heat .hc.today { outline: 2px solid var(--ink); outline-offset: 1px; }
  #app .heat .hd-lbl { font-family: 'Outfit', sans-serif; font-weight: 600; }
  #app .heat .hd-lbl.now { color: var(--accent); }
  #app .gridkey .gk .c { border-radius: 3px; }
  #app .pips i, #app .subs i { border-radius: 4px; }

  /* Event / quest cards */
  #app .evcard { border: 0; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
  #app .evcard.live { box-shadow: var(--shadow), 0 0 0 2px var(--accent); }
  #app .evcard.live .evhd { background: var(--surface); }
  #app .evcard.done { background: var(--card); box-shadow: var(--shadow), 0 0 0 2px var(--teal); }
  #app .evhd .evnm { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 17px; line-height: 1.15; letter-spacing: 0; }
  #app .evhd .evstate { border-radius: 999px; font-family: 'Outfit', sans-serif; font-weight: 700; letter-spacing: 0.04em; padding: 4px 9px; }
  #app .evcard.live .evstate { background: var(--accent); color: #fff; }
  #app .evcard.done .evstate { background: var(--teal); color: #0C4B43; }
  #app .evcard.over .evstate { border: 1.5px solid var(--box); }
  #app .evgoal .g-tick { border-radius: 999px; border-color: var(--box); }
  #app .evgoal.got .g-tick { background: var(--teal); border-color: var(--teal); color: #0C4B43; }
  #app .evgoal .g-bar > span { background: var(--accent); }
  #app .evgoal.got .g-bar > span { background: var(--teal); }
  #app .evfoot { border-top: 1px solid var(--rule); font-family: 'Outfit', sans-serif; font-weight: 600; letter-spacing: 0.03em; }
  #app .evfoot strong { font-family: 'Outfit', sans-serif; font-weight: 800; color: var(--accent); }
  #app .evcard.done .evfoot strong { color: var(--teal-deep); }
  #app .questidle { border-bottom: 1px solid var(--rule); }

  /* Milestones, ranks, reward track → cards */
  #app .msrow, #app .rankrow, #app .prow { margin: 0 16px 8px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); border-bottom: 0; width: auto; }
  #app .prow { width: calc(100% - 32px); }
  #app .msrow .code { border: 0; border-radius: 16px; background: var(--surface); font-family: 'Outfit', sans-serif; font-weight: 800; }
  #app .msrow.got .code { background: #FDF1DA; color: #B98A2E; }
  body[data-dark] #app .msrow.got .code { background: rgba(242,178,60,0.2); color: #F2B23C; }
  #app .msrow .ms-name, #app .rankrow .nm, #app .prow .nm { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14.5px; letter-spacing: 0; }
  #app .msrow .ms-bar > span { background: var(--gold, #F2B23C); }
  #app .msrow .ms-xp, #app .msrow .ms-cnt { font-family: 'Outfit', sans-serif; font-weight: 600; }
  #app .msrow.got .ms-xp, #app .msrow.got .ms-cnt { color: var(--teal-deep); }
  #app .msrow .ms-note .g.got { color: var(--teal-deep); }
  #app .msrow.evrow .ms-xp { font-size: 10px; letter-spacing: 0.04em; }
  #app .msnext { background: var(--surface); border-bottom: 0; margin: 0 16px 10px; border-radius: 16px; }
  #app .rankrow .badge { border: 0; border-radius: 999px; background: var(--surface); }
  #app .rankrow.passed .badge { background: var(--accent-100); color: var(--accent); }
  #app .rankrow.here { background: var(--accent); color: #fff; }
  #app .rankrow.here .badge { background: rgba(255,255,255,0.18); border: 0; color: #fff; }
  #app .rankrow.here .meta { color: rgba(255,255,255,0.8); }
  #app .rankrow .tag { font-family: 'Outfit', sans-serif; font-weight: 700; letter-spacing: 0.06em; }
  #app .rankrow.here .subs i { border-color: rgba(255,255,255,0.6); }
  #app .rankrow.here .subs i.on { background: #fff; border-color: #fff; }
  #app .prow .lvl { border: 0; border-radius: 14px; background: var(--surface); }
  #app .prow .lvl b { font-family: 'Outfit', sans-serif; font-weight: 800; }
  #app .prow.owned .lvl { background: var(--accent-100); color: var(--accent); border: 0; }
  #app .prow.on { background: var(--accent); color: #fff; }
  #app .prow.on .lvl { background: rgba(255,255,255,0.18); color: #fff; border: 0; }
  #app .prow.on .meta { color: rgba(255,255,255,0.82); }
  #app .prow .tag { font-family: 'Outfit', sans-serif; font-weight: 700; color: var(--accent); }
  #app .prow.on .tag { color: #fff; }
  #app .swatch { border-radius: 10px; border-color: var(--box); }
  #app .ttl { font-family: 'Outfit', sans-serif; font-weight: 700; color: var(--accent); }
  #app .passline { border-radius: 16px; margin: 0 16px 10px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13.5px; text-transform: none; letter-spacing: 0; color: #fff; }
  #app .delta.up { color: var(--teal-deep); }
  #app .medal { flex: none; width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  #app .medal-in { width: 33px; height: 33px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; }
  #app .rankrow .subs i { transform: rotate(45deg); border-radius: 3px; }
  #app .plate { flex: none; border: 0; padding: 2.5px; border-radius: 999px; background: #E3DFF3; cursor: pointer; font-family: 'Outfit', sans-serif; }
  #app .plate-in { display: block; border-radius: 999px; background: #231F35; font-weight: 800; font-size: 11px; letter-spacing: .12em; padding: 8px 13px; white-space: nowrap; color: #CBC6E4; text-transform: uppercase; }
  #app .plate.locked { opacity: .7; }
  #app .plate.locked .plate-in { background: var(--card); color: var(--muted-soft); }

  /* ── Share picker ── the card is previewed by the same painter that exports it. */
  #app .sharesheet { padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto; }
  #app .sharehd { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #app .sharex { width: 32px; height: 32px; border-radius: 999px; border: 0; background: var(--surface); color: var(--muted); font-size: 13px; flex: none; }
  #app .sharepwrap {
    position: relative; align-self: center; height: 296px; max-width: 100%;
    border-radius: 18px; overflow: hidden; background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px -22px rgba(35,31,53,.7);
  }
  #app .sharepwrap img { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity .18s ease; }
  #app .sharepwrap .spinner { position: absolute; width: 22px; height: 22px; border-width: 2px; }
  #app .sharerail { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; min-height: 78px; padding: 2px 0 6px; scrollbar-width: none; }
  #app .sharerail::-webkit-scrollbar { display: none; }
  #app .scard {
    flex: none; width: 66px; border: 0; border-radius: 16px; background: var(--card); box-shadow: var(--shadow);
    padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: 'Outfit', sans-serif; cursor: pointer; color: var(--muted);
  }
  #app .scard.on { background: var(--accent); color: #fff; box-shadow: 0 6px 0 var(--accent-700); }
  #app .scard-em { font-size: 19px; line-height: 1; }
  #app .scard-nm { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; }
  #app .sharenote { font-size: 11.5px; line-height: 1.45; color: var(--muted); text-align: center; }
  #app .sharesizes { display: flex; gap: 7px; justify-content: center; }
  #app .sharebtns { display: flex; flex-direction: column; gap: 8px; }

  /* ── Celebration extras ── confetti, coins and the crest/medal stage. */
  @keyframes lvConf {
    0%   { opacity: 0; transform: translate(0,0) rotate(0) }
    12%  { opacity: 1 }
    100% { opacity: 0; transform: translate(var(--cx), var(--cy)) rotate(var(--cr)) }
  }
  @keyframes lvCoin {
    0%   { opacity: 0; transform: translate(0,0) scale(.4) }

//  PROOF — health habit tracker with XP, levels and ranks.

//  localStorage is the source of truth and the durable record; an outbox with

//  Levels are ALWAYS derived from the log and never stored — retune XP_RULES
//  (documented in XP_SYSTEM.md) and every level recomputes from history.
// ════════════════════════════════════════════════════════════════════════
const SB_URL = 'https://bvipfipbdcyqnbczjmaq.supabase.co';
const SB_KEY = 'sb_publishable_BuDVTTC1E0eg3wc7F1Pcig_1A_tqYCy';

// ── THE XP SYSTEM — every tunable lives here ─────────────────────────────

// editing this object retroactively rescores every day the athlete has logged.
const XP_RULES = {
  base: 300,              // XP for level 1 → 2 (one full day of habits)
  growth: 0.55,           // cost(n) = base × n^growth — higher = steeper climb
  completionBonus: 1.2,   // multiplier once a habit's target is met
  customXp: 25,           // per-completion value of an athlete-added habit
  // A day counts toward the day-streak at this % of the WEIGHT it could earn —
  // see dayParts(). 75, not 80, and the five points are load-bearing: the gate's
  // denominator on a rest day is the seven daily habits (250), so the worst
  // single miss is steps at 190/250 = 76%. At 80 that fails and steps quietly
  // becomes a second precondition alongside the session; at 75 the old promise
  // — "miss any one thing and the day still counts" — survives on every roster
  // on the board. Nobody's streak gets shorter; some get longer.
  streakQualifyPct: 75,
  // The most a counter habit will accept in one day, as a multiple of its target
  // (steps 30,000 · water 24 · sleep 22.5h). Daily XP was always capped by
  // xpFor(), but a `total:` quest counts RAW UNITS — so without a ceiling one
  // tap-and-hold on the stepper logged 9,999,999 steps and cleared "50,000 steps
  // across the run" on the spot, on the board as well as on the phone. Raising
  // this above 5 makes the two steps quests one-day work again.
  dailyCap: 3,
  // Scoring runs in SEASONS. Only days on or after this date earn XP — for the
  // athlete's own level and for the leaderboards alike. The server is the
  // authority (public.seasons); this is the fallback used offline or before the
  // first fetch. Amir starts a new season with one SQL command — see XP_SYSTEM.md.
  seasonStart: '2026-07-26',
  seasonName: 'Pre-Season',
  // Per-completion value, ranked by health impact.
  weights: {
    strength: 100,
    steps:     60,
    sleep:     50,
    fuel:      40,
    water:     30,
    mobility:  30,
    breathe:   20,
    supps:     20

// ── CORE vs ADD-ON ────────────────────────────────────────────────────────
// Amir, 2026-07-30: "lets say for example 5 habits are mandatory for everyone …
// then someone tries to turn on supplements or breathing only to get additional
// xp and achievements. this should be a bonus."
//
// `core: true` means the habit is ALWAYS tracked and has no off switch. Five of
// them — train, steps, sleep, protein, water — which is the same list for every
// athlete on the board, so a day score means the same thing for everyone and the
// leaderboard compares like with like for the first time.
//

const HABITS = [
  // The id stays 'strength' so nobody's history or XP is orphaned by the

  // ── Names are TASKS, not nouns ─────────────────────────────────────────
  // They used to be labels — WORKOUT, STEPS, WATER — which is what the thing
  // IS, not what the athlete has to do about it. A list of nouns reads as a
  // filing system; a list of instructions reads as a day's work, and the target
  // is in the name so the row states the job before you tap anything.

  // The `id` never changes. Every log entry, every level and every leaderboard

const HABIT_HUES = {
  strength: ['#6C5CE7', '#EFECFB'],
  steps:    ['#FF8A5B', '#FFE9DF'],
  sleep:    ['#5B8DEF', '#E3ECFD'],
  fuel:     ['#F2B23C', '#FDF1DA'],
  water:    ['#3EC6E0', '#DFF4FA'],
  mobility: ['#C77DE0', '#F6E8FA'],

  if (HABIT_HUES[h.id]) return HABIT_HUES[h.id];
  let n = 0; for (const ch of String(h.id)) n = (n * 31 + ch.codePointAt(0)) >>> 0;

function splitEmoji(s) {
  const m = String(s || '').match(/^(\p{Extended_Pictographic}(?:[\uFE0F\u200D]\p{Extended_Pictographic}?|\uFE0F)*)\s*(.*)$/u);

function previewXp(h, val) {
  const k = AKEY();
  const day = LOG[k], had = day && Object.prototype.hasOwnProperty.call(day, h.id), prev = had ? day[h.id] : undefined;
  const before = habitXp(h);
  (LOG[k] = LOG[k] || {})[h.id] = val;
  const after = habitXp(h);

// ── Weekly quests ─────────────────────────────────────────────────────────

  { id:'w_mob4',     title:'OILED HINGES',        note:'Mobility on 4 days',             kind:'daysHit:mobility', need:4,     xp:120 },

function questPool() {

}
function runEndKey(run) { return fmtKey(addDays(parseKey(run.start), QUEST_RUN_DAYS - 1)); }

function activeQuestRun() {
  const t = TKEY();
  return questRuns().find(r => t >= r.start && t <= runEndKey(r)) || null;
}
// Whole days left in a run, counting today.
function runDaysLeft(run) {
  return Math.max(0, Math.round((parseKey(runEndKey(run)) - today()) / 86400000) + 1);
}
// Progress through a quest inside its run, and the day it completed if it did.
function questProgress(q, run) {
  const start = parseKey(run.start);
  const parts = String(q.kind || '').split(':');
  const kind = parts[0], hid = parts[1];
  const h = hid ? habitById(hid) : null;
  let have = 0, doneDay = null;
  for (let i = 0; i < QUEST_RUN_DAYS; i++) {
    const k = fmtKey(addDays(start, i));
    if (k > TKEY()) break;                       // the future has not happened
    // Season-bounded like everything else that pays: a run straddling the season
    // opening must not count the days before it, or the server (which never sees
    // them) would score the same quest differently.
    if (!inSeason(k)) continue;
    if (kind === 'daysHit') { if (h && isDone(h, k)) have++; }
    else if (kind === 'total') { have += valOf(k, hid); }
    else if (kind === 'qualify') { if (dayQualifies(k)) have++; }
    else if (kind === 'perfect') { if (isPerfect(k)) have++; }
    if (!doneDay && have >= q.need) doneDay = k;
  }
  return { have, need: q.need, done: have >= q.need, doneDay,
           pct: Math.max(0, Math.min(100, Math.round(have / q.need * 100))) };
}
// Every quest completed across every run, as dated events — the same shape tiers
// and milestones use, so seasons and both board windows filter them for free.
// Past runs keep paying: XP already earned is never taken back.
function questEvents() {
  const out = [];
  questRuns().forEach(run => {
    runQuests(run).forEach(q => {
      const p = questProgress(q, run);
      if (p.done && p.doneDay) out.push({ day: p.doneDay, xp: q.xp, kind: 'quest', id: run.start + ':' + q.id });
    });
  });
  return out;
}

// Stable within a day, different the next: the same situation gives the same line
// all day (so it does not reshuffle under the athlete, or retype every render),
// but tomorrow it rotates.
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 2147483647;
  return h;
}
function pickLine(bucket, seedKey, tokens) {
  const arr = NUDGES[bucket] || NUDGES.empty;
  let line = arr[hashStr(TKEY() + '|' + seedKey) % arr.length];
  Object.keys(tokens || {}).forEach(k => {
    line = line.split('{' + k + '}').join(String(tokens[k]));
  });
  // Counts are substituted into fixed prose, so a streak of one produced
  // "1 days on the board". Fixed once here rather than in forty separate lines.
  return line.replace(/\b1 (days|habits|glasses|sessions|nights|more)\b/g,
    (m, w) => '1 ' + ({ days:'day', habits:'habit', glasses:'glass',
                        sessions:'session', nights:'night', more:'more' })[w]);
}

// ── Dates ─────────────────────────────────────────────────────────────────

// ── The backfill window ───────────────────────────────────────────────────
// Nobody remembers to log on the day, every day. You can fill in or correct
// the last few days; past that the log closes. The limit is the point — a
// record you can rewrite whenever you like is a diary, not evidence.
//
// UI.day is the day being EDITED (null = today). Everything else in the app —
// streaks, nudges, the perfect-day celebration — stays anchored to the real
// today, because those are statements about now, not about the day you happen
// to be filling in. AKEY() self-heals: leave the app open past midnight on
// "3 days ago" and the window slides out from under it, so it falls back to
// today rather than writing to a day that has since closed.

}

// handed back perfect days that never happened.

//   CFG.roster = [ { from:'2026-07-26', ids:[...] },

//

// like that."
//

async function syncFromCloud() {
  if (window.IS_DEMO || !ATHLETE_ID) return;

    const sb = _sb();

    // so a stale device can never erase a real number recorded elsewhere.

      const cloudLog = JSON.parse(data[K_LOG()] || '{}') || {};

//

// ── XP ────────────────────────────────────────────────────────────────────

// ── Consistency ladders ───────────────────────────────────────────────────

// ── The app noticing you have stalled ─────────────────────────────────────

                               .sort((a, b) => baseXp(b) - baseXp(a));

// ── The nudge (one a day, driven by what is actually missing) ─────────────

// number in place instead of retyping the whole line from scratch.

    const st = currentDayStreak(), short = shortOfQualifying();
    const t = missing.filter(h => !h.locked).sort((a, b) => baseXp(b) - baseXp(a))[0];
    return { risk: true, key: 'risk',
             line: pickLine('risk', 'risk', { st: st, n: short }),
             cta: t ? 'SAVE IT · ' + t.name : 'SEE WHERE YOU STAND',
             target: t ? t.id : null };
  }

  // Everything done — the only nudge with nothing to ask for.
  if (!missing.length) {
    return { key: 'done', line: pickLine('allDone', 'done'), cta: 'SEE WHERE YOU STAND', target: null };
  }

  // Nothing logged at all yet: point at the cheapest win rather than the biggest.
  const doneCount = hs.length - missing.length;
  if (doneCount === 0) {
    const easy = missing.filter(h => !h.locked).sort((a, b) => baseXp(a) - baseXp(b))[0] || missing[0];

             cta: 'START WITH ' + easy.name, target: easy.id };

  // Down to one. Name it — being specific is what makes it land.

             line: pickLine('lastOne', 'last:' + only.id, { name: only.name.toLowerCase() }),
             cta: only.locked ? 'OPEN YOUR PROGRAMME' : 'FINISH ' + only.name,
             target: only.locked ? null : only.id };
  }

  // A run going well and today already qualifies: say so instead of inventing a
  // complaint. The coach notices both directions.
  const st = currentDayStreak();
  if (st >= 5 && dayQualifies(TKEY())) {
    return { key: 'rolling', line: pickLine('rolling', 'rolling', { st: st }),
             cta: 'SEE WHERE YOU STAND', target: null };
  }

  // Otherwise: the most valuable thing they can still action, in its own words.
  const t = missing.filter(h => !h.locked).sort((a, b) => baseXp(b) - baseXp(a))[0] || missing[0];

    ? Math.max(1, Math.ceil(t.target - valOf(TKEY(), t.id)))
    : 1;

           line: pickLine(NUDGES[t.id] ? t.id : 'empty', 'h:' + t.id,
                          { n: fmtVal(t, left), name: t.name.toLowerCase(), unit: t.unit }),
           cta: t.locked ? 'OPEN YOUR PROGRAMME' : 'SORT ' + t.name,
           target: t.locked ? null : t.id };
}

// ── Unlock detection ──────────────────────────────────────────────────────

// filling on a tab the athlete might not open that day. They are the biggest

  // exists to protect, and nothing in the app ever celebrated it — the only time

  // is the strongest predictor that somebody logs again tomorrow, so every mark
  // gets a takeover of its own.

  CFG.seenQuests = quests;

// ── Add to home screen ────────────────────────────────────────────────────
// Offered ONCE, and deliberately not on arrival. A pop-up before the app has
// done anything is a stranger asking for a place on your phone; straight after
// the first thing they log, it is "keep this" — and the manifest's start_url

    <div class="scrim" data-k="scrim:install" ${on(() => closeInstall())}></div>
    <div class="sheet" data-k="sheet:install">

        <!-- Width and height inline: a stale CSS cache has blown an unsized

// ── Actions ───────────────────────────────────────────────────────────────

// ── Titles on the board ───────────────────────────────────────────────────
// A card is drawn on the athlete's own phone, so it needs nobody's permission.
// A TITLE goes next to their name on a board other people read, and
// `CFG.pass.owned` is localStorage — devtools would hand anyone PROOF ITSELF.

// refuses everything else (supabase/stage17_titles.sql).

  if (window.IS_DEMO) return;

    const { data, error } = await sb.rpc('claim_titles', { p_athlete_id: ATHLETE_ID, p_key: KEY });

// ── The nudge types itself ────────────────────────────────────────────────
// The clay card is the coach talking, so it arrives one character at a time. The
// element is `data-static` (the renderer must not fight the typer for its text)
// and keyed by the LINE, so a new nudge replaces the node and retypes while an
// unchanged one is left alone. The caret is a child element rather than a class,
// because attributes on a static node are still patched from the template.
const _typeState = new WeakMap();
function typeLines(root) {
  root.querySelectorAll('[data-type]').forEach(el => {
    // The template puts the target text in an ATTRIBUTE as well as the content,
    // because attributes are still patched on a data-static node while its
    // children are not. So a line whose only change is a counter ("3 more
    // glasses" → "2 more glasses") is retargeted in place; the typer is only
    // restarted when the situation itself changes and the key replaces the node.
    const full = el.getAttribute('data-full') || el.textContent;
    const prev = _typeState.get(el);
    if (prev) {
      prev.full = full;
      if (prev.done) el.textContent = full;
      return;
    }
    // Long lines would keep an athlete waiting to read their own nudge.
    if (reduced() || full.length > 150) { el.textContent = full; return; }
    // The untyped remainder stays in the DOM, just invisible, and the caret is
    // zero-width — so the card occupies its FINAL height from the first frame.
    // Typing into an emptied element instead grows the card as it goes, which
    // shoves everything below it and drags the scroll position with it.
    const st = { full: full, i: 0, done: false };
    _typeState.set(el, st);
    el.textContent = '';

    caret.className = 'caret';
    const rest = document.createElement('span');
    rest.style.visibility = 'hidden';
    rest.textContent = full;
    el.append(shown, caret, rest);
    const step = () => {
      if (!el.isConnected) { st.done = true; return; }
      st.i++;
      // Re-read st.full every frame, so a retarget mid-flight simply lands on
      // the new text instead of finishing the old one and then jumping.
      const f = st.full;
      shown.nodeValue = f.slice(0, st.i);
      rest.textContent = f.slice(st.i);
      if (st.i < f.length) { setTimeout(step, 13); return; }
      st.done = true;
      caret.remove();
      rest.remove();
      el.textContent = f;

    setTimeout(step, 140);

// A bar that survives a render animates itself, because its width transition is
// finally attached to a node that still exists. A bar seeing its first paint has
// nothing to travel from, so we give it one.
const _seenBars = new WeakSet();
function fillBars(root) {
  root.querySelectorAll('[data-fill]').forEach(el => {
    if (_seenBars.has(el)) return;
    _seenBars.add(el);
    if (reduced()) return;
    const target = el.style.width;
    el.style.width = '0%';
    void el.offsetWidth;                       // commit the zero before asking for the target
    requestAnimationFrame(() => { el.style.width = target; });
  });
}

// ── Haptics ───────────────────────────────────────────────────────────────
// A tick you can feel in your hand is most of what separates an app from a
// web page. Silent no-op wherever the API is missing — notably every iPhone,
// since Safari still exposes no vibration at all — so it can never be the thing
// that breaks a check-off.

  try { if (navigator.vibrate) navigator.vibrate(HAPTIC[kind] || HAPTIC.tick); } catch (e) {}

// ── Sound ─────────────────────────────────────────────────────────────────

// only feedback an iPhone actually gets, since Safari has no vibration API.

    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === 'suspended') _actx.resume();
    const t = _actx.currentTime;

    osc.type = 'square';

    gain.gain.setValueAtTime(0.0001, t);

    gain.gain.exponentialRampToValueAtTime(0.0001, t + spec[1]);

// ── Gestures ──────────────────────────────────────────────────────────────
// Bound once per node (the renderer keeps nodes alive, so binding per render
// would stack listeners). Two things a sheet on a phone should always do: come
// away under your thumb, and let you hold a stepper instead of tapping it forty
// times to log ten thousand steps.
const _bound = new WeakSet();
function bindGestures(root) {
  const sheet = root.querySelector('.sheet');
  if (sheet && !_bound.has(sheet)) {
    _bound.add(sheet);
    let y0 = null, dy = 0, h = 0;
    sheet.addEventListener('pointerdown', ev => {
      // Only drag from the sheet's own chrome, never from a control inside it.
      if (ev.target.closest('button, input, .stepper')) return;
      y0 = ev.clientY; dy = 0; h = sheet.getBoundingClientRect().height;
      sheet.style.transition = 'none';
      sheet.setPointerCapture(ev.pointerId);

    });
    const release = () => {
      if (y0 === null) return;
      const far = dy > Math.min(120, h * 0.3);
      y0 = null;
      sheet.style.transition = 'transform .24s cubic-bezier(.16,1,.3,1)';
      if (far) {

      } else {
        sheet.style.transform = '';
      }
    };
    sheet.addEventListener('pointerup', release);
    sheet.addEventListener('pointercancel', release);
  }

  // steps from the list where the athlete actually stands was twenty taps while
  // the same job inside the sheet was one hold — and nothing on either screen
  // said which was which.
  root.querySelectorAll('.stepper button, .hrow:not(.locked) .pluscell').forEach(btn => {
    if (_bound.has(btn)) return;

    ['pointerup', 'pointercancel', 'pointerleave'].forEach(e => btn.addEventListener(e, stopRepeat));

  // the sheet can be dragged away mid-hold — so the release is also watched at
  // the window, once, for every stepper there will ever be.
  if (!_repeatWatched) {

// ── The stepper's hold-to-repeat ──────────────────────────────────────────
// One repeat at a time, held at module level so it can always be found and
// killed. It used to be a closure per button whose only exits were pointerup,
// pointercancel and pointerleave ON THAT BUTTON — miss all three (the sheet is
// dismissed under the thumb, the pointer is captured elsewhere, the app goes to

// ── The XP flight ─────────────────────────────────────────────────────────
// The most important 700ms in the app: the points you just earned visibly leave
// the habit that earned them and land on the level that owns them, which then
// takes the hit. Without this the hero is a label; with it, it is a destination.
function flyXp(amount, rect) {
  if (reduced() || !amount || amount <= 0 || !rect) return;
  const app = document.getElementById('app');
  const fx = document.getElementById('fx');
  const hero = app && app.querySelector('[data-hero]');
  if (!app || !fx || !hero) return;
  const box = app.getBoundingClientRect(), dest = hero.getBoundingClientRect();
  const x0 = rect.left - box.left + rect.width / 2, y0 = rect.top - box.top + rect.height / 2;
  const x1 = dest.left - box.left + dest.width / 2;
  // The hero is often scrolled out of sight when a habit low on the list is
  // ticked. Aiming at its real position would send the chip up over the sticky
  // header, so the landing point is clamped to the top of the scroll viewport —
  // it still reads as "these went up to your level", without crossing the chrome.
  const sc = document.getElementById('scroll');
  const lid = sc ? sc.getBoundingClientRect().top - box.top + 12 : 0;
  const y1 = Math.max(lid, dest.top - box.top + dest.height / 2);
  const chip = document.createElement('div');
  chip.className = 'xpfly';
  chip.style.left = x0 + 'px';
  chip.style.top = y0 + 'px';
  chip.style.setProperty('--dx', Math.round(x1 - x0) + 'px');
  const inner = document.createElement('i');
  inner.textContent = '+' + amount + ' XP';
  inner.style.setProperty('--dy', Math.round(y1 - y0) + 'px');
  chip.appendChild(inner);
  fx.appendChild(chip);
  // The pulse runs through the animation API rather than a class, so the next
  // render cannot strip it mid-flight.
  inner.addEventListener('animationend', () => {
    chip.remove();
    const target = document.querySelector('[data-hero]');
    if (target && target.animate) {
      target.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.13)' }, { transform: 'scale(1)' }],
        { duration: 420, easing: 'cubic-bezier(.2,.8,.25,1)' }
      );
    }
  }, { once: true });
}

// ══════════════════════════════════════════════════════════════════════════
//  THE TOUR — the game-style first run
// ══════════════════════════════════════════════════════════════════════════
// A clay box around the thing being named, a card beside it saying what it
// does, and the rest of the screen dimmed. It walks the athlete across all
// three tabs and into Settings, naming every control they would otherwise
// have to discover by poking.
//
// THREE RULES IT IS BUILT ON:
//
//  1. **It points at the real thing, live.** Every target is resolved out of
//     the actual DOM at the moment the step opens and measured with
//     getBoundingClientRect, so the ring cannot drift out of step with a
//     screen that has been retuned. Nothing here hard-codes a coordinate, and
//     a step whose target does not exist is dropped when the list is built
//     (`when`), not discovered missing halfway through.
//
//  2. **A step marked `act` can be finished by doing the thing.** The dimmer
//     is four panes with a real hole in the middle rather than one lid with a
//     transparent window, so the tap lands on the habit's own checkbox and
//     logs it for real. That is the whole difference between a tutorial and a
//     slideshow about a tutorial.
//
//  3. **It never traps anyone.** Skip is on every step, Back is on every step
//     after the first, and the whole thing is replayable from Settings for
//     ever. `CFG.toured` records that it has been offered, not that it must
//     never appear again.
//
// It defaults to false for EXISTING athletes too, so everyone who has been
// using the app since before this shipped gets the offer once — they are the
// group who never had any explanation at all.
const TOUR = { on:false, i:0, steps:[], back:'today' };

// Targets are resolved lazily, every paint. `$t` scopes to #app so a stray
// match in the tour's own layer can never be selected as its own target.

function startTour(back) {
  if (!CFG) return;
  TOUR.steps = tourSteps();
  TOUR.i = 0;
  TOUR.on = true;
  TOUR.back = back || 'today';
  _tourOpened = false;                         // the dimmer fades in once per run
  clearTimeout(_idleTimer);                    // nothing should breathe under the scrim
  const app = document.getElementById('app');
  if (app) app.addEventListener('click', tourTap, true);
  // Capture, so a scroll inside .scroll repositions the ring too — scroll does
  // not bubble, and the ring is drawn in viewport coordinates.
  window.addEventListener('scroll', tourReflow, true);
  window.addEventListener('resize', tourReflow);
  window.addEventListener('orientationchange', tourReflow);
  tourShow();
}

// Scroll fires per frame and can keep firing after the finger has gone, on
// momentum. Coalesce to one reposition per frame, and reposition ONLY — never
// rebuild. See the note on paintTour.
let _tourRaf = 0;
function tourReflow() {
  if (!TOUR.on || _tourRaf) return;
  _tourRaf = requestAnimationFrame(() => { _tourRaf = 0; if (TOUR.on) placeTour(); });
}

function endTour(finished) {
  if (!TOUR.on) return;
  TOUR.on = false;
  CFG.toured = true; saveCfg();
  const app = document.getElementById('app');
  if (app) app.removeEventListener('click', tourTap, true);
  window.removeEventListener('scroll', tourReflow, true);
  window.removeEventListener('resize', tourReflow);
  window.removeEventListener('orientationchange', tourReflow);
  cancelAnimationFrame(_tourRaf); _tourRaf = 0;
  paintTour();                                  // tears the layer down
  if (UI.screen !== TOUR.back) go(TOUR.back); else render();
  if (finished) toast('That is the tour. It is in Settings if you want it again.');
  armIdle();
}

function tourGo(d) {
  if (!TOUR.on) return;
  const n = TOUR.i + d;
  if (n < 0) return;
  if (n >= TOUR.steps.length) { endTour(true); return; }
  TOUR.i = n;
  haptic('tab');
  tourShow();
}

function tourShow() {
  const st = TOUR.steps[TOUR.i];
  if (!st) { endTour(true); return; }
  if (st.before) st.before();
  // go() owns nav direction, the scroll reset and the crew fetches; a step that
  // stays put only needs a repaint.
  if (st.screen && UI.screen !== st.screen) go(st.screen); else render();
  // One frame for the new screen to lay out, then bring the target into view,
  // then measure. Measuring before the scroll settles rings the wrong place.
  requestAnimationFrame(() => {
    const el = st.sel ? st.sel() : null;
    // Aligned to the TOP of the scroller rather than centred when either the
    // target is tall (its ring gets trimmed to the top, so centring would
    // scroll away the only highlighted part) or the phone is short (on a 568px
    // screen a centred target sits exactly where neither above nor below has
    // room for the card). Roomy phones keep the nicer centred framing.
    if (el && el.scrollIntoView) el.scrollIntoView({
      block: (el.getBoundingClientRect().height > window.innerHeight * 0.45 ||
              window.innerHeight < 700) ? 'start' : 'center',
      behavior: reduced() ? 'auto' : 'smooth'
    });
    setTimeout(paintTour, (el && !reduced()) ? 320 : 30);
  });
}

// A step marked `act` leaves its target tappable. When the athlete uses it for
// real, wait for the tick, the toast and the XP flight to finish, then move on.
function tourTap(ev) {
  if (!TOUR.on) return;
  const st = TOUR.steps[TOUR.i];
  if (!st || !st.act || !st.sel) return;
  const el = st.sel();
  if (!el || !(el === ev.target || el.contains(ev.target))) return;
  setTimeout(() => { if (TOUR.on) tourGo(1); }, 700);
}

// PAINTING IS SPLIT IN TWO, AND THAT SPLIT IS THE WHOLE POINT.
//
//   paintTour()  — decides whether the layer should exist and, when the STEP
//                  changes, builds its DOM once.
//   placeTour()  — writes geometry onto those existing nodes. Never builds.
//
// It used to be one function that rebuilt the layer's innerHTML on every call,
// and the scroll listener called it. `scrollIntoView({behavior:'smooth'})`
// fires scroll ~20-25 times per step transition, and a phone keeps firing on
// momentum after the finger has gone — so every step change tore down and
// recreated the card and all four mask panes about 25 times. Measured: 2
// intentional paints, 25 card rebuilds. Each rebuild restarted the card's
// `riseIn` entrance animation and the panes' `fadeIn`, so the card visibly
// re-entered and the dimmer re-faded, over and over. That is the "jumping and
// ticking". Repositioning must never touch the DOM.
let _tourKey = null, _tourCh = 0, _tourVW = 0, _tourOpened = false;

function tourTeardown(lay) {
  lay.className = 'tourlay';
  lay.innerHTML = '';
  _tourKey = null;
}

function paintTour() {
  const lay = document.getElementById('tour');
  if (!lay) return;
  const st = TOUR.on ? TOUR.steps[TOUR.i] : null;
  // Stand down for a celebration or the log sheet. Both own the screen, both
  // are the athlete's own doing, and both repaint this the moment they close.
  if (!st || UI.celebrate.length || UI.sheet) { tourTeardown(lay); return; }
  const key = TOUR.i + ':' + st.title;
  if (key !== _tourKey) { buildTour(lay, st); _tourKey = key; }
  placeTour();
}

function buildTour(lay, st) {
  const n = TOUR.i + 1, total = TOUR.steps.length;
  // `opening` only on the very first build of a run, so the dimmer fades in
  // once and then simply stays dark as the athlete steps through.
  lay.className = 'tourlay on' + (_tourOpened ? '' : ' opening');
  _tourOpened = true;
  // Every pane exists for the life of the step, whatever its size — placeTour
  // hides the ones that come out empty rather than adding and removing nodes.
  lay.innerHTML =
    `<div class="tourmask" data-m="t"></div>
     <div class="tourmask" data-m="b"></div>
     <div class="tourmask" data-m="l"></div>
     <div class="tourmask" data-m="r"></div>
     ${st.act ? '' : '<div class="tourblock" data-m="k"></div>'}
     <div class="tourring" data-m="ring"></div>
     <div class="tourcard" data-m="card" style="top:-9999px">
       <span class="tourtip" style="display:none"></span>
       <div class="tourtop">
         <h4>${esc(st.title)}</h4>
         <span class="tourn">${n}/${total}</span>
       </div>
       <div class="tourbody">
         <p>${st.body}</p>
         ${st.hint ? `<p style="color:var(--clay-deep)">${esc(st.hint)}</p>` : ''}
       </div>
       <div class="tournav">
         ${TOUR.i > 0 ? '<button class="btn tourback" data-t="back" aria-label="Back">&#8592;</button>' : ''}
         <button class="btn btn-primary" data-t="next">${esc(st.cta || (st.last ? 'Done' : 'Next'))}</button>
       </div>
       ${st.last ? '' : '<button class="tourskip" data-t="skip">Skip the tour</button>'}
     </div>`;
  // Bound once per step, not once per reposition. This layer lives outside
  // #app, so the delegated handler that serves the rest of the app never sees it.
  lay.querySelectorAll('[data-t]').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      const k = b.getAttribute('data-t');
      if (k === 'next') tourGo(1);
      else if (k === 'back') tourGo(-1);
      else endTour(false);
    });
  });
  // Swallow taps on the dimmed area — wandering off mid-tour is how a tutorial
  // ends up half-read with no way back into it.
  lay.querySelectorAll('.tourmask, .tourblock').forEach(m => {
    m.addEventListener('click', ev => ev.stopPropagation());
  });
  _tourCh = 0;                                  // force a re-measure in placeTour
}

function placeTour() {
  const lay = document.getElementById('tour');
  const st = TOUR.on ? TOUR.steps[TOUR.i] : null;
  if (!lay || !st || _tourKey === null) return;
  const cEl = lay.querySelector('[data-m="card"]');
  if (!cEl) return;

  const vw = window.innerWidth, vh = window.innerHeight;
  const cw = Math.min(vw - 28, 460), cx0 = Math.round((vw - cw) / 2), gap = 14;
  // Width drives height, so the measurement only has to be redone when the
  // viewport width changes (rotation) or the step does. Not on every scroll —
  // offsetHeight forces synchronous layout, which is the expensive part.
  if (_tourCh === 0 || _tourVW !== vw) {
    cEl.style.width = cw + 'px';
    cEl.style.left = cx0 + 'px';
    _tourCh = cEl.offsetHeight;
    _tourVW = vw;
  }
  const ch = _tourCh;

  const pad = st.pad == null ? 5 : st.pad;
  let r = null;
  const el = st.sel ? st.sel() : null;
  if (el) {
    const b = el.getBoundingClientRect();
    // A target scrolled fully out of the viewport rings nothing — better a
    // plain centred card than a clay box hard against the top edge.
    if (b.width > 0 && b.height > 0 && b.bottom > 0 && b.top < vh) {
      const t = Math.max(0, b.top - pad), l = Math.max(0, b.left - pad);
      r = { t, l, w: Math.min(vw - l, b.width + pad * 2), h: Math.min(vh - t, b.height + pad * 2) };
    }
  }

  // PLACEMENT. The card must never cover the thing it is describing, and the
  // ring must never be squeezed to nothing — so the two are solved together
  // rather than the ring being drawn first and the card fitted around it.
  //
  //   A — card BELOW the ring. Room for the ring is whatever is left above the
  //       card: hA = bottom edge − gap − card − ring top. A tall target (the
  //       tracked-habit list is ~590px) gets trimmed to hA and keeps its top,
  //       which is the part that identifies it.
  //   B — card ABOVE the ring. Needs only that the ring starts low enough; the
  //       ring is then clipped to the bottom of the viewport.
  //
  // A is preferred because reading downward from a highlight is the natural
  // order. Sizing the ring by a fixed fraction and then choosing a side left
  // the card on top of its own ring on every step of a 320px screen, where the
  // card is more than half the viewport.
  const EDGE = 12, MINRING = 36;
  let top, tip = null;
  if (!r) {
    top = Math.round((vh - ch) / 2);
  } else {
    const hA = vh - EDGE - gap - ch - r.t;                 // ring height A allows
    if (hA >= MINRING) {
      r.h = Math.min(r.h, hA);
      top = r.t + r.h + gap; tip = 'up';
    } else if (r.t - gap - ch >= EDGE) {
      r.h = Math.min(r.h, vh - r.t - EDGE);
      top = r.t - gap - ch; tip = 'down';
    } else {
      // Neither side fits at the target's natural size — a tall block low on a
      // short screen, e.g. the join box at the foot of CREW on a 320×568 phone,
      // which cannot be scrolled any higher because it is the last thing there.
      // Pin the card to an edge and trim the ring from the FAR side, taking
      // whichever of the two leaves more of the target showing. Trimming from
      // the top is the one that saves this case: the bottom of the join box is
      // the name field and the Join button, which is the half worth ringing.
      const cardAtBottom = vh - ch - EDGE, hCardBottom = cardAtBottom - gap - r.t;
      const ringBelowCard = EDGE + ch + gap, hCardTop = (r.t + r.h) - ringBelowCard;
      if (hCardTop > hCardBottom) {
        top = EDGE;
        r.h = Math.max(MINRING, Math.min(hCardTop, vh - ringBelowCard - EDGE));
        r.t = ringBelowCard;
      } else {
        top = cardAtBottom;
        r.h = Math.max(MINRING, hCardBottom);
      }
    }
  }
  cEl.style.top = top + 'px';

  const tEl = cEl.querySelector('.tourtip');
  if (tip && r) {
    tEl.className = 'tourtip ' + tip;
    tEl.style.display = '';
    tEl.style.left = Math.max(14, Math.min(cw - 32, Math.round(r.l + r.w / 2 - cx0 - 9))) + 'px';
  } else {
    tEl.style.display = 'none';
  }

  // Style writes only, on nodes that already exist. A pane that comes out empty
  // is hidden rather than removed, so the node set is stable for the step.
  const put = (sel, x, y, w, h) => {
    const n = lay.querySelector('[data-m="' + sel + '"]');
    if (!n) return;
    if (!(w > 0 && h > 0)) { n.style.display = 'none'; return; }
    n.style.display = '';
    n.style.left = x + 'px'; n.style.top = y + 'px';
    n.style.width = w + 'px'; n.style.height = h + 'px';
  };
  if (r) {
    const rb = r.t + r.h, rr = r.l + r.w;
    put('t', 0, 0, vw, r.t);
    put('b', 0, rb, vw, vh - rb);
    put('l', 0, r.t, r.l, r.h);
    put('r', rr, r.t, vw - rr, r.h);
    put('k', r.l, r.t, r.w, r.h);          // absent on an `act` step
    put('ring', r.l, r.t, r.w, r.h);
  } else {
    put('t', 0, 0, vw, vh);
    put('b', 0, 0, 0, 0); put('l', 0, 0, 0, 0); put('r', 0, 0, 0, 0);
    put('k', 0, 0, 0, 0); put('ring', 0, 0, 0, 0);
  }
}

// ── App shell ─────────────────────────────────────────────────────────────
function renderApp() {
  const LI = overallLevel();
  const hs = live(), doneCount = hs.filter(h => isDone(h, AKEY())).length, pct = dayPct(AKEY());
  const openH = habitById(UI.open || (hs[0] || HABITS[0]).id);
  const earnedMilestones = ACHIEVEMENTS.filter(a => measureAch(a) >= a.need).length;
  const earnedTiers = allHabits().reduce((s, h) => s + consistencyFor(h).tier, 0);
  const totalTiers = allHabits().length * CONSISTENCY_TIERS.length;
  const earned = earnedMilestones + earnedTiers, totalAch = ACHIEVEMENTS.length + totalTiers;

  const heads = {
    today:    editingPast()
                ? [parseKey(AKEY()).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }) + ' · FILLING IN',
                   dayLong(AKEY()).replace(/^./, c => c.toUpperCase())]
                : [today().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }) + ' · Day ' + dayNumber(), greeting()],
    // Not the level — the strip immediately below the header already says it.
    progress: [seasonName() + ' · day ' + dayNumber(), 'Progress'],
    // openH.source was the eyebrow, so most habits announced themselves as
    // "MANUAL" — which reads as the manual, the document in Settings. The goal
    // is what an athlete actually wants reminding of at the top of the screen.
    detail:   [openH.goal || openH.source, openH.name],
    crew:     LB.view === 'roll'
                ? ['Everyone, one line a day', 'Roll call']
                : [LB.scope === 'week' ? 'Past 7 days' : seasonName(), 'Leaderboard'],
    // Screen titles are the canonical names, and the Settings rows that lead
    // here now use exactly these words. Tapping "Read the manual" and arriving
    // at "How this works" made two screens feel like four.
    manual:   ['Everything, explained', 'The manual'],
    pass:     ['Rewards a season cannot take back', 'Locker'],
    settings: ['Profile & tracking', 'Settings']
  };
  const rights = {
    today: pct + '% DONE', progress: '',   // the stat grid states the badge count
    detail: (() => { const s = habitStreak(openH);       // not the level — the hero says it
                     return s > 0 ? s + '-DAY STREAK' : ''; })(),
    crew: (() => {
      if (LB.view === 'roll') {
        const n = RC.rows.filter(r => r.day === TKEY() && !r.is_coach).length;
        return n ? n + ' IN TODAY' : '';
      }
      return LB.rows.length ? 'TOP ' + Math.min(10, LB.rows.filter(r => r.pos <= 10).length) : '';
    })(),
    pass: (() => { const o = passOwned().length; return o ? o + '/' + PASS_TRACK.length : ''; })(),
    settings: ''
  };
  const head = heads[UI.screen] || heads.today;

  let screenHtml = '';
  if (UI.screen === 'today') screenHtml = renderToday(LI, doneCount, pct);
  else if (UI.screen === 'progress') screenHtml = renderProgress(LI, earned, totalAch);
  else if (UI.screen === 'detail') screenHtml = renderDetail(openH);
  else if (UI.screen === 'crew') screenHtml = renderCrew();
  else if (UI.screen === 'manual') screenHtml = renderManual();
  else if (UI.screen === 'pass') screenHtml = renderPass();
  else screenHtml = renderSettings();

  // Three tabs: do it, see where you stand, see everyone else. Habits and
  // achievements are one "Progress" tab — they were two views of one question —
  // and CREW holds the whole social layer, which was previously a chip inside
  // a tab named after only half of what it contained.
  const tabDefs = [['TODAY','today','01'],['PROGRESS','progress','02'],['CREW','crew','03'],['LOCKER','pass','04']];
  // Settings and the manual are not tabs. They sit "above" the tab
  // bar, so no tab lights up while you are in them and the initials button
  // becomes the way out. The Locker IS a tab now — it is the battle pass, and
  // battle passes live on the main bar.
  const OVERLAY = (UI.screen === 'settings' || UI.screen === 'manual');
  const activeTab = UI.screen === 'detail' ? 'progress' : (OVERLAY ? '' : UI.screen);
  const initials = (ATHLETE_NAME || 'Athlete').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

  // Every child of the shell carries a data-k, so when an overlay opens or
  // closes the renderer swaps whole nodes instead of quietly patching a toast
  // into a celebration and stealing its entrance.
  return `
    ${window.IS_DEMO ? '<div class="demo-banner" data-k="banner">Demo mode — nothing is saved to the cloud</div>' : ''}
    <div class="apphd" data-k="apphd">
      <div style="min-width:0">
        <div class="eyebrow">${esc(head[0])}</div>
        <div class="title hd">${esc(head[1])}</div>
      </div>
      <div class="hdright">
        <span class="right mono">${esc(rights[UI.screen] || '')}</span>
        <!-- One control, two states, always in the same place: your initials
             open Settings from anywhere, and become the way out of Settings,
             the manual and the ladder — none of which is a tab any more, so
             none of them has a tab to press to leave. -->
        <button class="hdme ${OVERLAY ? 'closing' : ''}" data-k="hdme"
          aria-label="${OVERLAY ? 'Close' : 'Settings'}"
          ${on(() => (OVERLAY ? go(UI.backTo || 'today') : (UI.backTo = UI.screen, go('settings'))))}>
          ${OVERLAY ? '&#10005;' : esc(initials)}
        </button>
      </div>
    </div>
    <div class="scroll" id="scroll" data-k="scroll">${screenHtml}</div>
    <div class="tabs" data-k="tabs">
      <div class="tabslab" data-k="tabslab" style="width:calc(100% / ${tabDefs.length});transform:translateX(${Math.max(0, tabDefs.findIndex(t => t[1] === activeTab)) * 100}%)"></div>
      ${tabDefs.map(t => `<button class="${activeTab === t[1] ? 'on' : ''}" data-k="tab:${t[1]}" ${on(() => go(t[1]))}>
        <span class="num">${t[2]}</span><span class="nm">${t[0]}</span>
      </button>`).join('')}
    </div>
    <div id="fx" data-k="fx" data-static></div>
    ${UI.sheet ? renderSheet() : ''}
    ${UI.share ? renderShareSheet() : ''}
    ${UI.install ? renderInstall() : ''}
    ${UI.toast && !UI.celebrate.length ? `<div class="toast" data-k="toast">${esc(UI.toast)}</div>` : ''}
    ${UI.celebrate.length ? renderCelebration(UI.celebrate[0]) : ''}`;
}
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

// ── Level-up takeover ─────────────────────────────────────────────────────
const SHARDS = [[0,-118],[84,-84],[118,0],[84,84],[0,118],[-84,84],[-118,0],[-84,-84],[52,-132],[-52,132],[132,52],[-132,-52]];
function shardHtml() {
  return SHARDS.map((s, i) => `<i style="--dx:${s[0]}px;--dy:${s[1]}px;animation-delay:${(0.22 + i * 0.025).toFixed(3)}s"></i>`).join('');
}
// Confetti and coins — the two things every game does on a win and this app did
// not. Deterministic per celebration so a re-render never re-scrambles mid-fall.
const CONF_COLOURS = ['#6C5CE7', '#35D0BA', '#F2B23C', '#FF8A5B', '#F27DA8', '#F6F4FF'];
function confettiHtml(n) {
  let seed = 11;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  let out = '';
  for (let i = 0; i < (n || 26); i++) {
    const left = Math.round(rnd() * 100);
    const drift = Math.round((rnd() - 0.5) * 120);
    const fall = 620 + Math.round(rnd() * 380);
    const rot = Math.round((rnd() - 0.5) * 900);
    const delay = (rnd() * 1.5).toFixed(2);
    const dur = (2 + rnd() * 1.6).toFixed(2);
    out += `<i class="${i % 3 === 0 ? 'dot' : ''}" style="left:${left}%;--cx:${drift}px;--cy:${fall}px;--cr:${rot}deg;`
         + `background:${CONF_COLOURS[i % CONF_COLOURS.length]};animation-delay:${delay}s;animation-duration:${dur}s"></i>`;
  }
  return `<div class="lvconf">${out}</div>`;
}
function coinHtml(n) {
  let out = '';
  const count = n || 10;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    out += `<i style="--cx:${Math.round(Math.cos(a) * 150)}px;--cy:${Math.round(Math.sin(a) * 150 - 60)}px;`
         + `animation-delay:${(0.3 + i * 0.045).toFixed(2)}s"></i>`;
  }
  return `<div class="lvcoins">${out}</div>`;
}
// Every takeover ends the same way: continue, or turn the moment into a post.
function lvActions(shareKind) {
  return `<div class="lvactions">
      <button class="lvgo">${UI.celebrate.length > 1 ? 'Next' : 'Continue'}</button>
      ${shareKind ? `<button class="lvshare" ${on(e => { e.stopPropagation(); UI.celebrate = []; saveCfg(); openShare(shareKind); })}>Share it</button>` : ''}
    </div>`;
}
function renderCelebration(ev) {
  if (ev.kind) return renderBadgeCelebration(ev);
  const isHabit = !ev.overall;
  const h = isHabit ? habitById(ev.id) : null;
  const info = isHabit ? habitLevel(h) : overallLevel();
  const r = rankFor(ev.to), promoted = ev.rankChanged;
  const prestiged = promoted && r.star > 0 && r.name === RANKS[0] && r.sub === 1;
  // Keyed per event, so advancing the queue swaps the whole takeover and the
  // next one bursts properly instead of inheriting a spent animation.
  return `
    <div class="lvwrap ${promoted ? 'rank' : ''}" data-k="cel:lv:${esc(ev.id)}:${ev.to}" ${on(dismissCelebration)}>
      ${confettiHtml(promoted ? 34 : 22)}
      <div class="lvstage">
        <div class="lvrays"></div>
        <div class="lvshock"></div>
        <div class="lvshards">${shardHtml()}</div>
        ${coinHtml(promoted ? 12 : 8)}
        <div class="lvbadge${promoted ? ' art' : ''}">${promoted
          ? rankCrest(r, 132)
          : `<span class="n">${ev.to}</span><span class="l">LEVEL</span>`}</div>
      </div>
      <div class="lvkicker">${prestiged ? 'Prestige' : (promoted ? 'Rank up' : 'Level up')}</div>
      <div class="lvrank">${esc(isHabit ? h.name : r.label)}</div>
      ${isHabit ? `<div class="lvsub">${esc(r.label)} · your ${esc(h.name.toLowerCase())} rank</div>`
                : `<div class="lvsub">Overall level ${ev.to} · ${info.into} / ${info.need} XP</div>`}
      <div class="lvbar"><span style="--w:${info.pct}%"></span></div>
      ${lvActions(isHabit ? null : 'rank')}
      ${UI.celebrate.length > 1 ? `<div class="lvqueue">${UI.celebrate.length - 1} more to go</div>` : ''}
    </div>`;
}
// "steps, sleep and water" — and past four, it stops listing and starts counting,
// because a takeover is not the place to read eight habit names.
function nameList(hs) {
  const n = hs.map(h => h.name.toLowerCase());
  if (n.length === 1) return n[0];
  if (n.length > 4) return n.slice(0, 3).join(', ') + ' and ' + (n.length - 3) + ' more';
  return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
}
// Tiers, milestones and perfect days borrow the same machinery but land on the

function renderBadgeCelebration(ev) {

  if (ev.kind === 'tier') {

    badge = String(ev.tier.days); badgeLabel = 'DAYS';

    title = ev.tier.name;

              + ', so it pays nothing this season.');
    // The medal, in the habit's own colour, instead of a number in a box.
    const h0 = ev.habits[0];
    art = `<div class="lvmedal" style="background:${METALS[ev.tierIndex >= 3 ? 'gold' : ev.tierIndex >= 1 ? 'silver' : 'bronze'].rim}">
        <span class="disc" style="background:${habitHue(h0)[1]}">${splitEmoji(h0.name)[0] || '✨'}
          <span class="stars">${'★'.repeat(Math.min(3, ev.tierIndex + 1))}</span></span>
        <span class="sheen"></span>
      </div>`;
  } else if (ev.kind === 'streak') {
    // The day streak crossing a mark — the single strongest signal that somebody
    // is going to keep going, and the app used to say nothing at all about it.
    ground = 'streak'; share = 'streak';
    kicker = 'Day streak';
    title = ev.days + ' DAYS';
    sub = ev.days + ' days in a row at ' + XP_RULES.streakQualifyPct + '% or better. '
        + (ev.best ? 'That is a new personal best.' : 'Keep it lit.');
    art = `<div class="lvflame"><span class="fl">🔥</span><span class="n">${ev.days}</span></div>`;
  } else if (ev.kind === 'quest') {
    badge = 'Q'; badgeLabel = 'QUEST'; codeClass = ' code';
    kicker = 'Quest complete';
    title = ev.quest.title;
    xpLine = ev.quest.xp;
    sub = ev.quest.note + '.';
    share = 'rank';
  } else if (ev.kind === 'milestone') {
    const paid = milestonePaid(ev.ach.code);
    kicker = 'Medal unlocked';
    title = ev.ach.name;
    xpLine = paid;
    sub = ev.ach.note + '.' + (paid > 0 ? '' : ' Yours on your all-time record — the '
          + ev.ach.xp.toLocaleString() + ' XP lands when you do it again inside ' + seasonName() + '.');
    const part = String(ev.ach.measure || '').split(':');
    const hh = part[1] ? habitById(part[1]) : null;
    const mk = ev.ach.tier === 'rare' ? 'gold' : ev.ach.tier === 'long' ? 'silver' : 'bronze';
    art = `<div class="lvmedal" style="background:${METALS[mk].rim}">
        <span class="disc" style="background:${hh ? habitHue(hh)[1] : '#EFECFB'}">${hh ? (splitEmoji(hh.name)[0] || '✨') : (MEASURE_EMOJI[part[0]] || '✨')}
          <span class="stars">${'★'.repeat(ev.ach.tier === 'rare' ? 3 : ev.ach.tier === 'long' ? 2 : 1)}</span></span>
        <span class="sheen"></span>
      </div>`;
  } else if (ev.kind === 'reward') {
    kicker = 'Unlocked';
    title = ev.reward.name;
    sub = ev.reward.note + ' ' + (ev.reward.kind === 'title'
      ? 'It sits under your name, and it is yours for good — a new season cannot take it back.'
      : 'Pick it for your card in your Locker. Yours for good.');
    share = 'rank';
    art = ev.reward.kind === 'title'
      ? `<div style="position:relative">${titlePlate(ev.reward)}<span class="sheen"></span></div>`
      : `<div style="position:relative;width:132px;height:166px;border-radius:20px;${CARD_LOOK[ev.reward.id] || CARD_LOOK.c_paper};box-shadow:0 18px 40px -18px rgba(0,0,0,.8)"><span class="sheen"></span></div>`;
  } else {
    // A perfect day. The one every consistency system is really built around.
    const n = live().length;
    badge = String(n); badgeLabel = n === 1 ? 'HABIT' : 'HABITS';
    kicker = 'Clean sweep';
    title = 'Perfect day';
    xpLine = dayXp(ev.id);
    sub = 'Every habit you track, done.';
    share = 'receipt';
    art = `<div class="lvmedal" style="background:${METALS.gold.rim}">
        <span class="disc" style="background:#E6F7F4">🏆<span class="stars">${n} / ${n}</span></span>
        <span class="sheen"></span>
      </div>`;
  }
  return `
    <div class="lvwrap ${ground}" data-k="cel:${esc(ev.kind || 'perfect')}:${esc(String(ev.id))}" ${on(dismissCelebration)}>
      ${confettiHtml(ev.kind === 'milestone' || !ev.kind ? 34 : 26)}
      <div class="lvstage">
        <div class="lvrays"></div>
        <div class="lvshock"></div>
        <div class="lvshards">${shardHtml()}</div>
        ${coinHtml(xpLine ? 12 : 8)}
        <div class="lvbadge${art ? ' art' : ''}">${art
          || `<span class="n${codeClass}">${esc(badge)}</span><span class="l">${esc(badgeLabel)}</span>`}</div>
      </div>
      <div class="lvkicker">${esc(kicker)}</div>
      <div class="lvrank">${esc(title)}</div>
      <div class="lvsub">${esc(sub)}</div>
      ${xpLine > 0 ? `<div class="lvxp">+${xpLine.toLocaleString()} XP banked</div>` : ''}
      ${lvActions(share)}
      ${UI.celebrate.length > 1 ? `<div class="lvqueue">${UI.celebrate.length - 1} more to go</div>` : ''}
    </div>`;
}

// ── The streak band, shared by Today and Progress ─────────────────────────
// The day streak is this app's headline consistency number — the whole point of
// the qualify rule — and TODAY showed it in exactly one circumstance: a red bar
// saying it was about to be lost. The only moment it appeared was the moment it
// was bad news. On PROGRESS it was one of four equal tiles, a bare figure with
// no sense of whether it was climbing or had just been broken.
//
// Both screens now open the same band: the number, how it compares to the best
// ever, and the seven days behind it so the shape of the week is visible at a
// glance rather than inferred from a single integer.
//
// Hidden entirely until there is a first logged day. A zero over an empty trail
// is the loudest possible way to open an app on day one, and these screens
// already go to some trouble not to do that — see the `pre` day chips and the
// statgrid's day-one note.
//
// Hidden on a ZERO too (Amir, 2026-07-30: "if there is no streak its better not
// to show it, and only show it if there are streak days"). Same rule the habit
// rows have always followed — they draw an ember or nothing — and the same
// reasoning as day one, one step further: an unlit flame over a 0 is not a
// fact worth the space, it is the app opening with the one number the athlete
// has just lost. The streak comes back the day it exists again, lit, which is
// the moment it means something. The count is not gone from the app: the stat
// grid on Progress still carries it, with the best ever beside it.
function bestHabitRun() {
  // allHabits(), not live(): a run you earned does not stop having happened
  // because you paused the habit, which is the same rule that keeps a
  // consistency tier once it is crossed.
  return allHabits().reduce((m, h) => Math.max(m, habitBest(h)), 0);
}
function streakFlame(now, best) {
  if (!firstLoggedDay() || now <= 0) return '';   // day one, and a broken streak, are not reports
  return `<div class="dayflame lit" data-lvl="${emberLevel(now)}" data-k="dayflame"
        title="${now}-day streak${best > now ? ' · best ' + best : ''}">
    ${FLAME}
    <span class="n" data-static data-num="dstreak" data-to="${now}">${now}</span>
    <span class="u">DAY<br>STREAK</span>
  </div>`;
}

// ── The level disc, the hero's ring at habit-row size ─────────────────────
// Amir, 2026-07-30: a habit's level on Progress was a filled square, its rank
// name in the meta line and its progress in a bar under the row — three
// elements for the one fact Today draws as a single object. This is that
// object, smaller: same `.lvring` geometry (r=15.5 in a 36 viewBox → C≈97.4),
// so the arc arithmetic is written once and a level never looks like two
// different things in two tabs. Number only — no LEVEL caption, no rank name.
// The bar it replaces is not lost information: the ring IS the bar, bent.
function habitRing(li) {
  return `<span class="hring${li.lv > 99 ? ' wide' : ''}" title="Level ${li.lv} · ${li.pct}% of the way to ${li.lv + 1}">
      <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="rail" cx="18" cy="18" r="15.5"></circle><circle class="run" cx="18" cy="18" r="15.5" style="stroke-dashoffset:${(97.4 * (1 - li.pct / 100)).toFixed(1)}"></circle></svg>
      <span class="in"><span class="figure">${li.lv}</span></span>
    </span>`;
}

// ── Habit row, shared by Today and Habits ─────────────────────────────────
// The best current run across the tracked habits. Used to decide which single
// ember animates; see the `.ember.lead` rules.
function leadStreak() {
  return live().reduce((m, h) => Math.max(m, habitStreak(h)), 0);
}
function habitRow(h, from, lead, pausedThen) {
  const v = valOf(AKEY(), h.id), done = isDone(h, AKEY()), st = habitStreak(h);
  const hl = habitLevel(h), flashed = UI.flash[h.id];
  const locked = !!h.locked && !done;
  const status = locked
    ? ((isFree() && h.freeHint) || h.lockedHint || 'Earned elsewhere.')
    : (h.kind === 'count'
        ? fmtVal(h, v) + ' of ' + fmtVal(h, h.target) + ' ' + h.unit
        : (done ? 'Done · ' + (h.goal || h.unit) : (h.goal || h.source)))
      + (pausedThen ? ' · paused now, but counted this day' : '');
  const pc = Math.min(100, Math.round(v / h.target * 100));
  const nudged = UI.idle === h.id && !done && !locked;
  const hue = habitHue(h), emoParts = splitEmoji(h.name), hEmo = emoParts[0], hLabel = emoParts[1];
  return `<div class="hrow ${done ? 'done' : ''} ${locked ? 'locked' : ''}" data-k="row:${h.id}" style="--hcol:${hue[0]};--hbg:${hue[1]}">
    <button class="checkcell" ${on(() => toggleHabit(h))} aria-label="${locked ? esc(h.name) + ' is earned in your programme' : 'Toggle ' + esc(h.name)}">
      ${locked
        ? `<span class="htile lockt" aria-hidden="true">${hEmo || esc(h.code)}<span class="boxmark lock">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
           </span></span>`
        : `<span class="htile"${hEmo ? '' : ' data-code'}>${hEmo || esc(h.code)}<span class="boxmark ${done ? 'on' : ''}${nudged ? ' nudge' : ''}">${done ? TICK : ''}</span></span>`}
    </button>
    <button class="body" ${on(() => openHabit(h.id, from))}>
      <span class="line1">
        <span class="nm">${esc(hLabel)}</span>
        <!-- THE LEVEL, ALWAYS, ON THE RIGHT. These two facts used to compete for
             one slot: the row showed the streak if there was one and the level
             otherwise, so a habit's level vanished the moment it started going
             well — which is exactly when someone wants to watch it climb. They
             are both here now, in the two places they each belong: the level is
             the row's right-hand anchor and never moves, and the streak rides
             the status line under it, next to the progress it describes.
             The flash chip still takes the slot for a moment when the level
             actually changes, because that is the one time it should shout. -->
        ${flashed ? `<span class="lvchip" data-k="chip">LV ${flashed} ↑</span>`
                  : `<span class="hlv" data-k="hlv">LV ${hl.lv}</span>`}
      </span>
      <span class="status">
        <span>${esc(status)}</span>
        ${st > 0 ? `<span class="ember${st === lead ? ' lead' : ''}" data-lvl="${emberLevel(st)}" data-k="hst">${st}<span class="u">-day streak</span></span>` : ''}
      </span>
      ${h.kind === 'count'
        ? `<span class="track"><span data-fill style="width:${pc}%"></span></span>`
        : ''}
    </button>
    ${h.kind === 'count' && !h.locked ? `<button class="pluscell" ${on(() => bump(h))} aria-label="Add to ${esc(h.name)}">+</button>` : ''}
    ${locked ? `<button class="pluscell" ${on(() => (isFree() ? (window.location.href = '/form.html') : goProgram()))} aria-label="${isFree() ? 'See about coaching' : 'Open your programme'}">→</button>` : ''}
  </div>`;
}

// ── Today ─────────────────────────────────────────────────────────────────
// Four days, today first. The nudge and the at-risk warning are statements
// about now, so they stand down while you are filling in an earlier day —
// "drink three more glasses" is nonsense advice about last Saturday.
function dayStrip() {
  const active = AKEY();
  // A day before the athlete's first logged one is not a 0% day, it is a day
  // they did not have the app. Three chips reading 0% were the first thing a
  // brand-new athlete saw, which reads as three days already lost.
  // `|| TKEY()` matters: firstLoggedDay() is null until something is logged, so
  // without it the case this exists for — day one, nothing logged — is the one
  // case it would miss.
  const first = firstLoggedDay() || TKEY();
  return `<div class="daystrip" data-k="daystrip">
    ${editableDays().map(k => {
      const pre = k < first, p = dayPct(k), sel = k === active;
      return `<button class="daychip ${sel ? 'on' : ''} ${!pre && p >= 100 ? 'full' : ''}" data-k="dc:${k}"
        ${on(() => setDay(k))} aria-pressed="${sel}"
        aria-label="Log ${esc(dayLong(k))}, ${pre ? 'before you started' : p + '% done'}">
        <span class="dl">${dayShort(k)}</span>
        <span class="dp">${pre ? '—' : p + '%'}</span>
        <span class="dbar"><span data-fill style="width:${pre ? 0 : p}%"></span></span>
      </button>`;
    }).join('')}
  </div>`;
}

// ── Roll call: writing today's line ───────────────────────────────────────
// Lives at the top of the CREW tab, above the feed it posts to. It used to sit
// at the bottom of Today, which put writing and reading on different screens
// and left the feature without a home; Today keeps a one-line pointer instead.
function renderNoteBox() {
  if (window.IS_DEMO) return '';
  if (!CFG.onBoard) {
    // The button used to be go('crew') — from the crew screen, which is the ONLY
    // place this box renders. It scrolled to the top and did nothing else, on
    // the one screen where a brand-new athlete is being asked to do something.
    // The join box lives on the OTHER view of this tab, so that is where it goes.
    return `<div class="block notebox" data-k="notejoin" style="border-top:2px solid var(--divider)">
      <div class="eyebrow" style="letter-spacing:.12em">Roll call</div>
      <div style="font-size:13px;line-height:1.5;color:var(--muted)">
        Every athlete gets one sentence a day, and everyone else sees it. Join the
        board and you can leave yours — it uses the same name and nothing more.
      </div>
    </div>` + renderBoardJoin();
  }
  const posted = myNote(TKEY());
  // null means "no draft yet, show what is posted". Plain '' is a real draft —
  // the athlete clearing the box on purpose — and must not snap back.
  const draft = UI.note === null ? posted : UI.note;
  const left = NOTE_MAX - draft.length;
  const changed = draft.trim() !== posted;
  return `<div class="block notebox" data-k="notebox" style="border-top:2px solid var(--divider)">
    <!-- Not "Roll call" — the screen title and the view chip both already say
         it, and three of the same words on one screen is noise. -->
    <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
      <span>Your line today</span><span>${posted ? 'ANSWERED' : 'ONE SENTENCE'}</span>
    </div>
    <div class="noteq" data-k="noteq">${esc(pickLine('prompt', 'rollcall'))}</div>
    <input class="input" id="dayline" maxlength="${NOTE_MAX}" data-k="dayline"
           placeholder="Say something about today…" value="${esc(draft)}"
           aria-label="Your line for today">
    <div class="noterow">
      <span class="mono ${left <= 20 ? 'tight' : ''}">${left}</span>
      <div style="display:flex;gap:8px">
        ${posted ? `<button class="btn btn-secondary" style="padding:0 12px"
          ${on(() => postNote(''))}>Delete</button>` : ''}
        <button class="btn btn-primary" style="padding:0 16px"
          ${UI.noteBusy || !changed ? 'disabled' : ''}
          ${on(() => postNote(draft))}>${posted ? 'Change it' : 'Post'}</button>
      </div>
    </div>
    <div style="font-size:11px;line-height:1.5;color:var(--muted-soft)">
      Everyone on the board sees this next to your name and today's percentage.
      Change it as often as you like until midnight — after that it stands.
    </div>
  </div>`;
}

function renderToday(LI, doneCount, pct) {
  // hs (live habits) drives "your week" — the heat map and the strongest/
  // weakest ranking are about what you track NOW, regardless of which day
  // you happen to be filling in. rows is what the day itself was actually
  // scored on (rosterOn), which is what the tap targets below must show —
  // ⚠️ see the note above dayParts(): a day is scored against its OWN
  // roster, and a row list built from live() instead silently hides any
  // habit you've since paused, so filling in that day can look complete
  // while dayPct()/isPerfect() still judge it against a habit you were
  // never shown. rows === hs on today itself; stampRoster() guarantees it.
  const hs = live();
  const rows = rosterOn(AKEY());
  const n = nudge();
  const past = editingPast();
  const risk = !past && n.risk;
  // The recap half of "nudge and recap": last seven days at a glance.
  const weekStart = addDays(today(), -6);
  const weekXp = xpBetween(weekStart, today());
  let goodDays = 0;
  for (let i = 0; i < 7; i++) if (dayQualifies(fmtKey(addDays(today(), -i)))) goodDays++;
  const ranked = hs.map(h => ({ h, w: habitWeek(h) })).sort((a, b) => b.w - a.w);
  const strongest = ranked[0], weakest = ranked[ranked.length - 1];
  // The heat map. Oldest day on the left, because that is the direction a week
  // runs in. Rows are ordered strongest-first so the eye lands on the solid
  // bands and finds the gap-toothed ones underneath — the opposite order opens
  // the block on the athlete's worst habit, which is a scolding, not a recap.
  // ⚠️ rosterOn(k), not live(): a habit switched on midweek did not exist on
  // Monday, and drawing it as three misses is the app inventing failures. Those
  // cells read `pre`, exactly like days before the athlete joined.
  const firstDay = firstLoggedDay();
  const heatDays = [];
  for (let i = 6; i >= 0; i--) heatDays.push(fmtKey(addDays(today(), -i)));
  const heatRows = ranked.map(r => ({
    h: r.h,
    cells: heatDays.map(k => {
      if (firstDay && k < firstDay) return 'pre';
      if (rosterOn(k).indexOf(r.h) < 0) return 'pre';
      const v = valOf(k, r.h.id);
      return v >= r.h.target ? 'hit' : (v > 0 ? 'part' : '');
    })
  }));

  return `
    <div data-k="screen:today" style="${screenAnim()}">
      <!-- The hero carries the LEVEL only. The day's own progress used to sit
           directly beneath it as a second green bar of identical shape, which
           read as one broken double-bar and stated a number the header and the
           day strip were both already showing. -->
      <div class="block hero-lv">
        <div style="display:flex;align-items:center;gap:14px">
          <!-- The XP ring: how far through this level, drawn AROUND the level
               number rather than as a bar under the block — the number and its
               progress are one object. r=15.5 in a 36 viewBox → C≈97.4. -->
          <button class="lvring" data-k="lvring" ${on(() => go('pass'))} aria-label="Open the Locker — the ladder and the rewards">
            <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="rail" cx="18" cy="18" r="15.5"></circle><circle class="run" cx="18" cy="18" r="15.5" style="stroke-dashoffset:${(97.4 * (1 - LI.pct / 100)).toFixed(1)}"></circle></svg>
            <span class="in"><span class="figure" data-hero data-static data-num="lv" data-to="${LI.lv}" style="font-size:${LI.lv > 99 ? 24 : 30}px;line-height:1">${LI.lv}</span><span class="lbl">LEVEL</span></span>
          </button>
          <!-- The day streak sits ON the hero, not in a band under it. Amir
               asked for the number he already had to be made louder, and the
               band was a new field instead — a whole strip of screen to say one
               integer. Here it is the loudest thing on the row after the level
               itself, and it costs no vertical space at all. -->
          ${streakFlame(currentDayStreak(), bestDayStreak())}
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
            <button class="ranklink" ${on(() => go('pass'))} aria-label="Open the Locker — the ladder and the rewards">
              ${rankCrest(LI.rank, 26)}
              <span class="hd" style="font-size:17px;line-height:1">${esc(LI.label)}</span>
              <span class="go">→</span>
            </button>
            <div style="font-size:12px;line-height:1.3;color:var(--muted)"><span data-static data-num="xp" data-to="${LI.xp}">${LI.xp.toLocaleString()}</span> XP · ${esc(LI.nextLabel)}</div>
          </div>
        </div>
      </div>

      <!-- Day strip then habits, directly under the hero. The list is what the
           screen is FOR; it used to start ~1,400px down, behind the nudge and
           the quest block, so opening the app to log meant scrolling to log. -->
      ${dayStrip()}
      ${past ? `<div class="backfill" data-k="backfill">
        <div>
          <div class="eyebrow">Filling in</div>
          <div class="bf-day">${esc(dayLong(AKEY()))}</div>
        </div>
        <button ${on(() => setDay(TKEY()))}>Back to today</button>
      </div>` : ''}
      <!-- What RESCUES the day, not what is left of it. "3 to go" was every
           remaining habit; under a weighted score those are not the same
           number, and the smaller one is the true one. -->
      ${risk ? `<div class="riskbar" data-k="riskbar">Streak at risk · ${shortOfQualifying()} to go before midnight</div>` : ''}

      ${(() => { const lead = leadStreak(); return rows.map(h => habitRow(h, 'today', lead, past && CFG.on[h.id] === false)).join(''); })()}

      <!-- DIRECTLY UNDER THE LIST IT DESCRIBES. This line used to be the very
           last element on the screen — measured 580px below the fold, at the
           bottom of a 1,310px scroll, in the smallest and faintest type in the
           app — which meant the only permanent explanation of the row's three
           tap targets sat two screens past the moment anyone needed it. It
           still goes BELOW the list (the list is what the screen is for), just
           immediately below rather than after everything else. -->
      <div class="rowhint" data-k="rowhint">
        Three taps per row: the <strong>box</strong> logs it, the <strong>name</strong> opens its
        history, <strong>+</strong> adds one${live().some(h => h.kind === 'count' && !h.locked) ? ' (hold it to go faster)' : ''}.
      </div>

      ${past ? '' : `<div class="coachcard ${risk ? 'risk' : ''}" data-k="nudge">
        <div class="eyebrow">${risk ? 'While there is still time' : 'One nudge, as agreed'}</div>
        <div class="say" data-k="say:${esc(n.key)}" data-static data-type data-full="${esc(n.line)}">${esc(n.line)}</div>
        <button class="cta" ${on(() => (n.target ? openHabit(n.target, 'today') : go('progress')))}>${esc(n.cta)}</button>
      </div>`}


      <!-- The way back in for anyone who skipped the tour, and the way in for
           every athlete who has been using the app since before it existed.
           Below the habit list, like everything else on this screen that is not
           the job — and it deletes itself the moment the tour has been run
           once, so it costs a returning athlete nothing for ever. -->
      ${past || CFG.toured ? '' : `
        <button class="rcprompt" data-k="tourprompt" ${on(() => startTour('today'))}>
          <span>
            <span class="eyebrow">The tour</span>
            <!-- Not "New here". This row shows to anyone who has not been through
                 the tour, which on the day it ships is EVERY existing athlete —
                 greeting someone on day 240 as a newcomer is the app not knowing
                 who it is talking to. They are not new; the tour is. -->
            <span class="rcq">${loggedDays().length
              ? 'New: a minute on what every button in here actually does.'
              : 'Want the one-minute tour of what everything does?'}</span>
          </span>
