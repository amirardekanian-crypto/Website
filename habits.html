    // children are not. So a line whose only change is a counter ("3 more
    // glasses" → "2 more glasses") is retargeted in place; the typer is only
    // restarted when the situation itself changes and the key replaces the node.

      if (prev.done) el.textContent = full;
      return;
    }
    // Long lines would keep an athlete waiting to read their own nudge.
    if (reduced() || full.length > 150) { el.textContent = full; return; }
    // The untyped remainder stays in the DOM, just invisible, and the caret is
    // zero-width — so the card occupies its FINAL height from the first frame.
    // Typing into an emptied element instead grows the card as it goes, which
    // shoves everything below it and drags the scroll position with it.

// ── Haptics ───────────────────────────────────────────────────────────────

  blip(kind);

// ── Sound ─────────────────────────────────────────────────────────────────

// only feedback an iPhone actually gets, since Safari has no vibration API.

// ── The XP flight ─────────────────────────────────────────────────────────
// The most important 700ms in the app: the points you just earned visibly leave
// the habit that earned them and land on the level that owns them, which then
// takes the hit. Without this the hero is a label; with it, it is a destination.
function flyXp(amount, rect) {
  if (reduced() || !amount || amount <= 0 || !rect) return;
  const app = document.getElementById('app');
  const fx = document.getElementById('fx');
  const hero = app && app.querySelector('[data-hero]');
  if (!app || !fx || !hero) return;
  const box = app.getBoundingClientRect(), dest = hero.getBoundingClientRect();
  const x0 = rect.left - box.left + rect.width / 2, y0 = rect.top - box.top + rect.height / 2;
  const x1 = dest.left - box.left + dest.width / 2;

  // ticked. Aiming at its real position would send the chip up over the sticky
  // header, so the landing point is clamped to the top of the scroll viewport —
  // it still reads as "these went up to your level", without crossing the chrome.
  const sc = document.getElementById('scroll');
  const lid = sc ? sc.getBoundingClientRect().top - box.top + 12 : 0;
  const y1 = Math.max(lid, dest.top - box.top + dest.height / 2);

  chip.className = 'xpfly';
  chip.style.left = x0 + 'px';
  chip.style.top = y0 + 'px';
  chip.style.setProperty('--dx', Math.round(x1 - x0) + 'px');
  const inner = document.createElement('i');
  inner.textContent = '+' + amount + ' XP';
  inner.style.setProperty('--dy', Math.round(y1 - y0) + 'px');
  chip.appendChild(inner);
  fx.appendChild(chip);
  // The pulse runs through the animation API rather than a class, so the next
  // render cannot strip it mid-flight.
  inner.addEventListener('animationend', () => {
    chip.remove();
    const target = document.querySelector('[data-hero]');
    if (target && target.animate) {
      target.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.13)' }, { transform: 'scale(1)' }],
        { duration: 420, easing: 'cubic-bezier(.2,.8,.25,1)' }
      );
    }
  }, { once: true });
}

// ── App shell ─────────────────────────────────────────────────────────────

  const LI = overallLevel();

  const openH = habitById(UI.open || (hs[0] || HABITS[0]).id);
  const earnedMilestones = ACHIEVEMENTS.filter(a => measureAch(a) >= a.need).length;
  const earnedTiers = allHabits().reduce((s, h) => s + consistencyFor(h).tier, 0);
  const totalTiers = allHabits().length * CONSISTENCY_TIERS.length;
  const earned = earnedMilestones + earnedTiers, totalAch = ACHIEVEMENTS.length + totalTiers;

  const heads = {
    today:    editingPast()
                ? [parseKey(AKEY()).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }) + ' · FILLING IN',
                   dayLong(AKEY()).replace(/^./, c => c.toUpperCase())]
                : [today().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }) + ' · Day ' + dayNumber(), greeting()],
    // Not the level — the strip immediately below the header already says it.
    progress: [seasonName() + ' · day ' + dayNumber(), 'Progress'],
    // openH.source was the eyebrow, so most habits announced themselves as
    // "MANUAL" — which reads as the manual, the document in Settings. The goal
    // is what an athlete actually wants reminding of at the top of the screen.
    detail:   [openH.goal || openH.source, openH.name],
    board:    LB.view === 'roll'
                ? ['One sentence each, past 7 days', 'Roll call']
                : [LB.scope === 'week' ? 'Past 7 days' : seasonName(), 'Leaderboard'],
    // Screen titles are the canonical names, and the Settings rows that lead
    // here now use exactly these words. Tapping "Read the manual" and arriving
    // at "How this works" made two screens feel like four.
    manual:   ['Everything, explained', 'The manual'],
    ranks:    ['Ten ranks, fifty levels', 'The ladder'],
    settings: ['Profile & tracking', 'Settings']
  };
  const rights = {
    today: pct + '% DONE', progress: '',   // the stat grid states the badge count
    detail: (() => { const s = habitStreak(openH);       // not the level — the hero says it
                     return s > 0 ? s + ' DAY' + (s === 1 ? '' : 'S') + ' RUNNING' : ''; })(),
    board: (() => {
      if (LB.view === 'roll') {
        const n = RC.rows.filter(r => r.day === TKEY() && !r.is_coach).length;
        return n ? n + ' IN TODAY' : '';
      }
      return LB.rows.length ? 'TOP ' + Math.min(10, LB.rows.filter(r => r.pos <= 10).length) : '';
    })(),
    ranks: '',                              // the hero says the level already
    settings: ''
  };
  const head = heads[UI.screen] || heads.today;

  let screenHtml = '';
  if (UI.screen === 'today') screenHtml = renderToday(LI, doneCount, pct);
  else if (UI.screen === 'progress') screenHtml = renderProgress(LI, earned, totalAch);
  else if (UI.screen === 'detail') screenHtml = renderDetail(openH);
  else if (UI.screen === 'board') screenHtml = renderBoard();
  else if (UI.screen === 'manual') screenHtml = renderManual();
  else if (UI.screen === 'ranks') screenHtml = renderRanks();
  else screenHtml = renderSettings();

  // Four tabs, leaderboard last. Habits and achievements are one "Progress"
  // tab — they were two views of the same question.
  // "BOARD", not "LEADERBOARD": eleven characters cannot fit a quarter of a phone
  // without either overflowing its cell or shrinking the type below the others.
  // The screen's own title still reads "Leaderboard".
  const tabDefs = [['TODAY','today','01'],['PROGRESS','progress','02'],['SETTINGS','settings','03'],['BOARD','board','04']];
  const activeTab = UI.screen === 'detail' ? 'progress'
                  : (UI.screen === 'manual' || UI.screen === 'ranks') ? 'settings' : UI.screen;

  // Every child of the shell carries a data-k, so when an overlay opens or
  // closes the renderer swaps whole nodes instead of quietly patching a toast
  // into a celebration and stealing its entrance.
  return `
    ${window.IS_DEMO ? '<div class="demo-banner" data-k="banner">Demo mode — nothing is saved to the cloud</div>' : ''}
    <div class="apphd" data-k="apphd">
      <div style="min-width:0">
        <div class="eyebrow">${esc(head[0])}</div>
        <div class="title hd">${esc(head[1])}</div>
      </div>
      <div class="right mono">${esc(rights[UI.screen] || '')}</div>
    </div>
    <div class="scroll" id="scroll" data-k="scroll">${screenHtml}</div>
    <div class="tabs" data-k="tabs">
      <div class="tabslab" data-k="tabslab" style="width:calc(100% / ${tabDefs.length});transform:translateX(${Math.max(0, tabDefs.findIndex(t => t[1] === activeTab)) * 100}%)"></div>
      ${tabDefs.map(t => `<button class="${activeTab === t[1] ? 'on' : ''}" data-k="tab:${t[1]}" ${on(() => go(t[1]))}>
        <span class="num">${t[2]}</span><span class="nm">${t[0]}</span>
      </button>`).join('')}
    </div>
    <div id="fx" data-k="fx" data-static></div>
    ${UI.sheet ? renderSheet() : ''}
    ${UI.toast && !UI.celebrate.length ? `<div class="toast" data-k="toast">${esc(UI.toast)}</div>` : ''}
    ${UI.celebrate.length ? renderCelebration(UI.celebrate[0]) : ''}`;
}
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

// ── Level-up takeover ─────────────────────────────────────────────────────
const SHARDS = [[0,-118],[84,-84],[118,0],[84,84],[0,118],[-84,84],[-118,0],[-84,-84],[52,-132],[-52,132],[132,52],[-132,-52]];
function shardHtml() {
  return SHARDS.map((s, i) => `<i style="--dx:${s[0]}px;--dy:${s[1]}px;animation-delay:${(0.22 + i * 0.025).toFixed(3)}s"></i>`).join('');
}
function renderCelebration(ev) {
  if (ev.kind) return renderBadgeCelebration(ev);
  const isHabit = !ev.overall;
  const h = isHabit ? habitById(ev.id) : null;
  const info = isHabit ? habitLevel(h) : overallLevel();
  const r = rankFor(ev.to), promoted = ev.rankChanged;
  const prestiged = promoted && r.star > 0 && r.name === RANKS[0] && r.sub === 1;
  // Keyed per event, so advancing the queue swaps the whole takeover and the
  // next one bursts properly instead of inheriting a spent animation.
  return `
    <div class="lvwrap ${promoted ? 'rank' : ''}" data-k="cel:lv:${esc(ev.id)}:${ev.to}" ${on(dismissCelebration)}>
      <div class="lvstage">
        <div class="lvrays"></div>
        <div class="lvshock"></div>
        <div class="lvshards">${shardHtml()}</div>
        <div class="lvbadge">${promoted ? rankIcon(r, 54, 'stroke-width:1.9') : `<span class="n">${ev.to}</span><span class="l">LEVEL</span>`}</div>
      </div>
      <div class="lvkicker">${prestiged ? 'Prestige' : (promoted ? 'Rank up' : 'Level up')}</div>
      <div class="lvrank">${esc(isHabit ? h.name : r.label)}</div>
      ${isHabit ? `<div class="lvsub">${esc(r.label)} · your ${esc(h.name.toLowerCase())} rank</div>`
                : `<div class="lvsub">Overall level ${ev.to} · ${info.into} / ${info.need} XP</div>`}
      <div class="lvbar"><span style="--w:${info.pct}%"></span></div>
      <button class="lvgo">${UI.celebrate.length > 1 ? 'Next' : 'Continue'}</button>
      ${UI.celebrate.length > 1 ? `<div class="lvqueue">${UI.celebrate.length - 1} more to go</div>` : ''}
    </div>`;
}
// "steps, sleep and water" — and past four, it stops listing and starts counting,
// because a takeover is not the place to read eight habit names.
function nameList(hs) {
  const n = hs.map(h => h.name.toLowerCase());
  if (n.length === 1) return n[0];
  if (n.length > 4) return n.slice(0, 3).join(', ') + ' and ' + (n.length - 3) + ' more';
  return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
}
// Tiers, milestones and perfect days borrow the same machinery but land on the
// green ground, so the KIND of win is readable before a word of it is.
function renderBadgeCelebration(ev) {
  let badge, badgeLabel, kicker, title, sub, codeClass = '';
  if (ev.kind === 'tier') {
    // The LEDGER, not the tier table. A run that began before the season opened
    // still earns the badge but banks nothing (XP_SYSTEM.md §4.5), and reading
    // the figure off CONSISTENCY_TIERS promised XP that never arrived.
    const paid = ev.habits.reduce((s, h) => s + tierPaid(h, ev.tierIndex), 0);
    badge = String(ev.tier.days); badgeLabel = 'DAYS';
    kicker = 'Consistency';
    title = ev.tier.name;
    sub = ev.tier.days + ' days of ' + nameList(ev.habits) + ' in a row. '
        + (paid > 0
            ? '+' + paid.toLocaleString() + ' XP, and the badge is yours for good.'
            : 'The badge is yours for good. The run started before ' + seasonName()
              + ', so it pays nothing this season.');
  } else if (ev.kind === 'quest') {
    badge = 'Q'; badgeLabel = 'QUEST'; codeClass = ' code';
    kicker = 'Quest complete';
    title = ev.quest.title;
    sub = ev.quest.note + '. +' + ev.quest.xp.toLocaleString() + ' XP.';
  } else if (ev.kind === 'milestone') {
    // Same rule as tiers: measureAch() counts all of history, bonusEvents() only
    // pays what was crossed inside the season, so ask the ledger what landed.
    const paid = milestonePaid(ev.ach.code);
    badge = ev.ach.code; badgeLabel = 'MILESTONE'; codeClass = ' code';
    kicker = 'Unlocked';
    title = ev.ach.name;
    sub = ev.ach.note + '. ' + (paid > 0
        ? '+' + paid.toLocaleString() + ' XP.'
        : 'Yours on your all-time record. The ' + ev.ach.xp.toLocaleString()
          + ' XP lands when you do it again inside ' + seasonName() + '.');
  } else {
    const n = live().length;
    badge = String(n); badgeLabel = n === 1 ? 'HABIT' : 'HABITS';
    kicker = 'Clean sweep';
    title = 'Perfect day';
    sub = 'Every habit you track, done. ' + dayXp(ev.id).toLocaleString() + ' XP today.';
  }
  return `
    <div class="lvwrap badge" data-k="cel:${esc(ev.kind)}:${esc(String(ev.id))}" ${on(dismissCelebration)}>
      <div class="lvstage">
        <div class="lvrays"></div>
        <div class="lvshock"></div>
        <div class="lvshards">${shardHtml()}</div>
        <div class="lvbadge"><span class="n${codeClass}">${esc(badge)}</span><span class="l">${esc(badgeLabel)}</span></div>
      </div>
      <div class="lvkicker">${esc(kicker)}</div>
      <div class="lvrank">${esc(title)}</div>
      <div class="lvsub">${esc(sub)}</div>
      <button class="lvgo">${UI.celebrate.length > 1 ? 'Next' : 'Continue'}</button>
      ${UI.celebrate.length > 1 ? `<div class="lvqueue">${UI.celebrate.length - 1} more to go</div>` : ''}
    </div>`;
}

// ── Habit row, shared by Today and Habits ─────────────────────────────────
// The best current run across the tracked habits. Used to decide which single
// ember animates; see the `.ember.lead` rules.
function leadStreak() {
  return live().reduce((m, h) => Math.max(m, habitStreak(h)), 0);
}
function habitRow(h, from, lead) {
  const v = valOf(AKEY(), h.id), done = isDone(h, AKEY()), st = habitStreak(h);
  const hl = habitLevel(h), flashed = UI.flash[h.id];
  const locked = !!h.locked && !done;
  const status = locked
    ? (h.lockedHint || 'Earned elsewhere.')
    : (h.kind === 'count'
        ? fmtVal(h, v) + ' of ' + fmtVal(h, h.target) + ' ' + h.unit
        : (done ? 'Done · ' + (h.goal || h.unit) : (h.goal || h.source)));
  const pc = Math.min(100, Math.round(v / h.target * 100));
  const nudged = UI.idle === h.id && !done && !locked;
  return `<div class="hrow ${done ? 'done' : ''} ${locked ? 'locked' : ''}" data-k="row:${h.id}">
    <button class="checkcell" ${on(() => toggleHabit(h))} aria-label="${locked ? esc(h.name) + ' is earned in your programme' : 'Toggle ' + esc(h.name)}">
      ${locked
        ? `<span class="boxmark lock" aria-hidden="true">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
           </span>`
        : `<span class="boxmark ${done ? 'on' : ''}${nudged ? ' nudge' : ''}">${done ? TICK : ''}</span>`}
    </button>
    <button class="body" ${on(() => openHabit(h.id, from))}>
      <span class="line1">
        <span class="nm">${esc(h.name)}</span>
        <!-- One fact, the most interesting one available. "LV 10" sat on five
             of eight rows at once and told you nothing at a glance; the run is
             the number nobody wants to lose. Levels still announce themselves
             the moment they change, via the flash chip, which is when they
             actually matter — and Progress and the detail screen both carry
             the level permanently. -->
        ${flashed ? `<span class="lvchip" data-k="chip">LV ${flashed} ↑</span>`
                  : st > 0
                    ? `<span class="hlv" data-k="hlv"><span class="ember${st === lead && st > 0 ? ' lead' : ''}" data-lvl="${emberLevel(st)}">${st}<span class="u">DAY${st === 1 ? '' : 'S'}</span></span></span>`
                    : `<span class="hlv" data-k="hlv">LV ${hl.lv}</span>`}
      </span>
      <span class="status">${esc(status)}</span>
      ${h.kind === 'count'
        ? `<span class="track"><span data-fill style="width:${pc}%"></span></span>`
        : ''}
    </button>
    ${h.kind === 'count' && !h.locked ? `<button class="pluscell" ${on(() => bump(h))} aria-label="Add to ${esc(h.name)}">+</button>` : ''}
    ${locked ? `<button class="pluscell" ${on(goProgram)} aria-label="Open your programme">→</button>` : ''}
  </div>`;
}

// ── Today ─────────────────────────────────────────────────────────────────
// Four days, today first. The nudge and the at-risk warning are statements
// about now, so they stand down while you are filling in an earlier day —
// "drink three more glasses" is nonsense advice about last Saturday.
function dayStrip() {
  const active = AKEY();
  return `<div class="daystrip" data-k="daystrip">
    ${editableDays().map(k => {
      const p = dayPct(k), sel = k === active;
      return `<button class="daychip ${sel ? 'on' : ''} ${p >= 100 ? 'full' : ''}" data-k="dc:${k}"
        ${on(() => setDay(k))} aria-pressed="${sel}"
        aria-label="Log ${esc(dayLong(k))}, ${p}% done">
        <span class="dl">${dayShort(k)}</span>
        <span class="dp">${p}%</span>
        <span class="dbar"><span data-fill style="width:${p}%"></span></span>
      </button>`;
    }).join('')}
  </div>`;
}

// ── Roll call: writing today's line ───────────────────────────────────────
// Lives at the bottom of Today, under the habits, because the moment you are
// most likely to have something to say is the moment you have just logged.
function renderNoteBox() {
  if (window.IS_DEMO) return '';
  if (!CFG.onBoard) {
    return `<div class="block notebox" data-k="notejoin" style="border-top:2px solid var(--divider)">
      <div class="eyebrow" style="letter-spacing:.12em">Roll call</div>
      <div style="font-size:13px;line-height:1.5;color:var(--muted)">
        Every athlete gets one sentence a day, and everyone else sees it. Join the
        board and you can leave yours — it uses the same name and nothing more.
      </div>
      <button class="btn btn-secondary btn-block" ${on(() => go('board'))}>Take a look at the board</button>
    </div>`;
  }
  const posted = myNote(TKEY());
  // null means "no draft yet, show what is posted". Plain '' is a real draft —
  // the athlete clearing the box on purpose — and must not snap back.
  const draft = UI.note === null ? posted : UI.note;
  const left = NOTE_MAX - draft.length;
  const changed = draft.trim() !== posted;
  return `<div class="block notebox" data-k="notebox" style="border-top:2px solid var(--divider)">
    <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
      <span>Roll call</span><span>${posted ? 'ANSWERED' : 'ONE SENTENCE'}</span>
    </div>
    <div class="noteq" data-k="noteq">${esc(pickLine('prompt', 'rollcall'))}</div>
    <input class="input" id="dayline" maxlength="${NOTE_MAX}" data-k="dayline"
           placeholder="Say something about today…" value="${esc(draft)}"
           aria-label="Your line for today">
    <div class="noterow">
      <span class="mono ${left <= 20 ? 'tight' : ''}">${left}</span>
      <div style="display:flex;gap:8px">
        ${posted ? `<button class="btn btn-secondary" style="padding:0 12px"
          ${on(() => postNote(''))}>Delete</button>` : ''}
        <button class="btn btn-primary" style="padding:0 16px"
          ${UI.noteBusy || !changed ? 'disabled' : ''}
          ${on(() => postNote(draft))}>${posted ? 'Change it' : 'Post'}</button>
      </div>
    </div>
    <div style="font-size:11px;line-height:1.5;color:var(--muted-soft)">
      Everyone on the board sees this next to your name and today's percentage.
      Change it as often as you like until midnight — after that it stands.
    </div>
  </div>`;
}

function renderToday(LI, doneCount, pct) {
  const hs = live();
  const n = nudge();
  const past = editingPast();
  const risk = !past && n.risk;
  // The recap half of "nudge and recap": last seven days at a glance.
  const weekStart = addDays(today(), -6);
  const weekXp = xpBetween(weekStart, today());
  let goodDays = 0;
  for (let i = 0; i < 7; i++) if (dayQualifies(fmtKey(addDays(today(), -i)))) goodDays++;
  const ranked = hs.map(h => ({ h, w: habitWeek(h) })).sort((a, b) => b.w - a.w);
  const strongest = ranked[0], weakest = ranked[ranked.length - 1];

  return `
    <div data-k="screen:today" style="${screenAnim()}">
      <!-- The hero carries the LEVEL only. The day's own progress used to sit
           directly beneath it as a second green bar of identical shape, which
           read as one broken double-bar and stated a number the header and the
           day strip were both already showing. -->
      <div class="block hero-lv">
        <div style="display:flex;align-items:flex-end;gap:14px">
          <div class="figure" data-hero data-static data-num="lv" data-to="${LI.lv}" style="font-size:56px;line-height:.85">${LI.lv}</div>
          <div style="display:flex;flex-direction:column;gap:4px;padding-bottom:5px;min-width:0">
            <button class="ranklink" ${on(() => go('ranks'))} aria-label="See the rank ladder">
              ${rankIcon(LI.rank, 17)}
              <span class="hd" style="font-size:17px;line-height:1">${esc(LI.label)}</span>
              <span class="go">→</span>
            </button>
            <div style="font-size:12px;line-height:1.3;color:var(--muted)"><span data-static data-num="xp" data-to="${LI.xp}">${LI.xp.toLocaleString()}</span> XP · ${esc(LI.nextLabel)}</div>
          </div>
        </div>
        <div class="bar thin"><span data-fill style="width:${LI.pct}%"></span></div>
      </div>

      <!-- Day strip then habits, directly under the hero. The list is what the
           screen is FOR; it used to start ~1,400px down, behind the nudge and
           the quest block, so opening the app to log meant scrolling to log. -->
      ${dayStrip()}
      ${past ? `<div class="backfill" data-k="backfill">
        <div>
          <div class="eyebrow">Filling in</div>
          <div class="bf-day">${esc(dayLong(AKEY()))}</div>
        </div>
        <button ${on(() => setDay(TKEY()))}>Back to today</button>
      </div>` : ''}
      ${risk ? `<div class="riskbar" data-k="riskbar">Streak at risk · ${hs.length - doneCount} to go before midnight</div>` : ''}

      ${(() => { const lead = leadStreak(); return hs.map(h => habitRow(h, 'today', lead)).join(''); })()}

      ${past ? '' : `<div class="coachcard ${risk ? 'risk' : ''}" data-k="nudge">
        <div class="eyebrow">${risk ? 'While there is still time' : 'One nudge, as agreed'}</div>
        <div class="say" data-k="say:${esc(n.key)}" data-static data-type data-full="${esc(n.line)}">${esc(n.line)}</div>
        <button class="cta" ${on(() => (n.target ? openHabit(n.target, 'today') : go('progress')))}>${esc(n.cta)}</button>
      </div>`}

      ${renderQuestBlock()}

      ${past ? '' : renderNoteBox()}

      <div class="block" style="display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--divider)">
        <div class="eyebrow" style="letter-spacing:.12em">The last seven days</div>
        <div style="display:flex;gap:22px">
          <div><div class="figure" style="font-size:34px;line-height:.95"><span data-static data-num="goodDays" data-to="${goodDays}">${goodDays}</span><span style="font-size:16px;color:var(--muted)">/7</span></div>
            <div class="eyebrow" style="letter-spacing:.1em;margin-top:4px">Days on target</div></div>
          <div><div class="figure" data-static data-num="weekXp" data-to="${weekXp}" style="font-size:34px;line-height:.95">${weekXp.toLocaleString()}</div>
            <div class="eyebrow" style="letter-spacing:.1em;margin-top:4px">XP earned</div></div>
        </div>
        ${ranked.length > 1 ? `<div style="font-size:13px;line-height:1.5;color:var(--muted)">
          Strongest: <strong style="color:var(--ink)">${esc(strongest.h.name)}</strong> ${strongest.w}/7 ·
          weakest: <strong style="color:var(--ink)">${esc(weakest.h.name)}</strong> ${weakest.w}/7.
        </div>` : ''}
      </div>

      <div class="crosslink-wrap">
        <button class="crosslink" ${on(goProgram)}>
          <span class="crosslink-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6M6 5v14M18 5v14M21 9v6M6 12h12"/></svg>
          </span>
          <span class="crosslink-body">
            <span class="crosslink-title">Your training programme</span>
            <span class="crosslink-sub">Today's session, your plan and the library</span>
          </span>
          <span class="crosslink-go">→</span>
        </button>
      </div>

      <div style="padding:0 20px 30px;font-size:11px;line-height:1.5;color:var(--muted-soft)">
        Tap a habit's name for its history and rank. Steps, sleep, water and meals take a number — tap the +, or open the habit to log it.
      </div>
    </div>`;
}

// ── This week's quests ────────────────────────────────────────────────────
// Three targets that give the week a shape. Shown on Today under the nudge,
// because a quest only means anything while there is still week left to do it in.
function renderQuestBlock() {
  const run = activeQuestRun();
  if (!run) return '';                     // no run on — the block does not exist
  const qs = runQuests(run);
  if (!qs.length) return '';
  const prog = qs.map(q => ({ q, p: questProgress(q, run) }));
  const doneN = prog.filter(x => x.p.done).length;
  const left = runDaysLeft(run);
  const earned = prog.filter(x => x.p.done).reduce((s, x) => s + x.q.xp, 0);
  const onOffer = qs.reduce((s, q) => s + q.xp, 0);

  return `
    <div class="block" data-k="quests:${esc(run.start)}" style="display:flex;flex-direction:column;gap:12px;border-bottom:2px solid var(--divider)">
      <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
        <span>Quests</span>
        <span>${doneN} of ${qs.length} · ${left > 1 ? left + ' days left' : 'last day'}</span>
      </div>
      ${prog.map(({ q, p }) => `
        <div data-k="q:${esc(q.id)}" style="display:flex;gap:12px;align-items:center;${p.done ? '' : 'opacity:.92'}">
          <div class="hd" style="width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;
            ${p.done ? 'background:var(--accent);color:var(--bg);border:2px solid var(--accent)' : 'border:2px solid var(--box);color:var(--muted-soft)'}">
            ${p.done ? '<span style="width:17px;height:17px;display:block">' + TICK + '</span>' : 'Q'}
          </div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
              <span class="hd" style="font-size:15px;line-height:1">${esc(q.title)}</span>
              <span class="mono" style="flex:none;font-size:10px;font-weight:700;color:${p.done ? 'var(--clay-deep)' : 'var(--muted-soft)'}">+${q.xp}</span>
            </div>
            <div style="font-size:11px;line-height:1.3;color:var(--muted)">
              ${esc(q.note)} · <strong style="color:var(--ink)">${fmtQuestVal(q, p.have)} / ${fmtQuestVal(q, p.need)}</strong>
            </div>
            <div class="bar" style="height:4px;width:100%"><span data-fill style="width:${p.pct}%"></span></div>
          </div>
        </div>`).join('')}
      <div style="font-size:11px;line-height:1.4;color:var(--muted-soft)">
        ${doneN === qs.length
          ? 'Every quest cleared — ' + earned.toLocaleString() + ' XP banked.'
          : earned > 0
            ? earned.toLocaleString() + ' XP banked, ' + (onOffer - earned).toLocaleString() + ' still on the table. This run ends ' + esc(runEndLabel(run)) + '.'
            : onOffer.toLocaleString() + ' XP on the table. This run ends ' + esc(runEndLabel(run)) + ', finished or not.'}
      </div>
    </div>`;
}
function runEndLabel(run) {
  return parseKey(runEndKey(run)).toLocaleDateString('en-GB', { weekday: 'long' });
}
// Big counter totals read better rounded; day counts are just numbers.
function fmtQuestVal(q, v) {
  return String(q.kind || '').indexOf('total:') === 0 ? Math.round(v).toLocaleString() : Math.round(v);
}

// ── Progress — habits and achievements in one tab ─────────────────────────
// These were two views of the same question ("how am I doing"), so they are
// one screen: overall level, then every habit's own rank, then the milestones.
function renderProgress(LI, earned, totalAch) {
  const hs = live(), off = offHabits();
  const dayStreakNow = currentDayStreak(), bestStreak = bestDayStreak(), lead = leadStreak();
  const daysLogged = seasonDays().filter(k => dayPct(k) > 0).length;
  const perfectDays = seasonDays().filter(isPerfect).length;
  return `
    <div data-k="screen:progress" style="${screenAnim()}">
      <!-- Progress used to open with the SAME 76px level hero as Today, so two
           of the four tabs began with an identical block. The level still
           belongs here as context, but not as the headline — the headline is
           the season, which is the question this tab answers. -->
      <button class="lvstrip" data-k="lvstrip" ${on(() => go('ranks'))} aria-label="See the rank ladder">
        <span class="lvstrip-num hd">LV ${LI.lv}</span>
        <span class="lvstrip-mid">
          <span class="lvstrip-top">
            ${rankIcon(LI.rank, 14)}
            <span class="hd" style="font-size:14px;line-height:1">${esc(LI.label)}</span>
            <span class="go">→</span>
          </span>
          <span class="bar thin"><span data-fill style="width:${LI.pct}%"></span></span>
        </span>
        <span class="lvstrip-next mono">${LI.toNext.toLocaleString()}<span> TO GO</span></span>
      </button>

      <!-- Days-logged leads on purpose. Streak and perfect-days are both zero
           for anyone rebuilding, and opening your progress on a pair of zeros
           is a punishment for having had a bad week. Showing up is the stat
           that is almost always positive, and it is the one that earns the rest. -->
      <div class="statgrid">
        <div><div class="figure" data-static data-num="logged" data-to="${daysLogged}">${daysLogged}</div>
          <div class="eyebrow">Days logged</div></div>
        <div><div class="hd statfrac"><span data-static data-num="unlocked" data-to="${earned}">${earned}</span><span class="of">/${totalAch}</span></div>
          <div class="eyebrow">Badges</div></div>
        <div><div class="figure" data-static data-num="streak" data-to="${dayStreakNow}">${dayStreakNow}</div>
          <div class="eyebrow">Day streak${bestStreak > dayStreakNow ? ' · best ' + bestStreak : ''}</div></div>
        <div><div class="figure" data-static data-num="perfect" data-to="${perfectDays}">${perfectDays}</div>
          <div class="eyebrow">Perfect days</div></div>
      </div>

      ${sectionLabel('Your habits', 'Tap for history')}
      <div class="pipkey">
        <span class="pips">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</span>
        <span>One square per consistency tier — ${CONSISTENCY_TIERS.map(t => t.days).join(', ')} days in a row on that habit.</span>
      </div>
      ${hs.length ? hs.map(h => {
        const hl = habitLevel(h), c = consistencyFor(h), st = habitStreak(h), done = isDone(h);
        return `<button class="row-rule" data-k="prow:${h.id}" style="width:100%;text-align:left;display:flex;gap:14px;align-items:center;padding:14px 20px;${done ? 'background:var(--accent-100);' : ''}"
          ${on(() => openHabit(h.id, 'progress'))}>
          <div class="hd" style="width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--accent);color:var(--bg)">${hl.lv}</div>
          <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
              <span class="hd" style="font-size:16px;line-height:1">${esc(h.name)}</span>
              <span class="hlv">${st > 0 ? `<span class="ember${st === lead ? ' lead' : ''}" data-lvl="${emberLevel(st)}">${st}<span class="u">DAY${st === 1 ? '' : 'S'}</span></span>` : '—'}</span>
            </div>
            <!-- Was rank · XP · today's status, which wrapped to two lines and
                 restated what Today already says. Progress is about standing. -->
            <div style="font-size:11px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(hl.label)} · ${hl.xp.toLocaleString()} XP</div>
            <div class="bar" style="height:4px;width:100%"><span data-fill style="width:${hl.pct}%"></span></div>
          </div>
          <div class="pips" style="flex:none">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i < c.tier ? 'on' : ''}" title="${t.days} days"></i>`).join('')}</div>
        </button>`;
      }).join('') : `<div style="padding:18px 20px;font-size:13px;color:var(--muted)">Nothing tracked yet. Switch habits on in Settings.</div>`}

      ${off.length ? sectionLabel('Paused', 'Turn on in Settings') +
        off.map(h => `<div class="row-rule" style="display:flex;gap:14px;align-items:center;padding:13px 20px;opacity:.45">
          <div class="hd" style="width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid var(--box)">${habitLevel(h).lv}</div>
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
            <div class="hd" style="font-size:16px;line-height:1">${esc(h.name)}</div>
            <div style="font-size:11px;line-height:1.3;color:var(--muted)">Paused · ${habitLevel(h).xp.toLocaleString()} XP banked</div>
          </div>
        </div>`).join('') : ''}

      ${sectionLabel('Milestones')}
      ${ACHIEVEMENTS.map(a => {
        const have = measureAch(a), got = have >= a.need;
        return `<div class="row-rule" style="display:flex;gap:14px;align-items:center;padding:15px 20px;opacity:${got ? '1' : '.45'}">
          <div class="hd" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;
            ${got ? 'background:var(--accent);color:var(--bg);border:2px solid var(--accent)' : 'border:2px solid rgba(128,128,128,.5)'}">${a.code}</div>
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
            <div class="hd" style="font-size:15px;line-height:1">${esc(a.name)}</div>
            <div style="font-size:11px;line-height:1.3;color:var(--muted)">${esc(a.note)}</div>
          </div>
          <div style="flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end">
            <div class="mono" style="font-size:11px;color:${got ? 'var(--clay-deep)' : 'var(--muted-soft)'}">+${a.xp} XP</div>
            <div class="mono" style="font-size:8px;letter-spacing:.08em;color:var(--muted-soft)">${got ? 'UNLOCKED' : have + '/' + a.need}</div>
          </div>
        </div>`;
      }).join('')}

      <div style="padding:18px 20px 34px;font-size:11px;line-height:1.5;color:var(--muted-soft)">
        The number beside a habit is your level in it — it climbs with how often you do it, not how hard it is. The five squares are consistency tiers, from a 5-day run up to two months.
      </div>
    </div>`;
}

// ── Habit detail ──────────────────────────────────────────────────────────
function renderDetail(h) {
  const cells = [];
  for (let i = 34; i >= 0; i--) {
    const k = fmtKey(addDays(today(), -i)), v = valOf(k, h.id);
    cells.push(v >= h.target ? 'hit' : (v > 0 ? 'part' : ''));
  }
  const logRows = [];
  for (let i = 1; i <= 5; i++) {
    const d = addDays(today(), -i), k = fmtKey(d), v = valOf(k, h.id), hit = v >= h.target;
    logRows.push({
      day: i === 1 ? 'YESTERDAY' : d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric' }).toUpperCase(),
      note: h.kind === 'count' ? fmtVal(h, v) + ' ' + h.unit + ' logged' : (hit ? 'Logged in the app' : 'Nothing logged'),
      val: hit ? 'HIT' : 'MISS', hit, xp: xpFor(h, v)
    });
  }
  // Units sit inside the figure at a smaller size rather than being welded to
  // it — "3D" as 24px caps read as a token, not as three days.
  const unit = (n, u) => n + '<span class="su">' + u + '</span>';
  const stats = [
    { v: unit(habitWeek(h), '/7'),          k: 'This week' },
    { v: unit(habitBest(h), habitBest(h) === 1 ? 'day' : 'days'), k: 'Best streak' },
    { v: unit(habitRate35(h), '%'),         k: 'Last 35 days' }
  ];
  const hl = habitLevel(h), con = consistencyFor(h), done = isDone(h, AKEY());
  const v = valOf(AKEY(), h.id);
  return `
    <div data-k="screen:detail:${h.id}" style="${screenAnim()}">
      <div class="block" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:flex-end;gap:14px">
          <div class="figure" data-hero data-static data-num="hlv:${h.id}" data-to="${hl.lv}" style="font-size:76px;line-height:.8">${hl.lv}</div>
          <div style="display:flex;flex-direction:column;gap:4px;padding-bottom:6px">
            <div class="hd" style="font-size:16px;line-height:1">${esc(hl.label)}</div>
            <div style="font-size:12px;line-height:1.3;color:var(--muted)"><span data-static data-num="hxp:${h.id}" data-to="${hl.xp}">${hl.xp.toLocaleString()}</span> XP banked · ${hl.toNext} to LV ${hl.lv + 1}</div>
          </div>
        </div>
        <div class="bar thin"><span data-fill style="width:${hl.pct}%"></span></div>
        <p style="margin:2px 0 0;font-size:13px;color:var(--muted)">${esc(QUIPS[h.id] || h.goal || '')}</p>
      </div>

      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
          <span>${editingPast() ? esc(dayLong(AKEY())) : 'Today'}</span><span>${done ? 'DONE' : fmtVal(h, v) + ' / ' + fmtVal(h, h.target) + ' ' + h.unit.toUpperCase()}</span>
        </div>
        ${h.locked
          ? `<div style="display:flex;flex-direction:column;gap:10px">
               <div style="font-size:13px;line-height:1.5;color:var(--muted)">${esc(h.lockedHint || '')}</div>
               <button class="btn btn-primary btn-block" ${on(goProgram)}>Open your programme</button>
             </div>`
          : `<div style="display:flex;gap:10px">
          <button class="btn ${done ? 'btn-secondary' : 'btn-primary'}" style="flex:1"
            ${on(() => (h.kind === 'count' ? openSheet(h) : toggleHabit(h)))}>${h.kind === 'count' ? 'Log a number' : (done ? 'Undo today' : 'Mark done')}</button>
          ${h.kind === 'count' && !done ? `<button class="btn btn-secondary" ${on(() => bump(h))}>+${h.step || 1}</button>` : ''}
        </div>`}
        <div style="font-size:11px;color:var(--muted-soft)">Worth ${baseXp(h)} XP a day · ${Math.round(baseXp(h) * XP_RULES.completionBonus)} XP when you finish it</div>
      </div>

      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
          <span>Consistency</span><span>${con.tier} of ${con.total}</span>
        </div>
        <!-- Was pips on the left and a right-aligned two-line block opposite
             them, which left "best run 3d" orphaned against the right margin
             and read as a layout accident. One column, one line each. -->
        <div class="pips">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i < con.tier ? 'on' : ''}" title="${t.days} days · ${tierXp(h, i)} XP"></i>`).join('')}</div>
        <div style="font-size:12.5px;line-height:1.5;color:var(--muted)">
          ${con.next
            ? 'Next: <strong style="color:var(--ink)">' + esc(con.next.name) + '</strong> at ' + con.next.days
              + ' days in a row · <strong style="color:var(--clay-deep)">+' + tierXp(h, con.tier) + ' XP</strong>'
            : '<strong style="color:var(--ink)">UNBREAKABLE</strong> — every tier cleared.'}
        </div>
        <div style="font-size:12px;line-height:1.4;color:var(--muted-soft)">
          Best run so far: ${con.best} day${con.best === 1 ? '' : 's'}${con.cur > 0 ? ' · on ' + con.cur + ' now' : ''}.
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:2px solid var(--divider)">
        ${stats.map((s, i) => `<div style="padding:14px 12px;${i < 2 ? 'border-right:1px solid var(--rule);' : ''}display:flex;flex-direction:column;gap:5px">
          <div class="hd statnum">${s.v}</div>
          <div class="eyebrow" style="letter-spacing:.1em">${esc(s.k)}</div>
        </div>`).join('')}
      </div>

      <!-- The grid had no anchoring at all: 35 identical squares with nothing
           saying which one is today, so the empty leading row read as broken
           rather than as "before you started". -->
      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="letter-spacing:.12em;display:flex;justify-content:space-between">
          <span>Last 35 days</span><span>${habitRate35(h)}% hit</span>
        </div>
        <div class="grid35">${cells.map((c, i) => `<div class="c ${c}${i === cells.length - 1 ? ' now' : ''}" style="animation-delay:${(i * 0.011).toFixed(3)}s"></div>`).join('')}</div>
        <div class="gridkey">
          <span>Five weeks ago</span>
          <span class="gk"><i class="c hit"></i>hit <i class="c part"></i>part <i class="c"></i>none</span>
          <span>Today</span>
        </div>
      </div>

      <div>
        ${logRows.map(l => `<div class="row-rule" style="padding:13px 20px;display:flex;justify-content:space-between;align-items:baseline;gap:12px">
          <span style="display:flex;flex-direction:column;gap:3px">
            <span class="hd" style="font-size:14px;line-height:1">${esc(l.day)}</span>
            <span style="font-size:11px;line-height:1;color:var(--muted)">${esc(l.note)}</span>
          </span>
          <span style="text-align:right">
            <span class="mono" style="display:block;font-size:10px;font-weight:700;color:${l.hit ? 'var(--clay-deep)' : 'var(--muted-soft)'}">${l.val}</span>
            <span class="mono" style="display:block;font-size:9px;color:var(--muted-soft);margin-top:3px">+${l.xp} XP</span>
          </span>
        </div>`).join('')}
      </div>

      <div style="padding:18px 20px 34px">
        <button class="btn btn-secondary btn-block" ${on(() => go(UI.from === 'today' ? 'today' : 'progress'))}>Back to ${UI.from === 'today' ? 'today' : 'progress'}</button>
      </div>
    </div>`;
}

// ── Leaderboard screen ────────────────────────────────────────────────────
function renderBoard() {
  const scopeBtn = (key, label) => `<button class="chip ${LB.scope === key ? 'chip-on' : ''}"
    ${on(() => { if (LB.scope !== key) { LB.scope = key; LB.loaded = false; fetchBoard(); } })}>${label}</button>`;
  const started = parseKey(seasonStart()).toLocaleDateString('en-GB', { day:'numeric', month:'long' });
  const dayOfSeason = Math.max(1, Math.round((today() - parseKey(seasonStart())) / 86400000) + 1);

  let body = '';
  if (LB.loading && !LB.rows.length) {
    body = `<div style="padding:26px 20px;display:flex;align-items:center;gap:12px">
      <span class="spinner" style="width:22px;height:22px;border-width:2px"></span>
      <span style="font-size:13px;color:var(--muted)">Scoring everyone…</span></div>`;
  } else if (LB.error === 'demo') {
    body = boardNote('The leaderboard is live for real athletes only — the demo has nobody to compete with.');
  } else if (LB.error === 'notdeployed') {
    body = boardNote('The leaderboard is not switched on yet. Your coach needs to run the leaderboard migration — nothing is wrong with your app.');
  } else if (LB.error === 'offline') {
    body = boardNote('No connection. The board needs signal — everything else in the app works offline.');
  } else if (LB.error) {
    body = boardNote('Could not load the board just now.') +
      `<div style="padding:0 20px 20px"><button class="btn btn-secondary" ${on(() => { LB.loaded = false; fetchBoard(); })}>Try again</button></div>`;
  } else if (!LB.rows.length) {
    body = boardNote('Nobody has joined yet. ' + seasonName() + ' is wide open — be first and set the pace.');
  } else {
    const top = LB.rows.filter(r => r.pos <= 10);
    const me = LB.rows.find(r => r.is_me);
    const outside = me && me.pos > 10;
    // Everyone's bar is drawn against the leader's score, so the gap is visible
    // rather than arithmetic.
    const lead = Math.max(1, ...LB.rows.map(r => Number(r.xp) || 0));
    body = `
      ${LB.passed.length ? `<div class="passline" data-k="passed">
        You passed ${esc(LB.passed.slice(0, 2).join(' and '))}${LB.passed.length > 2 ? ' and ' + (LB.passed.length - 2) + ' more' : ''} since you last looked.
      </div>` : ''}
      <div>
        ${top.map((r, i) => boardRow(r, lead, i)).join('')}
      </div>
      ${outside ? `<div class="eyebrow" style="padding:16px 20px 6px;letter-spacing:.12em">Your position</div>${boardRow(me, lead, top.length)}` : ''}`;
  }

  const viewBtn = (key, label) => `<button class="chip ${LB.view === key ? 'chip-on' : ''}"
    ${on(() => { if (LB.view !== key) { LB.view = key; render(); resetScroll();
                                       if (key === 'roll' && !RC.loaded) fetchRollCall(); } })}>${label}</button>`;

  return `
    <div data-k="screen:board" style="${screenAnim()}">
      <!-- The season name was printed twice within 200px (header eyebrow, then
           a heading) and the scope explainer took three permanent lines, so the
           board itself started ~470px down. Both switches now sit on one row
           and the explanation is one line under them. -->
      <div class="boardbar">
        <div class="chips">${viewBtn('board', 'Leaderboard')}${viewBtn('roll', 'Roll call')}</div>
        <div class="mono boardday">DAY ${dayOfSeason}</div>
      </div>
      ${LB.view === 'roll' ? renderRollCall() : `
        <div class="boardbar sub">
          <div class="chips">${scopeBtn('season', 'This season')}${scopeBtn('week', 'Past week')}</div>
        </div>
        <div class="boardnote">${LB.scope === 'week'
          ? 'Today and the six days before it. Server-scored from what you logged.'
          : 'Everything since ' + esc(started) + '. Server-scored from what you logged.'}</div>
        ${body}
        ${renderBoardJoin()}`}
    </div>`;
}

// ── Roll call: reading the wall ───────────────────────────────────────────
// Grouped by day, newest first, the coach's line leading its day. A day reads
// top-down as "here is the brief, here is who answered it".
function renderRollCall() {
  if (RC.loading && !RC.rows.length) {
    return `<div style="padding:26px 20px;display:flex;align-items:center;gap:12px">
      <span class="spinner" style="width:22px;height:22px;border-width:2px"></span>
      <span style="font-size:13px;color:var(--muted)">Reading the wall…</span></div>`;
  }
  if (RC.error === 'demo')        return boardNote('The wall is live for real athletes only — the demo has nobody to talk to.');
  if (RC.error === 'notdeployed') return boardNote('Roll call is not switched on yet. Your coach needs to run the migration — nothing is wrong with your app.');
  if (RC.error === 'offline')     return boardNote('No connection. The wall needs signal — everything else in the app works offline.');
  if (RC.error) {
    return boardNote('Could not load the wall just now.') +
      `<div style="padding:0 20px 20px"><button class="btn btn-secondary" ${on(() => { RC.loaded = false; fetchRollCall(); })}>Try again</button></div>`;
  }
  if (!RC.rows.length) {
    return boardNote(CFG.onBoard
      ? 'Nobody has said anything yet. One sentence on Today and you are the first voice on here.'
      : 'Nothing on the wall yet. Join the board and you can leave a line of your own.');
  }

  // The server already ordered this: day desc, coach first, then most recent.
  const days = [];
  RC.rows.forEach(r => {
    const d = days.length && days[days.length - 1].day === r.day ? days[days.length - 1] : null;
    if (d) d.rows.push(r); else days.push({ day: r.day, rows: [r] });
  });

  return days.map((g, gi) => `
    <div data-k="rcday:${esc(g.day)}">
      <div class="rcday">
        <span>${esc(rcDayLabel(g.day))}</span>
        <span class="mono">${g.rows.filter(r => !r.is_coach).length} IN</span>
      </div>
      ${g.rows.map((r, i) => rollLine(r, gi * 8 + i)).join('')}
    </div>`).join('');
}
function rcDayLabel(day) {
  if (day === TKEY()) return 'Today';
  if (day === fmtKey(addDays(today(), -1))) return 'Yesterday';
  return parseKey(day).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}
function rollLine(r, i) {
  const pct = (r.pct === null || r.pct === undefined) ? null : Number(r.pct);
  const meta = r.is_coach ? 'YOUR COACH'
             : [r.rank_label ? String(r.rank_label).toUpperCase() : '', pct === null ? '' : pct + '%']
                 .filter(Boolean).join(' · ');
  return `<div class="rcline ${r.is_coach ? 'coach' : ''} ${r.is_me ? 'me' : ''}"
      data-k="rc:${esc(r.day)}:${esc(String(r.display_name))}"
      style="animation-delay:${(Math.min(i, 12) * 0.04).toFixed(2)}s">
    <div class="rc-top">
      <span class="rc-name">${esc(r.is_me ? 'You' : r.display_name)}</span>
      <span class="rc-meta">${esc(meta)}</span>
    </div>
    <div class="rc-say">${esc(r.body)}</div>
  </div>`;
}
function boardNote(text) {
  return `<div style="padding:24px 20px;font-size:13px;line-height:1.55;color:var(--muted)">${esc(text)}</div>`;
}
function boardRow(r, lead, i) {
  const medal = r.pos <= 3;
  const pct = Math.max(2, Math.round((Number(r.xp) || 0) / (lead || 1) * 100));
  return `<div class="row-rule brow" data-k="brow:${esc(String(r.display_name || r.pos))}"

      ${(() => { const d = LB.deltas[r.display_name];
                 if (!d) return '';
                 return '<span class="mono delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲' : '▼') + Math.abs(d) + '</span>'; })()}

        <span class="hd" style="font-size:16px;line-height:1">${esc(r.is_me ? 'You' : r.display_name)}</span>
        <span class="mono" style="flex:none;font-size:13px;font-weight:700">${Number(r.xp || 0).toLocaleString()}<span style="font-size:9px;color:var(--muted-soft)"> XP</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;line-height:1.2;color:var(--muted)">

      <div class="bar" style="height:3px;width:100%"><span data-fill style="width:${pct}%"></span></div>
    </div>

}
// Joining is explicit and reversible, and the handle is theirs to choose —

// ── The manual ────────────────────────────────────────────────────────────
// Every number here is READ FROM THE LIVE CONSTANTS rather than typed out, so
// retuning XP_RULES, RANKS or CONSISTENCY_TIERS updates this page by itself and
// it can never quietly go out of date. If you change how something *works*
// (not just its number), update the prose here too — see HABITS.md.
function renderManual() {
  const hs = allHabits();
  const perfectDay = live().reduce((s, h) => s + Math.round(baseXp(h) * XP_RULES.completionBonus), 0);
  const cum = (L) => { let s = 0; for (let n = 1; n < L; n++) s += levelCost(XP_RULES.base, n); return s; };
  const water = habitById('water'), steps = habitById('steps');
  // Each heading carries an id so the contents list at the top can jump to it.
  // The manual is a dozen sections of prose; without a way in it is a wall you

  const h2 = (t) => `<div class="hd manh2" id="${slug(t)}">${t}</div>`;
  // Body copy is ink, not muted. Muted is right for a caption and wrong for

  const p = (t) => `<p class="manp">${t}</p>`;
  const block = (inner) => `<div class="block" style="display:flex;flex-direction:column">${inner}</div>`;
  const jump = (t) => `<button class="manlink" ${on(() => {
    const el = document.getElementById(slug(t));
    if (el) el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
  })}>${esc(t)}</button>`;
  const CONTENTS = ['The daily loop', 'Forgot to log a day?', 'Roll call', 'What each habit is worth',

                    'The leaderboard', 'Your data'];

  return `
    <div data-k="screen:manual" style="${screenAnim()}">
      <div class="block mancontents" data-k="mancontents">
        <div class="eyebrow" style="letter-spacing:.12em;margin-bottom:10px">Contents</div>
        <div class="manlinks">${CONTENTS.map(jump).join('')}</div>
      </div>
      ${block(h2('The daily loop') +
        p(`Tick off what you did today. Every habit is worth points, and points are the whole game — they build your level, your rank in each habit, and your place on the leaderboard.`) +
        p(`Clear the whole list and that is a <strong style="color:var(--ink)">perfect day</strong>, and the app will stop what it is doing to say so. It does the same for a new level, a rank promotion, a consistency tier and a milestone. Anything smaller than that just flashes in the row and gets out of your way.`) +
        p(`Nothing here needs a signal. Whatever you tick is saved on your phone straight away and sent up on its own when you're back online.`))}

      ${block(h2('Forgot to log a day?') +
        p(`Use the row of days at the top of Today. You can go back <strong style="color:var(--ink)">${BACKFILL_DAYS} days</strong> and fill in or correct anything you missed — each day shows how much of it you completed, so it is easy to spot the one you forgot.`) +

        p(`Older than ${BACKFILL_DAYS} days and the log is closed. That is on purpose: a record you can rewrite whenever you like is a diary, not proof. Filling a day in still counts for everything — points, streaks, badges, quests.`))}

      ${block(h2('Roll call') +
        p(`Once you're on the leaderboard you get <strong style="color:var(--ink)">one sentence a day</strong>, at the bottom of Today. Everyone else on the board sees it, next to your name, your rank and how much of that day you finished.`) +
        p(`Change it as many times as you like until midnight. After that it stands — you can fix an old day's <em>log</em>, but not what you said about it.`) +
        p(`It is worth <strong style="color:var(--ink)">no points at all</strong>, deliberately. It is not another box to tick; it is the one place in here where you get to say something. Read everyone else's on the Board tab.`) +

      ${block(h2('What each habit is worth') +

            <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
              <span class="hd" style="font-size:14px;line-height:1">${esc(h.name)}</span>

          </div>`).join('')}
        </div>` +
        `<div style="height:12px"></div>` +
        p(`<strong style="color:var(--ink)">Finishing pays more than nearly finishing.</strong> Habits you count — water, steps, sleep, meals — pay as you go, then add a bonus once you hit the target. ${water ? `${water.target / 2} of ${water.target} glasses earns ${xpFor(water, water.target / 2)} XP; all ${water.target} earns ${xpFor(water, water.target)} XP.` : ''}`) +
        p(`A perfect day is currently <strong style="color:var(--ink)">${perfectDay.toLocaleString()} XP</strong>.`) +
        p(`There is a ceiling on what a counter will take in one day — <strong style="color:var(--ink)">${XP_RULES.dailyCap}× the target</strong>${steps ? `, so ${fmtVal(steps, steps.target * XP_RULES.dailyCap)} steps` : ''}. Going past your target never paid extra anyway; the ceiling is there so a stuck thumb on the + button cannot hand you a quest you did not walk.`))}

      ${block(h2('How to earn more') +
        `<div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55;color:var(--muted)">
          <div>▸ <strong style="color:var(--ink)">Train.</strong> It is worth more than anything else on the list. You cannot tick it here — finish a session in your programme and it ticks itself, whether you got through all of it or not.</div>
          <div>▸ <strong style="color:var(--ink)">Finish what you start.</strong> The completion bonus means the last glass of water is worth more than the first.</div>
          <div>▸ <strong style="color:var(--ink)">Turn off what you'll never do.</strong> Points come from what you complete, so a habit you ignore only drags your daily percentage down. Switch it off in Settings.</div>
          <div>▸ <strong style="color:var(--ink)">Show up daily.</strong> Consistency tiers below are worth real points — up to ${(() => { const h = live()[0] || HABITS[0]; return CONSISTENCY_TIERS.reduce((s, t, i) => s + tierXp(h, i), 0).toLocaleString(); })()} XP on a single habit — and they only come from unbroken runs.</div>
          <div>▸ <strong style="color:var(--ink)">Go after the milestones.</strong> The nine on your Progress tab pay ${ACHIEVEMENTS.reduce((s, a) => s + a.xp, 0).toLocaleString()} XP between them, once each.</div>
        </div>`)}

      ${block(h2('Levels and ranks') +
        p(`Every level costs more than the one before it — ${levelCost(XP_RULES.base, 1).toLocaleString()} XP for level 2, ${levelCost(XP_RULES.base, 10).toLocaleString()} for level 11. One full day gets you to level 2. Level 20 is about two months of solid work (${cum(20).toLocaleString()} XP).`) +
        p(`There are <strong style="color:var(--ink)">${RANKS.length} ranks with ${SUBS_PER_RANK} levels each</strong>. Level ${SUBS_PER_RANK + 1} makes you ${esc(rankFor(SUBS_PER_RANK + 1).label)}, level 20 is ${esc(rankFor(20).label)}. Every rank has its own insignia — <strong style="color:var(--ink)">tap your rank anywhere in the app</strong> to see the whole ladder and what each one costs.`) +
        `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
          ${RANKS.map(r => `<span style="display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--rule);color:var(--muted)">
            ${rankIcon(r, 14, 'stroke-width:2.4')}<span class="mono" style="font-size:9px;letter-spacing:.06em">${esc(r)}</span>
          </span>`).join('')}
        </div>` +
        p(`Past level ${RANKS.length * SUBS_PER_RANK} you start again carrying a star — ${esc(rankFor(RANKS.length * SUBS_PER_RANK + 1).label)} — and there is no ceiling after that.`) +
        p(`<strong style="color:var(--ink)">Each habit has its own level too.</strong> They all climb at the same rate, so your level in a habit is really a measure of how often you do it. Drink water every day and train twice a week, and your water rank will leave your workout rank behind. That is the point.`))}

      ${(() => {
        const run = activeQuestRun(), qs = run ? runQuests(run) : [];
        if (!run || !qs.length) {
          return block(h2('Quests') +
            p(`From time to time your coach sets a <strong style="color:var(--ink)">run of quests</strong> — targets for the week rather than the day, worth real points on top of your habits.`) +
            p(`There are none running right now. When there are, they appear at the top of your Today screen with a countdown, and everybody on the app gets the same ones.`));
        }
        return block(h2('Quests') +
          p(`Your coach has a run going: <strong style="color:var(--ink)">${qs.length} quest${qs.length === 1 ? '' : 's'}</strong>, ending ${esc(runEndLabel(run))}. They are targets for the week rather than the day, and they expire when the run does, finished or not.`) +
          `<div style="display:flex;flex-direction:column;gap:0">
            ${qs.map(q => `<div class="row-rule" style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0">
              <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
                <span class="hd" style="font-size:14px;line-height:1">${esc(q.title)}</span>
                <span style="font-size:11px;color:var(--muted)">${esc(q.note)}</span>
              </span>
              <span class="mono" style="font-size:13px;font-weight:700;white-space:nowrap">+${q.xp}</span>
            </div>`).join('')}
          </div>` +
          `<div style="height:12px"></div>` +
          p(`Everybody gets the same quests, so the leaderboard stays fair. Each one pays once.`));
      })()}

      ${block(h2('Consistency') +
        p(`Each habit has ${CONSISTENCY_TIERS.length} tiers, earned on your longest run ever — so breaking a streak never takes a badge back.`) +
        p(`<strong style="color:var(--ink)">Clearing a tier pays.</strong> What it pays depends on the habit: a tier on your workout is worth more than the same tier on your supplements, because a day of it is worth more. The figures below are for ${esc((live()[0] || HABITS[0]).name.toLowerCase())}; open any habit to see its own.`) +
        `<div style="display:flex;flex-direction:column;gap:0">
          ${CONSISTENCY_TIERS.map((t, i) => `<div class="row-rule" style="display:flex;justify-content:space-between;align-items:baseline;padding:9px 0">
            <span class="hd" style="font-size:14px">${esc(t.name)}</span>
            <span style="display:flex;gap:10px;align-items:baseline;white-space:nowrap">

        p(`Only days from the start of the season earn points. Anything you logged before it still sits in your history and still counts toward your streaks and consistency badges — it just does not score.`) +
        p(`When a new season opens, <strong style="color:var(--ink)">every score goes back to zero</strong> and everyone starts together. Nothing is deleted, and your consistency badges stay yours.`))}

      ${block(h2('The leaderboard') +
        p(`It is <strong style="color:var(--ink)">off until you join</strong>. Nobody sees you before that.`) +
        p(`When you join you pick your own name — it does not have to be your real one. Other athletes see <strong style="color:var(--ink)">that name and your points</strong>. They never see your habits, your logs, your programme or anything else. You can rename yourself or leave whenever you like.`) +
        p(`There are two boards. <strong style="color:var(--ink)">This season</strong> is every point since ${esc(seasonName().toLowerCase())} opened. <strong style="color:var(--ink)">Past week</strong> is a rolling seven days, so a strong week always shows and anyone can win it.`) +
        p(`Your points are worked out on the server from what you have actually logged — so the board is honest, and there is nothing to gain from fiddling with your phone.`))}

      ${block(h2('Your data') +
        p(`Everything is saved to your phone the moment you tap it, then synced to your coach when you have a connection. Losing signal, closing the app or flying somewhere loses nothing.`) +
        p(`Your coach can see your habits as part of coaching you. Other athletes cannot — unless you join the leaderboard, and even then only your chosen name and points.`))}

      <div style="padding:4px 20px 34px">
        <button class="btn btn-secondary btn-block" ${on(() => go('settings'))}>Back to settings</button>
      </div>
    </div>`;
}

// ── The rank ladder ───────────────────────────────────────────────────────
// Every rank, its insignia, what it costs and where the athlete stands in it.
// Games always show you the road ahead; before this, Proof's road existed only
// inside a paragraph of the manual.
function renderRanks() {
  const LI = overallLevel(), cur = LI.rank;
  const curIdx = RANKS.indexOf(cur.name);
  // The last level of the current rank, and what it takes to clear the whole rank.
  const rankTop = (curIdx + 1) * SUBS_PER_RANK + cur.star * LEVELS_PER_CYCLE;
  const toRankUp = Math.max(0, cumXpTo(rankTop + 1) - LI.xp);
  const nextName = RANKS[(curIdx + 1) % RANKS.length];

  return `
    <div data-k="screen:ranks" style="${screenAnim()}">
      <div class="block" style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:16px">
          <div style="width:74px;height:74px;flex:none;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center">
            ${rankIcon(cur, 42)}
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
            <div class="eyebrow" style="letter-spacing:.14em">You are</div>
            <div class="hd" style="font-size:26px;line-height:1;letter-spacing:-.01em">${esc(cur.label)}</div>
            <div style="font-size:12px;line-height:1.3;color:var(--muted)">Level ${LI.lv} · ${LI.xp.toLocaleString()} XP</div>
          </div>
        </div>
        <div class="bar thin"><span data-fill style="width:${LI.pct}%"></span></div>
        <div style="font-size:13px;line-height:1.5;color:var(--muted)">
          ${toRankUp > 0
            ? `<strong style="color:var(--ink)">${toRankUp.toLocaleString()} XP</strong> and you are ${esc(nextName)}. That is about ${Math.max(1, Math.round(toRankUp / Math.max(1, perfectDayXp())))} good day${Math.max(1, Math.round(toRankUp / Math.max(1, perfectDayXp()))) === 1 ? '' : 's'}.`
            : `You have cleared every rank in this cycle. Level ${rankTop + 1} starts the ladder again with a star.`}
        </div>
      </div>

      <div class="eyebrow" style="padding:18px 20px 8px;letter-spacing:.12em;display:flex;justify-content:space-between">
        <span>The ladder</span><span>${RANKS.length} ranks · ${SUBS_PER_RANK} levels each</span>
      </div>

      ${RANKS.map((name, i) => {
        const first = i * SUBS_PER_RANK + 1, last = (i + 1) * SUBS_PER_RANK;
        const here = curIdx === i;
        const passed = cur.star > 0 || curIdx > i;
        const cls = here ? 'here' : (passed ? 'passed' : 'locked');
        // Within the current rank, how many sub-levels are cleared.
        const subsOn = here ? cur.sub : (passed ? SUBS_PER_RANK : 0);
        const cost = cumXpTo(first + cur.star * LEVELS_PER_CYCLE);
        return `<div class="rankrow ${cls}">
          <div class="badge">${rankIcon(name, 26)}</div>
          <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
              <span class="nm">${esc(name)}</span>
              <span class="tag">${here ? 'YOU ARE HERE' : (passed ? 'CLEARED' : cost.toLocaleString() + ' XP')}</span>
            </div>
            <div class="meta">Levels ${first}–${last}${here ? ' · you are on ' + cur.sub + ' of ' + SUBS_PER_RANK : ''}</div>
            <div class="subs">${Array.from({ length: SUBS_PER_RANK }, (_, s) => `<i class="${s < subsOn ? 'on' : ''}"></i>`).join('')}</div>
          </div>
        </div>`;
      }).join('')}

      <div class="block" style="display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--divider)">
        <div class="hd" style="font-size:20px;line-height:1">Past ${RANKS.length * SUBS_PER_RANK}: the star</div>
        <div style="font-size:13px;line-height:1.55;color:var(--muted)">
          Clear ${esc(RANKS[RANKS.length - 1])} ${SUBS_PER_RANK} and the ladder starts again carrying a star —
          <strong style="color:var(--ink)">${esc(rankFor(LEVELS_PER_CYCLE + 1).label)}</strong>, then
          <strong style="color:var(--ink)">${esc(rankFor(LEVELS_PER_CYCLE * 2 + 1).label)}</strong>, and on forever.
          There is no ceiling. The star is the real flex.
        </div>
      </div>

      <div style="padding:18px 20px 34px;display:flex;flex-direction:column;gap:12px">
        <button class="btn btn-primary btn-block" ${on(shareRankCard)}>Share your rank</button>
        <div style="font-size:11px;line-height:1.5;color:var(--muted-soft)">
          Ranks come from your overall level, which is every point you have earned this season —
          habits, quests, consistency tiers and milestones together. Each habit also carries its
          own rank on the same ladder.
        </div>
        <button class="btn btn-secondary btn-block" ${on(() => go('manual'))}>How the points work</button>
      </div>
    </div>`;
}
// ── The shareable rank card ───────────────────────────────────────────────
// 1080×1080, drawn on a canvas so it can be shared straight out of the app. The
// insignia is the SAME path data the app draws, run through Path2D — one source
// of truth, so a rank can never look different on the card than it does in here.
// Brand rules apply: green ground, paper type, clay-2 as the only accent, hard
// edges, Barlow Condensed uppercase.
const CARD = { green:'#0E4A36', paper:'#FAF7F2', clay2:'#E06B43', ink:'#1A1A1A' };
async function buildRankCard() {
  const S = 1080, LI = overallLevel(), r = LI.rank;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const x = c.getContext('2d');
  // `fonts.ready` alone is not enough: a face the page has never painted at that
  // weight may not be downloaded yet, and canvas silently falls back to a system
  // sans — which is exactly how a brand card stops looking like the brand. Ask
  // for each face explicitly and wait for it.
  try {
    if (document.fonts && document.fonts.load) {
      await Promise.all([
        document.fonts.load('900 132px "Barlow Condensed"'),
        document.fonts.load('900 86px "Barlow Condensed"'),
        document.fonts.load('900 32px "Barlow Condensed"'),
        document.fonts.load('700 26px "Space Mono"'),
        document.fonts.load('700 20px "Space Mono"'),
        document.fonts.load('500 34px "Barlow"'),
        document.fonts.load('400 26px "Barlow"')
      ]);
    }
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
  } catch (e) { /* fall back to system type rather than no card at all */ }

  x.fillStyle = CARD.green; x.fillRect(0, 0, S, S);
  // A quiet grid of hairlines — texture without a gradient or a glow.
  x.strokeStyle = 'rgba(250,247,242,0.055)'; x.lineWidth = 2;
  for (let i = 1; i < 9; i++) {
    x.beginPath(); x.moveTo(i * S / 9, 0); x.lineTo(i * S / 9, S); x.stroke();
    x.beginPath(); x.moveTo(0, i * S / 9); x.lineTo(S, i * S / 9); x.stroke();
  }
  const PAD = 88;
  // Eyebrow
  x.fillStyle = CARD.clay2;
  x.font = '700 26px "Space Mono", monospace';
  x.letterSpacing = '6px';
  x.fillText('PROOF · AA PERFORMANCE', PAD, PAD + 26);
  x.letterSpacing = '0px';

  // Insignia in a paper square, drawn from RANK_ART via Path2D.
  const box = 260, bx = PAD, by = 210;
  x.fillStyle = CARD.paper; x.fillRect(bx, by, box, box);
  x.save();
  const g = 150;                                   // glyph size inside the square
  x.translate(bx + (box - g) / 2, by + (box - g) / 2);
  x.scale(g / 24, g / 24);
  x.strokeStyle = CARD.green; x.lineWidth = 2; x.lineCap = 'square'; x.lineJoin = 'miter';
  x.stroke(new Path2D(RANK_ART[r.name] || RANK_ART.ROOKIE));
  x.restore();

  // Rank, big.
  x.fillStyle = CARD.paper;
  x.font = '900 132px "Barlow Condensed", sans-serif';
  x.fillText(r.label.toUpperCase(), PAD, by + box + 148);
  x.fillStyle = 'rgba(250,247,242,0.72)';
  x.font = '500 34px "Barlow", sans-serif';
  x.fillText('Level ' + LI.lv + ' · ' + LI.xp.toLocaleString() + ' XP', PAD, by + box + 200);

  // Three facts, on a rule.
  // Three facts that are always worth showing. Deliberately not "today's %" —
  // that reads as 12% for most of the day and this card gets shared.
  const stats = [
    [String(currentDayStreak()), 'DAY STREAK'],
    [String(allHabits().reduce((s, h) => s + consistencyFor(h).tier, 0)), 'BADGES'],
    [String(seasonDays().filter(isPerfect).length), 'PERFECT DAYS']
  ];
  const ry = S - PAD - 210;
  x.strokeStyle = 'rgba(250,247,242,0.3)'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(PAD, ry); x.lineTo(S - PAD, ry); x.stroke();
  stats.forEach((st, i) => {
    const sx = PAD + i * ((S - PAD * 2) / 3);
    x.fillStyle = CARD.paper;
    x.font = '900 86px "Barlow Condensed", sans-serif';
    x.fillText(st[0], sx, ry + 92);
    x.fillStyle = CARD.clay2;
    x.font = '700 20px "Space Mono", monospace';
    x.letterSpacing = '3px';
    x.fillText(st[1], sx, ry + 128);
    x.letterSpacing = '0px';
  });

  // Sign-off.
  x.fillStyle = CARD.paper;
  x.font = '900 32px "Barlow Condensed", sans-serif';
  x.fillText('@AMIRARDEKANIAN', PAD, S - PAD);
  x.fillStyle = 'rgba(250,247,242,0.55)';
  x.font = '400 26px "Barlow", sans-serif';
  const site = 'AMIRARDEKANI.COM';
  x.fillText(site, S - PAD - x.measureText(site).width, S - PAD);

  return new Promise(res => c.toBlob(res, 'image/png'));
}
async function shareRankCard() {
  const LI = overallLevel();
  try {
    const blob = await buildRankCard();
    if (!blob) { toast('Could not build the card on this phone.'); return; }
    const file = new File([blob], 'proof-rank.png', { type: 'image/png' });
    const text = LI.rank.label + ' · level ' + LI.lv + ' on Proof.';
    // Share sheet where it exists (iOS and Android both do), download otherwise.
    if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      await navigator.share({ files: [file], text: text });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'proof-rank.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Card saved to your downloads.');
  } catch (e) {
    // A cancelled share sheet throws AbortError — that is not a failure.
    if (e && e.name === 'AbortError') return;
    toast('Could not share the card just now.');
  }
}

// A perfect day at the current weights — used to translate XP into days.
function perfectDayXp() {
  return live().reduce((s, h) => s + Math.round(baseXp(h) * XP_RULES.completionBonus), 0);
}

// ── Log sheet ─────────────────────────────────────────────────────────────
function renderSheet() {
  const h = habitById(UI.sheet);
  const stepBy = h.step || 1;
  const cap = capFor(h), atCap = UI.sheetVal >= cap;
  return `
    <div class="scrim" data-k="scrim" ${on(() => { UI.sheet = null; render(); })}></div>
    <div class="sheet" data-k="sheet:${h.id}">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div class="hd" style="font-size:21px;line-height:1">Log ${esc(h.name)}${editingPast() ? ' · ' + esc(dayLong(AKEY())) : ''}</div>
        <button class="hd" style="font-size:13px;color:var(--clay-deep)" ${on(() => { UI.sheet = null; render(); })}>Close</button>
      </div>
      <div style="font-size:13px;line-height:1.4;color:var(--muted)">${atCap
        ? fmtVal(h, cap) + ' ' + esc(h.unit) + ' is the most this will take in a day. Anything past that is not a number, it is a typo.'
        : 'Target is ' + fmtVal(h, h.target) + ' ' + esc(h.unit) + ' a day. Round up generously, I will never know.'}</div>
      <div class="stepper">
        <button class="minus" ${on(() => { UI.sheetVal = Math.max(0, UI.sheetVal - stepBy); render(); })}>–</button>
        <div class="val">
          <span class="figure" style="font-size:36px;line-height:1">${fmtVal(h, UI.sheetVal)}</span>
          <span class="eyebrow">${esc(h.unit)}</span>
        </div>
        <button class="plus" ${on(() => { UI.sheetVal = Math.min(cap, UI.sheetVal + stepBy); render(); })}>+</button>
      </div>
      <button class="btn btn-primary btn-block" ${on(() => {
        const before = habitXp(h), rect = UI._tapRect, logged = UI.sheetVal;
        setVal(h.id, logged);
        UI.sheet = null;
        checkLevelUps();
        render();
        const gained = Math.max(0, habitXp(h) - before);
        haptic(logged >= h.target ? 'done' : 'tick');
        toast(h.name + ' updated' + dayTag() + ' · +' + gained + ' XP.');
        flyXp(gained, rect);
      })}>Save it</button>
    </div>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error').classList.add('on');
}
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('client');
  const clientKey = params.get('key');
  if (!clientId) {
    showError('No client specified.\n\nOpen this page from your personal link:\nhabits.html?client=your_id');
    return;
  }
  try {
    const res = await fetch('data/' + encodeURIComponent(clientId) + '.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ATHLETE = (await res.json()).athlete || {};
  } catch (e) {
    showError('Could not load data for "' + clientId + '".\n\nCheck your link, or ask your coach for a fresh one.');
    return;
  }
  ATHLETE_ID = ATHLETE.id || clientId;
  ATHLETE_NAME = [ATHLETE.firstName, ATHLETE.lastName].filter(Boolean).join(' ');

  // Same 3-tier key resolution as program.html: URL → device copy → program JSON.
  if (!window.IS_DEMO) {
    const ks = ATHLETE_ID + '_skey';
    try {
      KEY = clientKey || localStorage.getItem(ks) || ATHLETE.key || null;
      if (KEY) localStorage.setItem(ks, KEY);
    } catch (e) { KEY = clientKey || ATHLETE.key || null; }
  }

  loadLocal();
  await syncFromCloud();
  // Which season we are in decides what scores, so settle that before anything
  // reads XP — including the workout import, which must not reach back further.
  await fetchSeason();
  await fetchQuests();
  // Sessions finished in the training app tick the WORKOUT habit here. The
  // dates come from the server, not from the other app's storage.
  importWorkoutDays(await fetchWorkoutDays());
  // Levels that arrived with a sync still get their moment; a first run (or a
  // changed XP system) only re-baselines, so nobody is ambushed by a queue.
  checkLevelUps();
  if (CFG.dark) document.body.setAttribute('data-dark', '');
  document.title = 'Proof — ' + (ATHLETE.firstName || 'AA Performance');

  render();
  armIdle();
  document.getElementById('loading').classList.add('hidden');

  // Anything still unsent from a previous session goes up now.
  if (SYNC.dirty) pushNow();

  window.addEventListener('online', () => { SYNC.attempts = 0; pushNow(); refreshSyncBadge(); });
  window.addEventListener('offline', refreshSyncBadge);
  // Coming back to the app is a fresh start: never resume pointed at an
  // earlier day, or the first tap after lunch quietly lands on Saturday.
  window.addEventListener('visibilitychange', () => {
    if (document.hidden) pushNow();
    else { if (UI.day) { UI.day = null; render(); } refreshSyncBadge(); }
  });
  // Last-ditch attempt on the way out; keepalive is not available through the
  // client library, so this is best effort on top of the durable dirty flag.
  window.addEventListener('pagehide', () => { if (SYNC.dirty) pushNow(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>
