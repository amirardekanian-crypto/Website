          <span class="hd" style="font-size:19px;color:var(--clay-deep);flex:none">→</span>
        </button>`}

      <!-- A pointer, not a second copy. The compose box itself lives in CREW
           with the feed it posts to; this row exists so an athlete who only
           ever opens Today still discovers there is a conversation. It shows
           only while today's line is unwritten, so it disappears once done. -->
      ${past || window.IS_DEMO || myNote(TKEY()) ? '' : `
        <button class="rcprompt" data-k="rcprompt" ${on(() => go('crew'))}>
          <span>
            <span class="eyebrow">Roll call</span>
            <span class="rcq">${esc(pickLine('prompt', 'rollcall'))}</span>
          </span>
          <span class="hd" style="font-size:19px;color:var(--clay-deep);flex:none">→</span>
        </button>`}

      <div class="block" style="display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--divider)">
        <div class="eyebrow" style="letter-spacing:.12em">The last seven days</div>
        <div style="display:flex;gap:22px">
          <div><div class="figure" style="font-size:34px;line-height:.95"><span data-static data-num="goodDays" data-to="${goodDays}">${goodDays}</span><span style="font-size:16px;color:var(--muted)">/7</span></div>
            <div class="eyebrow" style="letter-spacing:.1em;margin-top:4px">Days on target</div></div>
          <div><div class="figure" data-static data-num="weekXp" data-to="${weekXp}" style="font-size:34px;line-height:.95">${weekXp.toLocaleString()}</div>
            <div class="eyebrow" style="letter-spacing:.1em;margin-top:4px">XP earned</div></div>
        </div>
        <!-- Only once there is something to rank. On a week with nothing in it
             every habit is 0/7, so this named a "strongest" and a "weakest" out
             of an eight-way tie — on day one, to someone who has not logged
             anything yet, which reads as the app having already judged them. -->
        <!-- The heat map replaces the "strongest / weakest" sentence, which
             named two habits out of eight and said nothing about the other six.
             The grid says the same thing and the rest of it at once, and it
             does not have to pick a loser to make its point. -->
        ${heatRows.length && strongest.w > 0 ? `<div class="heat" data-k="heat">
          <div class="hr">
            <span></span>
            ${heatDays.map(k => `<span class="hd-lbl ${k === TKEY() ? 'now' : ''}">${k === TKEY() ? 'TDY' : parseKey(k).toLocaleDateString('en-GB', { weekday:'short' }).slice(0, 2).toUpperCase()}</span>`).join('')}
          </div>
          ${heatRows.map(r => `<div class="hr">
            <span class="hl" title="${esc(r.h.name)}">${esc(shortName(r.h))}</span>
            ${r.cells.map((c, i) => `<span class="hc ${c} ${i === 6 ? 'today' : ''}"></span>`).join('')}
          </div>`).join('')}
        </div>` : `<div style="font-size:13px;line-height:1.5;color:var(--muted)">
          Nothing in the last seven days yet. Tick one thing and this fills up.
        </div>`}
      </div>

      <div class="crosslink-wrap">
        <!-- For a free user this pointed at a programme that does not exist. It
             is now the one place in the app that mentions coaching, and it says
             the same thing the locked WORKOUT row says: the training habit is
             the biggest one here and it comes with a programme. -->
        <button class="crosslink" ${on(() => (isFree() ? (window.location.href = '/form.html') : goProgram()))}>
          <span class="crosslink-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6M6 5v14M18 5v14M21 9v6M6 12h12"/></svg>
          </span>
          <span class="crosslink-body">
            <span class="crosslink-title">${isFree() ? 'Want the training too?' : 'Your training programme'}</span>
            <span class="crosslink-sub">${isFree()
              ? 'A programme built for you — and WORKOUT stops being locked'
              : "Today's session, your plan and the library"}</span>
          </span>
          <span class="crosslink-go">→</span>
        </button>
      </div>

    </div>`;
}

// ── This week's quests ────────────────────────────────────────────────────
// Three targets that give the week a shape. Shown on Today under the nudge,
// because a quest only means anything while there is still week left to do it in.
// Between runs the block used to vanish completely, which kept "seeing quests
// means something is on" true but made the whole feature invisible: an athlete
// who joined between runs never learned quests existed, so the next one read as
// random rather than as an event they had been waiting for. One quiet line
// instead — a fraction of the height of a live block, so a real run still lands.
// Between runs this stays visible rather than vanishing. The block disappearing
// entirely kept "seeing quests means something is on" true, but made the whole
// feature invisible — an athlete who joined between runs never learned quests
// existed, and the next one read as random rather than as an event.
function renderQuestsIdle() {
  return `<div class="questidle" data-k="questidle">
    <span>None running right now. Your coach sets these a week at a time — when one is on it appears here, worth real points on top of your habits.</span>
  </div>`;
}
// Quests wear the EVENT card. Amir picked that design out by name and asked for
// it here — which is right beyond the aesthetics: a quest run and an event are
// the same object at two lengths (a set of goals, a clock, a reward), and they
// were drawn as two unrelated things. One card, two spans: seven days and
// twenty-eight.
//
// It lives on PROGRESS, above the events, and no longer on Today. Today is for
// logging; a block of week-long targets there was commentary sitting above the
// list, and it pushed the habits down for something nobody acts on mid-tap.
function renderQuestBlock() {
  const run = activeQuestRun();
  if (!run) return renderQuestsIdle();
  const qs = runQuests(run);
  if (!qs.length) return renderQuestsIdle();
  const prog = qs.map(q => ({ q, p: questProgress(q, run) }));
  const doneN = prog.filter(x => x.p.done).length, allDone = doneN === qs.length;
  const left = runDaysLeft(run);
  const earned = prog.filter(x => x.p.done).reduce((s, x) => s + x.q.xp, 0);
  const onOffer = qs.reduce((s, q) => s + q.xp, 0);

  return `<div class="evcard ${allDone ? 'done' : 'live'}" data-k="quests:${esc(run.start)}">
    <div class="evhd">
      <span style="flex:1;min-width:0">
        <span class="evnm">This week</span>
        <span class="evtag">Seven days · set by your coach</span>
      </span>
      <span class="evstate">${allDone ? 'Complete' : (left > 1 ? left + ' days left' : 'Last day')}</span>
    </div>
    <div class="evblurb">${allDone
      ? 'Every one of them cleared. Nothing left on the table this week.'
      : 'Targets for the week rather than the day. They expire ' + esc(runEndLabel(run)) + ', finished or not.'}</div>
    ${prog.map(({ q, p }) => `<div class="evgoal ${p.done ? 'got' : ''}" data-k="q:${esc(q.id)}">
      <span class="g-tick">${p.done ? TICK : ''}</span>
      <span class="g-mid">
        <span class="g-lbl">${esc(q.title)}</span>
        <span class="g-sub">${esc(q.note)}</span>
        <span class="g-bar"><span data-fill style="width:${p.pct}%"></span></span>
      </span>
      <span class="g-cnt stack">
        <span>${p.done ? 'DONE' : fmtQuestVal(q, p.have) + ' / ' + fmtQuestVal(q, p.need)}</span>
        <span class="g-xp ${p.done ? 'got' : ''}">+${q.xp} XP</span>
      </span>
    </div>`).join('')}
    <div class="evfoot">
      <span>${earned > 0 ? earned.toLocaleString() + ' XP banked' : 'On the table'}</span>
      <strong>${allDone ? earned.toLocaleString() + ' XP' : (onOffer - earned).toLocaleString() + ' XP'}</strong>
    </div>
  </div>`;
}
function runEndLabel(run) {
  return parseKey(runEndKey(run)).toLocaleDateString('en-GB', { weekday: 'long' });
}
// Big counter totals read better rounded; day counts are just numbers.
function fmtQuestVal(q, v) {
  return String(q.kind || '').indexOf('total:') === 0 ? Math.round(v).toLocaleString() : Math.round(v);
}

// ── Progress — habits and achievements in one tab ─────────────────────────
// These were two views of the same question ("how am I doing"), so they are
// one screen: overall level, then every habit's own rank, then the milestones.
function renderProgress(LI, earned, totalAch) {
  const hs = live(), off = offHabits();
  const bestRun = bestHabitRun(), lead = leadStreak(), dayStreakNow = currentDayStreak();
  const daysLogged = seasonDays().filter(k => dayPct(k) > 0).length;
  const perfectDays = seasonDays().filter(isPerfect).length;
  return `
    <div data-k="screen:progress" style="${screenAnim()}">
      <!-- Progress used to open with a level/rank strip identical in spirit to
           Today's hero and to the Locker's own card — three places stating the
           same rank. Amir, 2026-07-30: this tab is about progress, not rank;
           the level is one tap away on Today and lives properly in the Locker,
           so it doesn't need a fourth appearance here. -->
      <!-- Days-logged leads on purpose. Perfect days and runs are both zero
           for anyone rebuilding, and opening your progress on a pair of zeros
           is a punishment for having had a bad week. Showing up is the stat
           that is almost always positive, and it is the one that earns the rest. -->
      <div class="statgrid">
        <div><div class="figure" data-static data-num="logged" data-to="${daysLogged}">${daysLogged}</div>
          <div class="eyebrow">Days logged</div></div>
        <div><div class="hd statfrac"><span data-static data-num="unlocked" data-to="${earned}">${earned}</span><span class="of">/${totalAch}</span></div>
          <div class="eyebrow">Badges</div></div>
        <div><div class="figure flamefig ${dayStreakNow > 0 ? 'lit' : ''}" data-lvl="${emberLevel(dayStreakNow)}">${FLAME}<span data-static data-num="streak" data-to="${dayStreakNow}">${dayStreakNow}</span></div>
          <div class="eyebrow">Day streak${bestRun > dayStreakNow ? ' · best ' + bestRun : ''}</div></div>
        <div><div class="figure" data-static data-num="perfect" data-to="${perfectDays}">${perfectDays}</div>
          <div class="eyebrow">Perfect days</div></div>
      </div>
      <!-- Four zeros and four words, three of which the app has never defined
           anywhere an athlete has been. On day one this screen was a report of
           nothing; the same line explains what fills each of them, and it is
           gone the moment there is a single day in the log. It teaches RUN and
           STREAK as the two separate things they are — the band above is the
           streak, this grid holds the run — because the app used to have five
           phrasings for those two ideas and they read as one number arguing
           with itself. The word is now "streak" for both, so this line has to
           separate them by SCOPE — a habit's own, versus the whole day's.
           (No backticks in here: this comment lives inside a template literal
           and one would close it.) -->
      ${daysLogged === 0 ? `<div class="statnote" data-k="statnote">
        A <strong>badge</strong> is one of the ${CONSISTENCY_TIERS.length} consistency tiers on a habit
        or one of the ${ACHIEVEMENTS.length} milestones at the foot of this screen.
        Every habit has <strong>its own streak</strong> — consecutive days you did that one thing.
        Your <strong>day streak</strong>, at the top, is consecutive days where you cleared
        ${XP_RULES.streakQualifyPct}% of everything you track.
        A <strong>perfect day</strong> is all of it. All four start at zero and the first one moves today.
      </div>` : ''}


      ${sectionLabel('Your habits', 'Tap for history')}
      <div class="pipkey">
        <span class="pips">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</span>
        <span>One square per tier — a ${CONSISTENCY_TIERS.slice(0, -1).map(t => t.days).join(', ')} or ${CONSISTENCY_TIERS[CONSISTENCY_TIERS.length - 1].days}-day <strong>streak</strong> on that habit.</span>
      </div>
      ${hs.length ? hs.map(h => {
        const hl = habitLevel(h), c = consistencyFor(h), st = habitStreak(h), done = isDone(h);
        // splitEmoji: the emoji sits in its own flex-none span so a wrapped
        // name lines up under its own first word, not under the emoji.
        const ep = splitEmoji(h.name);
        return `<button class="row-rule" data-k="prow:${h.id}" style="width:100%;text-align:left;display:flex;gap:14px;align-items:center;padding:14px 20px;${done ? 'background:var(--accent-100);' : ''}"
          ${on(() => openHabit(h.id, 'progress'))}>
          ${habitRing(hl)}
          <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">
            <!-- THE NAME GETS THE WHOLE LINE. It used to share it with the streak
                 chip, which left 99px for a name — every habit here wrapped to
                 two or three lines, and "Finish your session" took three. The
                 streak moved down beside the XP, which is where Today already
                 keeps it: the level anchors the row (there, on the right; here,
                 as the ring on the left) and the streak rides the line under it,
                 next to the numbers it belongs with. -->
            <span class="hd" style="font-size:16px;line-height:1.15;display:flex;gap:7px;min-width:0">${ep[0] ? `<span style="flex:none">${ep[0]}</span>` : ''}<span>${esc(ep[1])}</span></span>
            <!-- Was rank · XP · today's status, which wrapped to two lines and
                 restated what Today already says. Then rank · XP — and the rank
                 name went too (Amir, 2026-07-30): what an athlete reads off this
                 row is the level NUMBER, the ladder of rank names lives in the
                 Locker, and dropping it hands the line back to the habit's own
                 name. The bar that sat under here is now the ring on the left.
                 The XP figure followed the same day (Amir: "useless there") —
                 XP is what the ring and the level number already communicate;
                 restating the raw count added a line without adding information.
                 Only the streak remains, and only when there is one. -->
            ${st > 0 ? `<div style="min-width:0;font-size:11px;line-height:1.3">
              <span class="hlv"><span class="ember${st === lead ? ' lead' : ''}" data-lvl="${emberLevel(st)}">${st}<span class="u">-DAY STREAK</span></span></span>
            </div>` : ''}
          </div>
          <div class="pips" style="flex:none">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i < c.tier ? 'on' : ''}" title="${t.days} days"></i>`).join('')}</div>
        </button>`;
      }).join('') : `<div style="padding:18px 20px;font-size:13px;color:var(--muted)">Nothing tracked yet. Switch habits on in Settings.</div>`}

      ${off.length ? sectionLabel('Paused', 'Turn on in Settings') +
        off.map(h => `<div class="row-rule" style="display:flex;gap:14px;align-items:center;padding:13px 20px;opacity:.45">
          ${habitRing(habitLevel(h))}
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
            <div class="hd" style="font-size:16px;line-height:1.15;display:flex;gap:7px;min-width:0">${(ep => `${ep[0] ? `<span style="flex:none">${ep[0]}</span>` : ''}<span>${esc(ep[1])}</span>`)(splitEmoji(h.name))}</div>
            <div style="font-size:11px;line-height:1.3;color:var(--muted)">Paused · ${habitLevel(h).xp.toLocaleString()} XP banked</div>
          </div>
        </div>`).join('') : ''}

      <!-- Milestones. These were nine rows at 45% opacity — mostly things the
           athlete had NOT done, greyed out, which reads as a report card rather
           than a shelf being filled. Every row is full strength now and carries
           a bar, because the question an athlete actually has about a milestone
           is "how close am I" and the old row answered it in 8px mono at the
           far right. The section also states the collection count, and names
           the one nearest to falling. -->
      <!-- Quests keep their own section: they are the only thing here with a
           clock on it, and the one with least time left is the one to act on. -->
      ${sectionLabel('Quests', 'Seven days')}
      ${renderQuestBlock()}

      <!-- Milestones, in three tiers. One flat list gave a new athlete a single
           reachable row above nine walls, and gave a two-year athlete nothing
           left to want. The tier is the promise: a good week, the long haul, or
           something most people never get. -->
      ${(() => {
        const rows = ACHIEVEMENTS.map(a => {
          // Clamped: THE CENTURION reads 143/100 without it, and a bar past
          // 100% would run outside its own track.
          const have = Math.min(measureAch(a), a.need), got = have >= a.need;
          return { a, have, got, pct: Math.round(have / a.need * 100) };
        });
        // Only once something is genuinely under way. "Closest" chosen from
        // rows that are all sitting at zero is not information, it is the app
        // picking a favourite out of nothing.
        const near = rows.filter(r => !r.got && r.have > 0).sort((x, y) => y.pct - x.pct)[0];
        const row = r => `<div class="msrow ${r.got ? 'got' : ''}" data-k="ms:${r.a.code}">
            ${achMedal(r.a, r.got)}
            <span class="ms-mid">
              <span class="ms-name">${esc(r.a.name)}</span>
              <span class="ms-note">${esc(r.a.note)}</span>
              <span class="ms-bar"><span data-fill style="width:${r.pct}%"></span></span>
            </span>
            <span class="ms-right">
              <span class="ms-xp">+${r.a.xp} XP</span>
              <span class="ms-cnt">${r.got ? 'UNLOCKED' : r.have + '/' + r.a.need}</span>
            </span>
          </div>`;
        // A FEW WEEKS sits between the week badges and the long ones, wearing
        // the SAME row as every other milestone (Amir, 2026-07-29: the card
        // form read as a quest, and a quest is the one thing here with a clock
        // on it). Three goals share the note line — ticked as they fall — the
        // bar is the average of the three, and the right column carries the
        // title it pays where the others carry XP. No dates on any of it: the
        // few weeks is how long the work takes, not a slot you can miss.
        const evDone = EVENTS.filter(e => eventProgress(e).done).length;
        const evOpen = !!UI.msOpen.events;
        const evCards = msTierHeader('events', 'A few weeks', evDone + '/' + EVENTS.length)
          + (evOpen ? EVENTS.map(ev => {
            const p = eventProgress(ev), got = p.done, hit = p.goals.filter(g => g.done).length;
            const w = ev.name.split(/\s+/);
            const code = (w.length > 1 ? w[0][0] + w[1][0] : ev.name.slice(0, 2)).toUpperCase();
            return `<div class="msrow evrow ${got ? 'got' : ''}" data-k="ev:${ev.id}">
              ${evMedal(ev, got)}
              <span class="ms-mid">
                <span class="ms-name">${esc(ev.name)}</span>
                <span class="ms-note">${p.goals.map(g => `<i class="g${g.done ? ' got' : ''}">${esc(g.label)}</i>`).join(' · ')}</span>
                <span class="ms-bar"><span data-fill style="width:${p.pct}%"></span></span>
              </span>
              <span class="ms-right">
                <span class="ms-xp">${esc(ev.title.name)}</span>
                <span class="ms-cnt">${got ? 'UNLOCKED' : hit + '/' + p.goals.length}</span>
              </span>
            </div>`;
          }).join('') : '');
        // Each tier is toggled off by nature — five-ish full-strength rows per
        // group read as a wall stacked four deep on first open. The header
        // (label, count, chevron) always shows; the rows only render once
        // UI.msOpen[key] is true, so opening one costs nothing until tapped.
        const tierBlock = key => {
          const inTier = rows.filter(r => (r.a.tier || 'long') === key);
          if (!inTier.length) return '';
          const t = ACH_TIERS.find(x => x.key === key);
          const open = !!UI.msOpen[key];
          return msTierHeader(key, t.label, inTier.filter(r => r.got).length + '/' + inTier.length)
               + (open ? inTier.map(row).join('') : '');
        };
        return sectionLabel('Milestones', (rows.filter(r => r.got).length + evDone) + ' of ' + (ACHIEVEMENTS.length + EVENTS.length))
          + `<div style="padding:0 20px 14px;font-size:12px;line-height:1.5;color:var(--muted)">Complete these challenges for rewards — XP, medals and titles, yours for good once you cross the line.</div>`
          + (near ? `<div class="msnext" data-k="msnext">
              <strong>${esc(near.a.name)}</strong> is the closest — ${near.a.need - near.have} to go, worth +${near.a.xp} XP.
            </div>` : '')
          + tierBlock('week') + evCards + tierBlock('long') + tierBlock('rare');
      })()}

      <div style="padding:18px 20px 12px;font-size:11px;line-height:1.5;color:var(--muted-soft)">
        The number beside a habit is your level in it — it climbs with how often you do it, not how hard it is, and the ring around it is how far through that level you are. The five squares are consistency tiers, from a 5-day streak up to two months.
      </div>
      <!-- A second door to the manual, on the screen that uses the most words
           the app has never defined — badge, tier, run, streak, season, rank.
           Before this the ONLY routes to it were an unlabelled monogram in the
           header and a button at the foot of the rank ladder. -->
      <div style="padding:0 20px 34px">
        <button class="btn btn-secondary btn-block" ${on(() => { UI.backTo = 'progress'; go('manual'); })}>What all of this means</button>
      </div>
    </div>`;
}

// ── Habit detail ──────────────────────────────────────────────────────────
function renderDetail(h) {
  // MISSED and NOT YET STARTED are not the same thing. Both the grid and the
  // last-five list walked back from today unconditionally, so an athlete who
  // opened a habit on their first afternoon was shown five days of MISS and a
  // 35-square grid of failure for a period during which they did not have the
  // app. `.c.pre` and a third key swatch mark those days as before-you-started.
  // || TKEY() — null until the first thing is logged, which is exactly the day
  // this is here to fix.
  const first = firstLoggedDay() || TKEY();
  const started = (k) => k >= first;
  const cells = [];
  for (let i = 34; i >= 0; i--) {
    const k = fmtKey(addDays(today(), -i)), v = valOf(k, h.id);
    cells.push(!started(k) ? 'pre' : (v >= h.target ? 'hit' : (v > 0 ? 'part' : '')));
  }
  const logRows = [];
  for (let i = 1; i <= 5; i++) {
    const d = addDays(today(), -i), k = fmtKey(d), v = valOf(k, h.id), hit = v >= h.target;
    if (!started(k)) continue;
    logRows.push({
      day: i === 1 ? 'YESTERDAY' : d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric' }).toUpperCase(),
      note: h.kind === 'count' ? fmtVal(h, v) + ' ' + h.unit + ' logged' : (hit ? 'Logged in the app' : 'Nothing logged'),
      val: hit ? 'HIT' : 'MISS', hit, xp: xpFor(h, v)
    });
  }
  // Units sit inside the figure at a smaller size rather than being welded to
  // it — "3D" as 24px caps read as a token, not as three days.
  const unit = (n, u) => n + '<span class="su">' + u + '</span>';
  const stats = [
    { v: unit(habitWeek(h), '/7'),          k: 'This week' },
    { v: unit(habitBest(h), habitBest(h) === 1 ? 'day' : 'days'), k: 'Longest streak' },
    { v: unit(habitRate35(h), '%'),         k: 'Last 35 days' }
  ];
  const hl = habitLevel(h), con = consistencyFor(h), done = isDone(h, AKEY());
  const v = valOf(AKEY(), h.id);
  return `
    <div data-k="screen:detail:${h.id}" style="${screenAnim()}">
      <div class="block" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:flex-end;gap:14px">
          <div class="figure" data-hero data-static data-num="hlv:${h.id}" data-to="${hl.lv}" style="font-size:76px;line-height:.8">${hl.lv}</div>
          <div style="display:flex;flex-direction:column;gap:4px;padding-bottom:6px">
            <div class="hd" style="font-size:16px;line-height:1">${esc(hl.label)}</div>
            <div style="font-size:12px;line-height:1.3;color:var(--muted)"><span data-static data-num="hxp:${h.id}" data-to="${hl.xp}">${hl.xp.toLocaleString()}</span> XP banked · ${hl.toNext} to LV ${hl.lv + 1}</div>
          </div>
        </div>
        <div class="bar thin"><span data-fill style="width:${hl.pct}%"></span></div>
        <p style="margin:2px 0 0;font-size:13px;color:var(--muted)">${esc(QUIPS[h.id] || h.goal || '')}</p>
      </div>

      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
          <span>${editingPast() ? esc(dayLong(AKEY())) : 'Today'}</span><span>${done ? 'DONE' : fmtVal(h, v) + ' / ' + fmtVal(h, h.target) + ' ' + h.unit.toUpperCase()}</span>
        </div>
        ${h.locked
          ? `<div style="display:flex;flex-direction:column;gap:10px">
               <div style="font-size:13px;line-height:1.5;color:var(--muted)">${esc((isFree() && h.freeHint) || h.lockedHint || '')}</div>
               <button class="btn btn-primary btn-block" ${on(() => (isFree() ? (window.location.href = '/form.html') : goProgram()))}>${isFree() ? 'See about coaching' : 'Open your programme'}</button>
             </div>`
          : `<div style="display:flex;gap:10px">
          <button class="btn ${done ? 'btn-secondary' : 'btn-primary'}" style="flex:1"
            ${on(() => (h.kind === 'count' ? openSheet(h) : toggleHabit(h)))}>${h.kind === 'count' ? 'Log a number' : (done ? 'Undo today' : 'Mark done')}</button>
          ${h.kind === 'count' && !done ? `<button class="btn btn-secondary" ${on(() => bump(h))}>+${h.step || 1}</button>` : ''}
        </div>`}
        <div style="font-size:11px;color:var(--muted-soft)">Worth ${baseXp(h)} XP a day · ${Math.round(baseXp(h) * XP_RULES.completionBonus)} XP when you finish it</div>
      </div>

      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
          <span>Consistency</span><span>${con.tier} of ${con.total}</span>
        </div>
        <!-- Was pips on the left and a right-aligned two-line block opposite
             them, which left "best run 3d" orphaned against the right margin
             and read as a layout accident. One column, one line each. -->
        <div class="pips">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i < con.tier ? 'on' : ''}" title="${t.days} days · ${tierXp(h, i)} XP"></i>`).join('')}</div>
        <div style="font-size:12.5px;line-height:1.5;color:var(--muted)">
          ${con.next
            ? 'Next: <strong style="color:var(--ink)">' + esc(con.next.name) + '</strong> at a ' + con.next.days
              + '-day streak · <strong style="color:var(--clay-deep)">+' + tierXp(h, con.tier) + ' XP</strong>'
            : '<strong style="color:var(--ink)">UNBREAKABLE</strong> — every tier cleared.'}
        </div>
        <div style="font-size:12px;line-height:1.4;color:var(--muted-soft)">
          Longest streak: ${con.best} day${con.best === 1 ? '' : 's'}${con.cur > 0 ? ' · on ' + con.cur + ' now' : ''}.
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:2px solid var(--divider)">
        ${stats.map((s, i) => `<div style="padding:14px 12px;${i < 2 ? 'border-right:1px solid var(--rule);' : ''}display:flex;flex-direction:column;gap:5px">
          <div class="hd statnum">${s.v}</div>
          <div class="eyebrow" style="letter-spacing:.1em">${esc(s.k)}</div>
        </div>`).join('')}
      </div>

      <!-- The grid had no anchoring at all: 35 identical squares with nothing
           saying which one is today, so the empty leading row read as broken
           rather than as "before you started". -->
      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="letter-spacing:.12em;display:flex;justify-content:space-between">
          <span>Last 35 days</span><span>${habitRate35(h)}% hit</span>
        </div>
        <div class="grid35">${cells.map((c, i) => `<div class="c ${c}${i === cells.length - 1 ? ' now' : ''}" style="animation-delay:${(i * 0.011).toFixed(3)}s"></div>`).join('')}</div>
        <div class="gridkey">
          <span>Five weeks ago</span>
          <span class="gk"><i class="c hit"></i>hit <i class="c part"></i>part <i class="c"></i>none${cells.indexOf('pre') >= 0 ? ' <i class="c pre"></i>before you started' : ''}</span>
          <span>Today</span>
        </div>
      </div>

      <div>
        ${logRows.length ? logRows.map(l => `<div class="row-rule" style="padding:13px 20px;display:flex;justify-content:space-between;align-items:baseline;gap:12px">
          <span style="display:flex;flex-direction:column;gap:3px">
            <span class="hd" style="font-size:14px;line-height:1">${esc(l.day)}</span>
            <span style="font-size:11px;line-height:1;color:var(--muted)">${esc(l.note)}</span>
          </span>
          <span style="text-align:right">
            <span class="mono" style="display:block;font-size:10px;font-weight:700;color:${l.hit ? 'var(--clay-deep)' : 'var(--muted-soft)'}">${l.val}</span>
            <span class="mono" style="display:block;font-size:9px;color:var(--muted-soft);margin-top:3px">+${l.xp} XP</span>
          </span>
        </div>`).join('')
        // On day one every one of these rows would be a day from before the
        // athlete had the app — five MISSes for a period they were not here.
        : `<div style="padding:16px 20px;font-size:12.5px;line-height:1.5;color:var(--muted)">
            No days behind you yet. Once there are, the last five sit here with what each one earned.
          </div>`}
      </div>

      <div style="padding:18px 20px 34px">
        <button class="btn btn-secondary btn-block" ${on(() => go(UI.from === 'today' ? 'today' : 'progress'))}>Back to ${UI.from === 'today' ? 'today' : 'progress'}</button>
      </div>
    </div>`;
}

// ── Leaderboard screen ────────────────────────────────────────────────────
function renderCrew() {
  const scopeBtn = (key, label) => `<button class="chip ${LB.scope === key ? 'chip-on' : ''}"
    ${on(() => { if (LB.scope !== key) { LB.scope = key; LB.loaded = false; fetchBoard(); } })}>${label}</button>`;
  const started = parseKey(seasonStart()).toLocaleDateString('en-GB', { day:'numeric', month:'long' });
  const dayOfSeason = Math.max(1, Math.round((today() - parseKey(seasonStart())) / 86400000) + 1);

  let body = '';
  if (LB.loading && !LB.rows.length) {
    body = `<div style="padding:26px 20px;display:flex;align-items:center;gap:12px">
      <span class="spinner" style="width:22px;height:22px;border-width:2px"></span>
      <span style="font-size:13px;color:var(--muted)">Scoring everyone…</span></div>`;
  } else if (LB.error === 'demo') {
    body = boardNote('The leaderboard is live for real athletes only — the demo has nobody to compete with.');
  } else if (LB.error === 'notdeployed') {
    body = boardNote('The leaderboard is not switched on yet. Your coach needs to run the leaderboard migration — nothing is wrong with your app.');
  } else if (LB.error === 'offline') {
    body = boardNote('No connection. The board needs signal — everything else in the app works offline.');
  } else if (LB.error) {
    body = boardNote('Could not load the board just now.') +
      `<div style="padding:0 20px 20px"><button class="btn btn-secondary" ${on(() => { LB.loaded = false; fetchBoard(); })}>Try again</button></div>`;
  } else if (!LB.rows.length) {
    body = boardNote('Nobody has joined yet. ' + seasonName() + ' is wide open — be first and set the pace.');
  } else {
    const top = LB.rows.filter(r => r.pos <= 10);
    const me = LB.rows.find(r => r.is_me);
    const outside = me && me.pos > 10;
    // Everyone's bar is drawn against the leader's score, so the gap is visible
    // rather than arithmetic.
    const lead = Math.max(1, ...LB.rows.map(r => Number(r.xp) || 0));
    body = `
      ${LB.passed.length ? `<div class="passline" data-k="passed">
        You passed ${esc(LB.passed.slice(0, 2).join(' and '))}${LB.passed.length > 2 ? ' and ' + (LB.passed.length - 2) + ' more' : ''} since you last looked.
      </div>` : ''}
      <div>
        ${top.map((r, i) => boardRow(r, lead, i)).join('')}
      </div>
      ${outside ? `<div class="eyebrow" style="padding:16px 20px 6px;letter-spacing:.12em">Your position</div>${boardRow(me, lead, top.length)}` : ''}`;
  }

  const viewBtn = (key, label) => `<button class="chip ${LB.view === key ? 'chip-on' : ''}"
    ${on(() => { if (LB.view !== key) { LB.view = key; render(); resetScroll();
                                       if (key === 'roll' && !RC.loaded) fetchRollCall(); } })}>${label}</button>`;

  return `
    <div data-k="screen:board" style="${screenAnim()}">
      <!-- The season name was printed twice within 200px (header eyebrow, then
           a heading) and the scope explainer took three permanent lines, so the
           board itself started ~470px down. Both switches now sit on one row
           and the explanation is one line under them. -->
      <div class="boardbar">
        <!-- Roll call leads because it is the default and because conversation
             rewards coming back; a ranking is a once-a-day glance. -->
        <div class="chips">${viewBtn('roll', 'Roll call')}${viewBtn('board', 'Leaderboard')}</div>
        <div class="mono boardday">DAY ${dayOfSeason}</div>
      </div>
      ${LB.view === 'roll' ? renderNoteBox() + renderRollCall() : `
        <div class="boardbar sub">
          <div class="chips">${scopeBtn('season', 'This season')}${scopeBtn('week', 'Past week')}</div>
        </div>
        <div class="boardnote">${LB.scope === 'week'
          ? 'Today and the six days before it. Server-scored from what you logged.'
          : 'Everything since ' + esc(started) + '. Server-scored from what you logged.'}</div>
        ${body}
        ${renderBoardJoin()}`}
    </div>`;
}

// ── Roll call: reading the wall ───────────────────────────────────────────
// Grouped by day, newest first, the coach's line leading its day. A day reads
// top-down as "here is the brief, here is who answered it".
function renderRollCall() {
  if (RC.loading && !RC.rows.length) {
    return `<div style="padding:26px 20px;display:flex;align-items:center;gap:12px">
      <span class="spinner" style="width:22px;height:22px;border-width:2px"></span>
      <span style="font-size:13px;color:var(--muted)">Reading the wall…</span></div>`;
  }
  if (RC.error === 'demo')        return boardNote('The wall is live for real athletes only — the demo has nobody to talk to.');
  if (RC.error === 'notdeployed') return boardNote('Roll call is not switched on yet. Your coach needs to run the migration — nothing is wrong with your app.');
  if (RC.error === 'offline')     return boardNote('No connection. The wall needs signal — everything else in the app works offline.');
  if (RC.error) {
    return boardNote('Could not load the wall just now.') +
      `<div style="padding:0 20px 20px"><button class="btn btn-secondary" ${on(() => { RC.loaded = false; fetchRollCall(); })}>Try again</button></div>`;
  }
  if (!RC.rows.length) {
    // Not "one sentence on Today" — the composer moved up to this screen, and it
    // is sitting directly above this line.
    return boardNote(CFG.onBoard
      ? 'Nobody has said anything yet. Write one line up there and you are the first voice on here.'
      : 'Nothing on the wall yet. Join the board and you can leave a line of your own.');
  }

  // The server already ordered this: day desc, coach first, then most recent.
  const days = [];
  RC.rows.forEach(r => {
    const d = days.length && days[days.length - 1].day === r.day ? days[days.length - 1] : null;
    if (d) d.rows.push(r); else days.push({ day: r.day, rows: [r] });
  });

  return days.map((g, gi) => `
    <div data-k="rcday:${esc(g.day)}">
      <div class="rcday">
        <span>${esc(rcDayLabel(g.day))}</span>
        <span class="mono">${g.rows.filter(r => !r.is_coach).length} IN</span>
      </div>
      ${g.rows.map((r, i) => rollLine(r, gi * 8 + i)).join('')}
    </div>`).join('');
}
function rcDayLabel(day) {
  if (day === TKEY()) return 'Today';
  if (day === fmtKey(addDays(today(), -1))) return 'Yesterday';
  return parseKey(day).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}
function rollLine(r, i) {
  const pct = (r.pct === null || r.pct === undefined) ? null : Number(r.pct);
  const meta = r.is_coach ? 'YOUR COACH'
             : [r.rank_label ? String(r.rank_label).toUpperCase() : '', pct === null ? '' : pct + '%']
                 .filter(Boolean).join(' · ');
  return `<div class="rcline ${r.is_coach ? 'coach' : ''} ${r.is_me ? 'me' : ''}"
      data-k="rc:${esc(r.day)}:${esc(String(r.display_name))}"
      style="animation-delay:${(Math.min(i, 12) * 0.04).toFixed(2)}s">
    <div class="rc-top">
      <span class="rc-name" style="min-width:0;display:flex;align-items:baseline">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.is_me ? 'You' : r.display_name)}</span>
        ${(() => { const t = r.is_coach ? '' : titleName(r.title);
                   return t ? `<span style="flex:none;margin-left:7px">${titlePlate(passItem(r.title) || { name: t }, true)}</span>` : ''; })()}
      </span>
      <span class="rc-meta">${esc(meta)}</span>
    </div>
    <div class="rc-say">${esc(r.body)}</div>
  </div>`;
}
function boardNote(text) {
  return `<div style="padding:24px 20px;font-size:13px;line-height:1.55;color:var(--muted)">${esc(text)}</div>`;
}
function boardRow(r, lead, i) {
  const medal = r.pos <= 3;
  const pct = Math.max(2, Math.round((Number(r.xp) || 0) / (lead || 1) * 100));
  return `<div class="row-rule brow" data-k="brow:${esc(String(r.display_name || r.pos))}"
    style="display:flex;gap:14px;align-items:center;padding:14px 20px;animation-delay:${((i || 0) * 0.05).toFixed(2)}s;${r.is_me ? 'background:var(--accent-100);' : ''}">
    <div style="width:38px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <span class="hd" style="font-size:22px;line-height:1;color:${medal ? 'var(--clay-deep)' : 'var(--muted-soft)'}">${r.pos}</span>
      ${(() => { const d = LB.deltas[r.display_name];
                 if (!d) return '';
                 return '<span class="mono delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲' : '▼') + Math.abs(d) + '</span>'; })()}
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <span class="hd" style="font-size:16px;line-height:1">${esc(r.is_me ? 'You' : r.display_name)}</span>
        <span class="mono" style="flex:none;font-size:13px;font-weight:700">${Number(r.xp || 0).toLocaleString()}<span style="font-size:9px;color:var(--muted-soft)"> XP</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;line-height:1.2;color:var(--muted);min-width:0">
        ${rankIcon(rankNameOf(r.rank_label), 13, 'stroke-width:2.4')}<span style="flex:none">${esc(r.rank_label)}</span>
        ${(() => { const t = titleName(r.title);
                   // The plate, not plain text — the earned thing is the one
                   // that catches the eye on a line of rank furniture.
                   return t ? `<span style="flex:none">${titlePlate(passItem(r.title) || { name: t }, true)}</span>` : ''; })()}
      </div>
      <div class="bar" style="height:3px;width:100%"><span data-fill style="width:${pct}%"></span></div>
    </div>
  </div>`;
}
// Joining is explicit and reversible, and the handle is theirs to choose —
// nobody's name is published to other clients without them asking for it.
function renderBoardJoin() {
  if (window.IS_DEMO) return '';
  const joined = !!CFG.onBoard;
  if (!joined) {
    return `
      <div class="block" data-k="join" data-tour="join" style="border-top:2px solid var(--divider);display:flex;flex-direction:column;gap:12px">
        <div class="hd" style="font-size:20px;line-height:1">Join the board</div>
        <div style="font-size:13px;line-height:1.5;color:var(--muted)">
          Other athletes will see the name you pick here and your points — nothing else. No habits, no logs, no real name unless you use it. You can leave any time.
        </div>
        <div style="display:flex;gap:8px">
          <input class="input" id="boardname" maxlength="24" placeholder="${esc(defaultDisplayName())}" value="${esc(LB.nameDraft)}" style="flex:1">
          <button class="btn btn-primary" style="padding:0 16px" ${on(() => joinBoard(LB.nameDraft.trim(), true))}>Join</button>
        </div>
        <div style="font-size:11px;color:var(--muted-soft)">Leave it blank to appear as ${esc(defaultDisplayName())}.</div>
      </div>`;
  }
  return `
    <div class="block" data-k="join" data-tour="join" style="border-top:2px solid var(--divider);display:flex;flex-direction:column;gap:12px">
      <div class="eyebrow" style="letter-spacing:.12em">You appear as</div>
      <div style="display:flex;gap:8px">
        <input class="input" id="boardname" maxlength="24" placeholder="${esc(CFG.boardName || defaultDisplayName())}" value="${esc(LB.nameDraft)}" style="flex:1">
        <button class="btn btn-secondary" style="padding:0 14px" ${on(() => joinBoard(LB.nameDraft.trim() || CFG.boardName, true))}>Rename</button>
      </div>
      <button class="btn btn-secondary btn-block" ${on(() => joinBoard(null, false))}>Leave the leaderboard</button>
    </div>`;
}

// ── The manual ────────────────────────────────────────────────────────────
// Every number here is READ FROM THE LIVE CONSTANTS rather than typed out, so
// retuning XP_RULES, RANKS or CONSISTENCY_TIERS updates this page by itself and
// it can never quietly go out of date. If you change how something *works*
// (not just its number), update the prose here too — see HABITS.md.
function renderManual() {
  const hs = allHabits();
  const perfectDay = live().reduce((s, h) => s + Math.round(baseXp(h) * XP_RULES.completionBonus), 0);
  const cum = (L) => { let s = 0; for (let n = 1; n < L; n++) s += levelCost(XP_RULES.base, n); return s; };
  const water = habitById('water'), steps = habitById('steps');
  // Each heading carries an id so the contents list at the top can jump to it.
  // The manual is a dozen sections of prose; without a way in it is a wall you
  // scroll past rather than a reference you use.
  const slug = (t) => 'man-' + t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const h2 = (t) => `<div class="hd manh2" id="${slug(t)}">${t}</div>`;
  // Body copy is ink, not muted. Muted is right for a caption and wrong for
  // four hundred words you are meant to actually read.
  const p = (t) => `<p class="manp">${t}</p>`;
  const block = (inner) => `<div class="block" style="display:flex;flex-direction:column">${inner}</div>`;
  const jump = (t) => `<button class="manlink" ${on(() => {
    const el = document.getElementById(slug(t));
    if (el) el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
  })}>${esc(t)}</button>`;
  const CONTENTS = ['Start here', 'The daily loop', 'Forgot to log a day?', 'Roll call', 'What each habit is worth',
                    'How to earn more', 'Levels and ranks', 'The long game', 'Consistency', 'Quests',
                    'Seasons', 'The leaderboard', 'Your data'];

  return `
    <div data-k="screen:manual" style="${screenAnim()}">
      <div class="block mancontents" data-k="mancontents">
        <div class="eyebrow" style="letter-spacing:.12em;margin-bottom:10px">Contents</div>
        <div class="manlinks">${CONTENTS.map(jump).join('')}</div>
      </div>
      <!-- The manual opened on "The daily loop", which assumes you already know
           what a loop, a level and a leaderboard are here. This section is the
           one an athlete who is actually lost needs, and it is the one that
           offers to just SHOW them instead. -->
      ${block(h2('Start here') +
        p(`Four things and you have the whole app.`) +
        `<div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55;color:var(--muted);margin-bottom:14px">
          <div>▸ <strong style="color:var(--ink)">Every habit row takes three different taps.</strong> The
            <strong style="color:var(--ink)">box</strong> logs it. The <strong style="color:var(--ink)">name</strong>
            opens that habit's history. <strong style="color:var(--ink)">+</strong> adds one unit at a time, and holding it goes faster.</div>
          <div>▸ <strong style="color:var(--ink)">Three tabs.</strong> Today is where you log, Progress is where you stand, Crew is everyone else.</div>
          <div>▸ <strong style="color:var(--ink)">Your initials, top right,</strong> open Settings from any screen — and close it again. Everything not on a tab is behind them, including this page.</div>
          <div>▸ <strong style="color:var(--ink)">Everything you log pays XP</strong>, and XP is the only currency here. There is nothing to buy.</div>
        </div>` +
        `<button class="btn btn-primary btn-block" ${on(() => { UI.backTo = 'settings'; startTour('settings'); })}>Show me around instead</button>` +
        `<div style="height:12px"></div>` +
        p(`A minute, and it points at each of those on the real screen. It is also in Settings under <strong style="color:var(--ink)">How this works</strong>, any time.`))}

      ${block(h2('The daily loop') +
        p(`Tick off what you did today. Every habit is worth points, and points are the whole game — they build your level, your rank in each habit, and your place on the leaderboard.`) +
        p(`Clear the whole list and that is a <strong style="color:var(--ink)">perfect day</strong>, and the app will stop what it is doing to say so. It does the same for a new level, a rank promotion, a consistency tier and a milestone. Anything smaller than that just flashes in the row and gets out of your way.`) +
        p(`Nothing here needs a signal. Whatever you tick is saved on your phone straight away and sent up on its own when you're back online.`) +
        p(`<strong style="color:var(--ink)">Put it on your home screen</strong> and it opens in one tap, looks like any other app and keeps working with no signal. ${isIOS() ? 'Tap Share in the browser bar, then Add to Home Screen.' : 'There is a row for it in Settings.'} There is nothing to download — it is this page, kept somewhere you can reach it.`))}

      ${block(h2('Forgot to log a day?') +
        p(`Use the row of days at the top of Today. You can go back <strong style="color:var(--ink)">${BACKFILL_DAYS} days</strong> and fill in or correct anything you missed — each day shows how much of it you completed, so it is easy to spot the one you forgot.`) +
        p(`While you are on an earlier day the screen turns clay and says so, and everything you tap lands on <em>that</em> day. Tap <strong style="color:var(--ink)">Back to today</strong> when you're done.`) +
        p(`Older than ${BACKFILL_DAYS} days and the log is closed. That is on purpose: a record you can rewrite whenever you like is a diary, not proof. Filling a day in still counts for everything — points, streaks, badges, quests.`))}

      ${block(h2('Roll call') +
        p(`Once you're on the leaderboard you get <strong style="color:var(--ink)">one sentence a day</strong>. Write it at the top of the <strong style="color:var(--ink)">CREW</strong> tab. Everyone else on the board sees it, next to your name, your rank and how much of that day you finished.`) +
        p(`Change it as many times as you like until midnight. After that it stands — you can fix an old day's <em>log</em>, but not what you said about it.`) +
        p(`It is worth <strong style="color:var(--ink)">no points at all</strong>, deliberately. It is not another box to tick; it is the one place in here where you get to say something. Everyone else's lines are right underneath yours.`) +
        p(`Keep it to things you don't mind other athletes reading — this is a shared wall, not a message to your coach.${isFree() ? '' : ' Use Settings to message me privately.'}`))}

      ${block(h2('What each habit is worth') +
        p(`Points are weighted by how much the habit actually moves your health. Your training session pays the most, then daily steps.`) +
        `<div style="display:flex;flex-direction:column;gap:0">
          ${hs.map(h => `<div class="row-rule" style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0">
            <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
              <span class="hd" style="font-size:14px;line-height:1">${esc(h.name)}</span>
              <span style="font-size:11px;color:var(--muted)">${esc(h.goal || h.source)}</span>
            </span>
            <span class="mono" style="font-size:13px;font-weight:700;white-space:nowrap">${baseXp(h)} <span style="font-size:9px;color:var(--muted-soft)">XP</span></span>
          </div>`).join('')}
        </div>` +
        `<div style="height:12px"></div>` +
        p(`<strong style="color:var(--ink)">Finishing pays more than nearly finishing.</strong> Habits you count — water, steps, sleep, meals — pay as you go, then add a bonus once you hit the target. ${water ? `${water.target / 2} of ${water.target} glasses earns ${xpFor(water, water.target / 2)} XP; all ${water.target} earns ${xpFor(water, water.target)} XP.` : ''}`) +
        p(`A perfect day is currently <strong style="color:var(--ink)">${perfectDay.toLocaleString()} XP</strong>.`) +
        p(`There is a ceiling on what a counter will take in one day — <strong style="color:var(--ink)">${XP_RULES.dailyCap}× the target</strong>${steps ? `, so ${fmtVal(steps, steps.target * XP_RULES.dailyCap)} steps` : ''}. Going past your target never paid extra anyway; the ceiling is there so a stuck thumb on the + button cannot hand you a quest you did not walk.`))}

      ${block(h2('How to earn more') +
        `<div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.55;color:var(--muted)">
          <div>▸ <strong style="color:var(--ink)">Train.</strong> It is worth more than anything else on the list. You cannot tick it here — ${isFree()
            ? `it unlocks when you are on a coaching programme, and then it ticks itself every time you finish a session.`
            : `finish a session in your programme and it ticks itself, whether you got through all of it or not.`}</div>
          <div>▸ <strong style="color:var(--ink)">Finish what you start.</strong> The completion bonus means the last glass of water is worth more than the first.</div>
          <div>▸ <strong style="color:var(--ink)">Turn off what you'll never do.</strong> Points come from what you complete, so a habit you ignore only drags your daily percentage down. Switch it off in Settings.</div>
          <div>▸ <strong style="color:var(--ink)">Show up daily.</strong> Consistency tiers below are worth real points — up to ${(() => { const h = live()[0] || HABITS[0]; return CONSISTENCY_TIERS.reduce((s, t, i) => s + tierXp(h, i), 0).toLocaleString(); })()} XP on a single habit — and they only come from unbroken streaks.</div>
          <div>▸ <strong style="color:var(--ink)">Go after the milestones.</strong> The ${ACHIEVEMENTS.length} on your Progress tab pay ${ACHIEVEMENTS.reduce((s, a) => s + a.xp, 0).toLocaleString()} XP between them, once each.</div>
        </div>`)}

      ${block(h2('Levels and ranks') +
        p(`Every level costs more than the one before it — ${levelCost(XP_RULES.base, 1).toLocaleString()} XP for level 2, ${levelCost(XP_RULES.base, 10).toLocaleString()} for level 11. One full day gets you to level 2. Level 20 is about two months of solid work (${cum(20).toLocaleString()} XP).`) +
        p(`There are <strong style="color:var(--ink)">${RANKS.length} ranks with ${SUBS_PER_RANK} levels each</strong>. Level ${SUBS_PER_RANK + 1} makes you ${esc(rankFor(SUBS_PER_RANK + 1).label)}, level 20 is ${esc(rankFor(20).label)}. Every rank has its own insignia — <strong style="color:var(--ink)">tap your rank anywhere in the app</strong> to see the whole ladder and what each one costs.`) +
        `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
          ${RANKS.map(r => `<span style="display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--rule);color:var(--muted)">
            ${rankIcon(r, 14, 'stroke-width:2.4')}<span class="mono" style="font-size:9px;letter-spacing:.06em">${esc(r)}</span>
          </span>`).join('')}
        </div>` +
        p(`Past level ${RANKS.length * SUBS_PER_RANK} you start again carrying a star — ${esc(rankFor(RANKS.length * SUBS_PER_RANK + 1).label)} — and there is no ceiling after that.`) +
        p(`<strong style="color:var(--ink)">Each habit has its own level too.</strong> They all climb at the same rate, so your level in a habit is really a measure of how often you do it. Drink water every day and train twice a week, and your water rank will leave your workout rank behind. That is the point.`))}

      ${(() => {
        const nx = nextReward(), got = passOwned().length, eq = passTitle();
        return block(h2('The long game') +
          p(`Levels pay out. There are <strong style="color:var(--ink)">${PASS_TRACK.length} rewards</strong> spread up the ladder, and reaching the level is all it takes — there is nothing to buy and nothing to claim.`) +
          p(`Two kinds. <strong style="color:var(--ink)">Titles</strong> are a name you wear: it sits under your rank, it goes on the card you share, and if you are on the board it sits next to your name there and on the roll call wall. <strong style="color:var(--ink)">Cards</strong> change how that shared card looks — those are yours alone, nobody else sees them. You choose which of the ones you own to use, and you can change your mind whenever, including showing no title at all.`) +
          p(`<strong style="color:var(--ink)">They are kept.</strong> This is the one thing here a new season does not touch — your points go back to zero and every reward you have unlocked stays exactly where it is. Switching a habit off does not take them either. That holds on the board too: what you have earned is recorded the day you earn it, and nothing later takes it back.`) +
          p(got
            ? `You have <strong style="color:var(--ink)">${got} of ${PASS_TRACK.length}</strong>${eq ? `, and you are showing <strong style="color:var(--ink)">${esc(eq.name)}</strong>` : ''}. ${nx ? `Next is <strong style="color:var(--ink)">${esc(nx.name)}</strong> at level ${nx.lv}.` : 'There is nothing left to unlock.'}`
            : `Your first is <strong style="color:var(--ink)">${esc(PASS_TRACK[0].name)}</strong> at level ${PASS_TRACK[0].lv}, which is one full day of habits away.`) +
          p(`It has its own tab now — <strong style="color:var(--ink)">Locker</strong>, last on the bar. Titles, card skins, the rank ladder and the reward road all live there.`));
      })()}

      ${(() => {
        const run = activeQuestRun(), qs = run ? runQuests(run) : [];
        if (!run || !qs.length) {
          return block(h2('Quests') +
            p(`From time to time your coach sets a <strong style="color:var(--ink)">run of quests</strong> — targets for the week rather than the day, worth real points on top of your habits.`) +
            p(`There are none running right now. When there are, they appear on your Today screen with a countdown, and everybody on the app gets the same ones.`));
        }
        return block(h2('Quests') +
          p(`Your coach has quests on right now: <strong style="color:var(--ink)">${qs.length} of them</strong>, ending ${esc(runEndLabel(run))}. They are targets for the week rather than the day, and they expire on that date, finished or not.`) +
          `<div style="display:flex;flex-direction:column;gap:0">
            ${qs.map(q => `<div class="row-rule" style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0">
              <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
                <span class="hd" style="font-size:14px;line-height:1">${esc(q.title)}</span>
                <span style="font-size:11px;color:var(--muted)">${esc(q.note)}</span>
              </span>
              <span class="mono" style="font-size:13px;font-weight:700;white-space:nowrap">+${q.xp}</span>
            </div>`).join('')}
          </div>` +
          `<div style="height:12px"></div>` +
          p(`Everybody gets the same quests, so the leaderboard stays fair. Each one pays once.`));
      })()}

      ${block(h2('Consistency') +
        // ONE word, two scopes. The app used to call the per-habit one a "run"
        // precisely so a 24-day water run could not be confused with a 2-day day
        // streak — Amir asked for `streak` everywhere, so the job of keeping
        // them apart moves from the noun to the SCOPE, and this paragraph is
        // now the only thing doing it. Every label says which one it means:
        // habit rows and the detail header carry the habit's own, the band at
        // the top of Today and Progress is always "DAY STREAK".
        p(`Two streaks, and it is worth knowing which is which. Every habit has <strong style="color:var(--ink)">its own streak</strong> — consecutive days you did that one thing, so 24 days of water is a 24-day streak, and it is the number on the habit's row. Your <strong style="color:var(--ink)">day streak</strong> is different: consecutive days where you cleared ${XP_RULES.streakQualifyPct}% of what the whole day was worth. That is the one at the top of Today. They move at different speeds, and a bad day breaks the second long before it breaks the first.`) +
        // The athlete-facing half of the weighted day score. Without this, a rest
        // day reading 71% while the streak survives looks like a bug on the one
        // screen they check every morning.
        p(`<strong style="color:var(--ink)">Not every habit is worth the same.</strong> Your day score is weighted — a session counts for more than a supplement, exactly as the points do — so it is a measure of how much of the day you got, not how many boxes you ticked. On a rest day it will read well under 100%, and that is honest: the session was part of the day and you did not do it.`) +
        // The rest-day figure is computed from THIS athlete's roster, not typed
        // in: someone tracking five habits sees their own number, and it stays
        // true if the weights are ever retuned. The paragraph only appears when
        // they actually have a locked habit — without one there is no gap to
        // explain, and the sentence would contradict itself at 100%.
        ((() => {
          const hs = live(), tot = hs.reduce((s, h) => s + baseXp(h), 0);
          const lock = hs.filter(h => h.locked).reduce((s, h) => s + baseXp(h), 0);
          if (!tot || !lock) return '';
          return p(`<strong style="color:var(--ink)">Your streak does not punish you for that.</strong> It only asks about what you could actually tick, so a locked session you have not earned is left out of the sum entirely. Do everything else on a rest day and the streak sees a full day — even while the score above it reads ${Math.round((tot - lock) / tot * 100)}%. Do the session and it counts twice over: it comes back into the day already finished.`);
        })()) +
        p(`Your streak sits at the top of <strong style="color:var(--ink)">Today</strong> and <strong style="color:var(--ink)">Progress</strong>, with the last seven days beside it — a filled square is a day that counted. Your longest single-habit run is in the stats on Progress, and each habit carries its own run in its row.`) +
        p(`Each habit has ${CONSISTENCY_TIERS.length} tiers, earned on your longest run ever — so breaking a run never takes a badge back.`) +
        // The athlete-facing half of "days are settled units". They will not read
        // the word roster, and they should not have to: what they need to know is
        // that changing the list is safe.
        p(`<strong style="color:var(--ink)">Changing what you track is safe.</strong> A day is judged on the habits you had switched on <em>that day</em>. Add a habit today and the days behind you keep the scores they earned; switch one off and it does not go back and make old days look better than they were. Today counts from now, because today is still yours to finish.`) +
        p(`<strong style="color:var(--ink)">Clearing a tier pays.</strong> What it pays depends on the habit: a tier on your workout is worth more than the same tier on your supplements, because a day of it is worth more. The figures below are for ${esc((live()[0] || HABITS[0]).name.toLowerCase())}; open any habit to see its own.`) +
        `<div style="display:flex;flex-direction:column;gap:0">
          ${CONSISTENCY_TIERS.map((t, i) => `<div class="row-rule" style="display:flex;justify-content:space-between;align-items:baseline;padding:9px 0">
            <span class="hd" style="font-size:14px">${esc(t.name)}</span>
            <span style="display:flex;gap:10px;align-items:baseline;white-space:nowrap">
              <span class="mono" style="font-size:11px;color:var(--muted)">${t.days} DAYS IN A ROW</span>
              <span class="mono" style="font-size:12px;font-weight:700;color:var(--clay-deep)">+${tierXp(live()[0] || HABITS[0], i)}</span>
            </span>
          </div>`).join('')}
        </div>` +
        `<div style="height:12px"></div>` +
        p(`Tier points are paid on the day you cross the tier, so they belong to the season you earned them in. A new season starts your points again — but the badges themselves stay yours.`))}

      ${block(h2('Seasons') +
        p(`Scoring runs in seasons, like ranked play in a game. You are in <strong style="color:var(--ink)">${esc(seasonName())}</strong>, which opened on ${esc(parseKey(seasonStart()).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }))}.`) +
        p(`Only days from the start of the season earn points. Anything you logged before it still sits in your history and still counts toward your streaks and consistency badges — it just does not score.`) +
        p(`When a new season opens, <strong style="color:var(--ink)">every score goes back to zero</strong> and everyone starts together. Nothing is deleted, and your consistency badges stay yours.`))}

      ${block(h2('The leaderboard') +
        p(`It is <strong style="color:var(--ink)">off until you join</strong>. Nobody sees you before that.`) +
        p(`When you join you pick your own name — it does not have to be your real one. Other athletes see <strong style="color:var(--ink)">that name and your points</strong>. They never see your habits, your logs, your programme or anything else. You can rename yourself or leave whenever you like.`) +
        p(`There are two boards. <strong style="color:var(--ink)">This season</strong> is every point since ${esc(seasonName().toLowerCase())} opened. <strong style="color:var(--ink)">Past week</strong> is a rolling seven days, so a strong week always shows and anyone can win it.`) +
        p(`Your points are worked out on the server from what you have actually logged — so the board is honest, and there is nothing to gain from fiddling with your phone.`))}

      ${block(h2('Your data') +
        p(`Everything is saved to your phone the moment you tap it, then synced to your coach when you have a connection. Losing signal, closing the app or flying somewhere loses nothing.`) +
        p(`<strong style="color:var(--ink)">There is no password, and no sign-in — your link is your account.</strong> Put it on your home screen or keep the message it came in. Losing the link is the only way to lose your way back in, and even then nothing is deleted: ask me for a fresh one and your whole history is still there.`) +
        p(`Your coach can see your habits as part of coaching you. Other athletes cannot — unless you join the leaderboard, and even then only your chosen name and points.`) +
        (isFree()
          ? p(`You signed up for this without a programme, so the only other things held about you are the <strong style="color:var(--ink)">email and number you gave</strong> — used to send you this link and nothing else. Ask and it is all deleted, log included. The full notice is at <strong style="color:var(--ink)">amirardekani.com/privacy.html</strong>.`)
          : ''))}

      <div style="padding:4px 20px 34px">
        <button class="btn btn-secondary btn-block" ${on(() => go('settings'))}>Back to settings</button>
      </div>
    </div>`;
}

// ── The rank ladder ───────────────────────────────────────────────────────
// The rank ladder and the reward road are ONE list here — every rank is a
// header on the road and its rewards sit under it, so the road ahead shows
// the crests, the titles and the skins in a single scroll. (The separate
// ladder screen is gone; two screens were describing the same climb.)
// The CSS for a card treatment, used for both the swatch on this screen and the
// canvas ground on the exported PNG. One definition, so the sample cannot lie
// about what the athlete will actually get.
const CARD_LOOK = {
  c_paper:     'background:linear-gradient(180deg,#6C5CE7,#4B3FBF)',
  c_ember:     'background:radial-gradient(120% 100% at 15% 100%, #FF8A5B 0%, #C74E28 35%, #17142B 78%)',
  c_blueprint: 'background:#5A4BD4;background-image:linear-gradient(rgba(246,244,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(246,244,255,.3) 1px,transparent 1px);background-size:7px 7px',
  c_night:     'background:#17142B;background-image:radial-gradient(120% 70% at 50% 0%,rgba(108,92,231,.55),transparent 65%)',
  // Hard colour stops, not a blend: at 34px a soft conic gradient averages out
  // to a muddy grey and the swatch stops looking like either colour.
  c_flare:     'background:conic-gradient(#6C5CE7 0deg 30deg, #17142B 30deg 90deg, #FF8A5B 90deg 120deg, #17142B 120deg 180deg, #6C5CE7 180deg 210deg, #17142B 210deg 270deg, #FF8A5B 270deg 300deg, #17142B 300deg 360deg)'
};

function renderPass() {
  const LI = overallLevel(), lv = LI.lv;
  const next = nextReward();
  const owned = passOwned().length;
  const eqT = passTitle(), eqC = passCard();
  const toNext = next ? Math.max(0, cumXpTo(next.lv) - LI.xp) : 0;
  const nextPct = next ? Math.max(2, Math.min(100, Math.round(LI.xp / Math.max(1, cumXpTo(next.lv)) * 100))) : 100;
  const titles = PASS_TRACK.filter(p => p.kind === 'title').concat(eventTitles());
  const cards = [CARD_BASE].concat(PASS_TRACK.filter(p => p.kind === 'card'));

  const wear = p => {
    if (!passHas(p.id) && p.id !== CARD_BASE.id) { toast((p.lv ? 'Level ' + p.lv : 'Finishing its event') + ' unlocks ' + p.name + '.'); return; }
    if (!CFG.pass) CFG.pass = { owned: [], title: null, card: null };
    if (p.kind === 'title') { CFG.pass.title = (CFG.pass.title === p.id) ? null : p.id; }
    else CFG.pass.card = p.id;
    saveCfg(); haptic('done'); render();
    if (p.kind === 'title') pushTitle();
  };

  // Titles rail — metal plates, one worn at a time.
  const plateBtn = p => {
    const has = passHas(p.id), isOn = eqT && eqT.id === p.id;
    if (!has) return `<button class="plate locked" data-k="rw:${p.id}" ${on(() => wear(p))}><span class="plate-in">🔒 ${p.lv ? 'LV ' + p.lv : esc(p.name)}</span></button>`;
    const m = METALS[titleMetalKey(p)];
    return `<button class="plate" data-k="rw:${p.id}" style="background:${m.rim};${isOn ? 'box-shadow:0 0 0 2px rgba(108,92,231,.5),0 6px 16px -8px rgba(108,92,231,.8);' : ''}" ${on(() => wear(p))}>
      <span class="plate-in" style="color:${titleMetalKey(p) === 'prisma' ? '#CBC6E4' : m.ink}">${isOn ? '◆ ' : ''}${esc(p.name)}</span></button>`;
  };
  // Skins rail — the card grounds, honest swatches from CARD_LOOK.
  const skinBtn = p => {
    const has = p.id === CARD_BASE.id || passHas(p.id), isOn = eqC.id === p.id;
    return `<button data-k="rw:${p.id}" style="flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit" ${on(() => wear(p))}>
      <span style="width:48px;height:60px;border-radius:12px;${has ? (CARD_LOOK[p.id] || CARD_LOOK.c_paper) : 'background:var(--surface);border:2px dashed var(--box)'};${isOn ? 'box-shadow:0 0 0 2.5px var(--accent),0 6px 14px -6px rgba(108,92,231,.8);' : ''}${has ? '' : 'display:flex;align-items:center;justify-content:center;'}">${has ? '' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;color:var(--muted-soft)"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'}</span>
      <span style="font-size:9px;font-weight:${isOn ? 800 : 700};letter-spacing:.04em;color:${isOn ? 'var(--accent)' : 'var(--muted)'}">${esc(p.name)}${isOn ? ' ✓' : (has ? '' : ' · LV ' + p.lv)}</span></button>`;
  };

  // The road — the rank ladder and the rewards, merged into ONE list. Every
  // rank is a header on the road and the rewards it pays sit under it, so one
  // scroll shows the levels ahead, their crests, and what each one hands you
  // and when. (The separate ladder screen is gone — two screens were
  // describing the same climb.)
  const cur = LI.rank, curIdx = RANKS.indexOf(cur.name);
  const rankTop = (curIdx + 1) * SUBS_PER_RANK + cur.star * LEVELS_PER_CYCLE;
  const toRankUp = Math.max(0, cumXpTo(rankTop + 1) - LI.xp);
  const nextRankName = RANKS[(curIdx + 1) % RANKS.length];
  const rewardRow = p => {
    const has = passHas(p.id), isNext = next && next.id === p.id;
    const preview = p.kind === 'card'
      ? `<span style="flex:none;width:26px;height:33px;border-radius:7px;${CARD_LOOK[p.id] || CARD_LOOK.c_paper}"></span>`
      : '';
    if (isNext) return `
      <div style="display:flex;gap:13px;align-items:center;border-radius:18px;background:var(--card);box-shadow:0 0 0 2px var(--accent),var(--shadow);padding:10px 12px;margin:4px 0" data-k="road:${p.id}">
        <span style="flex:none;width:38px;height:38px;border-radius:999px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">${p.lv}</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-weight:700;font-size:13.5px">${esc(p.name)}${p.kind === 'card' ? ' skin' : ' title'}</span><span style="flex:none;font-size:10px;font-weight:800;color:var(--accent)">NEXT · LV ${p.lv}</span></span>
          <span class="bar thin" style="height:6px"><span data-fill style="width:${nextPct}%"></span></span>
          <span style="font-size:10.5px;color:var(--muted)">${toNext.toLocaleString()} XP — about ${Math.max(1, Math.round(toNext / Math.max(1, perfectDayXp())))} good day${Math.max(1, Math.round(toNext / Math.max(1, perfectDayXp()))) === 1 ? '' : 's'}</span>
        </span>${preview}
      </div>`;
    if (has) return `
      <div style="display:flex;gap:13px;align-items:center;padding:7px 0 7px 4px" data-k="road:${p.id}">
        <span style="flex:none;width:34px;height:34px;border-radius:999px;background:var(--teal);color:#0C4B43;display:flex;align-items:center;justify-content:center">${TICK}</span>
        <span style="flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="display:flex;flex-direction:column"><span style="font-weight:700;font-size:13.5px">${esc(p.name)}${p.kind === 'card' ? ' skin' : ' title'}</span><span style="font-size:10.5px;color:var(--muted-soft)">Level ${p.lv}</span></span>
          <span style="flex:none;display:flex;align-items:center;gap:8px">${preview}<span style="font-size:10px;font-weight:700;color:var(--teal-deep)">KEPT</span></span>
        </span>
      </div>`;
    return `
      <div style="display:flex;gap:13px;align-items:center;padding:7px 0 7px 4px;opacity:.62" data-k="road:${p.id}">
        <span style="flex:none;width:34px;height:34px;border-radius:999px;border:2px dashed var(--box);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800">${p.lv}</span>
        <span style="flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="display:flex;flex-direction:column"><span style="font-weight:700;font-size:13.5px;color:var(--muted)">${esc(p.name)}${p.kind === 'card' ? ' skin' : ' title'}</span><span style="font-size:10.5px;color:var(--muted-soft)">Level ${p.lv} · ${esc(p.note)}</span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none;width:13px;height:13px;color:var(--muted-soft)"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </span>
      </div>`;
  };
  const road = RANKS.map((name, i) => {
    const first = i * SUBS_PER_RANK + 1, last = (i + 1) * SUBS_PER_RANK;
    const here = curIdx === i;
    const passed = cur.star > 0 || curIdx > i;
    const subsOn = here ? cur.sub : (passed ? SUBS_PER_RANK : 0);
    const cost = cumXpTo(first + cur.star * LEVELS_PER_CYCLE);
    return `
      <div style="display:flex;gap:12px;align-items:center;padding:${i ? '16px' : '6px'} 0 8px${i ? ';border-top:1px solid var(--rule);margin-top:6px' : ''}${here || passed ? '' : ';opacity:.62'}" data-k="road-rank:${name}">
        ${rankCrest(name, 34)}
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
