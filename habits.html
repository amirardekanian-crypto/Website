function levelInfo(xp, base) {
  base = base || XP_RULES.base;
  let lv = 1, spent = 0, cost = levelCost(base, 1);
  while (lv < MAX_LEVEL_SCAN && xp - spent >= cost) { spent += cost; lv++; cost = levelCost(base, lv); }
  const into = xp - spent, r = rankFor(lv);
  return {
    lv, xp, into, need: cost, toNext: cost - into,
    pct: Math.max(0, Math.min(100, Math.round(into / cost * 100))),
    rank: r, label: r.label,
    nextLabel: (cost - into) + ' XP to level ' + (lv + 1)
  };
}
function overallLevel() { return levelInfo(overallXp(), XP_RULES.base); }
function habitLevel(h) { return levelInfo(habitXp(h), baseFor(h)); }

// XP earned inside a date window — powers the weekly recap. Season-gated too,
// so the first week of a season never shows points carried in from before it.
function xpBetween(fromDate, toDate) {
  let sum = 0;
  seasonDays().forEach(k => {
    const d = parseKey(k);
    if (d < fromDate || d > toDate) return;
    allHabits().forEach(h => { sum += xpFor(h, valOf(k, h.id)); });
  });
  return sum + bonusXpBetween(fromDate, toDate);
}

// ── Consistency ladders ───────────────────────────────────────────────────
// Tier is earned on the BEST run ever, so a broken streak never revokes a badge.
function consistencyFor(h) {
  const best = habitBest(h), cur = habitStreak(h);
  let tier = 0;
  CONSISTENCY_TIERS.forEach((t, i) => { if (best >= t.days) tier = i + 1; });
  return { best, cur, tier, next: CONSISTENCY_TIERS[tier] || null, total: CONSISTENCY_TIERS.length };
}
function measureAch(a) {
  if (a.measure === 'perfectDays') return loggedDays().filter(isPerfect).length;
  // rosterOn(k), not live(). This is the DISPLAY half of daysWith3; bonusEvents()
  // is the half that pays, and it was corrected in stage18 while this one was
  // missed. The two then disagreed in the one direction that is hardest to
  // notice: switching a habit off dropped days from the counter on Progress
  // (they no longer had three habits DONE from today's list) while the 75xp the
  // milestone had already paid correctly stayed put, because the ledger scores
  // each day against the roster that day actually had. A progress figure that
  // falls while the XP behind it does not is the same class of bug as the board
  // and the phone disagreeing — nothing errors, it just quietly lies.
  if (a.measure === 'daysWith3') return loggedDays().filter(k => rosterOn(k).filter(h => isDone(h, k)).length >= 3).length;
  const parts = a.measure.split(':'), kind = parts[0], h = habitById(parts[1]);
  if (kind === 'streak') return habitStreak(h);
  if (kind === 'daysHit') return loggedDays().filter(k => isDone(h, k)).length;
  return 0;
}
function dayNumber() {
  const days = loggedDays();
  if (!days.length) return 1;
  return Math.max(1, Math.round((today() - parseKey(days[0])) / 86400000) + 1);
}

// How hot a streak reads: 0 none · 1 warm from 5 days · 2 burning from 15 · 3 from 30.
function emberLevel(st) { return st >= 30 ? 3 : st >= 15 ? 2 : st >= 5 ? 1 : 0; }

// ── The app noticing you have stalled ─────────────────────────────────────
// Twenty seconds after the last tap, the most valuable habit still undone starts
// breathing. Only on Today, never over a sheet or a celebration, and never for a
// locked habit the athlete cannot action from here.
let _idleTimer = null;
function armIdle() {
  clearTimeout(_idleTimer);
  UI.idle = null;
  _idleTimer = setTimeout(() => {
    if (UI.screen !== 'today' || UI.celebrate.length || UI.sheet || TOUR.on || reduced()) return;
    const cand = live().filter(h => !isDone(h) && !h.locked)
                       .sort((a, b) => baseXp(b) - baseXp(a))[0];
    if (!cand) return;
    UI.idle = cand.id;
    render();
  }, 20000);
}

// A day that is about to break a streak the athlete actually has. Late enough to
// be true, and gated on `currentDayStreak() > 0` so it threatens something real
// rather than nagging someone who has nothing on the line yet.
function atRisk() {
  return new Date().getHours() >= 20 && !dayQualifies(TKEY()) && currentDayStreak() > 0;
}
// How many more habits would rescue the day. Not a headcount any more: the day
// is scored by weight, so the answer is the FEWEST remaining habits that close
// the gap — which is simply the heaviest ones first. Greedy is exactly right
// here, not an approximation: to reach a total in the fewest picks you always
// take the biggest available.
//
// Locked habits are skipped because the athlete cannot tick them, which is the
// same rule the gate itself uses — and it is why this can never run out of
// road. Doing every unlocked habit leaves only unearned locks, and those are
// not in the denominator, so the day lands on 100%.
function shortOfQualifying() {
  const p = dayParts(TKEY(), 'gate');
  if (!p.total) return 0;
  const need = p.total * XP_RULES.streakQualifyPct / 100;
  const left = rosterOn(TKEY()).filter(h => !isDone(h) && !h.locked)
                               .sort((a, b) => baseXp(b) - baseXp(a));
  let have = p.done, n = 0;
  while (have < need && n < left.length) { have += baseXp(left[n]); n++; }
  return Math.max(1, n);
}

// ── The nudge (one a day, driven by what is actually missing) ─────────────
// Every nudge carries a `key` describing the SITUATION rather than the sentence.
// The typing card keys off that, so logging another glass of water updates the
// number in place instead of retyping the whole line from scratch.
function nudge() {
  const hs = live(), missing = hs.filter(h => !isDone(h));

  // Loss beats gain: a real streak on the line tonight outranks everything.
  if (atRisk()) {
    const st = currentDayStreak(), short = shortOfQualifying();
    const t = missing.filter(h => !h.locked).sort((a, b) => baseXp(b) - baseXp(a))[0];
    return { risk: true, key: 'risk',
             line: pickLine('risk', 'risk', { st: st, n: short }),
             cta: t ? 'SAVE IT · ' + t.name : 'SEE WHERE YOU STAND',
             target: t ? t.id : null };
  }

  // Everything done — the only nudge with nothing to ask for.
  if (!missing.length) {
    return { key: 'done', line: pickLine('allDone', 'done'), cta: 'SEE WHERE YOU STAND', target: null };
  }

  // Nothing logged at all yet: point at the cheapest win rather than the biggest.
  const doneCount = hs.length - missing.length;
  if (doneCount === 0) {
    const easy = missing.filter(h => !h.locked).sort((a, b) => baseXp(a) - baseXp(b))[0] || missing[0];
    return { key: 'empty', line: pickLine('empty', 'empty'),
             cta: 'START WITH ' + easy.name, target: easy.id };
  }

  // Down to one. Name it — being specific is what makes it land.
  if (missing.length === 1) {
    const only = missing[0];
    return { key: 'last:' + only.id,
             line: pickLine('lastOne', 'last:' + only.id, { name: only.name.toLowerCase() }),
             cta: only.locked ? 'OPEN YOUR PROGRAMME' : 'FINISH ' + only.name,
             target: only.locked ? null : only.id };
  }

  // A run going well and today already qualifies: say so instead of inventing a
  // complaint. The coach notices both directions.
  const st = currentDayStreak();
  if (st >= 5 && dayQualifies(TKEY())) {
    return { key: 'rolling', line: pickLine('rolling', 'rolling', { st: st }),
             cta: 'SEE WHERE YOU STAND', target: null };
  }

  // Otherwise: the most valuable thing they can still action, in its own words.
  const t = missing.filter(h => !h.locked).sort((a, b) => baseXp(b) - baseXp(a))[0] || missing[0];
  const left = t.kind === 'count'
    ? Math.max(1, Math.ceil(t.target - valOf(TKEY(), t.id)))
    : 1;
  return { key: 'h:' + t.id,
           line: pickLine(NUDGES[t.id] ? t.id : 'empty', 'h:' + t.id,
                          { n: fmtVal(t, left), name: t.name.toLowerCase(), unit: t.unit }),
           cta: t.locked ? 'OPEN YOUR PROGRAMME' : 'SORT ' + t.name,
           target: t.locked ? null : t.id };
}

// ── Level-up detection ────────────────────────────────────────────────────
// Levels are derived, never stored, so instead of catching every mutation we
// keep the last level the athlete has actually been SHOWN (CFG.seen) and diff
// against it. That covers local check-offs, a cloud sync arriving with new XP,
// and migrations alike.
function currentLevels() {
  const out = { _overall: overallLevel().lv };
  allHabits().forEach(h => { out[h.id] = habitLevel(h).lv; });
  return out;
}
// Signature of everything that affects scoring. When XP_RULES or a target
// changes, levels legitimately move — we re-baseline silently instead of
// firing a hundred celebrations the athlete did not earn today.
function rulesSignature() {
  const src = JSON.stringify([
    XP_RULES.base, XP_RULES.growth, XP_RULES.completionBonus, XP_RULES.customXp,
    XP_RULES.weights, HABITS.map(h => [h.id, h.target]),
    // The qualify threshold was missing here, which mattered the moment the day
    // score became weighted: it decides every day streak and the `qualify`
    // quest kind, so moving it has to re-baseline rather than silently restate
    // an athlete's history at them.
    XP_RULES.streakQualifyPct,
    // Tier days AND their multipliers, plus every milestone's cost and payout —
    // all of these now move real XP, so retuning any of them has to re-baseline
    // rather than fire a wall of celebrations nobody earned today.
    CONSISTENCY_TIERS.map(t => [t.days, t.mult]),
    ACHIEVEMENTS.map(a => [a.code, a.need, a.xp]),
    seasonStart()   // a new season resets every score, so re-baseline instead of celebrating
  ]);
  let hash = 0;
  for (let i = 0; i < src.length; i++) hash = (hash * 31 + src.charCodeAt(i)) % 2147483647;
  return 'r' + hash.toString(36);
}
function seedSeenLevels() { CFG.seen = currentLevels(); CFG.rulesSig = rulesSignature(); seedUnlocks(); saveCfg(); }
function checkLevelUps() {
  const sig = rulesSignature();
  if (!CFG.seen || CFG.rulesSig !== sig) {
    const rescored = !!CFG.seen && CFG.rulesSig !== sig;
    const wasSeason = CFG.seenSeason && CFG.seenSeason !== seasonStart();
    CFG.seenSeason = seasonStart();
    seedSeenLevels();
    if (rescored) toast(wasSeason ? seasonName().toUpperCase() + ' has begun — scores start from zero.'
                                  : 'XP system updated — your levels were rescored.');
    return;
  }
  const now = currentLevels(), seen = CFG.seen, events = [];
  Object.keys(now).forEach(id => {
    const from = typeof seen[id] === 'number' ? seen[id] : now[id];
    if (now[id] <= from) return;
    const overall = id === '_overall';
    const a = rankFor(now[id]), b = rankFor(from);
    const rankChanged = a.name !== b.name || a.star !== b.star;
    // Full-screen takeover for an overall level or a real rank promotion.
    // Routine habit levels flash in their row, so day one is not nine takeovers.
    events.push({ id, overall, from, to: now[id], rankChanged,
                  name: overall ? 'OVERALL' : habitById(id).name,
                  big: overall || rankChanged });
  });
  CFG.seen = now;
  saveCfg();
  events.forEach(e => {
    if (e.big) { UI.celebrate.push(e); haptic(e.rankChanged ? 'rank' : 'level'); }
    else UI.flash[e.id] = e.to;
  });
  // Rewards ride behind the level that earned them, so the order reads as cause
  // then effect rather than a prize arriving before the reason for it.
  claimRewards(false).forEach(r => {
    UI.celebrate.push({ kind: 'reward', id: r.id, reward: r });
    haptic('rank');
  });
  // Finishing an event is the biggest single thing in the app that is not a
  // level, so it takes over the screen like one.
  claimEventTitles(false).forEach(r => {
    UI.celebrate.push({ kind: 'reward', id: r.id, reward: r });
    haptic('rank');
  });
  if (events.length) {
    clearTimeout(_flashTimer);
    _flashTimer = setTimeout(() => { UI.flash = {}; render(); }, 1600);
  }
  checkUnlocks();
}

// ── Unlock detection ──────────────────────────────────────────────────────
// Levels were the only thing this app ever noticed. Consistency tiers,
// milestones and a perfect day all landed in total silence — a pip quietly
// filling on a tab the athlete might not open that day. They are the biggest
// moments the system has, so now they get seen.
//
// Baselined exactly like levels: an athlete arriving with history already behind
// them gets it recorded, not replayed at them.
function currentTiers() {
  const out = {};
  allHabits().forEach(h => { out[h.id] = consistencyFor(h).tier; });
  return out;
}
function currentAch() { return ACHIEVEMENTS.filter(a => measureAch(a) >= a.need).map(a => a.code); }
function currentQuests() { return questEvents().map(e => e.id); }
function seedUnlocks() {
  CFG.seenTiers = currentTiers();
  CFG.seenAch = currentAch();
  CFG.seenPerfect = isPerfect(TKEY()) ? TKEY() : null;
  CFG.seenQuests = currentQuests();
}
function checkUnlocks() {
  if (!CFG.seenTiers || !Array.isArray(CFG.seenAch) || !Array.isArray(CFG.seenQuests)) { seedUnlocks(); saveCfg(); return; }
  const tiers = currentTiers(), ach = currentAch(), events = [];

  // Tiers are COALESCED BY TIER, not reported per habit. An athlete who has been
  // solid since day one crosses the 20-day tier on all eight habits on the same
  // day, and eight identical takeovers in a row is a punishment, not a reward —
  // the same reasoning that keeps routine habit levels down to an inline chip.
  const byTier = {};
  allHabits().forEach(h => {
    const was = typeof CFG.seenTiers[h.id] === 'number' ? CFG.seenTiers[h.id] : tiers[h.id];
    if (tiers[h.id] <= was) return;
    // Crossing several tiers at once (a long run imported at once) reports only
    // the highest reached — the lower ones are implied by it.
    const idx = tiers[h.id] - 1, t = CONSISTENCY_TIERS[idx];
    if (!t) return;
    (byTier[t.days] = byTier[t.days] || { tier: t, tierIndex: idx, habits: [] }).habits.push(h);
  });
  Object.keys(byTier).sort((a, b) => a - b).forEach(days => {
    const g = byTier[days];
    events.push({ kind:'tier', id:'t' + days, tier:g.tier, tierIndex:g.tierIndex, habits:g.habits });
  });
  ach.forEach(code => {
    if (CFG.seenAch.indexOf(code) !== -1) return;
    const a = ACHIEVEMENTS.find(x => x.code === code);
    if (a) events.push({ kind:'milestone', id:code, ach:a });
  });
  // A perfect day is judged on TODAY alone. Judging it across history would fire
  // a burst the moment somebody switched a habit off, because every thin day
  // behind them would retroactively become perfect.
  if (isPerfect(TKEY()) && CFG.seenPerfect !== TKEY()) events.push({ kind:'perfect', id:TKEY() });

  // Quests. Only this week's get a takeover — an older week completing is
  // history arriving late (a cloud sync, a backfilled session), not a moment.
  const quests = currentQuests(), run = activeQuestRun();
  quests.forEach(qid => {
    if (CFG.seenQuests.indexOf(qid) !== -1) return;
    // Only the run that is live right now gets a takeover. An older run
    // completing is history arriving late (a cloud sync, a backfilled session),
    // not a moment.
    if (!run || qid.indexOf(run.start + ':') !== 0) return;
    const q = questPool().find(x => x.id === qid.slice(run.start.length + 1));
    if (q) events.push({ kind:'quest', id:qid, quest:q });
  });

  CFG.seenTiers = tiers;
  CFG.seenAch = ach;
  CFG.seenQuests = quests;
  if (isPerfect(TKEY())) CFG.seenPerfect = TKEY();
  saveCfg();
  if (!events.length) return;
  events.forEach(e => UI.celebrate.push(e));
  haptic('rank');
}
function dismissCelebration() { UI.celebrate.shift(); haptic('tick'); render(); }

// ── Add to home screen ────────────────────────────────────────────────────
// Offered ONCE, and deliberately not on arrival. A pop-up before the app has
// done anything is a stranger asking for a place on your phone; straight after
// the first thing they log, it is "keep this" — and the manifest's start_url
// carries their client+key, so the installed icon is *their* app, not a login
// screen. A Settings row keeps it reachable for anyone who says no.
//
// beforeinstallprompt is Chromium-only. iOS Safari has no such event and no way
// to trigger the OS sheet from script, so there the offer is instructions.
let deferredInstall = null, _installTimer = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS() {
  // iPadOS 13+ reports itself as a Mac; the touch-point count is what separates
  // a real iPad from a desktop Safari.
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
// Already installed, or a shared demo nobody should be pinning to a home screen.
function installable() { return !window.IS_DEMO && !isStandalone(); }

// THE MOST LIKELY WAY AN ATHLETE FIRST OPENS THIS APP is by tapping the link in
// a WhatsApp message — so the first screen they ever see is inside WhatsApp's
// own browser, not Safari or Chrome. In-app browsers cannot add anything to a
// home screen: some have no share sheet at all, and the ones that do leave
// "Add to Home Screen" out of it. Telling them to "tap Share" there sends them
// looking for a button that is not on their phone.
//
// Detection is best-effort — these UA markers are reliable for the apps that
// matter (Instagram, Facebook, WhatsApp on Android), and the iOS copy carries a
// fallback line for the ones that hide, because a WKWebView can look like plain
// Safari.
function inAppBrowser() {
  const ua = navigator.userAgent || '';
  return /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Snapchat|LinkedInApp|MicroMessenger|Twitter/i.test(ua);
}

function maybeOfferInstall() {
  if (!installable() || !CFG || CFG.installAsked || _installTimer) return;
  _installTimer = setTimeout(() => {
    _installTimer = null;
    // Never on top of something else. A celebration is the moment they came for,
    // the log sheet is a task in progress, the tour is an explanation in
    // progress, and any other screen means they went somewhere on purpose.
    if (!installable() || CFG.installAsked || UI.celebrate.length || UI.sheet ||
        TOUR.on || UI.screen !== 'today' || UI.install) return;
    UI.install = true;
    render();
  }, 1500);
}
function closeInstall() { UI.install = false; CFG.installAsked = true; saveCfg(); render(); }
async function doInstall() {
  const p = deferredInstall;
  deferredInstall = null;
  closeInstall();
  if (!p) return;
  p.prompt();
  await p.userChoice.catch(() => {});
}
// The sheet is the app's own modal language — same scrim, same slide-up, same
// left edge. The icon and the name are the real ones, so what they are agreeing
// to is what they will find on their home screen.
function renderInstall() {
  const ios = isIOS(), canPrompt = !!deferredInstall, inApp = inAppBrowser();
  // Three situations, three honest answers. Getting this wrong is worse than
  // saying nothing: an instruction that names a button they do not have reads
  // as "this app is broken", on the first screen they ever see.
  const how = inApp
    ? `You are inside another app's browser, which cannot do it. Open the menu
       (<strong style="color:var(--ink)">&hellip;</strong> or
       <strong style="color:var(--ink)">&#8942;</strong>) and choose
       <strong style="color:var(--ink)">Open in ${ios ? 'Safari' : 'browser'}</strong>,
       then try again from there.`
    : ios
      ? `Tap <strong style="color:var(--ink)">Share</strong> at the bottom of the screen, then
         <strong style="color:var(--ink)">Add to Home Screen</strong>.
         <span style="color:var(--muted)">Not seeing it? You are in another app's browser —
         open this link in Safari first.</span>`
      : `One tap to today, and it keeps working with no signal.`;
  return `
    <div class="scrim" data-k="scrim:install" ${on(() => closeInstall())}></div>
    <div class="sheet" data-k="sheet:install">
      <div style="display:flex;align-items:center;gap:13px">
        <!-- Width and height inline: a stale CSS cache has blown an unsized
             lockup up to full width on this site before. -->
        <img src="/assets/img/icon-192.png" alt="" width="54" height="54"
             style="width:54px;height:54px;flex:none;display:block;border:1px solid var(--rule)">
        <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
          <span class="hd" style="font-size:23px;line-height:1">AA Proof</span>
          <span class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">On your home screen</span>
        </span>
      </div>
      <div style="font-size:13.5px;line-height:1.55">
        ${how}
        Nothing to download — it is this, kept where you can reach it.
      </div>
      ${canPrompt && !inApp ? `<button class="btn btn-primary btn-block" ${on(() => doInstall())}>Add to home screen</button>` : ''}
      <button class="btn btn-secondary btn-block" ${on(() => closeInstall())}>${canPrompt && !inApp ? 'Not now' : 'Got it'}</button>
    </div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────
function toast(text) {
  UI.toast = text; render();
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { UI.toast = null; render(); }, 2200);
}
// The one door into the log, so the ceiling belongs here rather than on each
// control that writes through it.
function capFor(h) { return (h.target || 1) * XP_RULES.dailyCap; }
function setVal(id, v) {
  const k = AKEY();
  if (!canLog(k)) return;                  // the window has closed — write nothing
  if (!LOG[k]) LOG[k] = {};
  LOG[k][id] = Math.max(0, Math.min(v, capFor(habitById(id))));
  saveLog();
  // The one door into the log is also the only place that knows they have just
  // used the app for real — which is the moment to ask about the home screen.
  maybeOfferInstall();
}
function toggleHabit(h) {
  // A locked habit is owned by another system — the athlete cannot claim it by
  // hand, so explain what does earn it instead of silently doing nothing. No
  // haptic and no XP flight either: nothing was earned to celebrate.
  if (h.locked) { toast((isFree() && h.freeHint) || h.lockedHint || 'This one is earned elsewhere.'); return; }
  const done = isDone(h, AKEY()), before = habitXp(h), rect = UI._tapRect;
  setVal(h.id, done ? 0 : h.target);
  checkLevelUps();
  render();
  if (done) { haptic('tick'); return; }        // unticking earns nothing to fly
  const gained = habitXp(h) - before;
  haptic('done');
  toast('+' + gained + ' XP · ' + h.name + ' logged' + (editingPast() ? dayTag() + '.' : '. Look at you.'));
  flyXp(gained, rect);
}
function bump(h) {
  const before = habitXp(h), rect = UI._tapRect;
  const cur = valOf(AKEY(), h.id);
  // Clamped to the DAILY CAP, not to the target. It used to be
  // `Math.min(h.target, cur + step)`, which SUBTRACTS from anything already
  // logged above the target: the sheet accepts up to dailyCap × target
  // (30,000 steps), so a real 12,000-step day plus one tap of + became 10,000
  // — 2,000 steps deleted — and the toast reported it as "+0 XP · STEPS
  // complete". A control labelled + must never lower the number.
  const v = Math.min(capFor(h), cur + (h.step || 1));
  setVal(h.id, v);
  checkLevelUps();
  render();
  const gained = habitXp(h) - before, complete = v >= h.target;
  haptic(complete ? 'done' : 'tick');
  // Past the target there is nothing left to earn — xpFor() stops there — so
  // say that rather than printing "+0 XP" under a word like "complete".
  toast(gained > 0
    ? (complete ? '+' + gained + ' XP · ' + h.name + ' complete' + dayTag() + '.'
                : '+' + gained + ' XP' + dayTag() + '. Keep them coming.')
    : h.name + ' was already done' + dayTag() + '. Logged, but there is no more XP in it today.');
  flyXp(gained, rect);
}
// Removing a custom habit takes its logged values with it. The app stops
// counting a removed habit the moment it leaves CFG.custom — allHabits() no
// longer lists it — but the SERVER's hab_xp() walks every key in a day and pays
// customXp for anything it does not recognise, so a left-behind key kept scoring
// on the leaderboard and nowhere else, and the two could never reconcile. The
// toggle beside it is still the non-destructive door: switching a habit off
// pauses it and keeps every point.
function removeCustom(h) {
  CFG.custom = (CFG.custom || []).filter(c => c.id !== h.id);
  delete CFG.on[h.id];
  Object.keys(LOG).forEach(day => {
    if (LOG[day] && typeof LOG[day] === 'object') delete LOG[day][h.id];
  });
  saveLog();                 // both of these invalidate the bonus cache

    // zero-width — so the card occupies its FINAL height from the first frame.
    // Typing into an emptied element instead grows the card as it goes, which
    // shoves everything below it and drags the scroll position with it.
    const st = { full: full, i: 0, done: false };
    _typeState.set(el, st);
    el.textContent = '';
    const shown = document.createTextNode('');
    const caret = document.createElement('i');
    caret.className = 'caret';
    const rest = document.createElement('span');
    rest.style.visibility = 'hidden';
    rest.textContent = full;
    el.append(shown, caret, rest);
    const step = () => {
      if (!el.isConnected) { st.done = true; return; }
      st.i++;
      // Re-read st.full every frame, so a retarget mid-flight simply lands on
      // the new text instead of finishing the old one and then jumping.
      const f = st.full;
      shown.nodeValue = f.slice(0, st.i);
      rest.textContent = f.slice(st.i);
      if (st.i < f.length) { setTimeout(step, 13); return; }
      st.done = true;
      caret.remove();
      rest.remove();
      el.textContent = f;
    };
    setTimeout(step, 140);
  });
}

// A bar that survives a render animates itself, because its width transition is
// finally attached to a node that still exists. A bar seeing its first paint has
// nothing to travel from, so we give it one.
const _seenBars = new WeakSet();
function fillBars(root) {
  root.querySelectorAll('[data-fill]').forEach(el => {
    if (_seenBars.has(el)) return;
    _seenBars.add(el);
    if (reduced()) return;
    const target = el.style.width;
    el.style.width = '0%';
    void el.offsetWidth;                       // commit the zero before asking for the target
    requestAnimationFrame(() => { el.style.width = target; });
  });
}

// ── Haptics ───────────────────────────────────────────────────────────────
// A tick you can feel in your hand is most of what separates an app from a
// web page. Silent no-op wherever the API is missing — notably every iPhone,
// since Safari still exposes no vibration at all — so it can never be the thing
// that breaks a check-off.
const HAPTIC = { tick:[12], done:[10,40,24], level:[0,26,70,26,70,60], rank:[0,30,60,30,60,30,60,90], tab:[8] };
function haptic(kind) {
  try { if (navigator.vibrate) navigator.vibrate(HAPTIC[kind] || HAPTIC.tick); } catch (e) {}
  blip(kind);
}

// ── Sound ─────────────────────────────────────────────────────────────────
// Off unless the athlete turns it on, and synthesised rather than loaded — a
// short square blip costs no bytes and cannot fail to download. This is also the
// only feedback an iPhone actually gets, since Safari has no vibration API.
let _actx = null;
const BLIP = { tick:[660,0.055,0.05], done:[880,0.14,0.07], level:[1046,0.2,0.075],
               rank:[1318,0.26,0.08], tab:[520,0.035,0.035] };
function blip(kind) {
  if (!CFG || !CFG.sound) return;
  const spec = BLIP[kind] || BLIP.tick;
  try {
    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === 'suspended') _actx.resume();
    const t = _actx.currentTime;
    const osc = _actx.createOscillator(), gain = _actx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(spec[0], t);
    if (kind !== 'tick' && kind !== 'tab') osc.frequency.exponentialRampToValueAtTime(spec[0] * 1.5, t + spec[1] * 0.7);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(spec[2], t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + spec[1]);
    osc.connect(gain); gain.connect(_actx.destination);
    osc.start(t); osc.stop(t + spec[1] + 0.05);
  } catch (e) { /* no audio on this device — never a reason to break a tick */ }
}

// ── Gestures ──────────────────────────────────────────────────────────────
// Bound once per node (the renderer keeps nodes alive, so binding per render
// would stack listeners). Two things a sheet on a phone should always do: come
// away under your thumb, and let you hold a stepper instead of tapping it forty
// times to log ten thousand steps.
const _bound = new WeakSet();
function bindGestures(root) {
  const sheet = root.querySelector('.sheet');
  if (sheet && !_bound.has(sheet)) {
    _bound.add(sheet);
    let y0 = null, dy = 0, h = 0;
    sheet.addEventListener('pointerdown', ev => {
      // Only drag from the sheet's own chrome, never from a control inside it.
      if (ev.target.closest('button, input, .stepper')) return;
      y0 = ev.clientY; dy = 0; h = sheet.getBoundingClientRect().height;
      sheet.style.transition = 'none';
      sheet.setPointerCapture(ev.pointerId);
    });
    sheet.addEventListener('pointermove', ev => {
      if (y0 === null) return;
      dy = Math.max(0, ev.clientY - y0);
      sheet.style.transform = 'translateY(' + dy + 'px)';
    });
    const release = () => {
      if (y0 === null) return;
      const far = dy > Math.min(120, h * 0.3);
      y0 = null;
      sheet.style.transition = 'transform .24s cubic-bezier(.16,1,.3,1)';
      if (far) {
        sheet.style.transform = 'translateY(100%)';
        haptic('tab');
        setTimeout(() => { UI.sheet = null; render(); }, 180);
      } else {
        sheet.style.transform = '';
      }
    };
    sheet.addEventListener('pointerup', release);
    sheet.addEventListener('pointercancel', release);
  }

  // The sheet's steppers AND Today's + . The + was left out, so logging 10,000
  // steps from the list where the athlete actually stands was twenty taps while
  // the same job inside the sheet was one hold — and nothing on either screen
  // said which was which.
  root.querySelectorAll('.stepper button, .hrow:not(.locked) .pluscell').forEach(btn => {
    if (_bound.has(btn)) return;
    _bound.add(btn);
    btn.addEventListener('pointerdown', () => startRepeat(btn));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(e => btn.addEventListener(e, stopRepeat));
  });
  // A finger does not always come back up over the button it went down on, and
  // the sheet can be dragged away mid-hold — so the release is also watched at
  // the window, once, for every stepper there will ever be.
  if (!_repeatWatched) {
    _repeatWatched = true;
    window.addEventListener('pointerup', stopRepeat);
    window.addEventListener('pointercancel', stopRepeat);
    window.addEventListener('blur', stopRepeat);
  }
}
// ── The stepper's hold-to-repeat ──────────────────────────────────────────
// One repeat at a time, held at module level so it can always be found and
// killed. It used to be a closure per button whose only exits were pointerup,
// pointercancel and pointerleave ON THAT BUTTON — miss all three (the sheet is
// dismissed under the thumb, the pointer is captured elsewhere, the app goes to
// the background) and the interval ran forever, clicking a control nobody was
// touching. Reproduced: the number drained 500 at a time while the athlete
// watched it. Two independent exits now, either of which is enough on its own.
let _repHold = null, _repTimer = null, _repeatWatched = false;
function stopRepeat() {
  clearTimeout(_repHold); clearInterval(_repTimer);
  _repHold = _repTimer = null;
}
function startRepeat(btn) {
  stopRepeat();
  // 420ms before it starts repeating, then ~9/sec — fast enough for 10,000
  // steps, slow enough that a normal tap is never mistaken for a hold.
  _repHold = setTimeout(() => {
    _repTimer = setInterval(() => {
      if (!btn.isConnected) { stopRepeat(); return; }   // the sheet went away
      btn.click();
    }, 110);
  }, 420);
}

// ── The XP flight ─────────────────────────────────────────────────────────
// The most important 700ms in the app: the points you just earned visibly leave
// the habit that earned them and land on the level that owns them, which then
// takes the hit. Without this the hero is a label; with it, it is a destination.
function flyXp(amount, rect) {
  if (reduced() || !amount || amount <= 0 || !rect) return;
  const app = document.getElementById('app');
  const fx = document.getElementById('fx');
  const hero = app && app.querySelector('[data-hero]');
  if (!app || !fx || !hero) return;
  const box = app.getBoundingClientRect(), dest = hero.getBoundingClientRect();
  const x0 = rect.left - box.left + rect.width / 2, y0 = rect.top - box.top + rect.height / 2;
  const x1 = dest.left - box.left + dest.width / 2;
  // The hero is often scrolled out of sight when a habit low on the list is
  // ticked. Aiming at its real position would send the chip up over the sticky
  // header, so the landing point is clamped to the top of the scroll viewport —
  // it still reads as "these went up to your level", without crossing the chrome.
  const sc = document.getElementById('scroll');
  const lid = sc ? sc.getBoundingClientRect().top - box.top + 12 : 0;
  const y1 = Math.max(lid, dest.top - box.top + dest.height / 2);
  const chip = document.createElement('div');
  chip.className = 'xpfly';
  chip.style.left = x0 + 'px';
  chip.style.top = y0 + 'px';
  chip.style.setProperty('--dx', Math.round(x1 - x0) + 'px');
  const inner = document.createElement('i');
  inner.textContent = '+' + amount + ' XP';
  inner.style.setProperty('--dy', Math.round(y1 - y0) + 'px');
  chip.appendChild(inner);
  fx.appendChild(chip);
  // The pulse runs through the animation API rather than a class, so the next
  // render cannot strip it mid-flight.
  inner.addEventListener('animationend', () => {
    chip.remove();
    const target = document.querySelector('[data-hero]');
    if (target && target.animate) {
      target.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.13)' }, { transform: 'scale(1)' }],
        { duration: 420, easing: 'cubic-bezier(.2,.8,.25,1)' }
      );
    }
  }, { once: true });
}

// ── Onboarding — one screen: the suggested habit set, all editable ─────────
function renderOnboarding() {
  const nOn = live().length;
  return `
    <div data-k="onboarding" style="height:100%;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom))">
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:2px solid var(--divider)">
        <div class="hd" style="font-size:16px;line-height:1;letter-spacing:.02em">AA Proof</div>
        <div class="eyebrow">${nOn} tracked</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;padding-top:26px;overflow:hidden;animation:riseIn .3s ease">
        <!-- The one screen where using their name actually lands: it is the
             first thing they ever see, and it is a coach talking to a person. -->
        <div class="hd" style="font-size:38px;line-height:.98;letter-spacing:-.03em">${(ATHLETE.firstName || '').trim()
          ? esc(ATHLETE.firstName.trim()) + ',<br>here is what<br>I\'d track'
          : 'Here\'s what<br>I\'d track'}</div>
        <p style="margin:14px 0 16px;font-size:14px;color:var(--muted)">
          These are my suggestions. Switch off anything you'd only lie about later — you can change all of it whenever you like.
        </p>
        <div style="flex:1;overflow-y:auto;border-top:2px solid var(--divider)">
          ${allHabits().map(h => `<button style="width:100%;text-align:left;padding:13px 2px;display:flex;justify-content:space-between;align-items:center;gap:12px" class="row-rule"
            ${on(() => { CFG.on[h.id] = CFG.on[h.id] === false; saveCfg(); render(); })}>
            <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
              <span class="hd" style="font-size:16px;line-height:1">${esc(h.name)}</span>
              <span style="font-size:11px;line-height:1.2;color:var(--muted)">${esc(h.goal || h.source)} · ${baseXp(h)} XP</span>
              <!-- This screen used to sell WORKOUT as a normal habit worth more
                   points than any other, switch already on, and say nothing
                   about the padlock waiting on the next screen. For a free
                   athlete it is the one habit they can never tick, and leaving
                   it on quietly caps every day below 100% — which is worth
                   knowing BEFORE it happens rather than being discovered as a
                   day that would not complete. -->
              <!-- States the lock; does NOT coach a free athlete around it.
                   proof.html promises this in public and in Amir's own voice —
                   "without one it stays locked, so a perfect day is something
                   only my coached athletes can reach" — so an onboarding line
                   suggesting they switch it off to reach 100% would quietly
                   undo the one honest thing the funnel says. -->
              ${h.locked ? `<span style="font-size:11px;line-height:1.35;color:var(--clay-deep)">${isFree()
                ? 'Locked — this is the one that comes with a programme. It stays on your list, and it stays a padlock.'
                : 'Locked — you cannot tick this one. Finishing a session in your programme ticks it for you.'}</span>` : ''}
            </span>
            <span class="sw ${CFG.on[h.id] !== false ? 'on' : ''}"><i></i></span>
          </button>`).join('')}

      </div>
      <button class="btn btn-primary btn-block" style="margin-top:18px" ${on(() => {
        if (!live().length) { toast('Pick at least one habit.'); return; }
        CFG.onboarded = true; saveCfg(); seedSeenLevels(); UI.screen = 'today'; render();
        // Straight into the tour. This screen said WHAT to track and never a
        // word about HOW any of it works — the athlete was handed a scoring

        startTour('today');

}

// ══════════════════════════════════════════════════════════════════════════
//  THE TOUR — the game-style first run
// ══════════════════════════════════════════════════════════════════════════
// A clay box around the thing being named, a card beside it saying what it
// does, and the rest of the screen dimmed. It walks the athlete across all
// three tabs and into Settings, naming every control they would otherwise
// have to discover by poking.
//
// THREE RULES IT IS BUILT ON:
//
//  1. **It points at the real thing, live.** Every target is resolved out of
//     the actual DOM at the moment the step opens and measured with
//     getBoundingClientRect, so the ring cannot drift out of step with a
//     screen that has been retuned. Nothing here hard-codes a coordinate, and
//     a step whose target does not exist is dropped when the list is built
//     (`when`), not discovered missing halfway through.
//
//  2. **A step marked `act` can be finished by doing the thing.** The dimmer
//     is four panes with a real hole in the middle rather than one lid with a
//     transparent window, so the tap lands on the habit's own checkbox and
//     logs it for real. That is the whole difference between a tutorial and a
//     slideshow about a tutorial.
//
//  3. **It never traps anyone.** Skip is on every step, Back is on every step
//     after the first, and the whole thing is replayable from Settings for
//     ever. `CFG.toured` records that it has been offered, not that it must
//     never appear again.
//
// It defaults to false for EXISTING athletes too, so everyone who has been
// using the app since before this shipped gets the offer once — they are the
// group who never had any explanation at all.
const TOUR = { on:false, i:0, steps:[], back:'today' };

// Targets are resolved lazily, every paint. `$t` scopes to #app so a stray
// match in the tour's own layer can never be selected as its own target.
function $t(sel) { return document.querySelector('#app ' + sel); }

function tourSteps() {
  const counter = live().some(h => h.kind === 'count' && !h.locked);
  const S = [];

  S.push({
    title: 'This is the whole app',
    body: `About a minute. It names every button worth knowing and gets out of the way.
           You can stop whenever you like — it lives in Settings afterwards.`,
    screen: 'today', cta: 'Show me'
  });

  S.push({
    title: 'One row, three taps',
    body: `Every habit on this list answers to three different taps, and they do three
           different things. Here they are, one at a time.`,
    screen: 'today', sel: () => $t('.hrow:not(.locked)'), pad: 0
  });

  S.push({
    title: 'Tap the box to log it',
    body: `That is the daily job, and most days it is the only thing you will touch.
           On a habit you <strong>count</strong> — steps, sleep, water, meals — the box means
           <strong>all of it, done</strong>, so it fills the target in one go. Tap it again to clear the day.`,
    screen: 'today', sel: () => $t('.hrow:not(.locked) .checkcell'),
    // Live, so the athlete can finish the step by actually doing it. The hint
    // deliberately does not push: this app's whole argument is that the log is
    // evidence rather than a diary, and a tutorial that talks someone into
    // ticking a box they did not earn undermines it on the first screen.
    act: true, hint: 'Tap it for real if you have already done it — the tour moves on either way.'
  });

  S.push({
    title: 'Tap the name for its history',
    body: `Its rank, its longest run, the last 35 days and what it pays. It is the biggest
           part of the row and the only part that logs nothing — so tapping a habit to read
           about it never costs you a day.`,
    screen: 'today', sel: () => $t('.hrow:not(.locked) .body')
  });

  if (counter) S.push({
    title: 'Tap + to add one',
    body: `One glass, one meal, half an hour of sleep, 500 steps. <strong>Hold it down</strong>
           and it keeps going, so ten thousand steps is not twenty taps.`,
    // NOT live. A held + repeats ~9 times a second, and a tutorial is the one
    // moment nobody is watching the number they are putting into their own log.
    screen: 'today', sel: () => $t('.hrow:not(.locked) .pluscell')
  });

  S.push({
    title: 'Forgot yesterday?',
    body: `Today, and the ${BACKFILL_DAYS} days behind it. Tap one and everything you tick lands on
           <strong>that</strong> day instead — the screen turns clay so you cannot forget you are back there.
           Older than that and the log is shut: a record you can rewrite whenever you like is a diary, not proof.`,
    screen: 'today', sel: () => $t('.daystrip')
  });

  S.push({
    title: 'Everything pays XP',
    body: `XP builds levels, levels carry ranks — ${esc(RANKS[0])} up to ${esc(RANKS[RANKS.length - 1])},
           ${SUBS_PER_RANK} levels each. The bar is how far you are through this one.
           <strong>Tap the rank</strong> to see the whole ladder and what each one costs.`,
    screen: 'today', sel: () => $t('.hero-lv')
  });

  S.push({
    title: 'One nudge a day',
    body: `It reads what you have actually skipped and says so. Its button opens whatever it
           is complaining about. It changes tomorrow, so there is no point arguing with it.`,
    screen: 'today', sel: () => $t('.coachcard')
  });

  S.push({
    title: 'Three tabs',
    body: `<strong>Today</strong> is where you log. <strong>Progress</strong> is where you stand.
           <strong>Crew</strong> is everyone else. That is the whole of it — there is no fourth screen hiding.`,
    screen: 'today', sel: () => $t('.tabs'), pad: 0
  });

  S.push({

    body: `Days logged leads on purpose — it is the one that earns the other three.

           ${ACHIEVEMENTS.length} one-off milestones. All of it starts at zero and none of it stays there.`,
    screen: 'progress', sel: () => $t('.statgrid')
  });

  S.push({
    title: CFG.onBoard ? 'The board, and the wall' : 'The board is off until you join',
    body: CFG.onBoard
      ? `You are on it. Everyone else here is racing the same season, and each of you gets
         <strong>one sentence a day</strong> on the wall — worth no points at all, which is exactly why
         people write something true on it.`
      : `Nobody can see you until you join, and joining takes a name you pick yourself — other
         athletes see <strong>that name and your points</strong>, nothing else. Join and you also get
         <strong>one sentence a day</strong> on the wall. Leave whenever you like.`,
    screen: 'crew', before: () => { LB.view = 'board'; },
    sel: () => $t('[data-tour="join"]')
  });

  S.push({
    title: 'Your initials are the door',
    body: `Top right, on every screen. Settings, your habit list, dark mode and the manual are
           all behind it — and the same button closes them again. It is the only way in and the

    screen: 'crew', sel: () => document.querySelector('.hdme'), act: true, cta: 'Open it'
  });

  S.push({
    title: 'Switch off what you will not do',
    body: `A habit you ignore only drags your day down. Switch it off here — it keeps every
           point it has already banked and can come back whenever. Add your own at the bottom

    screen: 'settings', sel: () => $t('[data-tour="tracked"]')
  });

  S.push({

    body: `Points, levels, ranks, consistency, seasons, quests, the board and what happens to
           your data — properly explained, in order. When something on a screen does not make

  });

  S.push({

           Settings, under <strong>How this works</strong>.`,
    screen: 'settings', cta: 'Start logging', last: true
  });

  return S;
}

function startTour(back) {
  if (!CFG) return;
  TOUR.steps = tourSteps();
  TOUR.i = 0;
  TOUR.on = true;
  TOUR.back = back || 'today';
  _tourOpened = false;                         // the dimmer fades in once per run
  clearTimeout(_idleTimer);                    // nothing should breathe under the scrim
  const app = document.getElementById('app');
  if (app) app.addEventListener('click', tourTap, true);
  // Capture, so a scroll inside .scroll repositions the ring too — scroll does
  // not bubble, and the ring is drawn in viewport coordinates.
  window.addEventListener('scroll', tourReflow, true);
  window.addEventListener('resize', tourReflow);
  window.addEventListener('orientationchange', tourReflow);
  tourShow();
}

// Scroll fires per frame and can keep firing after the finger has gone, on
// momentum. Coalesce to one reposition per frame, and reposition ONLY — never
// rebuild. See the note on paintTour.
let _tourRaf = 0;
function tourReflow() {
  if (!TOUR.on || _tourRaf) return;
  _tourRaf = requestAnimationFrame(() => { _tourRaf = 0; if (TOUR.on) placeTour(); });
}

function endTour(finished) {
  if (!TOUR.on) return;
  TOUR.on = false;
  CFG.toured = true; saveCfg();
  const app = document.getElementById('app');
  if (app) app.removeEventListener('click', tourTap, true);
  window.removeEventListener('scroll', tourReflow, true);
  window.removeEventListener('resize', tourReflow);
  window.removeEventListener('orientationchange', tourReflow);
  cancelAnimationFrame(_tourRaf); _tourRaf = 0;
  paintTour();                                  // tears the layer down
  if (UI.screen !== TOUR.back) go(TOUR.back); else render();
  if (finished) toast('That is the tour. It is in Settings if you want it again.');
  armIdle();
}

function tourGo(d) {
  if (!TOUR.on) return;
  const n = TOUR.i + d;
  if (n < 0) return;
  if (n >= TOUR.steps.length) { endTour(true); return; }
  TOUR.i = n;
  haptic('tab');
  tourShow();
}

function tourShow() {
  const st = TOUR.steps[TOUR.i];
  if (!st) { endTour(true); return; }
  if (st.before) st.before();
  // go() owns nav direction, the scroll reset and the crew fetches; a step that
  // stays put only needs a repaint.
  if (st.screen && UI.screen !== st.screen) go(st.screen); else render();
  // One frame for the new screen to lay out, then bring the target into view,
  // then measure. Measuring before the scroll settles rings the wrong place.
  requestAnimationFrame(() => {
    const el = st.sel ? st.sel() : null;
    // Aligned to the TOP of the scroller rather than centred when either the
    // target is tall (its ring gets trimmed to the top, so centring would
    // scroll away the only highlighted part) or the phone is short (on a 568px
    // screen a centred target sits exactly where neither above nor below has
    // room for the card). Roomy phones keep the nicer centred framing.
    if (el && el.scrollIntoView) el.scrollIntoView({
      block: (el.getBoundingClientRect().height > window.innerHeight * 0.45 ||
              window.innerHeight < 700) ? 'start' : 'center',
      behavior: reduced() ? 'auto' : 'smooth'
    });
    setTimeout(paintTour, (el && !reduced()) ? 320 : 30);
  });
}

// A step marked `act` leaves its target tappable. When the athlete uses it for
// real, wait for the tick, the toast and the XP flight to finish, then move on.
function tourTap(ev) {
  if (!TOUR.on) return;
  const st = TOUR.steps[TOUR.i];
  if (!st || !st.act || !st.sel) return;
  const el = st.sel();
  if (!el || !(el === ev.target || el.contains(ev.target))) return;
  setTimeout(() => { if (TOUR.on) tourGo(1); }, 700);
}

// PAINTING IS SPLIT IN TWO, AND THAT SPLIT IS THE WHOLE POINT.
//
//   paintTour()  — decides whether the layer should exist and, when the STEP
//                  changes, builds its DOM once.
//   placeTour()  — writes geometry onto those existing nodes. Never builds.
//
// It used to be one function that rebuilt the layer's innerHTML on every call,
// and the scroll listener called it. `scrollIntoView({behavior:'smooth'})`
// fires scroll ~20-25 times per step transition, and a phone keeps firing on
// momentum after the finger has gone — so every step change tore down and
// recreated the card and all four mask panes about 25 times. Measured: 2
// intentional paints, 25 card rebuilds. Each rebuild restarted the card's
// `riseIn` entrance animation and the panes' `fadeIn`, so the card visibly
// re-entered and the dimmer re-faded, over and over. That is the "jumping and
// ticking". Repositioning must never touch the DOM.
let _tourKey = null, _tourCh = 0, _tourVW = 0, _tourOpened = false;

function tourTeardown(lay) {
  lay.className = 'tourlay';
  lay.innerHTML = '';
  _tourKey = null;
}

function paintTour() {
  const lay = document.getElementById('tour');
  if (!lay) return;
  const st = TOUR.on ? TOUR.steps[TOUR.i] : null;
  // Stand down for a celebration or the log sheet. Both own the screen, both
  // are the athlete's own doing, and both repaint this the moment they close.
  if (!st || UI.celebrate.length || UI.sheet) { tourTeardown(lay); return; }
  const key = TOUR.i + ':' + st.title;
  if (key !== _tourKey) { buildTour(lay, st); _tourKey = key; }
  placeTour();
}

function buildTour(lay, st) {
  const n = TOUR.i + 1, total = TOUR.steps.length;
  // `opening` only on the very first build of a run, so the dimmer fades in
  // once and then simply stays dark as the athlete steps through.
  lay.className = 'tourlay on' + (_tourOpened ? '' : ' opening');
  _tourOpened = true;
  // Every pane exists for the life of the step, whatever its size — placeTour
  // hides the ones that come out empty rather than adding and removing nodes.
  lay.innerHTML =
    `<div class="tourmask" data-m="t"></div>
     <div class="tourmask" data-m="b"></div>
     <div class="tourmask" data-m="l"></div>
     <div class="tourmask" data-m="r"></div>
     ${st.act ? '' : '<div class="tourblock" data-m="k"></div>'}
     <div class="tourring" data-m="ring"></div>
     <div class="tourcard" data-m="card" style="top:-9999px">
       <span class="tourtip" style="display:none"></span>
       <div class="tourtop">
         <h4>${esc(st.title)}</h4>
         <span class="tourn">${n}/${total}</span>
       </div>
       <div class="tourbody">
         <p>${st.body}</p>
         ${st.hint ? `<p style="color:var(--clay-deep)">${esc(st.hint)}</p>` : ''}
       </div>
       <div class="tournav">
         ${TOUR.i > 0 ? '<button class="btn tourback" data-t="back" aria-label="Back">&#8592;</button>' : ''}
         <button class="btn btn-primary" data-t="next">${esc(st.cta || (st.last ? 'Done' : 'Next'))}</button>
       </div>
       ${st.last ? '' : '<button class="tourskip" data-t="skip">Skip the tour</button>'}
     </div>`;
  // Bound once per step, not once per reposition. This layer lives outside
  // #app, so the delegated handler that serves the rest of the app never sees it.
  lay.querySelectorAll('[data-t]').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      const k = b.getAttribute('data-t');
      if (k === 'next') tourGo(1);
      else if (k === 'back') tourGo(-1);
      else endTour(false);
    });
  });
  // Swallow taps on the dimmed area — wandering off mid-tour is how a tutorial
  // ends up half-read with no way back into it.
  lay.querySelectorAll('.tourmask, .tourblock').forEach(m => {
    m.addEventListener('click', ev => ev.stopPropagation());
  });
  _tourCh = 0;                                  // force a re-measure in placeTour
}

function placeTour() {
  const lay = document.getElementById('tour');
  const st = TOUR.on ? TOUR.steps[TOUR.i] : null;
  if (!lay || !st || _tourKey === null) return;
  const cEl = lay.querySelector('[data-m="card"]');
  if (!cEl) return;

  const vw = window.innerWidth, vh = window.innerHeight;
  const cw = Math.min(vw - 28, 460), cx0 = Math.round((vw - cw) / 2), gap = 14;
  // Width drives height, so the measurement only has to be redone when the
  // viewport width changes (rotation) or the step does. Not on every scroll —
  // offsetHeight forces synchronous layout, which is the expensive part.
  if (_tourCh === 0 || _tourVW !== vw) {
    cEl.style.width = cw + 'px';
    cEl.style.left = cx0 + 'px';
    _tourCh = cEl.offsetHeight;
    _tourVW = vw;
  }
  const ch = _tourCh;

  const pad = st.pad == null ? 5 : st.pad;
  let r = null;
  const el = st.sel ? st.sel() : null;
  if (el) {
    const b = el.getBoundingClientRect();
    // A target scrolled fully out of the viewport rings nothing — better a
    // plain centred card than a clay box hard against the top edge.
    if (b.width > 0 && b.height > 0 && b.bottom > 0 && b.top < vh) {
      const t = Math.max(0, b.top - pad), l = Math.max(0, b.left - pad);
      r = { t, l, w: Math.min(vw - l, b.width + pad * 2), h: Math.min(vh - t, b.height + pad * 2) };
    }
  }

  // PLACEMENT. The card must never cover the thing it is describing, and the
  // ring must never be squeezed to nothing — so the two are solved together
  // rather than the ring being drawn first and the card fitted around it.
  //
  //   A — card BELOW the ring. Room for the ring is whatever is left above the
  //       card: hA = bottom edge − gap − card − ring top. A tall target (the
  //       tracked-habit list is ~590px) gets trimmed to hA and keeps its top,
  //       which is the part that identifies it.
  //   B — card ABOVE the ring. Needs only that the ring starts low enough; the
  //       ring is then clipped to the bottom of the viewport.
  //
  // A is preferred because reading downward from a highlight is the natural
  // order. Sizing the ring by a fixed fraction and then choosing a side left
  // the card on top of its own ring on every step of a 320px screen, where the
  // card is more than half the viewport.
  const EDGE = 12, MINRING = 36;
  let top, tip = null;
  if (!r) {
    top = Math.round((vh - ch) / 2);
  } else {
    const hA = vh - EDGE - gap - ch - r.t;                 // ring height A allows
    if (hA >= MINRING) {
      r.h = Math.min(r.h, hA);
      top = r.t + r.h + gap; tip = 'up';
    } else if (r.t - gap - ch >= EDGE) {
      r.h = Math.min(r.h, vh - r.t - EDGE);
      top = r.t - gap - ch; tip = 'down';
    } else {
      // Neither side fits at the target's natural size — a tall block low on a
      // short screen, e.g. the join box at the foot of CREW on a 320×568 phone,
      // which cannot be scrolled any higher because it is the last thing there.
      // Pin the card to an edge and trim the ring from the FAR side, taking
      // whichever of the two leaves more of the target showing. Trimming from
      // the top is the one that saves this case: the bottom of the join box is
      // the name field and the Join button, which is the half worth ringing.
      const cardAtBottom = vh - ch - EDGE, hCardBottom = cardAtBottom - gap - r.t;
      const ringBelowCard = EDGE + ch + gap, hCardTop = (r.t + r.h) - ringBelowCard;
      if (hCardTop > hCardBottom) {
        top = EDGE;
        r.h = Math.max(MINRING, Math.min(hCardTop, vh - ringBelowCard - EDGE));
        r.t = ringBelowCard;
      } else {
        top = cardAtBottom;
        r.h = Math.max(MINRING, hCardBottom);
      }
    }
  }
  cEl.style.top = top + 'px';

  const tEl = cEl.querySelector('.tourtip');
  if (tip && r) {
    tEl.className = 'tourtip ' + tip;
    tEl.style.display = '';
    tEl.style.left = Math.max(14, Math.min(cw - 32, Math.round(r.l + r.w / 2 - cx0 - 9))) + 'px';
  } else {
    tEl.style.display = 'none';
  }

  // Style writes only, on nodes that already exist. A pane that comes out empty
  // is hidden rather than removed, so the node set is stable for the step.
  const put = (sel, x, y, w, h) => {
    const n = lay.querySelector('[data-m="' + sel + '"]');
    if (!n) return;
    if (!(w > 0 && h > 0)) { n.style.display = 'none'; return; }
    n.style.display = '';
    n.style.left = x + 'px'; n.style.top = y + 'px';
    n.style.width = w + 'px'; n.style.height = h + 'px';
  };
  if (r) {
    const rb = r.t + r.h, rr = r.l + r.w;
    put('t', 0, 0, vw, r.t);
    put('b', 0, rb, vw, vh - rb);
    put('l', 0, r.t, r.l, r.h);
    put('r', rr, r.t, vw - rr, r.h);
    put('k', r.l, r.t, r.w, r.h);          // absent on an `act` step
    put('ring', r.l, r.t, r.w, r.h);
  } else {
    put('t', 0, 0, vw, vh);
    put('b', 0, 0, 0, 0); put('l', 0, 0, 0, 0); put('r', 0, 0, 0, 0);
    put('k', 0, 0, 0, 0); put('ring', 0, 0, 0, 0);
  }
}

// ── App shell ─────────────────────────────────────────────────────────────
function renderApp() {
  const LI = overallLevel();

  const openH = habitById(UI.open || (hs[0] || HABITS[0]).id);
  const earnedMilestones = ACHIEVEMENTS.filter(a => measureAch(a) >= a.need).length;

    // Not the level — the strip immediately below the header already says it.
    progress: [seasonName() + ' · day ' + dayNumber(), 'Progress'],

    detail:   [openH.goal || openH.source, openH.name],

    crew: (() => {

        return n ? n + ' IN TODAY' : '';

    })(),
    ranks: '',                              // the hero says the level already

  else if (UI.screen === 'crew') screenHtml = renderCrew();
  else if (UI.screen === 'manual') screenHtml = renderManual();

  // and CREW holds the whole social layer, which was previously a chip inside
  // a tab named after only half of what it contained.

  // Settings, the manual and the ladder are not tabs. They sit "above" the tab

    ${window.IS_DEMO ? '<div class="demo-banner" data-k="banner">Demo mode — nothing is saved to the cloud</div>' : ''}

        <div class="eyebrow">${esc(head[0])}</div>
        <div class="title hd">${esc(head[1])}</div>
      </div>
      <div class="hdright">
        <span class="right mono">${esc(rights[UI.screen] || '')}</span>
        <!-- One control, two states, always in the same place: your initials
             open Settings from anywhere, and become the way out of Settings,
             the manual and the ladder — none of which is a tab any more, so
             none of them has a tab to press to leave. -->
        <button class="hdme ${OVERLAY ? 'closing' : ''}" data-k="hdme"
          aria-label="${OVERLAY ? 'Close' : 'Settings'}"
          ${on(() => (OVERLAY ? go(UI.backTo || 'today') : (UI.backTo = UI.screen, go('settings'))))}>

    <div class="tabs" data-k="tabs">

      ${tabDefs.map(t => `<button class="${activeTab === t[1] ? 'on' : ''}" data-k="tab:${t[1]}" ${on(() => go(t[1]))}>
        <span class="num">${t[2]}</span><span class="nm">${t[0]}</span>
      </button>`).join('')}
    </div>
    <div id="fx" data-k="fx" data-static></div>
    ${UI.sheet ? renderSheet() : ''}
    ${UI.install ? renderInstall() : ''}

    ${UI.celebrate.length ? renderCelebration(UI.celebrate[0]) : ''}`;

function greeting() {

// ── Level-up takeover ─────────────────────────────────────────────────────
const SHARDS = [[0,-118],[84,-84],[118,0],[84,84],[0,118],[-84,84],[-118,0],[-84,-84],[52,-132],[-52,132],[132,52],[-132,-52]];

function renderCelebration(ev) {

// "steps, sleep and water" — and past four, it stops listing and starts counting,

function nameList(hs) {

// Tiers, milestones and perfect days borrow the same machinery but land on the
// green ground, so the KIND of win is readable before a word of it is.
function renderBadgeCelebration(ev) {
  let badge, badgeLabel, kicker, title, sub, codeClass = '';
  if (ev.kind === 'tier') {
    // The LEDGER, not the tier table. A run that began before the season opened
    // still earns the badge but banks nothing (XP_SYSTEM.md §4.5), and reading
    // the figure off CONSISTENCY_TIERS promised XP that never arrived.
    const paid = ev.habits.reduce((s, h) => s + tierPaid(h, ev.tierIndex), 0);
    badge = String(ev.tier.days); badgeLabel = 'DAYS';
    kicker = 'Consistency';

        + (paid > 0
            ? '+' + paid.toLocaleString() + ' XP, and the badge is yours for good.'
            : 'The badge is yours for good. The run started before ' + seasonName()
              + ', so it pays nothing this season.');
  } else if (ev.kind === 'quest') {
    badge = 'Q'; badgeLabel = 'QUEST'; codeClass = ' code';
    kicker = 'Quest complete';
    title = ev.quest.title;
    sub = ev.quest.note + '. +' + ev.quest.xp.toLocaleString() + ' XP.';
  } else if (ev.kind === 'milestone') {
    // Same rule as tiers: measureAch() counts all of history, bonusEvents() only
    // pays what was crossed inside the season, so ask the ledger what landed.
    const paid = milestonePaid(ev.ach.code);
    badge = ev.ach.code; badgeLabel = 'MILESTONE'; codeClass = ' code';
    kicker = 'Unlocked';
    title = ev.ach.name;
    sub = ev.ach.note + '. ' + (paid > 0
        ? '+' + paid.toLocaleString() + ' XP.'
        : 'Yours on your all-time record. The ' + ev.ach.xp.toLocaleString()
          + ' XP lands when you do it again inside ' + seasonName() + '.');
  } else if (ev.kind === 'reward') {
    // The one unlock that pays nothing and is worth having anyway. Say what it
    // IS and where it shows, because a reward nobody can see is just a number.
    badge = ev.reward.kind === 'title' ? 'T' : 'C';
    badgeLabel = ev.reward.kind === 'title' ? 'TITLE' : 'CARD';
    codeClass = ' code';
    kicker = 'Unlocked';
    title = ev.reward.name;
    sub = ev.reward.note + ' ' + (ev.reward.kind === 'title'
      ? 'It sits under your name, and it is yours for good — a new season cannot take it back.'

    const n = live().length;
    badge = String(n); badgeLabel = n === 1 ? 'HABIT' : 'HABITS';
    kicker = 'Clean sweep';
    title = 'Perfect day';
    sub = 'Every habit you track, done. ' + dayXp(ev.id).toLocaleString() + ' XP today.';
  }
  return `
    <div class="lvwrap badge" data-k="cel:${esc(ev.kind)}:${esc(String(ev.id))}" ${on(dismissCelebration)}>
      <div class="lvstage">
        <div class="lvrays"></div>
        <div class="lvshock"></div>
        <div class="lvshards">${shardHtml()}</div>
        <div class="lvbadge"><span class="n${codeClass}">${esc(badge)}</span><span class="l">${esc(badgeLabel)}</span></div>
      </div>
      <div class="lvkicker">${esc(kicker)}</div>
      <div class="lvrank">${esc(title)}</div>
      <div class="lvsub">${esc(sub)}</div>
      <button class="lvgo">${UI.celebrate.length > 1 ? 'Next' : 'Continue'}</button>
      ${UI.celebrate.length > 1 ? `<div class="lvqueue">${UI.celebrate.length - 1} more to go</div>` : ''}
    </div>`;
}

// ── The streak band, shared by Today and Progress ─────────────────────────
// The day streak is this app's headline consistency number — the whole point of
// the qualify rule — and TODAY showed it in exactly one circumstance: a red bar
// saying it was about to be lost. The only moment it appeared was the moment it
// was bad news. On PROGRESS it was one of four equal tiles, a bare figure with
// no sense of whether it was climbing or had just been broken.
//
// Both screens now open the same band: the number, how it compares to the best
// ever, and the seven days behind it so the shape of the week is visible at a
// glance rather than inferred from a single integer.
//
// Hidden entirely until there is a first logged day. A zero over an empty trail
// is the loudest possible way to open an app on day one, and these screens
// already go to some trouble not to do that — see the `pre` day chips and the
// statgrid's day-one note.
function bestHabitRun() {
  // allHabits(), not live(): a run you earned does not stop having happened
  // because you paused the habit, which is the same rule that keeps a
  // consistency tier once it is crossed.
  return allHabits().reduce((m, h) => Math.max(m, habitBest(h)), 0);
}
function streakFlame(now, best) {
  if (!firstLoggedDay()) return '';           // day one is not a report of zero
  return `<div class="dayflame ${now > 0 ? 'lit' : ''}" data-lvl="${emberLevel(now)}" data-k="dayflame"
        title="${now > 0 ? now + '-day streak' + (best > now ? ' · best ' + best : '') : 'No streak yet'}">
    ${FLAME}
    <span class="n" data-static data-num="dstreak" data-to="${now}">${now}</span>
    <span class="u">DAY<br>STREAK</span>
  </div>`;

// ── Habit row, shared by Today and Habits ─────────────────────────────────
// The best current run across the tracked habits. Used to decide which single
