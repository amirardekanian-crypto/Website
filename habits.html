<!-- Dynamic manifest: bakes the CURRENT client link (incl. &key=) into start_url
     so an installed app keeps its identity and cloud writes keep working. -->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var client = params.get('client');
    var clientKey = params.get('key');
    window.IS_DEMO = (client === 'demo');
    var startUrl = client
      ? 'habits.html?client=' + encodeURIComponent(client) +
        (clientKey ? '&key=' + encodeURIComponent(clientKey) : '')
      : 'habits.html';
    var manifest = {
      name: "Proof", short_name: "Proof",
      description: "Daily health habits, tracked and coached.",
      start_url: startUrl, scope: "/", display: "standalone", orientation: "portrait",
      background_color: "#FAF7F2", theme_color: "#FAF7F2", lang: "en-GB",
      categories: ["fitness", "health", "sports"],
      icons: [
        { src: "/assets/img/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: "/assets/img/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    var link = document.createElement('link');
    link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── Tokens ────────────────────────────────────────────────────────────
     PROOF's modernist structure on the AA Performance palette (the "green
     machine" mapping from the handoff's Color Options sheet): green is the
     accent, clay carries the coach's voice and mono meta. Zero radius
     anywhere, 2px section rules, 1px row rules, everything flush left. */
  :root {
    --bg: #FAF7F2;
    --surface: #EDE8E0;
    --ink: #1A1A1A;
    --accent: #0E4A36;
    --accent-600: #0B3B2B;
    --accent-700: #08301F;
    --accent-100: rgba(14,74,54,0.08);
    --clay: #C7552F;
    --clay-deep: #8E3A1E;
    --scrim: rgba(26,26,26,0.45);
    --divider: rgba(26,26,26,0.40);
    --rule: rgba(26,26,26,0.20);
    --muted: rgba(26,26,26,0.58);
    --muted-soft: rgba(26,26,26,0.50);
    --track: rgba(26,26,26,0.12);
    --box: rgba(26,26,26,0.45);
  }
  body[data-dark] {
    --bg: #0F1A15;
    --surface: #172219;
    --ink: #F0EDE6;
    --accent: #3E9C74;
    --accent-600: #4FAF85;
    --accent-700: #7FD0AC;
    --accent-100: rgba(62,156,116,0.14);
    --clay: #E06B43;
    --clay-deep: #F09068;
    --scrim: rgba(0,0,0,0.55);
    --divider: rgba(240,237,230,0.34);
    --rule: rgba(240,237,230,0.18);
    --muted: rgba(240,237,230,0.60);
    --muted-soft: rgba(240,237,230,0.50);
    --track: rgba(240,237,230,0.14);
    --box: rgba(240,237,230,0.45);
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; line-height: 1.55;
    overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: transparent; border: 0; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hd { font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 900; text-transform: uppercase; }
  .mono { font-family: 'Space Mono', ui-monospace, Menlo, monospace; }
  .eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
  }

  @keyframes pop { 0% { transform: scale(.6) } 60% { transform: scale(1.12) } 100% { transform: scale(1) } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ── Shell ── */
  .app {
    height: 100%; max-width: 520px; margin: 0 auto;
    display: none; flex-direction: column; position: relative; overflow: hidden;
    background: var(--bg);
  }
  .app.on { display: flex; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { width: 0; }

  .loading, .errscreen {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center; transition: opacity .4s ease;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 38px; height: 38px; border: 3px solid var(--track); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .errscreen { display: none; z-index: 9998; }
  .errscreen.on { display: flex; }
  .errscreen h2 { font-size: 30px; line-height: 1; letter-spacing: -.02em; margin-bottom: 12px; }
  .errscreen p { font-size: 14px; color: var(--muted); white-space: pre-line; }

  /* ── Header ── */
  .apphd {
    padding: calc(20px + env(safe-area-inset-top)) 20px 12px;
    border-bottom: 2px solid var(--divider);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    background: var(--bg);
  }
  .apphd .title { font-size: 24px; line-height: 1; letter-spacing: -.02em; margin-top: 4px; }
  .apphd .right { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--clay-deep); white-space: nowrap; }

  /* ── Blocks & rules ── */
  .block { padding: 20px; border-bottom: 2px solid var(--divider); }
  .row-rule { border-bottom: 1px solid var(--rule); }

  .bar { height: 10px; background: var(--track); }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .35s cubic-bezier(.2,.8,.2,1); }
  .bar.thin { height: 8px; }

  .figure { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; color: var(--accent); letter-spacing: -.04em; }

  /* ── Habit rows ── */
  .hrow { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); }
  .hrow.done { background: var(--accent-100); }
  .hrow .checkcell {
    flex: none; width: 64px; border-right: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center;
  }
  .boxmark { width: 28px; height: 28px; border: 2px solid var(--box); display: block; }
  .boxmark.on {
    border-color: var(--accent); background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px;
    animation: pop .28s ease;
  }
  .hrow .body {
    flex: 1; min-width: 0; text-align: left; padding: 13px 12px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .hrow .body .line1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hrow .body .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
  .hrow .body .stk { font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--muted-soft); }
  .hrow .body .status { font-size: 11px; line-height: 1; color: var(--muted); }
  .hrow .body .track { display: block; width: 100%; height: 4px; background: var(--track); margin-top: 2px; }
  .hrow .body .track > span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
  .hrow .pluscell {
    flex: none; width: 54px; border-left: 1px solid var(--rule);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; color: var(--accent);
  }
  .hrow .pluscell:hover { background: var(--accent-100); }

  /* ── Coach card ── */
  .coachcard {
    background: var(--clay); color: #FAF7F2; padding: 20px;
    border-bottom: 2px solid var(--divider);
    display: flex; flex-direction: column; gap: 12px; animation: riseIn .3s ease;
  }
  .coachcard .eyebrow { color: rgba(250,247,242,.8); }
  .coachcard .say { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 24px; line-height: 1.05; letter-spacing: -.01em; text-transform: uppercase; text-wrap: pretty; }
  .coachcard .cta {
    align-self: flex-start; background: #FAF7F2; color: #1A1A1A; padding: 10px 14px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: flex-start; gap: 6px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px;
    letter-spacing: .04em; text-transform: uppercase; line-height: 1.2;
    padding: 14px 16px; border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: var(--accent-600); }
  .btn-primary:active { background: var(--accent-700); }
  .btn-secondary { border-color: var(--divider); }
  .btn-secondary:hover { background: rgba(128,128,128,.10); }
  .btn-block { width: 100%; }

  .input {
    width: 100%; min-height: 42px; padding: 8px 10px; font-size: 14px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); caret-color: var(--accent);
  }
  .input:focus-visible { border-color: var(--accent); outline-offset: 0; }

  /* ── Toggle (square, 44×24) ── */
  .sw { width: 44px; height: 24px; flex: none; border: 2px solid var(--ink); display: flex; align-items: center; padding: 2px; }
  .sw > i { width: 16px; height: 16px; display: block; background: var(--ink); }
  .sw.on { background: var(--accent); justify-content: flex-end; border-color: var(--accent); }
  .sw.on > i { background: var(--bg); }

  /* ── Select rows (goals, coach volume, motivation) ── */
  .selrow {
    width: 100%; text-align: left; padding: 15px 14px;
    border-bottom: 2px solid var(--divider);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .selrow.on { background: var(--accent); color: var(--bg); }
  .selrow .lbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; line-height: 1.15; text-transform: uppercase; }
  .selrow .desc { font-size: 12px; line-height: 1.35; opacity: .75; margin-top: 5px; }
  .selrow .mark { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em; }

  /* ── Tab bar ── */
  .tabs {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 2px solid var(--divider); background: var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs button {
    padding: 12px 10px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start;
    border-right: 1px solid var(--rule); position: relative;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button.on { background: var(--ink); color: var(--bg); }
  .tabs .num { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: .06em; opacity: .6; }
  .tabs .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 12px; letter-spacing: .02em; text-transform: uppercase; }

  /* ── Grid (35-day history) ── */
  .grid35 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .grid35 .c { aspect-ratio: 1; border: 1px solid rgba(128,128,128,.35); }
  .grid35 .c.hit { background: var(--accent); border-color: var(--accent); }
  .grid35 .c.part { background: var(--accent-100); border-color: var(--accent); }
  .grid35 .c.future { opacity: .25; }

  /* ── Sheet & toast ── */
  .scrim { position: absolute; inset: 0; z-index: 80; background: var(--scrim); animation: fadeIn .2s ease; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 90;
    background: var(--bg); border-top: 2px solid var(--ink);
    padding: 20px 20px calc(28px + env(safe-area-inset-bottom));
    animation: sheetUp .3s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; gap: 16px;
  }
  .stepper { display: flex; align-items: center; border: 2px solid var(--ink); }
  .stepper button { width: 58px; height: 64px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px; }
  .stepper .minus { border-right: 2px solid var(--ink); }
  .stepper .plus { border-left: 2px solid var(--ink); }
  .stepper .val { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .toast {
    position: absolute; left: 20px; right: 20px; bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 70;
    background: var(--ink); color: var(--bg); padding: 13px 15px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; line-height: 1.25;
    text-transform: uppercase; animation: riseIn .25s ease;
  }

  .demo-banner { background: var(--clay); color: #FAF7F2; padding: 8px 20px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; text-align: center; }

  /* ── Level-up takeover ──────────────────────────────────────────────────
     The game moment. Square badge and hard edges keep it inside the modernist
     system — the drama comes from the ray burst, the scale-punch and the
     shards, not from rounded corners or glows. */
  @keyframes lvScrim  { from { opacity: 0 } to { opacity: 1 } }
  @keyframes lvRays   { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  @keyframes lvRaysIn { from { opacity: 0; transform: scale(.3) } to { opacity: .55; transform: scale(1) } }
  @keyframes lvBadge  {
    0%   { transform: scale(0) rotate(-25deg); opacity: 0 }
    55%  { transform: scale(1.25) rotate(6deg); opacity: 1 }
    75%  { transform: scale(.94) rotate(-2deg) }
    100% { transform: scale(1) rotate(0deg); opacity: 1 }
  }
  @keyframes lvShock  { 0% { transform: scale(.2); opacity: .9 } 100% { transform: scale(2.6); opacity: 0 } }
  @keyframes lvUp     { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
  @keyframes lvShard  { 0% { transform: translate(0,0) scale(1); opacity: 1 } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0 } }
  @keyframes lvFill   { from { width: 0 } to { width: var(--w) } }

  /* Two opaque variants so the moment never fights the screen behind it:
     a routine level lands on near-black with clay rays; a rank promotion goes
     full clay. Both are dark grounds, so all type is paper in both. */
  .lvwrap {
    position: absolute; inset: 0; z-index: 200;
    background: #14120F;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 26px; text-align: center; overflow: hidden;
    color: #FAF7F2;
    animation: lvScrim .22s ease;
  }
  .lvwrap.rank { background: var(--clay); }
  .lvstage { position: relative; display: flex; align-items: center; justify-content: center; width: 200px; height: 200px; margin-bottom: 30px; }
  /* The burst is masked to a soft disc so it never collides with the type below. */
  .lvrays {
    position: absolute; width: 460px; height: 460px; opacity: .5;
    background: repeating-conic-gradient(var(--clay) 0deg 7deg, transparent 7deg 22deg);
    -webkit-mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.35) 42%, transparent 66%);
            mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.35) 42%, transparent 66%);
    animation: lvRaysIn .5s ease both, lvRays 16s linear .5s infinite;
  }
  .lvwrap.rank .lvrays { background: repeating-conic-gradient(#FAF7F2 0deg 6deg, transparent 6deg 20deg); opacity: .38; }
  .lvshock { position: absolute; width: 150px; height: 150px; border: 3px solid var(--clay); animation: lvShock .7s cubic-bezier(.2,.7,.3,1) .18s both; }
  .lvwrap.rank .lvshock { border-color: #FAF7F2; }
  .lvbadge {
    position: relative; width: 128px; height: 128px;
    background: #FAF7F2; color: var(--clay);
    border: 4px solid var(--clay);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    animation: lvBadge .72s cubic-bezier(.2,.8,.25,1) .1s both;
  }
  .lvwrap.rank .lvbadge { border-color: #FAF7F2; color: var(--clay); }
  .lvbadge .n { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 58px; line-height: .85; letter-spacing: -.04em; }
  .lvbadge .l { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .18em; color: rgba(26,26,26,.55); }
  .lvshards { position: absolute; inset: 0; pointer-events: none; }
  .lvshards i {
    position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; background: var(--clay);
    animation: lvShard .95s cubic-bezier(.15,.75,.3,1) .22s both;
  }
  .lvwrap.rank .lvshards i { background: #FAF7F2; }
  .lvkicker {
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .34em;
    text-transform: uppercase; color: var(--clay-2, #E06B43); animation: lvUp .4s ease .5s both;
  }
  .lvwrap.rank .lvkicker { color: rgba(250,247,242,.9); }
  .lvrank {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: 46px; line-height: .95; letter-spacing: -.02em; margin-top: 10px;
    color: #FAF7F2; animation: lvUp .45s ease .6s both;
  }
  .lvsub { font-size: 13px; color: rgba(250,247,242,.72); margin-top: 10px; animation: lvUp .45s ease .72s both; }
  .lvbar { width: 200px; height: 8px; background: rgba(250,247,242,.22); margin-top: 18px; animation: lvUp .45s ease .8s both; }
  .lvbar > span { display: block; height: 100%; background: #FAF7F2; animation: lvFill .8s cubic-bezier(.2,.8,.2,1) .95s both; }
  .lvgo {
    margin-top: 28px; background: #FAF7F2; color: #14120F; padding: 14px 26px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px;
    letter-spacing: .1em; text-transform: uppercase; animation: lvUp .45s ease .9s both;
  }
  .lvwrap.rank .lvgo { color: var(--clay); }
  .lvqueue { position: absolute; bottom: 22px; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .16em; color: rgba(250,247,242,.6); }

  /* Inline flash for routine habit level-ups (no takeover) */
  @keyframes lvPop { 0% { transform: scale(.4); opacity: 0 } 55% { transform: scale(1.22) } 100% { transform: scale(1); opacity: 1 } }
  .lvchip {
    background: var(--clay); color: #FAF7F2; padding: 3px 7px;
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .06em;
    animation: lvPop .45s cubic-bezier(.2,.8,.25,1) both;
  }
  .hlv { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--muted-soft); }

  /* Consistency pip ladder */
  .pips { display: flex; gap: 4px; }
  .pips i { width: 13px; height: 13px; border: 1.5px solid var(--box); display: block; }
  .pips i.on { background: var(--accent); border-color: var(--accent); }
</style>
</head>

<div class="loading" id="loading"><div class="spinner"></div><div class="eyebrow" style="margin-top:20px">Loading proof</div></div>
<div class="errscreen" id="error"><h2 class="hd">Can't load</h2><p id="error-msg"></p></div>

<div class="app" id="app"></div>

<script>
// ════════════════════════════════════════════════════════════════════════
//  PROOF — health habit tracker with XP, levels and ranks.
//  Identity is the same link as the program app: habits.html?client=<id>&key=<key>.
//  localStorage is the source of truth and the durable record; an outbox with
//  backoff mirrors it to Supabase via the existing save_progress/get_progress
//  RPCs, so nothing is ever lost while offline.
//  Levels are ALWAYS derived from the log and never stored — retune XP_RULES
//  (documented in XP_SYSTEM.md) and every level recomputes from history.
// ════════════════════════════════════════════════════════════════════════
const SB_URL = 'https://bvipfipbdcyqnbczjmaq.supabase.co';
const SB_KEY = 'sb_publishable_BuDVTTC1E0eg3wc7F1Pcig_1A_tqYCy';

// ── THE XP SYSTEM — every tunable lives here ─────────────────────────────
// Read XP_SYSTEM.md before changing these. Nothing about XP is persisted, so
// editing this object retroactively rescores every day the athlete has logged.
const XP_RULES = {
  base: 300,              // XP for level 1 → 2 (one full day of habits)
  growth: 0.55,           // cost(n) = base × n^growth — higher = steeper climb
  completionBonus: 1.2,   // multiplier once a habit's target is met
  customXp: 25,           // per-completion value of an athlete-added habit
  streakQualifyPct: 80,   // a day counts toward the day-streak at this % done
  // Per-completion value, ranked by health impact.
  weights: {
    strength: 100,
    steps:     60,
    sleep:     50,
    fuel:      40,
    water:     30,

  }
};

// ── Ranks ────────────────────────────────────────────────────────────────
// Ten names × five sub-levels = 50 levels a cycle. Past 50 the athlete
// prestiges: the ladder restarts carrying a star (★1 ROOKIE 1, ★2 ROOKIE 1 …),
// so there is no ceiling — the star is the real flex.
const RANKS = ['ROOKIE','CONTENDER','GRINDER','OPERATOR','ENFORCER','PREDATOR','MACHINE','RELENTLESS','UNTOUCHABLE','IMMORTAL'];
const SUBS_PER_RANK = 5;
const LEVELS_PER_CYCLE = RANKS.length * SUBS_PER_RANK;   // 50
const MAX_LEVEL_SCAN = 5000;                             // loop guard

// Consecutive-day ladders, one per habit, five tiers each — 5 days up to two months.
const CONSISTENCY_TIERS = [
  { days: 5,  name: 'KINDLED',     xp: 50 },
  { days: 10, name: 'STEADY',      xp: 100 },
  { days: 20, name: 'LOCKED IN',   xp: 200 },
  { days: 30, name: 'IRONCLAD',    xp: 350 },
  { days: 60, name: 'UNBREAKABLE', xp: 750 }
];

// One-off milestones, measured against real history — nothing is seeded.
const ACHIEVEMENTS = [
  { code:'RR', name:'ROAD RUNNER',     note:'30 days over your step target',            xp:200, need:30,  measure:'daysHit:steps' },
  { code:'IM', name:'IRON MONK',       note:'16-day supplement streak',                 xp:150, need:16,  measure:'streak:supps' },
  { code:'HM', name:'HEAVY METAL',     note:'12 straight days with a session',          xp:150, need:12,  measure:'streak:strength' },
  { code:'HS', name:'HUMAN SPRINKLER', note:'5 days running on full water',             xp:100, need:5,   measure:'streak:water' },
  { code:'DP', name:'DAWN PATROL',     note:'10 days with 3+ habits logged',            xp:75,  need:10,  measure:'daysWith3' },
  { code:'ZM', name:'ZEN MACHINE',     note:'10 breathing sessions in a row',           xp:100, need:10,  measure:'streak:breathe' },
  { code:'BA', name:'BLACKOUT ARTIST', note:'10 nights at 7.5h or more',                xp:150, need:10,  measure:'streak:sleep' },
  { code:'RB', name:'RUBBER BAND',     note:'14-day mobility streak',                   xp:150, need:14,  measure:'streak:mobility' },
  { code:'CN', name:'THE CENTURION',   note:'100 perfect days. Nobody has done this.',  xp:500, need:100, measure:'perfectDays' }
];

// ── Identity & storage ────────────────────────────────────────────────────
let ATHLETE_ID = '', ATHLETE_NAME = '', KEY = null, ATHLETE = {};
let CFG = null, LOG = {};
const K_CFG  = () => ATHLETE_ID + '_hab_cfg';
const K_LOG  = () => ATHLETE_ID + '_hab_log';
const K_META = () => ATHLETE_ID + '_hab_meta';

const UI = { screen:'today', open:null, from:'today', sheet:null, sheetVal:0, toast:null,
             celebrate: [], flash: {}, _newName:'' };
let _toastTimer = null, _flashTimer = null;

function defaultCfg() {
  const on = {}; HABITS.forEach(h => on[h.id] = true);
  return { v:3, on, custom:[], onboarded:false, dark:false, seen:null, rulesSig:null, updatedAt:0 };
}

// ── Dates ─────────────────────────────────────────────────────────────────
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const TKEY = () => fmtKey(today());
function parseKey(k) { return new Date(k + 'T00:00:00'); }

// ── Habit helpers ─────────────────────────────────────────────────────────
function allHabits() {
  return HABITS.concat((CFG.custom || []).map(c => Object.assign({
    kind:'check', target:1, unit:'session', source:'Custom', code:(c.name||'??').slice(0,2).toUpperCase()
  }, c)));
}
function habitById(id) { return allHabits().find(h => h.id === id) || HABITS[0]; }
function live() { return allHabits().filter(h => CFG.on[h.id] !== false); }
function offHabits() { return allHabits().filter(h => CFG.on[h.id] === false); }
function valOf(dayKey, id) { const d = LOG[dayKey]; return (d && typeof d[id] === 'number') ? d[id] : 0; }
function isDone(h, dayKey) { return valOf(dayKey || TKEY(), h.id) >= h.target; }
function fmtVal(h, v) { return h.dec ? Number(v).toFixed(h.dec) : Math.round(v).toLocaleString(); }

// ── Persistence ───────────────────────────────────────────────────────────
function loadLocal() {
  CFG = defaultCfg();
  try {
    const raw = JSON.parse(localStorage.getItem(K_CFG()) || '{}');
    CFG = Object.assign(CFG, raw);
    CFG.on = Object.assign(defaultCfg().on, raw.on || {});
  } catch (e) {}
  try { LOG = JSON.parse(localStorage.getItem(K_LOG()) || '{}') || {}; } catch (e) {}
  try {
    const m = JSON.parse(localStorage.getItem(K_META()) || '{}');
    SYNC.dirty = !!m.dirty; SYNC.lastOk = m.lastOk || null;
  } catch (e) {}
  migrateOld();
}
// Fold forward the two earlier shipped shapes: v1 stored 0/1 flags under a
// different habit set, and v2 carried coach/motivation settings this build no
// longer has. Runs once, then never again.
function migrateOld() {
  if (CFG.v === 3 && CFG.migrated3) return;
  const MAP = { train:'strength', mobility:'mobility', sleep:'sleep', unwind:'breathe',
                protein:'fuel', water:'water', steps:'steps', vitd:'supps', creatine:'supps', omega3:'supps' };
  let touched = false;
  Object.keys(LOG).forEach(day => {
    const src = LOG[day] || {}, out = {};
    Object.keys(src).forEach(k => {
      const v = src[k];
      if (HABITS.some(h => h.id === k) || (CFG.custom || []).some(c => c.id === k)) { out[k] = v; return; }
      const to = MAP[k];
      if (to && v === 1) { out[to] = habitById(to).target; touched = true; }
    });
    LOG[day] = out;
  });
  delete CFG.coach; delete CFG.motiv; delete CFG.goals;   // retired settings
  CFG.v = 3; CFG.migrated3 = true;
  if (touched) saveLog();
  saveCfg();
}
function saveCfg() {
  CFG.updatedAt = Date.now();
  try { localStorage.setItem(K_CFG(), JSON.stringify(CFG)); } catch (e) {}
  markDirty();
}
function saveLog() {
  try { localStorage.setItem(K_LOG(), JSON.stringify(LOG)); } catch (e) {}
  markDirty();
}
function saveMeta() {
  try { localStorage.setItem(K_META(), JSON.stringify({ dirty: SYNC.dirty, lastOk: SYNC.lastOk })); } catch (e) {}
}

// ── Durable sync ──────────────────────────────────────────────────────────
// Contract: the athlete's phone is the record. Every change is written to
// localStorage FIRST and flagged dirty; the flag itself is persisted, so an
// app killed while offline still knows there is unsent work next launch. We
// always push the complete current snapshot, so a newer push simply supersedes
// an older one and no intermediate state can be lost or applied out of order.
// Retries run with exponential backoff and fire again on reconnect, on
// foreground, and at boot — nothing is dropped silently.
const SYNC = { dirty:false, syncing:false, lastOk:null, lastErr:null, attempts:0 };
const RETRY_MS = [5000, 15000, 45000, 120000, 300000];
let _sbClient = null, _pushTimer = null, _retryTimer = null;

function _sb() {
  if (_sbClient) return _sbClient;
  if (!window.supabase || !window.supabase.createClient) return null;
  _sbClient = window.supabase.createClient(SB_URL, SB_KEY);
  return _sbClient;
}
function markDirty() {
  if (window.IS_DEMO) return;
  SYNC.dirty = true; saveMeta();
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushNow, 1200);
}
async function pushNow() {
  if (window.IS_DEMO || !ATHLETE_ID || SYNC.syncing || !SYNC.dirty) return SYNC.dirty === false;
  if (navigator.onLine === false) { scheduleRetry(); return false; }
  SYNC.syncing = true; refreshSyncBadge();
  let okay = false;
  try {
    const sb = _sb();
    if (!sb) throw new Error('Supabase not loaded');
    const payload = {};
    payload[K_CFG()] = localStorage.getItem(K_CFG()) || '{}';
    payload[K_LOG()] = localStorage.getItem(K_LOG()) || '{}';
    const { error } = await sb.rpc('save_progress', {
      p_athlete_id: ATHLETE_ID, p_athlete_name: ATHLETE_NAME, p_data: payload, p_key: KEY
    });
    if (error) throw new Error(error.message || 'save rejected');
    SYNC.dirty = false; SYNC.attempts = 0; SYNC.lastErr = null; SYNC.lastOk = Date.now();
    clearTimeout(_retryTimer);
    okay = true;
  } catch (e) {
    SYNC.lastErr = String((e && e.message) || e);
    SYNC.attempts++;
    scheduleRetry();
  }
  SYNC.syncing = false;
  saveMeta();
  refreshSyncBadge();
  return okay;
}
function scheduleRetry() {
  clearTimeout(_retryTimer);
  if (!SYNC.dirty || window.IS_DEMO) return;
  const delay = RETRY_MS[Math.min(SYNC.attempts, RETRY_MS.length - 1)];
  _retryTimer = setTimeout(pushNow, delay);
}
function syncLabel() {
  if (window.IS_DEMO) return 'DEMO — THIS DEVICE ONLY';
  if (SYNC.syncing) return 'SAVING…';
  if (SYNC.dirty) return navigator.onLine === false ? 'OFFLINE — SAVED ON THIS PHONE' : 'WAITING TO SYNC';
  return SYNC.lastOk ? 'SYNCED ' + agoLabel(SYNC.lastOk) : 'SAVED ON THIS PHONE';
}
function agoLabel(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return 'JUST NOW';
  const m = Math.round(s / 60);
  if (m < 60) return m + ' MIN AGO';
  const h = Math.round(m / 60);
  return h < 24 ? h + 'H AGO' : Math.round(h / 24) + 'D AGO';
}
// Patch the badge in place rather than re-rendering: a full render would steal
// focus from the add-habit field mid-typing.
function refreshSyncBadge() {
  document.querySelectorAll('[data-sync]').forEach(el => { el.textContent = syncLabel(); });
}

async function syncFromCloud() {
  if (window.IS_DEMO || !ATHLETE_ID) return;
  for (let i = 0; i < 30 && !(window.supabase && window.supabase.createClient); i++) await new Promise(r => setTimeout(r, 100));
  try {
    const sb = _sb();
    if (!sb) return;
    const { data, error } = await sb.rpc('get_progress', { p_athlete_id: ATHLETE_ID, p_key: KEY });
    if (error || !data || typeof data !== 'object') return;
    // Log merge: union of days, and per habit the LARGER logged value wins —
    // so a stale device can never erase a real number recorded elsewhere.
    try {
      const cloudLog = JSON.parse(data[K_LOG()] || '{}') || {};
      Object.keys(cloudLog).forEach(day => {
        const mine = LOG[day] || {}, theirs = cloudLog[day] || {}, out = Object.assign({}, mine);
        Object.keys(theirs).forEach(id => { out[id] = Math.max(Number(theirs[id]) || 0, Number(mine[id]) || 0); });
        LOG[day] = out;
      });
      localStorage.setItem(K_LOG(), JSON.stringify(LOG));
    } catch (e) {}
    // Config: newest wins wholesale, but never clobber unsent local settings.
    try {
      const cloudCfg = JSON.parse(data[K_CFG()] || '{}');
      if (cloudCfg && !SYNC.dirty && (cloudCfg.updatedAt || 0) > (CFG.updatedAt || 0)) {
        const keepSeen = CFG.seen, keepSig = CFG.rulesSig;
        CFG = Object.assign(defaultCfg(), cloudCfg);
        CFG.on = Object.assign(defaultCfg().on, cloudCfg.on || {});
        if (!CFG.seen) CFG.seen = keepSeen;
        if (!CFG.rulesSig) CFG.rulesSig = keepSig;
        localStorage.setItem(K_CFG(), JSON.stringify(CFG));
      }
    } catch (e) {}
    migrateOld();
  } catch (e) { /* offline — the phone still holds everything */ }
}

// ── Derived stats, all from real history ──────────────────────────────────
function loggedDays() { return Object.keys(LOG).sort(); }
function dayPct(dayKey) {
  const hs = live(); if (!hs.length) return 0;
  return Math.round(hs.filter(h => isDone(h, dayKey)).length / hs.length * 100);
}
function isPerfect(dayKey) { const hs = live(); return hs.length > 0 && hs.every(h => isDone(h, dayKey)); }
function dayQualifies(dayKey) { return dayPct(dayKey) >= XP_RULES.streakQualifyPct; }
function currentDayStreak() {
  let d = dayQualifies(TKEY()) ? today() : addDays(today(), -1), n = 0;
  while (dayQualifies(fmtKey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function runLength(days) {
  let best = 0, run = 0, prev = null;
  days.forEach(k => {
    run = (prev && fmtKey(addDays(parseKey(prev), 1)) === k) ? run + 1 : 1;
    best = Math.max(best, run); prev = k;
  });
  return best;
}
function bestDayStreak() { return Math.max(runLength(loggedDays().filter(dayQualifies)), currentDayStreak()); }
function habitStreak(h) {
  let d = isDone(h, TKEY()) ? today() : addDays(today(), -1), n = 0;
  while (isDone(h, fmtKey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function habitBest(h) { return Math.max(runLength(loggedDays().filter(k => isDone(h, k))), habitStreak(h)); }
function habitWeek(h) { let n = 0; for (let i = 0; i < 7; i++) if (isDone(h, fmtKey(addDays(today(), -i)))) n++; return n; }
function habitRate35(h) { let n = 0; for (let i = 0; i < 35; i++) if (isDone(h, fmtKey(addDays(today(), -i)))) n++; return Math.round(n / 35 * 100); }

// ── XP ────────────────────────────────────────────────────────────────────
function baseXp(h) {
  const w = XP_RULES.weights[h.id];
  return typeof w === 'number' ? w : XP_RULES.customXp;
}
// Pro-rata while part way, with a bonus once the target is actually met — so a
// near-miss still pays, but finishing pays more.
function xpFor(h, v) {
  if (v <= 0) return 0;
  const base = baseXp(h);
  return Math.round(v >= h.target ? base * XP_RULES.completionBonus : base * (v / h.target));
}
// A habit's own XP pool across all history. Counted even when the habit is
// currently switched off — XP you earned is never taken back.
function habitXp(h) { return loggedDays().reduce((s, k) => s + xpFor(h, valOf(k, h.id)), 0); }
function overallXp() { return allHabits().reduce((s, h) => s + habitXp(h), 0); }
// Habit ladders reuse the curve, scaled to that habit's daily value, so every
// habit levels at the same RATE — which is what makes your level in a habit
// track how often you actually do it.
function baseFor(h) { return h ? Math.max(10, Math.round(baseXp(h) * XP_RULES.completionBonus)) : XP_RULES.base; }
function levelCost(base, n) { return Math.max(10, Math.round(base * Math.pow(n, XP_RULES.growth) / 10) * 10); }

function rankFor(level) {
  const i = Math.max(0, level - 1);
  const star = Math.floor(i / LEVELS_PER_CYCLE);
  const within = i % LEVELS_PER_CYCLE;
  const name = RANKS[Math.floor(within / SUBS_PER_RANK)];
  const sub = (within % SUBS_PER_RANK) + 1;
  return { star, name, sub, label: (star ? '★' + star + ' ' : '') + name + ' ' + sub };
}
function levelInfo(xp, base) {
  base = base || XP_RULES.base;
  let lv = 1, spent = 0, cost = levelCost(base, 1);
  while (lv < MAX_LEVEL_SCAN && xp - spent >= cost) { spent += cost; lv++; cost = levelCost(base, lv); }
  const into = xp - spent, r = rankFor(lv);
  return {
    lv, xp, into, need: cost, toNext: cost - into,
    pct: Math.max(0, Math.min(100, Math.round(into / cost * 100))),
    rank: r, label: r.label,
    nextLabel: (cost - into) + ' XP to level ' + (lv + 1)
  };
}
function overallLevel() { return levelInfo(overallXp(), XP_RULES.base); }
function habitLevel(h) { return levelInfo(habitXp(h), baseFor(h)); }

// XP earned inside a date window — powers the weekly recap.
function xpBetween(fromDate, toDate) {
  let sum = 0;
  loggedDays().forEach(k => {
    const d = parseKey(k);
    if (d < fromDate || d > toDate) return;
    allHabits().forEach(h => { sum += xpFor(h, valOf(k, h.id)); });
  });
  return sum;
}

// ── Consistency ladders ───────────────────────────────────────────────────
// Tier is earned on the BEST run ever, so a broken streak never revokes a badge.
function consistencyFor(h) {
  const best = habitBest(h), cur = habitStreak(h);
  let tier = 0;
  CONSISTENCY_TIERS.forEach((t, i) => { if (best >= t.days) tier = i + 1; });
  return { best, cur, tier, next: CONSISTENCY_TIERS[tier] || null, total: CONSISTENCY_TIERS.length };
}
function measureAch(a) {
  if (a.measure === 'perfectDays') return loggedDays().filter(isPerfect).length;
  if (a.measure === 'daysWith3') return loggedDays().filter(k => live().filter(h => isDone(h, k)).length >= 3).length;
  const parts = a.measure.split(':'), kind = parts[0], h = habitById(parts[1]);
  if (kind === 'streak') return habitStreak(h);
  if (kind === 'daysHit') return loggedDays().filter(k => isDone(h, k)).length;
  return 0;
}
function dayNumber() {
  const days = loggedDays();
  if (!days.length) return 1;
  return Math.max(1, Math.round((today() - parseKey(days[0])) / 86400000) + 1);
}

// ── The nudge (one per day, driven by what is actually missing) ───────────
function nudge() {
  const missing = live().filter(h => !isDone(h));
  const water = live().find(h => h.id === 'water');
  if (water && !isDone(water)) {
    const left = Math.max(1, Math.ceil(water.target - valOf(TKEY(), 'water')));
    return { line: 'You have out-hydrated exactly zero houseplants today. ' + left + ' more glass' + (left === 1 ? '' : 'es') + ' and I stop bringing it up.',
             cta: 'SORT THE WATER', target: water.id };
  }
  if (missing.length) {
    return { line: missing.length + ' habit' + (missing.length === 1 ? '' : 's') + ' left, and ' + missing[0].name.toLowerCase() + ' is the one you are avoiding. I can tell.',
             cta: 'OPEN ' + missing[0].name, target: missing[0].id };
  }
  return { line: 'Everything is checked. I have nothing to nag about, which is deeply unsettling for me.',
           cta: 'SEE THE RECAP', target: null };
}

// ── Level-up detection ────────────────────────────────────────────────────
// Levels are derived, never stored, so instead of catching every mutation we
// keep the last level the athlete has actually been SHOWN (CFG.seen) and diff
// against it. That covers local check-offs, a cloud sync arriving with new XP,
// and migrations alike.
function currentLevels() {
  const out = { _overall: overallLevel().lv };
  allHabits().forEach(h => { out[h.id] = habitLevel(h).lv; });
  return out;
}
// Signature of everything that affects scoring. When XP_RULES or a target
// changes, levels legitimately move — we re-baseline silently instead of
// firing a hundred celebrations the athlete did not earn today.
function rulesSignature() {
  const src = JSON.stringify([
    XP_RULES.base, XP_RULES.growth, XP_RULES.completionBonus, XP_RULES.customXp,
    XP_RULES.weights, CONSISTENCY_TIERS.map(t => t.days), HABITS.map(h => [h.id, h.target])
  ]);
  let hash = 0;
  for (let i = 0; i < src.length; i++) hash = (hash * 31 + src.charCodeAt(i)) % 2147483647;
  return 'r' + hash.toString(36);
}
function seedSeenLevels() { CFG.seen = currentLevels(); CFG.rulesSig = rulesSignature(); saveCfg(); }
function checkLevelUps() {
  const sig = rulesSignature();
  if (!CFG.seen || CFG.rulesSig !== sig) {
    const rescored = !!CFG.seen && CFG.rulesSig !== sig;
    seedSeenLevels();
    if (rescored) toast('XP system updated — your levels were rescored.');
    return;
  }
  const now = currentLevels(), seen = CFG.seen, events = [];
  Object.keys(now).forEach(id => {
    const from = typeof seen[id] === 'number' ? seen[id] : now[id];
    if (now[id] <= from) return;
    const overall = id === '_overall';
    const a = rankFor(now[id]), b = rankFor(from);
    const rankChanged = a.name !== b.name || a.star !== b.star;
    // Full-screen takeover for an overall level or a real rank promotion.
    // Routine habit levels flash in their row, so day one is not nine takeovers.
    events.push({ id, overall, from, to: now[id], rankChanged,
                  name: overall ? 'OVERALL' : habitById(id).name,
                  big: overall || rankChanged });
  });
  CFG.seen = now;
  saveCfg();
  if (!events.length) return;
  events.forEach(e => { if (e.big) UI.celebrate.push(e); else UI.flash[e.id] = e.to; });
  clearTimeout(_flashTimer);
  _flashTimer = setTimeout(() => { UI.flash = {}; render(); }, 1600);
}
function dismissCelebration() { UI.celebrate.shift(); render(); }

// ── Actions ───────────────────────────────────────────────────────────────
function toast(text) {
  UI.toast = text; render();
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { UI.toast = null; render(); }, 2200);
}
function setVal(id, v) {
  const k = TKEY();
  if (!LOG[k]) LOG[k] = {};
  LOG[k][id] = Math.max(0, v);
  saveLog();
}
function toggleHabit(h) {
  const done = isDone(h), before = habitXp(h);
  setVal(h.id, done ? 0 : h.target);
  checkLevelUps();
  render();
  if (!done) toast('+' + (habitXp(h) - before) + ' XP · ' + h.name + ' logged. Look at you.');
}
function bump(h) {
  const before = habitXp(h);
  const v = Math.min(h.target, valOf(TKEY(), h.id) + (h.step || 1));
  setVal(h.id, v);
  checkLevelUps();
  render();
  const gained = habitXp(h) - before;
  toast(v >= h.target ? '+' + gained + ' XP · ' + h.name + ' complete.' : '+' + gained + ' XP. Keep them coming.');
}
function openSheet(h) { UI.sheet = h.id; UI.sheetVal = valOf(TKEY(), h.id); render(); }
function openHabit(id, from) { UI.open = id; UI.from = from || UI.screen; UI.screen = 'detail'; render(); }
function go(screen) { UI.screen = screen; UI.open = null; render(); }

// ── Render helpers ────────────────────────────────────────────────────────
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let _handlers = {};
function on(fn) { const id = 'h' + (Math.random().toString(36).slice(2, 9)); _handlers[id] = fn; return 'data-h="' + id + '"'; }

function render() {
  _handlers = {};
  const app = document.getElementById('app');
  app.className = 'app on';
  app.innerHTML = CFG.onboarded ? renderApp() : renderOnboarding();
  app.querySelectorAll('[data-h]').forEach(el => {
    const fn = _handlers[el.getAttribute('data-h')];
    if (fn) el.addEventListener('click', ev => { ev.stopPropagation(); fn(ev); });
  });
  const nh = app.querySelector('#newhabit');
  if (nh) nh.addEventListener('input', e => { UI._newName = e.target.value; });
  document.querySelector('meta[name="theme-color"]').setAttribute('content', CFG.dark ? '#0F1A15' : '#FAF7F2');
}

// ── Onboarding — one screen: the suggested habit set, all editable ─────────
function renderOnboarding() {
  const nOn = live().length;
  return `
    <div style="height:100%;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom))">
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:2px solid var(--divider)">
        <div class="hd" style="font-size:16px;line-height:1;letter-spacing:.02em">Proof</div>
        <div class="eyebrow">${nOn} tracked</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;padding-top:26px;overflow:hidden;animation:riseIn .3s ease">
        <div class="hd" style="font-size:38px;line-height:.98;letter-spacing:-.03em">Here's what<br>I'd track</div>
        <p style="margin:14px 0 16px;font-size:14px;color:var(--muted)">
          These are my suggestions. Switch off anything you'd only lie about later — you can change all of it whenever you like.
        </p>
        <div style="flex:1;overflow-y:auto;border-top:2px solid var(--divider)">
          ${allHabits().map(h => `<button style="width:100%;text-align:left;padding:13px 2px;display:flex;justify-content:space-between;align-items:center;gap:12px" class="row-rule"
            ${on(() => { CFG.on[h.id] = CFG.on[h.id] === false; saveCfg(); render(); })}>
            <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
              <span class="hd" style="font-size:16px;line-height:1">${esc(h.name)}</span>
              <span style="font-size:11px;line-height:1.2;color:var(--muted)">${esc(h.goal || h.source)} · ${baseXp(h)} XP</span>
            </span>
            <span class="sw ${CFG.on[h.id] !== false ? 'on' : ''}"><i></i></span>
          </button>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:18px" ${on(() => {
        if (!live().length) { toast('Pick at least one habit.'); return; }
        CFG.onboarded = true; saveCfg(); seedSeenLevels(); UI.screen = 'today'; render();
      })}>Start tracking</button>
    </div>`;
}

// ── App shell ─────────────────────────────────────────────────────────────
function renderApp() {
  const LI = overallLevel();
  const hs = live(), doneCount = hs.filter(h => isDone(h)).length, pct = dayPct(TKEY());
  const openH = habitById(UI.open || (hs[0] || HABITS[0]).id);
  const earnedMilestones = ACHIEVEMENTS.filter(a => measureAch(a) >= a.need).length;
  const earnedTiers = allHabits().reduce((s, h) => s + consistencyFor(h).tier, 0);
  const totalTiers = allHabits().length * CONSISTENCY_TIERS.length;
  const earned = earnedMilestones + earnedTiers, totalAch = ACHIEVEMENTS.length + totalTiers;

  const heads = {
    today:    [today().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }) + ' · Day ' + dayNumber(), greeting()],
    habits:   [hs.length + ' tracked · tap for detail', 'Habits'],
    detail:   [openH.source, openH.name],
    insights: ['LV ' + LI.lv + ' ' + LI.label + ' · ' + LI.xp.toLocaleString() + ' XP', 'Achievements'],
    settings: ['Profile & tracking', 'Settings']
  };
  const rights = {
    today: pct + '% DONE', habits: 'LV ' + LI.lv, detail: 'LV ' + habitLevel(openH).lv,
    insights: earned + ' OF ' + totalAch, settings: ''
  };
  const head = heads[UI.screen] || heads.today;

  let screenHtml = '';
  if (UI.screen === 'today') screenHtml = renderToday(LI, doneCount, pct);
  else if (UI.screen === 'habits') screenHtml = renderHabits();
  else if (UI.screen === 'detail') screenHtml = renderDetail(openH);
  else if (UI.screen === 'insights') screenHtml = renderAchievements(LI, earned, totalAch);
  else screenHtml = renderSettings();

  const tabDefs = [['TODAY','today','01'],['ACHIEVEMENTS','insights','02'],['HABITS','habits','03'],['SETTINGS','settings','04']];
  const activeTab = UI.screen === 'detail' ? 'habits' : UI.screen;

  return `
    ${window.IS_DEMO ? '<div class="demo-banner">Demo mode — nothing is saved to the cloud</div>' : ''}
    <div class="apphd">
      <div style="min-width:0">
        <div class="eyebrow">${esc(head[0])}</div>
        <div class="title hd">${esc(head[1])}</div>
      </div>
      <div class="right mono">${esc(rights[UI.screen] || '')}</div>
    </div>
    <div class="scroll" id="scroll">${screenHtml}</div>
    <div class="tabs">
      ${tabDefs.map(t => `<button class="${activeTab === t[1] ? 'on' : ''}" ${on(() => go(t[1]))}>
        <span class="num">${t[2]}</span><span class="nm">${t[0]}</span>
      </button>`).join('')}
    </div>
    ${UI.sheet ? renderSheet() : ''}
    ${UI.toast && !UI.celebrate.length ? `<div class="toast">${esc(UI.toast)}</div>` : ''}
    ${UI.celebrate.length ? renderCelebration(UI.celebrate[0]) : ''}`;
}
function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

// ── Level-up takeover ─────────────────────────────────────────────────────
function renderCelebration(ev) {
  const isHabit = !ev.overall;
  const h = isHabit ? habitById(ev.id) : null;
  const info = isHabit ? habitLevel(h) : overallLevel();
  const r = rankFor(ev.to), promoted = ev.rankChanged;
  const prestiged = promoted && r.star > 0 && r.name === RANKS[0] && r.sub === 1;
  const shards = [[0,-118],[84,-84],[118,0],[84,84],[0,118],[-84,84],[-118,0],[-84,-84],[52,-132],[-52,132],[132,52],[-132,-52]];
  return `
    <div class="lvwrap ${promoted ? 'rank' : ''}" ${on(dismissCelebration)}>
      <div class="lvstage">
        <div class="lvrays"></div>
        <div class="lvshock"></div>
        <div class="lvshards">
          ${shards.map((s, i) => `<i style="--dx:${s[0]}px;--dy:${s[1]}px;animation-delay:${(0.22 + i * 0.025).toFixed(3)}s"></i>`).join('')}
        </div>
        <div class="lvbadge"><span class="n">${ev.to}</span><span class="l">LEVEL</span></div>
      </div>
      <div class="lvkicker">${prestiged ? 'Prestige' : (promoted ? 'Rank up' : 'Level up')}</div>
      <div class="lvrank">${esc(isHabit ? h.name : r.label)}</div>
      ${isHabit ? `<div class="lvsub">${esc(r.label)} · your ${esc(h.name.toLowerCase())} rank</div>`
                : `<div class="lvsub">Overall level ${ev.to} · ${info.into} / ${info.need} XP</div>`}
      <div class="lvbar"><span style="--w:${info.pct}%"></span></div>
      <button class="lvgo">${UI.celebrate.length > 1 ? 'Next' : 'Continue'}</button>
      ${UI.celebrate.length > 1 ? `<div class="lvqueue">${UI.celebrate.length - 1} more to go</div>` : ''}
    </div>`;
}

// ── Habit row, shared by Today and Habits ─────────────────────────────────
function habitRow(h, from) {
  const v = valOf(TKEY(), h.id), done = isDone(h), st = habitStreak(h);
  const hl = habitLevel(h), flashed = UI.flash[h.id];
  const status = h.kind === 'count'
    ? fmtVal(h, v) + ' of ' + fmtVal(h, h.target) + ' ' + h.unit
    : (done ? 'Done · ' + (h.goal || h.unit) : (h.goal || h.source));
  const pc = Math.min(100, Math.round(v / h.target * 100));
  return `<div class="hrow ${done ? 'done' : ''}">
    <button class="checkcell" ${on(() => toggleHabit(h))} aria-label="Toggle ${esc(h.name)}">
      <span class="boxmark ${done ? 'on' : ''}">${done ? '✓' : ''}</span>
    </button>
    <button class="body" ${on(() => openHabit(h.id, from))}>
      <span class="line1">
        <span class="nm">${esc(h.name)}</span>
        ${flashed ? `<span class="lvchip">LV ${flashed} ↑</span>`
                  : `<span class="hlv">LV ${hl.lv}${st > 0 ? ' · ' + st + 'D' : ''}</span>`}
      </span>
      <span class="status">${esc(status)}</span>
      <span class="track"><span style="width:${pc}%"></span></span>
    </button>
    ${h.kind === 'count' ? `<button class="pluscell" ${on(() => bump(h))} aria-label="Add to ${esc(h.name)}">+</button>` : ''}
  </div>`;
}

// ── Today ─────────────────────────────────────────────────────────────────
function renderToday(LI, doneCount, pct) {
  const hs = live();
  const n = nudge();
  // The recap half of "nudge and recap": last seven days at a glance.
  const weekStart = addDays(today(), -6);
  const weekXp = xpBetween(weekStart, today());
  let goodDays = 0;
  for (let i = 0; i < 7; i++) if (dayQualifies(fmtKey(addDays(today(), -i)))) goodDays++;
  const ranked = hs.map(h => ({ h, w: habitWeek(h) })).sort((a, b) => b.w - a.w);
  const strongest = ranked[0], weakest = ranked[ranked.length - 1];

  return `
    <div style="animation:fadeIn .25s ease">
      <div class="block" style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:flex-end;gap:14px">
          <div class="figure" style="font-size:64px;line-height:.85">${LI.lv}</div>
          <div style="display:flex;flex-direction:column;gap:3px;padding-bottom:6px">
            <div class="hd" style="font-size:17px;line-height:1">${esc(LI.label)}</div>
            <div style="font-size:12px;line-height:1.3;color:var(--muted)">${LI.xp.toLocaleString()} XP · ${esc(LI.nextLabel)}</div>
          </div>
        </div>
        <div class="bar thin"><span style="width:${LI.pct}%"></span></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="eyebrow" style="display:flex;justify-content:space-between"><span>Today</span><span>${doneCount} of ${hs.length} habits</span></div>
          <div class="bar"><span style="width:${pct}%"></span></div>
        </div>
      </div>

      <div class="coachcard">
        <div class="eyebrow">One nudge, as agreed</div>
        <div class="say">${esc(n.line)}</div>
        <button class="cta" ${on(() => (n.target ? openHabit(n.target, 'today') : go('insights')))}>${esc(n.cta)}</button>
      </div>

      ${hs.map(h => habitRow(h, 'today')).join('')}

      <div class="block" style="display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--divider)">
        <div class="eyebrow" style="letter-spacing:.12em">The last seven days</div>
        <div style="display:flex;gap:22px">
          <div><div class="figure" style="font-size:34px;line-height:.95">${goodDays}<span style="font-size:16px;color:var(--muted)">/7</span></div>
            <div class="eyebrow" style="letter-spacing:.1em;margin-top:4px">Days on target</div></div>
          <div><div class="figure" style="font-size:34px;line-height:.95">${weekXp.toLocaleString()}</div>
            <div class="eyebrow" style="letter-spacing:.1em;margin-top:4px">XP earned</div></div>
        </div>
        ${ranked.length > 1 ? `<div style="font-size:13px;line-height:1.5;color:var(--muted)">
          Strongest: <strong style="color:var(--ink)">${esc(strongest.h.name)}</strong> ${strongest.w}/7 ·
          weakest: <strong style="color:var(--ink)">${esc(weakest.h.name)}</strong> ${weakest.w}/7.
        </div>` : ''}
      </div>

      <div style="padding:0 20px 30px;font-size:11px;line-height:1.5;color:var(--muted-soft)">
        Tap a habit's name for its history and rank. Steps, sleep, water and meals take a number — tap the +, or open the habit to log it.
      </div>
    </div>`;
}

// ── Habits tab ────────────────────────────────────────────────────────────
// Today is for ticking things off; this is for seeing where you stand. One row
// per habit — rank, level progress, today's state and the consistency ladder —
// so nothing here repeats the Today list.
function renderHabits() {
  const hs = live(), off = offHabits();
  const sectionLabel = (t, r) => `<div class="eyebrow" style="padding:18px 20px 8px;letter-spacing:.12em;display:flex;justify-content:space-between"><span>${t}</span><span>${r || ''}</span></div>`;
  const statusOf = (h) => {
    const v = valOf(TKEY(), h.id);
    if (isDone(h)) return 'Done today';
    return h.kind === 'count' ? fmtVal(h, v) + ' of ' + fmtVal(h, h.target) + ' ' + h.unit + ' today' : 'Not done today';
  };
  return `
    <div style="animation:fadeIn .25s ease">
      ${sectionLabel('Tracked', 'Tap for history')}
      ${hs.length ? hs.map(h => {
        const hl = habitLevel(h), c = consistencyFor(h), st = habitStreak(h), done = isDone(h);
        return `<button class="row-rule" style="width:100%;text-align:left;display:flex;gap:14px;align-items:center;padding:14px 20px;${done ? 'background:var(--accent-100);' : ''}"
          ${on(() => openHabit(h.id, 'habits'))}>
          <div class="hd" style="width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--accent);color:var(--bg)">${hl.lv}</div>
          <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
              <span class="hd" style="font-size:16px;line-height:1">${esc(h.name)}</span>
              <span class="hlv">${st > 0 ? st + 'D' : '—'}</span>
            </div>
            <div style="font-size:11px;line-height:1.3;color:var(--muted)">${esc(hl.label)} · ${hl.xp.toLocaleString()} XP · ${esc(statusOf(h))}</div>
            <div class="bar" style="height:4px;width:100%"><span style="width:${hl.pct}%"></span></div>
          </div>
          <div class="pips" style="flex:none">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i < c.tier ? 'on' : ''}" title="${t.days} days"></i>`).join('')}</div>
        </button>`;
      }).join('') : `<div style="padding:18px 20px;font-size:13px;color:var(--muted)">Nothing tracked yet. Switch habits on in Settings.</div>`}

      ${off.length ? sectionLabel('Paused', 'Turn on in Settings') +
        off.map(h => `<div class="row-rule" style="display:flex;gap:14px;align-items:center;padding:13px 20px;opacity:.45">
          <div class="hd" style="width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid var(--box)">${habitLevel(h).lv}</div>
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
            <div class="hd" style="font-size:16px;line-height:1">${esc(h.name)}</div>
            <div style="font-size:11px;line-height:1.3;color:var(--muted)">Paused · ${habitLevel(h).xp.toLocaleString()} XP banked</div>
          </div>
        </div>`).join('') : ''}

      <div style="padding:18px 20px 34px;font-size:11px;line-height:1.5;color:var(--muted-soft)">
        The number is your level in that habit — it climbs with how often you do it, not how hard it is. The five squares are your consistency tiers, from a 5-day run up to two months.
      </div>
    </div>`;
}

// ── Habit detail ──────────────────────────────────────────────────────────
function renderDetail(h) {
  const cells = [];
  for (let i = 34; i >= 0; i--) {
    const k = fmtKey(addDays(today(), -i)), v = valOf(k, h.id);
    cells.push(v >= h.target ? 'hit' : (v > 0 ? 'part' : ''));
  }
  const logRows = [];
  for (let i = 1; i <= 5; i++) {
    const d = addDays(today(), -i), k = fmtKey(d), v = valOf(k, h.id), hit = v >= h.target;
    logRows.push({
      day: i === 1 ? 'YESTERDAY' : d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric' }).toUpperCase(),
      note: h.kind === 'count' ? fmtVal(h, v) + ' ' + h.unit + ' logged' : (hit ? 'Logged in the app' : 'Nothing logged'),
      val: hit ? 'HIT' : 'MISS', hit, xp: xpFor(h, v)
    });
  }
  const stats = [
    { v: habitWeek(h) + '/7',       k: 'This week' },
    { v: habitBest(h) + 'd',        k: 'Best streak' },
    { v: habitRate35(h) + '%',      k: '35-day rate' }
  ];
  const hl = habitLevel(h), con = consistencyFor(h), done = isDone(h);
  const v = valOf(TKEY(), h.id);
  return `
    <div style="animation:fadeIn .25s ease">
      <div class="block" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:flex-end;gap:14px">
          <div class="figure" style="font-size:76px;line-height:.8">${hl.lv}</div>
          <div style="display:flex;flex-direction:column;gap:4px;padding-bottom:6px">
            <div class="hd" style="font-size:16px;line-height:1">${esc(hl.label)}</div>
            <div style="font-size:12px;line-height:1.3;color:var(--muted)">${hl.xp.toLocaleString()} XP banked · ${hl.toNext} to LV ${hl.lv + 1}</div>
          </div>
        </div>
        <div class="bar thin"><span style="width:${hl.pct}%"></span></div>
        <p style="margin:2px 0 0;font-size:13px;color:var(--muted)">${esc(QUIPS[h.id] || h.goal || '')}</p>
      </div>

      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
          <span>Today</span><span>${done ? 'DONE' : fmtVal(h, v) + ' / ' + fmtVal(h, h.target) + ' ' + h.unit.toUpperCase()}</span>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn ${done ? 'btn-secondary' : 'btn-primary'}" style="flex:1"
            ${on(() => (h.kind === 'count' ? openSheet(h) : toggleHabit(h)))}>${h.kind === 'count' ? 'Log a number' : (done ? 'Undo today' : 'Mark done')}</button>
          ${h.kind === 'count' && !done ? `<button class="btn btn-secondary" ${on(() => bump(h))}>+${h.step || 1}</button>` : ''}
        </div>
        <div style="font-size:11px;color:var(--muted-soft)">Worth ${baseXp(h)} XP a day · ${Math.round(baseXp(h) * XP_RULES.completionBonus)} XP when you finish it</div>
      </div>

      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="display:flex;justify-content:space-between;letter-spacing:.12em">
          <span>Consistency</span><span>${con.tier} of ${con.total}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div class="pips">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i < con.tier ? 'on' : ''}" title="${t.days} days"></i>`).join('')}</div>
          <div style="font-size:12px;color:var(--muted);text-align:right">
            ${con.next ? esc(con.next.name) + ' at ' + con.next.days + ' days · best run ' + con.best + 'd'
                       : 'UNBREAKABLE — every tier cleared'}
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:2px solid var(--divider)">
        ${stats.map((s, i) => `<div style="padding:14px 12px;${i < 2 ? 'border-right:1px solid var(--rule);' : ''}display:flex;flex-direction:column;gap:5px">
          <div class="hd" style="font-size:24px;line-height:1">${esc(s.v)}</div>
          <div class="eyebrow" style="letter-spacing:.1em">${esc(s.k)}</div>
        </div>`).join('')}
      </div>

      <div class="block" style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow" style="letter-spacing:.12em">Last 35 days</div>
        <div class="grid35">${cells.map(c => `<div class="c ${c}"></div>`).join('')}</div>
      </div>

      <div>
        ${logRows.map(l => `<div class="row-rule" style="padding:13px 20px;display:flex;justify-content:space-between;align-items:baseline;gap:12px">
          <span style="display:flex;flex-direction:column;gap:3px">
            <span class="hd" style="font-size:14px;line-height:1">${esc(l.day)}</span>
            <span style="font-size:11px;line-height:1;color:var(--muted)">${esc(l.note)}</span>
          </span>
          <span style="text-align:right">
            <span class="mono" style="display:block;font-size:10px;font-weight:700;color:${l.hit ? 'var(--clay-deep)' : 'var(--muted-soft)'}">${l.val}</span>
            <span class="mono" style="display:block;font-size:9px;color:var(--muted-soft);margin-top:3px">+${l.xp} XP</span>
          </span>
        </div>`).join('')}
      </div>

      <div style="padding:18px 20px 34px">
        <button class="btn btn-secondary btn-block" ${on(() => go(UI.from === 'today' ? 'today' : 'habits'))}>Back to ${UI.from === 'today' ? 'today' : 'habits'}</button>
      </div>
    </div>`;
}

// ── Achievements ──────────────────────────────────────────────────────────
function renderAchievements(LI, earned, totalAch) {
  const sectionLabel = (t, r) => `<div class="eyebrow" style="padding:18px 20px 8px;letter-spacing:.12em;display:flex;justify-content:space-between"><span>${t}</span><span>${r || ''}</span></div>`;
  return `
    <div style="animation:fadeIn .25s ease">
      <div class="block" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:flex-end;gap:14px">
          <div class="figure" style="font-size:76px;line-height:.8">${LI.lv}</div>
          <div style="display:flex;flex-direction:column;gap:4px;padding-bottom:6px">
            <div class="hd" style="font-size:18px;line-height:1">${esc(LI.label)}</div>
            <div style="font-size:12px;line-height:1.3;color:var(--muted)">${LI.xp.toLocaleString()} XP · ${LI.toNext} to LV ${LI.lv + 1}</div>
          </div>
        </div>
        <div class="bar thin"><span style="width:${LI.pct}%"></span></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--divider)">
        <div style="padding:14px 20px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:4px">
          <div class="figure" style="font-size:32px;line-height:.95">${currentDayStreak()}</div>
          <div class="eyebrow" style="letter-spacing:.12em">Day streak · best ${bestDayStreak()}</div>
        </div>
        <div style="padding:14px 20px;display:flex;flex-direction:column;gap:4px">
          <div class="hd" style="font-size:32px;line-height:.95;letter-spacing:-.03em">${earned} / ${totalAch}</div>
          <div class="eyebrow" style="letter-spacing:.12em">Unlocked</div>
        </div>
      </div>

      ${sectionLabel('Consistency', '5 tiers each')}
      ${allHabits().map(h => {
        const c = consistencyFor(h);
        return `<button class="row-rule" style="width:100%;text-align:left;display:flex;gap:14px;align-items:center;padding:13px 20px"
          ${on(() => openHabit(h.id, 'insights'))}>
          <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">
            <div class="hd" style="font-size:14px;line-height:1">${esc(h.name)}</div>
            <div style="font-size:11px;line-height:1.3;color:var(--muted)">
              ${c.next ? esc(c.next.name) + ' at ' + c.next.days + ' days' : esc(CONSISTENCY_TIERS[CONSISTENCY_TIERS.length-1].name) + ' — all cleared'}
              · best ${c.best}d${c.cur ? ' · now ' + c.cur + 'd' : ''}
            </div>
          </div>
          <div class="pips">${CONSISTENCY_TIERS.map((t, i) => `<i class="${i < c.tier ? 'on' : ''}" title="${t.days} days"></i>`).join('')}</div>
        </button>`;
      }).join('')}

      ${sectionLabel('Milestones')}
      ${ACHIEVEMENTS.map(a => {
        const have = measureAch(a), got = have >= a.need;
        return `<div class="row-rule" style="display:flex;gap:14px;align-items:center;padding:15px 20px;opacity:${got ? '1' : '.45'}">
          <div class="hd" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;
            ${got ? 'background:var(--accent);color:var(--bg);border:2px solid var(--accent)' : 'border:2px solid rgba(128,128,128,.5)'}">${a.code}</div>
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
            <div class="hd" style="font-size:15px;line-height:1">${esc(a.name)}</div>
            <div style="font-size:11px;line-height:1.3;color:var(--muted)">${esc(a.note)}</div>
          </div>
          <div style="flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end">
            <div class="mono" style="font-size:11px;color:${got ? 'var(--clay-deep)' : 'var(--muted-soft)'}">+${a.xp} XP</div>
            <div class="mono" style="font-size:8px;letter-spacing:.08em;color:var(--muted-soft)">${got ? 'UNLOCKED' : have + '/' + a.need}</div>
          </div>
        </div>`;
      }).join('')}
      <div style="height:30px"></div>
    </div>`;
}

// ── Settings ──────────────────────────────────────────────────────────────
function renderSettings() {
  const initials = (ATHLETE_NAME || 'Athlete').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const sectionLabel = (t) => `<div class="eyebrow" style="padding:18px 20px 6px;letter-spacing:.12em">${t}</div>`;
  return `
    <div style="animation:fadeIn .25s ease">
      <div class="block" style="display:flex;gap:14px;align-items:center;padding:18px 20px">
        <div class="hd" style="width:52px;height:52px;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:21px">${esc(initials)}</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <div class="hd" style="font-size:18px;line-height:1">${esc(ATHLETE_NAME || 'Athlete')}</div>
          <div style="font-size:11px;line-height:1;color:var(--muted)">Coached by Amir · day ${dayNumber()}</div>
        </div>
      </div>

      ${sectionLabel('Your data')}
      <div class="row-rule" style="padding:13px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <span class="hd" style="font-size:14px;line-height:1">Sync</span>
          <span class="mono" style="font-size:10px;letter-spacing:.08em;color:var(--muted)" data-sync>${syncLabel()}</span>
        </span>
        <button class="btn btn-secondary" style="padding:10px 14px;font-size:13px"
          ${on(async () => { if (window.IS_DEMO) { toast('Demo mode — nothing is sent.'); return; } markDirty(); await pushNow(); toast(SYNC.dirty ? 'Still offline — it is saved here and will go up on its own.' : 'Everything is up to date.'); })}>Sync now</button>
      </div>
      <div style="padding:10px 20px 4px;font-size:11px;line-height:1.5;color:var(--muted-soft)">
        Every tick is written to this phone the moment you make it, then sent up when there's a connection. Close the app, lose signal, fly somewhere — nothing is lost.
      </div>

      ${sectionLabel('Appearance')}
      <button class="selrow" style="border-bottom:1px solid var(--rule)" ${on(() => { CFG.dark = !CFG.dark; document.body.toggleAttribute('data-dark', CFG.dark); saveCfg(); render(); })}>
        <span class="lbl" style="font-size:15px">Dark mode</span>
        <span class="sw ${CFG.dark ? 'on' : ''}"><i></i></span>
      </button>

      ${sectionLabel('Tracked habits')}
      ${allHabits().map(h => {
        const custom = (CFG.custom || []).some(c => c.id === h.id);
        return `<div class="row-rule" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px">
          <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
            <span class="hd" style="font-size:14px;line-height:1">${esc(h.name)}</span>
            <span style="font-size:11px;line-height:1.2;color:var(--muted)">${esc(h.goal || h.source)} · ${baseXp(h)} XP</span>
          </span>
          <span style="display:flex;gap:10px;align-items:center">
            ${custom ? `<button class="mono" style="font-size:12px;color:var(--clay-deep);padding:4px 6px"
              ${on(() => { CFG.custom = CFG.custom.filter(c => c.id !== h.id); saveCfg(); render(); })} aria-label="Remove ${esc(h.name)}">✕</button>` : ''}
            <button class="sw ${CFG.on[h.id] !== false ? 'on' : ''}" ${on(() => { CFG.on[h.id] = CFG.on[h.id] === false; saveCfg(); render(); })} aria-label="Toggle ${esc(h.name)}"><i></i></button>
          </span>
        </div>`;
      }).join('')}
      <div style="padding:14px 20px 4px;display:flex;gap:8px">
        <input class="input" id="newhabit" maxlength="40" placeholder="Add a habit — e.g. No screens in bed" value="${esc(UI._newName || '')}" style="flex:1">
        <button class="btn btn-primary" style="padding:0 16px" ${on(() => {
          const name = String(UI._newName || '').trim();
          if (!name) return;
          const id = 'c_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 20) + '_' + Date.now().toString(36);
          CFG.custom = (CFG.custom || []).concat([{ id, name: name.toUpperCase(), goal: name }]);
          CFG.on[id] = true; UI._newName = '';
          if (CFG.seen) CFG.seen[id] = 1;
          saveCfg(); render(); toast(name.toUpperCase() + ' added · ' + XP_RULES.customXp + ' XP a day.');
        })}>Add</button>
      </div>
      <div style="padding:6px 20px 0;font-size:11px;color:var(--muted-soft)">Custom habits are worth ${XP_RULES.customXp} XP a day.</div>

      <div style="padding:22px 20px 34px">
        <button class="btn btn-secondary btn-block" ${on(() => { LOG[TKEY()] = {}; saveLog(); go('today'); toast('Clean slate. Try not to waste it.'); })}>Reset today's log</button>
      </div>
    </div>`;
}

// ── Log sheet ─────────────────────────────────────────────────────────────
function renderSheet() {
  const h = habitById(UI.sheet);
  const stepBy = h.step || 1;
  return `
    <div class="scrim" ${on(() => { UI.sheet = null; render(); })}></div>
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div class="hd" style="font-size:21px;line-height:1">Log ${esc(h.name)}</div>
        <button class="hd" style="font-size:13px;color:var(--clay-deep)" ${on(() => { UI.sheet = null; render(); })}>Close</button>
      </div>
      <div style="font-size:13px;line-height:1.4;color:var(--muted)">Target is ${fmtVal(h, h.target)} ${esc(h.unit)} a day. Round up generously, I will never know.</div>
      <div class="stepper">
        <button class="minus" ${on(() => { UI.sheetVal = Math.max(0, UI.sheetVal - stepBy); render(); })}>–</button>
        <div class="val">
          <span class="figure" style="font-size:36px;line-height:1">${fmtVal(h, UI.sheetVal)}</span>
          <span class="eyebrow">${esc(h.unit)}</span>
        </div>
        <button class="plus" ${on(() => { UI.sheetVal = UI.sheetVal + stepBy; render(); })}>+</button>
      </div>
      <button class="btn btn-primary btn-block" ${on(() => {
        const before = habitXp(h);
        setVal(h.id, UI.sheetVal);
        UI.sheet = null;
        checkLevelUps();
        render();
        toast(h.name + ' updated · +' + Math.max(0, habitXp(h) - before) + ' XP.');
      })}>Save it</button>
    </div>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error').classList.add('on');
}
(async function boot() {
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('client');
  const clientKey = params.get('key');
  if (!clientId) {
    showError('No client specified.\n\nOpen this page from your personal link:\nhabits.html?client=your_id');
    return;
  }
  try {
    const res = await fetch('data/' + encodeURIComponent(clientId) + '.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ATHLETE = (await res.json()).athlete || {};
  } catch (e) {
    showError('Could not load data for "' + clientId + '".\n\nCheck your link, or ask your coach for a fresh one.');
    return;
  }
  ATHLETE_ID = ATHLETE.id || clientId;
  ATHLETE_NAME = [ATHLETE.firstName, ATHLETE.lastName].filter(Boolean).join(' ');

  // Same 3-tier key resolution as program.html: URL → device copy → program JSON.
  if (!window.IS_DEMO) {
    const ks = ATHLETE_ID + '_skey';
    try {
      KEY = clientKey || localStorage.getItem(ks) || ATHLETE.key || null;
      if (KEY) localStorage.setItem(ks, KEY);
    } catch (e) { KEY = clientKey || ATHLETE.key || null; }
  }

  loadLocal();
  await syncFromCloud();
  // Levels that arrived with a sync still get their moment; a first run (or a
  // changed XP system) only re-baselines, so nobody is ambushed by a queue.
  checkLevelUps();
  if (CFG.dark) document.body.setAttribute('data-dark', '');
  document.title = 'Proof — ' + (ATHLETE.firstName || 'AA Performance');

  render();
  document.getElementById('loading').classList.add('hidden');

  // Anything still unsent from a previous session goes up now.
  if (SYNC.dirty) pushNow();

  window.addEventListener('online', () => { SYNC.attempts = 0; pushNow(); refreshSyncBadge(); });
  window.addEventListener('offline', refreshSyncBadge);
  window.addEventListener('visibilitychange', () => { if (document.hidden) pushNow(); else refreshSyncBadge(); });
  // Last-ditch attempt on the way out; keepalive is not available through the
  // client library, so this is best effort on top of the durable dirty flag.
  window.addEventListener('pagehide', () => { if (SYNC.dirty) pushNow(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>
