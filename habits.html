<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- iOS labels a home-screen icon from THIS meta, not from the manifest. Without
     it the icon would read "AA Proof — AA Performance" (the <title>) and be
     truncated to something meaningless. Keep it in step with manifest.name. -->
<meta name="apple-mobile-web-app-title" content="AA Proof">
<meta name="theme-color" content="#F6F4FF">
<title>AA Proof — AA Performance</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<!-- Dynamic manifest: bakes the CURRENT client link (incl. &key=) into start_url
     so an installed app keeps its identity and cloud writes keep working. -->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var client = params.get('client');
    var clientKey = params.get('key');
    window.IS_DEMO = (client === 'demo');
    var startUrl = client
      ? 'habits.html?client=' + encodeURIComponent(client) +
        (clientKey ? '&key=' + encodeURIComponent(clientKey) : '')
      : 'habits.html';
    var manifest = {
      name: "AA Proof", short_name: "AA Proof",
      description: "Daily health habits, tracked and coached.",
      start_url: startUrl, scope: "/", display: "standalone", orientation: "portrait",
      background_color: "#F6F4FF", theme_color: "#F6F4FF", lang: "en-GB",
      categories: ["fitness", "health", "sports"],
      icons: [
        { src: "/assets/img/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: "/assets/img/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    var link = document.createElement('link');
    link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ── Tokens ────────────────────────────────────────────────────────────
     PROOF's modernist structure on the AA Performance palette (the "green
     machine" mapping from the handoff's Color Options sheet): green is the
     accent, clay carries the coach's voice and mono meta. Zero radius
     anywhere, 2px section rules, 1px row rules, everything flush left. */
  :root {
    --bg: #FAF7F2;
    --surface: #EDE8E0;
    --ink: #1A1A1A;
    --accent: #0E4A36;
    --accent-600: #0B3B2B;
    --accent-700: #08301F;
    --accent-100: rgba(14,74,54,0.08);
    --clay: #C7552F;
    --clay-deep: #8E3A1E;
    --clay-100: rgba(199,85,47,0.09);
    /* Text that sits ON a clay background. Clay inverts between themes — deep
       clay is a dark brown in light mode and a light salmon in dark — so the
       text on it has to invert too. Hard-coding white gave 2.4:1 in dark mode
       on exactly the three surfaces that exist to warn you. */
    --on-clay: #FAF7F2;
    --scrim: rgba(26,26,26,0.45);
    --divider: rgba(26,26,26,0.40);
    --rule: rgba(26,26,26,0.20);
    --muted: rgba(26,26,26,0.58);
    --muted-soft: rgba(26,26,26,0.50);
    --track: rgba(26,26,26,0.12);
    --box: rgba(26,26,26,0.45);
  }
  body[data-dark] {
    --bg: #0F1A15;
    --surface: #172219;
    --ink: #F0EDE6;
    --accent: #3E9C74;
    --accent-600: #4FAF85;
    --accent-700: #7FD0AC;
    --accent-100: rgba(62,156,116,0.14);
    --clay: #E06B43;
    --clay-deep: #F09068;
    --clay-100: rgba(224,107,67,0.15);
    --on-clay: #14120F;
    --scrim: rgba(0,0,0,0.55);
    --divider: rgba(240,237,230,0.34);
    --rule: rgba(240,237,230,0.18);
    --muted: rgba(240,237,230,0.60);
    --muted-soft: rgba(240,237,230,0.50);
    --track: rgba(240,237,230,0.14);
    --box: rgba(240,237,230,0.45);
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; line-height: 1.55;
    overflow: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: transparent; border: 0; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hd { font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 900; text-transform: uppercase; }
  .mono { font-family: 'Space Mono', ui-monospace, Menlo, monospace; }
  .eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
  }

  @keyframes pop { 0% { transform: scale(.6) } 60% { transform: scale(1.12) } 100% { transform: scale(1) } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes spin { to { transform: rotate(360deg) } }
  /* Screens travel in the direction you navigated, so the tab bar and the
     content agree about which way you just moved. House ease throughout. */
  @keyframes slideFromRight { from { opacity: 0; transform: translateX(24px) } to { opacity: 1; transform: none } }
  @keyframes slideFromLeft  { from { opacity: 0; transform: translateX(-24px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ── Shell ── */
  .app {
    height: 100%; max-width: 520px; margin: 0 auto;
    display: none; flex-direction: column; position: relative; overflow: hidden;
    background: var(--bg);
  }
  .app.on { display: flex; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { width: 0; }

  .loading, .errscreen {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center; transition: opacity .4s ease;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .errmark { font-size: 15px; letter-spacing: .22em; color: var(--accent); margin-bottom: 22px; }
  .errhint { margin-top: 22px; font-size: 11px; line-height: 1.6; color: var(--muted-soft); }
  .errhint code { font-family: 'Space Mono', monospace; font-size: 10px; }
  .spinner { width: 38px; height: 38px; border: 3px solid var(--track); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .errscreen { display: none; z-index: 9998; }
  .errscreen.on { display: flex; }
  .errscreen h2 { font-size: 30px; line-height: 1; letter-spacing: -.02em; margin-bottom: 12px; }
  .errscreen p { font-size: 14px; color: var(--muted); white-space: pre-line; }

  /* ── Header ── */
  .apphd {
    padding: calc(20px + env(safe-area-inset-top)) 20px 12px;
    border-bottom: 2px solid var(--divider);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    background: var(--bg);
  }
  .apphd .title { font-size: 24px; line-height: 1; letter-spacing: -.02em; margin-top: 4px; }
  /* One line, always. The header's right side now carries a value AND a button,
     so an eyebrow long enough to wrap would push the title down and shift the
     whole screen under the athlete's thumb. */
  .apphd .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .apphd .right { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--clay-deep); white-space: nowrap; }
  /* The contextual value and the way into Settings share the header's right
     side, so the value never has the whole edge to itself and never collides
     with the button. */
  .hdright { display: flex; align-items: center; gap: 10px; flex: none; }
  .hdme {
    flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: var(--bg); border: 0;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: .02em;
  }
  .hdme.closing { background: none; color: var(--ink); border: 2px solid var(--divider); font-size: 15px; }

  /* ── Blocks & rules ── */
  .block { padding: 20px; border-bottom: 2px solid var(--divider); }
  .row-rule { border-bottom: 1px solid var(--rule); }

  .bar { height: 10px; background: var(--track); }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .35s cubic-bezier(.2,.8,.2,1); }
  .bar.thin { height: 8px; }

  .figure { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; color: var(--accent); letter-spacing: -.04em; }

  /* ── Habit rows ── */
  .hrow { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); }
  .hrow.done { background: var(--accent-100); }
  /* 2px, the app's structural rule weight, not the 1px used between rows. The
     row has three tap targets and the seam is the only thing that says so —
     at 1px it read as the same hairline that separates one habit from the next,
     so the row looked like one big button that happened to do three things. */
  .hrow .checkcell {
    flex: none; width: 64px; border-right: 2px solid var(--divider);
    display: flex; align-items: center; justify-content: center;
  }
  .boxmark { width: 28px; height: 28px; border: 2px solid var(--box); display: block; transition: border-color .18s ease, background-color .18s ease; }
  .boxmark.on {
    border-color: var(--accent); background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    animation: pop .28s ease;
  }
  /* The tick DRAWS rather than appearing — 300ms of stroke is the difference
     between "the state changed" and "you just did that". Scoped to .tick on
     purpose: the same cell also holds the lock glyph on a locked habit, and
     these rules would otherwise dash and redraw its shackle. */
  /* The stroke rules are GLOBAL, because the tick is reused outside a checkbox
     (a cleared quest, for one) and a path with no fill rule renders as a solid
     blob rather than a drawn line. Only the size and the draw animation belong
     to the habit checkbox. */
  svg.tick { display: block; width: 100%; height: 100%; }
  svg.tick path {
    fill: none; stroke: currentColor; stroke-width: 3.4;
    stroke-linecap: square; stroke-linejoin: miter;
  }
  .boxmark svg.tick { width: 20px; height: 20px; }
  .boxmark svg.tick path {
    stroke-dasharray: 24; stroke-dashoffset: 24;
    animation: drawTick .3s cubic-bezier(.5,0,.3,1) .04s forwards;
  }
  @keyframes drawTick { to { stroke-dashoffset: 0 } }
  .hrow .body {
    flex: 1; min-width: 0; text-align: left; padding: 13px 12px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .hrow .body .line1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hrow .body .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
  .hrow .body .stk { font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--muted-soft); }
  /* The status line now carries two things — what you have done, and the streak
     that describes it — so it is a flex row rather than a bare string. `gap` is
     large enough to read as two separate facts; the ember dot supplies the only
     other separator, which is why there is no middot. */
  .hrow .body .status { font-size: 11px; line-height: 1; color: var(--muted); display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .hrow .body .status .ember {
    font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    color: var(--clay-deep);
  }
  .hrow .body .status .ember .u { font-size: 9px; opacity: .8; letter-spacing: .02em; }
  /* The best streak on the screen gets a filled pill. One of them, never eight —
     the same reasoning that keeps a single ember animating. */
  .hrow .body .status .ember.lead {
    background: var(--clay); color: var(--on-clay); padding: 2px 6px 2px 5px; margin-left: 3px;
  }
  .hrow .body .status .ember.lead::before { background: var(--on-clay); }
  .hrow .body .status .ember.lead .u { opacity: .9; }
  .hrow .body .track { display: block; width: 100%; height: 4px; background: var(--track); margin-top: 2px; }
  .hrow .body .track > span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
  .hrow + .rowhint { padding: 10px 20px 14px; font-size: 11px; line-height: 1.5; color: var(--muted-soft); border-bottom: 2px solid var(--divider); }
  .rowhint strong { color: var(--muted); font-weight: 600; }
  .statnote { padding: 12px 20px 14px; font-size: 11.5px; line-height: 1.55; color: var(--muted); border-bottom: 2px solid var(--divider); }
  .statnote strong { color: var(--ink); font-weight: 600; }
  /* No border-left. It only existed on rows that HAVE a plus, so the vertical
     rule appeared on the counter habits and vanished on the check-off ones,
     making the right edge of the list look broken halfway down. */
  .hrow .pluscell {
    flex: none; width: 54px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; color: var(--accent);
  }
  .hrow .pluscell:hover { background: var(--accent-100); }
  /* A locked habit is owned by another system — it reads as unavailable rather
     than merely unticked, so nobody taps it expecting a tick. */
  .hrow.locked .checkcell { cursor: default; }
  .boxmark.lock {
    border-style: dashed; border-color: var(--muted-soft); color: var(--muted-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .boxmark.lock svg { width: 15px; height: 15px; }
  .hrow.locked .nm, .hrow.locked .status { color: var(--muted); }

  /* ── Coach card ── */
  .coachcard {
    background: var(--clay); color: var(--on-clay); padding: 20px;
    border-bottom: 2px solid var(--divider);
    display: flex; flex-direction: column; gap: 12px; animation: riseIn .3s ease;
  }
  .coachcard .eyebrow { color: var(--on-clay); opacity: .8; }
  /* The nudge changes copy as the day goes, and the lines are not all the same
     length. Without a floor the card resizes on a tick and shoves the habit list
     under the athlete's finger — a smaller version of the scroll bug the renderer
     was rewritten to kill. Four lines holds almost every nudge in the library. */
  .coachcard .say { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 21px; line-height: 1.08; letter-spacing: -.01em; text-transform: uppercase; text-wrap: pretty; min-height: 3.3em; }

  /* The level hero. The XP bar is a RING around the level number — the number
     and how far through it you are read as one object.
     ONE geometry, two sizes: `.lvring` is the 86px hero button on Today,
     `.hring` the 46px disc on every habit row on Progress. Both are r=15.5 in
     a 36 viewBox (C≈97.4), so the arc is the same arithmetic and a level is
     drawn the same way wherever it appears. That is the whole point of the
     smaller one (Amir, 2026-07-30): a habit's level used to be a filled square
     with an XP bar under the row — two shapes for one fact, and neither of them
     the shape Today uses for exactly the same fact. */
  .hero-lv { display: flex; flex-direction: column; gap: 12px; }
  .lvring, .hring { position: relative; flex: none; }
  .lvring { width: 86px; height: 86px; padding: 0; border: 0; background: none; cursor: pointer; }
  .hring { display: block; width: 46px; height: 46px; }
  .lvring svg, .hring svg { position: absolute; inset: 0; width: 100%; height: 100%;
                transform: rotate(-90deg); display: block; }
  .lvring circle, .hring circle { fill: none; stroke-width: 3.4; }
  .lvring .rail, .hring .rail { stroke: var(--track); }
  .lvring .run, .hring .run { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 97.4;
                 transition: stroke-dashoffset .35s cubic-bezier(.2,.8,.2,1); }
  .lvring .in, .hring .in { position: absolute; inset: 0; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 2px; }
  .lvring .lbl { font-size: 8px; font-weight: 700; letter-spacing: .14em; color: var(--muted-soft); }
  /* The number, and nothing else. The hero has room to caption itself LEVEL;
     a 46px disc in a list does not, and the row it sits in is the caption. */
  .hring .figure { font-size: 19px; line-height: 1; }
  .hring.wide .figure { font-size: 15px; }

  /* Four season facts, equal weight. The old two-up made the day streak the
     biggest number on the tab, so a rebuilding athlete opened Progress to a
     giant zero. */
  .statgrid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    border-bottom: 2px solid var(--divider);
  }
  .statgrid > div {
    padding: 13px 20px; display: flex; flex-direction: column; gap: 3px;
    border-bottom: 1px solid var(--rule);
  }
  .statgrid > div:nth-child(odd) { border-right: 1px solid var(--rule); }
  .statgrid > div:nth-last-child(-n+2) { border-bottom: 0; }
  .statgrid .figure, .statgrid .statfrac { font-size: 27px; line-height: .95; letter-spacing: -.02em; }
  .statgrid .statfrac { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; color: var(--accent); }
  .statgrid .statfrac .of { font-size: 15px; color: var(--muted-soft); }
  .statgrid .eyebrow { letter-spacing: .1em; }

  /* The pips had no legend anywhere in the app and are empty for the first
     five days, so they read as decoration. Said once, above the list. */
  .pipkey {
    display: flex; align-items: center; gap: 9px; padding: 0 20px 12px;
    font-size: 11px; line-height: 1.4; color: var(--muted-soft);
  }
  .pipkey .pips { flex: none; }

  /* A figure with its unit set inside it, rather than welded on at full size. */
  .statnum { font-size: 26px; line-height: 1; letter-spacing: -.02em; }
  .statnum .su { font-size: 13px; color: var(--muted-soft); margin-left: 2px; letter-spacing: 0; }

  /* Today's cell in the 35-day grid, and the key that says which end is which. */
  .grid35 .c.now { outline: 2px solid var(--clay-deep); outline-offset: 1px; }
  .gridkey {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-soft);
  }
  .gridkey .gk { display: flex; align-items: center; gap: 5px; }
  .gridkey .gk .c {
    width: 9px; height: 9px; display: inline-block; flex: none;
    border: 1px solid var(--rule); background: none; margin-left: 4px;
  }
  .gridkey .gk .c:first-child { margin-left: 0; }
  .gridkey .gk .c.hit { background: var(--accent); border-color: var(--accent); }
  .gridkey .gk .c.part { background: var(--accent-100); border-color: var(--accent); }
  .gridkey .gk .c.pre { border-style: dotted; opacity: .5; }

  /* ── The manual ──────────────────────────────────────────────────────────
     A dozen sections of prose. Without a way in it is a wall you scroll past
     rather than a reference you use. */
  .manh2 { font-size: 22px; line-height: 1; margin-bottom: 10px; scroll-margin-top: 8px; }
  .manp { font-size: 14px; line-height: 1.62; color: var(--ink); margin-bottom: 12px; }
  .mancontents { border-bottom: 2px solid var(--divider); }
  .manlinks { display: flex; flex-wrap: wrap; gap: 6px; }
  .manlink {
    border: 1px solid var(--divider); background: none; color: var(--ink);
    padding: 7px 10px; text-align: left;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 12px; letter-spacing: .03em; text-transform: uppercase; line-height: 1;
  }
  .manlink:hover { border-color: var(--accent); color: var(--accent); }

  /* Board chrome, compressed. */
  .boardbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 20px; border-bottom: 2px solid var(--divider);
  }
  .boardbar.sub { padding: 11px 20px; border-bottom-width: 1px; border-color: var(--rule); }
  .boardbar .chips { flex: 1; min-width: 0; }
  .boardbar .chip { flex: 1; text-align: center; }
  .boardday { flex: none; font-size: 10px; letter-spacing: .08em; color: var(--clay-deep); font-weight: 700; }
  .boardnote { padding: 10px 20px 12px; font-size: 11.5px; line-height: 1.45; color: var(--muted-soft); }

  /* At-risk used to be said three ways at once: a clay card, a clay day-bar and
     a header flag. Now the day bar is gone it gets one unmissable strip, sitting
     directly above the list of things that would fix it. */
  .riskbar {
    background: var(--clay-deep); color: var(--on-clay); padding: 9px 20px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 13px; letter-spacing: .05em; text-transform: uppercase;
  }
  .coachcard .cta {
    align-self: flex-start; background: var(--on-clay); color: var(--clay); padding: 10px 14px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: flex-start; gap: 6px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px;
    letter-spacing: .04em; text-transform: uppercase; line-height: 1.2;
    padding: 14px 16px; border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: var(--accent-600); }
  .btn-primary:active { background: var(--accent-700); }
  .btn-secondary { border-color: var(--divider); }
  .btn-secondary:hover { background: rgba(128,128,128,.10); }
  .btn-block { width: 100%; }

  .input {
    width: 100%; min-height: 42px; padding: 8px 10px; font-size: 14px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--divider); caret-color: var(--accent);
  }
  .input:focus-visible { border-color: var(--accent); outline-offset: 0; }

  /* ── Toggle (square, 44×24) ── */
  /* Off recedes. It used to be drawn in --ink for both border and knob, which
     made it heavier than any type beside it — so Settings drew the eye
     straight to whichever switches were turned OFF. */
  .sw { width: 44px; height: 24px; flex: none; border: 2px solid var(--muted-soft); display: flex; align-items: center; padding: 2px; }
  .sw > i { width: 16px; height: 16px; display: block; background: var(--muted-soft); }
  .sw.on { background: var(--accent); justify-content: flex-end; border-color: var(--accent); }
  .sw.on > i { background: var(--bg); }
  /* Armed, waiting for the second tap that actually turns an add-on on —
     see the comment above the Add-ons toggle handler. */
  .sw.confirm { border-color: var(--clay-deep); }
  .sw.confirm > i { background: var(--clay-deep); }

  /* ── Select rows (goals, coach volume, motivation) ── */
  /* 20px, like every other list row in the app. At 14px these rows sat six
     pixels inside their own section headings, so Settings had no single left
     edge — the cheapest possible reason for a screen to feel subtly wrong.
     The border is 1px rule here rather than 2px divider because every instance
     was already overriding it inline to exactly that. */
  .selrow {
    width: 100%; text-align: left; padding: 15px 20px;
    border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .selrow.on { background: var(--accent); color: var(--bg); }
  .sectlbl { padding: 18px 20px 8px; letter-spacing: .12em; display: flex; justify-content: space-between; gap: 12px; }
  /* A tier group's own header, doubling as its collapse toggle. Closed by
     default — see the comment at msTierHeader() — so the chevron points
     down at rest and turns to point up once opened. */
  .msth { width: 100%; text-align: left; cursor: pointer; }
  .msth .msth-r { display: flex; align-items: center; gap: 8px; }
  .msth .chev { flex: none; width: 9px; height: 9px; stroke: currentColor; stroke-width: 2.4;
                fill: none; stroke-linecap: round; stroke-linejoin: round;
                transition: transform .2s cubic-bezier(.2,.8,.2,1); }
  .msth.open .chev { transform: rotate(180deg); }
  .selrow .lbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; line-height: 1.15; text-transform: uppercase; }
  .selrow .desc { font-size: 12px; line-height: 1.35; opacity: .75; margin-top: 5px; }
  .selrow .mark { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em; }

  /* ── Tab bar ── */
  /* The active-tab block used to be a background on the button, so it teleported.
     It is now one slab that SLIDES between cells, with the labels inverting under
     it — same modernist look, but the bar shows you where you went. */
  /* minmax(0,1fr) — NOT plain 1fr. `1fr` is minmax(auto,1fr), so the longest
     label forced its own column wider than the rest: the cells were 91/91/91/116
     at 390px and the whole bar overflowed the viewport at 320px. Equal columns
     are also what lets the sliding slab line up with a cell at all. */
  /* Column count comes from the tab count, set inline — it was hard-coded to
     four, so dropping Settings left a phantom fourth column and the sliding
     indicator, sized as a fraction of the bar, landed off the last tab. */
  .tabs {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
    border-top: 2px solid var(--divider); background: var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
    position: relative;
  }
  .tabslab {
    position: absolute; top: 0; bottom: env(safe-area-inset-bottom); left: 0;
    background: var(--ink); z-index: 0;
    transition: transform .32s cubic-bezier(.16,1,.3,1);
  }
  .tabs button {
    padding: 12px 8px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start;
    border-right: 1px solid var(--rule); position: relative; z-index: 1;
    transition: color .2s ease; overflow: hidden;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button.on { color: var(--bg); }
  .tabs .num { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: .06em; opacity: .6; }
  .tabs .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }

  /* ── Grid (35-day history) ── */
  /* Thirty-five squares appearing at once reads as a static block; cascading them
     reads as five weeks of data arriving. */
  @keyframes cellIn { from { opacity: 0; transform: scale(.7) } to { opacity: 1; transform: none } }
  .grid35 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .grid35 .c {
    aspect-ratio: 1; border: 1px solid rgba(128,128,128,.35);
    animation: cellIn .28s cubic-bezier(.16,1,.3,1) both;
  }
  .grid35 .c.hit { background: var(--accent); border-color: var(--accent); }
  .grid35 .c.part { background: var(--accent-100); border-color: var(--accent); }
  .grid35 .c.future { opacity: .25; }
  /* Before you started. Not a miss — a miss is a day you had and did not use,
     and a new athlete was being shown five weeks of them. */
  .grid35 .c.pre { border-style: dotted; opacity: .4; }

  /* ── Sheet & toast ── */
  .scrim { position: absolute; inset: 0; z-index: 80; background: var(--scrim); animation: fadeIn .2s ease; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 90;
    background: var(--bg); border-top: 2px solid var(--ink);
    padding: 20px 20px calc(28px + env(safe-area-inset-bottom));
    animation: sheetUp .3s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; gap: 16px;
  }
  .stepper { display: flex; align-items: center; border: 2px solid var(--ink); }
  .stepper button { width: 58px; height: 64px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px; }
  .stepper .minus { border-right: 2px solid var(--ink); }
  .stepper .plus { border-left: 2px solid var(--ink); }
  .stepper .val { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .toast {
    position: absolute; left: 20px; right: 20px; bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 70;
    background: var(--ink); color: var(--bg); padding: 13px 15px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; line-height: 1.25;
    text-transform: uppercase; animation: riseIn .25s ease;
  }

  .demo-banner { background: var(--clay); color: var(--on-clay); padding: 8px 20px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; text-align: center; }

  /* ── The tour ───────────────────────────────────────────────────────────
     A game's first-run tutorial: a clay box drawn around the thing being
     named, a message card beside it, everything else dimmed.

     FOUR mask panes rather than one lid with a transparent window, because a
     step marked `act` has to be completable by ACTUALLY DOING THE THING — and
     a transparent lid still swallows the tap. The panes leave a real hole; a
     step you only read gets `.tourblock` dropped into that hole to seal it.

     It lives OUTSIDE #app on purpose. render() morphs #app's children against
     the template, so anything in there that the template does not know about
     is deleted on the next tick. This layer is painted imperatively by
     paintTour() and the renderer never sees it.

     z-index sits above #fx (120) and below the celebration takeover (200) —
     a level earned mid-tour still gets its moment, and paintTour() stands the
     whole layer down while one is on screen. */
  /* `pointer-events: none` ON THE LAYER, auto on its children. The layer is a
     full-viewport fixed div, and hit-testing does not care that it is
     transparent — without this it swallows every tap in the app, so the hole
     cut by the four mask panes is a hole you can see through and not one you
     can reach through, and no `act` step could ever be completed. */
  .tourlay { position: fixed; inset: 0; z-index: 150; display: none; pointer-events: none; }
  .tourlay.on { display: block; }
  .tourmask, .tourblock { position: fixed; pointer-events: auto; }
  /* No animation by default. The panes are rebuilt once per step, so a fade on
     the pane itself re-flashes the whole dimmer at every step — it is already
     dark, and only the FIRST appearance is a transition worth showing. */
  .tourmask { background: var(--scrim); }
  .tourlay.opening .tourmask { animation: fadeIn .2s ease; }
  .tourring {
    position: fixed; pointer-events: none; border: 3px solid var(--clay);
    animation: tourPulse 1.7s ease-in-out infinite;
  }
  /* Clay only — the house has no second accent. On dark, --clay is already the
     lighter #E06B43, so the ring reads on both grounds without a second rule. */
  @keyframes tourPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(199,85,47,.55); }
    50%      { box-shadow: 0 0 0 8px rgba(199,85,47,0); }
  }
  .tourcard {
    position: fixed; pointer-events: auto;
    background: var(--bg); border: 2px solid var(--ink);
    padding: 15px 16px 13px; display: flex; flex-direction: column; gap: 9px;
    animation: riseIn .22s ease;
    /* BOUNDED, so the ring always has somewhere to be. On a 320×568 phone an
       unbounded card is well over half the viewport and there is no placement
       that does not cover the thing being pointed at. The prose scrolls; the
       title, the buttons and Skip never move. */
    max-height: 56vh;
  }
  .tourcard .tourbody { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 9px; }
  .tourcard .tourbody::-webkit-scrollbar { width: 0; }
  .tourcard .tourtop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .tourcard .tourn { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--clay-deep); flex: none; }
  .tourcard h4 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: 20px; line-height: 1.02; letter-spacing: -.01em; min-width: 0;
  }
  .tourcard p { font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .tourcard p strong { color: var(--ink); font-weight: 600; }
  .tourcard .tournav { display: flex; gap: 8px; align-items: stretch; margin-top: 2px; }
  .tourcard .tournav .btn { flex: 1; justify-content: center; padding: 12px 14px; }
  .tourcard .tournav .tourback {
    flex: none; width: 46px; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px;
    border: 1px solid var(--divider); color: var(--muted);
  }
  .tourskip {
    align-self: flex-start; font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted-soft); padding: 4px 0 0;
  }
  /* The pointing finger: a plain clay triangle off the card's edge, aimed at
     the ring. No radius, no shadow, no icon set. */
  .tourcard .tourtip { position: absolute; width: 0; height: 0; }
  .tourcard .tourtip.up   { top: -9px;    border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 9px solid var(--ink); }
  .tourcard .tourtip.down { bottom: -9px; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 9px solid var(--ink); }

  /* ── The XP flight ──────────────────────────────────────────────────────
     Points you just earned leave the habit that earned them and land in the
     level that owns them. Two nested elements so the path is an ARC, not a
     straight line: the outer carries X on an ease-out, the inner carries Y on
     an ease-in with a small hop first. `#fx` is a `data-static` island, so the
     renderer leaves whatever is mid-flight alone. */
  #fx { position: absolute; inset: 0; z-index: 120; pointer-events: none; overflow: hidden; }
  .xpfly {
    position: absolute; will-change: transform;
    transform: translate(-50%, -50%);
    animation: xpFlyX .74s cubic-bezier(.35,.75,.25,1) both;
  }
  .xpfly > i {
    display: block; white-space: nowrap;
    background: var(--clay); color: var(--on-clay); padding: 4px 8px;
    font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    animation: xpFlyY .74s cubic-bezier(.6,.04,.75,.6) both;
  }
  @keyframes xpFlyX { to { transform: translate(calc(-50% + var(--dx)), -50%) } }
  @keyframes xpFlyY {
    0%   { transform: translateY(0) scale(.7); opacity: 0 }
    16%  { transform: translateY(-15px) scale(1.06); opacity: 1 }
    78%  { opacity: 1 }
    100% { transform: translateY(var(--dy)) scale(.55); opacity: 0 }
  }

  /* ── Level-up takeover ──────────────────────────────────────────────────
     The game moment. Square badge and hard edges keep it inside the modernist
     system — the drama comes from the ray burst, the scale-punch and the
     shards, not from rounded corners or glows. */
  @keyframes lvScrim  { from { opacity: 0 } to { opacity: 1 } }
  @keyframes lvRays   { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  @keyframes lvRaysIn { from { opacity: 0; transform: scale(.3) } to { opacity: .55; transform: scale(1) } }
  @keyframes lvBadge  {
    0%   { transform: scale(0) rotate(-25deg); opacity: 0 }
    55%  { transform: scale(1.25) rotate(6deg); opacity: 1 }
    75%  { transform: scale(.94) rotate(-2deg) }
    100% { transform: scale(1) rotate(0deg); opacity: 1 }
  }
  @keyframes lvShock  { 0% { transform: scale(.2); opacity: .9 } 100% { transform: scale(2.6); opacity: 0 } }
  @keyframes lvUp     { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
  @keyframes lvShard  { 0% { transform: translate(0,0) scale(1); opacity: 1 } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0 } }
  @keyframes lvFill   { from { width: 0 } to { width: var(--w) } }

  /* Two opaque variants so the moment never fights the screen behind it:
     a routine level lands on near-black with clay rays; a rank promotion goes
     full clay. Both are dark grounds, so all type is paper in both. */
  .lvwrap {
    position: absolute; inset: 0; z-index: 200;
    background: #14120F;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 26px; text-align: center; overflow: hidden;
    color: #FAF7F2;
    animation: lvScrim .22s ease;
  }
  /* Pinned, not tokenised. The takeover is a full-bleed moment that should
     look the same in both themes, and its type is white throughout — against
     the dark theme's lighter clay that white drops to ~3:1. */
  .lvwrap.rank { background: #C7552F; }
  .lvstage { position: relative; display: flex; align-items: center; justify-content: center; width: 200px; height: 200px; margin-bottom: 30px; }
  /* The burst is masked to a soft disc so it never collides with the type below. */
  .lvrays {
    position: absolute; width: 460px; height: 460px; opacity: .5;
    background: repeating-conic-gradient(var(--clay) 0deg 7deg, transparent 7deg 22deg);
    -webkit-mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.35) 42%, transparent 66%);
            mask-image: radial-gradient(circle, #000 18%, rgba(0,0,0,.35) 42%, transparent 66%);
    animation: lvRaysIn .5s ease both, lvRays 16s linear .5s infinite;
  }
  .lvwrap.rank .lvrays { background: repeating-conic-gradient(#FAF7F2 0deg 6deg, transparent 6deg 20deg); opacity: .38; }
  .lvshock { position: absolute; width: 150px; height: 150px; border: 3px solid var(--clay); animation: lvShock .7s cubic-bezier(.2,.7,.3,1) .18s both; }
  .lvwrap.rank .lvshock { border-color: #FAF7F2; }
  .lvbadge {
    position: relative; width: 128px; height: 128px;
    background: #FAF7F2; color: var(--clay);
    border: 4px solid var(--clay);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    animation: lvBadge .72s cubic-bezier(.2,.8,.25,1) .1s both;
  }
  .lvwrap.rank .lvbadge { border-color: #FAF7F2; color: var(--clay); }
  .lvbadge .n { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 58px; line-height: .85; letter-spacing: -.04em; }
  .lvbadge .l { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .18em; color: rgba(26,26,26,.55); }
  .lvshards { position: absolute; inset: 0; pointer-events: none; }
  .lvshards i {
    position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; background: var(--clay);
    animation: lvShard .95s cubic-bezier(.15,.75,.3,1) .22s both;
  }
  .lvwrap.rank .lvshards i { background: #FAF7F2; }
  .lvkicker {
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .34em;
    text-transform: uppercase; color: var(--clay-2, #E06B43); animation: lvUp .4s ease .5s both;
  }
  .lvwrap.rank .lvkicker { color: rgba(250,247,242,.9); }
  .lvrank {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: 46px; line-height: .95; letter-spacing: -.02em; margin-top: 10px;
    color: #FAF7F2; animation: lvUp .45s ease .6s both;
  }
  .lvsub { font-size: 13px; color: rgba(250,247,242,.72); margin-top: 10px; animation: lvUp .45s ease .72s both; }
  .lvbar { width: 200px; height: 8px; background: rgba(250,247,242,.22); margin-top: 18px; animation: lvUp .45s ease .8s both; }
  .lvbar > span { display: block; height: 100%; background: #FAF7F2; animation: lvFill .8s cubic-bezier(.2,.8,.2,1) .95s both; }
  .lvgo {
    margin-top: 28px; background: #FAF7F2; color: #14120F; padding: 14px 26px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px;
    letter-spacing: .1em; text-transform: uppercase; animation: lvUp .45s ease .9s both;
  }
  .lvwrap.rank .lvgo { color: var(--clay); }
  /* Was pinned to the bottom of the viewport, which stranded it ~340px below
     the button under a band of empty clay and made the stack read top-heavy.
     It belongs with the button it describes: "Next" only means something if
     you can see there is a next. */
  .lvqueue { margin-top: 14px; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .16em; color: rgba(250,247,242,.6); }

  /* A third ground for the things that are NOT a level: consistency tiers,
     milestones and a perfect day. Deep green with clay-2 rays, so an athlete
     can tell what kind of win landed before they read a word of it. */
  .lvwrap.badge { background: #0B3B2B; }
  .lvwrap.badge .lvrays { background: repeating-conic-gradient(#E06B43 0deg 7deg, transparent 7deg 22deg); opacity: .42; }
  .lvwrap.badge .lvshock { border-color: #E06B43; }
  .lvwrap.badge .lvbadge { background: #FAF7F2; color: #0B3B2B; border-color: #E06B43; }
  .lvwrap.badge .lvshards i { background: #E06B43; }
  .lvwrap.badge .lvkicker { color: #E9A183; }
  .lvwrap.badge .lvgo { color: #0B3B2B; }
  /* Milestone codes are two letters, not a two-digit number — same box, smaller type. */
  .lvbadge .n.code { font-size: 44px; letter-spacing: -.02em; }

  /* Inline flash for routine habit level-ups (no takeover) */
  @keyframes lvPop { 0% { transform: scale(.4); opacity: 0 } 55% { transform: scale(1.22) } 100% { transform: scale(1); opacity: 1 } }
  .lvchip {
    background: var(--clay); color: #FAF7F2; padding: 3px 7px;
    font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .06em;
    animation: lvPop .45s cubic-bezier(.2,.8,.25,1) both;
  }
  .hlv { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--muted-soft); }
  /* The streak was the smallest type in the row and the most motivating number
     in it. It now reads as a figure with a unit rather than "9D". */
  .hlv .ember { font-size: 11px; }
  /* The ember used to sit after "LV 10" and carried a left margin for it. */
  .hlv .ember:first-child { margin-left: 0; }
  .hlv .ember .u { font-size: 8px; opacity: .75; }

  /* Cross-link back to the training programme — the other half of the pair.
     Mirrors the Daily Habits card in program.html so the two apps read as one
     product rather than two separate tools. */
  .crosslink-wrap { padding: 4px 20px 22px; }
  .crosslink {
    width: 100%; display: flex; align-items: center; gap: 13px; text-align: left;
    padding: 14px 15px; background: var(--surface); border: 1px solid var(--divider);
  }
  .crosslink:active { transform: scale(0.99); }
  .crosslink-mark {
    flex: none; width: 42px; height: 42px; background: var(--accent); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .crosslink-mark svg { width: 21px; height: 21px; }
  .crosslink-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .crosslink-title {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px;
    line-height: 1; text-transform: uppercase; letter-spacing: .02em;
  }
  .crosslink-sub { font-size: 11px; line-height: 1.3; color: var(--muted); }
  .crosslink-go {
    flex: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 19px; color: var(--clay-deep);
  }

  /* Scope chips (leaderboard: this week / all time) */
  .chips { display: flex; gap: 8px; }
  .chip {
    border: 2px solid var(--divider); padding: 8px 12px; color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .chip.chip-on { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  /* ── Roll call ───────────────────────────────────────────────────────────
     The compose box, and the wall it posts to. Flat, square, no bubbles: this
     is a noticeboard, not a chat app. */
  .notebox { display: flex; flex-direction: column; gap: 10px; }
  /* Today's pointer to the conversation. Quiet on purpose — it is a doorway,
     not a demand, and it disappears the moment the athlete has written. */
  .rcprompt {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; background: none; text-align: left;
    border-bottom: 2px solid var(--divider);
  }
  .rcprompt > span:first-child { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .rcprompt .rcq { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
                   font-size: 17px; line-height: 1.1; }

  /* Deliberately small. It exists to teach that quests are a thing, not to
     compete with a live run. */
  .questidle {
    display: flex; align-items: baseline; gap: 10px; padding: 12px 20px;
    border-bottom: 2px solid var(--divider);
    font-size: 11.5px; line-height: 1.45; color: var(--muted-soft);
  }
  .questidle .eyebrow { flex: none; letter-spacing: .12em; }
  .noteq { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
           font-size: 20px; line-height: 1.05; letter-spacing: .005em; }
  .noterow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .noterow .mono { font-size: 11px; font-weight: 700; color: var(--muted-soft); }
  .noterow .mono.tight { color: var(--clay-deep); }
  .notebox .btn[disabled] { opacity: .4; }

  .rcday { display: flex; align-items: baseline; justify-content: space-between;
           padding: 16px 20px 8px; font-family: 'Barlow Condensed', sans-serif;
           font-weight: 900; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
  .rcday .mono { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--muted-soft); }
  .rcline { padding: 12px 20px; border-bottom: 1px solid var(--rule);
            display: flex; flex-direction: column; gap: 5px;
            animation: riseIn .34s cubic-bezier(.16,1,.3,1) both; }
  .rcline.me { background: var(--accent-100); }
  .rcline.coach { border-left: 4px solid var(--clay-deep); }
  .rc-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .rc-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
             font-size: 16px; line-height: 1; }
  .rc-meta { flex: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 9px; font-weight: 700; letter-spacing: .07em; color: var(--muted-soft); }
  /* Sits with the NAME, not with the rank — a title is part of who is talking.
     Ellipsised because the name beside it is the thing that must never truncate. */
  .rc-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
              margin-left: 7px; font-size: 11px; font-weight: 900; letter-spacing: .06em;
              color: var(--clay-deep); }
  .rcline.coach .rc-meta { color: var(--clay-deep); }
  .rc-say { font-size: 14px; line-height: 1.45; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .rcline { animation: none; } }

  /* ── The backfill day strip ──────────────────────────────────────────────
     Four days, today first. Each carries its own completion so you can see at
     a glance which one you forgot — the whole reason the strip exists. */
  .daystrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
              gap: 6px; padding: 14px 20px 16px; }
  .daychip { display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
             border: 2px solid var(--divider); padding: 8px 8px 7px; background: none;
             color: var(--ink); text-align: left; min-width: 0; }
  .daychip .dl { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
                 font-size: 12px; letter-spacing: .05em; line-height: 1;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .daychip .dp { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                 font-size: 9px; font-weight: 700; color: var(--muted-soft); line-height: 1; }
  .daychip .dbar { display: block; width: 100%; height: 3px; background: var(--divider); }
  .daychip .dbar > span { display: block; height: 100%; background: var(--muted-soft); }
  .daychip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .daychip.on .dp { color: rgba(255,255,255,.7); }
  .daychip.on .dbar { background: rgba(255,255,255,.25); }
  .daychip.on .dbar > span { background: var(--bg); }
  .daychip.full .dbar > span { background: var(--accent); }
  .daychip.on.full .dbar > span { background: var(--bg); }

  /* Editing a day that is not today is a state you must never be in by
     accident, so it is announced in clay rather than implied by a highlight. */
  .backfill { display: flex; align-items: center; justify-content: space-between; gap: 12px;
              margin: 12px 20px 0; padding: 12px 14px; background: var(--clay-deep); color: var(--on-clay); }
  .backfill .eyebrow { color: var(--on-clay); opacity: .72; }
  .backfill .bf-day { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
                      font-size: 19px; line-height: 1; text-transform: capitalize; }
  .backfill button { flex: none; border: 2px solid currentColor; background: none;
                     color: var(--on-clay); padding: 7px 11px; font-family: 'Barlow Condensed', sans-serif;
                     font-weight: 900; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }

  /* ── The streak ember ────────────────────────────────────────────────────
     A streak was 9px of grey mono. It is now an object that gets hotter as the
     run gets longer — a slow breath at 5 days, a real flicker past 30 — so the
     number stops being a fact and starts being something you don't want to lose.
     Squares and opacity only; no glow, no radius. */
  @keyframes emberPulse {
    0%, 100% { opacity: .5;  transform: scale(1) }
    50%      { opacity: 1;   transform: scale(1.35) }
  }
  @keyframes emberFlicker {
    0%, 100% { opacity: 1;  transform: scale(1.25) }
    18%      { opacity: .45; transform: scale(.85) }
    34%      { opacity: 1;  transform: scale(1.4) }
    52%      { opacity: .7; transform: scale(1.05) }
    68%      { opacity: 1;  transform: scale(1.32) }
    84%      { opacity: .6; transform: scale(.95) }
  }
  /* nowrap: a chip that wraps mid-phrase splits its pill background into two
     offset boxes. The label is one unit; the line breaks before it or not at all. */
  .ember { position: relative; padding-left: 9px; margin-left: 7px; white-space: nowrap; }
  .ember::before {
    content: ''; position: absolute; left: 0; top: 50%;
    width: 5px; height: 5px; margin-top: -2.5px;
    background: var(--muted-soft);
  }
  .ember[data-lvl="1"], .ember[data-lvl="2"], .ember[data-lvl="3"] { color: var(--clay-deep); }
  .ember[data-lvl="1"]::before,
  .ember[data-lvl="2"]::before,
  .ember[data-lvl="3"]::before { background: var(--clay); }
  .ember[data-lvl="3"] { font-weight: 700; }
  /* ONLY THE LONGEST RUN MOVES. Every streak used to animate, so a consistent
     athlete opened Today to six clay dots pulsing at once — the effect was
     designed for one. `.lead` marks the best current run on the screen; the
     rest keep the colour and the weight, and hold still. */
  .ember.lead[data-lvl="1"]::before { animation: emberPulse 2.8s ease-in-out infinite; }
  .ember.lead[data-lvl="2"]::before { animation: emberPulse 1.5s ease-in-out infinite; }
  .ember.lead[data-lvl="3"]::before { animation: emberFlicker 1.9s ease-in-out infinite; }

  /* ── The streak, as a flame ───────────────────────────────────────────────
     Amir's note, verbatim: "i asked you to show their streak like habit streaks
     or complete day streaks just bolder, flashier just something to catch the
     eye." The band that was here did the opposite — it was a NEW FIELD, a whole
     strip of screen to state one integer. This is the same number, loud, and it
     costs no vertical space: it sits on the level hero on Today and inside the
     stat grid on Progress.

     Heat comes off emberLevel() — the same 0/5/15/30-day scale the habit rows
     use — so a long streak visibly burns harder than a new one. */
  @keyframes flameLick {
    0%, 100% { transform: scaleY(1)    translateY(0);     opacity: 1 }
    35%      { transform: scaleY(1.18) translateY(-1.5px); opacity: .85 }
    70%      { transform: scaleY(.92)  translateY(.5px);   opacity: 1 }
  }
  .flame { display: block; flex: none; width: 11px; height: 14px; color: var(--muted-soft); }
  .flame .f-out { fill: currentColor; }
  .flame .f-in  { fill: var(--bg); opacity: .5; }
  .lit .flame { color: var(--clay); }
  .lit[data-lvl="2"] .flame,
  .lit[data-lvl="3"] .flame { transform-origin: 50% 90%; }
  .lit[data-lvl="2"] .flame { animation: flameLick 1.5s ease-in-out infinite; }
  .lit[data-lvl="3"] .flame { animation: flameLick .85s ease-in-out infinite; }

  /* Today — on the hero, left of the rank block. */
  .dayflame {
    flex: none; display: flex; align-items: center; gap: 5px; padding: 0 12px 0 0;
    margin-right: 2px; border-right: 2px solid var(--divider); align-self: stretch;
  }
  .dayflame .flame { width: 15px; height: 19px; }
  .dayflame .n {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 30px;
    line-height: .85; letter-spacing: -.03em; color: var(--muted);
  }
  .dayflame.lit .n { color: var(--clay-deep); }
  .dayflame .u {
    font-family: 'Space Mono', monospace; font-size: 7px; line-height: 1.15;
    letter-spacing: .08em; color: var(--muted-soft);
  }

  /* Progress — inside the stat grid, so the grid keeps four facts. */
  .statgrid .flamefig { display: flex; align-items: center; gap: 6px; }
  .statgrid .flamefig .flame { width: 13px; height: 17px; }
  .statgrid .flamefig.lit { color: var(--clay-deep); }

  /* ── Milestone rows ───────────────────────────────────────────────────────
     These were a flat list at 45% opacity: nine things the athlete had mostly
     not done, greyed out, which reads as a report card rather than a shelf.
     Every row is full-strength now and carries a BAR — the question an athlete
     actually has about a milestone is "how close am I", and the old row
     answered it in 8px mono at the far right. */
  .msrow { display: flex; gap: 14px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  .msrow .code {
    flex: none; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; letter-spacing: .02em;
    border: 2px solid var(--box); color: var(--muted);
  }
  .msrow.got .code { background: var(--clay); border-color: var(--clay); color: var(--on-clay); }
  .msrow .ms-mid { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
  .msrow .ms-name {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px;
    line-height: 1; text-transform: uppercase; color: var(--muted);
  }
  .msrow.got .ms-name { color: var(--ink); }
  .msrow .ms-note { font-size: 11px; line-height: 1.3; color: var(--muted-soft); }
  .msrow .ms-bar { height: 5px; background: var(--track); }
  .msrow .ms-bar > span { display: block; height: 100%; background: var(--clay); transition: width .35s cubic-bezier(.2,.8,.2,1); }
  .msrow.got .ms-bar { display: none; }
  .msrow .ms-right { flex: none; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .msrow .ms-xp { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted-soft); }
  .msrow.got .ms-xp { color: var(--clay-deep); font-weight: 700; }
  .msrow .ms-cnt { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .08em; color: var(--muted-soft); }
  .msrow.got .ms-cnt { color: var(--clay-deep); }
  /* A FEW WEEKS rows: three goals share the note line. A goal never breaks
     mid-phrase — the line wraps between goals, at the separators. */
  .msrow .ms-note .g { font-style: normal; white-space: nowrap; }
  .msrow .ms-note .g.got { color: var(--clay-deep); }
  .msrow .ms-note .g.got::before { content: '✓ '; }
  /* The one nearest to falling. Named at the top of the section rather than
     left for the athlete to find by comparing nine bars. */
  .msnext {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    border-bottom: 1px solid var(--rule); background: var(--clay-100);
    font-size: 12px; line-height: 1.4; color: var(--muted);
  }
  .msnext strong { color: var(--ink); }

  /* ── The seven-day heat map ───────────────────────────────────────────────
     One row per habit, one column per day, oldest on the left so it reads the
     way a week does. The whole point is the SHAPE: a solid band across one row
     and a gap-toothed one under it says more about where the week went than any
     percentage. Same cell vocabulary as the 35-day grid on the habit detail —
     hit / part / pre — so an athlete only learns it once. */
  .heat { display: flex; flex-direction: column; gap: 5px; }
  .heat .hr { display: grid; grid-template-columns: 66px repeat(7, 1fr); gap: 4px; align-items: center; }
  .heat .hl {
    font-size: 10px; line-height: 1.1; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .heat .hc { height: 15px; border: 1px solid var(--rule); background: none; }
  .heat .hc.hit  { background: var(--accent); border-color: var(--accent); }
  .heat .hc.part { background: var(--accent-100); border-color: var(--accent); }
  .heat .hc.pre  { border-style: dotted; opacity: .4; }
  .heat .hc.today { outline: 2px solid var(--clay-deep); outline-offset: 1px; }
  .heat .hd-lbl {
    font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: .04em;
    text-align: center; color: var(--muted-soft); text-transform: uppercase;
  }
  .heat .hd-lbl.now { color: var(--clay-deep); font-weight: 700; }

  /* ── Seasonal events ──────────────────────────────────────────────────────
     The only card in the app with a border on all four sides. Everything else
     is a full-bleed row separated by rules, which is right for a list you scan
     — an event is not a list item, it is a thing that is ON, and it has to read
     as an object you could walk up to. */
  .evcard { margin: 14px 20px; border: 2px solid var(--divider); }
  /* `live` is the quest card only — it is the one thing here with a clock.
     An unfinished event card is neutral, because nothing is running out. */
  .evcard.live { border-color: var(--clay); }
  .evcard.done { border-color: var(--accent); background: var(--accent-100); }
  .evhd { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px 12px; }
  .evcard.live .evhd { background: var(--clay-100); }
  .evhd .evnm {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 21px;
    line-height: .95; text-transform: uppercase; letter-spacing: -.01em; color: var(--ink);
  }
  .evhd .evtag { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-top: 5px; display: block; }
  .evhd .evstate {
    flex: none; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .09em;
    text-transform: uppercase; padding: 4px 7px; white-space: nowrap;
  }
  .evcard.live .evstate { background: var(--clay); color: var(--on-clay); }
  .evcard.done .evstate { background: var(--accent); color: var(--bg); }
  .evcard.over .evstate { border: 1px solid var(--rule); color: var(--muted-soft); }
  .evblurb { padding: 0 16px 13px; font-size: 12px; line-height: 1.45; color: var(--muted); }
  .evgoal { display: flex; align-items: center; gap: 11px; padding: 9px 16px; border-top: 1px solid var(--rule); }
  .evgoal .g-tick {
    flex: none; width: 17px; height: 17px; border: 2px solid var(--box);
    display: flex; align-items: center; justify-content: center;
  }
  .evgoal.got .g-tick { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .evgoal .g-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .evgoal .g-lbl { font-size: 12.5px; line-height: 1.2; color: var(--ink); }
  .evgoal.got .g-lbl { color: var(--muted); text-decoration: line-through; }
  .evgoal .g-bar { height: 4px; background: var(--track); }
  .evgoal .g-bar > span { display: block; height: 100%; background: var(--clay); transition: width .35s cubic-bezier(.2,.8,.2,1); }
  .evgoal.got .g-bar > span { background: var(--accent); }
  .evgoal .g-cnt { flex: none; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted-soft); white-space: nowrap; }
  .evfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 16px; border-top: 2px solid var(--divider);
    font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .evgoal .g-cnt.stack { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .evgoal .g-cnt .g-xp { color: var(--muted-soft); }
  .evgoal .g-cnt .g-xp.got { color: var(--clay-deep); font-weight: 700; }
  /* A quest carries a name AND a description; an event goal is one line. Two
     rows rather than one wrapped one, so the bar never sits under a hanging
     word. */
  .evgoal .g-sub { font-size: 10.5px; line-height: 1.25; color: var(--muted-soft); }
  .evgoal.got .g-sub { text-decoration: none; }
  .evfoot strong { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; letter-spacing: .02em; color: var(--clay-deep); }
  .evcard.done .evfoot strong { color: var(--accent); }

  /* The app noticing you have stalled. Breathes the box of the most valuable
     habit still undone, ~20s after you last touched anything. */
  @keyframes idleBreathe {
    0%, 100% { transform: scale(1);    border-color: var(--box) }
    50%      { transform: scale(1.14); border-color: var(--clay) }
  }
  .boxmark.nudge { animation: idleBreathe 2.6s ease-in-out infinite; }

  /* A day that is about to break a real streak. The coach's card goes darker,
     and the day bar stops being green about it. */
  .coachcard.risk { background: var(--clay-deep); }
  .coachcard.risk .cta { color: var(--clay-deep); }
  .bar.risk > span { background: var(--clay); }
  /* The nudge types itself on first paint — it is the coach talking, not a label. */
  /* Zero-width on purpose: the caret is drawn by a positioned ::before so it
     takes no space in the line, and the text never reflows as it types. */
  .caret { display: inline-block; width: 0; height: .92em; vertical-align: -.1em; position: relative; }
  .caret::before {
    content: ''; position: absolute; left: 1px; top: 0; width: .46em; height: 100%;
    background: #FAF7F2; animation: caretBlink .7s steps(1) infinite;
  }
  @keyframes caretBlink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }

  /* Leaderboard rows arrive in order, each with its share of the leader's score. */
  .brow { animation: riseIn .34s cubic-bezier(.16,1,.3,1) both; }
  /* Movement, not just standing. Green for climbing, muted for slipping — a drop
     is information, not a punishment, so it never gets the accent. */
  .delta { font-size: 9px; font-weight: 700; letter-spacing: .04em; line-height: 1; }
  .delta.up { color: var(--accent); }
  .delta.down { color: var(--muted-soft); }
  .passline {
    background: var(--accent); color: var(--bg); padding: 11px 20px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px;
    line-height: 1.2; text-transform: uppercase; letter-spacing: .01em;
    animation: riseIn .3s cubic-bezier(.16,1,.3,1);
  }

  /* ── Rank insignia ── */
  .rankart { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* The rank label on a level hero is a door to the ladder, so it looks like one. */
  .ranklink { display: flex; align-items: center; gap: 8px; text-align: left; color: inherit; }
  .ranklink .go { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: var(--clay-deep); }
  /* One row per rank on the ladder screen. */
  .rankrow { display: flex; gap: 14px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  .rankrow .badge {
    width: 46px; height: 46px; flex: none; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--rule); color: var(--muted-soft);
  }
  .rankrow.passed .badge { border-color: var(--accent); color: var(--accent); }
  .rankrow.here { background: var(--accent); color: var(--bg); }
  .rankrow.here .badge { border-color: var(--bg); color: var(--bg); }
  .rankrow.locked { opacity: .5; }
  .rankrow .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px; line-height: 1; text-transform: uppercase; }
  .rankrow .meta { font-size: 11px; line-height: 1.3; color: var(--muted); }
  .rankrow.here .meta { color: rgba(250,247,242,.8); }
  .rankrow .tag { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: .1em; white-space: nowrap; }
  /* Five sub-level ticks per rank. */
  .subs { display: flex; gap: 3px; }
  .subs i { width: 8px; height: 8px; border: 1.5px solid var(--box); display: block; }
  .subs i.on { background: var(--accent); border-color: var(--accent); }
  .rankrow.here .subs i { border-color: rgba(250,247,242,.7); }
  .rankrow.here .subs i.on { background: var(--bg); border-color: var(--bg); }

  /* ── The long game — the reward track ──────────────────────────────────
     Deliberately built from .rankrow's vocabulary rather than a new one: it
     is the same idea (a ladder you climb) and the app already has one look
     for that. What differs is state — owned, equipped, locked — so only
     those get new rules. */
  .prow { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left;
          padding: 13px 20px; border-bottom: 1px solid var(--rule); color: inherit; background: none; }
  .prow .lvl {
    width: 44px; height: 44px; flex: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px;
    border: 2px solid var(--rule); color: var(--muted-soft);
  }
  .prow .lvl b { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px; line-height: 1; }
  .prow .lvl i { font-family: 'Space Mono', monospace; font-style: normal; font-size: 7px; letter-spacing: .08em; }
  .prow.owned .lvl { border-color: var(--accent); color: var(--accent); }
  .prow.on { background: var(--accent); color: var(--bg); }
  .prow.on .lvl { border-color: var(--bg); color: var(--bg); }
  .prow.locked { opacity: .48; }
  .prow .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px; line-height: 1; text-transform: uppercase; }
  .prow .meta { font-size: 11px; line-height: 1.35; color: var(--muted); }
  .prow.on .meta { color: rgba(250,247,242,.82); }
  .prow .tag { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: .1em; white-space: nowrap; color: var(--clay-deep); }
  .prow.on .tag { color: var(--bg); }
  /* A 34px sample of the card treatment, so a name like NIGHTFALL means
     something before you have ever exported one. */
  .swatch { width: 34px; height: 34px; flex: none; border: 1px solid var(--rule); }
  /* The title, wherever it is shown: small, clay, mono. It is a caption on a
     person, not a heading. */
  .ttl { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .12em;
         text-transform: uppercase; color: var(--clay-deep); }

  /* Consistency pip ladder */
  .pips { display: flex; gap: 4px; }
  .pips i { width: 13px; height: 13px; border: 1.5px solid var(--box); display: block; }
  .pips i.on { background: var(--accent); border-color: var(--accent); }

  /* ═══ MEADOW skin ══════════════════════════════════════════════════════
     Cosy-game re-skin, appended as an override layer. `#app`-scoped selectors
     carry an ID, so they outrank every class rule above without !important.
     System: lilac paper, white cards with soft drop shadows, grape #6C5CE7 as
     the one reward/action colour, one colour per habit (set as --hcol/--hbg
     inline by habitRow), flame orange for streaks, teal for XP. */
  :root {
    --bg: #F6F4FF;
    --surface: #EFECFB;
    --card: #FFFFFF;
    --ink: #231F35;
    --accent: #6C5CE7;
    --accent-600: #5A4BD4;
    --accent-700: #4B3FBF;
    --accent-100: rgba(108,92,231,0.10);
    --clay: #E2643A;
    --clay-deep: #C74E28;
    --clay-100: rgba(226,100,58,0.10);
    --on-clay: #FFF6F1;
    --teal: #35D0BA;
    --teal-deep: #1FA791;
    --scrim: rgba(35,31,53,0.45);
    --divider: rgba(35,31,53,0.10);
    --rule: rgba(35,31,53,0.08);
    --muted: rgba(35,31,53,0.62);
    --muted-soft: rgba(35,31,53,0.42);
    --track: rgba(35,31,53,0.08);
    --box: #CFC9E8;
    --shadow: 0 8px 18px -14px rgba(35,31,53,0.45);
  }
  body[data-dark] {
    --bg: #17142B;
    --surface: #221D40;
    --card: #282250;
    --ink: #F1EFFB;
    --accent: #8F7BF0;
    --accent-600: #7D68EC;
    --accent-700: #6C5CE7;
    --accent-100: rgba(143,123,240,0.16);
    --clay: #FF8A5B;
    --clay-deep: #FFA37E;
    --clay-100: rgba(255,138,91,0.14);
    --on-clay: #1D130D;
    --scrim: rgba(0,0,0,0.55);
    --divider: rgba(241,239,251,0.10);
    --rule: rgba(241,239,251,0.08);
    --muted: rgba(241,239,251,0.62);
    --muted-soft: rgba(241,239,251,0.42);
    --track: rgba(241,239,251,0.10);
    --box: rgba(241,239,251,0.28);
    --shadow: 0 10px 22px -16px rgba(0,0,0,0.7);
  }
  body, #app, #app *, .tourlay, .tourlay *, .loading, .loading *, .errscreen, .errscreen * {
    font-family: 'Outfit', system-ui, sans-serif;
  }
  #app .hd { font-weight: 800; text-transform: none; letter-spacing: -0.01em; }
  #app .mono { font-family: 'Outfit', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.02em; }
  #app .eyebrow { font-weight: 700; letter-spacing: 0.09em; font-size: 10px; }
  #app .figure, #app .statfrac { font-weight: 800; letter-spacing: -0.02em; }
  :focus-visible { outline-color: var(--accent); border-radius: 6px; }
  .spinner { border-radius: 999px; }

  /* Header */
  #app .apphd { border-bottom: 0; padding-bottom: 8px; }
  #app .apphd .title { font-weight: 700; letter-spacing: -0.01em; }
  #app .apphd .right { color: var(--muted-soft); font-weight: 700; letter-spacing: 0.04em; }
  #app .hdme { border-radius: 999px; color: #fff; box-shadow: 0 3px 0 var(--accent-700); }
  #app .hdme.closing { border-radius: 999px; border: 2px solid var(--box); background: var(--card); box-shadow: var(--shadow); }
  #app .block { border-bottom: 1px solid var(--rule); }

  /* Bars & tracks */
  #app .bar, #app .bar > span, #app .hrow .body .track, #app .hrow .body .track > span,
  #app .daychip .dbar, #app .daychip .dbar > span, #app .msrow .ms-bar, #app .msrow .ms-bar > span,
  #app .evgoal .g-bar, #app .evgoal .g-bar > span, #app .lvbar, #app .lvbar > span {
    border-radius: 999px;
  }
  #app .bar { height: 9px; }
  #app .hrow .body .track { height: 6px; }
  #app .hrow .body .track > span { background: var(--hcol, var(--accent)); }

  /* Day strip */
  #app .daychip { border: 0; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); padding: 9px 10px 8px; }
  #app .daychip .dl { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.02em; }
  #app .daychip .dp { font-family: 'Outfit', sans-serif; font-weight: 600; }
  #app .daychip.on { background: var(--accent); color: #fff; }
  #app .daychip.on .dp { color: rgba(255,255,255,0.75); }
  #app .daychip .dbar { background: var(--track); height: 4px; }

  /* Habit rows → cards */
  #app .hrow { margin: 0 16px 10px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); border-bottom: 0; }
  #app .hrow.done { background: var(--card); }
  #app .hrow .checkcell { width: 64px; border-right: 0; padding-left: 10px; }
  #app .htile {
    position: relative; width: 44px; height: 44px; border-radius: 15px;
    background: var(--hbg, var(--surface));
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; line-height: 1;
  }
  #app .htile[data-code] { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.03em; }
  #app .htile .boxmark {
    position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px;
    border-radius: 999px; border: 2px solid var(--card); background: var(--card);
    box-shadow: inset 0 0 0 2px var(--box); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  #app .htile .boxmark.on { background: var(--hcol, var(--accent)); box-shadow: none; }
  #app .htile .boxmark svg.tick { width: 12px; height: 12px; }
  #app .htile .boxmark.lock { width: 20px; height: 20px; background: var(--surface); box-shadow: none; color: var(--muted-soft); border-style: solid; }
  #app .htile .boxmark.lock svg { width: 10px; height: 10px; }
  #app .htile.lockt { filter: grayscale(1); opacity: 0.65; }
  #app svg.tick path { stroke-linecap: round; stroke-linejoin: round; }
  #app .hrow .body { padding: 13px 12px 13px 6px; }
  #app .hrow .body .nm { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px; line-height: 1.25; letter-spacing: 0; text-transform: none; }
  #app .hrow .body .status { font-size: 11.5px; line-height: 1.3; }
  #app .hrow .pluscell {
    flex: none; align-self: center; width: 36px; height: 36px; margin: 0 12px 0 2px;
    border-radius: 999px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 19px;
    box-shadow: 0 3px 0 var(--accent-700);
  }
  #app .hrow .pluscell:hover { background: var(--accent-600); }
  #app .hrow .pluscell:active { transform: translateY(1px); box-shadow: 0 2px 0 var(--accent-700); }
  #app .hrow.locked .pluscell { background: var(--surface); color: var(--accent); box-shadow: none; }
  #app .hrow + .rowhint { border-bottom: 0; padding: 4px 24px 14px; }
  #app .statnote { border-bottom: 0; padding: 8px 24px 14px; }
  #app .hlv { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.05em; color: var(--muted-soft); }
  #app .lvchip { border-radius: 999px; background: var(--teal); color: #0C4B43; font-family: 'Outfit', sans-serif; letter-spacing: 0.02em; }

  /* Streak embers → flames */
  #app .ember { padding-left: 14px; font-family: 'Outfit', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; }
  #app .ember::before {
    content: '🔥'; background: none; width: auto; height: auto;
    margin-top: 0; top: 50%; transform: translateY(-52%);
    font-size: 10px; line-height: 1; filter: grayscale(1); opacity: 0.55;
  }
  #app .ember[data-lvl="1"], #app .ember[data-lvl="2"], #app .ember[data-lvl="3"] { color: var(--clay); }
  #app .ember[data-lvl="1"]::before, #app .ember[data-lvl="2"]::before, #app .ember[data-lvl="3"]::before { filter: none; opacity: 1; }
  #app .ember.lead { background: var(--clay-100); color: var(--clay); border-radius: 999px; padding: 2px 8px 2px 19px; margin-left: 5px; }
  #app .ember.lead::before { left: 6px; background: none; }
  #app .dayflame { border-right: 0; background: var(--clay-100); border-radius: 16px; padding: 8px 12px; align-self: center; gap: 6px; margin-right: 0; }
  #app .dayflame .n { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; }
  #app .dayflame.lit .n { color: var(--clay); }
  #app .dayflame .u { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 7.5px; }
  #app .lit .flame { color: var(--clay); }

  /* Coach card → dark ink card */
  #app .coachcard { margin: 14px 16px; border-radius: 22px; background: #231F35; color: #F6F4FF; border-bottom: 0; padding: 16px; }
  #app .coachcard .eyebrow { color: #A9A3C9; opacity: 1; }
  #app .coachcard .say { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 17.5px; line-height: 1.32; letter-spacing: 0; text-transform: none; min-height: 4.1em; }
  #app .coachcard .cta { background: var(--accent); color: #fff; border-radius: 999px; padding: 11px 16px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0; text-transform: none; box-shadow: 0 3px 0 var(--accent-700); }
  #app .coachcard.risk { background: #C74E28; }
  #app .coachcard.risk .eyebrow { color: rgba(255,246,241,0.75); }
  #app .coachcard.risk .cta { background: #FFF6F1; color: #C74E28; box-shadow: 0 3px 0 rgba(0,0,0,0.2); }
  .caret::before { background: #F6F4FF; }
  #app .riskbar { margin: 0 16px 10px; border-radius: 14px; background: #C74E28; padding: 10px 14px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12.5px; letter-spacing: 0.01em; text-transform: none; }
  #app .backfill { border-radius: 18px; background: #C74E28; color: #FFF6F1; }
  #app .backfill button { border-radius: 999px; font-family: 'Outfit', sans-serif; text-transform: none; letter-spacing: 0.01em; }

  /* Buttons, chips, inputs, toggles */
  #app .btn { border-radius: 999px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: 0; text-transform: none; padding: 13px 18px; }
  #app .btn-block { justify-content: center; }
  #app .btn-primary { color: #fff; box-shadow: 0 3px 0 var(--accent-700); }
  #app .btn-primary:active { transform: translateY(1px); box-shadow: 0 2px 0 var(--accent-700); }
  #app .btn-secondary { border: 1.5px solid var(--box); background: var(--card); }
  #app .btn.confirmr { background: #C2365B; border-color: #C2365B; color: #fff; box-shadow: 0 3px 0 #932644; }
  #app .chip { border: 0; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); padding: 8px 14px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 12.5px; letter-spacing: 0; text-transform: none; color: var(--muted); }
  #app .chip.chip-on { background: var(--accent); color: #fff; font-weight: 700; }
  #app .input { border-radius: 14px; border: 1.5px solid var(--box); background: var(--card); padding: 10px 12px; }
  #app .sw { border-radius: 999px; border-color: var(--box); }
  #app .sw > i { border-radius: 999px; background: var(--box); }
  #app .sw.on > i { background: #fff; }
  #app .selrow.on { border-radius: 18px; color: #fff; }
  #app .manlink { border: 1.5px solid var(--box); border-radius: 999px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0; text-transform: none; padding: 8px 13px; }
  #app .manlink:hover { border-color: var(--accent); }

  /* Tabs → pill bar */
  #app .tabs { border-top: 1px solid var(--rule); padding-top: 7px; padding-bottom: calc(7px + env(safe-area-inset-bottom)); }
  #app .tabslab { border-radius: 999px; top: 7px; bottom: calc(7px + env(safe-area-inset-bottom)); background: var(--accent); }
