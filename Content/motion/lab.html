<!--
  The lab: any new kit piece, played alone on a small stage. Open  lab.html?item=<id>  (add &lang=fa for the Farsi version).
  Keys: Space pause · ←/→ one frame · R restart.   ?t=2.5 freezes on a time.   &render=1 is what the clip tool uses.

-->
