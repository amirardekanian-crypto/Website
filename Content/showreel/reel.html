<title>Claude — Motion Reel ’26</title>
<!--
  The reel, as a live page. Open it to watch it play in real time (lighter motion blur than the export).
  Keys: Space pause · ←/→ step one frame · Shift+←/→ one beat · R restart.   ?t=7.5 freezes on a time.
  The MP4 is rendered from this same page by tools/render.js (see README.md).
-->
<style>
  @font-face{font-family:"Unbounded";src:url(fonts/Unbounded-var.woff2) format("woff2");font-weight:200 900;font-display:block}
  @font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Regular.woff2) format("woff2");font-style:normal;font-display:block}
  @font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Italic.woff2) format("woff2");font-style:italic;font-display:block}
  @font-face{font-family:"JetBrains Mono";src:url(fonts/JetBrainsMono-500.woff2) format("woff2");font-weight:500;font-display:block}
  @font-face{font-family:"JetBrains Mono";src:url(fonts/JetBrainsMono-700.woff2) format("woff2");font-weight:700;font-display:block}
  @font-face{font-family:"Inter Tight";src:url(fonts/InterTight-var.woff2) format("woff2");font-weight:100 900;font-display:block}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #out{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:auto;aspect-ratio:16/9;display:block;background:#000}

</style>
