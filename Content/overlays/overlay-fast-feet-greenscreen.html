:root{
  --paper:#FAF7F2;
  --clay:#C7552F;
  --clay2:#E06B43;
  --hair:rgba(250,247,242,.30);
  --hair2:rgba(250,247,242,.16);
  --ease:cubic-bezier(.16,1,.3,1);
  --wipe:cubic-bezier(.22,1,.36,1);
  --pop:cubic-bezier(.18,1.6,.34,1);
  --shadow:0 4px 30px rgba(0,0,0,.45), 0 1px 4px rgba(0,0,0,.32);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#00FF00}
body{display:flex;align-items:center;justify-content:center;font-family:'BarlowC',Arial Narrow,sans-serif;-webkit-font-smoothing:antialiased}

/* ─── preview chrome (never captured) ─────────────────────────────── */
.backdrop{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 80% at 50% 18%, #2a2d31 0%, #191b1e 46%, #0d0e10 100%);}
body[data-bg="light"] .backdrop{background:radial-gradient(120% 80% at 50% 18%,#e6e1d7 0%,#cbc5b9 60%,#b3ada1 100%)}
body[data-bg="checker"] .backdrop{background:
  repeating-conic-gradient(#8d8d8d 0% 25%, #cfcfcf 0% 50%) 0 0/56px 56px;}
.ctl{position:fixed;z-index:9;left:18px;bottom:18px;display:flex;gap:8px;font-family:ui-monospace,Menlo,monospace}
.ctl button{font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:9px 13px;border:1px solid rgba(255,255,255,.24);
  background:rgba(0,0,0,.55);color:#fff;border-radius:8px;cursor:pointer;backdrop-filter:blur(6px)}
.ctl button:hover{background:rgba(0,0,0,.8)}
.note{position:fixed;z-index:9;right:18px;bottom:20px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(255,255,255,.42)}
body[data-bg="light"] .note{color:rgba(0,0,0,.45)}
body.cap .backdrop,body.cap .ctl,body.cap .note{display:none!important}

/* ─── canvas ──────────────────────────────────────────────────────── */
.fitwrap{position:relative;z-index:1;transform-origin:center center}
body.cap{display:block}
body.cap .fitwrap{transform:none!important;position:absolute;left:0;top:0}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}

.comp{position:absolute;left:112px;top:640px;width:806px;height:742px}

/* the shared start line — both rows launch from here */
.startline{position:absolute;left:-34px;top:-16px;width:3px;height:774px;
  background:linear-gradient(180deg,transparent,var(--hair) 8%,var(--hair) 92%,transparent);
  transform-origin:top center;transform:scaleY(0);
  animation:drawY .55s var(--ease) .06s both}
.startline::after{content:"";position:absolute;left:-7px;top:0;width:17px;height:3px;background:var(--hair)}

/* ═══ ROW A — FAST FEET ═══════════════════════════════════════════ */
.rowA{position:absolute;left:0;top:0;height:152px;animation:settleUp .6s var(--ease) .12s both}
.rowAin{display:flex;align-items:flex-start;gap:34px;
  animation:buzz .182s linear .80s 14 both}
.wd{position:relative;display:block;overflow:visible}
.wd b{display:block;font-weight:900;font-size:190px;line-height:.8;letter-spacing:.006em;color:var(--paper);
  text-shadow:var(--shadow);clip-path:inset(0 100% 0 0)}
.wd .sw{position:absolute;left:0;top:-22px;width:22px;height:196px;background:var(--clay2);
  transform:skewX(-13deg) translateX(-30px);opacity:0;filter:blur(1.5px);
  box-shadow:0 0 42px rgba(224,107,67,.55)}
.w1 b{animation:wipeIn .44s var(--wipe) .14s both}
.w1 .sw{animation:swipe .50s var(--wipe) .12s both}
.w2 b{animation:wipeIn .44s var(--wipe) .32s both}
.w2 .sw{animation:swipe .50s var(--wipe) .30s both}

/* ═══ THE FEET — extremely rapid, caged, going nowhere ════════════ */
.feet{position:absolute;left:0;top:180px;width:380px;height:106px}
.feet .ground{position:absolute;left:0;bottom:0;width:380px;height:2px;background:var(--hair);
  transform-origin:left center;transform:scaleX(0);animation:drawX .40s var(--ease) .62s both}
.feet .cap{position:absolute;bottom:0;width:2px;height:30px;background:var(--hair);opacity:0;
  animation:fadeIn .3s var(--ease) .76s both}
.feet .capL{left:0}
.feet .capR{left:378px}
/* the ground actually covered — next to nothing */
.feet .span{position:absolute;left:0;bottom:-24px;width:54px;height:3px;background:var(--clay2);opacity:0;
  transform-origin:left center;transform:scaleX(0);animation:spanIn .45s var(--ease) 3.04s both}
.feet .spancap{position:absolute;left:52px;bottom:-33px;width:3px;height:21px;background:var(--clay2);opacity:0;
  animation:fadeIn .28s var(--ease) 3.42s both}

/* the blur of effort, shuttling in place */
.sweep{position:absolute;left:6px;bottom:6px;width:168px;height:76px;pointer-events:none;
  background:radial-gradient(ellipse 50% 46% at 50% 50%,rgba(250,247,242,.34),rgba(250,247,242,0) 72%);
  filter:blur(7px);opacity:0;
  animation:sweepIn .3s linear .80s both, shuttle .30s ease-in-out .80s infinite}

.fprow{position:absolute;left:0;bottom:8px;width:380px;height:70px;display:flex;justify-content:space-between;align-items:flex-end;
  filter:drop-shadow(0 3px 13px rgba(0,0,0,.5))}
.fp{position:relative;display:block;width:38px;height:62px;opacity:0}
.fp .sole{position:absolute;left:0;bottom:21px;width:38px;height:31px;background:var(--paper);
  border-radius:52% 52% 40% 40%}
.fp .heel{position:absolute;left:7px;bottom:0;width:24px;height:19px;background:var(--paper);border-radius:50%}
.fp .toe{position:absolute;background:var(--paper);border-radius:50%}
.fp .t1{width:8px;height:6px;left:3px;bottom:52px}
.fp .t2{width:9px;height:7px;left:14px;bottom:54px}
.fp .t3{width:8px;height:6px;left:26px;bottom:52px}
.f1,.f3,.f5,.f7{transform:rotate(-9deg)}
.f2,.f4,.f6{transform:rotate(9deg) translateY(8px)}
/* left set / right set, hard out of phase — ~11 steps a second */
.f1,.f3,.f5,.f7{animation:stepA .182s linear .80s infinite}
.f2,.f4,.f6{animation:stepB .182s linear .80s infinite}
.f1{animation-delay:.800s}.f2{animation-delay:.807s}.f3{animation-delay:.814s}
.f4{animation-delay:.821s}.f5{animation-delay:.828s}.f6{animation-delay:.835s}
.f7{animation-delay:.842s}

/* ═══ THE OPERATOR — ≠ ════════════════════════════════════════════ */
.neq{position:absolute;left:0;top:330px;width:154px;height:158px;overflow:visible}
.neq .glow{position:absolute;left:-46px;top:-40px;width:246px;height:246px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,107,67,.34),rgba(224,107,67,0) 68%);opacity:0;
  animation:glowIn .7s var(--ease) 1.86s both, glowBreathe 2.0s ease-in-out 2.6s infinite}
.neq .bar{position:absolute;left:0;width:154px;height:22px;border-radius:3px;background:var(--clay2);
  box-shadow:0 3px 22px rgba(0,0,0,.4)}
.neq .b1{top:46px;animation:slamL .30s var(--pop) 1.72s both}
.neq .b2{top:96px;animation:slamR .30s var(--pop) 1.80s both}
.neq .slash{position:absolute;left:66px;top:-14px;width:22px;height:190px;border-radius:4px;background:var(--clay2);
  box-shadow:0 3px 22px rgba(0,0,0,.4);
  transform-origin:bottom center;transform:rotate(20deg) scaleY(0);
  animation:drawSlash .30s var(--wipe) 1.99s both}
.neq .ring{position:absolute;left:-33px;top:-35px;width:220px;height:220px;border-radius:50%;
  border:3px solid rgba(224,107,67,.8);opacity:0;animation:ring .62s var(--ease) 1.70s both}

/* ═══ ROW C — FAST, and it actually goes somewhere ════════════════ */
.rowC{position:absolute;left:0;top:540px;width:806px;height:152px}
.fastw{position:absolute;left:0;top:0;display:block}
.fastw b,.fastw .fg{display:block;font-weight:900;font-size:190px;line-height:.8;letter-spacing:.006em;color:var(--paper)}
.fastw b{position:relative;opacity:0;text-shadow:var(--shadow);animation:fastIn .42s var(--ease) 2.40s both}
.fastw .fg{position:absolute;left:0;top:0;opacity:0;filter:url(#mbX);color:rgba(250,247,242,.85)}
.g1{animation:streak .46s var(--ease) 2.30s both;--sx:-430px}
.g2{animation:streak .46s var(--ease) 2.35s both;--sx:-280px}
.g3{animation:streak .44s var(--ease) 2.40s both;--sx:-150px}

.arrow{position:absolute;left:400px;top:40px;width:406px;height:72px}
.shaft{position:absolute;left:0;top:26px;width:314px;height:19px;border-radius:10px;
  background:linear-gradient(90deg,rgba(224,107,67,0) 0%,rgba(224,107,67,.55) 26%,var(--clay2) 100%);
  transform-origin:left center;transform:scaleX(0);
  animation:drawX .42s cubic-bezier(.2,.85,.25,1) 2.56s both}
.head{position:absolute;left:308px;top:2px;width:98px;height:68px;background:var(--clay2);
  clip-path:polygon(0 0,100% 50%,0 100%);opacity:0;
  box-shadow:0 0 40px rgba(224,107,67,.5);
  animation:headIn .34s var(--pop) 2.88s both, headBreathe 1.9s ease-in-out 3.3s infinite}
.sl{position:absolute;height:5px;border-radius:3px;background:rgba(250,247,242,.62);filter:url(#mbXs);opacity:0}
.l1{top:2px;width:150px;animation:speed .52s var(--ease) 2.62s both}
.l2{top:16px;width:230px;animation:speed .56s var(--ease) 2.70s both}
.l3{top:46px;width:190px;animation:speed .54s var(--ease) 2.66s both}
.l4{top:58px;width:120px;animation:speed .50s var(--ease) 2.76s both}

/* the distance covered — the whole point, measured */
.measure{position:absolute;left:0;top:720px;width:806px;height:22px}
.measure .mb{position:absolute;left:0;top:10px;width:806px;height:2px;
  background:linear-gradient(90deg,var(--hair),var(--clay2));
  transform-origin:left center;transform:scaleX(0);animation:drawX .58s var(--ease) 3.02s both}
.measure .mcap{position:absolute;top:0;width:2px;height:22px;background:var(--hair);opacity:0}
.mcL{left:0;animation:fadeIn .3s var(--ease) 3.06s both}
.mcR{left:804px;background:var(--clay2);animation:fadeIn .3s var(--ease) 3.46s both}

/* ─── keyframes ───────────────────────────────────────────────────── */
@keyframes wipeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes swipe{
  0%{transform:skewX(-13deg) translateX(-34px);opacity:0}
  12%{opacity:1}
  82%{opacity:1}
  100%{transform:skewX(-13deg) translateX(var(--sww,420px));opacity:0}
}
.w1 .sw{--sww:404px}
.w2 .sw{--sww:398px}
@keyframes settleUp{from{transform:translateY(20px)}to{transform:translateY(0)}}
@keyframes drawY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drawX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spanIn{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}

@keyframes stepA{
  0%{opacity:1;transform:rotate(-9deg) translateY(-5px)}
  34%{opacity:1;transform:rotate(-9deg) translateY(-5px)}
  36%{opacity:.11;transform:rotate(-9deg) translateY(0)}
  100%{opacity:.11;transform:rotate(-9deg) translateY(0)}
}
@keyframes stepB{
  0%{opacity:.11;transform:rotate(9deg) translateY(8px)}
  48%{opacity:.11;transform:rotate(9deg) translateY(8px)}
  50%{opacity:1;transform:rotate(9deg) translateY(3px)}
  84%{opacity:1;transform:rotate(9deg) translateY(3px)}
  86%{opacity:.11;transform:rotate(9deg) translateY(8px)}
  100%{opacity:.11;transform:rotate(9deg) translateY(8px)}
}
@keyframes sweepIn{from{opacity:0}to{opacity:1}}
@keyframes shuttle{
  0%{transform:translateX(0)}
  50%{transform:translateX(196px)}
  100%{transform:translateX(0)}
}
@keyframes buzz{
  0%{transform:translate(0,0)}
  25%{transform:translate(2.6px,-1.4px)}
  50%{transform:translate(0,1.2px)}
  75%{transform:translate(-2.4px,-1px)}
  100%{transform:translate(0,0)}
}
@keyframes slamL{from{opacity:0;transform:translateX(-84px) scaleX(.6)}to{opacity:1;transform:translateX(0) scaleX(1)}}
@keyframes slamR{from{opacity:0;transform:translateX(84px) scaleX(.6)}to{opacity:1;transform:translateX(0) scaleX(1)}}
@keyframes drawSlash{from{transform:rotate(20deg) scaleY(0)}to{transform:rotate(20deg) scaleY(1)}}
@keyframes ring{
  0%{opacity:0;transform:scale(.28)}
  22%{opacity:.85}
  100%{opacity:0;transform:scale(1.25)}
}
@keyframes glowIn{from{opacity:0}to{opacity:1}}
@keyframes glowBreathe{0%,100%{opacity:.72}50%{opacity:1}}

@keyframes streak{
  0%{opacity:0;transform:translateX(var(--sx)) scaleX(1.14)}
  22%{opacity:.6}
  100%{opacity:0;transform:translateX(0) scaleX(1)}
}
@keyframes fastIn{
  0%{opacity:0;transform:translateX(-42px) scaleX(1.09)}
  60%{opacity:1}
  100%{opacity:1;transform:translateX(0) scaleX(1)}
}
@keyframes speed{
  0%{opacity:0;transform:translateX(-230px) scaleX(.5)}
  25%{opacity:.75}
  100%{opacity:0;transform:translateX(470px) scaleX(1.3)}
}
@keyframes headIn{from{opacity:0;transform:translateX(-70px) scale(.7)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes headBreathe{0%,100%{filter:drop-shadow(0 0 0 rgba(224,107,67,0))}50%{filter:drop-shadow(0 0 16px rgba(224,107,67,.75))}}
<style id="gs-overrides">
/* Chroma-key pass: a hard keyer can't hold partial transparency, so anything that faded
   softly to transparent in the alpha build would leave a fringed halo here. Flattened:
   the two big soft glows (≠ halo, arrow-head glow), every blurred drop-shadow, the resting
   hairline guides (were a fixed low-alpha white — now solid grey), and the "resting"
   footprints (were held at fixed low opacity for most of the run, not just a quick
   transition — the single biggest offender: a sustained partial-alpha shape bakes to a
   near-green blob a real keyer either eats or leaves as a green-tinted smear; caught by
   compositing a simulated key over test footage, not by eye). Their dim state now comes
   from filter:brightness() instead of opacity — fully opaque throughout, so it keys clean.
   Left alone on purpose: the footstep motion-blur sweep, the FAST ghost-trail streaks, the
   speed lines, the arrow shaft's own built-in fade-up, and the ≠ appear-ring — all brief,
   moving, and read fine as a soft trail rather than a static blob; gutting those would gut
   the design for a much smaller key risk than what's actually flattened above. */
:root{--shadow:none;--hair:#8a8a85}
.wd .sw{box-shadow:none}
.fprow{filter:none}
.neq .glow{display:none}
.neq .bar,.neq .slash{box-shadow:none}
.head{box-shadow:none;animation:headIn .34s var(--pop) 2.88s both}
@keyframes ring{
  0%{opacity:0;transform:scale(.28)}
  22%{opacity:1}
  100%{opacity:0;transform:scale(1.25)}
}
@keyframes stepA{
  0%{opacity:1;filter:brightness(1);transform:rotate(-9deg) translateY(-5px)}
  34%{opacity:1;filter:brightness(1);transform:rotate(-9deg) translateY(-5px)}
  36%{opacity:1;filter:brightness(.22);transform:rotate(-9deg) translateY(0)}
  100%{opacity:1;filter:brightness(.22);transform:rotate(-9deg) translateY(0)}
}
@keyframes stepB{
  0%{opacity:1;filter:brightness(.22);transform:rotate(9deg) translateY(8px)}
  48%{opacity:1;filter:brightness(.22);transform:rotate(9deg) translateY(8px)}
  50%{opacity:1;filter:brightness(1);transform:rotate(9deg) translateY(3px)}
  84%{opacity:1;filter:brightness(1);transform:rotate(9deg) translateY(3px)}
  86%{opacity:1;filter:brightness(.22);transform:rotate(9deg) translateY(8px)}
  100%{opacity:1;filter:brightness(.22);transform:rotate(9deg) translateY(8px)}
}
</style>
</head>

<script>
(function(){
  var P = new URLSearchParams(location.search);
  var CAP = P.has('capture');
  var TSEEK = P.has('t') ? parseFloat(P.get('t')) : null;
  var DUR = 4.0;
  window.__dur = DUR;

  function anims(){ return document.getAnimations(); }

  function seek(t){
    var list = anims();
    for (var i=0;i<list.length;i++){
      try { list[i].pause(); list[i].currentTime = t*1000; } catch(e){}
    }
  }
  function rewind(){
    var list = anims();
    for (var i=0;i<list.length;i++){
      try { list[i].currentTime = 0; list[i].play(); } catch(e){}
    }
  }

  window.__seek = function(t){
    seek(t);
    return new Promise(function(res){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ res(true); }); });
    });
  };

  function fit(){
    if (CAP || TSEEK !== null) return;
    var s = Math.min(window.innerWidth/1080, window.innerHeight/1920);
    document.getElementById('fitwrap').style.transform = 'scale('+s+')';
  }

  if (CAP || TSEEK !== null){
    document.body.classList.add('cap');
    document.documentElement.style.background='#00FF00';
    document.body.style.background='#00FF00';
    document.fonts.ready.then(function(){
      // force layout so every CSS animation is registered before we scrub
      void document.getElementById('stage').offsetWidth;
      seek(TSEEK !== null ? TSEEK : 0);
      window.__ready = true;
    });
  } else {
    fit(); window.addEventListener('resize', fit);
    var timer = null;
    function loop(){
      rewind();
      clearTimeout(timer);
      timer = setTimeout(loop, (DUR + 0.85) * 1000);
    }
    document.fonts.ready.then(loop);
    var bgs = ['dark','light','checker'], bi = 0;
    document.getElementById('bg').onclick = function(){
      bi = (bi+1) % bgs.length; document.body.dataset.bg = bgs[bi];
    };
    document.getElementById('replay').onclick = loop;
  }
})();
</script>
