# Career Mode · recognition
#
# Who hears about what (CAREER_MODE.md → Recognition, PROCEDURES.md → P8, P9, P11).
# Every badge tier, achievement, mission sweep and quest carries a size; the size decides the audience.
# The athlete always sees their own. The crew only sees what the athlete said yes to (GAME-9).
# Every reward is celebrated (GAME-14): a moment at its size, and from highlight up a share card in its app's card family
# (the training's: Highlight Reel, assets/js/sharecard.js; Proof's: its own). A share pays nothing (GAME-6).

sizes = ["tick", "win", "highlight", "milestone", "legend"]

[size.tick]
athlete = "at once, on the thing they tapped: +XP rising, the level bar filling, and the nearest goal it touched with its new count (GAME-13, [feedback] below)"
coach = "nothing"
crew = "nothing"
beyond = "nothing"

[size.win]
athlete = "the wins card, until tapped"
coach = "nothing"
crew = "nothing"
beyond = "nothing"

[size.highlight]
athlete = "the wins card, until tapped, and a share card offered"
coach = "a Courtside row, with the WhatsApp message written"
crew = "a line on the Bell, if the athlete said yes"
beyond = "the share card, the athlete's to post"

[size.milestone]
athlete = "a full-screen moment right away (they just acted), or at the next open if the app was closed; a share card offered"
coach = "a Courtside row, and a heads-up when it can be seen coming"
crew = "a line on the Bell, if the athlete said yes"
beyond = "the share card, the athlete's to post"

[size.legend]
athlete = "a full-screen moment, and a share card offered"
coach = "a Courtside row; often Amir's own to give"
crew = "a line on the Bell, if the athlete said yes"
beyond = "Amir's story, only after the athlete says yes"

# ── Moments (phase 3, D7) ─────────────────────────────────────────────────────────────────────────────────────────
# How a reward is told in the apps (PROCEDURES.md → the queue). per_open: at most this many full-screen moments of ANY kind per
# app open (a level-up or the reveal counts). keep_days: a full-screen award not shown in this many days becomes a wins-card line
# (never lost). max: the most moments one answer carries. full_screen: the sizes that open full-screen.
[moments]
per_open = 1
keep_days = 14
max = 8
full_screen = ["milestone", "legend"]


# ── Instant feedback (GAME-13) ────────────────────────────────────────────────────────────────────────────────────
# Amir, 2026-10-17: "we need to show the client a visible progress and immediate feedback every time a meaningful task
# is completed." Every fact an athlete makes answers at once, on the thing they tapped, before the server does
# (PROCEDURES.md → P17). The lines are drafts in Amir's voice; {…} are filled in.

[feedback]
when = "in the same moment as the tap; never waits for the network (the phone previews from the rulebook, GAME-2)"
shows = ["what it earned: +XP, rising from the thing tapped", "where it moved them: the level bar fills and the meaning's number ticks up", "the nearest goal it touched: a badge's next tier, this week's mission or the quest step, with its new count"]
crossing = "a tier, mission or quest step it completes gets its moment right then, at its size; one only the server can decide (a personal best, a held week, a cycle finished) shows at once marked pending and is confirmed when the server answers"
never = "a tap that changes nothing on screen, or a number that changes without the athlete seeing it move"

[feedback.habit_done]
where = "AA Proof's habit row, and the strip on the training app's Home"
line = "+{xp} XP · {habit} {n} of {target} · {streak}-day streak"

[feedback.checkin_done]
where = "the check-in sheet as it closes"
line = "+{xp} XP · Pulse Check {n} of {next}"

[feedback.session_finished]
where = "the training app's finish card, before Done closes it"
line = "Everything the session earned: +{xp} XP, the week ({done} of {plan} · Hold Serve), every badge, mission and quest step it moved"

[feedback.week_held]
where = "the finish card of the session that held it, then This Week on Home"
line = "Week held · {run} in a row · +{xp} XP"

[feedback.personal_best]
where = "the finish card (where the New best band is today)"
line = "New best · {exercise} · +{xp} XP · Record Breaker {n} of {next}"

[feedback.mission_done]
where = "wherever the fact that finished it was made"
line = "{mission}: done · +{xp} XP · {done} of 3 this week"

[feedback.quest_step]
where = "wherever the fact that closed it was made"
line = "{quest}: step {k} of {steps} done"

[feedback.comeback]
where = "AA Proof's Today, on the day it happens"
line = "Comeback · +{xp} XP. Good to have you back."

[courtside]
# coach.html → Today, the top of the right column (stage75, built 2026-10-19; Amir picked direction A of the design page).
# Good news is never a reason in reasonsOf(): it never counts as "needs you". Only the four numbers' marks and the achievements reach it
# (minted live, from highlight up), grouped one per athlete per day; the month's honours sit on top in its first seven days.
max_rows_per_week = 5
order = "biggest size first, then newest"
heads_up = ["session 100 within the next 2 sessions", "the roadmap's last week", "a retest week"]   # not built; One Week Short is pitched instead
row = "the athlete, the moment in plain words, the WhatsApp line written, WhatsApp, Copy and Saw it"

[bell]
# AA Proof → Crew → Bell.
keep_days = 7
consent = "asked once, at the athlete's first highlight; a switch in Settings"
question = "Ring the bell for the crew when you set a best?"
kudos_per_person_per_line = 1
shows = "the board name, the kind of moment and the exercise; never a weight, never an athlete id"

[tool.reaction]
who = "Amir"
does = "Saw it on a Courtside row (or sending its WhatsApp); from step 3 the athlete sees 'Amir saw this' on that moment"
pays = "nothing"
note = "a mark, not a chat: Amir's words still go by WhatsApp"

[tool.commendation]
who = "Amir"
does = "From Amir: one line he writes under the athlete's name on coach.html, one a day, no badge and no XP (round 5: badges are removed); the athlete sees it from step 3"
size = "milestone"
example = "Commended for resilience: trained through exam week."

[tool.amirs_pick]
who = "Amir"
when = "the 1st of each month"
shortlist = ["the most weeks held last month", "the biggest effort-matched gain", "the best comeback or bounce back"]
size = "legend"
asks_before_story = "a pre-written WhatsApp asking whether Amir may feature them"


# ── The WhatsApp lines ────────────────────────────────────────────────────────────────────────────────────────────
# What Amir's WhatsApp opens with from a Courtside row. He can change the words before he sends.
# {name} {exercise} {gain} {n} {cycle} {sessions} {planned} {quest} {badge} {metal} {caption} {achievement} {month} {lift} {pct} are filled in.
# coach.html keeps a copy of the lines Courtside uses (COURT_LINES); scripts/check_career.py rule 22 holds the two equal: change both.
# These lines reach career_catalogue at the next seed (D20's); nothing on the server reads them, coach.html reads its copy.
# DRAFTS in Amir's voice (plain words, short sentences, COM-3): he rewrites them. Every Farsi line is his to write.

[message.bests]
used_for = "Record Breaker marks (personal bests 5 · 10 · 25 · 50 · 100)"
en = "{n} personal bests now. Keep stacking them."
fa = ""

[message.comebacks]
used_for = "HARD TO KILL marks (comebacks 3 · 5 · 10)"
en = "You came back again. That's {n} times. Good."
fa = ""

[message.first_best]
used_for = "the First Best achievement (never a weight: a best's number is an estimate, PROG-01)"
en = "Saw your first best on the {exercise}. Many more to come."
fa = ""

[message.held]
used_for = "the Held achievement (the first full week)"
