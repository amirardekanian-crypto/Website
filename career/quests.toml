# Career Mode · personal quest templates
#
# A quest is one long goal, 2 to 12 weeks, in 2 to 5 steps (PROCEDURES.md → P7). One at a time, two at most.
# Doors: coach (Amir assigns it), cycle (a cycle's outcome becomes it), athlete (they pick one of three Amir approved).
# A step closes on facts, or on Amir's tick when only he can judge it. A quest is paused or extended, never failed.
# It pays share.quest (rulebook.toml) of the work its steps counted, plus its badge, and its title if it has one.
# Names and steps are drafts (2026-10-17): change them freely; never change an id.

[quest.sleep_reset]
name = "Sleep Reset"
meaning = "consistency"
weeks = 4
doors = ["coach", "athlete"]
free = true
size = "milestone"
caption = "Four weeks of real sleep."
reward_badge = "Sleep Reset"
origin = "new"
steps = [
  { name = "Your sleep target on 5 nights in a week", closes_on = "fact", counts = "habit_done", habit = "sleep", measure = "days", target = 5, within = "7 days" },
  { name = "10 of 14 nights", closes_on = "fact", counts = "habit_done", habit = "sleep", measure = "days", target = 10, within = "14 days" },
  { name = "20 of 28 nights", closes_on = "fact", counts = "habit_done", habit = "sleep", measure = "days", target = 20, within = "28 days" },
]

