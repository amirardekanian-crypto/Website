# Career Mode · the rulebook
#
# Every number the scorer uses. Change a number, run `python scripts/check_career.py`, and (once built) re-seed:
# every athlete's XP and level are worked out again from their facts, and nothing already minted is taken back (GAME-1).
#
# First draft, 2026-10-17. The numbers are here so the shape is visible: once the XP switch is on (WORKOUT's habit at 0
# a day, the session fact paying instead) a perfect week on a 3-day plan is about 3,900 XP and training is 46% of it
# (before it, 15-19%; decision 4). Tune freely.
#
# How the server uses this file (phase 1, 2026-10-17): scripts/career_seed.py turns it into the career_rules row and
# the other files into career_catalogue rows. Run `python scripts/check_career.py` first; the seed refuses a file with
# an error. Version 2 (phase 2, 2026-10-17): phase 1's one shadow gate became the two switches below. Version 3
# (2026-10-18): the XP switch turned on, the day Season 1 opened (Amir: "switch after Season 1 starts").

# D20 (stage76, 2026-10-19): a change applies forward only. A rename is re-seeded at the same version. A change of an XP value, a cap,
# a tier or what earns an achievement raises `version` and sets `starts_on = "YYYY-MM-DD"`, the day it is seeded: facts before that day
# keep their prices, awards keep the XP they were minted with. The seed refuses a change to [habits], [level], [season], [week], [share] or
# to how a fact is worked out (career/README.md; PROCEDURES.md → Stage 76).
version = 3
meanings = ["consistency", "commitment", "progress", "resilience"]

[switch]
# Career Mode's two switches (Amir, 2026-10-17: "go with your picks"; CAREER_MODE.md → The decisions, round 3). Each is
# "off" until a seed turns it on with the day it happens ("YYYY-MM-DD", never a day still to come), and once on it is never
# turned back off: the seed refuses that, because the level would go back with it (scripts/career/rollback_stage69.sql is
# the way back, on Amir's word only).
#
# xp, phase 2 (PROCEDURES.md → P14): while it is off, Career Mode runs in shadow beside AA Proof and scores habits exactly as
# Proof does, so the two can be compared to the point (career_compare()); nothing an athlete sees reads it. When it is on:
#   · AA Proof's level, rank, XP and board, and the training app's strip, read get_profile(): one scorer (GAME-2);
#   · training earns XP (the [fact.*] blocks below), and the locked habits ([habits] locked: WORKOUT) pay 0 a day, because
#     the session fact pays instead (decision 4): a session is never paid twice. The habit stays on the day's list for the
#     day streak, and its weight still counts in the day gate and its tiers until the catalogue switch;
#   · a closed habit day settles (P1 step 4: [habits] backfill_days);
#   · the level is the career level: it never resets (decision 1), the board ranks season points ([season]), and nobody's
#     level goes down ([fact.level_kept]).
# The seed that turns it on writes the levels kept and returns every athlete's line; `--dry-run` shows that list first.
# Turned on 2026-10-18, after Season 1 opened at 06:00 UK, on Amir's yes to the list (CAREER_MODE.md → round 3).
xp = "2026-10-18"
#
# catalogue, phase 3: the entries gated on it in badges.toml and achievements.toml (retire_at / starts_at = "catalogue")
# take effect: one badge per habit, HEAVY METAL and THE MACHINIST retire, the training badges and the awards join. It
# needs the XP switch on first. Turning it on (phase 3, stage70) changes no number: Proof's habit tiers and milestones stop
# paying through hab_bonus_xp() and pay once in a career as awards (the same crossing day, the same XP, so no level drops);
# the retired entries stop, the starts_at entries start, and what was earned under the new entries before that day is
# minted in silence at the switch. It is seeded alone, on today's day (or yesterday's), at the same rulebook version.
catalogue = "2026-10-18"

[level]
# The cost of level n to n+1 is base × n^growth, rounded to 10 (Proof's curve today, XP_SYSTEM.md §2).
base = 400                # re-anchored in phase 1 (P4 step 3), so two months of solid work, training included, still
                          # reaches level 20: measured 2026-10-17 on the shadow data with the switch's numbers (WORKOUT's
                          # habit at 0), the one athlete solid in both apps (28 sessions, habits on 59 of 60 days) made
                          # 27,367 XP in their best 60 days, which is level 24 at 300 and level 20 at 400. A training-only
                          # athlete's best two months reach level 13 to 15. (Proof's own season curve stays at 300.)
growth = 0.55             # raise it to make the top end slower, lower it to make it faster
ranks = ["ROOKIE", "CONTENDER", "GRINDER", "OPERATOR", "ENFORCER", "PREDATOR", "MACHINE", "RELENTLESS", "UNTOUCHABLE", "IMMORTAL"]
levels_per_rank = 5
prestige_after = 50       # level 51 is ★1 ROOKIE 1, and so on, with no ceiling
resets = false            # decision 1: the level is the career and never resets

[season]
board = "season points"   # the board ranks the XP earned inside the current season
title_points = 2000       # season points that earn the season's title once the XP switch is on (hab_close_season(); until
                          # then Proof's own rule, "level 5 inside the season", 1,930 XP)
starts_only_on = "Amir's word, with start_season()"

[week]
missions = "monday-sunday"   # decision 5: one week for everyone, in each athlete's local time
held_week = "plan week"      # a held week follows the cycle's own training week (cycleWeekInfo())
close_after_days = 1         # a training week is judged (held or broken) this many days after its last day, so no time
                             # zone closes it while it is still running for the athlete

[share]
mission = 0.5             # GAME-7: a mission pays this share of the XP of the work inside it, the same for every mission
quest = 0.5               # the same rule for a personal quest
mission_sweep = 200       # all three of a week's missions done

[habits]
# AA Proof's habit values as they are today (XP_RULES in habits.html, the xp_rules row). They carry over unchanged.
# At the catalogue switch no number here moves: the day gate, the weights and the targets stay, and what a habit's tiers paid
# is paid on by the awards (the weight x completion_bonus still prices a habit tier). WORKOUT's 100 stays in the day gate.
completion_bonus = 1.2    # a habit that reaches its target pays weight × 1.2; part way, it pays its share of the weight
daily_cap = 3             # a counter takes at most 3 × its target in a day (the phone clamps it; nothing to score)
max_custom = 3            # at most three custom habits pay in a day
lapse_days = 3            # this many days off target in a row make a lapse (the comeback rule)
comeback_stick = 7        # days held after a comeback for it to count as one that stuck (BACK IN THE FIGHT)
qualify_pct = 80          # a day is on target at this % of the weight it could have earned (dayQualifies())...
one_miss_door = true      # ...or with at most one thing left undone: the second door (Proof's gateV2)
locked = ["strength"]     # habits nobody ticks by hand (WORKOUT: only a finished session ticks it); one not earned that
                          # day leaves the day gate instead of counting against it (Proof's unearnable). Once the XP
                          # switch is on a locked habit pays 0 a day: its session pays
backfill_days = 3         # today and this many days back are open on Proof's log (BACKFILL_DAYS); an older day is
                          # closed, and settles once the XP switch is on (P1 step 4)

[habits.weights]
strength = 100            # the WORKOUT habit, as Proof pays it. Once the XP switch is on it pays 0 a day, because the
                          # session fact pays instead (decision 4): every habit in [habits] locked does (career_paid_rules()).
                          # The 100 stays here, Proof's own number: the day gate and the habit's tiers still read it
steps = 60
sleep = 50
fuel = 40
water = 30
mobility = 30
breathe = 20
supps = 20
custom = 25

[habits.targets]
# What "done" means for each habit, per day (HABITS[].target in habits.html, Proof's targets). A custom habit's target
# is 1: done or not.
strength = 1              # sessions
steps = 10000
sleep = 7.5               # hours
fuel = 3                  # proper meals
water = 8                 # glasses
mobility = 1
breathe = 1
supps = 1


# ── Facts from the training app ───────────────────────────────────────────────────────────────────────────────────

[fact.session_finished]
meaning = "commitment"
xp = 400
source = "training"
pays_for = "act"
when = "A session from the plan is finished with Done."
cap = "One per plan day per training week. A day repeated in the same week pays once."
limit = 1                 # the cap as a number: at most this many paid sessions per plan day per training week
limit_per = "plan_day_week"

[fact.session_finished_early]
meaning = "commitment"
xp = 200
source = "training"
pays_for = "act"
when = "A session from the plan is finished with Finish early."
cap = "As session_finished. It still counts toward a held week."
limit = 1                 # shared with session_finished: one paid session per plan day per training week
limit_per = "plan_day_week"

[fact.full_log]
meaning = "commitment"
xp = 50
source = "training"
pays_for = "act"
when = "Every working set of a finished session is logged as the card asks."
cap = "One per session."

[fact.checkin_done]
meaning = "commitment"
xp = 20
source = "training"
pays_for = "act"
when = "The check-in is answered before the session. The answers themselves are never paid (GAME-5)."
cap = "One per session."

[fact.retest_done]
meaning = "commitment"
xp = 50
source = "training"
pays_for = "act"
when = "A test-flagged lift is logged in its test week."
cap = "One per lift per cycle."
window_days = 7           # the test week: the cycle's last 7 days (RETEST_WINDOW_DAYS), and after its end while it is current

[fact.library_session]
meaning = "commitment"
xp = 100
source = "training"
pays_for = "act"
when = "A Library session is marked done."
cap = "Two a week. It never counts toward a held week."
limit = 2                 # paid Library sessions per week (Monday to Sunday)
limit_per = "week"


# ── Facts from AA Proof ───────────────────────────────────────────────────────────────────────────────────────────

[fact.habit_done]
meaning = "consistency"
xp_from = "habits"
source = "proof"
pays_for = "act"
when = "A habit is done, or part done on a counter, on a day."
cap = "daily_cap and max_custom, in [habits]."

[fact.day_on_target]
meaning = "consistency"
xp = 0
source = "proof"
pays_for = "act"
when = "A day passes Proof's two-door gate (dayQualifies()). It pays through badges, not by itself."

[fact.perfect_day]
meaning = "commitment"
xp = 0
source = "proof"
pays_for = "act"
when = "Every habit on the day's list is done (isPerfect()). It pays through badges, not by itself."

[fact.workout_tick]
meaning = "commitment"
xp = 0
source = "proof"
pays_for = "act"
when = "Proof's WORKOUT habit is ticked by a finished session. It keeps the day streak whole; the session fact pays."

[fact.level_kept]
meaning = "carried"
xp_from = "value"
career_only = true
source = "server"
pays_for = "act"
when = "Once, at the XP switch: an athlete whose career level would be below the highest level they reached in AA Proof keeps it (decision 2, 2026-10-17: nobody's level goes down). The fact holds the XP that brings them to the start of that level, worked out that day and never again, and it counts toward the career only, never a season's points or a week's."
cap = "One per athlete, ever (ref xp-switch)."

[fact.habit_day]
meaning = "consistency"
xp = 0
source = "proof"
pays_for = "nothing"
when = "A day on Proof's log, with the habits on its list that day (rosterOn()) and the athlete's own habits. It pays nothing: the day's habits do, and the day gate and the perfect day read its list."


# ── Facts the server works out (P2) ───────────────────────────────────────────────────────────────────────────────

[fact.week_held]
meaning = "consistency"
xp = 400
source = "server"
pays_for = "act"
when = "Every plan day of a training week has a finished session, in any order."
cap = "One per training week."

[fact.week_broken]
meaning = "consistency"
xp = 0
source = "server"
pays_for = "nothing"
when = "A training week ends short of the plan. Never between cycles, never while Amir has paused the athlete."

[fact.bounce_back]
meaning = "resilience"
xp = 100
source = "server"
pays_for = "act"
when = "A week held straight after a broken one."

[fact.training_return]
meaning = "resilience"
xp = 50
source = "server"
pays_for = "act"
when = "The first held week after two or more weeks with no session (between-cycle and paused weeks don't count)."
weeks_away = 2            # training weeks in a row with no session that make an absence

[fact.comeback_stuck]
meaning = "resilience"
xp = 0
source = "server"
pays_for = "act"
when = "A comeback followed by comeback_stick days on target in a row (Hard to Kill reads it). It pays through badges, not by itself."

[fact.week_by_the_book]
meaning = "commitment"
xp = 0
source = "server"
pays_for = "act"
when = "A held week in which every session has full_log and checkin_done (Love Hold reads it). It pays through badges, not by itself."

[fact.month_with_amir]
meaning = "commitment"
xp = 0
source = "server"
pays_for = "act"
when = "Each whole month since the athlete's first session; none while they are a former athlete (Veteran reads it). It pays through badges, not by itself."

[fact.lift_gain]
meaning = "progress"
xp = 0
source = "server"
pays_for = "progress"
when = "A lift's best effort-adjusted index, with the weight or the reps up, reaches a new high above its first session; the value is the percent above it. One fact per lift, its value rising (The Upgrade reads it). It pays through badges, not by itself."

[fact.comeback]
meaning = "resilience"
xp = 50
source = "server"
pays_for = "act"
when = "Proof's rule: a day on target after lapse_days or more days that weren't, with an earlier day on target before them."

[fact.personal_best]
meaning = "progress"
xp = 150
source = "server"
pays_for = "progress"
when = "A finished session's best set for a lift beats every earlier number for that lift. A lift's first time is not a best."
cap = "One per lift per session."

[fact.effort_win]
meaning = "progress"
xp = 200
source = "server"
pays_for = "progress"
when = "At a cycle's end, each of its top three effort-matched wins (cycleWins(): heavier at the same effort, 2% or more) in which the weight or the reps went up. A lower RPE alone shows on the This cycle card and earns nothing (GAME-5)."
cap = "Three per cycle."
limit = 3                 # wins paid per cycle
limit_per = "cycle"
min_gain = 0.02           # the effort-adjusted gain a win needs (cycleWins(): 2%)

[fact.retest_beaten]
meaning = "progress"
xp = 300
source = "server"
pays_for = "progress"
when = "A retest beats the lift's previous test, or its record when there was no test."
cap = "One per lift per cycle."

[fact.cycle_finished]
meaning = "commitment"
xp = 1000
source = "server"
pays_for = "act"
when = "The day after a cycle's end date, with at least min_share of its planned sessions finished."
min_share = 0.8

[fact.roadmap_finished]
meaning = "commitment"
xp = 3000
source = "server"
pays_for = "act"
when = "The roadmap's last cycle is finished."

[fact.mission_done]
meaning = "consistency"
xp_from = "mission"
source = "server"
pays_for = "act"
when = "A weekly mission reaches its target (P6). It pays the XP frozen when the mission was planned."

[fact.mission_sweep]
meaning = "consistency"
xp_from = "share.mission_sweep"
source = "server"
pays_for = "act"
when = "All three of a week's missions are done."
