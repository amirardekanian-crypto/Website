# Career Mode · titles
#
# A title is a name worn beside your name on the board, the Bell and the share card. One worn at a time.
# Minted once and never taken back (GAME-1). Rare on purpose.
# Metals follow Proof's rule: bronze under level 13, silver from 13, emerald from 21; event titles and the top
# of the road are prismatic.
# Names are drafts (2026-10-17): change them freely; never change an id.

[title.clockwork]
name = "CLOCKWORK"
meaning = "consistency"
from = "Held Weeks, prismatic: 52 weeks held in a row"
metal = "prismatic"
origin = "new"

