# ── Carried over from AA Proof (origin = "proof") ────────────────────────────────────────────────────────────────
# Proof's consistency tiers, milestone families and comeback badges, as they are in habits.html today.

# ── Proof's two streak ladders ──────────────────────────────────────────────────────────────────────────────────────

# CONSISTENCY_TIERS: one ladder per habit, judged on the best run ever. mult multiplies THAT habit's own daily value
# (XP_SYSTEM.md §4), so the same tier pays more on a heavy habit and less on a light one.
[badge.habit_tiers]
name = "Consistency Tiers"
meaning = "consistency"
kind = "per_habit_best_run"
counts = "habit_done"
caption = "{n} days in a row on one habit."
free = true
origin = "proof"
proof_id = "CONSISTENCY_TIERS"
tiers = [
  { at = 5, metal = "bronze", mult = 0.5, size = "win", tier_name = "KINDLED" },
  { at = 10, metal = "silver", mult = 1, size = "win", tier_name = "STEADY" },
  { at = 20, metal = "emerald", mult = 2, size = "win", tier_name = "LOCKED IN" },
  { at = 30, metal = "amethyst", mult = 3, size = "win", tier_name = "IRONCLAD" },
  { at = 60, metal = "prismatic", mult = 6, size = "win", tier_name = "UNBREAKABLE" },
]

# DAY_STREAK_MARKS: days on target in a row (dayQualifies()). The 3-day mark is a card on Today; from STREAK_TAKEOVER
# (7) a mark takes the whole screen, so: win below it, milestone from it. It pays no XP of its own
# (XP_SYSTEM.md §5: "recognition, not a second payout"), so every xp here is 0.
[badge.day_streak]
name = "Day Streak"
meaning = "consistency"
kind = "proof"
proof_codes = ["DAY_STREAK_MARKS"]
caption = "{n} days on target in a row."
free = true
