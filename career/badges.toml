# Widens Proof's HARD TO KILL (hard_to_kill, further down) from the catalogue switch: comebacks that stuck from habits
# (comeback_stuck) AND from training (training_return). Proof's two tiers, then a third at 10.
[badge.comebacks]
name = "HARD TO KILL"
meaning = "resilience"
kind = "total"
counts = ["comeback_stuck", "training_return"]
caption = "{n} comebacks that stuck, from habits or from training."
free = true
origin = "new"
starts_at = "catalogue"
history_twin_counts = "comeback_stuck"
tiers = [
  { at = 3, metal = "bronze", xp = 300, size = "highlight" },
  { at = 5, metal = "silver", xp = 600, size = "milestone" },
  { at = 10, metal = "emerald", xp = 1200, size = "milestone" },
]
