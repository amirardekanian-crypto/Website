tiers = [
  { at = 3, metal = "bronze", xp = 0, size = "win" },
  { at = 7, metal = "bronze", xp = 0, size = "milestone" },
  { at = 14, metal = "silver", xp = 0, size = "milestone" },
  { at = 21, metal = "silver", xp = 0, size = "milestone" },
  { at = 30, metal = "emerald", xp = 0, size = "milestone" },
  { at = 50, metal = "emerald", xp = 0, size = "milestone" },
  { at = 75, metal = "amethyst", xp = 0, size = "milestone" },
  { at = 100, metal = "amethyst", xp = 0, size = "milestone" },
  { at = 150, metal = "prismatic", xp = 0, size = "milestone" },
