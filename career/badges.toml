

# ── The cut (Career Mode round 5, stage78) ──────────────────────────────────────────────────────────────────────
# Amir, 2026-10-20 (L5): "Just remove names and titles and badges". Only the four numbers' own badges stay, as their MARKS (L3): weeks
# held in a row, sessions with Amir, personal bests, comebacks. Every other badge left the catalogue and the server on the day of the cut;
# each award of one became a nameless XP fact on the same day with the same XP, so nobody's XP, level or season points moved (L6).
# A tier no longer gives a title: titles are gone too.

# Career Mode · badges
#
# A badge is a quality built over time, in tiers. It is judged on the best ever and never taken back (GAME-1).
# Metals, low to high: bronze, silver, emerald, amethyst, prismatic. No gold, ever.
# kind: best_run (the longest run, best ever) · total (a career count) · per_habit_best_run (Proof's tiers) ·
#       best_value (the largest value its fact has reached, e.g. a percent) · proof
# Gated on the catalogue switch (phase 3; rulebook.toml → [switch] catalogue; CAREER_MODE.md → The engine): retire_at =
# "catalogue" is earned as Proof earns it until then and never after (anyone who has it keeps it); starts_at = "catalogue"
# is not earned before it; superseded_by names the entry (or entries) that take its place. A badge with habit = "…" reads
# only that habit's facts.
# run (best_run badges, phase 3): what a "run" is. plan_weeks = held weeks in a row on the plan's own weeks (counts week_held);
# days = consecutive days a habit is done (counts habit_done, with habit); iso_weeks = consecutive calendar weeks (Monday to
# Sunday) holding the fact. history_twin_counts (a starts_at badge): the fact kind of the Proof badge it widens; a history
# crossing is paid only when that kind alone had not reached the tier (D14).
# TIERS ARE APPEND-ONLY once the catalogue switch is on (rule 21, career/tiers.lock.json): a tier's place in the list is its
# award's id, so add a new tier at the END; never insert, reorder or remove one. A tier's at and xp may still change.
# Names, tiers and XP are drafts (2026-10-17): change them freely; never change an id.


# ── Consistency ───────────────────────────────────────────────────────────────────────────────────────────────────

[badge.held_weeks]
name = "Hold Serve"
meaning = "consistency"
kind = "best_run"
counts = "week_held"
run = "plan_weeks"
caption = "{n} weeks held in a row. You keep showing up."
free = false
origin = "new"
tiers = [
  { at = 4, metal = "bronze", xp = 200, size = "highlight" },
  { at = 8, metal = "silver", xp = 400, size = "highlight" },
  { at = 12, metal = "emerald", xp = 600, size = "milestone" },
  { at = 24, metal = "amethyst", xp = 1200, size = "milestone" },
  { at = 52, metal = "prismatic", xp = 2500, size = "legend" },
]



