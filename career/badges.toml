# ── Proof's milestone families ──────────────────────────────────────────────────────────────────────────────────────
# One badge per family: its marks (I, II, III …) are the tiers, on the metals in order. at = the mark's need,
# xp = what Proof pays today (XP_SYSTEM.md §4.6), size follows Proof's tier (week win, long highlight, rare milestone).
# proof_codes are Proof's own codes, in mark order. proof_measure is how Proof counts the family (hab_bonus_xp()'s
# milestones: streak:<habit> a run of days, daysHit:<habit> days done, daysWith3 days with three habits done, perfectDays,
# comebackRun the longest run after a comeback, comebacksStuck comebacks held comeback_stick days): Career Mode pays
# Proof's milestones from these entries, so at, xp and proof_measure must stay equal to Proof's (check_career.py).

