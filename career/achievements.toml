# Career Mode · achievements
#
# An achievement is a moment reached once. It never repeats (a moment that comes back in steps is a badge).
# Names, XP and sizes are drafts (2026-10-17): change them freely; never change an id.
# The catalogue switch keys (retire_at, starts_at, superseded_by) work as in badges.toml; an achievement may be superseded by a badge.
# test (phase 3, rule 18) says how the server decides it, and carries that test's own keys; rule stays as the human text:
#   first (reads a fact: the first one) · proof (proof_measure + proof_need, as Proof counts it) · goals (goals = [{ kind, need }], as
#   habits.html EVENTS) · cycle_all_held · cycle_by_the_book · cycle_with_broken · runs_together (habits, run) · best_value (at) ·
#   patterns_in_cycle (groups) · cycle_proving (bests, retests) · run_regained (away_weeks) · total (at: the at-th fact read,
#   counted as a badge counts it, a capped kind only as paid) · best_run (at: weeks held in a row, reads week_held) ·
#   month_held (weeks: a calendar month whose training weeks were all held, at least that many, once the month is over)


