# ── Version 10 (2026-10-20): AA Proof's ladders ────────────────────────────────────────────────────────────
# Amir, 2026-10-20: "i used to have loads of achievements related to my habits in proof ... i want them back audited and
# added to ones i have now in the right place", then "lets have 3 rungs, 5 core habits / but have some about days that
# count, perfect days, days in row / we dont want duplicates ofcourse", and the names in Proof's own caps.
#
# AA Proof had 31 of these in FAMILIES: one name you could earn again at a higher bar. The cut (stage78) took them out as
# BADGES and nothing replaced them, so the only habit achievements left were the five month-long `goals` ones and three
# standalones. Version 9 added ten plain ones that morning; this version makes those ten the FIRST RUNG of the families
# they always belonged to (a rename only — same ids, same XP, every award already minted untouched) and builds the rest
# of the ladder on top.
#
# Two rules the ladder keeps, both AA Proof's:
#   1. Inside a family, a higher mark ALWAYS pays more than the one below it.
#   2. Whichever habit an athlete favours, there is always a next rung in something they actually do.
# And one rule this app adds: a week, three weeks, two months — one shape for all four daily habits, so the manual can say
# it in a line instead of a table.
#
# ⚠️ THE SESSION STOPS AT TWO RUNGS, ON PURPOSE. Proof's HEAVY METAL went to 30 days running, which is an app paying an
# athlete to skip every rest day a coach wrote for them. Three days and five days are a block; past that the ladder is
# Century's marks (25 · 50 · 100 · 200 · 500 sessions) and THE MACHINIST at 150, and a third rung here would pay twice for
# one day's work.
#
# ⚠️ Every entry here is origin = "new", including the ones wearing Proof's names. origin = "proof" is not a label, it is
# a claim career_compare() checks: it means AA Proof's own client pays this too. These rows AA Proof never knew.
#
# Nothing here needed new SQL — career_measures() has always counted all of it — except `dayStreak`'s wake-up
# (supabase/stage94_daystreak_wake.sql) and one word in scripts/check_career.py, which refused `qualify` in a
# proof_measure although career_proof_key() has always named it.

[achievement.human_sprinkler_2]
name = "HUMAN SPRINKLER II"
meaning = "consistency"
reads = "proof"
test = "proof"
proof_code = "ev_sprinkler2"
