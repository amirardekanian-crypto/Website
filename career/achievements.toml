# Career Mode · achievements
#
# An achievement is a moment reached once. It never repeats (a moment that comes back in steps is a badge).
# Names, XP and sizes are drafts (2026-10-17): change them freely; never change an id.
# The catalogue switch keys (retire_at, starts_at, superseded_by) work as in badges.toml; an achievement may be superseded by a badge.


