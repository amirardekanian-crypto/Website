# ── Proof's one-off milestones ──────────────────────────────────────────────────────────────────────────────────────
# The way in and two trophies: the three Proof milestones that are not a family (no Roman numeral, on purpose).
# The other 29 are the tiers of the badge families in badges.toml. xp and caption are Proof's own, size follows its tier.
# proof_measure and proof_need are how Proof counts it (as in badges.toml); they must stay equal to Proof's.

[achievement.first_blood]
name = "FIRST BLOOD"
meaning = "commitment"
reads = "proof"
