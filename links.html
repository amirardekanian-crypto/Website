<style>
  :root{
    --green:#0E4A36; --green-2:#156A4D; --clay:#C7552F; --clay-2:#E06B43;
    --paper:#FAF7F2; --paper-2:#F1ECE3; --card:#FFFFFF; --ink:#1A1A1A; --ink-2:#5C5C5C;
    --line:#E7E2D9;
    --fa:'Vazirmatn',sans-serif; --disp:'Barlow Condensed',sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--fa); color:#fff; min-height:100vh; min-height:100dvh;
    background:radial-gradient(120% 90% at 80% 0%,#155b43 0%,var(--green) 55%,#0a3527 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:56px 22px 34px;
  }
  .wrap{width:100%; max-width:430px; display:flex; flex-direction:column; align-items:center; flex:1}

  .mark{
    width:84px; height:84px; background:#fff; border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 34px rgba(0,0,0,.28);
    animation:pop .8s var(--ease) both;
  }
  .mark img{width:56px; height:56px; display:block}

  h1{font-weight:900; font-size:30px; margin-top:20px; animation:rise .8s var(--ease) .08s both}
  .role{font-weight:500; font-size:16px; color:rgba(255,255,255,.72); margin-top:6px; animation:rise .8s var(--ease) .14s both}
  .mantra{
    font-weight:700; font-size:18px; margin-top:16px; line-height:1.9; text-align:center;
    animation:rise .8s var(--ease) .2s both;
  }
  .mantra .clay{color:var(--clay-2)}

  .links{width:100%; margin-top:30px; display:flex; flex-direction:column; gap:14px}
  .link{
    display:flex; align-items:center; gap:16px; text-decoration:none;
    border-radius:22px; padding:18px 22px;
    transition:transform .15s var(--ease), box-shadow .2s;
  }
  .link:active{transform:scale(.98)}
  @media (hover:hover){ .link:hover{transform:translateY(-3px)} }
  .link .txt{flex:1; min-width:0}
  .link .t{font-weight:800; font-size:19px; line-height:1.4}
  .link .s{font-weight:500; font-size:13.5px; opacity:.78; margin-top:3px; line-height:1.7}
  .link .arr{font-size:20px; opacity:.85; flex:none}

  .link-primary{
    background:var(--clay); color:#fff;
    box-shadow:0 12px 32px rgba(199,85,47,.34);
    animation:rise .8s var(--ease) .28s both;
  }
  .link-card{
    background:var(--card); color:var(--ink);
    box-shadow:0 10px 26px rgba(0,0,0,.18);
    animation:rise .8s var(--ease) .36s both;
  }
  .link-card .s{color:var(--ink-2); opacity:1}
  .link-card .badge{
    flex:none; font-weight:800; font-size:12px; color:#fff; background:var(--green);
    border-radius:100px; padding:5px 12px;
  }
  .link-ghost{
    background:rgba(255,255,255,.07); color:#fff;
    border:1px solid rgba(255,255,255,.22);
    animation:rise .8s var(--ease) .44s both;
  }

  footer{
    margin-top:40px; text-align:center;
    animation:rise .8s var(--ease) .52s both;
  }
  .handle{
    direction:ltr; font-family:var(--disp); font-weight:700; font-size:17px;
    color:rgba(255,255,255,.85); text-decoration:none; display:inline-block;
  }
  .site{
    direction:ltr; font-family:var(--disp); font-weight:700; font-size:13px;
    color:rgba(255,255,255,.5); margin-top:6px;
  }
  .en{margin-top:14px}
  .en a{
    direction:ltr; display:inline-block; font-family:var(--disp); font-weight:700; font-size:14px;
    color:rgba(255,255,255,.6); text-decoration:none; border-bottom:1px solid rgba(255,255,255,.25);
    padding-bottom:2px;
  }

  @keyframes rise{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
  @keyframes pop{from{opacity:0; transform:scale(.7)} to{opacity:1; transform:scale(1)}}
</style>
</head>

  <nav class="links" aria-label="لینک‌ها">
    <a class="link link-primary" href="/form-fa.html">
      <span class="txt">
        <span class="t" style="display:block">شروع کن</span>
        <span class="s" style="display:block">برنامه‌ی اختصاصی · اپ · آپدیتِ هفتگی</span>
      </span>
      <span class="arr">←</span>
    </a>

    <a class="link link-card" href="/proof.html">
      <span class="txt">
        <span class="t" style="display:block">AA Proof — اپِ عادت‌ها</span>
        <span class="s" style="display:block">۲۳ ساعتِ بیرونِ باشگاه رو ثبت کن</span>
      </span>
      <span class="badge">رایگان</span>
    </a>

    <a class="link link-ghost" href="/index-fa.html">
      <span class="txt">
        <span class="t" style="display:block">سایت</span>
        <span class="s" style="display:block">همه‌چیز درباره‌ی برنامه و روشِ کار</span>
      </span>
      <span class="arr">←</span>
    </a>
  </nav>

  <footer>
    <a class="handle" href="https://www.instagram.com/amirardekanian" rel="me">@amirardekanian</a>
    <div class="site">AMIRARDEKANI.COM</div>
    <div class="en"><a href="/">Tennis &amp; padel players — English site →</a></div>
  </footer>

</div>
</body>
</html>
