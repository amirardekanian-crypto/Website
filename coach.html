<!DOCTYPE html>
<!--
  THE COACH'S BOX — coach.html
  Amir's private mission control for the whole operation: coached athletes
  (program.html / session_history) AND the Proof habit crew (habits.html).

  Access: Google sign-in locked to the coach email (UX gate only — Row Level
  Security in the database is the real gate; every coach-only table policy and
  RPC checks auth.jwt()->>'email').

  ⚠ SCORING INVARIANT: this page never computes XP, levels, streaks or day
  scores itself. Proof is already scored twice (habits.html client + Supabase
  plpgsql) and a third scorer would drift. The dashboard shows only:
    - raw presence facts (a day's hab_log entry is a non-empty object — the
      same test contact_list() uses), and
    - numbers returned by the server's own scorers (hab_season_level,
      leaderboard_top, contact_list).

  Preview without signing in: coach.html?demo=1 renders synthetic data.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Coach's Box</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E4A36">
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #FAF7F2; --card: #FFFFFF; --ink: #1A1A1A;
    --court: #0E4A36; --court-deep: #0B3B2B; --court-100: rgba(14,74,54,0.08);
    --clay: #C7552F; --clay-100: rgba(199,85,47,0.10);
    --ochre: #A8741C; --ochre-100: rgba(168,116,28,0.12);
    --line: #E4DCCC; --rule: rgba(26,26,26,0.08);
    --muted: rgba(26,26,26,0.56); --muted-soft: rgba(26,26,26,0.42);
    --track: rgba(26,26,26,0.10);
    --shadow: 0 10px 24px -18px rgba(14,74,54,0.35);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--paper); color: var(--ink); font-family: 'Barlow', system-ui, sans-serif;
         font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--court); outline-offset: 2px; border-radius: 6px; }

  .hd { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; }
  .mono { font-family: 'Space Mono', ui-monospace, Menlo, monospace; }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }

  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } scroll-behavior: auto; }

  /* ── Top bar ── */
  .topbar { position: sticky; top: 0; z-index: 60; background: var(--court);
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 13px 22px; }
  .topbar::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--clay); }
  .brand { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .18em;
           color: #fff; text-decoration: none; text-transform: uppercase; white-space: nowrap; }
  .brand span { opacity: .6; font-weight: 400; }
  .topbar .right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .06em; color: rgba(255,255,255,.75);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbtn { font-size: 12px; font-weight: 600; color: #fff; border: 1px solid rgba(255,255,255,.4);
          padding: 6px 12px; border-radius: 999px; white-space: nowrap; transition: background .15s, border-color .15s; }
  .tbtn:hover { background: rgba(255,255,255,.12); border-color: #fff; }
  /* The signed-in address is reassurance, not navigation — drop it before it
     crushes the brand on a phone. */
  @media (max-width: 560px) { .who { display: none; } }

  /* ── Tab rail ── */
  .rail { position: sticky; top: 51px; z-index: 55; background: var(--paper);
          border-bottom: 1px solid var(--line); }
  .rail-in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 8px; align-items: center;
             overflow-x: auto; scrollbar-width: none; }
  .rail-in::-webkit-scrollbar { display: none; }
  .tab { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
         font-size: 16px; color: var(--muted); padding: 7px 16px; border-radius: 999px; border: 1px solid transparent;
         display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: color .15s, background .15s; }
  .tab:hover { color: var(--ink); background: var(--court-100); }
  .tab.active { background: var(--court); color: #fff; }
  .tab .n { font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; background: var(--clay); color: #fff;
            min-width: 19px; text-align: center; padding: 2px 6px; border-radius: 999px; line-height: 1.2; }
  .tab.active .n { background: rgba(255,255,255,.22); }
  .rail-spacer { flex: 1; }
  .refresh { font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 12px; border-radius: 999px;
             border: 1px solid var(--line); background: var(--card); white-space: nowrap; }
  .refresh:hover { color: var(--court); border-color: var(--court); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 90px; }

  /* ── Login gate ── */
  .gate { max-width: 430px; margin: 14vh auto; text-align: center; background: var(--card);
          border: 1px solid var(--line); border-radius: 24px; padding: 44px 34px; box-shadow: var(--shadow); }
  .gate .mark { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .3em;
                color: var(--clay); margin-bottom: 14px; }
  .gate h1 { font-size: 38px; line-height: .95; margin-bottom: 10px; }
  .gate p { color: var(--muted); font-size: 14px; margin-bottom: 26px; line-height: 1.55; }
  .gate .err { color: var(--clay); font-size: 13px; margin-top: 16px; min-height: 18px; }

  .btn { font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--card);
         padding: 9px 18px; border-radius: 999px; transition: border-color .15s, background .15s, color .15s; }
  .btn:hover { border-color: var(--court); color: var(--court); }
  .btn.primary { background: var(--court); border-color: var(--court); color: #fff; }
  .btn.primary:hover { background: var(--court-deep); color: #fff; }
  .btn.clay { background: var(--clay); border-color: var(--clay); color: #fff; }
  .btn.clay:hover { opacity: .92; color: #fff; }
  .btn.danger { color: var(--clay); }
  .btn.danger:hover { border-color: var(--clay); background: var(--clay-100); }
  .btn.sm { font-size: 12px; padding: 5px 12px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .loading { text-align: center; color: var(--muted); padding: 70px 0; }
  .spinner { width: 34px; height: 34px; border-radius: 999px; border: 3px solid var(--track);
             border-top-color: var(--court); margin: 0 auto 14px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Scoreboard hero (TODAY) ── */
  .board { position: relative; overflow: hidden; border-radius: 26px; color: #fff; padding: 26px 28px 24px;
           background: radial-gradient(120% 160% at 12% 0%, #14684C 0%, var(--court) 46%, var(--court-deep) 100%);
           box-shadow: var(--shadow); animation: riseIn .4s cubic-bezier(.16,1,.3,1) both; }
  .board::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--clay); }
  .board-top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .board-date { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
                color: rgba(255,255,255,.72); }
  .board-season { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
                  color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
                  padding: 5px 12px; border-radius: 999px; }
  .board-season b { color: #FFD9C9; font-weight: 700; }
  .board h1 { font-size: clamp(34px, 5vw, 52px); line-height: .92; letter-spacing: -.01em; margin: 14px 0 20px; }
  .board h1 span { color: rgba(255,255,255,.5); }
  .counters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .counter { display: block; text-decoration: none; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
             border-radius: 18px; padding: 13px 16px 12px; transition: background .15s, transform .15s; }
  .counter:hover { background: rgba(255,255,255,.14); transform: translateY(-2px); }
  .counter .n { font-family: 'Space Mono', monospace; font-size: 30px; font-weight: 700; line-height: 1; }
  .counter .n small { font-size: 15px; color: rgba(255,255,255,.55); }
  .counter .l { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
                color: rgba(255,255,255,.66); margin-top: 6px; }
  .counter.hot .n { color: #FFB99F; }
  @media (max-width: 760px) { .counters { grid-template-columns: repeat(2, 1fr); } }

  /* ── Panels ── */
  .cols { display: grid; grid-template-columns: 7fr 5fr; gap: 16px; margin-top: 16px; align-items: start; }
  .colstack { display: grid; gap: 16px; }
  /* Grid items default to min-width:auto, so one nowrap label inside a panel
     can push the whole column past its track and scroll the page sideways. */
  .cols > *, .colstack > *, .counters > * { min-width: 0; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px;
           box-shadow: var(--shadow); animation: riseIn .4s cubic-bezier(.16,1,.3,1) both; }
  .panel + .panel { margin-top: 0; }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .phead .t { font-size: 21px; }
  .phead .r { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .psub { font-size: 12.5px; color: var(--muted); margin: -8px 0 12px; }

  .empty { color: var(--muted); font-size: 13.5px; padding: 10px 0 4px; }
  /* ── Intake (coaching apply-form submissions) ── */
  .intake-card { border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; background: var(--card); overflow: hidden; }
  .intake-card[open] { border-color: var(--court); }
  .intake-card.archived { opacity: .7; }
  .intake-card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .intake-card > summary::-webkit-details-marker { display: none; }
  .intake-card > summary:hover { background: var(--court-100); }
  .intake-card .ava { width: 30px; height: 30px; border-radius: 999px; background: var(--court); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
  .intake-card .i-name { font-weight: 700; font-size: 15px; }
  .intake-card .i-when { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .ipill { font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
  .ipill.en { background: var(--court-100); color: var(--court); }
  .ipill.fa { background: var(--clay-100); color: var(--clay); }
  .ipill.prog { background: var(--court); color: #fff; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .i-body { padding: 12px 14px 14px; border-top: 1px solid var(--rule); }
  .i-contact { font-size: 13px; margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .i-contact a { color: var(--court); border-bottom: 1px solid var(--court-100); }
  .i-contact .dot { color: var(--muted-soft); }
  .i-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .arch-toggle { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }

  /* ── Needs you ── */
  .need { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
          padding: 10px 12px; border-radius: 14px; border: 1px solid var(--rule); margin-bottom: 8px;
          background: var(--paper); transition: border-color .15s, transform .12s; }
  .need:hover { border-color: var(--court); transform: translateY(-1px); }
  .need:last-child { margin-bottom: 0; }
  .need .dot { flex: none; width: 8px; height: 8px; border-radius: 999px; }
  .need .dot.clay { background: var(--clay); } .need .dot.ochre { background: var(--ochre); }
  .need .b { flex: 1; min-width: 0; }
  .need .n { font-weight: 700; font-size: 13.5px; }
  .need .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .need .go { flex: none; font-size: 11px; color: var(--muted-soft); }

  /* ── The wall ── */
  .mic { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; background: var(--paper); margin-bottom: 14px; }
  .mic .cap { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .mic textarea { width: 100%; min-height: 44px; resize: vertical; border: 1px solid var(--line); border-radius: 10px;
                  background: var(--card); padding: 9px 11px; font-size: 14px; line-height: 1.45; }
  .mic textarea:focus { border-color: var(--court); }
  .mic .row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .mic .count { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--muted-soft); margin-left: auto; }
  .wallday { margin: 16px 0 8px; display: flex; align-items: center; gap: 10px; }
  .wallday .d { font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .wallday::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
  .wline { display: flex; gap: 11px; padding: 9px 4px; border-radius: 12px; align-items: flex-start; }
  .wline.hid { opacity: .45; }
  .wline .ava { flex: none; width: 34px; height: 34px; border-radius: 999px; background: var(--court); color: #fff;
                display: flex; align-items: center; justify-content: center;
                font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; }
  .wline .bd { flex: 1; min-width: 0; }
  /* NOT .who — that is the topbar's signed-in label (white, nowrap) and it
     would paint these names white-on-white. */
  .wline .wtop { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .wline .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px;
               text-transform: uppercase; letter-spacing: .02em; }
  .wline .pct { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--court); font-weight: 700; }
  .wline .txt { font-size: 14px; line-height: 1.45; margin-top: 1px; overflow-wrap: anywhere; }
  .wline .hidetag { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--clay); text-transform: uppercase; }
  .wline .modbtn { flex: none; font-size: 11px; font-weight: 600; color: var(--muted-soft); padding: 3px 9px;
                   border: 1px solid var(--rule); border-radius: 999px; }
  .wline .modbtn:hover { color: var(--clay); border-color: var(--clay); }
  .wline.coachline { background: var(--court); color: #fff; border-radius: 14px; padding: 11px 13px; }
  .wline.coachline .ava { background: var(--clay); }
  .wline.coachline .nm, .wline.coachline .pct { color: #FFD9C9; }
  .showweek { width: 100%; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted);
              padding: 9px 0 3px; }
  .showweek:hover { color: var(--court); }

  /* ── Quest panel ── */
  .questrun { border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; background: var(--paper); }
  .questrun .qtop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
  .questrun .qday { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: var(--clay); }
  .qchip { display: flex; align-items: baseline; gap: 9px; padding: 7px 0; border-top: 1px solid var(--rule); }
  .qchip .qn { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; font-size: 15px; letter-spacing: .03em; }
  .qchip .qd { font-size: 12px; color: var(--muted); flex: 1; }
  .qchip .qx { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--court); white-space: nowrap; }
  .qpick { border-top: 1px solid var(--rule); margin-top: 12px; padding-top: 12px; }
  .qopt { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px; border-radius: 10px; cursor: pointer; }
  .qopt:hover { background: var(--court-100); }
  .qopt input { accent-color: var(--court); transform: translateY(1px); }
  .qopt .qn { font-weight: 700; font-size: 13px; }
  .qopt .qd { font-size: 12px; color: var(--muted); flex: 1; }
  .qopt .qx { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--muted); white-space: nowrap; }

  /* ── Pulse (7-day presence) ── */
  .pulse { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 8px 6px;
           border-radius: 12px; border-bottom: 1px solid var(--rule); }
  .pulse:last-of-type { border-bottom: 0; }
  .pulse:hover { background: var(--court-100); }
  .pulse .nm { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse .nm small { display: block; font-weight: 400; font-size: 11px; color: var(--muted-soft); }
  .dots { display: inline-flex; gap: 4px; flex: none; }
  .dt { width: 13px; height: 13px; border-radius: 5px; background: var(--track); }
  .dt.on { background: var(--court); }
  .dt.today { box-shadow: inset 0 0 0 2px var(--clay); background: var(--card); }
  .dt.today.on { background: var(--court); box-shadow: inset 0 0 0 2px var(--clay); }
  .pulse .tag { flex: none; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .pulse .tag.warn { color: var(--clay); font-weight: 700; }

  /* ── Chips ── */
  .chip { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
          padding: 3px 9px; border-radius: 999px; background: var(--track); color: var(--muted); white-space: nowrap; }
  .chip.court { background: var(--court-100); color: var(--court); }
  .chip.clay { background: var(--clay-100); color: var(--clay); }
  .chip.ochre { background: var(--ochre-100); color: var(--ochre); }
  .chip.solid { background: var(--court); color: #fff; }
  .lvchip { font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; color: var(--court);
            border: 1px solid var(--court); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }

  /* ── Roster ── */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .controls input[type=search], .controls select { font-size: 14px; padding: 9px 14px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--card); }
  .controls input[type=search] { flex: 1; min-width: 170px; }
  .controls input[type=search]:focus, .controls select:focus { border-color: var(--court); }
  .roster { display: flex; flex-direction: column; gap: 9px; }
  .ath { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card);
         border: 1px solid var(--line); border-radius: 18px; padding: 13px 16px;
         transition: border-color .15s, transform .12s, box-shadow .15s; }
  .ath:hover { border-color: var(--court); transform: translateY(-1px); box-shadow: var(--shadow); }
  .ath.flag { border-left: 3px solid var(--clay); }
  .ath .ava { flex: none; width: 40px; height: 40px; border-radius: 999px; background: var(--court); color: #fff;
              display: flex; align-items: center; justify-content: center;
              font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; }
  .ath.freeath .ava { background: var(--ochre); }
  .ath .main { flex: 1; min-width: 0; }
  .ath .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 19px; text-transform: uppercase;
             letter-spacing: .01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ath .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .ath .side { flex: none; display: flex; align-items: center; gap: 14px; }
  .ath .side .tag { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); text-align: right; }
  .ath .side .tag.warn { color: var(--clay); font-weight: 700; }
  @media (max-width: 700px) { .ath .side .dots { display: none; } }

  /* ── Detail ── */
  .back { display: inline-block; font-size: 13px; color: var(--court); font-weight: 700; margin-bottom: 14px; }
  .dethead { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .dethead h2 { font-size: 40px; line-height: .95; }
  .dethead .sub { font-size: 13px; color: var(--muted); margin-top: 5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

<script>
// --- config -----------------------------------------------------------------
const SB_URL = 'https://bvipfipbdcyqnbczjmaq.supabase.co';
const SB_KEY = 'sb_publishable_BuDVTTC1E0eg3wc7F1Pcig_1A_tqYCy';
const COACH_EMAIL = 'amirardekanian@gmail.com';   // UX-only; the DB (RLS) is the real gate
const SITE = 'https://www.amirardekani.com';
const COACH_NOTE_ID = '__coach__';                // hab_notes row id the coach line lives under
const AMIR_ATHLETE_ID = 'amir_ardekani';          // the board is fetched through Amir's own athlete identity
const QUIET_SESSION_DAYS = 7;                     // coached athlete idle threshold
const QUIET_HABIT_DAYS = 3;                       // Proof athlete silent threshold
const UPGRADE_DAYS = 14;                          // free athlete with this many logged days = upgrade candidate
// "Waiting on you" means this fortnight. Notes are only marked read when the
// coach acts on them, so without a window the counter silently accumulates
// every note ever written (51 of them, back to June, on the day this shipped)
// and the headline number stops meaning anything. Older ones become a backlog
// row you can discharge in one tap.
const NEEDS_WINDOW_DAYS = 14;

const DEMO = new URLSearchParams(location.search).has('demo');
const sb = DEMO ? null : supabase.createClient(SB_URL, SB_KEY);
const $ = (id) => document.getElementById(id);

// --- tiny helpers -----------------------------------------------------------
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function jparse(v) { if (v == null) return null; if (typeof v === 'object') return v; try { return JSON.parse(v); } catch { return null; } }
function pad2(n) { return String(n).padStart(2, '0'); }
function dkey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayKey() { return dkey(new Date()); }
function addDays(iso, n) { const p = String(iso).split('-'); const d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return dkey(d); }
function pDate(iso) { const p = String(iso).split('-'); return new Date(+p[0], (+p[1]) - 1, +p[2]); }
function daysBetween(isoA, isoB) { return Math.round((pDate(isoB) - pDate(isoA)) / 86400000); }
function timeAgo(iso) {
  if (!iso) return '—';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; return d + ' days ago';
}
function daysSince(iso) { return iso ? Math.floor((Date.now() - new Date(iso)) / 86400000) : 9999; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function prettyDate(iso) {
  if (!iso) return '';
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  return `${DOWS[d.getDay()]} ${+p[2]} ${MONTHS[+p[1] - 1]} ${p[0]}`;
}
function wallDayLabel(iso) {
  const t = todayKey();
  if (iso === t) return 'Today';
  if (iso === addDays(t, -1)) return 'Yesterday';
  return prettyDate(iso);
}
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}
function unslug(s) { return String(s || '').replace(/_/g, ' '); }
function round1(n) { return Math.round(n * 10) / 10; }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('on'), 2600);
}
function copyText(t, btn) {
  navigator.clipboard.writeText(t).then(() => {
    toast('Copied');
    if (btn) { const o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = o, 1400); }
  }, () => alert('Copy failed — here it is:\n\n' + t));
}
function isPartialStatus(s) { return String(s || '').toLowerCase().indexOf('partial') === 0; }
function ctxLabel(ctx) { const m = String(ctx || '').match(/^session:(\d+):/); return m ? 'Day ' + m[1] : ''; }
function sessionHasNote(s) { return !!((s.day_note && s.day_note.trim()) || (s.summary && /\n\s+Note:/.test(s.summary))); }
function sessionNeedsReply(s) { return sessionHasNote(s) && (s.coach_status || 'new') === 'new'; }
function sessionNoteText(s) {
  if (s.day_note && s.day_note.trim()) return s.day_note.trim();
  const notes = [];
  (s.summary || '').split('\n').forEach(ln => { const m = ln.match(/^\s+Note:\s*(.+)/); if (m) notes.push(m[1].trim()); });
  return notes.join(' · ');
}

// --- store ------------------------------------------------------------------
// One load, one in-memory store, views render from it. refetch(parts) updates
// slices after a write. All Proof numbers here are presence facts or server
// RPC results — never scored locally (see the header comment).
const S = {
  ready: false,
  prog: [],        // athlete_progress rows
  hist: [],        // session_history rows (full)
  keys: {},        // athlete_id -> secret_key
  msgs: [],        // messages rows
  notes: [],       // hab_notes rows, last 7 days, hidden included
  contacts: [],    // contact_list() rows
  intake: [],      // intake_list() rows — coaching apply-form submissions
  rules: null,     // xp_rules.rules jsonb
  seasons: [],     // seasons rows, newest first
  titles: [],      // hab_titles recent
  optin: {},       // athlete_id -> {display_name, title}
  programs: {},    // athlete_id -> data/<id>.json (or null)
  ath: {},         // assembled per-athlete records
  levels: {},      // athlete_id -> server season level
  board: { season: null, week: null },
  callLogs: {},    // athlete_id -> rows (fetched on detail)
};

async function loadAll() {
  if (DEMO) { demoStore(); S.ready = true; return; }
  const [prog, hist, keys, msgs, notes, contacts, rules, seasons, titles, optin, intake] = await Promise.all([
    sb.from('athlete_progress').select('athlete_id, athlete_name, data, updated_at'),
    sb.from('session_history').select('*'),
    sb.from('athlete_keys').select('athlete_id, secret_key'),
    sb.from('messages').select('*').order('created_at', { ascending: true }),
    sb.from('hab_notes').select('*').gte('day', addDays(todayKey(), -7)),
    sb.rpc('contact_list'),
    sb.from('xp_rules').select('rules').eq('id', 1).maybeSingle(),
    sb.from('seasons').select('*').order('starts_on', { ascending: false }),
    sb.from('hab_titles').select('*').order('earned_on', { ascending: false }).limit(30),
    sb.from('leaderboard_optin').select('athlete_id, display_name, title'),
    sb.rpc('intake_list'),
  ]);
  const firstErr = [prog, hist, keys, msgs, notes, rules, seasons, titles, optin].find(r => r && r.error);
  if (firstErr) throw new Error(firstErr.error.message);
  S.prog = prog.data || [];
  S.hist = hist.data || [];
  S.keys = {}; (keys.data || []).forEach(r => S.keys[r.athlete_id] = r.secret_key);
  S.msgs = msgs.data || [];
  S.notes = notes.data || [];
  S.contacts = (contacts && contacts.data) || [];   // RPC may be missing pre-stage16; degrade quietly
  S.rules = (rules.data && rules.data.rules) || null;
  S.seasons = seasons.data || [];
  S.titles = titles.data || [];
  S.optin = {}; (optin.data || []).forEach(r => S.optin[r.athlete_id] = r);
  S.intake = (intake && intake.data) || [];   // RPC may be missing pre-stage27; degrade quietly
  await loadPrograms();
  assemble();
  S.ready = true;
}

// Refetch just the slices a write touched, then re-render.
async function refetch(parts) {
  if (DEMO) { render(); return; }
  const jobs = [];
  if (parts.includes('notes')) jobs.push(sb.from('hab_notes').select('*').gte('day', addDays(todayKey(), -7)).then(r => { if (!r.error) S.notes = r.data || []; }));
  if (parts.includes('rules')) jobs.push(sb.from('xp_rules').select('rules').eq('id', 1).maybeSingle().then(r => { if (!r.error) S.rules = (r.data && r.data.rules) || null; }));
  if (parts.includes('contacts')) jobs.push(sb.rpc('contact_list').then(r => { if (!r.error) S.contacts = r.data || []; }));
  if (parts.includes('intake')) jobs.push(sb.rpc('intake_list').then(r => { if (!r.error) S.intake = r.data || []; }));
  if (parts.includes('hist')) jobs.push(sb.from('session_history').select('*').then(r => { if (!r.error) { S.hist = r.data || []; assemble(); } }));
  if (parts.includes('msgs')) jobs.push(sb.from('messages').select('*').order('created_at', { ascending: true }).then(r => { if (!r.error) { S.msgs = r.data || []; assemble(); } }));
  await Promise.all(jobs);
  render();
}

// Pull each athlete's program file (data/<id>.json) in parallel — names, tier,
// sessions/week for adherence, and the prescribed plan for the detail view.
async function loadPrograms() {
  const ids = new Set();
  S.prog.forEach(r => ids.add(r.athlete_id));
  S.hist.forEach(r => ids.add(r.athlete_id));
  Object.keys(S.keys).forEach(id => ids.add(id));
  S.contacts.forEach(c => ids.add(c.athlete_id));
  const list = [...ids];
  const files = await Promise.all(list.map(id =>
    fetch(`data/${encodeURIComponent(id)}.json`).then(r => r.ok ? r.json() : null).catch(() => null)));
  S.programs = {};
  list.forEach((id, i) => S.programs[id] = files[i]);
}

// The same "counts as a logged day" test contact_list() uses server-side: the
// day's value is an object with at least one key. Presence, not score.
function habDaysOf(blob, id) {
  const raw = blob ? blob[id + '_hab_log'] : null;
  const log = jparse(raw);
  const days = {};
  if (log && typeof log === 'object') {
    Object.keys(log).forEach(k => {
      const v = log[k];
      if (v && typeof v === 'object' && Object.keys(v).length) days[k] = true;
    });
  }
  return days;
}

function assemble() {
  const map = {};
  const get = (id) => (map[id] = map[id] || {
    id, name: id, lastActive: null, sessions: [], finished: 0,
    habDays: {}, habLast: null, isHab: false, contact: null,
    unreadMsgs: 0, toReply: 0,
  });
  S.prog.forEach(r => {
    const a = get(r.athlete_id);
    if (r.athlete_name) a.name = r.athlete_name;
    if (r.updated_at && (!a.lastActive || r.updated_at > a.lastActive)) a.lastActive = r.updated_at;
    a.habDays = habDaysOf(r.data, r.athlete_id);
    const dk = Object.keys(a.habDays).sort();
    a.isHab = dk.length > 0;
    a.habLast = dk.length ? dk[dk.length - 1] : null;
  });
  S.hist.forEach(r => {
    const a = get(r.athlete_id);
    if (r.athlete_name) a.name = r.athlete_name;
    if (r.updated_at && (!a.lastActive || r.updated_at > a.lastActive)) a.lastActive = r.updated_at;
    a.finished++;
    a.sessions.push(r);
  });
  Object.keys(S.keys).forEach(id => get(id));
  S.contacts.forEach(c => { const a = get(c.athlete_id); a.contact = c; });

  Object.values(map).forEach(a => {
    const p = S.programs[a.id];
    if (p && p.athlete) {
      const nm = [p.athlete.firstName, p.athlete.lastName].filter(Boolean).join(' ');
      if (nm) a.name = nm;
    }
    if (a.name === a.id) {
      const o = S.optin[a.id];
      if (o && o.display_name) a.name = o.display_name;
      else if (a.contact && (a.contact.shown_as || a.contact.display_name)) a.name = a.contact.shown_as || a.contact.display_name;
      else a.name = unslug(a.id);
    }
    a.tier = (p && p.tier) === 'free' ? 'free' : (p ? 'coached' : (a.isHab ? 'proof' : 'unknown'));
    a.perWeek = (p && p.workouts && p.workouts.days && p.workouts.days.length) || 0;
    a.onBoard = !!S.optin[a.id];
    a.lastSession = a.sessions.length ? a.sessions.map(s => s.completed_on).sort().slice(-1)[0] : null;
    // Split unanswered notes at the window: `recent` is what "waiting" means
    // anywhere a count is shown; `stale` is backlog. Every note still keeps its
    // own reply buttons on the athlete's file regardless of age.
    const cut = addDays(todayKey(), -NEEDS_WINDOW_DAYS);
    a.needReplySessions = a.sessions.filter(sessionNeedsReply);
    a.needReplyRecent = a.needReplySessions.filter(s => s.completed_on && s.completed_on >= cut);
    a.needReplyStale = a.needReplySessions.length - a.needReplyRecent.length;
    a.unreadMsgs = S.msgs.filter(m => m.athlete_id === a.id && m.sender === 'athlete' && !m.read_by_coach).length;
    a.toReply = a.needReplyRecent.length + a.unreadMsgs;
    const t = todayKey();
    a.habToday = !!a.habDays[t];
    a.hab7 = 0; for (let i = 0; i < 7; i++) if (a.habDays[addDays(t, -i)]) a.hab7++;
    a.habGap = a.isHab ? daysBetween(a.habLast, t) : null;
  });
  S.ath = map;
}

// Server-scored season level per Proof athlete (cached; never computed here).
// One call per athlete is the only way to get an authoritative level keyed by
// athlete_id — leaderboard_top returns display names, and it only covers the
// people who joined the board. Each call re-walks that athlete's whole log, so
// they go out a few at a time rather than as one burst across the roster.
async function loadLevels() {
  if (DEMO || loadLevels._done) return;
  loadLevels._done = true;
  const ids = Object.values(S.ath).filter(a => a.isHab).map(a => a.id);
  const LANES = 6;
  let next = 0;
  const lane = async () => {
    while (next < ids.length) {
      const id = ids[next++];
      try {
        const r = await sb.rpc('hab_season_level', { p_athlete_id: id });
        if (!r.error && r.data != null) S.levels[id] = r.data;
      } catch (e) { /* a missing level just hides the chip */ }
    }
  };
  await Promise.all(Array.from({ length: Math.min(LANES, ids.length) }, lane));
}

// --- season helpers ---------------------------------------------------------
function currentSeason() {
  const t = todayKey();
  const live = S.seasons.filter(s => s.starts_on <= t).sort((a, b) => b.starts_on.localeCompare(a.starts_on));
  return live[0] || null;
}
function seasonDay() {
  const s = currentSeason();
  return s ? daysBetween(s.starts_on, todayKey()) + 1 : null;
}

// --- quest helpers ----------------------------------------------------------
function questPool() { return (S.rules && S.rules.quests) || []; }
function questRuns() { return (S.rules && S.rules.questRuns) || []; }
function activeQuestRun() {
  const t = todayKey();
  const runs = questRuns().filter(r => r.start <= t && t <= addDays(r.start, 6));
  return runs.length ? runs[runs.length - 1] : null;
}
function questById(id) { return questPool().find(q => q.id === id) || { id, note: id, xp: '' }; }

// --- wall helpers -----------------------------------------------------------
function wallLines(daysBack) {
  const floor = addDays(todayKey(), -(daysBack - 1));
  return S.notes.filter(n => n.day >= floor)
    .sort((a, b) => b.day.localeCompare(a.day)
      || (a.athlete_id === COACH_NOTE_ID ? -1 : b.athlete_id === COACH_NOTE_ID ? 1 : 0)
      || String(a.created_at).localeCompare(String(b.created_at)));
}
function coachLine(day) {
  return S.notes.find(n => n.athlete_id === COACH_NOTE_ID && n.day === day) || null;
}
function nameOf(id) { return S.ath[id] ? S.ath[id].name : (S.optin[id] && S.optin[id].display_name) || unslug(id); }

// --- router -----------------------------------------------------------------
const TABS = [
  { id: 'today', label: 'Today' },

function renderRail() {

async function hardRefresh() {

// Who needs the coach, in one list: session notes waiting on a reply, unread
// chat messages, coached athletes gone quiet, Proof athletes gone silent.
function needPanelHtml() {
  const items = [];
  Object.values(S.ath).forEach(a => {
    a.needReplyRecent.forEach(s => items.push({
      sev: 'clay', id: a.id, n: a.name,
      s: `Day ${s.day} note: “${sessionNoteText(s)}”`, sort: 0,
    }));
    if (a.unreadMsgs > 0) items.push({ sev: 'clay', id: a.id, n: a.name, s: `${a.unreadMsgs} unread message${a.unreadMsgs === 1 ? '' : 's'}`, sort: 1 });
  });
  Object.values(S.ath).forEach(a => {
    if (a.tier === 'coached' && a.finished > 0) {
      const idle = daysSince(a.lastSession ? a.lastSession + 'T12:00:00' : null);
      if (idle > QUIET_SESSION_DAYS) items.push({ sev: 'ochre', id: a.id, n: a.name, s: `No session for ${idle} days`, sort: 2 + idle / 100 });
    }
    if (a.isHab && a.habGap >= QUIET_HABIT_DAYS)
      items.push({ sev: 'ochre', id: a.id, n: a.name, s: `Silent on Proof — ${a.habGap} days since a log`, sort: 3 + a.habGap / 100 });
  });
  (S.contacts || []).forEach(c => {
    if (daysSince(c.signed_up) <= 7)
      items.push({ sev: 'ochre', id: c.athlete_id, n: nameOf(c.athlete_id), s: `New signup · ${timeAgo(c.signed_up)}`, sort: 4 });
  });
  items.sort((x, y) => x.sort - y.sort);
  const list = items.slice(0, 10).map(i => `
    <button class="need" onclick="location.hash='a/${encodeURIComponent(i.id)}'">
      <span class="dot ${i.sev}"></span>
      <span class="b"><span class="n">${esc(i.n)}</span><div class="s">${esc(i.s)}</div></span>
      <span class="go">open →</span>

  const stale = Object.values(S.ath).reduce((n, a) => n + a.needReplyStale, 0);

      <span class="b"><span class="n">${stale} older note${stale === 1 ? '' : 's'}</span>

  return `
    <div class="phead"><span class="t hd">Needs you</span><span class="r">${items.length ? items.length + ' open' : ''}</span></div>

// Discharge the backlog in one action. Only touches notes older than the

  if (DEMO) { toast('Demo mode — nothing saved'); return; }

// --- training-load + readiness analytics (ported) ---------------------------
// All derived from session_history. Load uses Foster's session-RPE method
// (load = session RPE × duration in minutes). ACWR = acute (7-day) ÷ chronic
// (28-day weekly average). Hex colours because var() is unreliable in SVG attrs.
const C = { green: '#0E4A36', red: '#C7552F', amber: '#A8741C', grey: '#5C5C5C' };
function dailyLoad(sessions) {
  const m = {};
  sessions.forEach(s => {
    if (s.session_rpe != null && s.duration_min != null && s.completed_on)
      m[s.completed_on] = (m[s.completed_on] || 0) + Number(s.session_rpe) * Number(s.duration_min);
  });
  return m;
}
function computeAcwr(daily, ref) {
  const keys = Object.keys(daily);
  if (!keys.length) return { ratio: null, acute: 0, chronicWeekly: 0, enough: false, spanDays: 0 };
  const r = ref || new Date();
  const refMid = new Date(r.getFullYear(), r.getMonth(), r.getDate());
  let acute = 0, chronic = 0, earliest = null;
  keys.forEach(iso => {
    const d = pDate(iso), diff = Math.floor((refMid - d) / 86400000);
    if (earliest === null || d < earliest) earliest = d;
    if (diff >= 0 && diff < 7)  acute   += daily[iso];
    if (diff >= 0 && diff < 28) chronic += daily[iso];
  });
  const chronicWeekly = chronic / 4;
  const spanDays = earliest !== null ? Math.floor((refMid - earliest) / 86400000) : 0;
  return { ratio: chronicWeekly > 0 ? acute / chronicWeekly : null,
           acute, chronicWeekly, enough: spanDays >= 14 && chronicWeekly > 0, spanDays };
}
function acwrZone(r) {
  if (r == null) return { label: '—', cls: '' };
  if (r > 1.5)  return { label: 'High load', cls: 'red' };
  if (r > 1.3)  return { label: 'Climbing',  cls: 'amber' };
  if (r >= 0.8) return { label: 'Optimal',   cls: 'green' };
  return { label: 'Low load', cls: 'amber' };
}
function readinessSeries(sessions) {
  return sessions
    .map(s => ({ s, rd: jparse(s.readiness) }))
    .filter(x => x.rd && !x.rd.skipped && x.rd.composite != null)
    .map(x => ({ iso: x.s.completed_on, v: Number(x.rd.composite) }))
    .filter(p => p.iso && !isNaN(p.v))
    .sort((a, b) => a.iso.localeCompare(b.iso));
}
function readinessStats(series) {
  if (!series.length) return null;
  const v = series.map(p => p.v), base = v.reduce((a, b) => a + b, 0) / v.length;
  const latest = v[v.length - 1];
  return { baseline: base, latest, delta: latest - base, n: v.length };
}
function weeklyLoad(daily, weeks, ref) {
  const r = ref || new Date();
  const monday = new Date(r.getFullYear(), r.getMonth(), r.getDate());
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const buckets = [];
  for (let i = weeks - 1; i >= 0; i--) { const start = new Date(monday); start.setDate(start.getDate() - i * 7); buckets.push({ start, load: 0 }); }
  Object.keys(daily).forEach(iso => {
    const d = pDate(iso);
    for (let i = buckets.length - 1; i >= 0; i--) { if (d >= buckets[i].start) { buckets[i].load += daily[iso]; break; } }
  });
  return buckets;
}
function adherence(sessions, daysPerWeek, weeks, ref) {
  weeks = weeks || 4;
  if (!daysPerWeek) return null;
  let earliest = null;
  sessions.forEach(s => { if (s.completed_on) { const d = pDate(s.completed_on); if (!earliest || d < earliest) earliest = d; } });
  const r = ref || new Date();
  const refMid = new Date(r.getFullYear(), r.getMonth(), r.getDate());
  if (!earliest) return null;
  const daysActive = Math.floor((refMid - earliest) / 86400000) + 1;
  const effWeeks = Math.max(1, Math.min(weeks, Math.ceil(daysActive / 7)));
  const start = new Date(refMid); start.setDate(start.getDate() - (effWeeks * 7 - 1));
  let done = 0;
  sessions.forEach(s => { if (!s.completed_on) return; const d = pDate(s.completed_on);
    if (d >= start && d <= refMid) done += isPartialStatus(s.status) ? 0.5 : 1; });
  const expected = daysPerWeek * effWeeks;
  return { done, expected, pct: expected > 0 ? Math.round((done / expected) * 100) : null, weeks: effWeeks, perWeek: daysPerWeek };
}
function athleteMetrics(sessions, lastActive, daysPerWeek) {
  const daily = dailyLoad(sessions);
  const rser  = readinessSeries(sessions);
  const loadPts = sessions
    .filter(s => s.session_rpe != null && s.duration_min != null && s.completed_on)
    .slice().sort((a, b) => String(a.completed_on).localeCompare(String(b.completed_on)))
    .map(s => Number(s.session_rpe) * Number(s.duration_min));
  const byRecent = sessions.slice().sort((a, b) => String(b.completed_on).localeCompare(String(a.completed_on)));
  const lastPartial = byRecent.length ? isPartialStatus(byRecent[0].status) : false;
  return { daily, acwr: computeAcwr(daily), rser, readiness: readinessStats(rser),
           adherence: adherence(sessions, daysPerWeek), loadPts, lastPartial,
           daysIdle: daysSince(lastActive), neverActive: !lastActive && !sessions.length };
}

// --- tiny inline-SVG charts (ported) ----------------------------------------
function sparkline(values, color, w, h) {
  w = w || 400; h = h || 40;
  const pts = values.filter(v => v != null && !isNaN(v));
  if (pts.length < 2) return '<span class="muted" style="font-size:11px">not enough data yet</span>';
  const min = Math.min(...pts), max = Math.max(...pts), rng = (max - min) || 1;
  const X = i => (i / (pts.length - 1)) * (w - 2) + 1;
  const Y = v => h - 2 - ((v - min) / rng) * (h - 4);
  const d = pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const lx = X(pts.length - 1), ly = Y(pts[pts.length - 1]);
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}
function barsSVG(buckets, color) {
  const w = 320, h = 96, base = h - 4, top = 8, n = buckets.length || 1;
  const max = Math.max(1, ...buckets.map(b => b.load)), slot = w / n;
  const bars = buckets.map((b, i) => {
    const bh = (b.load / max) * (base - top), x = i * slot + slot * 0.18, bw = slot * 0.64, y = base - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="2" fill="${color}" opacity="${b.load ? 0.85 : 0.18}"></rect>`;
  }).join('');
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}
function lineSVG(series, opts) {
  opts = opts || {};
  const w = 320, h = 96, top = 10, bot = h - 14, left = 4, right = w - 4;
  const yMin = opts.yMin != null ? opts.yMin : 1, yMax = opts.yMax != null ? opts.yMax : 5;
  const X = i => series.length > 1 ? left + (i / (series.length - 1)) * (right - left) : (left + right) / 2;
  const Y = v => bot - ((v - yMin) / ((yMax - yMin) || 1)) * (bot - top);
  const d = series.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const dots = series.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.2" fill="${opts.color}"/>`).join('');
  let baseLine = '';
  if (opts.baseline != null) { const by = Y(opts.baseline).toFixed(1); baseLine = `<line x1="${left}" y1="${by}" x2="${right}" y2="${by}" stroke="${C.grey}" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>`; }
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${baseLine}<path d="${d}" fill="none" stroke="${opts.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function renderCharts(m) {

// --- live-activity decode (ported) ------------------------------------------
function decode(athleteId, blob) {
  const prefix = athleteId + '_';
  const days = {}; const ex = {};
  const day = n => (days[n] = days[n] || {});
  const exer = k => (ex[k] = ex[k] || {});
  Object.keys(blob || {}).forEach(fullKey => {
    if (fullKey.indexOf(prefix) !== 0) return;
    const key = fullKey.slice(prefix.length);
    const val = blob[fullKey];
    let m;
    if ((m = key.match(/^completed_d(\d+)$/)))   { const d = day(m[1]); d.completed = true; d.completedOn = val; }
    else if ((m = key.match(/^srpe_(\d+)$/)))    { day(m[1]).srpe = val; }
    else if ((m = key.match(/^readiness_(\d+)$/))) { day(m[1]).readiness = jparse(val); }
    else if ((m = key.match(/^daynote_(\d+)$/))) { day(m[1]).note = val; }
    else if ((m = key.match(/^setlog_(.+)$/)))   { exer(m[1]).sets = jparse(val) || []; }
    else if ((m = key.match(/^note_(.+)$/)))     { exer(m[1]).note = val; }
    else if ((m = key.match(/^rpe_(.+)$/)))      { exer(m[1]).rpe = val; }
  });
  return { days, ex };
}

function renderLogsByDay(athleteId, history, programDays) {

  const byDay = {};
  history.forEach(s => { (byDay[s.day] = byDay[s.day] || []).push(s); });
  Object.values(byDay).forEach(arr => arr.sort((a, b) => String(b.completed_on).localeCompare(String(a.completed_on))));
  const order = (programDays || []).map(d => Number(d.id));
  const dayNums = Object.keys(byDay).map(Number).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a - b;
  });
  return dayNums.map(d => {
    const sessions = byDay[d];
    const latest = sessions[0];
    const pd = (programDays || []).find(p => Number(p.id) === d);
    const focus = latest.focus || (pd && pd.focusTag) || '';
    const partial = isPartialStatus(latest.status);
    const earlier = sessions.slice(1);
    const needsReply = sessions.some(sessionNeedsReply);
    return `<details class="day-c">
      <summary>
        <div class="day-c-main">

          <div class="day-date">Last done ${esc(prettyDate(latest.completed_on))} · ${partial ? 'Partial' : 'Complete'}${latest.session_rpe != null ? ' · RPE ' + esc(latest.session_rpe) + '/10' : ''}${sessions.length > 1 ? ' · ' + sessions.length + ' logged' : ''}</div>

// --- import a past session from a coach email (ported) ----------------------
function parseSessionEmail(text) {
  const t = String(text || '').replace(/\r/g, '');
  const fs = t.indexOf('Full summary');
  let summary = (fs >= 0 ? t.slice(fs + 'Full summary'.length) : t).replace(/^\s*\n/, '').trim();
  if (summary.indexOf('Exercise log:') < 0 && t.indexOf('Exercise log:') >= 0) summary = t.trim();
  const firstLine = (summary.split('\n')[0] || '');
  const dm = firstLine.match(/Day\s+(\d+)\s*[—–-]?\s*(.*)$/) || t.match(/Day\s+(\d+)\s*[—–-]?\s*([^\n]*)/);
  const day = dm ? Number(dm[1]) : null;
  const focus = dm && dm[2] ? dm[2].trim() : '';
  const grab = re => { const m = t.match(re); return m ? m[1].trim() : ''; };
  const status = grab(/Status:?\s*\n?\s*([^\n]+)/) || 'Complete';
  const rpeM = t.match(/Session RPE:?\s*\n?\s*(\d+(?:\.\d+)?)/i);
  const durM = t.match(/Duration:?\s*\n?\s*(\d+)/i);
  let note = grab(/Notes from athlete\s*\n\s*([^\n]+)/) || grab(/Notes from athlete:\s*\n\s*([^\n]+)/);
  if (/^\(?none\)?$/i.test(note)) note = '';
  let readiness = null;
  const oneLine = t.match(/Composite\s+([\d.]+)\/5\s*·\s*Sleep\s+(\d+)\s*·\s*Energy\s+(\d+)\s*·\s*Soreness\s+(\d+)\s*·\s*Stress\s+(\d+)\s*·\s*Overall\s+(\d+)/i);
  if (oneLine) {
    readiness = { composite: Number(oneLine[1]), sleep: +oneLine[2], energy: +oneLine[3], soreness: +oneLine[4], stress: +oneLine[5], overall: +oneLine[6] };
  } else if (/Readiness[^\n]*skipped/i.test(t)) {
    readiness = { skipped: true };
  } else {
    const comp = t.match(/composite\s+([\d.]+)\/5/i);
    const q = (re) => { const m = t.match(re); return m ? +m[1] : null; };
    const sleep = q(/sleep last night:?\s*(\d+)/i), energy = q(/energy levels[^:]*:?\s*(\d+)/i),
          soreness = q(/sore[^:]*:?\s*(\d+)/i), stress = q(/stress[^:]*:?\s*(\d+)/i), overall = q(/ready do you feel:?\s*(\d+)/i);
    if (comp || sleep || energy || soreness || stress || overall) {
      readiness = { composite: comp ? Number(comp[1]) : null, sleep, energy, soreness, stress, overall };
    }
  }
  return { day, focus, status, session_rpe: rpeM ? rpeM[1] : '', duration_min: durM ? durM[1] : '', readiness, day_note: note, summary };
}
let _pendingImport = null;
function toggleAddSession() {

const CYCLE_PROMPT = `You are assisting an elite strength & conditioning coach (tennis + physical prep). A training cycle (~4–5 weeks) just ended for ONE athlete. Below are (1) the weekly check-in data for each week of the cycle and (2) the logged workout sessions across the cycle. Write an end-of-cycle report whose JOB is to drive the NEXT cycle's programming. Analyse TRENDS across the weeks and the logs — do not restate single weeks. Cross-reference: does the self-report match what they actually logged?

Output these sections:
• Overview — 3–5 sentences: the arc of the cycle and the headline.
• Trends — specific, data-backed (cite direction and rough numbers, e.g. "soreness 3→7 over weeks 3–5", "adherence 13/15 sessions").
• What worked / What to change.
• Programming decisions for next cycle — concrete DECISIONS (load direction, volume, exercise emphasis, recovery, scheduling), not vague advice.
• Overall load direction — progress / maintain / reduce / deload / mixed.
• Content-worthy wins — improvements across the cycle worth posting, with specifics.
• Flags — anything to address before/into next cycle.
Use ONLY the provided data; if it's sparse, say so plainly.`;
function fmtCycleData(name, cyc, weeklies, sessions) {
  const L = [];
  L.push(`ATHLETE: ${name} — CYCLE ${cyc}`);
  L.push(`Weekly check-ins: ${weeklies.length} · Logged sessions: ${sessions.length}`);
  L.push('\n=== WEEKLY CHECK-INS ===');
  weeklies.forEach((w, i) => { L.push(`\n--- ${w.week || ('Week ' + (i + 1))} (${w.call_date || '—'}) ---`); L.push(w.summary || '(no detail saved)'); });
  L.push('\n=== LOGGED WORKOUT SESSIONS ===');
  if (!sessions.length) L.push('(No logged sessions found in the cycle window.)');
  else sessions.forEach(s => { const rd = jparse(s.readiness); const comp = rd && typeof rd === 'object' ? rd.composite : null; L.push(`${s.completed_on} · Day ${s.day ?? '—'} · ${s.status || '—'} · RPE ${s.session_rpe ?? '—'} · ${s.duration_min ?? '—'}min${comp != null ? ' · readiness ' + comp + '/5' : ''}${s.focus ? ' · ' + s.focus : ''}${s.day_note ? ' · note: ' + s.day_note : ''}`); });
  return L.join('\n');
}
function copyDashCyclePrompt() {
  const sel = $('dashCycleSel');
  const cyc = sel ? sel.value : '';
  if (!cyc) { alert('Pick a cycle first.'); return; }
  const weeklies = _detailCallLogs
    .filter(l => ((String(l.week || '').match(/Cycle\s*(\d+)/i) || [])[1]) === cyc)
    .sort((a, b) => String(a.call_date).localeCompare(String(b.call_date)));
  if (!weeklies.length) { alert('No weekly check-ins saved for Cycle ' + cyc + '.'); return; }
  const dates = weeklies.map(w => w.call_date).filter(Boolean).sort();
  const start = addDays(dates[0], -16), end = addDays(dates[dates.length - 1], 3);
  const sessions = (_detailHistory || [])
    .filter(s => s.completed_on && s.completed_on >= start && s.completed_on <= end)
    .sort((a, b) => String(a.completed_on).localeCompare(String(b.completed_on)));
  const text = CYCLE_PROMPT + '\n\n' + fmtCycleData(_detailName, cyc, weeklies, sessions);
  navigator.clipboard.writeText(text).then(
    () => alert(`Cycle ${cyc} prompt copied — ${weeklies.length} check-in(s) + ${sessions.length} session(s).\n\nPaste it into any AI to generate the report.`),
    () => alert('Copy failed — clipboard blocked by the browser.'),
  );
}

// --- INTAKE (coaching apply-form submissions) -------------------------------
// form.html / form-fa.html write here via submit_intake(); Amir reads them here.
// The Web3Forms email still fires too — this table is the durable copy so a
// relay outage can't lose a lead. Backend: supabase/stage27_intake.sql.
const INTAKE_SKIP = new Set(['First Name', 'Last Name', 'Email', 'Contact (Instagram/WhatsApp)', 'Programme',
                             'botcheck', 'access_key', 'from_name', 'subject', 'redirect']);
function intakeName(i) {
  const p = i.payload || {};
  return (i.name && i.name.trim()) || [p['First Name'], p['Last Name']].filter(Boolean).join(' ').trim() || 'Unnamed';
}
function intakeVal(v) { return Array.isArray(v) ? v.join(', ') : String(v == null ? '' : v); }
function waLink(num) { const d = String(num || '').replace(/[^0-9]/g, ''); return d ? 'https://wa.me/' + d : ''; }

function intakeCard(i) {
  const name = intakeName(i);
  const st = i.status || 'new';
  const langPill = `<span class="ipill ${i.lang === 'fa' ? 'fa' : 'en'}">${i.lang === 'fa' ? 'FA' : 'EN'}</span>`;
  const progPill = i.programme ? `<span class="ipill prog">${esc(i.programme)}</span>` : '';

  const rows = [];
  const p = i.payload || {};
  Object.keys(p).forEach(k => {
    if (INTAKE_SKIP.has(k)) return;
    const val = intakeVal(p[k]);
    if (!val.trim()) return;
    rows.push(`<tr><td class="k">${esc(k)}</td><td class="v">${esc(val)}</td></tr>`);
  });
  const qa = rows.length ? `<table class="meta-table">${rows.join('')}</table>` : '<p class="empty">No further answers.</p>';

  const contact = i.contact || '', email = i.email || '', wa = waLink(contact);
  const cbits = [];
  if (email) cbits.push(`<a href="mailto:${esc(email)}">${esc(email)}</a> <button class="btn sm copy-btn-js" data-url="${esc(email)}">Copy</button>`);
  if (contact) cbits.push((wa ? `<a href="${esc(wa)}" target="_blank" rel="noopener">${esc(contact)}</a>` : esc(contact)) + ` <button class="btn sm copy-btn-js" data-url="${esc(contact)}">Copy</button>`);
  const contactLine = cbits.join('<span class="dot">·</span>') || '<span class="muted">No contact given</span>';

  let acts;
  if (st === 'new')      acts = `<button class="btn sm primary intake-act" data-id="${esc(i.id)}" data-to="handled">Mark handled</button><button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="archived">Archive</button>`;
  else if (st === 'handled') acts = `<button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="new">Reopen</button><button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="archived">Archive</button>`;
  else                   acts = `<button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="new">Reopen</button>`;

  return `<details class="intake-card ${st}"${st === 'new' ? ' open' : ''}>
    <summary><span class="ava">${esc(initials(name))}</span><span class="i-name">${esc(name)}</span>${langPill}${progPill}<span class="i-when">${esc(timeAgo(i.created_at))}</span></summary>
    <div class="i-body"><div class="i-contact">${contactLine}</div>${qa}<div class="i-actions">${acts}</div></div>
  </details>`;
}

async function intakeSetStatus(id, to, btn) {
  if (btn) btn.disabled = true;
  if (!DEMO) {
    const { error } = await sb.rpc('set_intake_status', { p_id: id, p_status: to });
    if (error) { if (btn) btn.disabled = false; toast('Could not update — try Refresh'); return; }
  }
  const row = (S.intake || []).find(x => String(x.id) === String(id));
  if (row) row.status = to;
  renderIntake(); renderRail();
}

function renderIntake() {
  const all = (S.intake || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const g = { new: [], handled: [], archived: [] };
  all.forEach(i => (g[i.status] || g.new).push(i));

  let html = `<section class="panel"><div class="phead"><span class="t hd">New applications</span><span class="r">${g.new.length} waiting</span></div>`;
  html += g.new.length ? g.new.map(intakeCard).join('')
    : '<p class="empty">No new applications. When someone submits the apply form (English or Farsi), it lands here — and Amir still gets the Web3Forms email.</p>';
  html += `</section>`;
  if (g.handled.length) html += `<section class="panel" style="margin-top:16px"><div class="phead"><span class="t hd">Handled</span><span class="r">${g.handled.length}</span></div>${g.handled.map(intakeCard).join('')}</section>`;
  if (g.archived.length) html += `<section class="panel" style="margin-top:16px"><details><summary class="arch-toggle">Archived · ${g.archived.length}</summary><div style="margin-top:12px">${g.archived.map(intakeCard).join('')}</div></details></section>`;

  $('content').innerHTML = html;
  $('content').querySelectorAll('.copy-btn-js').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); copyText(btn.dataset.url, btn); }));
  $('content').querySelectorAll('.intake-act').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); intakeSetStatus(btn.dataset.id, btn.dataset.to, btn); }));
}

// --- auth + boot -------------------------------------------------------------
if (!DEMO) {
  $('loginBtn').onclick = () =>
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href.split('#')[0] } });
  $('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
} else {
  $('logoutBtn').onclick = () => { location.search = ''; };
}

let booted = false;
async function boot() {
  if (booted) return; booted = true;
  if (DEMO) {
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
    $('demoband').style.display = 'block';
    $('who').textContent = 'Demo';
    await loadAll();
    render();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { booted = false; return showGate(); }
  const email = (session.user.email || '').toLowerCase();
  if (email !== COACH_EMAIL.toLowerCase()) {
    await sb.auth.signOut();
    booted = false;
    return showGate('That account isn’t the coach account. Try again.');
  }
  $('gate').style.display = 'none';
  $('app').style.display = 'block';
  $('who').textContent = session.user.email;
  try { await loadAll(); } catch (e) {
    $('content').innerHTML = `<p class="empty">Could not load the dashboard: ${esc(e.message)}</p>`; return;
  }
  render();
  // Server-scored levels fill in behind the first paint.
  loadLevels().then(() => { if (S.ready) render(); });
}
function showGate(err) { $('app').style.display = 'none'; $('gate').style.display = 'block'; $('gateErr').textContent = err || ''; }
if (!DEMO) sb.auth.onAuthStateChange(() => { booted = false; boot(); });
boot();
</script>
