// The tennis testing app at /tennis-testing/app/ (its source is tennis-testing/app/ in this repo;
// /tennis-testing/ itself is the product page).
// Same pattern as athlete logins: the assess-login Edge Function makes the auth user on an
// internal address, assess.<username>@amirardekani.com, and hands back a password to send.
// Revoke bans the login but keeps the buyer's saved players and results; Restore brings it back
// with a new password. Buyer data itself is not readable from here, by design ("we don't monitor").
// Backend: supabase/assess_01_accounts_content_data.sql + supabase/functions/assess-login.
const ASSESS_URL = SITE + '/tennis-testing/app/';
let _assessBusy = false;
let _assessPw = null;   // the username whose password form is open (Change password or Restore), or null

async function loadAssess() {
  if (DEMO) {
    S.assess = S.assess || [{ username: 'academy_demo', label: 'Demo academy', created_at: new Date().toISOString(),
      initial_password: 'amber-cedar-kite-42', sent_at: null, revoked_at: null }];
    return;
  }
  const [r, notes] = await Promise.all([
    sb.from('assess_accounts')
      .select('user_id, username, label, created_at, initial_password, password_set_at, sent_at, revoked_at')
      .order('created_at', { ascending: false }),
    loadBuyerNotes()]);
  // A failed read stays "unknown" (null + the error), never an empty list that reads "No logins yet".
  LOAD_ERR.assess = r.error ? r.error.message : '';
  S.assess = r.error ? null : withBuyerNotes(r.data, notes);
}

// The note about a buyer ("who bought it") lives in buyer_notes since stage53: the account row's own label is always empty
// now, so a buyer reading their own row no longer sees what Amir wrote. Until that stage is applied the note is still the
// label. A table that is not there yet is expected and quiet; any other failed read leaves the label in place AND is named by the
// "Not everything loaded" banner (it used to show every buyer with no note, silently).
async function loadBuyerNotes() {
  const r = await selectAll('buyer_notes', 'user_id, note', ['user_id']);
  if (r.error) {
    // Before stage53 the table does not exist and the note is still the account's label: not a failure. Any other error is named by the banner.
    const missing = /^(42P01|PGRST205)$/.test(String(r.error.code || '')) || /does not exist|Could not find the table/i.test(r.error.message || '');
    LOAD_ERR.buyerNotes = missing ? '' : (r.error.message || 'unreadable');
    return null;
  }
  LOAD_ERR.buyerNotes = '';
  return Object.fromEntries((r.data || []).map(x => [x.user_id, x.note]));
}
function withBuyerNotes(rows, notes) {
  return (rows || []).map(x => Object.assign({}, x, { label: (notes && notes[x.user_id]) || x.label || '' }));
}

  if (DEMO) { toast('Demo mode — nothing saved'); return; }

  if (action === 'revoke' && !confirm('Revoke ' + username + '?\n\nThey can no longer sign in. Their saved players and results are kept, and Restore brings the login back with a new password.')) return;
  _assessBusy = true; if (btn) btn.disabled = true;
  const { data, error } = await sb.functions.invoke('assess-login', { body: { action, username, label, password: password || undefined } });
  _assessBusy = false; if (btn) btn.disabled = false;
  let msg = data && data.error;
  if (!msg && error) { try { msg = (await error.context.json()).error; } catch (e) { msg = error.message; } }
  if (msg) { fail('Could not ' + action + ' the login:\n\n' + msg); return; }
  _assessPw = null;
  await loadAssess();
  if (action === 'revoke') { toast(username + ' revoked'); renderAssess(); return; }
  copyText(assessMessage(data.username, data.password));
  renderAssess();
  // Like an athlete's login: the message is on the clipboard and the password waits in the list (Copy, Mark sent) until they sign in with
  // it, so a toast is enough. Only when the server could not store the password is this the one place it is shown.
  const what = (data.created ? 'Login created' : action === 'restore' ? 'Login restored' : password ? 'Password changed' : 'New password') + ' for ' + data.username;
  if (data.warning) alert(what + '\n\nPassword: ' + data.password + '\n\nThe Farsi WhatsApp message is copied to your clipboard.\n\n⚠ ' + data.warning);
  else toast(what + ' — the message is copied; send it on WhatsApp');
}

async function assessMarkSent(username) {

function spineMapHtml(credits, muscles, loads) {
  const pick = c => Object.entries(c && typeof c === 'object' ? c : {}).filter(([m, w]) => MAP_NAME[m] && Number(w) > 0);
  let ms = pick(credits), from = 'the counts';
  if (!ms.length) { ms = pick(muscles); from = 'the muscles shown'; }
  const lit = {}, rings = {};
  let say;
  if (ms.length) {
    ms.forEach(([m, w]) => (MAP_CREDIT_GROUPS[m] || [m]).forEach(g => { if (lit[g] !== '1') lit[g] = Number(w) >= 1 ? '1' : 'h'; }));
    const list = (w1, dot) => ms.filter(([, w]) => (Number(w) >= 1) === w1).map(([m]) => `<div><i style="background:${dot}"></i>${esc(MAP_NAME[m])}</div>`).join('');
    say = `<b>Main</b>${list(true, '#C7552F') || '<div class="muted">none</div>'}<b style="display:block;margin-top:6px">Helping</b>${
      list(false, '#E8A68B') || '<div class="muted">none</div>'}<div class="muted" style="margin-top:6px">from ${from}</div>`;
  } else {
    const rs = (loads || []).filter(z => MAP_ZONE_GROUPS[z]);
    rs.forEach(z => { MAP_ZONE_GROUPS[z].forEach(g => { lit[g] = '1'; }); (MAP_ZONE_RINGS[z] || []).forEach(r => { rings[r] = 1; }); });
    say = rs.length ? `<b style="color:var(--clay-ink)">No muscles yet</b><div class="muted">the athlete sees the body parts instead</div>`
      : `<b style="color:var(--clay-ink)">Nothing to show</b><div class="muted">add counts, muscles or body parts</div>`;
  }
  let s = BODYMAP_SVG;
  Object.keys(lit).forEach(g => { s = s.split(`data-g="${g}"`).join(`data-g="${g}" data-l="${lit[g]}"`); });
  Object.keys(rings).forEach(r => { s = s.split(`data-r="${r}"`).join(`data-r="${r}" data-on="1"`); });
  return `<div class="bmap-wrap"><div class="bmap">${s}</div><div class="bmap-say">${say}</div></div>`;
}
// Redraw the open editor's map from what is typed right now (before saving).
function spineMapRefresh() {
  const c = $('content'), box = c && c.querySelector('#spineMap');
  if (!box) return;
  const f = n => (c.querySelector(`[data-sf="${n}"]`) || {}).value || '';
  box.innerHTML = spineMapHtml(spineParseCredits(f('credits')).out, spineParseCredits(f('muscles')).out,
    [...c.querySelectorAll('[data-sload]:checked')].map(x => x.dataset.sload));
}
function spineParseCredits(s) {   // "quads 1, glutes 0.5" → { quads: 1, glutes: 0.5 }
  const out = {}, bad = [];
  String(s || '').split(',').map(x => x.trim()).filter(Boolean).forEach(x => {
    const m = x.match(/^([a-z]+)\s*[:\s]\s*(1(?:\.0)?|0?\.5)$/i);
    const k = m && (SPINE_MUSCLE_ALIAS[m[1].toLowerCase()] || m[1].toLowerCase());
    if (!m || !SPINE_MUSCLES.includes(k)) bad.push(x);
    else if (k in out) bad.push(x + ' (' + k + ' twice)');
    else out[k] = parseFloat(m[2]);
  });
  return { out, bad };
}

// less than 1 (a 30-min ride = 3). ⚠️ Same rule as program.html qmSets() and
// scripts/check_program.py qm_sets() (2026-09-26).
function qmSetsC(rx) {

  const d = rx && rx.dose;

    <p class="psub" style="margin:10px 0">For each athlete: what their current week trains most, in working sets a week (a quality an exercise trains second counts as half a set; warm-ups don't count). The block's picture word says what it is <i>meant</i> to build (iron = Strength, voltage = Power …). If that isn't in the top two, it's flagged. Foundation, peaking and recovery blocks train a mix on purpose, so they are never flagged. Under each, day by day, what that day's card on their phone will say (three words at most, by the app's own rule): <i>blank</i> when under 70% of the day's working sets sit on approved, tagged exercises, or when no quality reaches 12% of the day.</p>` +
    rows.map(r => {
      const top = r.ranked.slice(0, 4).map(q => `${esc(qn(q))} ${sets(r.score[q])}`).join(' · ');
      const aim = r.head ? `meant to build <b>${esc(qn(r.head))}</b>` : (QM_PHASE[String(r.art).toLowerCase()] || 'no picture word');
      const verdict = !r.ranked.length ? 'Nothing tagged yet, so the day cards show nothing.'
        : r.flag ? `<b style="color:var(--clay-ink)">⚠ ${esc(qn(r.head))} is ${r.ranked.indexOf(r.head) < 0 ? 'not trained at all' : 'only #' + (r.ranked.indexOf(r.head) + 1)} this week.</b> Either the week or the picture word is off.`
        : r.head ? `✓ ${esc(qn(r.head))} is in the top two.` : '✓ A mixed block, nothing to check.';
      const cov = r.coverage >= 0.995 ? 'every exercise tagged' : `${Math.round(r.coverage * 100)}% of the week's sets tagged`;
      const nowTxt = noQual ? 'no quality is approved yet, so no day card shows one' : dayLine(r.data, phone), laterTxt = dayLine(r.data, all);
      const dayHtml = !r.ranked.length ? '' : `<div class="muted" style="margin-top:3px">Day cards on their phone: ${nowTxt}</div>${
        laterTxt !== nowTxt ? `<div class="muted" style="margin-top:3px">Once the drafts are approved: ${laterTxt}</div>` : ''}`;
      return `<div class="credrow" style="display:block;padding:10px 0">
        <div><b>${esc(nameOf(r.aid))}</b> <span class="muted">· ${r.cycle ? `cycle "${esc(r.cycle)}" · ` : ''}${aim}</span></div>
        <div class="muted" style="margin-top:3px">Trains most: ${top || '—'} <span style="opacity:.8">(sets a week)</span></div>
        <div style="margin-top:3px;font-size:14px">${verdict} <span class="muted">· ${cov}</span></div>${dayHtml}</div>`;
    }).join('') + `</details></section>`;
  return h;
}

function renderExercises() {
  const c = $('content');
  if (!S.spine) {
    c.innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
    loadSpine().then(() => { if (route().view === 'exercises') renderExercises(); else renderRail(); });
    return;
  }
  if (S.spine.failed) {
    c.innerHTML = `<section class="panel"><p class="empty" role="alert"><b>The Spine did not load</b>, so nothing here can be shown or saved (a save from half a copy would blank what did not arrive).<br><span class="muted">${esc(S.spine.failed)}</span></p>
      <p style="text-align:center"><button class="btn primary sm" onclick="S.spine=null;renderExercises()">↻ Try again</button></p></section>`;
    return;
  }
  c.classList.toggle('no-anim', !!$('spineQ'));
  if (_spineHistId && _spineHistId !== _spineOpen) _spineHistId = null;   // History belongs to the entry it was opened on
  const list = S.spine.list, byId = {};
  list.forEach(e => { byId[e.id] = e; });
  const idx = spineIndexC(list);
  const usage = spineUsage();
  const who = {};   // entry id -> { athletes:{}, slots }
  let slotsAll = 0, slotsMapped = 0, namesMapped = 0;
  const unmapped = [];
  usage.forEach(u => {
    slotsAll += u.slots;
    const id = spineForC(idx, u.name, u.exId, byId);
    if (id) {
      namesMapped++; slotsMapped += u.slots;
      const w = who[id] || (who[id] = { athletes: {}, slots: 0 });
      Object.keys(u.athletes).forEach(a => { w.athletes[a] = 1; }); w.slots += u.slots;
    } else unmapped.push(u);
  });
  unmapped.sort((a, b) => Object.keys(b.athletes).length - Object.keys(a.athletes).length || b.slots - a.slots);
  // Cards that show something else on a phone (audit TWIN-1, 2026-10-11): this page counts draft entries (their cards are "waiting for you"), a
  // phone is served approved ones only. A card with an exId shows that entry or nothing; one with no exId is found by name among the approved.
  const phone = spineLensC(list, true), differ = [];
  usage.forEach(u => {
    const a = spineForC(idx, u.name, u.exId, byId), p = spineForC(phone.idx, u.name, u.exId, phone.byId);
    if (a && a !== p) differ.push({ u, a, p });
  });
  differ.sort((x, y) => Object.keys(y.u.athletes).length - Object.keys(x.u.athletes).length || y.u.slots - x.u.slots);
  const pct = slotsAll ? Math.round(slotsMapped / slotsAll * 100) : 0;
  const drafts = list.filter(e => e.status === 'draft'), approved = list.filter(e => e.status === 'approved');
  const filter = _spineFilter || (drafts.length ? 'draft' : 'approved');
  const q = normQ(_spineQ);
  const hay = e => normQ([e.name, e.id, e.pattern].concat(e.aliases || [], e.equipment || []).join(' '));
  const shown = q ? list.filter(e => hay(e).includes(q)) : filter === 'approved' ? approved : drafts;
  const nAth = id => Object.keys((who[id] || {}).athletes || {}).length;
  const nLive = Object.entries(S.programs || {}).filter(([k, v]) => v && !SYSTEM_IDS.includes(k) && v.workouts && (v.workouts.days || []).length).length;
  const field = 'width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;box-sizing:border-box';
  const lbl = t => `<div class="muted" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 4px">${t}</div>`;
  // A stored value the lists below do not know is shown and kept, never silently dropped on save.
  const opts = (known, v, text) => (v && !known.includes(v) ? `<option value="${esc(v)}" selected>${esc(v)} (not in the list)</option>` : '') +
    known.map(id => `<option value="${esc(id)}"${id === v ? ' selected' : ''}>${esc(text ? text(id) : id)}</option>`).join('');
  const nm = id => (byId[id] || {}).name || id;
  // CUE-4: links go both ways. The editor writes one entry, so it says which ones do not link back.
  const oneWay = e => {
    const back = { easier: 'harder', harder: 'easier', alts: 'alts' }, out = [];
    ['easier', 'harder', 'alts'].forEach(k => (e[k] || []).forEach(x => {
      if (byId[x] && !(byId[x][back[k]] || []).includes(e.id)) out.push(`${esc(nm(x))} <span class="muted">(${k === 'easier' ? 'regression' : k === 'harder' ? 'progression' : 'alternative'})</span>`);
    }));
    return out;
  };

  const editor = e => {
    const k = S.spine.coach[e.id] || {};
    const names = Object.keys((who[e.id] || {}).athletes || {}).map(a => esc(nameOf(a))).join(', ');
    const ow = oneWay(e);
    return `<div class="panel spine-ed" id="spineEd" style="margin:8px 0 14px;background:var(--paper, #FAF7F2)">
      <p class="psub" style="margin:0 0 4px">${names ? 'Doing it now: ' + names : 'Nobody has this in their programme right now.'} <span class="muted">· id ${esc(e.id)}${e.updated_by ? ' · last saved by ' + esc(e.updated_by) + (e.updated_at ? ', ' + esc(fmtLocalStamp(e.updated_at)) : '') : ''}</span></p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px">
        <div>${lbl('Name')}<input data-sf="name" value="${esc(e.name)}" style="${field}"></div>
        <div>${lbl('Also written as (comma)')}<input data-sf="aliases" value="${esc((e.aliases || []).join(', '))}" style="${field}"></div>
        <div>${lbl('Pattern')}<select data-sf="pattern" style="${field}"><option value=""></option>${opts(SPINE_PATTERNS, e.pattern)}</select></div>
        <div>${lbl('Video')}<input data-sf="video" value="${esc(e.video || '')}" style="${field}"></div>
      </div>
      ${(() => {
        const sug = !(e.qualities || []).length && (k.suggested_qualities || []).length;
        const cur = (e.qualities || []).length ? e.qualities : (k.suggested_qualities || []);
        const qname = id => ((S.spine.quals || []).find(q => q.id === id) || {}).name || id;
        const sel = (n, v) => `<select data-sf="q${n}" style="${field}"><option value="">${n === 1 ? '— primary —' : '—'}</option>${opts(QM_IDS, v, qname)}</select>`;
        return lbl('Qualities · first is the primary' + (sug ? ' · <b style="color:var(--clay-ink)">Claude’s suggestion, saved when you save</b>' : '')) +
          `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${sel(1, cur[0])}${sel(2, cur[1])}${sel(3, cur[2])}</div>`;
      })()}
      ${lbl('Why it’s here (the athlete reads this)')}<textarea data-sf="purpose" rows="2" dir="auto" style="${field}">${esc(e.purpose || '')}</textarea>
      ${lbl('On court')}<input data-sf="tennis" dir="auto" value="${esc(e.tennis || '')}" style="${field}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px">
        <div>${lbl('Cues · one per line')}<textarea data-sf="good" rows="3" dir="auto" style="${field}">${esc(((e.cues || {}).good || []).join('\n'))}</textarea></div>
        <div>${lbl('Don’t · one per line')}<textarea data-sf="bad" rows="3" dir="auto" style="${field}">${esc(((e.cues || {}).bad || []).join('\n'))}</textarea></div>
        <div>${lbl('Regressions: easier versions of the same movement (ids, or a name)')}<input data-sf="easier" list="spineIds" value="${esc((e.easier || []).join(', '))}" style="${field}"></div>
        <div>${lbl('Progressions: harder versions of the same movement (ids, or a name)')}<input data-sf="harder" list="spineIds" value="${esc((e.harder || []).join(', '))}" style="${field}"></div>
        <div>${lbl('Alternatives: same movement, other equipment or machine (ids, or a name)')}<input data-sf="alts" list="spineIds" value="${esc((e.alts || []).join(', '))}" style="${field}"></div>
        <div>${lbl('Equipment (comma)')}<input data-sf="equipment" value="${esc((e.equipment || []).join(', '))}" style="${field}"></div>
      </div>
      ${ow.length ? `<p class="psub" style="margin:8px 0 0">Not linked back yet (links go both ways, CUE-4; Claude's /spine Upkeep adds the way back): ${ow.join(', ')}</p>` : ''}
      ${lbl('Body parts involved · the athlete sees these, with the impact pill after them')}
      <div style="display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center">
        ${SPINE_REGIONS.map(([id, nm2]) => `<label style="font-size:14px"><input type="checkbox" data-sload="${id}"${(e.loads || []).includes(id) ? ' checked' : ''} onchange="spineMapRefresh()"> ${nm2}</label>`).join('')}
        <select data-sf="impact" style="${field.replace('width:100%;', '')};width:auto"><option value="">— impact —</option>${opts(SPINE_IMPACTS.map(x => x[0]), e.impact, id => (SPINE_IMPACTS.find(x => x[0] === id) || [id, id])[1])}</select>
      </div>
      ${lbl('Muscles shown on the body map · only when "Counts toward" is empty (1 = main, 0.5 = helper)')}
      <input data-sf="muscles" oninput="spineMapRefresh()" value="${esc(spineCreditsText(e.muscles))}"
        placeholder="${k.credits && Object.keys(k.credits).length ? 'not needed: the map shows what it counts toward' : 'e.g. calves 1, shins 0.5'}" style="${field}">
      ${lbl('What the athlete sees · redraws as you type, saved when you save')}
      <div id="spineMap">${spineMapHtml(k.credits, e.muscles, e.loads)}</div>
      <div style="border-top:1px dashed var(--line);margin-top:14px;padding-top:4px">
        ${lbl('Coach only · the phone gets the muscles from “Counts toward” and whether each is main or helping, never SFR, flags, cost or notes')}
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
          <label>SFR rank <input data-sf="sfr" inputmode="numeric" value="${esc(k.sfr == null ? '' : String(k.sfr))}" style="width:60px;${field.replace('width:100%;', '')}"></label>
          ${SPINE_FLAGS.map(fl => `<label style="font-size:14px"><input type="checkbox" data-sflag="${fl}"${(k.flags || []).includes(fl) ? ' checked' : ''}> ${fl}</label>`).join('')}
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">
          <div style="flex:1 1 300px">${lbl('Counts toward, per working set (1 = prime mover, 0.5 = helper)')}<input data-sf="credits" oninput="spineMapRefresh()" value="${esc(spineCreditsText(k.credits))}"
            placeholder="${k.credits == null ? 'not set yet, e.g. quads 1, glutes 0.5' : 'counts toward nothing'}" style="${field}"></div>
          <div>${lbl('Cost of a set (day load)')}<select data-sf="cost" style="${field.replace('width:100%;', '')};width:auto"><option value="">— cost —</option>${opts(SPINE_COSTS.map(x => x[0]), k.cost, id => (SPINE_COSTS.find(x => x[0] === id) || [id, id])[1])}</select></div>
        </div>
        <input data-sf="notes" placeholder="notes" value="${esc(k.notes || '')}" style="${field};margin-top:8px">
      </div>
      <details class="rawlog"${_spineHistId === e.id ? ' open' : ''} ontoggle="spineHistToggle(this, ${jsq(e.id)})">
        <summary>History: earlier versions of this entry</summary>
        <div id="spvlist" class="pvlist">Loading…</div>
      </details>
      <div class="spine-acts">
        ${e.status === 'draft' ? `<button class="btn primary sm sp-save" data-id="${esc(e.id)}" data-ap="1">Approve</button><button class="btn sm sp-save" data-id="${esc(e.id)}">Save draft</button>`
          : `<button class="btn primary sm sp-save" data-id="${esc(e.id)}">Save</button><button class="btn sm sp-close">Close</button><span style="flex:1"></span><button class="btn sm sp-save" data-id="${esc(e.id)}" data-ap="0" title="Takes it off every phone">Move back to draft…</button>`}
        ${e.status === 'draft' ? '<button class="btn sm sp-close">Close</button>' : ''}
      </div>
    </div>`;
  };
  const pill = e => q ? ` · ${e.status === 'approved' ? '<b style="color:var(--green-ink, #1E7A55)">approved</b>' : 'draft'}` : '';
  const row = e => `<div class="credrow spine-row" style="cursor:pointer" data-open="${esc(e.id)}">
      <span class="credname">${esc(e.name)} <span class="muted">· ${esc(e.pattern || 'no pattern')} · ${nAth(e.id)} athlete${nAth(e.id) === 1 ? '' : 's'}${pill(e)}</span></span>
      <span class="muted">${e.cues ? 'cues ✓' : 'no cues'}${e.video ? ' · video ✓' : ''}${(e.qualities || []).length ? ' · ' + esc(e.qualities.join(', ')) : ' · <b style="color:var(--clay-ink)">no qualities</b>'}${(S.spine.coach[e.id] || {}).credits == null ? ' · <b style="color:var(--clay-ink)">no count</b>' : ''}${
        (() => { const cc = (S.spine.coach[e.id] || {}).credits; return cc && !Object.keys(cc).length && !(e.muscles && Object.keys(e.muscles).length); })() ? ' · <b style="color:var(--clay-ink)">no muscles on the map</b>' : ''}</span>
      <span class="acts"><button class="btn sm" data-open="${esc(e.id)}" aria-expanded="${_spineOpen === e.id}">${_spineOpen === e.id ? 'Close' : 'Open'}</button></span>
    </div>` + (_spineOpen === e.id ? editor(e) : '');

  let html = `<div class="controls"><span class="empty" style="align-self:center">The Spine: one entry per exercise you programme. Cues written here fill every card that has none of its own, and the athlete's <b>i</b> opens the rest. Nothing shows on a phone until it is <b>Approved</b>.</span></div>`;
  html += `<section class="panel" style="margin-bottom:16px"><div class="phead"><span class="t hd">Coverage</span><span class="r">${namesMapped} of ${usage.length} card names · ${pct}% of exercise slots</span></div>
    <div style="height:10px;border-radius:999px;background:var(--line);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--clay)"></div></div>
    <p class="psub" style="margin:10px 0 0">${approved.length} approved · ${drafts.length} draft${drafts.length === 1 ? '' : 's'} waiting for you. Counted across the ${nLive} programme${nLive === 1 ? '' : 's'} with workouts, circuit items included.${
      differ.length ? ` <b style="color:var(--clay-ink)">${differ.length} card name${differ.length === 1 ? '' : 's'} show${differ.length === 1 ? 's' : ''} something else on a phone until the draft is approved</b> (listed at the bottom).` : ''}</p></section>`;
  html += qualityPanels(idx, byId);
  const fbtn = (f, t) => `<button class="btn sm sp-filter${filter === f && !q ? ' primary' : ''}" data-f="${f}" aria-pressed="${filter === f && !q}">${t}</button>`;
  html += `<section class="panel"><div class="phead"><span class="t hd">${q ? 'Matches' : filter === 'approved' ? 'Approved' : 'Waiting for you'}</span>
    <span class="r">${fbtn('draft', 'Drafts · ' + drafts.length)} ${fbtn('approved', 'Approved · ' + approved.length)}</span></div>
    <input id="spineQ" type="search" value="${esc(_spineQ)}" placeholder="Find an exercise: name, other name, pattern, equipment or id" aria-label="Find an exercise" style="${field};margin:0 0 8px">` +
    (shown.length ? shown.slice().sort((a, b) => nAth(b.id) - nAth(a.id) || a.name.localeCompare(b.name)).map(row).join('')
      : `<p class="empty">${q ? 'No entry matches “' + esc(_spineQ) + '”.' : filter === 'draft' ? 'No drafts waiting. Ask Claude to draft the next batch.' : 'Nothing approved yet: open a draft and tap Approve.'}</p>`) + `</section>`;
  if (differ.length) html += `<section class="panel" style="margin-top:16px"><details><summary class="arch-toggle">Cards that show something else on a phone · ${differ.length} name${differ.length === 1 ? '' : 's'}</summary><div style="margin-top:12px">
    <p class="psub" style="margin:0 0 8px">A phone is served approved entries only. These cards find a draft here, so on a phone they show nothing (a card that names its entry shows that entry or nothing) or, with no entry named, the closest approved one. Approve the draft and both agree.</p>${
    differ.slice(0, 60).map(d => `<div class="credrow"><span class="credname">${esc(d.u.name)}</span><span class="muted">${Object.keys(d.u.athletes).length} athlete${Object.keys(d.u.athletes).length === 1 ? '' : 's'} · here: ${esc((byId[d.a] || {}).name || d.a)} (${byId[d.a] && byId[d.a].status === 'approved' ? 'approved' : 'draft'}) · phone: ${d.p ? esc((phone.byId[d.p] || {}).name || d.p) : 'nothing'}</span></div>`).join('')
  }${differ.length > 60 ? `<p class="psub">…and ${differ.length - 60} more.</p>` : ''}</div></details></section>`;
  if (unmapped.length) html += `<section class="panel" style="margin-top:16px"><details><summary class="arch-toggle">Not in the Spine yet · ${unmapped.length} names</summary><div style="margin-top:12px">${
    unmapped.slice(0, 60).map(u => `<div class="credrow"><span class="credname">${esc(u.name)}</span><span class="muted">${Object.keys(u.athletes).length} athlete${Object.keys(u.athletes).length === 1 ? '' : 's'} · ${u.slots} slot${u.slots === 1 ? '' : 's'}</span></div>`).join('')
  }${unmapped.length > 60 ? `<p class="psub">…and ${unmapped.length - 60} more.</p>` : ''}</div></details></section>`;
  html += `<datalist id="spineIds">${list.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</datalist>`;
  c.innerHTML = html;

  // The open editor: remember it as drawn, then put back what the coach had typed before this redraw.
  const ed = $('spineEd');
  if (ed && _spineHistId === _spineOpen) loadSpineVersions(_spineHistId);   // History was open: it redraws closed-then-open, so refill it
  if (ed) {
    _spineBase = { id: _spineOpen, state: spineFormState(ed) };
    if (_spineDraft && _spineDraft.id === _spineOpen) { spineFormSet(ed, _spineDraft.edits); spineMapRefresh(); }
    const note = () => spineNoteEdits();
    ed.addEventListener('input', note); ed.addEventListener('change', note);
  } else _spineBase = null;
  // The quality texts: the same, keyed 'id:field'.
  c.querySelectorAll('[data-qf]').forEach(el => {
    const k = el.dataset.qf;
    if (k in _qualDraft) el.value = _qualDraft[k];
    el.addEventListener('input', () => { if (el.value !== el.defaultValue) _qualDraft[k] = el.value; else delete _qualDraft[k]; });
  });
  const sq = $('spineQ');
  sq.addEventListener('input', () => {
    spineNoteEdits();
    _spineQ = sq.value;
    const at = sq.selectionStart;
    renderExercises();
    const n = $('spineQ'); n.focus(); try { n.setSelectionRange(at, at); } catch (e) { /* type=search */ }
  });
  c.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', ev => {
    if (ev.target.closest('.spine-ed')) return;
    ev.preventDefault(); ev.stopPropagation();
    const id = el.dataset.open;
    if (!spineMayLeave(_spineOpen === id ? 'Close it' : 'Open another entry')) return;
    _spineOpen = _spineOpen === id ? null : id; _spineDraft = null; renderExercises();
    // Keep the row the coach tapped under their finger: an editor closing above it used to throw it
    // a thousand pixels up the page.
    const r = _spineOpen && c.querySelector(`.spine-row[data-open="${CSS.escape(_spineOpen)}"]`);
    if (r) window.scrollTo({ top: r.getBoundingClientRect().top + window.scrollY - 70, behavior: 'instant' });
  }));
  c.querySelectorAll('.sp-filter').forEach(el => el.addEventListener('click', () => {
    if (_spineOpen && !spineMayLeave('Switch the list')) return;
    _spineFilter = el.dataset.f; _spineQ = ''; _spineOpen = null; _spineDraft = null; renderExercises();
  }));
  c.querySelectorAll('.sp-close').forEach(el => el.addEventListener('click', () => {
    if (!spineMayLeave('Close it')) return;
    _spineOpen = null; _spineDraft = null; renderExercises();
  }));
  c.querySelectorAll('.qm-save').forEach(el => el.addEventListener('click', () => {
    spineNoteEdits();
    el.disabled = true;
    qualSave(el.dataset.q, el.dataset.ap === '1' ? true : el.dataset.ap === '0' ? false : undefined).finally(() => { el.disabled = false; });
  }));
  c.querySelectorAll('.sp-save').forEach(el => el.addEventListener('click', () => {
    el.disabled = true;
    spineSave(el.dataset.id, el.dataset.ap === '1' ? true : el.dataset.ap === '0' ? false : undefined).finally(() => { el.disabled = false; });
  }));
}
window.renderExercises = renderExercises;

// --- INTAKE (coaching apply-form submissions) -------------------------------
// form.html / form-fa.html write here via submit_intake(); Amir reads them here.
// The Web3Forms email still fires too — this table is the durable copy so a
// relay outage can't lose a lead. Backend: supabase/stage27_intake.sql.
const INTAKE_SKIP = new Set(['First Name', 'Last Name', 'Email', 'Contact (Instagram/WhatsApp)', 'Programme',
                             'botcheck', 'access_key', 'from_name', 'subject', 'redirect']);
function intakeName(i) {
  const p = i.payload || {};
  return (i.name && i.name.trim()) || [p['First Name'], p['Last Name']].filter(Boolean).join(' ').trim() || 'Unnamed';
}
function intakeVal(v, fa) { return Array.isArray(v) ? v.join(fa ? '\u060C ' : ', ') : String(v == null ? '' : v); }
const RTL_RE = /[\u0600-\u06FF]/;
// A wa.me link only for something that IS a phone number. The intake field is "Contact
// (Instagram/WhatsApp)", and the old version kept whatever digits it found, so "@sara_1990" became
// wa.me/1990 and "sara.k99@gmail.com" wa.me/99: a tap opened a stranger's chat.
// Persian and Arabic digits count (a number typed on a Persian keyboard), 00 and + mean a country
// code follows, an Iranian 09… (or 9… with ten digits, or +98 0…) becomes 989…, and a number that
// still starts with a trunk 0 or is not 8-15 digits long gets no link (copy it instead).
function waLink(num) {
  let t = String(num || '').replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x06F0))
    .replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x0660)).trim();
  if (!t) return '';
  if (/[^0-9+\s().\-\u200c\u200e\u200f]/.test(t)) {
    // Words around a number ("09121234567 WhatsApp") keep the number; a handle or an email never
    // has a run of ten digits, and anything with an @ is never read as a number.
    const run = !/@/.test(t) && t.match(/\+?\d[\d\s().\-]{8,}\d/);
    if (!run || run[0].replace(/\D/g, '').length < 10) return '';
    t = run[0];
  }
  const plus = /^\+/.test(t);
  let d = t.replace(/[^0-9]/g, '');
  if (!plus && /^00/.test(d)) d = d.slice(2);
  else if (!plus && /^09\d{9}$/.test(d)) d = '98' + d.slice(1);
  else if (!plus && /^9\d{9}$/.test(d)) d = '98' + d;
  if (/^980\d{10}$/.test(d)) d = '98' + d.slice(3);
  if (/^0/.test(d) || d.length < 8 || d.length > 15) return '';
  return 'https://wa.me/' + d;
}

function intakeCard(i) {
  const name = intakeName(i);
  const st = i.status || 'new';
  const langPill = `<span class="ipill ${i.lang === 'fa' ? 'fa' : 'en'}">${i.lang === 'fa' ? 'FA' : 'EN'}</span>`;
  const progPill = i.programme ? `<span class="ipill prog">${esc(i.programme)}</span>` : '';

  const rows = [];
  const p = i.payload || {};
  Object.keys(p).forEach(k => {
    if (INTAKE_SKIP.has(k)) return;
    const val = intakeVal(p[k], i.lang === 'fa');
    if (!val.trim()) return;
    const rtl = RTL_RE.test(val);
    rows.push(`<tr><td class="k" dir="auto">${esc(k)}</td><td class="v${rtl ? ' rtl' : ''}" dir="${rtl ? 'rtl' : 'auto'}">${esc(val)}</td></tr>`);
  });
  const qa = rows.length ? `<table class="meta-table">${rows.join('')}</table>` : '<p class="empty">No further answers.</p>';

  const contact = i.contact || '', email = i.email || '', wa = waLink(contact);
  const cbits = [];
  if (email) cbits.push(`<a href="mailto:${esc(email)}">${esc(email)}</a> <button class="btn sm copy-btn-js" data-url="${esc(email)}">Copy</button>`);
  if (contact) cbits.push((wa ? `<a href="${esc(wa)}" target="_blank" rel="noopener">${esc(contact)}</a>` : esc(contact)) + ` <button class="btn sm copy-btn-js" data-url="${esc(contact)}">Copy</button>`);
  const contactLine = cbits.join('<span class="dot">·</span>') || '<span class="muted">No contact given</span>';

  let acts;
  if (st === 'new')      acts = `<button class="btn sm primary intake-act" data-id="${esc(i.id)}" data-to="handled">Mark handled</button><button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="archived">Archive</button>`;
  else if (st === 'handled') acts = `<button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="new">Reopen</button><button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="archived">Archive</button>`;
  else                   acts = `<button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="new">Reopen</button>`;

  return `<details class="intake-card ${st}"${st === 'new' ? ' open' : ''}>
    <summary><span class="ava">${esc(initials(name))}</span><span class="i-name">${esc(name)}</span>${langPill}${progPill}<span class="i-when">${esc(timeAgo(i.created_at))}</span></summary>
    <div class="i-body"><div class="i-contact">${contactLine}</div>${qa}<div class="i-actions">${acts}</div></div>
  </details>`;
}

async function intakeSetStatus(id, to, btn) {
  if (btn) btn.disabled = true;
  if (!DEMO) {
    const { error } = await sb.rpc('set_intake_status', { p_id: id, p_status: to });
    if (error) { if (btn) btn.disabled = false; fail('Could not update — try Refresh'); return; }
  }
  const row = (S.intake || []).find(x => String(x.id) === String(id));
  if (row) row.status = to;
  renderIntake(); renderRail();
}

function renderIntake() {
  const all = (S.intake || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const g = { new: [], handled: [], archived: [] };
  all.forEach(i => (g[i.status] || g.new).push(i));

  let html = `<section class="panel"><div class="phead"><span class="t hd">New applications</span><span class="r">${g.new.length} waiting</span></div>`;
  html += g.new.length ? g.new.map(intakeCard).join('')
    : '<p class="empty">No new applications. When someone submits the apply form (English or Farsi), it lands here — and Amir still gets the Web3Forms email.</p>';
  html += `</section>`;
  if (g.handled.length) html += `<section class="panel" style="margin-top:16px"><div class="phead"><span class="t hd">Handled</span><span class="r">${g.handled.length}</span></div>${g.handled.map(intakeCard).join('')}</section>`;
  if (g.archived.length) html += `<section class="panel" style="margin-top:16px"><details><summary class="arch-toggle">Archived · ${g.archived.length}</summary><div style="margin-top:12px">${g.archived.map(intakeCard).join('')}</div></details></section>`;

  $('content').innerHTML = html;
  $('content').querySelectorAll('.copy-btn-js').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); copyText(btn.dataset.url, btn); }));
  $('content').querySelectorAll('.intake-act').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); intakeSetStatus(btn.dataset.id, btn.dataset.to, btn); }));
}

// --- auth + boot -------------------------------------------------------------
if (!DEMO && sb) {
  $('loginBtn').onclick = () =>
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href.split('#')[0] } });
  $('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
} else {
  $('logoutBtn').onclick = () => { location.search = ''; };
}

let booted = false, bootUser = null;
async function boot() {
  if (booted) return; booted = true;
  if (!DEMO && !sb) {
    $('gate').style.display = 'block';
    $('gateErr').textContent = 'The sign-in library did not load (the jsDelivr CDN is blocked or offline). Check the connection and reload.';
    $('loginBtn').disabled = true;
    return;
  }
  if (DEMO) {
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
    $('demoband').style.display = 'block';
    $('who').textContent = 'Demo';
    await loadAll();
    render();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { booted = false; return showGate(); }
  const email = (session.user.email || '').toLowerCase();
  if (email !== COACH_EMAIL.toLowerCase()) {
    await sb.auth.signOut();
    booted = false;
    return showGate('That account isn’t the coach account. Try again.');
  }
  bootUser = session.user.id;
  $('gate').style.display = 'none';
  $('app').style.display = 'block';
  $('who').textContent = session.user.email;
  try { await loadAll(); } catch (e) {
    $('content').innerHTML = `<p class="empty">Could not load the dashboard: ${esc(e.message)}</p>`; return;
  }
  render();
  // Server-scored levels fill in behind the first paint.
  loadLevels().then(() => { if (S.ready) render(); });
}
function showGate(err) { failDismissAll(); $('app').style.display = 'none'; $('gate').style.display = 'block'; $('gateErr').textContent = err || ''; }
// supabase-js fires an auth event on load, on every hourly token refresh, when the tab comes
// back into focus, and on a real sign-in or sign-out. This used to re-run boot() on ALL of them:
// three full loads on every open, and a full reload and repaint several times an hour that
// threw away an open exercise editor, a typed coach line, the open days and the place on the
// page. Now only a change of WHO is signed in rebuilds the page. setTimeout: calling supabase
// from inside this callback can deadlock its auth lock.
if (sb) sb.auth.onAuthStateChange((event, session) => {
  const uid = session && session.user ? session.user.id : null;
  if (!uid) {
    if (bootUser) { bootUser = null; booted = false; S.ready = false; showGate('You were signed out. Sign in again to carry on.'); }
    return;
  }
  if (booted && (bootUser === null || bootUser === uid)) return;   // booting now, or the same coach
  booted = false; S.ready = false;
  setTimeout(boot, 0);
});
boot();
</script>
