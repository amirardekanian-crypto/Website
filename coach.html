<!DOCTYPE html>
<!--
  THE COACH'S BOX — coach.html
  Amir's private mission control for the whole operation: coached athletes
  (program.html / session_history) AND the Proof habit crew (habits.html).

  Access: Google sign-in locked to the coach email (UX gate only — Row Level
  Security in the database is the real gate; every coach-only table policy and
  RPC checks auth.jwt()->>'email').

  ⚠ SCORING INVARIANT: this page never computes XP, levels, streaks or day
  scores itself. Proof is already scored twice (habits.html client + Supabase
  plpgsql) and a third scorer would drift. The dashboard shows only:
    - raw presence facts (a day's hab_log entry is a non-empty object — the
      same test contact_list() uses), and
    - numbers returned by the server's own scorers (hab_season_level,
      leaderboard_top, contact_list).

  Preview without signing in: coach.html?demo=1 renders synthetic data.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Coach's Box</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E4A36">
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Pinned (2026-10-10): "@2" let any new 2.x build change how the dashboard signs in or reads
     with no change here. 2.117.3 is what @2 served that day and was tested against. To move on,
     bump the number and run the coach harness (Content/COACH-AUDIT.md). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<!-- Chip semantics, shared with program.html so the editor and the athlete app
     can never disagree about what a prescription says. See chips-selftest.html. -->
<script src="/assets/js/chips.js?v=20261011b"></script>
<style>
  :root {
    --paper: #FAF7F2; --card: #FFFFFF; --ink: #1A1A1A;
    --court: #0E4A36; --court-deep: #0B3B2B; --court-100: rgba(14,74,54,0.08);
    --clay: #C7552F; --clay-100: rgba(199,85,47,0.10);
    /* The "warn" middle between court green (good) and clay (bad). It was ochre
       until 2026-09-26, retired with the rest of the gold: it is a muted plum now.
       The name --ochre is legacy, kept so no reference needs renaming. */
    --ochre: #7A4E6E; --ochre-100: rgba(122,78,110,0.12);
    /* RPE UNDER target (2026-09-24). Same steel blue as program.html's --rpe-under,
       so a set reads the same colour on the athlete's phone and here: clay over,
       blue under. Used only for an RPE against its target. */
    --rpe-under: #3E6A92; --rpe-under-100: rgba(62,106,146,0.12);
    --line: #E4DCCC; --rule: rgba(26,26,26,0.08);
    /* Raised 2026-10-10 (audit BROWSER-8): .56/.42 measured 3.9:1 and 2.6:1, below WCAG AA for the
       small labels that carry most of this page. .65/.62 read 5.3:1 and 4.8:1 on paper. */
    --muted: rgba(26,26,26,0.65); --muted-soft: rgba(26,26,26,0.62);
    /* Clay as TEXT, and as the fill under white text: #C7552F is 4.1-4.4:1 there. The brand clay
       stays for bars, borders and dots. */
    --clay-ink: #B04A27; --clay-fill: #B04A27;
    --stick: 54px;   /* what stays on screen at the top: the top bar under 900 px, the one bar from 900 px up (56 px, set below). Everything that offsets itself under it reads this. */
    --track: rgba(26,26,26,0.10);
    /* The ONE shadow, for layers that float above the page (the Tools panel, the More sheet, the Undo bar, the failure and notice bar, the toast, the sign-in card).
       A panel on the page has none: a 1px --line border is its edge. */
    --float: 0 12px 30px -12px rgba(0,0,0,.35);
    --float-up: 0 -12px 30px -12px rgba(0,0,0,.35);
    --gap: 24px;   /* between sections on a PC; 16 px on a phone (set below) */
  }
  @media (max-width: 899px) { :root { --gap: 16px; } }

  /* ── THE LOOK (2026-10-12, round 3 of the coach UX pass: the global consistency pass). The rules every rule below follows; the same words are in COACH_DASHBOARD.md §2.
     TYPE SCALE, five sizes: 12 (meta, labels, hints), 14 (body, controls, table text), 17 (section headings, a day card's title, a name that heads a row), 22 (big numbers,
       sub-page headings), 30 (the athlete's name in the file header, the strip's counters). Form fields are 16 below 900 px (iOS zooms the page into a smaller one).
     TYPEFACES with jobs: Barlow Condensed, uppercase, for the brand and the athlete's name only. Barlow 600, sentence case, for headings, titles, names and tabs.
       Small letter-spaced capitals ONLY for column heads and group labels. Space Mono ONLY for numbers that line up or must be exact (the prescribed and done columns,
       per-set RPEs, XP, referral codes, passwords, the raw log, a count such as 0/200); dates, facts, placeholders and the strip's counters are Barlow with tabular-nums.
     CORNERS, three radii: 8 (fields, small boxes, code boxes), 12 (panels, cards, day cards, notices, sheets), 999 (chips, pills, buttons).
     ONE LEVEL of container: a panel has a 1px --line border and no shadow; what sits inside it is a hairline-divided row, never another card.
     COLOUR has one meaning each: green = brand, primary, on plan, the selected tab; clay = needs you, over target, destructive, a count that asks; steel blue = RPE under target
       only; plum (--ochre) = the middle warning only (adherence 60-84%, load climbing, the demo band). Free tier is a neutral outline chip, never plum.
     CONTROLS, one look each: buttons in four tiers (primary green fill, secondary outline = the default, quiet text only, danger clay outline) at one height (32 px, 40 px on
       a touch screen); every fold is a <details> with the chevron on the left; pick-one is either the segmented switch (.seg) for a view or a filter chip (.rf, .sp-filter, .sp)
       for a list; chips are one shape (999, 12, 600) in neutral, green, clay and plum.
     SPACING on a 4 px grid (4, 8, 12, 16, 24, 32); 24 px between sections on a PC, 16 on a phone; panel padding 16-20. ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--paper); color: var(--ink); font-family: 'Barlow', system-ui, sans-serif;
         font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  input:not([type=checkbox]):not([type=radio]):not([type=range]), textarea, select { border-radius: 8px; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--court); outline-offset: 2px; border-radius: 8px; }
  /* On the dark green surfaces a green ring is invisible. The ring sits 2px OUTSIDE the element, over what
     surrounds it, so a green button or the active tab on a light page keeps the green ring (white vanished there). */
  .tb-top :focus-visible, .board :focus-visible, .wline.coachline :focus-visible { outline-color: #fff; }
  @media (min-width: 900px) { .topbar :focus-visible { outline-color: #fff; } }

  /* .hd is a heading: Barlow 600, sentence case, at the size of its place. The two that are the brand (the sign-in card's title) and a person (the athlete's name
     in the file header) are Barlow Condensed in capitals, and nothing else is. */
  .hd { font-family: 'Barlow', sans-serif; font-weight: 600; }
  .gate h1.hd, .dethead h2.hd { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; }
  /* A group label: small letter-spaced capitals (the other place they are allowed is a column head). */
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .t-sm { font-size: 12px; }
  .t-clay { color: var(--clay-ink); }
  .t-green { color: var(--court); }
  .uc { text-transform: uppercase; }   /* a field that takes a code typed in capitals */
  /* The tone of a figure: a class, so a colour is never typed into a template. */
  .tone-green { color: var(--court); } .tone-plum { color: var(--ochre); } .tone-clay { color: var(--clay-ink); } .tone-ink { color: var(--ink); } .tone-muted { color: var(--muted); }
  .bar-fill.tone-green { background: var(--court); } .bar-fill.tone-plum { background: var(--ochre); } .bar-fill.tone-clay { background: var(--clay); } .bar-fill.tone-muted { background: var(--muted); }
  /* A number that lines up with others: Barlow's tabular figures (Space Mono is for numbers that must be exact: see THE LOOK). */
  .brand span, .who, .counter .n, .stab .n, .tab .n, .mp-v, .chart-big, .sp-n, .sp, .wday-n, .pct, .qday, .lib-n, .rf .c, .rgroup .c, .ffacts dd,
  .meta-table td.v, .fun .days, .dv-sub, .tfeed .td, .pulse .tag, .readiness .r b, .wallday .d, .proofstrip .big, .bb-item .n, .ms-row .n, .tbtn .tn { font-variant-numeric: tabular-nums; }

  /* ── Controls: ONE look each (round 3). Buttons come in four tiers at one height: PRIMARY (green fill; at most one per section), SECONDARY (outline; the
     default), QUIET (.quiet: text only) and DANGER (.danger: a clay outline; a clay fill only on the final button of a panel that asks first). .btn, .abtn, .modbtn,
     .tbtn and .seg are the same control: 32 px high with a mouse, 40 on a touch screen. ── */
  .btn, .abtn, .modbtn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 32px; padding: 0 16px; border-radius: 999px;
                         border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; line-height: 1.2; text-decoration: none;
                         white-space: nowrap; transition: border-color .15s, background .15s, color .15s; }
  .btn:hover, .abtn:hover, .modbtn:hover { border-color: var(--court); color: var(--court); }
  .btn.sm, .abtn, .modbtn { padding: 0 12px; }
  .btn.primary { background: var(--court); border-color: var(--court); color: #fff; }
  .btn.primary:hover { background: var(--court-deep); border-color: var(--court-deep); color: #fff; }
  .btn.quiet { background: none; border-color: transparent; color: var(--muted); padding: 0 8px; }
  .btn.quiet:hover { background: var(--court-100); border-color: transparent; color: var(--court); }
  .btn.danger { color: var(--clay-ink); border-color: var(--clay); background: var(--card); }
  .btn.danger:hover { background: var(--clay-100); border-color: var(--clay); color: var(--clay-ink); }
  /* The FINAL button of a panel that asks first (Erase for good, the dangerAsk panels) is the one place clay is a fill. */
  #eraseGo.danger, #dangerGo.danger { background: var(--clay-fill); border-color: var(--clay-fill); color: #fff; }
  #eraseGo.danger:hover, #dangerGo.danger:hover { background: var(--clay-ink); border-color: var(--clay-ink); color: #fff; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  @media (pointer: coarse) { .btn, .btn.sm, .abtn, .modbtn, .tbtn, .rf, .sp-filter, .sp { min-height: 40px; } .seg { min-height: 36px; } }
  /* A pill that says something: one shape (999, 12, 600) in four tones, neutral (an outline), green, clay and plum. .chip, .ipill, .fl, .zpill, .tag and .hidetag are all it. */
  .chip, .ipill, .fl, .zpill, .tag, .hidetag { display: inline-block; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted);
                                                font-size: 12px; font-weight: 600; line-height: 1.4; letter-spacing: 0; text-transform: none; white-space: nowrap; }
  .chip.court, .ipill.en, .ipill.pct, .fl.good, .tag.done { background: var(--court-100); border-color: transparent; color: var(--court); }
  .chip.clay, .ipill.fa, .ipill.warn, .fl.warn, .zpill.reply, .tag.warn, .hidetag { background: var(--clay-100); border-color: transparent; color: var(--clay-ink); }
  .tag.partial { background: var(--ochre-100); border-color: transparent; color: var(--ochre); }
  .fl.under { background: var(--rpe-under-100); border-color: transparent; color: var(--rpe-under); }
  .ipill.prog { background: var(--court); border-color: transparent; color: #fff; }
  .fl.miss { background: var(--clay-fill); border-color: transparent; color: #fff; }
  .fl.quiet, .ipill.used { background: transparent; border-color: var(--line); color: var(--muted); }
  /* A fold: ONE style, for every <details>. The chevron is on the left and turns when the fold opens, then the label (14 px, 600), then the count in muted text after it.
     A "How this works" fold (.how) is the quieter one: 12 px, muted, the same chevron. */
  details > summary { list-style: none; cursor: pointer; font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: ''; display: inline-block; flex: none; width: 8px; height: 8px; margin: 0 12px 2px 3px; vertical-align: middle;
                              border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(45deg); margin-bottom: 4px; }
  details > summary:hover { color: var(--court); }
  details > summary .muted, details > summary .lib-n, details > summary .muted-n { font-weight: 400; color: var(--muted); }
  .how > summary { font-size: 12px; font-weight: 400; color: var(--muted); }

  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

  /* ── The bar (2026-10-12, round 2 of the coach UX pass: nine tabs became seven places). From 900 px up it is ONE sticky bar, 56 px: the brand, the
     seven tabs and, on the right, the signed-in label, ↻ Refresh, ⚙ Tools and Sign out (it was a 58 px top bar over a 61 px tab rail). Under 900 px
     it is the top bar (brand, ↻, ⚙, Sign out; sticky) and ONE row of tabs under it that scrolls sideways inside itself; that row is not sticky,
     so it does not eat a phone's screen. One <header> holds .tb-top (the brand and the buttons) and .rail (the tabs). Under 900 px the header is
     display:contents, so .tb-top is the sticky row and .rail a row of the page; from 900 px up .tb-top is display:contents and the header is the
     flex row (brand, tabs, buttons: put in that order by `order`). --stick is what stays on screen at the top, so everything that offsets itself
     under the bar reads it. ── */
  .topbar { display: contents; }
  .tb-top { position: sticky; top: 0; z-index: 60; height: var(--stick); background: var(--court);
            display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 24px 0; }
  .tb-top::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--clay); }
  .brand { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: .08em;
           color: #fff; text-decoration: none; text-transform: uppercase; white-space: nowrap; }
  .brand span { opacity: .6; font-weight: 400; }
  .topbar .right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .who { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.75);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The bar's buttons are the secondary tier drawn on green: a white outline. */
  .tbtn { font-size: 14px; font-weight: 600; color: #fff; border: 1px solid rgba(255,255,255,.4);
          min-height: 32px; padding: 0 12px; border-radius: 999px; white-space: nowrap; transition: background .15s, border-color .15s;
          display: inline-flex; align-items: center; gap: 4px; }
  .tbtn:hover { background: rgba(255,255,255,.12); border-color: #fff; }
  .tbtn[aria-expanded="true"] { background: rgba(255,255,255,.18); border-color: #fff; }
  .tbtn .tn { margin-left: 4px; background: var(--clay-fill); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.4; padding: 0 8px; }
  /* The signed-in address is reassurance, not navigation: it goes first, then the button words, then the brand's second half. */
  @media (max-width: 719px) { .who { display: none; } }
  @media (max-width: 599px) { .tb-lbl { display: none; } .tbtn { padding: 0 12px; } .tb-top { padding: 4px 16px 0; } .brand { min-width: 0; overflow: hidden; text-overflow: ellipsis; } .topbar .right { flex: none; } }
  @media (max-width: 480px) { .brand span { display: none; } }
  @media (max-width: 360px) { .tb-top { padding: 4px 12px 0; gap: 8px; } .brand { letter-spacing: .04em; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
                              .topbar .right { gap: 8px; } .tbtn { padding: 0 8px; } }

  /* ── The tabs: seven places, sentence case, the active one underlined (the athlete file's .subrail does the same) ── */
  .rail { background: var(--paper); border-bottom: 1px solid var(--line); }
  .rail-in { position: relative; display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; padding: 0 8px 0 8px;
             -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
  .rail-in::-webkit-scrollbar { display: none; }
  .rail-in::after { content: ''; flex: none; width: 26px; }   /* the last tab ends clear of the fade when the row is scrolled to its end */
  .tab { flex: none; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none;
         font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px; color: var(--muted);
         padding: 12px 12px 8px; border-bottom: 3px solid transparent; margin-bottom: -1px; transition: color .15s; }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline-offset: -4px; border-radius: 8px; }
  .tab.active { color: var(--court); border-bottom-color: var(--court); }
  .tab .n { font-size: 12px; font-weight: 600; background: var(--clay-fill); color: #fff;
            min-width: 20px; text-align: center; padding: 0 8px; border-radius: 999px; line-height: 1.4; }
  @media (max-width: 360px) { .tab { padding: 12px 8px 8px; gap: 4px; } }
  @media (min-width: 900px) {
    :root { --stick: 56px; }
    .topbar { display: flex; align-items: stretch; gap: 16px; position: sticky; top: 0; z-index: 60; height: var(--stick);
              background: var(--court); padding: 4px 20px 0; }
    .topbar::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--clay); }
    .tb-top { display: contents; }
    .tb-top::before { content: none; }
    .brand { order: 1; align-self: center; }
    .rail { order: 2; flex: 1 1 auto; min-width: 0; display: flex; background: none; border: 0; }
    .topbar .right { order: 3; align-self: center; }
    .rail-in { flex: 1 1 auto; min-width: 0; padding: 0; -webkit-mask-image: none; mask-image: none; }
    .rail-in::after { content: none; }
    .tab { color: rgba(255,255,255,.76); padding: 0 12px; margin-bottom: 0; }
    .tab:hover { color: #fff; }
    .tab.active { color: #fff; border-bottom-color: #fff; }
  }
  /* What gives way as the window narrows, measured with the real address (24 characters) and the real fonts: the signed-in label below 1340 px, the brand's
     second half and the button words below 1180 px, then a little air in the tabs and the brand below 1020 px. At 900 px the seven tabs still fit the bar. */
  @media (min-width: 900px) and (max-width: 1339px) { .who { display: none; } }
  @media (min-width: 900px) and (max-width: 1179px) { .tb-lbl { display: none; } .brand span { display: none; } }
  @media (min-width: 900px) and (max-width: 1019px) { .brand { letter-spacing: .04em; } .tab { padding: 0 8px; } .topbar { gap: 8px; } .tbtn { padding: 0 10px; } }

  /* ── A phone's bottom bar (2026-10-12, round 3 of the coach UX pass; Amir works mostly on a PC, so nothing from 600 px up changes). Below 600 px the tab
     row is hidden and a bar fixed to the bottom of the screen takes its place: Today · Athletes · Exercises · More, the active one marked, the Athletes
     badge (notes to read) on its item. More opens a small sheet ABOVE the bar with the other four places (Proof, Leads with its new-applications badge,
     Library, Buyers); More is marked while one of them is on show and carries the Leads badge. 600-899 px keeps the one row of tabs. --bb is the bar's
     height, safe-area inset included; everything that sits at the bottom of the screen reads it, so nothing hides behind the bar (the toast, the Undo bar,
     the Exercises editor's Save bar), and scroll-padding keeps a scrolled-to element above the bar. The offsets
     of other components are here, next to the bar (`body` in front lifts their specificity over their own rules further down; those rules stay as they are).
     The top bar is unchanged (brand, ↻, ⚙ Tools, Sign out). z-index: scrim 66, sheet 69, bar 70, above the top bar (60) and the failbar (58). The page
     gets the bar's height as bottom padding. ── */
  .botbar, .moresheet, .morescrim { display: none; }
  @media (max-width: 599px) {
    :root { --bb: calc(56px + env(safe-area-inset-bottom, 0px)); }
    .rail { display: none; }
    #app { padding-bottom: var(--bb); }
    html { scroll-padding-bottom: var(--bb); }
    .botbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; height: var(--bb); padding-bottom: env(safe-area-inset-bottom, 0px);
              background: var(--card); border-top: 1px solid var(--line); box-shadow: var(--float-up); }
    .bb-item { flex: 1 1 0; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none;
               font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px; color: var(--muted); -webkit-tap-highlight-color: transparent; }
    .bb-item:hover { color: var(--ink); }
    .bb-item:focus-visible { outline-offset: -4px; border-radius: 8px; }
    .bb-item.active { color: var(--court); }
    .bb-item.active::before { content: ''; position: absolute; left: 20%; right: 20%; top: -1px; height: 3px; background: var(--court); border-radius: 999px; }
    .bb-l { position: relative; white-space: nowrap; }
    .bb-item .n { position: absolute; top: -12px; left: calc(100% - 2px); font-size: 12px; font-weight: 600; line-height: 1.4;
                  background: var(--clay-fill); color: #fff; min-width: 20px; text-align: center; padding: 0 4px; border-radius: 999px; }
    .morescrim:not([hidden]) { display: block; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 66; background: rgba(26,26,26,.34); }
    .moresheet:not([hidden]) { display: block; position: fixed; left: 0; right: 0; bottom: var(--bb); z-index: 69; padding: 8px 8px 12px;
                               max-height: calc(100vh - var(--bb) - var(--stick) - 12px); overflow-y: auto; overscroll-behavior: contain;
                               background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0;
                               box-shadow: var(--float-up); animation: riseIn .18s ease-out both; }
    .ms-row { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 8px 16px; border-radius: 12px; text-decoration: none; color: var(--ink); }
    .ms-row:focus-visible { outline-offset: -3px; }
    .ms-row { position: relative; }
    .ms-row.active { background: var(--court-100); color: var(--court); }
    .ms-row.active::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; border-radius: 999px; background: var(--court); }
    .ms-text { display: grid; min-width: 0; }
    .ms-name { font-size: 17px; font-weight: 600; line-height: 1.3; }
    .ms-note { font-size: 12px; line-height: 1.35; color: var(--muted); }
    .ms-row .n { margin-left: auto; flex: none; font-size: 12px; font-weight: 600; line-height: 1.4;
                 background: var(--clay-fill); color: #fff; min-width: 20px; text-align: center; padding: 0 8px; border-radius: 999px; }
    body #toast { bottom: calc(26px + var(--bb)); }
    body .undobar { bottom: calc(76px + var(--bb)); }
    body .spine-acts { bottom: var(--bb); }
    body .toolspanel { max-height: calc(100vh - var(--stick) - var(--bb) - 16px); }
  }
  /* 320 px: four 80 px items; a two-digit count on Athletes would reach into Exercises, so the labels and the count tuck in a little. */
  @media (max-width: 340px) { .bb-item .n { left: calc(100% - 5px); padding: 0 4px; min-width: 16px; } }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 90px; }
  @media (max-width: 480px) { .wrap { padding: 16px 16px 90px; } }
  /* Jump links (the Today counters) land below the sticky bar, not under it. */
  .panel, section, .wday { scroll-margin-top: calc(var(--stick) + 16px); }
  .loadwarn { max-width: 1180px; margin: 12px auto 0; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5;
              background: var(--clay-100); color: var(--ink); border-left: 3px solid var(--clay); }
  .loadwarn .btn { margin-left: 8px; }
  .loadwarn .lw-why { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  @media (max-width: 1220px) { .loadwarn { margin: 12px 20px 0; } }

  /* ── Login gate ── */
  .gate { max-width: 430px; margin: 14vh auto; text-align: center; background: var(--card);
          border: 1px solid var(--line); border-radius: 12px; padding: 44px 32px; box-shadow: var(--float); }
  .gate .mark { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: .2em;
                color: var(--court); margin-bottom: 16px; }
  .gate h1 { font-size: 30px; line-height: .95; margin-bottom: 12px; }
  .gate p { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.55; }
  .gate .err { color: var(--clay-ink); font-size: 14px; margin-top: 16px; min-height: 18px; }


  .loading { text-align: center; color: var(--muted); padding: 70px 0; }
  .spinner { width: 34px; height: 34px; border-radius: 999px; border: 3px solid var(--track);
             border-top-color: var(--court); margin: 0 auto 16px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Today's strip: the date, the season and the four counters on one line where they fit (2026-10-12, round 1 of the
     coach UX pass; it was a 200 px banner with a headline). The counters wrap 2 x 2 on a phone. ── */
  .board { position: relative; overflow: hidden; border-radius: 12px; color: #fff; padding: 16px 20px;
           display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
           background: radial-gradient(120% 260% at 12% 0%, #14684C 0%, var(--court) 46%, var(--court-deep) 100%);
           animation: riseIn .4s cubic-bezier(.16,1,.3,1) both; }
  .board-top { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  .board-date { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.86); white-space: nowrap; }
  .board-season { font-size: 12px; font-weight: 600; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
                  padding: 1px 12px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .board-season b { color: #fff; font-weight: 600; }
  .counters { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .counter { display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; background: rgba(255,255,255,.07);
             border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 8px 16px; transition: background .15s; }
  .counter:hover { background: rgba(255,255,255,.16); }
  .counter .n { font-size: 22px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
  .counter .n small { font-size: 12px; color: rgba(255,255,255,.66); }
  .counter .l { min-width: 0; font-size: 14px; font-weight: 500; line-height: 1.3; color: rgba(255,255,255,.86); }
  .counter.hot .n { color: #FFB99F; }
  @media (max-width: 760px) {
    .counters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; margin-left: 0; }
    .counter { border-radius: 12px; padding: 4px 12px; gap: 4px 8px; }
    .counter .l { font-size: 12px; }   /* the label of a half-width cell is meta, so it stays on one line */
  }
  /* A phone: the date and the season stay on one line, so the strip is date + two rows of counters (under 150 px at 390). */
  @media (max-width: 560px) {
    .board { padding: 12px 16px; }
  }

  /* ── Panels ── */
  /* Proof (round 2: the community's home): the wall and the board on the left (the wider column), the quest lever, the pulse,
     titles, the season and the funnel stacked on the right. One column below 900 px, the left column first. */
  .cols { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--gap); margin-top: var(--gap); align-items: start; }
  .colstack { display: grid; gap: var(--gap); }
  /* Today: Needs you wide on the left, Proof today (one short panel) on the right. One column
     below 900 px, in the same order (Needs you first): no reordering on a phone. */
  .tcols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--gap); margin-top: var(--gap); align-items: start; }
  /* Grid items default to min-width:auto, so one nowrap label inside a panel
     can push the whole column past its track and scroll the page sideways. */
  .cols > *, .tcols > *, .colstack > *, .counters > * { min-width: 0; }
  @media (max-width: 899px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 899px) { .tcols { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px;
           animation: riseIn .4s cubic-bezier(.16,1,.3,1) both; }
  .gap-top { margin-top: var(--gap); }
  .gap-bottom { margin-bottom: var(--gap); }
  /* A redraw of the screen already showing (a search keystroke, a save) does not replay the entrance. */
  .no-anim .panel { animation: none; }
  /* The Spine editor is 1300-2400 px tall: its Save stays in reach at the bottom of the screen. */
  .spine-acts { position: sticky; bottom: 0; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
                margin: 16px -20px -16px; padding: 12px 20px; background: var(--paper, #FAF7F2); border-top: 1px solid var(--line);
                border-radius: 0 0 12px 12px; }
  /* ── Exercises (round 2 of the coach UX pass, 2026-10-12): three sub-tabs (the athlete file's .subrail / .stab). On Entries the list
     and the editor sit side by side from 1000 px up, each scrolling on its own inside the height the page measures for them
     (spineFit(): from the top of the split to the bottom of the window); below that the list is the page and an open entry
     replaces it, with "← All exercises" above. ── */
  .sp-subrail { margin-bottom: 12px; }
  /* The sub-tabs of Leads and Buyers (same round) are drawn the same way, and tighten the same way on a phone. */
  @media (max-width: 400px) { .sp-subrail, .lead-subrail, .buy-subrail { gap: 0; } .sp-subrail .stab, .lead-subrail .stab, .buy-subrail .stab { padding: 12px 8px 8px; gap: 4px; } }
  .sp-intro { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .sp-warn { display: block; margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--clay-ink); text-underline-offset: 3px; }
  .sp-split + .how { margin-top: 16px; }
  .sp-stack { display: grid; gap: var(--gap); min-width: 0; }
  .sp-split { --sp-h: calc(100vh - 230px); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .sp-listpane { min-width: 0; padding: 16px 16px 8px; display: flex; flex-direction: column; }
  .sp-listhead { flex: none; }
  .sp-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  #spineQ { margin: 0; }
  .sp-count { font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  .sp-list { min-height: 0; margin: 0 -16px; }
  .sp-edpane { min-width: 0; scroll-margin-top: calc(var(--stick) + 12px); }
  .sp-empty { display: none; align-items: center; justify-content: center; min-height: 240px; padding: 20px; text-align: center;
              border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 14px; }
  .sp-back { margin-bottom: 12px; }
  .sp-split.has-ed .sp-listpane { display: none; }
  .credrow.spine-row { cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; align-items: center; padding: 8px 16px; }
  .credrow.spine-row:hover { background: var(--court-100); }
  .credrow.spine-row.on { background: var(--court-100); box-shadow: inset 3px 0 0 var(--court); }
  .spine-row .credname { min-width: 0; grid-column: 1; grid-row: 1; font-size: 14px; }
  .spine-row .sp-st { grid-column: 1; grid-row: 2; font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
  .spine-row .acts { grid-column: 2; grid-row: 1 / span 2; }
  @media (min-width: 1000px) {
    .sp-split { grid-template-columns: 380px minmax(0, 1fr); }
    .sp-split.has-ed .sp-listpane { display: flex; }
    .sp-listpane { max-height: var(--sp-h); }
    .sp-list { overflow: auto; overscroll-behavior: contain; }
    .sp-edpane .spine-ed { max-height: var(--sp-h); overflow: auto; overscroll-behavior: contain; padding-bottom: 0; }
    .sp-edpane .spine-acts { margin-bottom: 0; }
    .sp-empty { display: flex; }
    .sp-back { display: none; }
  }
  .sp-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 16px 0 4px; }
  .sp-tile { background: var(--paper); border-radius: 12px; padding: 12px 16px; min-width: 0; }
  .sp-tile .sp-n { display: block; font-size: 22px; font-weight: 600; line-height: 1.25; }
  .sp-tile .sp-l { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .sp-tile.hot .sp-n { color: var(--clay-ink); }
  @media (max-width: 640px) { .sp-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* The ten qualities: a row each on a desktop, the same boxes stacked (with their labels) on a phone. */
  .qm-head, .qm-row { display: grid; grid-template-columns: 140px minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1fr) 200px; gap: 8px 12px; align-items: start; }
  .qm-head { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 0 8px; border-bottom: 1px solid var(--line); }
  .qm-row { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .qm-row:last-of-type { border-bottom: 0; }
  .qm-c { min-width: 0; }
  .qm-lab { display: none; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .sp-fam { font-size: 12px; margin-top: 4px; }
  .qm-st { font-size: 12px; margin: 8px 0 8px; }
  .qm-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 899px) {
    .qm-head { display: none; }
    .qm-row { grid-template-columns: minmax(0, 1fr); }
    .qm-lab { display: block; }
    .qm-st { margin-top: 0; }
  }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .phead .t { font-size: 17px; line-height: 1.3; }
  .phead .r { font-size: 12px; color: var(--muted); }
  .psub { font-size: 12px; color: var(--muted); margin: -8px 0 12px; }

  .empty { color: var(--muted); font-size: 14px; padding: 12px 0 4px; }
  /* ── Leads: the referral-code cards (.intake-card and .i-*, named for the Intake they were first drawn for) and an application's closing row ── */
  /* A card in a panel is a hairline-divided row (one level of container): its header is the fold's summary, its body opens under it. */
  .intake-card { border-top: 1px solid var(--rule); }
  .intake-card:first-of-type { border-top: 0; }
  .intake-card.archived { opacity: .7; }
  .intake-card > summary { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; row-gap: 8px; }
  .intake-card > summary:hover { background: none; }
  .intake-card .i-name { font-weight: 600; font-size: 14px; }
  .intake-card .i-when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .i-body { padding: 4px 0 16px 28px; }
  .i-contact { font-size: 14px; margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .i-contact a { color: var(--court); border-bottom: 1px solid var(--court-100); }
  .i-contact .dot { color: var(--muted-soft); }
  .i-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  /* The closing row of an application (2026-10-12, round 2 of the coach UX pass): What happened, Which athlete (only when the outcome keeps one),
     Save outcome as the one primary button, and the quiet ways to close without an outcome (Mark handled, Archive, Reopen) at the right. */
  .i-outcome { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .i-outcome .i-now { margin: 0 0 12px; font-size: 14px; }
  .i-outcome .i-now a { color: var(--court); border-bottom: 1px solid var(--court-100); text-decoration: none; }
  .in-close { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .in-close label { flex: 1 1 200px; max-width: 260px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  .in-close select { width: 100%; min-height: 36px; font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px; max-width: 100%; }
  .in-quiet { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .in-quiet .btn { background: none; border-color: transparent; color: var(--muted); }
  .in-quiet .btn:hover { background: var(--court-100); border-color: transparent; color: var(--court); }
  .i-outcome [hidden] { display: none; }
  /* Leads → Applications (2026-10-12, round 2): the list on the left, the chosen application on the right. Below 1000 px the list is the screen
     until one is chosen, then that application is, with a way back (data-pane says which). The list scrolls by itself so the page does not. */
  .in-view { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); }
  .in-view > .panel { min-width: 0; }
  .in-view[data-pane="list"] > .in-detail, .in-view[data-pane="detail"] > .in-list { display: none; }
  .in-list { padding: 8px 0 12px; }
  .in-gh { display: block; padding: 12px 20px 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .in-arch > summary.in-gh { font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); padding-bottom: 12px; }
  .in-gh.hot { color: var(--clay-ink); }
  .in-none { padding: 4px 20px 8px; font-size: 14px; color: var(--muted); }
  .in-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; min-height: 56px; padding: 8px 20px; text-align: left; }
  .in-row + .in-row { border-top: 1px solid var(--rule); }
  .in-row:hover { background: var(--court-100); }
  /* The row on show is marked beside the application (wide), and on a phone only once one has been opened. */
  .in-view.touched .in-row.on { background: var(--court-100); box-shadow: inset 3px 0 0 var(--court); }
  .in-row .ava { width: 32px; height: 32px; border-radius: 999px; background: var(--court); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .in-row[data-st="archived"] .ava { background: var(--muted-soft); }
  .in-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .in-n { font-weight: 600; font-size: 14px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .in-s { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); }
  .in-s .ipill.pct { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .in-prog { white-space: nowrap; }
  .in-when { font-size: 12px; color: var(--muted); white-space: nowrap; align-self: start; padding-top: 2px; }
  .in-detail { padding: 20px 24px 24px; }
  .in-back { margin-bottom: 12px; }
  .in-title { font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
  .in-title:focus { outline: none; }
  .in-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .in-st.new { color: var(--clay-ink); font-weight: 600; }
  .in-contact { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; margin-top: 16px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 14px; }
  .in-c { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
  .in-c .k { font-size: 12px; color: var(--muted); }
  .in-c a { color: var(--court); border-bottom: 1px solid var(--court-100); text-decoration: none; overflow-wrap: anywhere; }
  .in-h { margin: 24px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .in-qa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
  .in-q { display: grid; grid-template-columns: minmax(88px, 38%) minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .in-q.long { grid-column: 1 / -1; grid-template-columns: minmax(88px, 19%) minmax(0, 1fr); }
  .in-q dt { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .in-q dd { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .in-q dd.rtl { text-align: right; }
  .in-empty { padding: 48px 0; text-align: center; color: var(--muted); font-size: 14px; }
  /* Two question-and-answer pairs to a row only while the application itself is 700 px wide or more (the pane, not the screen: at 1000 px it is 620). */
  .in-detail { container: intake / inline-size; }
  @container intake (max-width: 699px) {
    .in-qa { grid-template-columns: minmax(0, 1fr); }
    .in-q.long { grid-template-columns: minmax(88px, 38%) minmax(0, 1fr); }
  }
  @media (max-width: 699px) {
    .in-close label { flex-basis: 100%; max-width: none; }
    .in-detail { padding: 16px 16px 20px; }
    .in-gh, .in-none { padding-left: 16px; padding-right: 16px; }
    .in-row { padding-left: 16px; padding-right: 16px; }
  }
  @media (min-width: 1000px) {
    .in-view { grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
    .in-view.solo { grid-template-columns: minmax(0, 1fr); }
    .in-row.on { background: var(--court-100); box-shadow: inset 3px 0 0 var(--court); }
    .in-view[data-pane] > .in-list, .in-view[data-pane] > .in-detail { display: block; }
    .in-list { position: sticky; top: calc(var(--stick) + 12px); max-height: calc(100vh - var(--stick) - 28px); overflow-y: auto; }
    .in-back { display: none; }
  }

  /* ── Affiliates (referral-code roster — public.affiliates, stage29) ── */
  .aff-code { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px; letter-spacing: .02em; }
  .aff-form { padding: 16px 16px; background: var(--court-100); border-radius: 12px; }
  .aff-form .exf input { min-width: 160px; }
  .aff-uses { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ── Needs you (2026-10-12, round 1 of the coach UX pass): ONE white panel, rows divided by hairlines (no card inside the
     card), and one button on the right of each row that names what the tap does. The name and reasons are a button too: it opens
     the athlete, as the whole row used to. .needrow marks a note row, the one that can also be cleared from here. ── */
  .need { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 0; }
  .need + .need { border-top: 1px solid var(--rule); }
  .need .dot { flex: none; width: 8px; height: 8px; border-radius: 999px; margin-top: 8px; }   /* level with the first line of words, not the middle of the row */
  .need .dot.clay { background: var(--clay); } .need .dot.ochre { background: var(--ochre); }
  .need .dot.court { background: var(--court); } .need .dot.grey { background: var(--muted-soft); }   /* grey: a reason only worth knowing (plum is a middle warning, never "not urgent") */
  .need .b { flex: 1; min-width: 0; }
  /* The name and the top reason share a line; a long reason (a note quoted in full) wraps in its own column, two lines at most. */
  .need .l1 { display: flex; align-items: flex-start; gap: 4px 12px; min-width: 0; font-size: 14px; line-height: 1.4; }
  .need .n { flex: 0 1 auto; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .need .r1 { flex: 1 1 10em; min-width: 0; color: var(--ink); overflow-wrap: anywhere;
              display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .need .r1.warn { color: var(--clay-ink); }
  .need .s { display: block; font-size: 12px; line-height: 1.4; color: var(--muted); }
  .need .needgo { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 12px; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .need .needgo:hover .n { text-decoration: underline; }
  .need .needgo.static { cursor: default; }
  .need .needgo.static:hover .n { text-decoration: none; }
  .need .nacts { flex: none; display: flex; align-items: center; gap: 8px; }
  .need .nacts .btn { white-space: nowrap; }
  .need .nacts a.btn { text-decoration: none; }
  /* The housekeeping under the people: things to do that are not a person, so not a reason and not in the count. */
  .also { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .also .eyebrow { margin-bottom: 2px; }
  /* A phone: the buttons drop under the words, in line with the text and not the dot. */
  @media (max-width: 560px) {
    .need .l1 { flex-direction: column; }
    .need .r1 { flex-basis: auto; }
    .need { flex-wrap: wrap; row-gap: 8px; }
    .need .needgo { flex: 1 1 100%; }
    .need .nacts { flex-wrap: wrap; margin-left: 20px; }
  }

  /* ── The wall ── */
  /* The composer shows in two places: the full wall on Proof, and Today's Proof column (about 330 px wide at most, 240 px at 900 px).
     It is no box of its own (the textarea is the box) and its buttons wrap. */
  .mic { margin-bottom: 16px; }
  .mic .cap { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .mic textarea { width: 100%; min-height: 44px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--card); padding: 8px 12px; font-size: 14px; line-height: 1.45; }
  .mic textarea:focus { border-color: var(--court); }
  .mic .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; }
  .mic .count { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted-soft); margin-left: auto; }
  .mic .how { margin-top: 12px; }
  .wallday { margin: 16px 0 8px; display: flex; align-items: center; gap: 12px; }
  .wallday .d { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .wallday::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
  .wline { display: flex; gap: 12px; padding: 8px 4px; border-radius: 12px; align-items: flex-start; }
  .wline.hid { opacity: .45; }
  .wline .ava { flex: none; width: 34px; height: 34px; border-radius: 999px; background: var(--court); color: #fff;
                display: flex; align-items: center; justify-content: center;
                font-weight: 600; font-size: 12px; }
  .wline .bd { flex: 1; min-width: 0; }
  /* NOT .who — that is the topbar's signed-in label (white, nowrap) and it
     would paint these names white-on-white. */
  .wline .wtop { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .wline .nm { font-weight: 600; font-size: 14px; }
  .wline .pct { font-size: 12px; color: var(--muted); font-weight: 600; }
  .wline .txt { font-size: 14px; line-height: 1.45; margin-top: 1px; overflow-wrap: anywhere; }
  /* Hide / Show on a line is the quiet tier: text only until it is pointed at. */
  .wline .modbtn { flex: none; background: none; border-color: transparent; color: var(--muted); padding: 0 12px; }
  .wline .modbtn:hover { color: var(--clay-ink); background: var(--clay-100); border-color: transparent; }
  .wline.coachline { background: var(--court); color: #fff; border-radius: 12px; padding: 12px 12px; }
  .wline.coachline .ava { background: #fff; color: var(--court); }
  .wline.coachline .nm { color: #fff; }
  .showweek { width: 100%; text-align: center; font-size: 14px; font-weight: 600; color: var(--muted);
              padding: 12px 0 4px; }
  .showweek:hover { color: var(--court); }
  /* Today's Proof column (round 2): ONE panel, its parts (the composer, today's lines, the quest line, who is drifting) divided by
     hairlines, with no card inside the card. The last two are one line each and link to Proof, where the full lever and the pulse are. */
  .pt + .pt { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .pt .mic { margin-bottom: 0; }
  .pt .wallday:first-child { margin-top: 0; }
  .pt .empty { padding-top: 0; }
  .ptlink { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; }
  .ptlink:hover { color: var(--court); text-decoration: underline; }
  .ptline { display: block; font-size: 14px; line-height: 1.45; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
  .ptline:hover { color: var(--court); }
  .ptline b { font-weight: 600; }
  .ptline .dim { color: var(--muted); }
  .ptline.drift b.lead { color: var(--clay-ink); }

  /* ── Quest panel ── */
  /* Proof's right column (about 490 px wide at most): no box around the live run (rows divided by hairlines), and a quest's note drops
     under its name and XP instead of squeezing between them. */
  .questrun .qtop { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .questrun .qday { font-size: 12px; font-weight: 600; color: var(--muted); }
  .qchip { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--rule); }
  .qchip .qn { flex: 1 1 0; min-width: 0; font-weight: 600; font-size: 14px; }
  .qchip .qd { order: 3; flex: 1 0 100%; font-size: 12px; color: var(--muted); }
  .qchip .qx { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .qpick { border-top: 1px solid var(--rule); margin-top: 12px; padding-top: 12px; }
  .qopt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 12px; padding: 8px 2px; border-radius: 8px; cursor: pointer; }
  .qopt:hover { background: var(--court-100); }
  .qopt input { accent-color: var(--court); transform: translateY(1px); }
  .qopt .qn { flex: 1 1 0; min-width: 0; font-weight: 600; font-size: 14px; }
  .qopt .qd { order: 3; flex: 1 0 100%; padding-left: 24px; font-size: 12px; color: var(--muted); }
  .qopt .qx { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ── Pulse (7-day presence) ── */
  /* The row wraps instead of crushing the name when the column is at its narrowest (about 240 px at 900 px wide). */
  .pulse { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; width: 100%; text-align: left; padding: 8px 8px;
           border-radius: 12px; border-bottom: 1px solid var(--rule); }
  .pulse:last-of-type { border-bottom: 0; }
  .pulse:hover { background: var(--court-100); }
  .pulse .nm { flex: 1 1 96px; min-width: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse .dots { gap: 4px; }
  .pulse .dt { width: 12px; height: 12px; border-radius: 999px; }
  .pulse .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--muted-soft); }
  .dots { display: inline-flex; gap: 4px; flex: none; }
  .dt { width: 12px; height: 12px; border-radius: 999px; background: var(--track); }
  .dt.on { background: var(--court); }
  .dt.today { box-shadow: inset 0 0 0 2px var(--ink); background: var(--card); }   /* today is marked in ink: clay is for what asks something of you */
  .dt.today.on { background: var(--court); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--ink); }
  .pulse .tag { flex: none; margin-left: auto; }

  /* ── Chips: the one shape is in the controls block near the top. Only the level chip is its own. ── */
  .lvchip { font-size: 12px; font-weight: 600; color: var(--court); border: 1px solid var(--court); border-radius: 999px; padding: 1px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ── ⚙ Tools (2026-10-12, round 2 of the coach UX pass): the button is in the bar on every screen; its panel hangs under the bar at the right,
     above the page (a phone: the full width under the bar). Coach tools, Create missing logins and Logins to send: occasional and global.
     It sits inside .tb-top, which is the bar's own box under 900 px and a box-less wrapper over .topbar from 900 px up, so `top: 100%` is the foot of
     the sticky bar wherever the page is scrolled to, and a demo band above the bar cannot cover it. ── */
  .toolspanel { position: absolute; z-index: 2; top: 100%; right: 16px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - var(--stick) - 16px);
                overflow-y: auto; overscroll-behavior: contain; background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px;
                box-shadow: var(--float); padding: 16px 16px 16px; }
  .toolspanel[hidden] { display: none; }
  @media (max-width: 899px) { .toolspanel { left: 0; right: 0; width: auto; border-left: 0; border-right: 0; border-radius: 0 0 12px 12px; } }
  .toolspanel .tools-row { margin-bottom: 12px; }
  .tools { margin-bottom: 12px; }
  .tools > summary { padding: 0 0 12px; }
  .tools-in { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tools-note { flex-basis: 100%; font-size: 12px; color: var(--muted); }
  .tools > .how { margin-top: 12px; }
  .toolspanel .creds { margin: 0; padding: 12px 0 0; border: 0; border-top: 1px solid var(--rule); border-radius: 0; box-shadow: none; animation: none; background: none; }
  .stbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .stbtns .btn[aria-pressed="true"] { background: var(--court); border-color: var(--court); color: #fff; }
  .hidrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .hidrow .hw { font-size: 14px; }
  .hidrow .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .hidrow .hwho { flex-basis: 100%; font-size: 14px; color: var(--muted); }
  /* ── Roster ── */
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .controls input[type=search], .controls select { font-size: 14px; min-height: 36px; padding: 0 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); }
  .controls input[type=search] { flex: 1; min-width: 170px; }
  .controls input[type=search]:focus, .controls select:focus { border-color: var(--court); }
  /* The roster is one white surface, one row per person (2026-10-12). The same markup is a row of aligned columns on a PC (900 px and up)
     and a two-line row on a phone: line 1 the name and why they are here, line 2 the cycle, the last session and Proof. */
  .roster { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .roster > :last-child { border-bottom: 0; }
  .roster > .empty { padding: 16px 16px; }
  .ath { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; position: relative; width: 100%; min-height: 64px;
         padding: 12px 16px 12px 54px; text-align: left; border-bottom: 1px solid var(--rule); transition: background .12s; }
  .ath:hover { background: rgba(14,74,54,.05); }
  .ath:focus-visible { outline-offset: -2px; }
  .ath.flag { box-shadow: inset 3px 0 0 var(--clay); }
  .ath > span { min-width: 0; font-size: 14px; line-height: 1.35; }
  .ath .ava { position: absolute; left: 14px; top: 11px; width: 28px; height: 28px; border-radius: 999px; background: var(--court); color: #fff;
              display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; line-height: 1; }
  /* Free tier: the same disc, outlined and neutral (plum means a warning here, never a tier). */
  .ath.freeath .ava { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(26,26,26,.28); }
  .ath .a-id { order: 1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .ath .nm { font-size: 17px; font-weight: 600; line-height: 1.3; }
  .ath .tier { font-size: 12px; color: var(--muted); }
  .ath .a-why { order: 2; flex: 1 1 96px; color: var(--muted); }
  .ath .a-why .warn { color: var(--clay-ink); font-weight: 600; }
  .ath .a-why .spike { color: var(--ochre); }
  .ath::after { content: ''; flex-basis: 100%; height: 0; order: 3; }
  .ath .a-cycle, .ath .a-last, .ath .a-proof { order: 4; color: var(--muted); overflow-wrap: anywhere; margin-right: 8px; }
  .ath .a-last.dash { display: none; }   /* a phone row has no room for an empty cell */
  .ath .a-cycle b { color: var(--ink); font-weight: 600; }
  .ath .a-cycle .warn { color: var(--clay-ink); font-weight: 600; }
  .ath .a-last .n { font-size: 12px; }
  @media (max-width: 899px) { .ath .a-cycle, .ath .a-last, .ath .a-proof { font-size: 12px; } }   /* the second line of a phone row is meta */
  .ath .a-proof { display: flex; align-items: center; gap: 8px; overflow-wrap: normal; }
  .ath .a-proof:empty, .ath .a-why:empty { display: none; }
  .ath .a-proof .n7 { font-variant-numeric: tabular-nums; }
  .ath .lvtext { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .rhead { display: none; }
  @media (min-width: 900px) {
    .rhead, .ath { --rcols: 28px minmax(130px, 1.1fr) minmax(150px, 1fr) minmax(120px, .9fr) 190px minmax(140px, 2fr); }
    .rhead { display: grid; grid-template-columns: var(--rcols); column-gap: 16px; align-items: end; padding: 8px 16px;
             border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .rhead .h-ath { grid-column: 1 / 3; }
    .ath { display: grid; grid-template-columns: var(--rcols); column-gap: 16px; align-items: center; min-height: 52px; padding: 8px 16px; }
    .ath::after { content: none; }
    .ath .ava { position: static; }
    .ath .a-id, .ath .a-why, .ath .a-cycle, .ath .a-last, .ath .a-proof { order: 0; margin-right: 0; }
    .ath .a-last.dash, .ath .a-why:empty, .ath .a-proof:empty { display: block; }
  }

  /* ── Detail ── */
  .back { display: inline-block; font-size: 14px; color: var(--court); font-weight: 600; margin-bottom: 16px; text-decoration: none; padding: 8px 0; }
  .dethead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .dethead h2 { font-size: 30px; line-height: 1; }
  .dethead .sub { font-size: 14px; color: var(--muted); margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dethead .det-num { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .dethead .det-wa a:not(.abtn) { color: var(--court); border-bottom: 1px solid var(--court-100); }
  .sec { font-weight: 600; font-size: 17px; color: var(--ink); margin: 24px 0 12px; display: flex; align-items: center;
         justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  /* ── Athlete → File: four groups, one white panel each; label / value / action rows between hairlines (2026-10-12) ── */
  .fgroup { margin-top: 24px; }
  .fgroup:first-child { margin-top: 4px; }
  .fh { font-size: 17px; font-weight: 600; color: var(--ink); margin: 0 0 12px; }
  .fpanel { padding: 2px 20px; }
  .frow { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 4px 16px; padding: 16px 0; border-top: 1px solid var(--rule); align-items: start; }
  .frow:first-child { border-top: 0; }
  .frow-l { font-size: 14px; font-weight: 600; color: var(--muted); padding-top: 8px; }
  .frow-b { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .frow-v { flex: 1 1 220px; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
  .frow-v .pwin { width: 100%; min-width: 0; }
  .frow-b.is-form .frow-v { flex: 0 1 380px; }
  .frow-a { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .frow-b.is-form .frow-a { margin-left: 0; }
  .frow-a .stbtns { margin: 0; }
  .frow-h { flex: 1 0 100%; margin: 0; font-size: 12px; color: var(--muted); }
  .frow-w { flex: 1 0 100%; min-width: 0; }
  .frow .credrow { padding: 8px 0 0; border-bottom: 0; }
  .frow .pwform { padding: 4px 0 0; }
  .frow-w .waform { padding: 0; }
  .frow-w .waform .pwin { max-width: 520px; }
  .frow-w .erase { margin: 4px 0 0; }
  .ffacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 20px; padding: 16px 0; }
  .ffacts dt { font-size: 12px; font-weight: 600; color: var(--muted); }
  .ffacts dd { margin-top: 2px; font-size: 14px; overflow-wrap: anywhere; }
  .ffacts dd.warn { color: var(--clay-ink); font-weight: 600; }
  .fpanel .rawlog { margin-top: 0; padding: 12px 0; }
  .frec { padding: 16px 0; border-top: 1px solid var(--rule); }
  .frec:first-child { border-top: 0; }
  .frec-h { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .frec-t { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .fpanel .day-c { border: 0; border-top: 1px solid var(--rule); border-radius: 0; margin: 0; background: none; }
  .fpanel .day-c > summary { padding: 12px 0; }
  .fpanel .day-c > summary:hover { background: none; }
  .fpanel .day-c[open] > summary { border-bottom: 0; }
  .fpanel .day-c-body { padding: 0 0 16px; }
  /* The Danger zone is a group like the other three, so its title is a 17 px group heading, in clay because what is inside destroys; the chevron is the fold's own. */
  details.fdanger > summary { font-size: 17px; color: var(--clay-ink); margin: 0 0 12px; }
  details.fdanger > summary:hover { color: var(--clay-ink); }
  .how { border-top: 1px solid var(--rule); padding: 12px 0 12px; }
  .how p { margin: 8px 0 0; max-width: 72ch; font-size: 14px; line-height: 1.55; color: var(--muted); }
  .how p b { font-weight: 600; color: var(--ink); }
  @media (max-width: 640px) {
    .frow { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .frow-l { padding-top: 0; }
    .frow-a { margin-left: 0; }
    .fpanel { padding: 2px 16px; }
  }

  /* ── Athlete file: identity + sub-tabs ── */
  .det-id { display: flex; align-items: flex-start; gap: 16px; min-width: 0; flex: 1 1 380px; }
  .det-id > div { min-width: 0; }
  .dethead h2 { overflow-wrap: anywhere; }
  .det-ava { flex: none; width: 44px; height: 44px; border-radius: 999px; background: var(--court); color: #fff;
             display: flex; align-items: center; justify-content: center;
             font-weight: 600; font-size: 17px; }
  /* The cycle and what needs the coach sit under the name on every sub-tab; the actions sit on the right (below the name on a phone). */
  .det-cycle { margin-top: 8px; font-size: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .det-cycle b { font-weight: 600; }
  .det-cycle .det-fo { color: var(--muted); }
  .det-need { margin-top: 4px; font-size: 14px; }
  .det-need a { color: var(--ink); text-underline-offset: 3px; }
  .det-need a:hover { color: var(--court); }
  .det-need a.warn { color: var(--clay-ink); font-weight: 600; }
  .det-acts { display: flex; gap: 8px 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .det-wa { display: inline-flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 14px; }
  .det-wa .abtn { background: var(--court); border-color: var(--court); color: #fff; padding: 0 16px; }
  .det-wa .abtn:hover { background: var(--court-deep); color: #fff; }
  @media (max-width: 640px) { .det-acts { flex-basis: 100%; justify-content: flex-start; } .dethead h2 { font-size: 22px; } }
  .subrail { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line);
             margin-bottom: 16px; padding-bottom: 0; }
  .subrail::-webkit-scrollbar { display: none; }
  /* Sub-tabs are drawn like the top tabs: Barlow 600, sentence case, the selected one in green with a green underline. */
  .stab { font-weight: 600; font-size: 14px; color: var(--muted); padding: 12px 12px 8px; text-decoration: none; white-space: nowrap;
          border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; }
  .stab:hover { color: var(--ink); }
  .stab.active { color: var(--court); border-bottom-color: var(--court); }
  .stab .n { font-size: 12px; font-weight: 600; line-height: 1.4; background: var(--clay-fill); color: #fff;
             min-width: 20px; text-align: center; padding: 0 8px; border-radius: 999px; }
  .stab .n.quiet { background: var(--track); color: var(--muted); }

  /* ── Metric strip (the three numbers, charts behind one tap) ── */
  .mstrip { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 12px; margin-bottom: 16px; align-items: stretch; }
  .mp { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; text-align: left; }
  .mp-l { font-size: 12px; font-weight: 600; color: var(--muted); }
  .mp-v { font-size: 22px; font-weight: 600; line-height: 1.2; margin-top: 2px; }
  .mp-v small { font-size: 12px; color: var(--muted); }
  .mp-s { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .mp.green .mp-v { color: var(--court); } .mp.amber .mp-v { color: var(--ochre); } .mp.red .mp-v { color: var(--clay-ink); }
  .mp-more { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .mp-more:hover { border-color: var(--court); color: var(--court); }
  .chartbox { margin-bottom: 16px; }
  @media (max-width: 760px) { .mstrip { grid-template-columns: repeat(3, 1fr); } .mp-more { grid-column: 1 / -1; justify-content: center; } }

  /* ── A day of work: prescribed and done on one line ── */
  .wday { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: clip; }
  .wday.warn { border-left: 3px solid var(--ochre); }
  .wday.idle { background: transparent; }
  .wday-top { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 16px 16px; }
  .wday-top:hover { background: rgba(0,0,0,.02); }
  .wday-n { flex: none; width: 34px; height: 34px; border-radius: 8px; background: var(--court-100); color: var(--court);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 14px; }
  .wday.idle .wday-n { background: var(--track); color: var(--muted); }
  .wday-main { flex: 1; min-width: 0; }
  .wday-title { display: block; font-weight: 600; font-size: 17px; line-height: 1.25; }
  .wday-meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .wday-right { flex: none; display: flex; align-items: center; gap: 12px; text-align: right; }
  .dv { font-weight: 600; font-size: 14px; }
  .dv.ok { color: var(--court); } .dv.warn { color: var(--ochre); } .dv.miss { color: var(--clay-ink); }
  .dv-sub { display: block; font-size: 12px; color: var(--muted); }
  .wday-body { display: none; padding: 0 16px 16px; }
  .wday.open .wday-body { display: block; }
  .wday .day-c-chev { flex: none; width: 8px; height: 8px; overflow: hidden; font-size: 12px; line-height: 1; color: transparent; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
                      transform: rotate(45deg); transition: transform .15s; margin: 0 4px 4px 0; }
  .wday.open .day-c-chev { transform: rotate(225deg); margin-bottom: 0; }
  /* Narrow: the verdict is nowrap and would squeeze the title down to one word
     per line, so give it its own row under the day name instead. */
  @media (max-width: 900px) {
    .wday-top { flex-wrap: wrap; row-gap: 8px; }
    .wday-n { order: 1; }
    .wday-main { order: 2; flex: 1 1 auto; min-width: 0; }
    .wday-top .day-c-chev { order: 3; }   /* stays on row one, not stranded below */
    .wday-right { order: 4; flex: 1 1 100%; flex-wrap: wrap; justify-content: flex-start; text-align: left; }
    .wday-right .dv-sub { display: none; }
  }

  .sesspick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0 4px; border-top: 1px solid var(--rule); }
  /* Pick-one for a list: a FILTER CHIP. One shape and one selected look (green fill, white text) for the roster's filters, the Spine's filters and this date picker. */
  .rf, .sp { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card);
             color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.2; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rf:hover, .sp:hover { border-color: var(--court); color: var(--court); }
  .rf.on, .sp.on, .sp-filter.primary { background: var(--court); border-color: var(--court); color: #fff; }
  .sp-lbl { font-size: 12px; color: var(--muted-soft); margin-left: auto; }

  .stalewarn { background: var(--ochre-100); border-left: 3px solid var(--ochre); border-radius: 8px;
               padding: 12px 16px; margin-top: 12px; font-size: 14px; line-height: 1.5; }
  .daynote { background: var(--paper); border-left: 3px solid var(--clay); border-radius: 8px; padding: 12px 16px; margin-top: 12px; }
  .daynote .dn-txt { font-size: 14px; line-height: 1.5; }
  .daynote .dn-read { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .cmp-grp { margin-top: 16px; }
  .cmp-grp-t { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600;
               border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .cmp-head, .cmp-row { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.15fr) minmax(0, 1.5fr) minmax(0, .95fr);
                        gap: 12px; align-items: start; }
  .cmp-head { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
              padding: 16px 0 0; position: sticky; top: var(--stick); background: var(--card); z-index: 2; }
  .cmp-row { padding: 12px 0; border-bottom: 1px solid var(--rule); position: relative; }
  .cmp-row:last-child { border-bottom: 0; }
  .cmp-row::before { content: ''; position: absolute; left: -12px; top: 12px; bottom: 12px; width: 3px; border-radius: 999px; }
  .cmp-row.warn::before { background: var(--ochre); }
  .cmp-row.miss::before { background: var(--clay); }
  .cmp-nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .cmp-vid { text-decoration: none; color: var(--court); font-size: 12px; }
  .cmp-items { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .cmp-cnote, .cmp-anote { font-size: 12px; line-height: 1.45; margin-top: 4px; padding: 4px 8px; border-radius: 8px; background: var(--paper); }
  .cmp-cnote { border-left: 2px solid var(--court); }
  .cmp-anote { border-left: 2px solid var(--clay); }
  .cmp-rx { font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.5; }
  .rx-dose { display: inline-block; }
  .rx-rpe { display: inline-block; margin-left: 8px; color: var(--court); }
  .rx-sub { font-family: 'Barlow', sans-serif; font-size: 12px; color: var(--muted-soft); margin-top: 2px; line-height: 1.4; }

  /* ── Prescription editor ─────────────────────────────────────────────── */
  /* The pencil is always there, a faint grey glyph that goes dark on hover and focus (round 3 of the coach UX pass, 2026-10-12: it used to be
     hidden until the row was hovered, and nobody knew it was there). It sits at the top right of the prescribed column, out of the text's way. */
  .rx-edit { background: none; border: 0; cursor: pointer; color: var(--muted-soft); font-size: 14px; line-height: 1;
             padding: 4px 4px; margin-top: 4px; border-radius: 8px; transition: color .12s, background .12s; }
  .rx-edit:hover, .rx-edit:focus-visible { color: var(--court); }
  /* A finger-sized target on a touch screen. */
  @media (hover: none) { .rx-edit { padding: 8px 12px; margin-left: -12px; font-size: 14px; }
    /* iOS zooms the page into any field under 16 px when it gets focus. */
    .exf input, .exf textarea, .exf select, .fld, .pwin, .controls input[type=search], .controls select { font-size: 16px; }
    .sp { padding: 8px 12px; } }
  /* On a pointer screen the pencil takes no line of its own: it sits at the top right of the prescribed column, which keeps room for it. */
  @media (hover: hover) { .rx-edit { position: absolute; top: 0; right: 0; margin-top: 0; } .cmp-rx { position: relative; padding-right: 32px; } }
  .rx-edit:hover { background: var(--court-100); }
  .rx-warn { font-family: 'Barlow', sans-serif; font-size: 12px; color: var(--clay-ink);
             margin-top: 4px; cursor: help; }
  .rx-editor { grid-column: 1 / -1; margin: 12px 0 4px; padding: 16px 16px;
               background: var(--court-100); border-radius: 12px; }
  .exed-title { font-size: 14px; color: var(--ink); margin-bottom: 12px; }
  .exed-grid { display: flex; flex-wrap: wrap; gap: 16px 16px; }
  .exf { display: flex; flex-direction: column; gap: 4px; font-family: 'Barlow', sans-serif; }
  .exf > span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .exf input, .exf textarea, .exf select { font-family: 'Barlow', sans-serif; font-size: 14px; padding: 8px 8px;
    border: 1px solid var(--rule); border-radius: 8px; background: var(--card); color: var(--ink); }
  .exf input:focus, .exf textarea:focus, .exf select:focus { outline: 2px solid var(--court); outline-offset: -1px; border-color: transparent; }
  /* The seven fields of the ✎ editor are one row (they wrap on a narrow screen): labels all one line high, boxes all one height, the Dose select drawn
     like the boxes, and Per side's tick in a box of the same height so the row's bottom edge is straight. */
  .rx-editor .exed-grid { align-items: flex-end; gap: 12px 16px; }
  .rx-editor .exed-grid .exf > span { line-height: 16px; white-space: nowrap; }
  .rx-editor .exf input:not([type=checkbox]), .rx-editor .exf select { height: 34px; }
  .rx-editor .exf select { cursor: pointer; }
  /* The prescription's numbers must be exact: Space Mono, in the boxes and the Dose select alike. */
  .rx-editor .exf input:not([type=checkbox]), .rx-editor .exf select { font-family: 'Space Mono', monospace; font-size: 12px; }
  .rx-editor .exf input[type=checkbox] { width: 18px; height: 18px; margin: 8px 4px; accent-color: var(--court); cursor: pointer; }
  @media (hover: none) { .rx-editor .exf input:not([type=checkbox]), .rx-editor .exf select { height: 38px; } .rx-editor .exf input[type=checkbox] { margin: 12px 4px; } }
  /* A phone: two to a row (Sets Dose / Value Per side / RPE Tempo / Rest), the boxes the width of their half. The inline widths are for the one-row desktop. */
  @media (max-width: 560px) { .rx-editor .exed-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 16px; align-items: end; }
    .rx-editor .exed-grid .exf input:not([type=checkbox]), .rx-editor .exed-grid .exf select { width: 100% !important; } }
  /* A form field of the Spine and Quality editors (it was typed into every tag as a style). */
  .fld { width: 100%; font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-sizing: border-box; }
  .fld-b { font-weight: 600; }
  .fld-auto { width: auto; }
  .exlbl { font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  .pbar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .pbar-in { height: 100%; background: var(--court); border-radius: 999px; }
  .exf-wide { margin-top: 12px; }
  .exf-wide textarea { width: 100%; box-sizing: border-box; resize: vertical; }
  .exed-mods { margin-top: 12px; font-family: 'Barlow', sans-serif; font-size: 12px; color: var(--muted); }
  .exed-warn { margin-top: 12px; padding: 8px 12px; border-radius: 8px; background: var(--clay-100);
               color: var(--clay-ink); font-family: 'Barlow', sans-serif; font-size: 12px; line-height: 1.5; }
  .exed-acts { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .exed-hint { font-family: 'Barlow', sans-serif; font-size: 12px; color: var(--muted-soft); }
  /* The pill picker (CHP-2, 2026-10-11): the closed list from chips.js, at most two, one per group. */
  .pillpick { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  /* Folded (round 3, 2026-10-12): the chosen pills are chips with a ✕, and the six groups open only on "Change pill" / "Add a pill". */
  .pp-sel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 8px; min-height: 30px; font-family: 'Barlow', sans-serif; }
  .pp-chip { display: inline-flex; align-items: center; gap: 2px; padding: 0 2px 0 12px; min-height: 28px; border-radius: 999px; background: var(--court-100);
             border: 1px solid transparent; color: var(--court); font-size: 12px; font-weight: 600; }
  .pp-x { width: 24px; height: 24px; border-radius: 999px; font-size: 12px; line-height: 1; color: var(--muted); }
  .pp-x:hover, .pp-x:focus-visible { background: var(--court-100); color: var(--court); }
  .pp-none { font-size: 12px; color: var(--muted); }
  .pp-toggle { font-size: 12px; font-weight: 600; color: var(--court); padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
  .pp-toggle:hover { color: var(--court-deep); }
  .pp-groups { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
  .pp-groups[hidden] { display: none; }
  @media (hover: none) { .pp-x { width: 32px; height: 32px; } .pp-toggle { padding: 8px 4px; } }
  .pp-grp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-family: 'Barlow', sans-serif; }
  .pp-g { width: 112px; font-size: 12px; color: var(--muted); font-weight: 600; }
  /* A pill in the picker is a filter chip too: the same shape and the same selected look as the roster's filters. */
  .pp { display: inline-flex; align-items: center; min-height: 32px; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600; padding: 0 12px; border-radius: 999px;
        border: 1px solid var(--line); background: var(--card); color: var(--muted); }
