// Publish a workout or article into the Library.
//
// The /workout and /article skills still write the JSON; this is how it goes live.
// There is no manifest to update any more — the category comes from the file's own
// `category` field and the card details are read off the item itself, which is what
// used to make adding a workout a two-file job.
function pickLibraryFile(kind) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (LOAD_ERR.library) { alert('The library did not load (' + LOAD_ERR.library + '), so nothing can be published: its categories are unknown. Tap ↻ Refresh first.'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.multiple = true;
  input.onchange = async () => {
    const files = [...(input.files || [])];
    if (!files.length) return;

    const rows = [], bad = [];
    for (const f of files) {
      let d;
      try { d = JSON.parse(await f.text()); }
      catch (e) { bad.push(f.name + ': not valid JSON'); continue; }
      const id  = String(d.id || '').trim();
      const cat = String(d.category || '').trim();
      // A Farsi translation is a web page source, never an app article: if one carried id and
      // category it would overwrite the English article for every athlete (CLAUDE.md).
      if (/\.fa\.json$/i.test(f.name) || d.lang === 'fa' || d.sourceHash || d.translationOf) {
        bad.push(f.name + ': a Farsi translation (.fa.json) — it builds the website page, it never goes in the app'); continue;
      }
      const looksWorkout = 'countsAs' in d || 'focusTag' in d || 'duration' in d;
      if (kind === 'article' && looksWorkout) { bad.push(f.name + ': this is a workout file — use + Publish workout'); continue; }
      if (kind === 'workout' && !looksWorkout && ('readMins' in d || 'date' in d)) { bad.push(f.name + ': this is an article file — use + Publish article'); continue; }
      if (!id)  { bad.push(f.name + ': no "id" field'); continue; }
      if (!cat) { bad.push(f.name + ': no "category" field, which decides its shelf'); continue; }
      // Workouts name the shelf by its id ("conditioning"), articles by its title ("Pre-Competition").
      const shelf = (S.libCats || []).find(c => c.kind === kind &&
        (c.id === cat || String(c.title || '').toLowerCase() === cat.toLowerCase() || c.id === cat.toLowerCase()));
      if (!shelf) { bad.push(f.name + ': category "' + cat + '" does not exist yet'); continue; }
      rows.push({
        slug: (kind === 'workout' ? 'workouts/' : 'articles/') + shelf.id + '/' + id,
        kind, category_id: shelf.id, data: d, published: true,
      });
    }

    const NL = String.fromCharCode(10);
    if (bad.length && !rows.length) { alert('Nothing published:' + NL + NL + bad.join(NL)); return; }
    const preview = rows.map(r => '· ' + (r.data.title || r.slug)).join(NL);
    const skipped = bad.length ? NL + NL + 'Skipped:' + NL + bad.join(NL) : '';
    if (!confirm('Publish ' + rows.length + ' ' + kind + '(s)?' + NL + NL + preview + skipped)) return;

    const res = await sb.from('library').upsert(rows, { onConflict: 'slug' }).select('slug');
    const badW = writeFailed(res, 'published');
    if (badW) { alert('Could not publish: ' + badW); return; }
    await loadLibrary();
    render();
    alert('Published ' + rows.length + '.' + skipped);
  };
  input.click();
}

async function loadLibrary() {
  S.libCats = [];
  S.lib = [];
  const [c, l] = await Promise.all([
    sb.from('library_categories').select('*').order('sort_order'),
    sb.from('library').select('slug, kind, category_id, published, updated_at, data').order('sort_order'),
  ]);
  if (!c.error) S.libCats = c.data || [];
  if (!l.error) S.lib = l.data || [];
  LOAD_ERR.library = (c.error || l.error) ? (c.error || l.error).message : '';
}

// Open an athlete's own app in a new tab, read-only.
//
// No impersonation needed: get_program() and the athlete RPCs accept the coach, so
// Amir's own session already resolves their programme. `preview=1` is what stops the
// app writing — it loads their real data but skips every cloud write, so looking
// around cannot land a stray tick or note in the athlete's logged record.
function viewAsAthlete(athleteId, which) {
  const page = which === 'habits' ? 'habits.html' : 'program.html';
  // The demo's athletes are made up: show the public demo programme instead.
  if (DEMO) { window.open(`${SITE}/${page}?client=demo`, '_blank', 'noopener'); return; }
  window.open(`${SITE}/${page}?client=${encodeURIComponent(athleteId)}&preview=1`, '_blank', 'noopener');
}

// Publish a programme JSON straight from disk into the database.
//
// The coaching pipeline (/program-assemble and friends) still writes a local
// data/<id>.json — that stays exactly as it was. What changed is where the file
// goes afterwards: it used to be committed and served publicly; now it is
// uploaded here and the file never leaves the machine. This is the only route
// for a NEW athlete or a whole-cycle rewrite; day-to-day changes go through the
// inline editor.
function pickProgramFile() {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    let data;
    try {
      data = JSON.parse(await file.text());
    } catch (e) {
      alert('That file is not valid JSON:\n\n' + e.message);
      return;
    }
    // Guard against publishing a half-written or wrong-shaped file. The athlete
    // block is the one thing every consumer reads — program.html and habits.html
    // both take the name and tier from it.
    if (!data || typeof data !== 'object' || !data.athlete || typeof data.athlete !== 'object') {
      alert('That file has no "athlete" block, so it is not a programme file.');
      return;
    }
    const id = String(data.athlete.id || '').trim();
    if (!/^[A-Za-z0-9_]+$/.test(id)) {
      alert('The athlete.id in that file is missing or has characters that are not allowed.\n\nFound: "' + id + '"');
      return;
    }
    // The pipeline names the file after the athlete (data/<id>.json). A file whose name and
    // athlete.id disagree is the wrong file, or a copy edited for someone else.
    // "ava.json", "ava (1).json" and "ava.cycle3.json" all name ava; "ava_2.json" names someone else.
    const stem = file.name.replace(/\.json$/i, '');
    if (stem !== id && !(stem.startsWith(id) && /^[\s.\-(]/.test(stem.slice(id.length)))) {
      alert(`The file is called "${file.name}" but its athlete.id is "${id}".\n\nNothing was published. Check you picked the right file (the pipeline writes data/<id>.json).`);
      return;
    }
    if (LOAD_ERR.programs) { alert('Programmes did not load, so I cannot tell whether this would replace a newer one. Tap ↻ Refresh first.'); return; }
    const existing = S.programs[id];
    const meta = S.progMeta[id] || {};
    const days = (data.workouts && data.workouts.days || []).length;
    const cyc = p => { const c = p && p.cycles && p.cycles[p.currentCycleIndex || 0]; return c ? (c.name || ('cycle ' + ((p.currentCycleIndex || 0) + 1))) : '—'; };
    const fileTime = file.lastModified ? new Date(file.lastModified) : null;
    const liveTime = meta.updated_at ? new Date(meta.updated_at) : null;
    const liveNewer = existing && fileTime && liveTime && liveTime > fileTime;
    const what = existing
      ? `Replace ${nameOf(id)}'s programme (${id})?\n\n` +
        `Live now: ${cyc(existing)} · ${(existing.workouts && existing.workouts.days || []).length} days · last saved ${liveTime ? fmtLocalStamp(meta.updated_at) : '—'}${meta.updated_by ? ' by ' + meta.updated_by : ''}\n` +
        `This file: ${cyc(data)} · ${days} days · saved ${fileTime ? fmtLocalStamp(fileTime.toISOString()) : '—'}\n` +
        (liveNewer ? `\n⚠ THE LIVE PROGRAMME IS NEWER THAN THIS FILE. Publishing it puts an older version back (an edit made here, or a cycle published by the pipeline, would be lost from the live app).\n` : '') +
        `\nNew cycles normally go up through the pipeline (publish_cycle). The current version is kept in Version history, so this is reversible.`
      : `Publish a NEW programme for "${id}"?\n\nNothing exists for that id yet — check the spelling, because a typo creates a second athlete.\n\n${file.name} · ${cyc(data)} · ${days} training day${days === 1 ? '' : 's'}`;
    if (!confirm(what)) return;

    const res = await sb.from('programs')
      .upsert({ athlete_id: id, data }, { onConflict: 'athlete_id' }).select('athlete_id');
    const bad = writeFailed(res, 'published');
    if (bad) { alert('Could not publish: ' + bad); return; }

    await reloadPrograms();
    render();
    toast(existing ? 'Programme replaced' : 'Programme published');
  };
  input.click();
}

// The same "counts as a logged day" test contact_list() uses server-side: the
// day's value is an object with at least one key. Presence, not score.
// ── Body weight ───────────────────────────────────────────────────────────
// Proof writes weight to its OWN key in the same progress blob — never into the
// habit log, because the server pays XP for unrecognised keys in a day object
// and a weight in there would score on the leaderboard and nowhere else. It is
// read-only here: the coach watches the trend, the athlete owns the record.
// Shape: { '2026-09-01': { kg: 78.4, t: 1756... } }
const WT_AVG_WINDOW = 7;
function wtOf(blob, id) {
  const wt = jparse(blob ? blob[id + '_hab_wt'] : null);
  const out = {};
  if (wt && typeof wt === 'object') {
    Object.keys(wt).forEach(k => {
      const e = wt[k];
      if (e && typeof e.kg === 'number' && isFinite(e.kg)) out[k] = e.kg;
    });
  }
  return out;
}
function wtDaysOf(wt) { return Object.keys(wt).sort(); }
// The same trailing-average the app draws, so the coach and the athlete are
// never looking at two different lines for the same body.
function wtAvgSeriesOf(wt, days) {
  const from = addDays(todayKey(), -(days - 1));
  const keys = wtDaysOf(wt);
  return keys.filter(k => k >= from).map(k => {
    const lo = addDays(k, -(WT_AVG_WINDOW - 1));
    const win = keys.filter(x => x <= k && x >= lo).map(x => wt[x]);
    return { day: k, v: win.reduce((s, v) => s + v, 0) / win.length };
  });
}
function wtChangeOf(wt, days) {
  const s = wtAvgSeriesOf(wt, days);
  if (s.length < 2) return null;
  return { delta: s[s.length - 1].v - s[0].v, n: s.length };
}
function fmtDeltaKg(v) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + round1(Math.abs(v)).toFixed(1); }

// ── Personal records (estimated 1RM) ──────────────────────────────────────
// program.html writes "<id>_1rm" into the same progress blob: one entry per
// lift per day, { lift, kg, w, r, rpe, d, t, test? }, where `kg` is the
// estimate and w/r/rpe the set it came from. Read-only here.
//
// ⚠ A deleted entry arrives as a TOMBSTONE ({ del: true }), not as a missing
// row — that is what stops the athlete's other phone handing it straight back.
// Filtering them out is this function's whole job; a coach looking at a number
// the athlete has already deleted is worse than showing nothing.
function oneRmOf(blob, id) {
  const raw = jparse(blob ? blob[id + '_1rm'] : null);
  if (!Array.isArray(raw)) return [];
  return raw.filter(e => e && e.lift && e.d && !e.del && e.kg > 0);
}

// The athlete's own name matching, ported so the two never disagree about
// whether a renamed lift is one lift or two — see ceilAliasMap() in
// program.html. Same four tiers, same "exactly one on each side" rule.
const EX_ABBREV_C = { db: 'dumbbell', bb: 'barbell', kb: 'kettlebell' };
function normExNameC(s) {
  return String(s || '').toLowerCase()
    .normalize('NFKD').replace(/[^\x00-\x7f]/g, '')
    .replace(/'/g, '').replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function exNameVariantsC(sfx) {
  const base = normExNameC(sfx);
  const toks = base.split(' ').filter(Boolean);

  const noMachine = abbrev.split(' ').filter(t => t && t !== 'machine').sort().join(' ');

function ceilAliasMapC(entries, current) {
  if (!current.length) return {};
  const cur = {};
  current.forEach(n => { cur[n] = 1; });
  const orphans = [];
  entries.forEach(e => { if (!cur[e.lift] && orphans.indexOf(e.lift) === -1) orphans.push(e.lift); });
  if (!orphans.length) return {};
  const index = names => {
    const store = [{}, {}, {}, {}];
    names.forEach(n => exNameVariantsC(n).forEach((v, tier) => {
      if (!v) return;
      (store[tier][v] || (store[tier][v] = [])).push(n);
    }));
    return store;
  };

  orphans.forEach(o => {
    const vs = exNameVariantsC(o);
    for (let tier = 0; tier < vs.length; tier++) {
      const v = vs[tier];
      if (!v) continue;
      if ((curIdx[tier][v] || []).length !== 1 || (orpIdx[tier][v] || []).length !== 1) continue;

// One row per lift: the latest estimate, the change since the first one, and

function oneRmLifts(entries, current) {
  const alias = ceilAliasMapC(entries, current || []);
  const by = {};
  entries.forEach(e => {
    const lift = alias[e.lift] || e.lift;
    const day = (by[lift] = by[lift] || {});
    if (!day[e.d] || (e.t || 0) > (day[e.d].t || 0)) day[e.d] = e;
  });
  return Object.keys(by).map(lift => {
    const es = Object.keys(by[lift]).sort().map(d => by[lift][d]);
    const latest = es[es.length - 1];
    return { lift: lift, entries: es, latest: latest, delta: latest.kg - es[0].kg,
             age: daysSince(latest.d + 'T12:00:00') };
  }).sort((a, b) => (a.latest.d < b.latest.d ? 1 : -1));
}

function habDaysOf(blob, id) {
  const raw = blob ? blob[id + '_hab_log'] : null;
  const log = jparse(raw);
  const days = {};
  if (log && typeof log === 'object') {
    Object.keys(log).forEach(k => {
      const v = log[k];

}

// ── Sessions that reached the inbox but never reached the dashboard ───────────
// The app writes session_history itself (save_session) AND emails the report.
// Those are two independent calls, so one can succeed while the other fails —
// and when save_session is the one that fails it is completely silent: the
// payload goes into a localStorage retry queue that only drains on a future app
// open. Behnam, 2026-09-05: report emailed at 17:16, session_history row never
// written, found only because a "Done" pill looked wrong to Amir. Every athlete
// carries `<id>_sent_d<N>` (an ISO timestamp of the last send for that day), so
// a send with no matching history row is a session the dashboard is missing.
// It is the athlete's own record, not a guess. Since WK-04 (2026-09-27) the report
// can go hours or days after the session (it waits on the phone for signal), so the
// app also writes `<id>_senton_d<N>`, the date the session is filed under, and that
// is the date matched; the send's own UTC date is only the fallback for older sends.
function syncGapsOf(blob, id, sessions) {
  const gaps = [];
  if (!blob) return gaps;
  // supabase-js hands `date` columns back as 'YYYY-MM-DD' strings today, but a
  // Date here would silently stringify to "Mon Aug 10 2026" and mismatch EVERY
  // row — turning this into a false "not synced" warning on the whole roster,
  // which is worse than not having the check at all. Normalise both shapes.
  const dkey = v => (v instanceof Date)
    ? (isNaN(v.getTime()) ? '' : v.toISOString().slice(0, 10))
    : String(v == null ? '' : v).slice(0, 10);
  const have = new Set((sessions || []).map(s => Number(s.day) + '|' + dkey(s.completed_on)));
  const pre = id + '_sent_d';
  Object.keys(blob).forEach(k => {
    if (k.indexOf(pre) !== 0) return;
    const day = k.slice(pre.length);
    if (!/^\d+$/.test(day)) return;
    const filed = String(blob[id + '_senton_d' + day] || '');
    const on = /^\d{4}-\d{2}-\d{2}$/.test(filed) ? filed : String(blob[k] || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(on)) return;
    if (!have.has(Number(day) + '|' + on)) gaps.push({ day: Number(day), on });
  });
  return gaps.sort((x, y) => String(y.on).localeCompare(String(x.on)));
}

function assemble() {
  const map = {};
  const get = (id) => (map[id] = map[id] || {
    id, name: id, lastActive: null, sessions: [], finished: 0,
    habDays: {}, habLast: null, isHab: false, contact: null,
    toReply: 0,
  });
  S.prog.forEach(r => {
    const a = get(r.athlete_id);
    if (r.athlete_name) a.name = r.athlete_name;
    if (r.updated_at && (!a.lastActive || r.updated_at > a.lastActive)) a.lastActive = r.updated_at;
    a.habDays = habDaysOf(r.data, r.athlete_id);
    a.wt = wtOf(r.data, r.athlete_id);
    a.oneRm = oneRmOf(r.data, r.athlete_id);
    a.blob = r.data;                       // kept for syncGapsOf below (a reference, not a copy)
    const dk = Object.keys(a.habDays).sort();

  });
  S.hist.forEach(r => {
    const a = get(r.athlete_id);
    if (r.athlete_name) a.name = r.athlete_name;
    if (r.updated_at && (!a.lastActive || r.updated_at > a.lastActive)) a.lastActive = r.updated_at;
    a.finished++;
    a.sessions.push(r);
  });
  // Everyone with a programme gets a roster row, even if they have never logged a

  // links are retired.
  Object.keys(S.programs || {}).forEach(id => get(id));
  S.contacts.forEach(c => { const a = get(c.athlete_id); a.contact = c; });

  Object.values(map).forEach(a => {
    const p = S.programs[a.id];
    if (p && p.athlete) {
      const nm = [p.athlete.firstName, p.athlete.lastName].filter(Boolean).join(' ');
      if (nm) a.name = nm;
    }
    if (a.name === a.id) {
      const o = S.optin[a.id];

      else a.name = unslug(a.id);
    }
    // Free tier lives at data.athlete.tier — that is the field isFree() reads in
    // habits.html, and every free row on the server carries it there, none at the
    // top level. Reading only p.tier showed all 13 free athletes as "Coached" here,
    // in the tier filter, and to athletesNeedingLogin(). Both spellings accepted so a
    // hand-written row either way still reads right.
    const ptier = p && (p.tier || (p.athlete && p.athlete.tier));
    a.tier = ptier === 'free' ? 'free' : (p ? 'coached' : (a.isHab ? 'proof' : 'unknown'));
    a.perWeek = (p && p.workouts && p.workouts.days && p.workouts.days.length) || 0;
    a.onBoard = !!S.optin[a.id];
    a.lastSession = a.sessions.length ? a.sessions.map(s => s.completed_on).sort().slice(-1)[0] : null;
    // Needs both halves, so it runs here rather than in either pass above.
    a.syncGaps = syncGapsOf(a.blob, a.id, a.sessions);
    a.lowRun = a.tier === 'coached' ? lowRunOf(a.sessions) : '';
    // Split unanswered notes at the window: `recent` is what "waiting" means
    // anywhere a count is shown; `stale` is backlog. Every note still keeps its
    // own reply buttons on the athlete's file regardless of age.
    const cut = addDays(todayKey(), -NEEDS_WINDOW_DAYS);
    a.needReplySessions = a.sessions.filter(sessionNeedsReply);
    a.needReplyRecent = a.needReplySessions.filter(s => s.completed_on && s.completed_on >= cut);
    a.needReplyStale = a.needReplySessions.length - a.needReplyRecent.length;
    a.toReply = a.needReplyRecent.length;
    const t = todayKey();
    a.habToday = !!a.habDays[t];
    a.hab7 = 0; for (let i = 0; i < 7; i++) if (a.habDays[addDays(t, -i)]) a.hab7++;
    a.habGap = a.isHab ? daysBetween(a.habLast, t) : null;
    a.cycle = cycleDatesOf(p);
    a.hasLogin = !!(S.logins || {})[a.id];
    const seen = [a.lastSession, a.habLast, a.lastActive && dkey(new Date(a.lastActive)),
                  a.contact && a.contact.signed_up && dkey(new Date(a.contact.signed_up))].filter(Boolean).sort();
    a.lastSeen = seen.length ? seen[seen.length - 1] : null;

// ── Who needs you, and why: ONE rule ─────────────────────────────────────────
// Used by Today's Needs you, the roster's reason chips, its "Needs you" group and filter, and its
// sort. Until 2026-10-10 there were four versions (the Today panel, rosterReasons, the roster
// sort and the counters), and they disagreed: sync gaps and upgrade leads never reached Today,
// new signups never reached the roster, and a run of low days did not move the sort.
const SYSTEM_IDS = ['demo'];          // the public marketing demo: on the roster, never a client
const LAPSED_DAYS = 30;               // nothing from them (session, habit, app sync) for this long
const CYCLE_SOON_DAYS = 7;            // "cycle ends in N days": time for /cycle-report and the next cycle

function cycleDatesOf(p) {
  const cyc = p && p.cycles && p.cycles[Number.isInteger(p.currentCycleIndex) ? p.currentCycleIndex : 0];
  if (!cyc) return null;
  const ok = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')) ? String(v) : null;   // a missing date is "no date", never "ended"
  return { name: cyc.name || '', weeks: cyc.weeks || '', start: ok(cyc.startDate), end: ok(cyc.endDate) };
}
function reasonsOf(a) {
  const out = [];
  const add = (key, tone, text, weight, sub) => out.push({ key, tone, text, weight, sub });
  const t = todayKey();
  a.lapsed = false;
  if (SYSTEM_IDS.includes(a.id) || a.id === AMIR_ATHLETE_ID) return out;
  const n = a.needReplyRecent ? a.needReplyRecent.length : 0;
  if (n) add('note', 'warn', n + ' note' + (n === 1 ? '' : 's') + ' to read', 100 + n, 'work');
  if (a.syncGaps && a.syncGaps.length) {
    const g = a.syncGaps[0];
    // Ranked high: every session-derived number on the dashboard is wrong for them until it is resolved.
    add('sync', 'warn', a.syncGaps.length === 1 ? `session not synced — Day ${g.day}, ${g.on}`
      : `${a.syncGaps.length} sessions not synced — latest Day ${g.day}, ${g.on}`, 80, 'work');
  }
  if (a.lowRun) add('lowrun', 'warn', 'run of low days', 70, 'work');
  const idle = a.lastSession ? daysBetween(a.lastSession, t) : null;
  const ended = a.cycle && a.cycle.end ? daysBetween(a.cycle.end, t) : null;   // > 0: days since it ended
  // A coached athlete inside a dated cycle that has not ended is never "gone quiet": they are paying
  // for this cycle, so a month without a session is someone to chase, not someone to fold away.
  const inCycle = a.tier === 'coached' && ended != null && ended <= 0;
  a.lapsed = (!inCycle && !!(a.lastSeen && daysBetween(a.lastSeen, t) > LAPSED_DAYS && !n))
          || !!(a.tier === 'coached' && ended != null && ended > CYCLE_RENEW_DAYS && (idle == null || idle > CYCLE_RENEW_DAYS));
  if (a.tier === 'coached' && ended != null) {
    if (ended >= -CYCLE_SOON_DAYS && ended <= 0) add('cycle', 'note', ended === 0 ? 'cycle ends today' : `cycle ends in ${-ended} day${ended === -1 ? '' : 's'}`, 45, 'work');
    else if (ended > 0 && ended <= CYCLE_RENEW_DAYS) add('renew', 'warn', `cycle ended ${ended} day${ended === 1 ? '' : 's'} ago — renew?`, 60, 'file');
  }
  const noLogin = S.progSrc[a.id] === 'db' && !a.hasLogin && !LOAD_ERR.logins;
  if (!a.lapsed && noLogin) add('login', 'warn', 'no login — cannot open the app', 50, 'file');
  // Someone locked out since the links were retired produces no activity, so they drift into Gone
  // quiet; the row still says why, without putting them in Needs you.
  a.quietFlags = a.lapsed && noLogin ? [{ tone: 'warn', text: 'no login — cannot open the app' }] : [];
  if (a.contact && a.contact.signed_up && daysSince(a.contact.signed_up) <= 7)
    add('signup', 'note', 'new signup · ' + timeAgo(a.contact.signed_up), 35, 'proof');
  if (a.lapsed) return out;
  if (a.tier === 'coached' && idle != null && idle > QUIET_SESSION_DAYS && !(ended != null && ended > 0))
    add('idle', 'note', 'no session for ' + idle + ' days', 30, 'work');
  // Proof silence is a reason for habit-only athletes. A coached athlete ticks habits on the
  // training app's Home now and then; their training is the signal, so their dots stay on the row.
  if (a.tier !== 'coached' && a.isHab && a.habGap >= QUIET_HABIT_DAYS)
    add('silent', 'note', 'silent on Proof — ' + a.habGap + ' days', 20 + Math.min(a.habGap, 14), 'proof');
  if (a.tier === 'free' && a.contact && a.contact.days_logged >= UPGRADE_DAYS)
    add('upgrade', 'good', 'ready to upgrade?', 25, 'proof');

// Server-scored season level per Proof athlete (cached; never computed here).
// coach_season_levels() (stage46, coach only) answers for every athlete in one call. The per-athlete
// hab_season_level is the fallback while that is missing; since stage46 athletes cannot call it.
async function loadLevels() {
  if (DEMO || loadLevels._done) return;
  loadLevels._done = true;
  const ids = Object.values(S.ath).filter(a => a.isHab).map(a => a.id);
  if (!ids.length) return;
  const all = await sb.rpc('coach_season_levels', { p_ids: ids });
  if (!all.error && Array.isArray(all.data)) {
    all.data.forEach(r => { if (r && r.level != null) S.levels[r.athlete_id] = r.level; });
    LOAD_ERR.levels = '';
    return;
  }
  const LANES = 6;
  let next = 0, failed = 0;
  const lane = async () => {
    while (next < ids.length) {
      const id = ids[next++];
      try {
        const r = await sb.rpc('hab_season_level', { p_athlete_id: id });
        if (!r.error && r.data != null) S.levels[id] = r.data; else if (r.error) failed++;
      } catch (e) { failed++; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(LANES, ids.length) }, lane));
  LOAD_ERR.levels = failed === ids.length ? (all.error && all.error.message) || 'no level came back' : '';
}

// --- training-load + readiness analytics (ported) ---------------------------
// All derived from session_history. Load uses Foster's session-RPE method
// (load = session RPE × duration in minutes). ACWR = acute (7-day) ÷ chronic
// (28-day weekly average). Hex colours because var() is unreliable in SVG attrs.
// `amber` is a legacy name: the warn colour is plum (--ochre) since 2026-09-26.
const C = { green: '#0E4A36', red: '#C7552F', amber: '#7A4E6E', grey: '#5C5C5C' };
function dailyLoad(sessions) {
  const m = {};
  sessions.forEach(s => {
    if (s.session_rpe != null && s.duration_min != null && s.completed_on)
      m[s.completed_on] = (m[s.completed_on] || 0) + Number(s.session_rpe) * Number(s.duration_min);
  });
  return m;
}
function computeAcwr(daily, ref) {
  const keys = Object.keys(daily);
  if (!keys.length) return { ratio: null, acute: 0, chronicWeekly: 0, enough: false, spanDays: 0 };
  const r = ref || new Date();
  const refMid = new Date(r.getFullYear(), r.getMonth(), r.getDate());
  let acute = 0, chronic = 0, earliest = null;
  keys.forEach(iso => {
    const d = pDate(iso), diff = Math.floor((refMid - d) / 86400000);
    if (earliest === null || d < earliest) earliest = d;
    if (diff >= 0 && diff < 7)  acute   += daily[iso];
    if (diff >= 0 && diff < 28) chronic += daily[iso];
  });
  const spanDays = earliest !== null ? Math.floor((refMid - earliest) / 86400000) : 0;
  // The weekly average over the weeks that actually have history in the 28-day window. Dividing by
  // 4 regardless made every new athlete read a false "High load" (1.7 at two weeks) for about a week.
  const weeksCovered = Math.min(4, (Math.min(spanDays, 27) + 1) / 7);
  const chronicWeekly = weeksCovered > 0 ? chronic / weeksCovered : 0;
  return { ratio: chronicWeekly > 0 ? acute / chronicWeekly : null,
           acute, chronicWeekly, enough: spanDays >= 14 && chronicWeekly > 0, spanDays };
}
// Sessions in the 28-day window with no load (no duration or no session RPE): they count as zero
// in the ratio and the bars, so the card says how many there are.
function loadCoverage(sessions, ref) {
  const r = ref || new Date();
  const from = addDays(dkey(r), -27);
  const inWin = sessions.filter(s => s.completed_on && s.completed_on >= from && s.completed_on <= dkey(r));
  return { total: inWin.length, withLoad: inWin.filter(s => s.session_rpe != null && s.duration_min != null).length };
}
function acwrZone(r) {
  if (r == null) return { label: '—', cls: '' };
  if (r > 1.5)  return { label: 'High load', cls: 'red' };
  if (r > 1.3)  return { label: 'Climbing',  cls: 'amber' };
  if (r >= 0.8) return { label: 'Optimal',   cls: 'green' };
  return { label: 'Low load', cls: 'amber' };
}
function readinessSeries(sessions) {
  return sessions
    .map(s => ({ s, rd: jparse(s.readiness) }))
    .filter(x => x.rd && !x.rd.skipped && x.rd.composite != null)
    .map(x => ({ iso: x.s.completed_on, v: Number(x.rd.composite) }))
    .filter(p => p.iso && !isNaN(p.v))
    .sort((a, b) => a.iso.localeCompare(b.iso));
}
function readinessStats(series) {
  if (!series.length) return null;
  const v = series.map(p => p.v), base = v.reduce((a, b) => a + b, 0) / v.length;
  const latest = v[v.length - 1];
  return { baseline: base, latest, delta: latest - base, n: v.length };
}
function weeklyLoad(daily, weeks, ref) {
  const r = ref || new Date();
  const monday = new Date(r.getFullYear(), r.getMonth(), r.getDate());
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const buckets = [];
  for (let i = weeks - 1; i >= 0; i--) { const start = new Date(monday); start.setDate(start.getDate() - i * 7); buckets.push({ start, load: 0 }); }
  Object.keys(daily).forEach(iso => {
    const d = pDate(iso);
    for (let i = buckets.length - 1; i >= 0; i--) { if (d >= buckets[i].start) { buckets[i].load += daily[iso]; break; } }
  });
  return buckets;
}
function adherence(sessions, daysPerWeek, weeks, ref) {
  weeks = weeks || 4;
  if (!daysPerWeek) return null;
  let earliest = null;
  sessions.forEach(s => { if (s.completed_on) { const d = pDate(s.completed_on); if (!earliest || d < earliest) earliest = d; } });
  const r = ref || new Date();
  const refMid = new Date(r.getFullYear(), r.getMonth(), r.getDate());
  if (!earliest) return null;
  const daysActive = Math.floor((refMid - earliest) / 86400000) + 1;
  // Pro-rated to the days since they started (at most the window). Charging a whole week of

  const effDays = Math.max(1, Math.min(weeks * 7, daysActive));
  const effWeeks = Math.max(1, Math.round(effDays / 7));
  const start = new Date(refMid); start.setDate(start.getDate() - (effDays - 1));
  let done = 0;
  sessions.forEach(s => { if (!s.completed_on) return; const d = pDate(s.completed_on);
    if (d >= start && d <= refMid) done += isPartialStatus(s.status) ? 0.5 : 1; });
  const expected = Math.max(1, Math.round(daysPerWeek * effDays / 7));
  const raw = Math.round((done / expected) * 100);

    .slice().sort((a, b) => String(a.completed_on).localeCompare(String(b.completed_on)))
    .map(s => Number(s.session_rpe) * Number(s.duration_min));
  const byRecent = sessions.slice().sort((a, b) => String(b.completed_on).localeCompare(String(a.completed_on)));
  const lastPartial = byRecent.length ? isPartialStatus(byRecent[0].status) : false;
  const latestRd = byRecentFirst(sessions).map(s => jparse(s.readiness)).find(x => x && !x.skipped && (x.level || x.composite != null));

// --- tiny inline-SVG charts (ported) ----------------------------------------
function sparkline(values, color, w, h) {

  const min = Math.min(...pts), max = Math.max(...pts), rng = (max - min) || 1;
  const X = i => (i / (pts.length - 1)) * (w - 2) + 1;
  const Y = v => h - 2 - ((v - min) / rng) * (h - 4);
  const d = pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const lx = X(pts.length - 1), ly = Y(pts[pts.length - 1]);

function barsSVG(buckets, color) {

    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="2" fill="${color}" opacity="${b.load ? 0.85 : 0.18}"></rect>`;
  }).join('');

}

  const yMin = opts.yMin != null ? opts.yMin : 1, yMax = opts.yMax != null ? opts.yMax : 5;
  const X = i => series.length > 1 ? left + (i / (series.length - 1)) * (right - left) : (left + right) / 2;
  const Y = v => bot - ((v - yMin) / ((yMax - yMin) || 1)) * (bot - top);
  const d = series.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  // Dots by default — the readiness chart plots a handful of sessions and each

  // points) turns that into a caterpillar, so it can ask for the line alone.
  const dots = opts.dots === false ? ''
    : series.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.2" fill="${opts.color}"/>`).join('');
  let baseLine = '';
  if (opts.baseline != null) { const by = Y(opts.baseline).toFixed(1); baseLine = `<line x1="${left}" y1="${by}" x2="${right}" y2="${by}" stroke="${C.grey}" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>`; }
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${baseLine}<path d="${d}" fill="none" stroke="${opts.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

// --- live-activity decode (ported) ------------------------------------------
function decode(athleteId, blob) {
  const prefix = athleteId + '_';
  const days = {}; const ex = {};
  const day = n => (days[n] = days[n] || {});
  const exer = k => (ex[k] = ex[k] || {});
  Object.keys(blob || {}).forEach(fullKey => {
    if (fullKey.indexOf(prefix) !== 0) return;
    const key = fullKey.slice(prefix.length);
    const val = blob[fullKey];
    let m;
    if ((m = key.match(/^completed_d(\d+)$/)))   { const d = day(m[1]); d.completed = true; d.completedOn = val; }
    else if ((m = key.match(/^srpe_(\d+)$/)))    { day(m[1]).srpe = val; }
    else if ((m = key.match(/^readiness_(\d+)$/))) { day(m[1]).readiness = jparse(val); }
    else if ((m = key.match(/^daynote_(\d+)$/))) { day(m[1]).note = val; }
    else if ((m = key.match(/^setlog_(.+)$/)))   { exer(m[1]).sets = jparse(val) || []; }
    // Exercise notes are per SESSION since 2026-09-24: <id>_snote_<Name> = { d, v },
    // written by program.html and only meaningful on day d. The old durable note_
    // key is kept for athletes still on a cached older app, and never beats snote_.
    else if ((m = key.match(/^snote_(.+)$/)))    { const o = jparse(val); if (o && o.v) { exer(m[1]).note = o.v; exer(m[1]).noteOn = o.d; exer(m[1]).snote = true; } }
    else if ((m = key.match(/^note_(.+)$/)))     { if (!exer(m[1]).snote) exer(m[1]).note = val; }
    else if ((m = key.match(/^rpe_(.+)$/)))      { exer(m[1]).rpe = val; }
  });
  return { days, ex };
}

// ── READING WHAT ACTUALLY HAPPENED ──────────────────────────────────────────
// program.html writes every finished session as one plain-text summary with a
// fixed grammar (buildSessionData() there). Every number a coach needs is in
// it — the weight on the bar, the RPE of each set, the athlete's own note:
//
//   [Primary]
//   • Goblet Squat (✓)        ← or (skipped) / (2/4 sets)
//       Set 1: 24 @7 ✓        ← kg · @RPE · ticked
//       Set 2: @8 ✓           ← RPE only (bodyweight)
//       Set 3: skipped
//       Note: knee felt fine
//      · Cat-Cow (×6 Reps)    ← circuit items
//       RPE: R1 7 · R2 8      ← circuit round RPEs
//
// ⚠ The parser this replaced kept ONLY "was this set ticked" and threw the
// weight and the RPE away — which is why the prescribed-vs-done table could
// say "✓ 4/4 sets" in green about a session logged three RPE above target.
// Anything added to the grammar in program.html has to be read here too, or
// it silently vanishes from the dashboard.
function parseSetLine(rest) {
  const s = { w: '', rpe: '', done: false, skipped: false };
  let t = String(rest || '').trim();
  if (!t || /^skipped$/i.test(t)) { s.skipped = true; return s; }
  if (t.indexOf('✓') >= 0) s.done = true;
  t = t.replace(/[✓·]/g, ' ');
  const m = t.match(/@\s*([\d.]+)/);
  if (m) { s.rpe = m[1]; t = t.replace(m[0], ' '); }
  // Reps, "×5" — logged from 2026-09-24 (The Card Remembers). Older lines have
  // none, and get no `reps` key at all. ⚠ program.html's parseSetText() reads
  // the same grammar for the athlete's history; change the two together.
  // The reps are the LAST word and stand alone: "2×20 ×8" is two 20 kg dumbbells
  // for 8, never 20 reps (fixed 2026-09-26; scripts/check_setlog.js).
  const mr = t.match(/(^|\s)×(\d+)\s*$/);
  if (mr) { s.reps = parseInt(mr[2], 10); t = t.slice(0, mr.index) + ' '; }
  s.w = t.trim();                       // free text: "24", "24kg", "red band"
  if (!s.done && !s.w && !s.rpe) s.skipped = true;
  return s;
}
function parseSessionLog(summary) {
  const i = String(summary || '').indexOf('Exercise log:');
  if (i < 0) return [];
  const blocks = [];
  let blk = null, cur = null, inNote = false;
  const openBlock = (title) => { blk = { title, exercises: [] }; blocks.push(blk); return blk; };
  String(summary).slice(i + 'Exercise log:'.length).split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    let m;
    if ((m = line.match(/^\[(.*)\]$/))) { openBlock(m[1].trim()); cur = null; inNote = false; return; }
    if ((m = line.match(/^•\s*(.+?)(?:\s*\(([^)]*)\))?\s*$/))) {
      if (!blk) openBlock('');
      const label = (m[2] || '✓').trim();
      cur = { name: m[1].trim(), label, done: label === '✓', sets: [], items: [], note: '', rounds: '', gear: '' };
      inNote = false;
      blk.exercises.push(cur);
      return;
    }
    if (!cur) return;
    if ((m = line.match(/^Set\s+\d+:\s*(.*)$/i))) { inNote = false; cur.sets.push(parseSetLine(m[1])); return; }
    if ((m = line.match(/^Note:\s*(.*)$/i)))      { inNote = true;  cur.note = m[1].trim(); return; }
    if ((m = line.match(/^RPE:\s*(.*)$/i)))       { inNote = false; cur.rounds = m[1].trim(); return; }
    if ((m = line.match(/^·\s*(.*)$/)))           { inNote = false; cur.items.push(m[1].trim()); return; }
    // An unprefixed line is one of two things, and the order program.html
    // writes them in is what tells them apart: circuit loads come BEFORE the
    // note, and everything after a "Note:" is the rest of a multi-line note.
    // Filing "14kg on lunges" as equipment loses most of what they wrote.
    if (inNote) cur.note += '\n' + line;
    else cur.gear = line;               // e.g. "Kettlebell Swing 16 · Medicine Ball Slam 4"
  });

// What the editor's fields say, checked against the rx contract (SCHEMA.md, PROGRAM-APP.md):
// one whole number of reps, a real duration for time, metres for distance, sets a whole number,
// RPE 6–10 or a 6–10 range. Returns { patch } or { error }.
function readExEditor(eid) {
  const val = id => String((document.getElementById(id + '-' + eid) || {}).value || '').trim();
  const kind = val('exKind') || 'reps';
  const dose = val('exDose'), sets = val('exSets'), rpe = val('exRpe'), tempo = val('exTempo'), restRaw = val('exRest');
  const num = v => /^\d+(\.\d+)?$/.test(v) ? Number(v) : v;   // the pipeline writes numbers; keep it that way
  if (sets && !/^[1-9]\d?$/.test(sets)) return { error: `Sets "${sets}" must be a whole number (1–99), or blank.` };
  if (dose) {
    if (kind === 'reps' && !/^\d{1,3}$/.test(dose))
      return { error: /\d\s*[-–]\s*\d/.test(dose)
        ? `Reps are one number, not a range ("${dose}"): write the one you mean.`
        : Chips.isPureDuration(dose) ? `"${dose}" is a time. Pick Time as the dose, then save.` : `Reps "${dose}" must be one whole number.` };
    if (kind === 'time' && !Chips.isPureDuration(dose)) return { error: `Time "${dose}" is not a duration I understand. Try 30s, 45 sec, 2 min or 1:30.` };
    if (kind === 'distance' && !/^\d+(\.\d+)?\s*(m|km|yd|yds|metres?|meters?)$/i.test(dose)) return { error: `Distance "${dose}" needs a unit: 20m, 400 m, 1 km.` };
  }
  if (rpe) {
    const m = rpe.match(/^(\d+(?:\.\d)?)(?:\s*[-–]\s*(\d+(?:\.\d)?))?$/);
    const ok = m && [m[1], m[2]].filter(Boolean).every(x => Number(x) >= 6 && Number(x) <= 10);
    if (!ok) return { error: `RPE "${rpe}" must be 6 to 10 (or a range like 7-8): the app's selector starts at 6, so anything else cannot be logged.` };
  }
  const restSec = restRaw ? Chips.parseDurationToSec(restRaw) : 0;
  if (restRaw && !restSec) return { error: `Rest "${restRaw}" is not a duration I understand. Try 90s, 2 min, or 1:30.` };
  const patch = { sets: sets ? Number(sets) : '', rpe: num(rpe), tempo, rest: restSec,
                  side: !!(document.getElementById('exSide-' + eid) || {}).checked };
  patch[kind] = kind === 'reps' ? num(dose) : dose;   // clears the other three doses
  const note = val('exNote');
  return { patch, kind, note };
}
function withEditedEx(ex, form) {
  // Saving an exercise that still carries chips[] also CONVERTS it: toRx() folds the old labels
  // into rx and keeps every leftover technique chip in the pill (`intent`), so an ordinary edit is
  // the migration and no chip is lost. From here the exercise has one source.
  const updated = Chips.applyRx(Chips.toRx(ex), form.patch);
  delete updated.setup;   // no floating text: openExEditor() put any old grey line in the note box
  if (form.kind !== (Chips.rxOf(ex).dose || {}).kind && updated.rx) delete updated.rx.label;
  if (form.note) updated.note = form.note; else delete updated.note;
  return updated;
}

async function saveExEditor(athleteId, dayId, blockIdx, exIdx, eid, expectName, btn) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (S.progSrc[athleteId] !== 'db') { alert('This athlete has no programme in the database, so there is nothing to edit.'); return; }
  const shown = exAt(athleteId, dayId, blockIdx, exIdx);
  if (!shown || shown.ex.name !== expectName) {
    delete _exDrafts[eid];
    await reloadPrograms(); render();
    alert('That exercise has moved in the programme since this page was drawn, so nothing was saved. The page now shows the live programme: open ✎ on the exercise again.');
    return;
  }
  const form = readExEditor(eid);
  if (form.error) { alert(form.error); return; }
  if (JSON.stringify(withEditedEx(shown.ex, form)) === JSON.stringify(shown.ex)) {
    delete _exDrafts[eid]; toast('No change to save'); renderDetailBody(); return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const done = () => { if (btn) { btn.disabled = false; btn.textContent = 'Save'; } };

  // The programme on this page can be hours old (a new cycle published by the pipeline, another
  // tab, a restore). Saving it whole would put the old programme back, so the edit is applied to
  // the LIVE row, and only if nobody has written it since this page loaded.
  const live = await sb.from('programs').select('data, updated_at, updated_by').eq('athlete_id', athleteId).maybeSingle();
  if (live.error || !live.data) { done(); alert('Could not read the live programme, so nothing was saved: ' + (live.error ? live.error.message : 'no row')); return; }
  const seen = (S.progMeta[athleteId] || {}).updated_at;
  const stale = async (why) => {
    done(); delete _exDrafts[eid];
    await reloadPrograms(); render();
    alert(why + '\n\nNothing was saved. The page now shows the live programme: open ✎ again and redo the change.');
  };
  if (seen && live.data.updated_at !== seen) {
    return stale(`${nameOf(athleteId)}'s programme changed on the server after this page loaded ` +
      `(saved ${String(live.data.updated_at).slice(0, 16).replace('T', ' ')} UTC by ${live.data.updated_by || 'someone'}).`);
  }
  const fresh = live.data.data;
  const fd = ((fresh && fresh.workouts && fresh.workouts.days) || []).find(d => Number(d.id) === Number(dayId));
  const fb = fd && (fd.blocks || [])[blockIdx];
  const fex = fb && (fb.exercises || [])[exIdx];
  if (!fex || fex.name !== expectName) return stale('That exercise is no longer at the same place in the live programme.');
  fb.exercises[exIdx] = withEditedEx(fex, form);

  const res = await sb.from('programs').update({ data: fresh })
    .eq('athlete_id', athleteId).eq('updated_at', live.data.updated_at)
    .select('athlete_id, updated_at, updated_by');
  if (!res.error && (!res.data || !res.data.length)) {
    // Either someone saved in the second between the read and the write, or the session lapsed.
    return stale('The programme was not updated: it changed again while saving, or your sign-in lapsed.');
  }
  if (res.error) { done(); alert('Could not save: ' + res.error.message); return; }
  S.programs[athleteId] = fresh;
  S.progMeta[athleteId] = { updated_at: res.data[0].updated_at, updated_by: res.data[0].updated_by };
  delete _exDrafts[eid];
  assemble();
  toast('Saved — they see it next time they open the app');
  render();
}

// The last 20 saves for one athlete, newest first. Loaded on demand — the

function fmtLocalStamp(iso) {

// Roll one athlete's programme back to a stored version. The trigger snapshots

async function restoreProgramVersion(athleteId, versionId) {

  if (!confirm(`Restore ${nameOf(athleteId)}'s programme to how it was before the save of ${fmtLocalStamp(v.data.saved_at)}?\n\nThe current one is kept in this list, so this is reversible.`)) return;

    const due = flagged[l.lift] && l.age >= RETEST_MIN_DAYS_C;
    const move = l.entries.length < 2 ? 'first estimate'
      : (l.delta === 0 ? 'no change' : fmtDeltaKg(l.delta) + ' kg since the first');
    const ago = l.age === 0 ? 'today' : l.age === 1 ? 'yesterday' : l.age + ' days ago';

      `${move} · ${l.latest.test ? 'tested' : 'from a set'} ${ago}${due ? ' · <b>due a retest</b>' : ''}`,
      due ? 'amber' : '');

  return `<div class="sec"><span>Personal records</span></div>
    <section class="panel"><div class="prlist">${rows.join('')}</div>
      <p class="empty" style="padding:10px 0 0">Estimated one-rep maxes, worked out from their
      logged sets or entered after a test. They own the record — this is read-only.</p>
    </section>`;
}

// The three numbers, always visible; the charts behind one tap. They used to be

function metricStripHtml(m) {
  const az = acwrZone(m.acwr.enough ? m.acwr.ratio : null);
  const r = m.readiness, adh = m.adherence;
  // The latest check-in's own verdict when it has one: since 2026-09-26 the athlete's app works out
  // the day (REC-2: score S of sleep, energy, stress and overall, against their usual B) and stores
  // { level, score, base } with it. Re-judging it here from the composite (which includes soreness)
  // against an all-time mean could call green a day the app made lower, or the reverse. The twin is
  // readinessPlan() in program.html; this only READS what it stored.
  const lp = m.latestPlan;

  const aTone = !adh || adh.pct == null ? '' : adh.pct >= 85 ? 'green' : adh.pct >= 60 ? 'amber' : 'red';
  const pill = (label, val, sub, tone) =>

           adh && adh.pct != null ? 'last ' + (adh.days < 28 ? adh.days + ' days' : '4 wks') : 'needs a program + a session', aTone)}
    <button class="mp mp-more" id="chartsBtn" aria-expanded="false" aria-controls="chartbox" onclick="toggleCharts()">Charts<span>▾</span></button>
  </div>

// What is sitting in their app right now — a different question from "what did
// they finish", so it keeps its own place instead of being a third copy of the
// day list. Collapsed: most days there is nothing to see.
function liveSnapshotHtml(D) {
  const { athleteId, programDays } = D;
  const progRow = S.prog.find(r => r.athlete_id === athleteId) || null;
  const { days, ex } = progRow ? decode(athleteId, progRow.data) : { days: {}, ex: {} };
  const setStr = (e) => (e.sets || []).map(s => {
    const bits = [s.w, s.n ? '×' + s.n : '', s.r ? '@' + s.r : ''].filter(Boolean).join(' ');
    return (bits || '·') + (s.d ? ' ✓' : '');
  }).join(' · ');
  const hasData = (e) => e && ((e.sets && e.sets.some(s => s.w || s.r || s.d)) || e.note || e.rpe);
  const rows = [];
  Object.keys(ex).forEach(k => { if (hasData(ex[k])) rows.push({ name: unslug(k), sets: setStr(ex[k]), note: ex[k].note, rpe: ex[k].rpe }); });
  const touchedDays = programDays.filter(pd => {
    const d = days[pd.id] || {};
    return d.completed || d.srpe || d.note || d.readiness;
  });
  if (!rows.length && !touchedDays.length) return '';
  return `<details class="rawlog livesnap"><summary>Live app snapshot — what's on their phone right now</summary>
    ${touchedDays.map(pd => {
      const d = days[pd.id] || {};
      // The cloud blob keeps keys a phone no longer has (program.html ignores a day's keys from
      // an earlier date), so an old, unfinished day is not "in progress": it is a leftover.
      const ts = (d.readiness && d.readiness.timestamp) || (d.completedOn && String(d.completedOn).slice(0, 10)) || null;
      const recent = ts && (Date.now() - new Date(ts)) < 30 * 3600e3;
      return `<div class="ls-day"><b>Day ${esc(pd.id)}${pd.focusTag ? ' — ' + esc(pd.focusTag) : ''}</b>
        ${d.completed ? '<span class="tag done">✓ completed</span>' : recent ? '<span class="tag">in progress</span>'
          : `<span class="tag">started${ts ? ' ' + esc(prettyDate(dkey(new Date(ts)))) : ' earlier'}, not finished — a leftover, not live</span>`}
        ${d.completedOn ? '<span class="muted"> · ' + esc(d.completedOn) + '</span>' : ''}
        ${d.srpe ? '<span class="muted"> · sRPE ' + esc(d.srpe) + '/10</span>' : ''}
        ${d.note ? `<div class="note"><b>Athlete note:</b> ${esc(d.note)}</div>` : ''}</div>`;
    }).join('')}
    ${rows.length ? `<div class="tablewrap"><table>
      <tr><th>Exercise</th><th>Sets in the app (kg @ RPE)</th><th>Note</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${esc(r.sets) || (r.rpe ? 'RPE ' + esc(r.rpe) : '—')}</td><td>${esc(r.note || '')}</td></tr>`).join('')}
    </table></div>` : ''}
  </details>`;
}

// --- import a past session from a coach email (ported) ----------------------
function parseSessionEmail(text) {
  const t = String(text || '').replace(/\r/g, '');
  const fs = t.indexOf('Full summary');
  let summary = (fs >= 0 ? t.slice(fs + 'Full summary'.length) : t).replace(/^\s*\n/, '').trim();
  if (summary.indexOf('Exercise log:') < 0 && t.indexOf('Exercise log:') >= 0) summary = t.trim();
  const firstLine = (summary.split('\n')[0] || '');
  const dm = firstLine.match(/Day\s+(\d+)\s*[—–-]?\s*(.*)$/) || t.match(/Day\s+(\d+)\s*[—–-]?\s*([^\n]*)/);
  const day = dm ? Number(dm[1]) : null;
  const focus = dm && dm[2] ? dm[2].trim() : '';
  const grab = re => { const m = t.match(re); return m ? m[1].trim() : ''; };
  const status = grab(/Status:?\s*\n?\s*([^\n]+)/) || 'Complete';
  const rpeM = t.match(/Session RPE:?\s*\n?\s*(\d+(?:\.\d+)?)/i);
  const durM = t.match(/Duration:?\s*\n?\s*(\d+)/i);
  // The whole note, every line of it (the summary holds it between "Notes from athlete:" and the
  // exercise log); the email's own field holds only its first line in some mail clients.
  const nb = t.match(/Notes from athlete:\s*\n([\s\S]*?)\n\s*\n\s*Exercise log:/);
  let note = nb ? nb[1].trim() : (grab(/Notes from athlete\s*\n\s*([^\n]+)/) || grab(/Notes from athlete:\s*\n\s*([^\n]+)/));
  if (/^\(?none\)?$/i.test(note)) note = '';
  const who = grab(/^\s*Athlete:?[ \t]*\n?[ \t]*([^\n]+)/m);
  let readiness = null;
  const oneLine = t.match(/Composite\s+([\d.]+)\/5\s*·\s*Sleep\s+(\d+)\s*·\s*Energy\s+(\d+)\s*·\s*Soreness\s+(\d+)\s*·\s*Stress\s+(\d+)\s*·\s*Overall\s+(\d+)/i);
  if (oneLine) {
    readiness = { composite: Number(oneLine[1]), sleep: +oneLine[2], energy: +oneLine[3], soreness: +oneLine[4], stress: +oneLine[5], overall: +oneLine[6] };
  } else if (/Readiness[^\n]*skipped/i.test(t)) {
    readiness = { skipped: true };
  } else {
    const comp = t.match(/composite\s+([\d.]+)\/5/i);
    const q = (re) => { const m = t.match(re); return m ? +m[1] : null; };
    const sleep = q(/sleep last night:?\s*(\d+)/i), energy = q(/energy levels[^:]*:?\s*(\d+)/i),
          soreness = q(/sore[^:]*:?\s*(\d+)/i), stress = q(/stress[^:]*:?\s*(\d+)/i), overall = q(/ready do you feel:?\s*(\d+)/i);
    if (comp || sleep || energy || soreness || stress || overall) {
      readiness = { composite: comp ? Number(comp[1]) : null, sleep, energy, soreness, stress, overall };
    }
  }
  return { day, focus, status, session_rpe: rpeM ? rpeM[1] : '', duration_min: durM ? durM[1] : '', readiness, day_note: note, summary, who };
}
// Does the email's "Athlete" line name this athlete? Loose on purpose (first name, either order).
function emailNamesAthlete(who, athleteId) {
  if (!who) return true;
  const words = x => String(x || '').toLowerCase().replace(/[^a-z\u0600-\u06ff0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 1);
  const p = S.programs[athleteId], ath = p && p.athlete;
  const mine = new Set(words([nameOf(athleteId), ath && ath.firstName, ath && ath.lastName, unslug(athleteId)].join(' ')));
  return words(who).some(w => mine.has(w));
}
let _pendingImport = null;

function parseAndFillSession() {

        <tr><td class="k">Day</td><td class="v">Day ${esc(p.day)}${p.focus ? ' — ' + esc(p.focus) : ''}</td></tr>
        <tr><td class="k">Status</td><td class="v">${esc(p.status)}</td></tr>

        <tr><td class="k">Duration</td><td class="v">${esc(p.duration_min || '—')}${p.duration_min ? ' min' : ''}</td></tr>
        <tr><td class="k">Readiness</td><td class="v">${esc(rTxt)}</td></tr>
        <tr><td class="k">Exercises</td><td class="v">${Object.keys(logIndex(parseSessionLog(p.summary))).length} logged</td></tr>

async function submitPastSession(athleteId) {
  if (!_pendingImport || !_pendingImport.day) { alert('Paste an email and tap "Read email" first.'); return; }
  const dateEl = $('as-date');
  const completedOn = dateEl && dateEl.value;
  if (!completedOn) { alert('Pick the date this session was done (from the email).'); return; }
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  const p = _pendingImport;
  if (!emailNamesAthlete(p.who, athleteId) &&
      !confirm(`This email is from "${p.who}", but you are on ${_detailName}'s file.\n\nSave it to ${_detailName} anyway?`)) return;
  // The same day already logged: on the same date the server REPLACES that session (and the
  // app's set-by-set log for it) with the email's text; a few days apart it is probably the same
  // session filed twice.
  const sameDay = (_detailHistory || []).filter(x => Number(x.day) === Number(p.day));
  const exact = sameDay.find(x => x.completed_on === completedOn);
  const near = sameDay.filter(x => x !== exact && Math.abs(daysBetween(x.completed_on, completedOn)) <= 7);
  if (exact && !confirm(`Day ${p.day} on ${prettyDate(completedOn)} is already logged.\n\nSaving REPLACES it with this email's text, and the set-by-set log the app saved for it is lost. Carry on?`)) return;
  if (!exact && near.length && !confirm(`Day ${p.day} was already logged on ${near.map(x => prettyDate(x.completed_on)).join(', ')}.\n\nIs this a different session? Saving adds a second Day ${p.day}.`)) return;
  const btn = $('as-save'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const { error } = await sb.rpc('save_session', {
    p_athlete_id: athleteId,
    p_athlete_name: _detailName,
    p_day: Number(p.day),
    p_completed_on: completedOn,
    p_session: {
      status: p.status || 'Complete',
      session_rpe: String(p.session_rpe || ''),
      duration_min: String(p.duration_min || ''),
      readiness: p.readiness || null,
      day_note: p.day_note || '',
      focus: p.focus || '',
      summary: p.summary,
      // Over a session already on that date: the email REPLACES it, set-by-set log included
      // (stage46; the server used to keep the old log under the new text, coach only).
      replace_log: !!exact
    },
    // The coach is authorised as the coach now, not by holding the athlete's
    // secret. Every key was deleted when the old links were retired.
    p_key: null
  });
  if (error) { alert('Could not save: ' + error.message); if (btn) { btn.disabled = false; btn.textContent = 'Save to logs'; } return; }
  _pendingImport = null;
  toast('Session saved');
  refetch(['hist']);
}

// --- cycle-report prompt (ported) -------------------------------------------
const CYCLE_PROMPT = `You are assisting an elite strength & conditioning coach (tennis + physical prep). A training cycle (~4–5 weeks) just ended for ONE athlete. Below are (1) the weekly check-in data for each week of the cycle and (2) the logged workout sessions across the cycle. Write an end-of-cycle report whose JOB is to drive the NEXT cycle's programming. Analyse TRENDS across the weeks and the logs — do not restate single weeks. Cross-reference: does the self-report match what they actually logged?

Output these sections:
• Overview — 3–5 sentences: the arc of the cycle and the headline.
• Trends — specific, data-backed (cite direction and rough numbers, e.g. "soreness 3→7 over weeks 3–5", "adherence 13/15 sessions").
• What worked / What to change.
• Programming decisions for next cycle — concrete DECISIONS (load direction, volume, exercise emphasis, recovery, scheduling), not vague advice.
• Overall load direction — progress / maintain / reduce / deload / mixed.
• Content-worthy wins — improvements across the cycle worth posting, with specifics.
• Flags — anything to address before/into next cycle.
Use ONLY the provided data; if it's sparse, say so plainly.`;
function fmtCycleData(name, cyc, weeklies, sessions) {
  const L = [];
  L.push(`ATHLETE: ${name} — CYCLE ${cyc}`);
  L.push(`Weekly check-ins: ${weeklies.length} · Logged sessions: ${sessions.length}`);
  L.push('\n=== WEEKLY CHECK-INS ===');
  weeklies.forEach((w, i) => { L.push(`\n--- ${w.week || ('Week ' + (i + 1))} (${w.call_date || '—'}) ---`); L.push(w.summary || '(no detail saved)'); });
  L.push('\n=== LOGGED WORKOUT SESSIONS ===');
  if (!sessions.length) L.push('(No logged sessions found in the cycle window.)');
  else sessions.forEach(s => { const rd = jparse(s.readiness); const comp = rd && typeof rd === 'object' ? rd.composite : null; const plan = planLabelC(rd); L.push(`${s.completed_on} · Day ${s.day ?? '—'} · ${s.status || '—'} · RPE ${s.session_rpe ?? '—'} · ${s.duration_min ?? '—'}min${comp != null ? ' · readiness ' + comp + '/5' : ''}${plan ? ' · ' + plan : ''}${s.focus ? ' · ' + s.focus : ''}${s.day_note ? ' · note: ' + s.day_note : ''}`); });
  return L.join('\n');
}
function copyDashCyclePrompt() {
  const sel = $('dashCycleSel');
  const cyc = sel ? sel.value : '';
  if (!cyc) { alert('Pick a cycle first.'); return; }
  const weeklies = _detailCallLogs
    .filter(l => ((String(l.week || '').match(/Cycle\s*(\d+)/i) || [])[1]) === cyc)
    .sort((a, b) => String(a.call_date).localeCompare(String(b.call_date)));
  if (!weeklies.length) { alert('No weekly check-ins saved for Cycle ' + cyc + '.'); return; }
  const dates = weeklies.map(w => w.call_date).filter(Boolean).sort();
  const start = addDays(dates[0], -16), end = addDays(dates[dates.length - 1], 3);
  const sessions = (_detailHistory || [])
    .filter(s => s.completed_on && s.completed_on >= start && s.completed_on <= end)
    .sort((a, b) => String(a.completed_on).localeCompare(String(b.completed_on)));
  const text = CYCLE_PROMPT + '\n\n' + fmtCycleData(_detailName, cyc, weeklies, sessions);
  navigator.clipboard.writeText(text).then(
    () => toast(`Cycle ${cyc} prompt copied — ${weeklies.length} check-in(s) + ${sessions.length} session(s)`),
    () => copyText(text),   // shows the text so it can be copied by hand
  );
}
window.copyDashCyclePrompt = copyDashCyclePrompt;

// --- AFFILIATES (referral-code roster) --------------------------------------
// public.affiliates is the ONE list of discount codes. form.html and form-fa.html
// ask check_discount() whether a typed code is live, so a code added here works on
// both forms immediately and a retired one stops. Coach-only table; payout / card
// details are deliberately NOT stored — they stay in the Web3Forms application
// email, so the Backup file never carries them. Backend: supabase/stage29_affiliates.sql.
const AFF_FIELDS = [
  ['code', 'Code', 'text'], ['percent', '% off', 'number'],
  ['coach_name', 'Coach name', 'text'], ['coach_name_fa', 'Name (Farsi)', 'text'],
  ['instagram', 'Instagram', 'text'], ['whatsapp', 'WhatsApp', 'text'],
  ['email', 'Email', 'text'], ['athlete_id', 'Athlete id (if they train with you)', 'text'],
  ['applied_on', 'Applied', 'date'],
];
let _affEditing = null;   // the code whose card is in edit mode, '__new__' for the add form, or null

// Iranian mobiles are typed 09…; wa.me needs the country code instead of the 0.
function affWa(num) { return waLink(num); }   // one builder: waLink() (Intake) handles Persian digits too
function affIg(handle) {
  const h = String(handle || '').trim().replace(/^@/, '');
  return h ? 'https://instagram.com/' + encodeURIComponent(h) : '';
}
// Intakes that used a code: the typed "Discount Code", or the "Discount Applied"
// the form fills in once the code checks out (e.g. "NAME10 (10% off)").
// A code as people type it on a phone: spaces anywhere, Persian or Arabic digits, any case.
function normCode(v) {
  return String(v || '').replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660)).replace(/\s+/g, '').toUpperCase();
}
// Applications that used the code (typed, or approved on the form). These are APPLICATIONS, not
// paying clients: nothing here knows who paid, so the card says so. Archived ones (spam, not a fit)
// are left out of the count.
function affUses(code) {
  return (S.intake || []).filter(i => {
    if ((i.status || 'new') === 'archived') return false;
    const p = i.payload || {};
    const typed = normCode(intakeVal(p['Discount Code']));
    const applied = normCode(intakeVal(p['Discount Applied']).trim().split(' ')[0]);
    return typed === code || applied === code;
  });
}

function affForm(a) {
  const isNew = !a;
  const v = a || { percent: 10 };
  const field = ([k, label, type]) => {
    const locked = k === 'code' && !isNew;
    const val = v[k] == null ? '' : v[k];
    const extra = (type === 'number' ? ' min="1" max="90" step="1"' : '') +
                  (locked ? ' readonly' : '') + (k === 'code' ? ' style="text-transform:uppercase"' : '');
    return `<label class="exf"><span>${esc(label)}</span><input type="${type}" data-k="${k}" value="${esc(val)}"${extra}></label>`;
  };
  return `<div class="aff-form" data-new="${isNew ? 1 : 0}">
    <div class="exed-grid">${AFF_FIELDS.map(field).join('')}</div>
    <label class="exf exf-wide"><span>Notes</span><textarea data-k="notes" rows="3">${esc(v.notes || '')}</textarea></label>
    ${isNew ? '<p class="empty" style="padding:8px 0 0">Convention is NAME10 — uppercase letters and digits, no spaces. Payout / card details stay in the application email, never here.</p>'
            : '<p class="empty" style="padding:8px 0 0">A code can’t be renamed — it is the key. Retire it and add the new one, so intakes that used the old code still add up.</p>'}
    <div class="i-actions"><button class="btn sm primary aff-save">${isNew ? 'Add code' : 'Save'}</button><button class="btn sm aff-cancel">Cancel</button></div>
  </div>`;
}

function affCard(a) {
  const uses = affUses(a.code);
  const owner = a.coach_name || a.coach_name_fa;
  const who = owner ? esc(owner) : '<span style="color:var(--clay-ink)">No owner on file</span>';
  const pills = `<span class="ipill pct">${esc(a.percent)}% off</span>` +
    (owner ? '' : '<span class="ipill warn">Unattributed</span>') +
    (uses.length ? `<span class="ipill used" title="Applications that used this code (archived ones left out). Not payments: check who became a client before paying commission.">${uses.length} application${uses.length === 1 ? '' : 's'}</span>` : '');
  const when = a.active ? (a.applied_on ? 'since ' + esc(a.applied_on) : '') : 'retired ' + esc(a.retired_on || '');
  const editing = _affEditing === a.code;

  const cbits = [];
  if (a.instagram) cbits.push(`<a href="${esc(affIg(a.instagram))}" target="_blank" rel="noopener">${esc(a.instagram)}</a>`);
  if (a.whatsapp) cbits.push(`<a href="${esc(affWa(a.whatsapp))}" target="_blank" rel="noopener">${esc(a.whatsapp)}</a> <button class="btn sm copy-btn-js" data-url="${esc(a.whatsapp)}">Copy</button>`);
  if (a.email) cbits.push(`<a href="mailto:${esc(a.email)}">${esc(a.email)}</a> <button class="btn sm copy-btn-js" data-url="${esc(a.email)}">Copy</button>`);
  const contactLine = cbits.join('<span class="dot">·</span>') || '<span class="muted">No contact on file</span>';

  const rows = [];
  if (a.coach_name && a.coach_name_fa) rows.push(['Farsi name', esc(a.coach_name_fa)]);
  if (a.athlete_id) rows.push(['Trains with you', `<a href="#a/${encodeURIComponent(a.athlete_id)}">${esc(nameOf(a.athlete_id))}</a>`]);
  if (a.applied_on) rows.push(['Applied', esc(a.applied_on)]);
  if (!a.active) rows.push(['Retired', esc(a.retired_on || '—')]);
  if (a.notes) rows.push(['Notes', esc(a.notes)]);
  const table = rows.length
    ? `<table class="meta-table">${rows.map(([k, val]) => `<tr><td class="k">${k}</td><td class="v">${val}</td></tr>`).join('')}</table>` : '';
  const usedBy = uses.length
    ? `<div class="aff-uses">Applications with this code (not payments): ${uses.map(i => `${esc(intakeName(i))} (${esc(String(i.created_at || '').slice(0, 10))}${(i.status || 'new') === 'handled' ? ', handled' : ', new'})`).join(', ')}</div>` : '';
  const acts = `<button class="btn sm aff-edit" data-code="${esc(a.code)}">Edit</button>` + (a.active
    ? `<button class="btn sm danger aff-retire" data-code="${esc(a.code)}">Retire code</button>`
    : `<button class="btn sm aff-reactivate" data-code="${esc(a.code)}">Reactivate</button>`);

  return `<details class="intake-card${a.active ? '' : ' archived'}"${editing ? ' open' : ''}>
    <summary><span class="aff-code">${esc(a.code)}</span><span class="i-name">${who}</span>${pills}<span class="i-when">${when}</span></summary>
    <div class="i-body">${editing ? affForm(a)
      : `<div class="i-contact">${contactLine}</div>${table}${usedBy}<div class="i-actions">${acts}</div>`}</div>
  </details>`;
}

// PostgREST answers an update that RLS filtered out with success and zero rows,
// so every write asks for the row back and treats "nothing came back" as failure.
async function affWrite(q) {
  const { data, error } = await q.select('code');
  if (error) return error.message;
  if (!data || !data.length) return 'nothing was saved (signed in as the coach?)';
  return null;
}

async function affSave(formEl, btn) {
  const isNew = formEl.dataset.new === '1';
  const row = {};
  formEl.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    let val = String(el.value || '').trim();
    if (k === 'code') val = val.toUpperCase();
    row[k] = val === '' ? null : (k === 'percent' ? Number(val) : val);
  });
  if (!row.code || !/^[A-Z0-9]{2,32}$/.test(row.code)) { toast('Code must be 2–32 letters or digits, no spaces'); return; }
  if (!Number.isInteger(row.percent) || row.percent < 1 || row.percent > 90) { toast('% off must be a whole number from 1 to 90'); return; }
  if (isNew && (S.affiliates || []).some(x => x.code === row.code)) { toast(row.code + ' already exists — edit that one instead'); return; }
  if (btn) btn.disabled = true;
  const code = row.code;
  const patch = Object.assign({}, row); delete patch.code;
  if (DEMO) {
    if (isNew) (S.affiliates = S.affiliates || []).push(Object.assign({ active: true, retired_on: null }, row));
    else Object.assign((S.affiliates || []).find(x => x.code === code) || {}, patch);
  } else {
    const err = await affWrite(isNew ? sb.from('affiliates').insert(row) : sb.from('affiliates').update(patch).eq('code', code));
    if (err) { if (btn) btn.disabled = false; toast('Could not save — ' + err); return; }
  }
  _affEditing = null;
  toast(DEMO ? 'Demo mode — nothing saved' : (isNew ? code + ' is live on both apply forms' : 'Saved'));
  if (DEMO) renderAffiliates(); else await refetch(['affiliates']);
}

async function affSetActive(code, active, btn) {
  if (!active && !confirm(`Retire ${code}?\n\nIt stops working on both apply forms straight away. The row stays, so its history and the intakes that used it are kept.`)) return;
  const patch = active ? { active: true, retired_on: null } : { active: false, retired_on: todayKey() };
  if (btn) btn.disabled = true;
  if (DEMO) {
    Object.assign((S.affiliates || []).find(x => x.code === code) || {}, patch);
  } else {
    const err = await affWrite(sb.from('affiliates').update(patch).eq('code', code));
    if (err) { if (btn) btn.disabled = false; toast('Could not update — ' + err); return; }
  }
  toast(DEMO ? 'Demo mode — nothing saved' : (active ? code + ' is live again' : code + ' retired'));
  if (DEMO) renderAffiliates(); else await refetch(['affiliates']);
}

function renderAffiliates() {
  const all = (S.affiliates || []).slice().sort((a, b) =>
    String(b.applied_on || '').localeCompare(String(a.applied_on || '')) || String(a.code).localeCompare(String(b.code)));
  const live = all.filter(a => a.active), retired = all.filter(a => !a.active);
  const orphans = live.filter(a => !a.coach_name && !a.coach_name_fa).length;

  let html = `<div class="controls">
      <button class="btn primary sm" id="affAdd">+ Add code</button>
      <span class="empty" style="align-self:center">These are the codes both apply forms accept. Add or retire one and it takes effect straight away — no deploy.</span>
    </div>`;
  if (_affEditing === '__new__') html += `<section class="panel" style="margin-bottom:16px"><div class="phead"><span class="t hd">New code</span></div>${affForm(null)}</section>`;
  html += `<section class="panel"><div class="phead"><span class="t hd">Live codes</span><span class="r">${live.length} live${orphans ? ` · <span style="color:var(--clay-ink)">${orphans} with no owner</span>` : ''}</span></div>`;
  html += live.length ? live.map(affCard).join('')
    : '<p class="empty">No live codes. When you accept a coach from partner-fa.html, add their code here.</p>';
  html += `<p class="psub" style="margin:12px 0 0">The deal: the client gets the code's % off; the coach earns 10% of what the client actually pays — first payment and every renewal. Payout details stay in the application email (Gmail, subject:(Affiliate)).</p></section>`;
  if (retired.length) {
    const openRetired = retired.some(a => a.code === _affEditing) ? ' open' : '';
    html += `<section class="panel" style="margin-top:16px"><details${openRetired}><summary class="arch-toggle">Retired · ${retired.length}</summary><div style="margin-top:12px">${retired.map(affCard).join('')}</div></details></section>`;
  }

  const c = $('content');
  c.innerHTML = html;
  const on = (sel, fn) => c.querySelectorAll(sel).forEach(el => el.addEventListener('click', e => { e.preventDefault(); fn(el); }));
  on('.copy-btn-js', el => copyText(el.dataset.url, el));
  on('#affAdd', () => { _affEditing = '__new__'; renderAffiliates(); });
  on('.aff-edit', el => { _affEditing = el.dataset.code; renderAffiliates(); });
  on('.aff-cancel', () => { _affEditing = null; renderAffiliates(); });
  on('.aff-save', el => affSave(el.closest('.aff-form'), el));
  on('.aff-retire', el => affSetActive(el.dataset.code, false, el));
  on('.aff-reactivate', el => affSetActive(el.dataset.code, true, el));
}

// The tennis testing app at /tennis-testing/app/ (its source is tennis-testing/app/ in this repo;
// /tennis-testing/ itself is the product page).
// Same pattern as athlete logins: the assess-login Edge Function makes the auth user on an
// internal address, assess.<username>@amirardekani.com, and hands back a password to send.
// Revoke bans the login but keeps the buyer's saved players and results; Restore brings it back
// with a new password. Buyer data itself is not readable from here, by design ("we don't monitor").
// Backend: supabase/assess_01_accounts_content_data.sql + supabase/functions/assess-login.
const ASSESS_URL = SITE + '/tennis-testing/app/';
let _assessBusy = false;
let _assessPw = null;   // the username whose password form is open (Change password or Restore), or null

async function loadAssess() {
  if (DEMO) {
    S.assess = S.assess || [{ username: 'academy_demo', label: 'Demo academy', created_at: new Date().toISOString(),
      initial_password: 'amber-cedar-kite-42', sent_at: null, revoked_at: null }];
    return;
  }
  const r = await sb.from('assess_accounts')
    .select('username, label, created_at, initial_password, password_set_at, sent_at, revoked_at')
    .order('created_at', { ascending: false });
  // A failed read stays "unknown" (null + the error), never an empty list that reads "No logins yet".
  LOAD_ERR.assess = r.error ? r.error.message : '';
  S.assess = r.error ? null : (r.data || []);
}

// The WhatsApp message a buyer gets, in Farsi like the app.
function assessMessage(username, password) {
  return 'اپ آزمون آمادگی جسمانی تنیس\n\n' +
    'لینک: ' + ASSESS_URL + '\n' +
    'نام کاربری: ' + username + '\n' +
    'رمز عبور: ' + password + '\n\n' +
    'وقتی گوشی پیشنهاد ذخیرهٔ رمز داد، ذخیره کنید تا دفعهٔ بعد بدون تایپ وارد شوید. ' +
    'این اطلاعات را فقط به مربی‌های آکادمی خودتان بدهید.\n\n' +
    'برای افزودن به صفحهٔ اصلی گوشی: لینک را باز کنید، بعد Share و Add to Home Screen.';
}

// password: one Amir typed (already checked by typedPassword), or '' to have the function generate one.
async function assessAction(action, username, label, btn, password) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (_assessBusy) return;
  if (action === 'revoke' && !confirm('Revoke ' + username + '?\n\nThey can no longer sign in. Their saved players and results are kept, and Restore brings the login back with a new password.')) return;
  _assessBusy = true; if (btn) btn.disabled = true;
  const { data, error } = await sb.functions.invoke('assess-login', { body: { action, username, label, password: password || undefined } });
  _assessBusy = false; if (btn) btn.disabled = false;
  let msg = data && data.error;
  if (!msg && error) { try { msg = (await error.context.json()).error; } catch (e) { msg = error.message; } }
  if (msg) { alert('Could not ' + action + ' the login:\n\n' + msg); return; }
  _assessPw = null;
  await loadAssess();
  if (action === 'revoke') { toast(username + ' revoked'); renderAssess(); return; }
  copyText(assessMessage(data.username, data.password));
  renderAssess();
  alert((data.created ? 'Login created' : action === 'restore' ? 'Login restored' : password ? 'Password changed' : 'New password') + ' for ' + data.username + '\n\n' +
    'Password: ' + data.password + '\n\n' +
    'The Farsi WhatsApp message is copied to your clipboard. It also stays in the list until you mark it sent.' +
    (data.warning ? '\n\n⚠ ' + data.warning : ''));
}

async function assessMarkSent(username) {

// password: one Amir typed (already checked by typedPassword), or '' to have the function generate one.
async function courseAction(action, username, label, btn, password) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (_courseBusy) return;
  if (action === 'revoke' && !confirm('Revoke ' + username + '?\n\nThey can no longer sign in, and the app deletes the handbook from their phone the next time it opens online. Restore brings the login back with a new password.')) return;
  _courseBusy = true; if (btn) btn.disabled = true;
  const { data, error } = await sb.functions.invoke('tps-login', { body: { action, username, label, password: password || undefined } });
  _courseBusy = false; if (btn) btn.disabled = false;
  let msg = data && data.error;
  if (!msg && error) { try { msg = (await error.context.json()).error; } catch (e) { msg = error.message; } }
  if (msg) { alert('Could not ' + action + ' the login:\n\n' + msg); return; }
  _coursePw = null;
  await loadCourse();
  if (action === 'revoke') { toast(username + ' revoked'); renderCourse(); return; }
  copyText(courseMessage(data.username, data.password));
  renderCourse();
  alert((data.created ? 'Login created' : action === 'restore' ? 'Login restored' : password ? 'Password changed' : 'New password') + ' for ' + data.username + '\n\n' +
    'Password: ' + data.password + '\n\n' +
    'The Farsi WhatsApp message is copied to your clipboard. It also stays in the list until you mark it sent.' +
    (data.warning ? '\n\n⚠ ' + data.warning : ''));
}

function spineMapHtml(credits, muscles, loads) {
  const pick = c => Object.entries(c && typeof c === 'object' ? c : {}).filter(([m, w]) => MAP_NAME[m] && Number(w) > 0);
  let ms = pick(credits), from = 'the counts';
  if (!ms.length) { ms = pick(muscles); from = 'the muscles shown'; }
  const lit = {}, rings = {};
  let say;
  if (ms.length) {
    ms.forEach(([m, w]) => (MAP_CREDIT_GROUPS[m] || [m]).forEach(g => { if (lit[g] !== '1') lit[g] = Number(w) >= 1 ? '1' : 'h'; }));
    const list = (w1, dot) => ms.filter(([, w]) => (Number(w) >= 1) === w1).map(([m]) => `<div><i style="background:${dot}"></i>${esc(MAP_NAME[m])}</div>`).join('');
    say = `<b>Main</b>${list(true, '#C7552F') || '<div class="muted">none</div>'}<b style="display:block;margin-top:6px">Helping</b>${
      list(false, '#E8A68B') || '<div class="muted">none</div>'}<div class="muted" style="margin-top:6px">from ${from}</div>`;
  } else {
    const rs = (loads || []).filter(z => MAP_ZONE_GROUPS[z]);
    rs.forEach(z => { MAP_ZONE_GROUPS[z].forEach(g => { lit[g] = '1'; }); (MAP_ZONE_RINGS[z] || []).forEach(r => { rings[r] = 1; }); });
    say = rs.length ? `<b style="color:var(--clay-ink)">No muscles yet</b><div class="muted">the athlete sees the body parts instead</div>`
      : `<b style="color:var(--clay-ink)">Nothing to show</b><div class="muted">add counts, muscles or body parts</div>`;
  }
  let s = BODYMAP_SVG;
  Object.keys(lit).forEach(g => { s = s.split(`data-g="${g}"`).join(`data-g="${g}" data-l="${lit[g]}"`); });
  Object.keys(rings).forEach(r => { s = s.split(`data-r="${r}"`).join(`data-r="${r}" data-on="1"`); });
  return `<div class="bmap-wrap"><div class="bmap">${s}</div><div class="bmap-say">${say}</div></div>`;
}
// Redraw the open editor's map from what is typed right now (before saving).
function spineMapRefresh() {
  const c = $('content'), box = c && c.querySelector('#spineMap');
  if (!box) return;
  const f = n => (c.querySelector(`[data-sf="${n}"]`) || {}).value || '';
  box.innerHTML = spineMapHtml(spineParseCredits(f('credits')).out, spineParseCredits(f('muscles')).out,
    [...c.querySelectorAll('[data-sload]:checked')].map(x => x.dataset.sload));
}
function spineParseCredits(s) {   // "quads 1, glutes 0.5" → { quads: 1, glutes: 0.5 }
  const out = {}, bad = [];
  String(s || '').split(',').map(x => x.trim()).filter(Boolean).forEach(x => {
    const m = x.match(/^([a-z]+)\s*[:\s]\s*(1(?:\.0)?|0?\.5)$/i);
    const k = m && (SPINE_MUSCLE_ALIAS[m[1].toLowerCase()] || m[1].toLowerCase());
    if (!m || !SPINE_MUSCLES.includes(k)) bad.push(x);
    else if (k in out) bad.push(x + ' (' + k + ' twice)');
    else out[k] = parseFloat(m[2]);
  });
  return { out, bad };
}
