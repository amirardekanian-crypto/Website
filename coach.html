  .pp:hover { border-color: var(--court); color: var(--court); }
  .pp.on { background: var(--court); border-color: var(--court); color: #fff; }
  .pp-off { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 8px; margin-top: 4px;
            font-family: 'Barlow', sans-serif; font-size: 12px; color: var(--clay-ink); }
  .pp-note { font-family: 'Barlow', sans-serif; font-size: 12px; color: var(--clay-ink); margin-top: 2px; line-height: 1.45; }
  .rx-pill { display: inline-block; padding: 0 8px; border-radius: 999px; background: var(--court-100);
             color: var(--court); font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 600; }
  .rx-pill.off { background: var(--clay-100); color: var(--clay-ink); }
  /* Claude's draft in the Spine editor (stage64): the box it filled, and the line that says so. */
  .sp-draft { margin: 2px 0 8px; padding: 8px 12px; border-radius: 8px; background: var(--clay-100); color: var(--clay-ink);
              font-size: 12px; line-height: 1.45; }
  .sp-draft .btn { margin-left: 8px; }
  .sp-draft .now { color: var(--muted); margin-top: 4px; }
  .sp-draft.off { background: var(--paper); color: var(--muted); border: 1px dashed var(--line); }
  .spine-ed .sp-drafted { border-color: var(--clay) !important; box-shadow: 0 0 0 1px var(--clay); }
  .sp-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sp-hint.bad { color: var(--clay-ink); font-weight: 600; }
  .pvlist { margin-top: 4px; }
  .pvrow { display: flex; align-items: center; gap: 12px; padding: 8px 0; flex-wrap: wrap;
           border-bottom: 1px solid var(--rule); font-family: 'Barlow', sans-serif; font-size: 12px; }
  .pvrow:last-child { border-bottom: 0; }
  .pvwhen { min-width: 150px; font-weight: 600; }
  .pvwho { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pvdiffbox { flex-basis: 100%; }
  .spsec { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 8px; }
  .lvslot { display: contents; }
  .spsec > summary { padding: 8px 0; }
  .pvdiff { margin: 2px 0 4px; padding-left: 16px; color: var(--ink); font-size: 12px; line-height: 1.5; }
  /* One-tap Undo after a programme save (FLOW-11): above the toast, clickable, gone after half a minute. */
  .undobar { position: fixed; left: 16px; right: 16px; bottom: 76px; margin: 0 auto; width: max-content; max-width: min(560px, calc(100vw - 32px)); z-index: 199;
             display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff; font-size: 14px; padding: 8px 12px 8px 16px;
             border-radius: 12px; box-shadow: var(--float); }
  .undobar[hidden] { display: none; }
  .undobar .btn { background: #fff; color: var(--ink); border-color: #fff; }
  .undobar .ux { background: none; border: 0; color: #fff; opacity: .7; font-size: 14px; cursor: pointer; padding: 4px 8px; }
  /* An entry's history (Exercises → an entry → History): one block per change, what it changed under it. */
  .spvrow { padding: 8px 0; border-bottom: 1px solid var(--rule); font-family: 'Barlow', sans-serif; font-size: 14px; }
  .spvrow:last-child { border-bottom: 0; }
  .spvtop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .spvwhen { font-weight: 600; }
  .spvwho { flex: 1; min-width: 120px; color: var(--muted); }
  .spvchg { margin-top: 4px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
  .spvchg b { font-weight: 600; color: var(--ink); }

  /* ── Logins waiting to be sent ───────────────────────────────────────── */
  .creds { margin-bottom: 16px; border-left: 3px solid var(--clay); }
  .creds-top { display: flex; width: 100%; align-items: center; justify-content: space-between;
    background: none; border: 0; padding: 2px 0; cursor: pointer; font: inherit; color: inherit; }
  .creds-t { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .creds-n { background: var(--clay-fill); color: #fff; border-radius: 999px; font-size: 12px;
    letter-spacing: 0; padding: 0 8px; line-height: 1.4; font-weight: 600; }
  /* The credentials fold is a button, not a <details>, and draws the same chevron on the left as every other fold. */
  .creds-top { flex-direction: row-reverse; justify-content: flex-end; gap: 12px; }
  .creds-chev { flex: none; font-size: 12px; line-height: 1; color: transparent; overflow: hidden; width: 8px; height: 8px; margin: 0 4px 2px 3px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
                transform: rotate(-45deg); transition: transform .15s; }
  .creds-top[aria-expanded="true"] .creds-chev { transform: rotate(45deg); }
  .credrow { display: flex; align-items: center; gap: 12px; padding: 8px 0;
    border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .credrow:last-child { border-bottom: 0; }
  .credname { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px; min-width: 150px; }
  .credpass { font-family: 'Space Mono', monospace; font-size: 12px; background: var(--court-100);
    padding: 4px 8px; border-radius: 8px; flex: 1; min-width: 190px; }
  .credrow .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  /* A buyer's row (Course, Testing app): the buttons used every day sit at the right, the rest wait behind Manage, one line under the row. */
  .credrow.buyer .acts { margin-left: auto; }
  .credrow.buyer .credstate { flex: 1; }
  .credrow.buyer .acts .btn[aria-expanded="true"] { border-color: var(--court); color: var(--court); }
  @media (max-width: 640px) { .credrow.buyer .acts { margin-left: 0; } }
  .credmore { flex-basis: 100%; display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 0 4px; }
  /* Typing a login password (Athletes, Testing app, Course): the box, its buttons, and the rule under them. */
  .pwform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 0 12px;
    border-bottom: 1px solid var(--rule); }
  .pwform:last-child { border-bottom: 0; }
  .pwin { flex: 1; min-width: 190px; font-size: 14px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  /* Space Mono only where the characters must be exact: a password, and the name typed to confirm an erasure. A note, a number to call and a search stay Barlow. */
  #athPw, [class*="-pwin"], #eraseIn, .pw-secret { font-family: 'Space Mono', monospace; }
  .pwin:focus { border-color: var(--court); }
  .pwhint { flex-basis: 100%; font-size: 12px; color: var(--muted); margin: 0; }
  .waform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 2px 0 4px; }      /* the WhatsApp number box: the password row's look, its own class so the two never match each other */
  /* Full erasure (stage54): an inline panel, like the password forms, because the list is long and a phone clips a native dialog. */
  .erase { border: 1px solid var(--clay); border-radius: 12px; padding: 16px 16px; margin: 12px 0 4px; background: #fff; }
  .erase .eh { font-weight: 600; font-size: 14px; margin: 0 0 8px; }
  .erase p { margin: 8px 0; font-size: 14px; line-height: 1.5; }
  .erase ul { margin: 8px 0 12px; padding-left: 20px; font-size: 14px; line-height: 1.6; columns: 2; column-gap: 24px; }
  .erase .pick { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 4px 0; line-height: 1.45; }
  .erase .pick input { margin-top: 4px; }
  .erase .pick span { overflow-wrap: anywhere; min-width: 0; }
  .erase .stays { color: var(--muted); font-size: 14px; }
  .erase ul.picked { columns: 1; list-style: none; padding-left: 0; }
  .erase ul.picked li { padding: 4px 0; }
  .erase .finder { margin-top: 12px; }
  .erase .finder label { display: block; font-size: 14px; margin-bottom: 4px; }
  .erase .typed { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .erase .typed label { flex-basis: 100%; font-size: 14px; }
  @media (max-width: 640px) { .erase ul { columns: 1; } }
  /* The short version of the Erase panel (dangerAsk): the same clay look, drawn in a slot right under the button that asked. Four lines:
     what is being done, what goes, what stays, and the final button named for the act beside Cancel. No slot is drawn until it has a panel. */
  .dangerslot:empty { display: none; }
  .erase.dangerask { margin: 8px 0 4px; max-width: 760px; }
  .erase.dangerask .typed { margin-top: 12px; }
  .erase.dangerask .typed .btn { max-width: 100%; white-space: normal; text-align: left; }
  .hidrow + .dangerslot .erase.dangerask { margin: 0 0 12px; }
  .cmp-did { font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.5; }
  .cmp-did > span { display: inline-block; margin-right: 8px; }
  .did-sets.ok { color: var(--court); } .did-sets.warn { color: var(--ochre); } .did-sets.miss { color: var(--clay-ink); }
  .did-sets.note { color: var(--muted); }
  .did-load { color: var(--ink); }
  .did-rpe.ok { color: var(--muted); } .did-rpe.warn { color: var(--clay-ink); font-weight: 700; }
  .did-none { color: var(--muted-soft); }
  .did-detail { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .cmp-flags { display: flex; flex-wrap: wrap; gap: 4px; align-content: start; }
  .did-rpe.under { color: var(--rpe-under); font-weight: 700; }
  .rpe-set.over { color: var(--clay-ink); font-weight: 700; } .rpe-set.under { color: var(--rpe-under); font-weight: 700; }
  @media (max-width: 820px) {
    .cmp-head { display: none; }
    .cmp-row { grid-template-columns: 1fr; gap: 4px; padding: 12px 0; }
    .cmp-rx::before { content: 'Asked: '; font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 600; color: var(--muted); }
    .cmp-did::before { content: 'Did: '; font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 600; color: var(--muted); }
  }

  .rawlog { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 12px; }
  .livesnap { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--card); margin-top: 16px; }
  .ls-day { margin-top: 8px; font-size: 14px; }

  /* ── Roster ── */
  .rfilters { display: flex; gap: 8px; flex-wrap: wrap; }
  .rf .c { font-size: 12px; opacity: .7; margin-left: 8px; }
  /* A group's label is a quiet band inside the roster's surface, not a heading of its own. */
  .rgroup { display: flex; align-items: baseline; gap: 8px; padding: 8px 16px; background: rgba(26,26,26,.03);
            border-bottom: 1px solid var(--rule); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .rgroup .c { font-weight: 400; color: var(--muted); }
  .rgroup.needs .c { color: var(--clay-ink); font-weight: 600; }

  /* Proof strip on detail */
  .proofstrip { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .proofstrip .big { font-size: 22px; font-weight: 600; color: var(--court); line-height: 1.2; }
  .proofstrip .big small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .proofstrip .meta { font-size: 12px; color: var(--muted); }

  /* Charts */
  /* The three charts (round 3 of the coach UX pass, 2026-10-12): the card is the title and the number on one line, one line of what it means, the plot
     with its axes, and the legend pushed to the foot, so the three legends line up whatever the card above them says. The axis labels are HTML
     (12 px, muted), not text drawn in the SVG, which scales with its card: a label drawn in it fell under 12 px on a phone. The y labels sit at
     the height of the value they name (a % of the plot's height); the x labels are the first and last date (the load bars: the week's Monday). */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  /* From 900 px the readiness card, which has the longest words, is the wide one and adherence, which is one bar, the narrow one: the cards come out about as tall as the plot needs. */
  @media (min-width: 900px) { .charts { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, .8fr); } }
  .chart-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 12px;
                display: flex; flex-direction: column; min-width: 0; }
  .chart-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 12px; }
  .chart-card h4 { font-size: 14px; color: var(--ink); margin-bottom: 2px; font-weight: 600; }
  .chart-big { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .chart-big .cb-unit { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  .chart-big-quiet { font-size: 17px; color: var(--muted); }
  .chart-sub { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .chart-svg { display: block; width: 100%; height: auto; margin-top: 12px; }
  .chart-legend { font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 8px; line-height: 1.4; }
  .chart-plot { display: grid; grid-template-columns: var(--cpy, 28px) minmax(0, 1fr); margin-top: 8px; }
  .chart-plot .cp-y { position: relative; }
  .chart-plot .cp-y span { position: absolute; right: 6px; transform: translateY(-50%); font-size: 12px; line-height: 1; color: var(--muted); white-space: nowrap;
                           font-variant-numeric: tabular-nums; }
  .chart-plot .cp-main { min-width: 0; }
  .chart-plot .chart-svg { margin-top: 0; }
  .cp-x { grid-column: 2; display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 12px; line-height: 1.2; color: var(--muted); white-space: nowrap; }
  .cp-x.one { justify-content: center; }
  /* Adherence is one bar, 0 to 100 %: the same x line under it, in the same place the other two charts' dates are. */
  .chart-bar { margin-top: 12px; }
  .chart-bar .bar { margin-top: 0; }
  .chart-bar .cp-x { margin-top: 4px; }
  /* Body weight on The work: ONE compact panel. The figures are its header line (the summary) and the chart folds under it. */
  .wtpanel { padding: 12px 20px; margin-bottom: 12px; }
  .wtdet > summary { font-weight: 400; }
  .wtdet .wt-t { font-weight: 600; }
  .wtdet .chart-svg { max-width: 520px; }
  .wtdet .chart-plot { max-width: 560px; }

  /* Personal records — one line per lift on The work tab */
  .pr-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline;
    padding: 12px 0; border-top: 1px solid var(--line); }
  .prlist .pr-row:first-child { border-top: none; padding-top: 0; }
  .pr-n { font-weight: 600; font-size: 17px; }
  /* Pinned to the second column explicitly: an auto-placed item that names its
     own row lands in column 1 and puts the whole row back to front. */
  .pr-v { grid-column: 2; grid-row: 1 / span 2; align-self: center;
    font-family: 'Space Mono', monospace;
    font-size: 17px; font-weight: 700; text-align: right; white-space: nowrap; }
  .pr-v small { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .pr-s { font-size: 12px; color: var(--muted); }
  .pr-s.amber { color: var(--ochre); }
  .pr-s b { font-weight: 600; }
  .pr-tag { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px;
    background: var(--track); color: var(--muted); vertical-align: 2px;
    font-size: 12px; font-weight: 600; line-height: 1.4; }
  .bar { height: 8px; background: var(--track); border-radius: 999px; margin-top: 12px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }

  /* Session cards / program view (ported) */
  .day-c { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .day-c > summary { padding: 16px 16px; display: flex; align-items: center; gap: 0; }
  .day-c > summary:hover { background: rgba(0,0,0,0.02); }
  .day-c[open] > summary { border-bottom: 1px solid var(--rule); }
  .day-c-main { flex: 1; min-width: 0; }
  .day-c-main h3 { font-size: 14px; font-weight: 600; }
  .day-c-chev { margin-left: auto; color: var(--muted-soft); transition: transform .2s; flex: none; font-size: 12px; }
  .day-c .day-c-chev { display: none; }   /* a call log is a fold: its chevron is the left one, like every other */
  .day-c-body { padding: 16px 16px 16px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em;
       padding: 8px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  td.num { font-family: 'Space Mono', monospace; white-space: nowrap; font-size: 12px; }
  .tablewrap { overflow-x: auto; }
  .meta-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .meta-table td { padding: 4px 0; border: none; font-size: 14px; vertical-align: top; }
  .meta-table td.k { color: var(--muted); width: 128px; font-size: 12px; font-weight: 600; padding-right: 12px; }
  .meta-table td.v { font-size: 14px; overflow-wrap: anywhere; }
  .empty code, .pr-n, .credname { overflow-wrap: anywhere; }
  .note { background: var(--paper); border-left: 3px solid var(--line); padding: 8px 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
  .note.green { border-left-color: var(--court); }
  .elog-body { white-space: pre-wrap; font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.65;
               background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
  .readiness { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
  .readiness .r { font-size: 12px; color: var(--muted); }
  .readiness .r b { font-weight: 600; color: var(--ink); }

  /* Session-note actions (Mark read). Amir answers only on WhatsApp, 2026-09-26. */
  .note-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  /* Earlier cycles (workTabHtml): last cycle's sessions, folded under this cycle's day cards. */
  details.rawlog.earlier > details.rawlog { margin: 8px 0 0; }

  /* ── Board (leaderboard) ── */
  .lbrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .lbrow .pos { flex: none; width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
                font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--track); color: var(--muted); }
  .lbrow.top1 .pos, .lbrow.top2 .pos, .lbrow.top3 .pos { background: var(--court); color: #fff; }   /* the first three are green: clay and plum mean something else here */
  .lbrow .nm { flex: 1; min-width: 0; }
  .lbrow .nm b { font-weight: 600; font-size: 17px; }
  .lbrow .nm small { display: block; font-size: 12px; color: var(--muted); }
  .lbrow .xp { flex: none; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }
  .lbrow .xp small { display: block; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }
  .lbrow.me { box-shadow: inset 3px 0 0 var(--court); padding-left: 12px; }
  /* Pick-one for a VIEW: the segmented switch (the filter chip above is the one for a list). 32 px in all, like a button. */
  .segs { display: inline-flex; gap: 0; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
  .seg { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg:hover { color: var(--court); }
  .seg.active { background: var(--court); color: #fff; }

  /* Funnel */
  .fun { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); flex-wrap: wrap; }
  .fun.hotlead { box-shadow: inset 3px 0 0 var(--clay); padding-left: 12px; }   /* ready to upgrade: it asks something of you */
  .fun .main { flex: 1; min-width: 150px; }
  .fun .nm { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fun .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .fun .days { flex: none; text-align: center; font-size: 17px; font-weight: 600; line-height: 1.2; color: var(--ink); }
  .fun .days small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .fun .acts { flex: none; display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 480px) { .fun .acts { flex: 1 1 100%; } }
  /* Titles feed */
  .tfeed { display: flex; align-items: baseline; gap: 12px; padding: 8px 4px; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .tfeed:last-child { border-bottom: 0; }
  .tfeed .tnm { font-weight: 600; }
  .tfeed .ttl { font-weight: 600; }
  .tfeed .td { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* Links (ported) */
  /* The Library (round 3 of the coach UX pass, 2026-10-12): one panel per kind, a fold per shelf with its count, and a compact row per item (about 44 px:
     title, kind and meta in muted text, then one Copy link and Hide / Publish). It was a card of 85 px with the whole address printed in mono, 64 times. */
  .lib-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }   /* the first panel's own top margin (--gap) is the space under it */
  .lib-count { font-size: 14px; color: var(--muted); }
  .lib-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .lib-shelf > summary { display: flex; align-items: baseline; gap: 0; padding: 12px 0; border-top: 1px solid var(--rule); }
  .lib-n { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  .link-row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 0 8px 20px; border-top: 1px solid var(--rule); }
  .link-row-info { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 2px 12px; }
  .link-row-title { flex: 0 1 auto; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link-row-info .chip { flex: none; align-self: center; }
  .link-row-meta { flex: 1 100 auto; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link-row.hiddenitem .link-row-title { color: var(--muted); }
  .lr-acts { flex: none; display: flex; align-items: center; gap: 8px; }
  .lr-copy { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .lr-pick { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .lr-pick[hidden] { display: none; }
  .lr-copy-btn[aria-expanded="true"] { border-color: var(--court); color: var(--court); }
  /* A phone: the title above its meta, and the buttons on a line of their own so the title is read in full. */
  @media (max-width: 560px) {
    .link-row { flex-wrap: wrap; padding: 8px 0 8px 12px; gap: 8px 12px; }
    .link-row-info { flex: 1 1 100%; flex-direction: column; align-items: flex-start; gap: 0; }
    .link-row-title, .link-row-meta { max-width: 100%; }
    .link-row-meta { white-space: normal; }
    .lr-acts { flex: 1 1 100%; flex-wrap: wrap; }
  }
  .rawlog.lib-hidden > .link-row { padding-left: 0; }

  /* Toast + demo banner */
  /* Hidden with visibility, not only moved: a long message used to stay half on screen. */
  #toast { position: fixed; left: 16px; right: 16px; bottom: 26px; margin: 0 auto; width: max-content;
           max-width: min(560px, calc(100vw - 32px)); z-index: 200; pointer-events: none; text-align: center;
           background: var(--court); color: #fff; font-size: 14px; font-weight: 600; padding: 12px 20px;
           border-radius: 12px; box-shadow: var(--float);
           transform: translateY(calc(100% + 40px)); visibility: hidden;
           transition: transform .25s cubic-bezier(.16,1,.3,1), visibility 0s linear .25s; }
  #toast.on { transform: none; visibility: visible; transition: transform .25s cubic-bezier(.16,1,.3,1); }
  /* What did not work stays on screen until it is dismissed (fail()). A banner in the page flow, so it never covers a control at rest
     (a bar over the bottom of the screen covered the Spine editor's Save bar), and sticky under the header, so it is in view
     wherever the page is scrolled to. On a phone the tabs scroll away and it sits right under the header. */
  .failbar { position: sticky; top: var(--stick); z-index: 58; max-width: 1180px; margin: 12px auto 0; padding: 0 20px;
             display: flex; flex-direction: column; gap: 8px; align-items: stretch; max-height: 45vh; overflow: auto; }
  .failbar[hidden] { display: none; }
  .failbar .fb-line { display: flex; gap: 12px; align-items: flex-start; background: var(--clay-100); color: var(--ink);
                      border-left: 3px solid var(--clay); border-radius: 12px; padding: 12px 8px 12px 16px; font-size: 14px; line-height: 1.5;
                      box-shadow: var(--float); }
  .failbar .fb-msg { flex: 1; white-space: pre-line; overflow-wrap: anywhere; }
  .failbar .fb-x { flex: none; border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
                   min-width: 34px; min-height: 34px; border-radius: 8px; }
  .failbar .fb-x:hover { background: rgba(0,0,0,.06); }
  .failbar .fb-all { align-self: flex-end; }
  /* A notice (something to read or copy once: a first password, the backup summary, an erasure receipt) is a line in the same bar, in court green
     instead of clay; the same ✕. One that is also a warning (.warn: a password the server could not store, an incomplete backup) takes the clay. */
  .failbar .fb-line.fb-notice { background: var(--court-100); border-left-color: var(--court); }
  .failbar .fb-line.fb-notice.warn { background: var(--clay-100); border-left-color: var(--clay); }
  .failbar .fb-title { display: block; font-weight: 600; }
  .failbar .fb-n { margin-left: 8px; }
  .failbar .fb-body { display: block; margin-top: 4px; }
  .failbar .fb-sel { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; user-select: all; overflow-wrap: anywhere; }
  .failbar .fb-body.fb-sel { font-weight: 400; }
  .failbar .fb-more { margin-top: 8px; }
  .failbar .fb-copy { flex: none; align-self: center; white-space: nowrap; }
  @media (max-width: 1220px) { .failbar { padding: 0 20px; } }
  @media (max-width: 480px) { .failbar { padding: 0 16px; } }
  .demoband { background: var(--ochre); color: #fff; text-align: center; font-size: 12px; font-weight: 600; padding: 8px 12px; }
  /* The muscle map (stage42): the same body and colours as program.html's About sheet, drawn in
     Exercises → an entry so Amir sees what the athlete sees while he edits the counts. */
  .bmap { --skin: #ECE6DC; --mus: #CBC1B2; --line: #A89D8C; --main: #C7552F; --help: #E8A68B; --cap: #9A9184; }
  .bmap svg { display: block; height: 260px; width: auto; max-width: 100%; }
  .bmap .sf { fill: var(--skin); }
  .bmap [data-g] { fill: var(--mus); }
  .bmap [data-l="1"] { fill: var(--main); }
  .bmap [data-l="h"] { fill: var(--help); }
  .bmap .ln { fill: var(--line); stroke: var(--line); stroke-width: 1.2; stroke-linejoin: round; }
  .bmap .sil { fill: none; stroke: var(--line); stroke-width: 3; stroke-linejoin: round; }
  .bmap text { font: 400 58px monospace; letter-spacing: 8px; fill: var(--cap); text-anchor: middle; }
  .bmap .ring { display: none; fill: rgba(199,85,47,0.15); stroke: var(--main); stroke-width: 7; }
  .bmap .ring[data-on] { display: inline; }
  .bmap-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .bmap-say { font-size: 14px; line-height: 1.7; }
  .bmap-say i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 8px 0 0; }
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate" class="gate" style="display:none">
  <div class="mark">AA · COACH</div>
  <h1 class="hd">The Coach's Box</h1>
  <p>Private. Sign in with the coach Google account to open the dashboard.</p>
  <button id="loginBtn" class="btn primary">Sign in with Google</button>
  <div id="gateErr" class="err"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div id="demoband" class="demoband" style="display:none">Demo data — remove ?demo=1 for the real thing</div>
  <header class="topbar">
    <div class="tb-top">
      <a class="brand" href="#today">AMIR ARDEKANI <span>· THE BOX</span></a>
      <div class="right">
        <span class="who" id="who"></span>
        <button class="tbtn" onclick="hardRefresh()" title="Reload everything from the server" aria-label="Refresh">↻<span class="tb-lbl"> Refresh</span></button>
        <button id="toolsBtn" class="tbtn" aria-expanded="false" aria-controls="toolsPanel" onclick="toggleTools()" title="Coach tools, the backup, and the logins waiting to be sent">⚙<span class="tb-lbl"> Tools</span></button>
        <button id="logoutBtn" class="tbtn">Sign out</button>

  <main class="wrap" id="content"><div class="loading"><div class="spinner"></div>Warming up…</div></main>
  <nav class="botbar" id="botbar" aria-label="Sections"></nav>
  <div class="morescrim" id="moreScrim" onclick="closeMore()" hidden></div>
  <nav class="moresheet" id="moreSheet" aria-label="More places" hidden></nav>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="undobar" class="undobar" role="status" hidden></div>

<script>
// --- config -----------------------------------------------------------------
const SB_URL = 'https://bvipfipbdcyqnbczjmaq.supabase.co';
const SB_KEY = 'sb_publishable_BuDVTTC1E0eg3wc7F1Pcig_1A_tqYCy';
const COACH_EMAIL = 'amirardekanian@gmail.com';   // UX-only; the DB (RLS) is the real gate
const SITE = 'https://www.amirardekani.com';
const COACH_NOTE_ID = '__coach__';                // hab_notes row id the coach line lives under
const AMIR_ATHLETE_ID = 'amir_ardekani';          // leaderboard_top() is called AS THE SIGNED-IN COACH (is_coach() lets it through); this id only marks which row is "you" on the board
const QUIET_SESSION_DAYS = 7;                     // coached athlete idle threshold
const QUIET_HABIT_DAYS = 3;                       // Proof athlete silent threshold
const UPGRADE_DAYS = 14;                          // free athlete with this many logged days = upgrade candidate
// "Waiting on you" means this fortnight. Notes are only marked read when the
// coach acts on them, so without a window the counter silently accumulates
// every note ever written (51 of them, back to June, on the day this shipped)
// and the headline number stops meaning anything. Older ones become a backlog
// row you can discharge in one tap. The fortnight is counted from when the note ARRIVED
// (noteArrivedOn), not from the training day.
const NEEDS_WINDOW_DAYS = 14;

const DEMO = new URLSearchParams(location.search).has('demo');
// supabase-js comes from a CDN. If that script failed (blocked, offline, a bad build), say so

const TABLE_KEYS = {

  hab_titles: ['athlete_id', 'title'], hab_season_results: ['athlete_id', 'starts_on'],
  library_categories: ['kind', 'id'], library_sessions: ['athlete_id', 'slug', 'completed_on'],
  assess_results: ['player_id', 'test', 'day'], affiliates: ['code'], assess_accounts: ['user_id'],

    if (apply) q = apply(q);

    const { data, error, count } = await q.range(from, from + 999);

// session_history is the one table that grows without limit (about 135 sessions a month), and 78% of its bytes are two
// columns the numbers never read: `summary` (the plain-text log) and `log` (the structured one). Every open and every
// refresh used to download all of it (about 750 kB for 501 sessions). Now (audit TODAY-12, 2026-10-11):
//  - boot reads every session's numbers (HIST_LIGHT), and ONLY the text of the unread sessions that contain "Note:",
//    because an exercise note lives inside the text and is what puts someone in Needs you (sessionHasNote);
//  - an athlete's own text and log are read when their file opens (ensureSessionsFull), once, and again only after the
//    list itself was reloaded.
const HIST_LIGHT = 'athlete_id, athlete_name, day, completed_on, status, session_rpe, duration_min, readiness, day_note, focus, updated_at, coach_status, hidden_at, hidden_by';

async function loadHistory() {

const _fullBusy = {};

  if (!mine().length || S.fullFor[athleteId] === S.histVer) return Promise.resolve({ ok: true });
  if (_fullBusy[athleteId]) return _fullBusy[athleteId];
  const job = (async () => {
    for (let tries = 0; tries < 3; tries++) {
      const ver = S.histVer;
      const r = await selectAll('session_history', HIST_HEAVY, null, q => q.eq('athlete_id', athleteId).is('hidden_at', null));
      if (r.error) return { ok: false, error: r.error.message || 'no answer' };
      if (ver !== S.histVer) continue;     // the list was reloaded while this was on its way: those rows are gone, ask again
      const byKey = {};
      mine().forEach(h => { byKey[histKey(h)] = h; });
      (r.data || []).forEach(n => { const h = byKey[histKey(n)]; if (h) { h.summary = n.summary; h.log = n.log; } });

async function loadAll() {

    loadHistory(),
    sb.from('hab_notes').select('*').gte('day', addDays(todayKey(), -7)),
    sb.rpc('contact_list'),

    sb.from('leaderboard_optin').select('athlete_id, display_name, title'),

// Refetch just the slices a write touched, then re-render.
async function refetch(parts) {
  if (DEMO) { render(); return; }
  const jobs = [], bad = [];
  // A slice that fails to come back is TOLD, not skipped: a save that worked and then showed the old wall, quest week or contact list looked like
  // nothing had happened (audit TODAY-13, 2026-10-11; only the session list used to say so). Programmes report through the banner (LOAD_ERR).
  const take = (label, p, apply) => jobs.push(Promise.resolve(p).then(
    r => { if (r && r.error) bad.push(`${label} (${r.error.message})`); else apply(r); },
    e => { bad.push(`${label} (${(e && e.message) || e})`); }));
  if (parts.includes('notes')) take('the crew wall', sb.from('hab_notes').select('*').gte('day', addDays(todayKey(), -7)), r => { S.notes = r.data || []; });
  if (parts.includes('rules')) take('the quest and XP rules', sb.from('xp_rules').select('rules').eq('id', 1).maybeSingle(), r => { S.rules = (r.data && r.data.rules) || null; });
  if (parts.includes('contacts')) take('the Proof contacts', sb.rpc('contact_list'), r => { S.contacts = r.data || []; });
  if (parts.includes('intake')) take('the intake forms', selectAll('hab_intake', '*'), r => { S.intake = r.data || []; });
  if (parts.includes('status')) take('the paused and former marks', selectAll('athlete_status', '*'), r => { S.status = {}; (r.data || []).forEach(x => { S.status[x.athlete_id] = x; }); });
  if (parts.includes('affiliates')) take('the affiliate codes', sb.from('affiliates').select('*').order('code'), r => { S.affiliates = r.data || []; });
  if (parts.includes('hist')) take('the session list', loadHistory(), r => { S.hist = r.data || []; });
  if (parts.includes('programs')) jobs.push(loadPrograms());
  if (parts.includes('prog')) take('the athletes\' progress', selectAll('athlete_progress', 'athlete_id, athlete_name, data, updated_at'), r => { S.prog = r.data || []; });
  if (parts.includes('optin')) take('the leaderboard names', sb.from('leaderboard_optin').select('athlete_id, display_name, title'), r => { S.optin = {}; (r.data || []).forEach(x => S.optin[x.athlete_id] = x); });
  await Promise.all(jobs);
  if (bad.length) fail(`Saved, but ${bad.join(' and ')} could not be reloaded, so what you see for ${bad.length === 1 ? 'it' : 'them'} may be out of date. Tap ↻ Refresh.`);
  // Everything that feeds the roster and the athlete file is rebuilt in one place, after all the
  // reads: a contact forgotten, a programme replaced, a progress blob deleted. (Only 'hist' did
  // this before, so a forgotten contact kept their dots and board name until ↻ Refresh.)
  if (parts.some(x => ['hist', 'programs', 'prog', 'optin', 'contacts', 'status'].includes(x))) assemble();
  render();
}

// A password typed in coach.html for any login (Athletes, Testing app, Course), tidied the way it
// gets typed: spaces at the ends dropped, Persian or Arabic digits turned into 0-9. Empty means
// "generate one". The rule is the same as checkTyped() in the three login functions, which check it
// again: 8-72 printable English characters, no spaces, not the username. Returns { password } or { error }.
function typedPassword(raw, username) {
  const p = String(raw || '').trim()
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660));
  if (!p) return { password: '' };
  if (!/^[\x21-\x7E]{8,72}$/.test(p)) return { error: 'Password: 8 to 72 characters, English letters, numbers and symbols only, no spaces.' };
  if (p.toLowerCase() === String(username || '').toLowerCase()) return { error: 'The password can’t be the same as the username.' };
  return { password: p };
}

// Create / reset / revoke an athlete's login. All three go through the
// athlete-login Edge Function, because creating a user needs the service-role key
// and that must never exist in a page anyone can view source on. A create or reset
// can carry a password Amir typed (checked by typedPassword first, and again by the
// function); without one, the function generates it.
let _athLoginBusy = false;   // one login call at a time: a double tap on Reset made two passwords and left the message with the first (audit MKT-6)
async function athleteLoginAction(athleteId, action, password) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (action === 'create' && loginsUnknown()) return;
  if (_athLoginBusy) return;
  _athLoginBusy = true;
  let data, error;
  try { ({ data, error } = await sb.functions.invoke('athlete-login', { body: { action, athlete_id: athleteId, password: password || undefined } })); }
  finally { _athLoginBusy = false; }
  let msg = data && data.error;
  if (!msg && error) { try { msg = (await error.context.json()).error; } catch (e) { msg = error.message; } }
  if (msg) { fail('Could not ' + action + ' the login:\n\n' + msg); return; }
  _athPwOpen = null;
  await loadLogins();
  assemble();
  render();

  if (action === 'revoke') { toast(data.revoked === false ? 'There was no login to remove' : 'Login removed'); return; }
  // The password and its message now sit on the athlete's File tab (and under "Logins to send")
  // with Copy and Mark sent, so nothing depends on a dialog that is gone once dismissed.
  copyText(loginMessage(data.username, data.password), null, true);
  // Unless the server could not store it (athlete-login v6 says so): then this is the only place it is shown.
  if (data.warning) {
    notice('Password ' + (password ? 'changed' : 'reset') + ' for ' + data.username + ', but ' + data.warning + '.',
      'Password: ' + data.password + '\n\nThe WhatsApp message is copied to your clipboard.', { copy: data.password, warn: true });
    return;
  }
  toast((data.created ? 'Login created' : password ? 'Password changed' : 'Password reset') + ' — the message is copied; send it on WhatsApp');
}

// existing "Logins to send" panel picks all of them up automatically.

  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (loginsUnknown()) return;
  const ids = athletesNeedingLogin();
  if (!ids.length) return;
  if (!confirm(
    `Create logins for ${ids.length} athlete${ids.length === 1 ? '' : 's'}?\n\n${ids.join(', ')}\n\n` +
    'Each gets a new username/password, ready to copy under "Logins to send".'

  if (_athLoginBusy) return;

  let data, error;
  try { ({ data, error } = await sb.functions.invoke('athlete-login', { body: { action: 'create_many', athlete_ids: ids } })); }
  finally { _athLoginBusy = false; }

    return;
  }

    (failed.length ? `${skipped.length ? '\n\n' : ''}${failed.length} failed:\n` + failed.map(why).join('\n') : ''), { warn: failed.length > 0 });

}

/* ═══ BACKUP ════════════════════════════════════════════════════════════════
   The Supabase project is on the free plan, which takes NO automatic backups.
   378 session logs and every athlete's progress blob exist in exactly one place;
   programmes at least also sit in git history and a local folder, but the training
   record does not. If the project were deleted tomorrow, this file is the only
   thing that would bring it back.

   Runs entirely in Amir's signed-in session — RLS decides what it can read, so
   there is no service key anywhere. Download it weekly and keep it off this PC too.
   Keep only the LAST 12 (Amir, 2026-10-04, "rolling"): the privacy notice promises that a
   deleted record leaves the backups within about three months, so delete older files on
   both copies. scripts/prune_backups.py lists them.
   ═══════════════════════════════════════════════════════════════════════════ */
// ⚠️ This list must hold EVERY table in the public schema. A backup that
// silently misses one is worse than no backup, because you only find out on the
// day you need it. Check it against:
//   select tablename from pg_tables where schemaname = 'public' order by 1;
// and remember that a table with RLS on and no coach policy reads back as zero
// rows rather than an error — hab_season_results did exactly that until
// 2026-09-12, and it is the one table nothing else could rebuild.
// 2026-10-05: 13 of the 35 tables were missing from this list. Added: the course lessons
// (tps_content, course_en), the exercise library (exercises, exercise_coach, qualities), the
// testing app's content and accounts (assess_content, assess_accounts) and tps_accounts.
// Left out on purpose: assess_publish_keys and tps_publish_keys (hashes of revoked keys).
// 2026-10-11 (stage50, Amir's yes): assess_players, assess_notes and assess_results are in too. They are a buyer's own
// players (name, birth year and month, sex, hand, squad), notes and test results; only the member who owns them could
// read them, so before stage50 the coach read ZERO rows and a backup would have looked fine while empty. The coach now
// has a read-only policy on each (no write), so the dashboard still cannot change a buyer's data.
// hab_season_results got its SELECT grant in stage46 (2026-10-10); coaching_log_versions (stage47)
// is every earlier text of a coaching log, kept by a trigger. spine_versions (stage49) is the same for the
// Spine: every row of exercises, exercise_coach and qualities as it was before a change, deletes included.
// 2026-10-11: buyer_notes (stage53) is the private note about each buyer, moved out of the buyer's reach; erasure_log
// (stage54) is the receipt of every full erasure (a hash, the counts, no personal data). A restore from an old backup
// would bring erased people back: scripts/restore/restore_backup.py leaves out everyone a receipt names (give it the NEWEST backup
// as --receipts). The way back, step by step: scripts/restore/README.md (2026-10-11, audit TOOLS-4; rehearsed by rehearse.mjs).
// A table added to the schema goes in this list the same day AND in supabase/schema_snapshot.sql: scripts/test_restore_backup.py
// (pre-commit guard 17) fails when the two disagree.
const BACKUP_TABLES = [
  'programs', 'program_versions', 'coaching_logs', 'athlete_identities',
  'athlete_progress', 'session_history', 'messages', 'hab_notes', 'hab_contacts',
  'hab_titles', 'hab_intake', 'leaderboard_optin', 'seasons', 'xp_rules',
  'call_logs', 'cycle_reports', 'hab_season_results', 'athlete_keys',
  'library', 'library_categories', 'library_sessions',
  'affiliates',
  'tps_content', 'course_en', 'tps_accounts', 'assess_content', 'assess_accounts',
  'assess_players', 'assess_notes', 'assess_results',
  'exercises', 'exercise_coach', 'qualities', 'coaching_log_versions', 'spine_versions',
  'buyer_notes', 'erasure_log', 'athlete_status',
];

const PASSWORD_TABLES = ['athlete_identities', 'tps_accounts', 'assess_accounts'];
// Only a COMPLETE backup counts as the weekly one. An incomplete one (a table could not be read, or came back short) is saved
// under another name and is not a restore point, so it must not silence the weekly reminder either (audit TOOLS-3, pile B2).
const LAST_BACKUP_KEY = 'coach_last_backup';
const LAST_BAD_BACKUP_KEY = 'coach_last_backup_incomplete';
function lastBackupAt() { try { return localStorage.getItem(LAST_BACKUP_KEY) || ''; } catch (e) { return ''; } }
// The latest INCOMPLETE try, only while it is newer than the last good backup (a good one after it clears the memory of it).
function lastBadBackupAt() {
  try { const bad = localStorage.getItem(LAST_BAD_BACKUP_KEY) || '', ok = lastBackupAt(); return bad && (!ok || bad > ok) ? bad : ''; } catch (e) { return ''; }
}
async function downloadBackup(btn) {
  if (DEMO) { toast('Demo mode — nothing to back up'); return; }
  const label = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Backing up…'; }

  const out = {
    exported_at: new Date().toISOString(),
    project: SB_URL,
    note: 'Export of the rows of every table in BACKUP_TABLES, taken from the coach dashboard: data only, no ' +
          'schema, functions or policies (those are in supabase/*.sql). See "could_not_read" for anything that could not be read. ' +
          'To put it back: scripts/restore/README.md. python scripts/restore/restore_backup.py turns this file into SQL (give it your newest backup as --receipts, so nobody you erased comes back); the structure is supabase/schema_snapshot.sql; logins are not in this file, they are re-created from the dashboard. ' +
          'Unsent login passwords (initial_password) are blanked on purpose: reset a login to issue a new one. ' +
          'Keep the last 12 weekly files only (python scripts/prune_backups.py <folder>). ' +
          'A file named aa-backup-INCOMPLETE-<date>.json (complete: false, with "could_not_read") is NOT a restore point.',
    tables: {},
  };
  const problems = [];

  for (const t of BACKUP_TABLES) {
    // Paged in key order (selectAll), so no row is skipped or repeated between pages.
    const r = await selectAll(t, '*');
    if (r.error) { problems.push(t + ': ' + r.error.message); continue; }
    let rows = r.data;
    if (r.short) problems.push(`${t}: only ${rows.length} of ${r.total} rows came back`);
    // Login passwords are kept only until the coach sends them (Logins to send). A backup file
    // sits on a PC and a second drive for three months; it never needs them, because restoring
    // an account means a new password anyway. They are blanked here, not in the database.
    if (PASSWORD_TABLES.includes(t)) rows = rows.map(x => ('initial_password' in x) ? Object.assign({}, x, { initial_password: null }) : x);
    out.tables[t] = rows;
  }

  const counts = Object.entries(out.tables).map(([t, r]) => `${t}: ${r.length}`);
  out.row_counts = Object.fromEntries(Object.entries(out.tables).map(([t, r]) => [t, r.length]));
  const incomplete = problems.length > 0;
  out.complete = !incomplete;
  if (incomplete) out.could_not_read = problems;

  // The name says what the file is: an incomplete one must never sit among the weekly files looking like a restore point,
  // and scripts/prune_backups.py reads the name to keep it out of the 12 it keeps.
  const stamp = new Date().toISOString().slice(0, 10);
  const fileName = `aa-backup-${incomplete ? 'INCOMPLETE-' : ''}${stamp}.json`;
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);

  if (btn) { btn.disabled = false; btn.textContent = label; }
  // A complete backup is "the last backup"; an incomplete one is remembered separately, so the reminder keeps asking.
  try { localStorage.setItem(incomplete ? LAST_BAD_BACKUP_KEY : LAST_BACKUP_KEY, new Date().toISOString()); } catch (e) {}
  paintTools();   // the Tools panel says when the last backup was
  const total =Object.values(out.tables).reduce((s, r) => s + r.length, 0);
  // The summary is a notice (round 3 of the UX pass); the rows per table are folded under it. An INCOMPLETE one keeps its warning first, in the clay tone,
  // and puts what could not be read straight under it, so it cannot be mistaken for a restore point.
  const summary = `Backup downloaded — ${total} rows across ${Object.keys(out.tables).length} tables.`;
  const keepCopy = 'Keep a copy somewhere that is not this computer.\n\nKeep only the last 12 weekly backups, on both, and delete older ones: the privacy notice promises a deleted record leaves the backups within about three months.';
  const perTable = { label: 'Rows in each table', text: counts.join('\n') };
  if (incomplete) notice(`⚠ INCOMPLETE backup — saved as ${fileName}.`,
    `It is NOT a restore point and does not count as this week's backup: some tables could not be read, so a restore from it would be missing data. Fix what is listed below, then take the backup again, and delete this file.\n\n` +
    '⚠ INCOMPLETE — could not read everything:\n' + problems.join('\n') + '\n\n' + summary + '\n\n' + keepCopy, { warn: true, more: perTable });
  else notice(summary, keepCopy, { more: perTable });
}

// Add coaching logs from .md files, ONLY for athletes who have none on the server yet.
// Since 2026-09-07 the server copy is the record: publish_cycle() splices into it and /cycle-report
// appends its Debrief there, so a local .md is always older. This used to replace the server log
// wholesale (no history, no warning), wiping every Debrief written since. It now never overwrites.
function pickCoachingLogs() {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (LOAD_ERR.clogs) { fail('The list of coaching logs did not load, so I cannot tell which athletes already have one. Tap ↻ Refresh first.'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.md,text/markdown';
  input.multiple = true;
  input.onchange = async () => {
    const files = [...(input.files || [])].filter(f => /\.md$/i.test(f.name) && !/^README/i.test(f.name));
    if (!files.length) { fail('No .md files selected.'); return; }
    const rows = [], skipped = [], kept = [];
    for (const f of files) {
      const id = f.name.replace(/\.md$/i, '');
      if (!/^[A-Za-z0-9_]+$/.test(id) || !S.ath[id]) { skipped.push(f.name + ' (no athlete with that id)'); continue; }
      if ((S.clogs || {})[id]) { kept.push(id); continue; }
      rows.push({ athlete_id: id, body: await f.text() });
    }
    if (!rows.length) {
      notice('Nothing to add.', (kept.length ? `Already on the server (left exactly as they are):\n${kept.join(', ')}` : '') +
            (skipped.length ? `${kept.length ? '\n\n' : ''}Skipped:\n${skipped.join('\n')}` : ''));
      return;
    }
    if (!confirm(`Add ${rows.length} new coaching log(s)?\n\n${rows.map(r => r.athlete_id).join(', ')}\n\n` +
                 'They become coach-only records on the server.' +
                 (kept.length ? `\n\n${kept.length} athlete(s) already have one on the server; those are NOT touched: ${kept.join(', ')}` : ''))) return;
    const failed = [];
    for (let i = 0; i < rows.length; i += 10) {
      const slice = rows.slice(i, i + 10);
      // ignoreDuplicates: insert only. If a log appeared on the server meanwhile, it wins.
      const { error } = await sb.from('coaching_logs').upsert(slice, { onConflict: 'athlete_id', ignoreDuplicates: true });
      if (error) slice.forEach(r => failed.push(r.athlete_id + ': ' + error.message));
    }
    await loadCoachingLogs();
    render();
    notice(`Added ${rows.length - failed.length} of ${rows.length}.`,
          (skipped.length ? `Skipped:\n` + skipped.join('\n') : '') +
          (failed.length ? `${skipped.length ? '\n\n' : ''}Failed:\n` + failed.join('\n') : ''), { warn: failed.length > 0 });
  };
  input.click();
}

async function loadCoachingLogs() {
  const r = await sb.from('coaching_logs').select('athlete_id, updated_at');
  LOAD_ERR.clogs = r.error ? r.error.message : '';
  if (r.error) return;
  S.clogs = {};
  (r.data || []).forEach(row => { S.clogs[row.athlete_id] = row; });
}

// Loaded on demand — a coaching log is long prose and there is no reason to pull
// 28 of them on every dashboard boot.
async function openCoachingLog(athleteId) {
  const box = $('clog-body');

// Publish a workout or article into the Library.
//
// The /workout and /article skills still write the JSON; this is how it goes live.
// There is no manifest to update any more — the category comes from the file's own
// `category` field and the card details are read off the item itself, which is what
// used to make adding a workout a two-file job.
function pickLibraryFile(kind) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (LOAD_ERR.library) { fail('The library did not load (' + LOAD_ERR.library + '), so nothing can be published: its categories are unknown. Tap ↻ Refresh first.'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.multiple = true;
  input.onchange = async () => {
    const files = [...(input.files || [])];
    if (!files.length) return;

    const rows = [], bad = [], fileOf = {};
    for (const f of files) {
      let d;
      try { d = JSON.parse(await f.text()); }
      catch (e) { bad.push(f.name + ': not valid JSON'); continue; }
      const id  = String(d.id || '').trim();
      const cat = String(d.category || '').trim();
      // A Farsi translation is a web page source, never an app article: if one carried id and
      // category it would overwrite the English article for every athlete (CLAUDE.md).
      if (/\.fa\.json$/i.test(f.name) || d.lang === 'fa' || d.sourceHash || d.translationOf) {
        bad.push(f.name + ': a Farsi translation (.fa.json) — it builds the website page, it never goes in the app'); continue;
      }
      const looksWorkout = 'countsAs' in d || 'focusTag' in d || 'duration' in d;
      if (kind === 'article' && looksWorkout) { bad.push(f.name + ': this is a workout file — use + Publish workout'); continue; }
      if (kind === 'workout' && !looksWorkout && ('readMins' in d || 'date' in d)) { bad.push(f.name + ': this is an article file — use + Publish article'); continue; }
      if (!id)  { bad.push(f.name + ': no "id" field'); continue; }
      if (!cat) { bad.push(f.name + ': no "category" field, which decides its shelf'); continue; }
      // Workouts name the shelf by its id ("conditioning"), articles by its title ("Pre-Competition").
      const shelf = (S.libCats || []).find(c => c.kind === kind &&
        (c.id === cat || String(c.title || '').toLowerCase() === cat.toLowerCase() || c.id === cat.toLowerCase()));
      if (!shelf) { bad.push(f.name + ': category "' + cat + '" does not exist yet'); continue; }
      const slug = (kind === 'workout' ? 'workouts/' : 'articles/') + shelf.id + '/' + id;
      // The same id already lives on ANOTHER shelf: publishing here would put it in the Library twice (audit TOOLS-6, 2026-10-11).
      const elsewhere = (S.lib || []).find(l => l.kind === kind && l.slug !== slug && String((l.data || {}).id || '') === id);
      if (elsewhere) {
        const was = (S.libCats || []).find(c => c.id === elsewhere.category_id);
        bad.push(f.name + ': "' + id + '" is already on the ' + ((was && was.title) || elsewhere.category_id) + ' shelf. To move it, hide that one first (its row in the Library list), then publish this file again');
        continue;
      }
      // An item you hid stays hidden when its file is published again: the confirm says so, and publishing it is the Show button's job.
      const before = (S.lib || []).find(l => l.slug === slug);
      fileOf[slug] = { name: f.name, was: !before ? 'new' : before.published === false ? 'hidden' : 'live' };
      rows.push({ slug, kind, category_id: shelf.id, data: d, published: before && before.published === false ? false : true });
    }

    const NL = String.fromCharCode(10);
    if (bad.length && !rows.length) { fail('Nothing published:' + NL + NL + bad.join(NL)); return; }
    const WAS = { 'new': 'new', live: 'replaces the live one', hidden: 'replaces a hidden one, which STAYS hidden (show it from its row when you want it live)' };
    const preview = rows.map(r => '· ' + (r.data.title || r.slug) + ' — ' + WAS[fileOf[r.slug].was]).join(NL);
    const skipped = bad.length ? NL + NL + 'Skipped:' + NL + bad.join(NL) : '';
    if (!confirm('Publish ' + rows.length + ' ' + kind + '(s)?' + NL + NL + preview + skipped)) return;

    const res = await sb.from('library').upsert(rows, { onConflict: 'slug' }).select('slug');
    const badW = writeFailed(res, 'published');
    if (badW) { fail('Could not publish: ' + badW); return; }
    await loadLibrary();
    render();
    if (bad.length) notice('Published ' + rows.length + '.', 'Skipped:' + NL + bad.join(NL)); else toast('Published ' + rows.length);
  };
  input.click();
}

async function loadLibrary() {
  S.libCats = [];
  S.lib = [];
  // The items are read in pages like every growing table (audit SERVER-10, 2026-10-11): one request stops at the server's row cap. All or nothing, as
  // the Spine: a short answer would show a half-empty shelf as if the rest were gone.
  const [c, l] = await Promise.all([
    sb.from('library_categories').select('*').order('sort_order'),
    selectAll('library', 'slug, kind, category_id, published, updated_at, data, sort_order', ['sort_order', 'slug']),
  ]);
  if (!c.error) S.libCats = c.data || [];
  if (!l.error && !l.short) S.lib = l.data || [];
  LOAD_ERR.library = c.error ? c.error.message : l.error ? l.error.message : l.short ? `only ${l.data.length} of ${l.total} library items came back` : '';
}

// Open an athlete's own app in a new tab, read-only.
//
// No impersonation needed: get_program() and the athlete RPCs accept the coach, so
// Amir's own session already resolves their programme. `preview=1` is what stops the
// app writing, and it also skips the pull of their saved progress: the preview shows
// their PROGRAMME, never their logged work (sets, weights, records, habits), and looking
// around cannot land a stray tick or note in the athlete's record. The File tab's words
// and the preview bar in program.html say the same (audit TOOLS-11, 2026-10-11).
function viewAsAthlete(athleteId, which) {
  const page = which === 'habits' ? 'habits.html' : 'program.html';
  // The demo's athletes are made up: show the public demo programme instead.
  if (DEMO) { window.open(`${SITE}/${page}?client=demo`, '_blank', 'noopener'); return; }
  window.open(`${SITE}/${page}?client=${encodeURIComponent(athleteId)}&preview=1`, '_blank', 'noopener');
}

// The same "counts as a logged day" test contact_list() uses server-side: the
// day's value is an object with at least one key. Presence, not score.
// ── Body weight ───────────────────────────────────────────────────────────
// Proof writes weight to its OWN key in the same progress blob — never into the
// habit log, because the server pays XP for unrecognised keys in a day object
// and a weight in there would score on the leaderboard and nowhere else. It is
// read-only here: the coach watches the trend, the athlete owns the record.
// Shape: { '2026-09-01': { kg: 78.4, t: 1756... } }
const WT_AVG_WINDOW = 7;
function wtOf(blob, id) {
  const wt = jparse(blob ? blob[id + '_hab_wt'] : null);
  const out = {};
  if (wt && typeof wt === 'object') {
    Object.keys(wt).forEach(k => {
      const e = wt[k];
      if (e && typeof e.kg === 'number' && isFinite(e.kg)) out[k] = e.kg;
    });
  }
  return out;
}
function wtDaysOf(wt) { return Object.keys(wt).sort(); }
// The same trailing-average the app draws, so the coach and the athlete are
// never looking at two different lines for the same body.
function wtAvgSeriesOf(wt, days) {
  const from = addDays(todayKey(), -(days - 1));
  const keys = wtDaysOf(wt);
  return keys.filter(k => k >= from).map(k => {
    const lo = addDays(k, -(WT_AVG_WINDOW - 1));
    const win = keys.filter(x => x <= k && x >= lo).map(x => wt[x]);
    return { day: k, v: win.reduce((s, v) => s + v, 0) / win.length };
  });
}
function wtChangeOf(wt, days) {
  const s = wtAvgSeriesOf(wt, days);
  if (s.length < 2) return null;
  return { delta: s[s.length - 1].v - s[0].v, n: s.length };
}
function fmtDeltaKg(v) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + round1(Math.abs(v)).toFixed(1); }

// ── Personal records (estimated 1RM) ──────────────────────────────────────
// program.html writes "<id>_1rm" into the same progress blob: one entry per
// lift per day, { lift, kg, w, r, rpe, d, t, test? }, where `kg` is the
// estimate and w/r/rpe the set it came from. Read-only here.
//
// ⚠ A deleted entry arrives as a TOMBSTONE ({ del: true }), not as a missing
// row — that is what stops the athlete's other phone handing it straight back.
// Filtering them out is this function's whole job; a coach looking at a number
// the athlete has already deleted is worse than showing nothing.
function oneRmOf(blob, id) {
  const raw = jparse(blob ? blob[id + '_1rm'] : null);
  if (!Array.isArray(raw)) return [];
  return raw.filter(e => e && e.lift && e.d && !e.del && e.kg > 0);
}

// The athlete's own name matching, ported so the two never disagree about
// whether a renamed lift is one lift or two — see ceilAliasMap() in
// program.html. Same four tiers, same "exactly one on each side" rule.
const EX_ABBREV_C = { db: 'dumbbell', bb: 'barbell', kb: 'kettlebell' };
function normExNameC(s) {
  return String(s || '').toLowerCase()
    .normalize('NFKD').replace(/[^\x00-\x7f]/g, '')
    .replace(/'/g, '').replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function exNameVariantsC(sfx) {
  const base = normExNameC(sfx);
  const toks = base.split(' ').filter(Boolean);
  const abbrev = toks.map(t => EX_ABBREV_C[t] || t).join(' ');
  const noMachine = abbrev.split(' ').filter(t => t && t !== 'machine').sort().join(' ');
  const noParen = normExNameC(String(sfx).replace(/\([^)]*\)/g, ' '));
  return [base, abbrev, noMachine, noParen];
}
function ceilAliasMapC(entries, current) {
  if (!current.length) return {};
  const cur = {};
  current.forEach(n => { cur[n] = 1; });
  const orphans = [];
  entries.forEach(e => { if (!cur[e.lift] && orphans.indexOf(e.lift) === -1) orphans.push(e.lift); });
  if (!orphans.length) return {};
  const index = names => {
    const store = [{}, {}, {}, {}];
    names.forEach(n => exNameVariantsC(n).forEach((v, tier) => {
      if (!v) return;
      (store[tier][v] || (store[tier][v] = [])).push(n);
    }));
    return store;
  };
  const curIdx = index(current), orpIdx = index(orphans), map = {};
  orphans.forEach(o => {
    const vs = exNameVariantsC(o);
    for (let tier = 0; tier < vs.length; tier++) {
      const v = vs[tier];
      if (!v) continue;
      if ((curIdx[tier][v] || []).length !== 1 || (orpIdx[tier][v] || []).length !== 1) continue;
      map[o] = curIdx[tier][v][0];
      break;
    }
  });
  return map;
}
// One row per lift: the latest estimate, the change since the first one, and
// how long the athlete has gone without putting a number on it.
function oneRmLifts(entries, current) {
  const alias = ceilAliasMapC(entries, current || []);
  const by = {};
  entries.forEach(e => {
    const lift = alias[e.lift] || e.lift;
    const day = (by[lift] = by[lift] || {});
    if (!day[e.d] || (e.t || 0) > (day[e.d].t || 0)) day[e.d] = e;
  });
  return Object.keys(by).map(lift => {
    const es = Object.keys(by[lift]).sort().map(d => by[lift][d]);
    const latest = es[es.length - 1];
    return { lift: lift, entries: es, latest: latest, delta: latest.kg - es[0].kg,
             age: daysSince(latest.d + 'T12:00:00') };
  }).sort((a, b) => (a.latest.d < b.latest.d ? 1 : -1));
}

function habDaysOf(blob, id) {
  const raw = blob ? blob[id + '_hab_log'] : null;
  const log = jparse(raw);
  const days = {};
  if (log && typeof log === 'object') {
    Object.keys(log).forEach(k => {
      const v = log[k];
      if (v && typeof v === 'object' && Object.keys(v).length) days[k] = true;
    });
  }
  return days;
}

// ── Sessions that reached the inbox but never reached the dashboard ───────────
// The app writes session_history itself (save_session) AND emails the report.
// Those are two independent calls, so one can succeed while the other fails —
// and when save_session is the one that fails it is completely silent: the
// payload goes into a localStorage retry queue that only drains on a future app
// open. Behnam, 2026-09-05: report emailed at 17:16, session_history row never
// written, found only because a "Done" pill looked wrong to Amir. Every athlete
// carries `<id>_sent_d<N>` (an ISO timestamp of the last send for that day), so
// a send with no matching history row is a session the dashboard is missing.
// It is the athlete's own record, not a guess. Since WK-04 (2026-09-27) the report
// can go hours or days after the session (it waits on the phone for signal), so the
// app also writes `<id>_senton_d<N>`, the date the session is filed under, and that
// is the date matched; the send's own UTC date is only the fallback for older sends.
function syncGapsOf(blob, id, sessions) {
  const gaps = [];
  if (!blob) return gaps;
  // supabase-js hands `date` columns back as 'YYYY-MM-DD' strings today, but a
  // Date here would silently stringify to "Mon Aug 10 2026" and mismatch EVERY
  // row — turning this into a false "not synced" warning on the whole roster,
  // which is worse than not having the check at all. Normalise both shapes.
  const dkey = v => (v instanceof Date)
    ? (isNaN(v.getTime()) ? '' : v.toISOString().slice(0, 10))
    : String(v == null ? '' : v).slice(0, 10);
  const have = new Set((sessions || []).map(s => Number(s.day) + '|' + dkey(s.completed_on)));
  const pre = id + '_sent_d';
  Object.keys(blob).forEach(k => {
    if (k.indexOf(pre) !== 0) return;
    const day = k.slice(pre.length);
    if (!/^\d+$/.test(day)) return;
    const filed = String(blob[id + '_senton_d' + day] || '');
    const on = /^\d{4}-\d{2}-\d{2}$/.test(filed) ? filed : String(blob[k] || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(on)) return;
    if (!have.has(Number(day) + '|' + on)) gaps.push({ day: Number(day), on });
  });
  // The phone's own list of the sessions it finished (program.html _noteFinished(), 2026-10-12): the same check with no email at all,
  // so it keeps working when the reports go. The last 14 days only: a session deleted for good from the athlete's File stays on the
  // phone's list, and an old entry is not chased for ever.
  let fin = blob[id + '_finished'];
  try { if (typeof fin === 'string') fin = JSON.parse(fin); } catch (e) { fin = null; }
  const since = addDays(todayKey(), -14);
  (Array.isArray(fin) ? fin : []).forEach(x => {
    const m = /^(\d+)\|(\d{4}-\d{2}-\d{2})$/.exec(String(x));
    if (!m || m[2] < since) return;
    const day = Number(m[1]), on = m[2];
    if (!have.has(day + '|' + on) && !gaps.some(g => g.day === day && g.on === on)) gaps.push({ day, on });
  });
  return gaps.sort((x, y) => String(y.on).localeCompare(String(x.on)));
}

// A contact record made by the coach for a number (stage62, source 'coach') is not a signup: it is not in the Proof signup funnel, is not a
// "new signup", does not count as the athlete being seen, and gives them no Proof tab.
const isSignup = c => !!c && c.source !== 'coach';
function assemble() {
  const map = {};
  const get = (id) => (map[id] = map[id] || {
    id, name: id, lastActive: null, sessions: [], hidden: [], finished: 0,
    habDays: {}, habLast: null, isHab: false, contact: null,
    toReply: 0,
  });
  S.prog.forEach(r => {
    const a = get(r.athlete_id);
    if (r.athlete_name) a.name = r.athlete_name;
    if (r.updated_at && (!a.lastActive || r.updated_at > a.lastActive)) a.lastActive = r.updated_at;
    a.habDays = habDaysOf(r.data, r.athlete_id);
    a.wt = wtOf(r.data, r.athlete_id);
    a.oneRm = oneRmOf(r.data, r.athlete_id);
    a.blob = r.data;                       // kept for syncGapsOf below (a reference, not a copy)
    const dk = Object.keys(a.habDays).sort();
    a.isHab = dk.length > 0;
    a.habLast = dk.length ? dk[dk.length - 1] : null;
  });
  S.hist.forEach(r => {
    const a = get(r.athlete_id);
    if (r.athlete_name) a.name = r.athlete_name;
    if (r.updated_at && (!a.lastActive || r.updated_at > a.lastActive)) a.lastActive = r.updated_at;
    a.finished++;
    a.sessions.push(r);
  });
  // Everyone with a programme gets a roster row, even if they have never logged a
  // session. This used to walk athlete_keys, which is empty now that the old
  // links are retired.
  Object.keys(S.programs || {}).forEach(id => get(id));
  S.contacts.forEach(c => { const a = get(c.athlete_id); a.contact = c; });
  // The sessions the coach hid (stage60) belong to an athlete who exists anyway; they never create a roster row of their own.
  (S.histHidden || []).forEach(r => { const a = map[r.athlete_id]; if (a) a.hidden.push(r); });

  Object.values(map).forEach(a => {
    const p = S.programs[a.id];
    if (p && p.athlete) {
      const nm = [p.athlete.firstName, p.athlete.lastName].filter(Boolean).join(' ');
      if (nm) a.name = nm;
    }
    if (a.name === a.id) {
      const o = S.optin[a.id];
      if (o && o.display_name) a.name = o.display_name;
      else if (a.contact && (a.contact.shown_as || a.contact.display_name)) a.name = a.contact.shown_as || a.contact.display_name;
      else a.name = unslug(a.id);
    }
    // Free tier lives at data.athlete.tier — that is the field isFree() reads in
    // habits.html, and every free row on the server carries it there, none at the
    // top level. Reading only p.tier showed all 13 free athletes as "Coached" here,
    // in the tier filter, and to athletesNeedingLogin(). Both spellings accepted so a
    // hand-written row either way still reads right.
    const ptier = p && (p.tier || (p.athlete && p.athlete.tier));
    a.tier = ptier === 'free' ? 'free' : (p ? 'coached' : (a.isHab ? 'proof' : 'unknown'));
    const stRow = (S.status || {})[a.id];      // stage63: only a paused or former athlete has a row
    a.status = stRow && (stRow.status === 'paused' || stRow.status === 'former') ? stRow.status : 'active';
    a.statusSince = stRow ? stRow.since : null; a.statusNote = stRow ? (stRow.note || '') : '';
    a.perWeek = (p && p.workouts && p.workouts.days && p.workouts.days.length) || 0;
    a.onBoard = !!S.optin[a.id];
    a.lastSession = a.sessions.length ? a.sessions.map(s => s.completed_on).sort().slice(-1)[0] : null;
    // Needs both halves, so it runs here rather than in either pass above.
    // A hidden session still has its `_sent_dN` mark in their progress, so it counts as present: hiding must not start a "not synced" warning (ROSTER-9).
    a.syncGaps = syncGapsOf(a.blob, a.id, a.sessions.concat(a.hidden));
    a.lowRun = a.tier === 'coached' ? lowRunOf(a.sessions) : '';
    // Split unanswered notes at the window: `recent` is what "waiting" means
    // anywhere a count is shown; `stale` is backlog. Every note still keeps its
    // own reply buttons on the athlete's file regardless of age. Age is the day the
    // note ARRIVED (noteArrivedOn), newest first, so the row on Today opens the latest one.
    const cut = addDays(todayKey(), -NEEDS_WINDOW_DAYS);
    a.needReplySessions = a.sessions.filter(sessionNeedsReply).sort(byArrival);
    a.needReplyRecent = a.needReplySessions.filter(s => noteArrivedOn(s) >= cut);
    a.needReplyStale = a.needReplySessions.length - a.needReplyRecent.length;
    a.toReply = a.needReplyRecent.length;
    const t = todayKey();
    a.habToday = !!a.habDays[t];
    a.hab7 = 0; for (let i = 0; i < 7; i++) if (a.habDays[addDays(t, -i)]) a.hab7++;
    a.habGap = a.isHab ? daysBetween(a.habLast, t) : null;
    a.cycle = cycleDatesOf(p);
    a.hasLogin = !!(S.logins || {})[a.id];
    const seen = [a.lastSession, a.habLast, a.lastActive && dkey(new Date(a.lastActive)),
                  isSignup(a.contact) && a.contact.signed_up && dkey(new Date(a.contact.signed_up))].filter(Boolean).sort();
    a.lastSeen = seen.length ? seen[seen.length - 1] : null;
  });
  Object.values(map).forEach(a => { a.reasons = reasonsOf(a); });
  S.ath = map;
  S.stamp++;
}

// ── Who needs you, and why: ONE rule ─────────────────────────────────────────
// Used by Today's Needs you, the roster's Why column, its "Needs you" group and filter, and its
// sort. Until 2026-10-10 there were four versions (the Today panel, rosterReasons, the roster
// sort and the counters), and they disagreed: sync gaps and upgrade leads never reached Today,
// new signups never reached the roster, and a run of low days did not move the sort.
const SYSTEM_IDS = ['demo'];          // the public marketing demo: on the roster, never a client
const LAPSED_DAYS = 30;               // nothing from them (session, habit, app sync) for this long

  if (!cyc) return null;
  const ok = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')) ? String(v) : null;   // a missing date is "no date", never "ended"
  return { name: cyc.name || '', weeks: cyc.weeks || '', start: ok(cyc.startDate), end: ok(cyc.endDate) };
}
function reasonsOf(a) {
  const out = [];
  const add = (key, tone, text, weight, sub) => out.push({ key, tone, text, weight, sub });
  const t = todayKey();
  a.lapsed = false;
  if (SYSTEM_IDS.includes(a.id) || a.id === AMIR_ATHLETE_ID) return out;
  const n = a.needReplyRecent ? a.needReplyRecent.length : 0;
  if (n) add('note', 'warn', n + ' note' + (n === 1 ? '' : 's') + ' to read', 100 + n, 'work');
  if (a.syncGaps && a.syncGaps.length) {
    const g = a.syncGaps[0];
    // Ranked high: every session-derived number on the dashboard is wrong for them until it is resolved.
    add('sync', 'warn', a.syncGaps.length === 1 ? `session not synced — Day ${g.day}, ${g.on}`
      : `${a.syncGaps.length} sessions not synced — latest Day ${g.day}, ${g.on}`, 80, 'work');
  }
  // On a break or gone (stage63, audit ROSTER-7): nobody is chasing them. A note they sent and a data mismatch above still count; nothing below does.
  if (a.status === 'paused' || a.status === 'former') { a.quietFlags = []; return out.sort((x, y) => y.weight - x.weight); }
  if (a.lowRun) add('lowrun', 'warn', 'run of low days', 70, 'work');
  const idle = a.lastSession ? daysBetween(a.lastSession, t) : null;
  const ended = a.cycle && a.cycle.end ? daysBetween(a.cycle.end, t) : null;   // > 0: days since it ended
  // A coached athlete inside a dated cycle that has not ended is never "gone quiet": they are paying
  // for this cycle, so a month without a session is someone to chase, not someone to fold away.
  const inCycle = a.tier === 'coached' && ended != null && ended <= 0;
  a.lapsed = (!inCycle && !!(a.lastSeen && daysBetween(a.lastSeen, t) > LAPSED_DAYS && !n))

  if (a.tier === 'coached' && ended != null) {
    if (ended >= -CYCLE_SOON_DAYS && ended <= 0) add('cycle', 'note', ended === 0 ? 'cycle ends today' : `cycle ends in ${-ended} day${ended === -1 ? '' : 's'}`, 45, 'work');
    else if (ended > 0 && ended <= CYCLE_RENEW_DAYS) add('renew', 'warn', `cycle ended ${ended} day${ended === 1 ? '' : 's'} ago — renew?`, 60, 'file');
  }
  const noLogin = S.progSrc[a.id] === 'db' && !a.hasLogin && !LOAD_ERR.logins;
  if (!a.lapsed && noLogin) add('login', 'warn', 'no login — cannot open the app', 50, 'file');
  // Someone locked out since the links were retired produces no activity, so they drift into Gone
  // quiet; the row still says why, without putting them in Needs you.
  a.quietFlags = a.lapsed && noLogin ? [{ tone: 'warn', text: 'no login — cannot open the app' }] : [];
  if (isSignup(a.contact) && a.contact.signed_up && daysSince(a.contact.signed_up) <= 7)
    add('signup', 'note', 'new signup · ' + timeAgo(a.contact.signed_up), 35, 'proof');
  if (a.lapsed) return out;
  if (a.tier === 'coached' && idle != null && idle > QUIET_SESSION_DAYS && !(ended != null && ended > 0))
    add('idle', 'note', 'no session for ' + idle + ' days', 30, 'work');
  // Proof silence is a reason for habit-only athletes. A coached athlete ticks habits on the
  // training app's Home now and then; their training is the signal, so their dots stay on the row.
  if (a.tier !== 'coached' && a.isHab && a.habGap >= QUIET_HABIT_DAYS)
    add('silent', 'note', 'silent on Proof — ' + a.habGap + ' days', 20 + Math.min(a.habGap, 14), 'proof');
  if (a.tier === 'free' && a.contact && a.contact.days_logged >= UPGRADE_DAYS)
    add('upgrade', 'good', 'ready to upgrade?', 25, 'proof');
  return out.sort((x, y) => y.weight - x.weight);
}

// --- quest helpers ----------------------------------------------------------

// it used to take the last one in the list, which is a different run when one is scheduled ahead).
function activeQuestRun() {

// Axes (round 3 of the coach UX pass, 2026-10-12). Every chart says what its marks are measured against: the y labels are the scale the marks

// --- live-activity decode (ported) ------------------------------------------
function decode(athleteId, blob) {
  const prefix = athleteId + '_';
  const days = {}; const ex = {};
  const day = n => (days[n] = days[n] || {});
  const exer = k => (ex[k] = ex[k] || {});
  Object.keys(blob || {}).forEach(fullKey => {
    if (fullKey.indexOf(prefix) !== 0) return;
    const key = fullKey.slice(prefix.length);
    const val = blob[fullKey];
    let m;
    if ((m = key.match(/^completed_d(\d+)$/)))   { const d = day(m[1]); d.completed = true; d.completedOn = val; }
    else if ((m = key.match(/^srpe_(\d+)$/)))    { day(m[1]).srpe = val; }
    else if ((m = key.match(/^readiness_(\d+)$/))) { day(m[1]).readiness = jparse(val); }
    else if ((m = key.match(/^daynote_(\d+)$/))) { day(m[1]).note = val; }
    else if ((m = key.match(/^setlog_(.+)$/)))   { exer(m[1]).sets = jparse(val) || []; }
    // Exercise notes are per SESSION since 2026-09-24: <id>_snote_<Name> = { d, v },
    // written by program.html and only meaningful on day d. The old durable note_
    // key is kept for athletes still on a cached older app, and never beats snote_.
    else if ((m = key.match(/^snote_(.+)$/)))    { const o = jparse(val); if (o && o.v) { exer(m[1]).note = o.v; exer(m[1]).noteOn = o.d; exer(m[1]).snote = true; } }
    else if ((m = key.match(/^note_(.+)$/)))     { if (!exer(m[1]).snote) exer(m[1]).note = val; }
    else if ((m = key.match(/^rpe_(.+)$/)))      { exer(m[1]).rpe = val; }
  });
  return { days, ex };
}

// it — the weight on the bar, the RPE of each set, the athlete's own note:
//
//   [Primary]

//       Set 2: @8 ✓           ← RPE only (bodyweight)

//       Note: knee felt fine
//      · Cat-Cow (×6 Reps)    ← circuit items
