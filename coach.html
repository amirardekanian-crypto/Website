// A working exercise dosed by TIME with no sets counts one set per 10 minutes, never
// less than 1 (a 30-min ride = 3). ⚠️ Same rule as program.html qmSets() and
// scripts/check_program.py qm_sets() (2026-09-26).
function qmSetsC(rx) {
  const n = parseInt(rx && rx.sets, 10);
  if (n) return n;
  // Chips.rxOf() hands the dose back as { kind, value }; a raw rx object carries `time` itself.
  const d = rx && rx.dose;
  const t = String((d && d.kind === 'time' ? d.value : rx && rx.time) || '').trim().toLowerCase();
  let sec = 0, m;
  if ((m = t.match(/^(\d+):(\d{2})$/))) sec = +m[1] * 60 + +m[2];
  else if ((m = t.match(/^(\d+(?:\.\d+)?)\s*(s|sec|secs|second|seconds|m|min|mins|minute|minutes)?$/)))
    sec = +m[1] * ((m[2] || 's')[0] === 'm' ? 60 : 1);
  return sec ? Math.max(1, sec / 600) : 1;
}
// One programme's current week: working sets per quality (primary 1, secondary
// half, prep blocks skipped — program.html's qualityMix() rule, drafts included
// here because this is the coach's view), plus the cycle's headline from `art`.
function qualityCheckC(data, idx, byId) {
  const score = {}; let total = 0, covered = 0;
  const add = (name, exId, sets) => {
    total += sets;
    const id = spineForC(idx, name, exId, byId);
    const qs = id ? (byId[id].qualities || []) : [];
    if (!qs.length) return;
    covered += sets;
    qs.forEach((q, i) => { score[q] = (score[q] || 0) + sets * (i === 0 ? 1 : 0.5); });
  };
  ((data.workouts && data.workouts.days) || []).forEach(d => (d.blocks || []).forEach(b => {
    if (QM_PREP.test(b.title || '')) return;
    (b.exercises || []).forEach(ex => {
      if (ex.type === 'circuit') {
        // Digits out of rx.rounds or a legacy "×3 Rounds", like program.html's parseRoundCount() (2026-09-26).
        const r = parseInt((String(Chips.rxOf(ex).rounds || ex.rounds || '').match(/\d+/) || ['1'])[0], 10) || 1;
        (ex.items || []).forEach(it => add(it.name, it.exId, r));
      } else add(ex.name, ex.exId, qmSetsC(Chips.rxOf(ex)));
    });
  }));
  const cyc = (data.cycles || [])[Number.isInteger(data.currentCycleIndex) ? data.currentCycleIndex : 0] || {};
  const head = QM_ART[String(cyc.art || '').toLowerCase()] || null;
  const ranked = Object.keys(score).sort((a, b) => score[b] - score[a]);
  return { score, ranked, head, art: cyc.art || '', cycle: cyc.name || '', coverage: total ? covered / total : 0,
    flag: !!(head && ranked.length && ranked.slice(0, 2).indexOf(head) < 0) };
}
function qualityPanels(idx, byId) {
  const quals = S.spine.quals || [];
  const field = 'width:100%;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;box-sizing:border-box';
  const nAp = quals.filter(q => q.status === 'approved').length;
  let h = `<section class="panel" style="margin-bottom:16px"><details${nAp < quals.length ? ' open' : ''}><summary class="arch-toggle">The ten qualities · ${nAp} of ${quals.length} approved</summary>
    <p class="psub" style="margin:10px 0">What each day card on Home says it builds. A quality reaches a phone only when it is approved <b>and</b> the day's exercises carry it. Athletes see the words, never your numbers. The court line shows to tennis and padel players only.</p>` +
    quals.map(q => `<div class="credrow" style="display:block;padding:10px 0">
      <div style="display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr);gap:8px;align-items:start">
        <div><input data-qf="${q.id}:name" aria-label="${esc(q.name)}: name" value="${esc(q.name)}" style="${field};font-weight:700"><div class="muted" style="font-size:12px;margin-top:4px">${esc(q.family || 'no picture')} · ${q.status === 'approved' ? '<b style="color:#1E7A55">approved</b>' : 'draft'}</div></div>
        <div style="display:grid;gap:6px">
          <input data-qf="${q.id}:line" aria-label="${esc(q.name)}: one line" value="${esc(q.line || '')}" placeholder="One line, for everyone" style="${field}">
          <input data-qf="${q.id}:tennis" aria-label="${esc(q.name)}: on court" value="${esc(q.tennis || '')}" placeholder="On court (tennis and padel only)" style="${field}">
          <input data-qf="${q.id}:tests" aria-label="${esc(q.name)}: how it is measured" value="${esc((q.tests || []).join(', '))}" placeholder="How we measure it (comma)" style="${field}">
          <div style="display:flex;gap:8px">${q.status === 'draft'
            ? `<button class="btn primary sm qm-save" data-q="${q.id}" data-ap="1">Approve</button><button class="btn sm qm-save" data-q="${q.id}">Save draft</button>`
            : `<button class="btn primary sm qm-save" data-q="${q.id}">Save</button><button class="btn sm qm-save" data-q="${q.id}" data-ap="0" title="Takes it off every day card">Move back to draft…</button>`}</div>
        </div></div></div>`).join('') + `</details></section>`;
  const rows = Object.entries(S.programs || {}).filter(([k, v]) => v && k !== 'demo' && v.workouts)
    .map(([aid, data]) => Object.assign({ aid }, qualityCheckC(data, idx, byId)))
    .sort((a, b) => (b.flag - a.flag) || a.coverage - b.coverage);
  const nFlag = rows.filter(r => r.flag).length;
  const qn = id => (quals.find(q => q.id === id) || {}).name || (id ? id[0].toUpperCase() + id.slice(1) : '');
  const sets = n => Math.round(n);
  h += `<section class="panel" style="margin-bottom:16px"><details${nFlag ? ' open' : ''}><summary class="arch-toggle">Quality check · ${
    nFlag ? `${nFlag} block${nFlag === 1 ? '' : 's'} to look at` : 'every block trains what it says'}</summary>
    <p class="psub" style="margin:10px 0">For each athlete: what their current week trains most, in working sets a week (a quality an exercise trains second counts as half a set; warm-ups don't count). The block's picture word says what it is <i>meant</i> to build (iron = Strength, voltage = Power …). If that isn't in the top two, it's flagged. Foundation, peaking and recovery blocks train a mix on purpose, so they are never flagged.</p>` +
    rows.map(r => {
      const top = r.ranked.slice(0, 4).map(q => `${esc(qn(q))} ${sets(r.score[q])}`).join(' · ');
      const aim = r.head ? `meant to build <b>${esc(qn(r.head))}</b>` : (QM_PHASE[String(r.art).toLowerCase()] || 'no picture word');
      const verdict = !r.ranked.length ? 'Nothing tagged yet, so the day cards show nothing.'
        : r.flag ? `<b style="color:var(--clay-ink)">⚠ ${esc(qn(r.head))} is ${r.ranked.indexOf(r.head) < 0 ? 'not trained at all' : 'only #' + (r.ranked.indexOf(r.head) + 1)} this week.</b> Either the week or the picture word is off.`
        : r.head ? `✓ ${esc(qn(r.head))} is in the top two.` : '✓ A mixed block, nothing to check.';
      const cov = r.coverage >= 0.995 ? 'every exercise tagged' : `${Math.round(r.coverage * 100)}% tagged${r.coverage < 0.7 ? ', so the day cards show nothing yet' : ''}`;
      return `<div class="credrow" style="display:block;padding:10px 0">
        <div><b>${esc(nameOf(r.aid))}</b> <span class="muted">· ${r.cycle ? `cycle "${esc(r.cycle)}" · ` : ''}${aim}</span></div>
        <div class="muted" style="margin-top:3px">Trains most: ${top || '—'} <span style="opacity:.8">(sets a week)</span></div>
        <div style="margin-top:3px;font-size:14px">${verdict} <span class="muted">· ${cov}</span></div></div>`;
    }).join('') + `</details></section>`;
  return h;
}

function renderExercises() {
  const c = $('content');
  if (!S.spine) {
    c.innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';

    return;

  if (S.spine.failed) {
    c.innerHTML = `<section class="panel"><p class="empty" role="alert"><b>The Spine did not load</b>, so nothing here can be shown or saved (a save from half a copy would blank what did not arrive).<br><span class="muted">${esc(S.spine.failed)}</span></p>
      <p style="text-align:center"><button class="btn primary sm" onclick="S.spine=null;renderExercises()">↻ Try again</button></p></section>`;
    return;
  }
  c.classList.toggle('no-anim', !!$('spineQ'));
  const list = S.spine.list, byId = {};

  const idx = spineIndexC(list);
  const usage = spineUsage();
  const who = {};   // entry id -> { athletes:{}, slots }
  let slotsAll = 0, slotsMapped = 0, namesMapped = 0;
  const unmapped = [];
  usage.forEach(u => {
    slotsAll += u.slots;
    const id = spineForC(idx, u.name, u.exId, byId);
    if (id) {
      namesMapped++; slotsMapped += u.slots;
      const w = who[id] || (who[id] = { athletes: {}, slots: 0 });
      Object.keys(u.athletes).forEach(a => { w.athletes[a] = 1; }); w.slots += u.slots;
    } else unmapped.push(u);

  unmapped.sort((a, b) => Object.keys(b.athletes).length - Object.keys(a.athletes).length || b.slots - a.slots);
  const pct = slotsAll ? Math.round(slotsMapped / slotsAll * 100) : 0;

  const shown = q ? list.filter(e => hay(e).includes(q)) : filter === 'approved' ? approved : drafts;
  const nAth = id => Object.keys((who[id] || {}).athletes || {}).length;
  const nLive = Object.entries(S.programs || {}).filter(([k, v]) => v && !SYSTEM_IDS.includes(k) && v.workouts && (v.workouts.days || []).length).length;
  const field = 'width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;box-sizing:border-box';

  const opts = (known, v, text) => (v && !known.includes(v) ? `<option value="${esc(v)}" selected>${esc(v)} (not in the list)</option>` : '') +
    known.map(id => `<option value="${esc(id)}"${id === v ? ' selected' : ''}>${esc(text ? text(id) : id)}</option>`).join('');
  const nm = id => (byId[id] || {}).name || id;
  // CUE-4: links go both ways. The editor writes one entry, so it says which ones do not link back.
  const oneWay = e => {
    const back = { easier: 'harder', harder: 'easier', alts: 'alts' }, out = [];
    ['easier', 'harder', 'alts'].forEach(k => (e[k] || []).forEach(x => {
      if (byId[x] && !(byId[x][back[k]] || []).includes(e.id)) out.push(`${esc(nm(x))} <span class="muted">(${k === 'easier' ? 'regression' : k === 'harder' ? 'progression' : 'alternative'})</span>`);
    }));
    return out;

  const editor = e => {
    const k = S.spine.coach[e.id] || {};
    const names = Object.keys((who[e.id] || {}).athletes || {}).map(a => esc(nameOf(a))).join(', ');
    const ow = oneWay(e);
    return `<div class="panel spine-ed" id="spineEd" style="margin:8px 0 14px;background:var(--paper, #FAF7F2)">
      <p class="psub" style="margin:0 0 4px">${names ? 'Doing it now: ' + names : 'Nobody has this in their programme right now.'} <span class="muted">· id ${esc(e.id)}${e.updated_by ? ' · last saved by ' + esc(e.updated_by) + (e.updated_at ? ', ' + esc(fmtLocalStamp(e.updated_at)) : '') : ''}</span></p>

        <div>${lbl('Pattern')}<select data-sf="pattern" style="${field}"><option value=""></option>${opts(SPINE_PATTERNS, e.pattern)}</select></div>
        <div>${lbl('Video')}<input data-sf="video" value="${esc(e.video || '')}" style="${field}"></div>
      </div>
      ${(() => {
        const sug = !(e.qualities || []).length && (k.suggested_qualities || []).length;
        const cur = (e.qualities || []).length ? e.qualities : (k.suggested_qualities || []);
        const qname = id => ((S.spine.quals || []).find(q => q.id === id) || {}).name || id;
        const sel = (n, v) => `<select data-sf="q${n}" style="${field}"><option value="">${n === 1 ? '— primary —' : '—'}</option>${opts(QM_IDS, v, qname)}</select>`;

      })()}
      ${lbl('Why it’s here (the athlete reads this)')}<textarea data-sf="purpose" rows="2" dir="auto" style="${field}">${esc(e.purpose || '')}</textarea>
      ${lbl('On court')}<input data-sf="tennis" dir="auto" value="${esc(e.tennis || '')}" style="${field}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px">
        <div>${lbl('Cues · one per line')}<textarea data-sf="good" rows="3" dir="auto" style="${field}">${esc(((e.cues || {}).good || []).join('\n'))}</textarea></div>
        <div>${lbl('Don’t · one per line')}<textarea data-sf="bad" rows="3" dir="auto" style="${field}">${esc(((e.cues || {}).bad || []).join('\n'))}</textarea></div>
        <div>${lbl('Regressions: easier versions of the same movement (ids, or a name)')}<input data-sf="easier" list="spineIds" value="${esc((e.easier || []).join(', '))}" style="${field}"></div>
        <div>${lbl('Progressions: harder versions of the same movement (ids, or a name)')}<input data-sf="harder" list="spineIds" value="${esc((e.harder || []).join(', '))}" style="${field}"></div>
        <div>${lbl('Alternatives: same movement, other equipment or machine (ids, or a name)')}<input data-sf="alts" list="spineIds" value="${esc((e.alts || []).join(', '))}" style="${field}"></div>
        <div>${lbl('Equipment (comma)')}<input data-sf="equipment" value="${esc((e.equipment || []).join(', '))}" style="${field}"></div>
      </div>
      ${ow.length ? `<p class="psub" style="margin:8px 0 0">Not linked back yet (links go both ways, CUE-4; Claude's /spine Upkeep adds the way back): ${ow.join(', ')}</p>` : ''}
      ${lbl('Body parts involved · the athlete sees these, with the impact pill after them')}
      <div style="display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center">
        ${SPINE_REGIONS.map(([id, nm2]) => `<label style="font-size:14px"><input type="checkbox" data-sload="${id}"${(e.loads || []).includes(id) ? ' checked' : ''} onchange="spineMapRefresh()"> ${nm2}</label>`).join('')}
        <select data-sf="impact" style="${field.replace('width:100%;', '')};width:auto"><option value="">— impact —</option>${opts(SPINE_IMPACTS.map(x => x[0]), e.impact, id => (SPINE_IMPACTS.find(x => x[0] === id) || [id, id])[1])}</select>
      </div>
      ${lbl('Muscles shown on the body map · only when "Counts toward" is empty (1 = main, 0.5 = helper)')}
      <input data-sf="muscles" oninput="spineMapRefresh()" value="${esc(spineCreditsText(e.muscles))}"
        placeholder="${k.credits && Object.keys(k.credits).length ? 'not needed: the map shows what it counts toward' : 'e.g. calves 1, shins 0.5'}" style="${field}">
      ${lbl('What the athlete sees · redraws as you type, saved when you save')}
      <div id="spineMap">${spineMapHtml(k.credits, e.muscles, e.loads)}</div>
      <div style="border-top:1px dashed var(--line);margin-top:14px;padding-top:4px">
        ${lbl('Coach only · the phone gets the muscles from “Counts toward” and whether each is main or helping, never SFR, flags, cost or notes')}
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
          <label>SFR rank <input data-sf="sfr" inputmode="numeric" value="${esc(k.sfr == null ? '' : String(k.sfr))}" style="width:60px;${field.replace('width:100%;', '')}"></label>
          ${SPINE_FLAGS.map(fl => `<label style="font-size:14px"><input type="checkbox" data-sflag="${fl}"${(k.flags || []).includes(fl) ? ' checked' : ''}> ${fl}</label>`).join('')}
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">
          <div style="flex:1 1 300px">${lbl('Counts toward, per working set (1 = prime mover, 0.5 = helper)')}<input data-sf="credits" oninput="spineMapRefresh()" value="${esc(spineCreditsText(k.credits))}"
            placeholder="${k.credits == null ? 'not set yet, e.g. quads 1, glutes 0.5' : 'counts toward nothing'}" style="${field}"></div>
          <div>${lbl('Cost of a set (day load)')}<select data-sf="cost" style="${field.replace('width:100%;', '')};width:auto"><option value="">— cost —</option>${opts(SPINE_COSTS.map(x => x[0]), k.cost, id => (SPINE_COSTS.find(x => x[0] === id) || [id, id])[1])}</select></div>

  };

  html += `<section class="panel" style="margin-bottom:16px"><div class="phead"><span class="t hd">Coverage</span><span class="r">${namesMapped} of ${usage.length} card names · ${pct}% of exercise slots</span></div>
    <div style="height:10px;border-radius:999px;background:var(--line);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--clay)"></div></div>

  html += `<section class="panel"><div class="phead"><span class="t hd">${q ? 'Matches' : filter === 'approved' ? 'Approved' : 'Waiting for you'}</span>

// --- INTAKE (coaching apply-form submissions) -------------------------------
// form.html / form-fa.html write here via submit_intake(); Amir reads them here.
// The Web3Forms email still fires too — this table is the durable copy so a
// relay outage can't lose a lead. Backend: supabase/stage27_intake.sql.
const INTAKE_SKIP = new Set(['First Name', 'Last Name', 'Email', 'Contact (Instagram/WhatsApp)', 'Programme',
                             'botcheck', 'access_key', 'from_name', 'subject', 'redirect']);
function intakeName(i) {
  const p = i.payload || {};
  return (i.name && i.name.trim()) || [p['First Name'], p['Last Name']].filter(Boolean).join(' ').trim() || 'Unnamed';
}
function intakeVal(v, fa) { return Array.isArray(v) ? v.join(fa ? '\u060C ' : ', ') : String(v == null ? '' : v); }
const RTL_RE = /[\u0600-\u06FF]/;
// A wa.me link only for something that IS a phone number. The intake field is "Contact
// (Instagram/WhatsApp)", and the old version kept whatever digits it found, so "@sara_1990" became
// wa.me/1990 and "sara.k99@gmail.com" wa.me/99: a tap opened a stranger's chat.
// Persian and Arabic digits count (a number typed on a Persian keyboard), 00 and + mean a country
// code follows, an Iranian 09… (or 9… with ten digits, or +98 0…) becomes 989…, and a number that
// still starts with a trunk 0 or is not 8-15 digits long gets no link (copy it instead).
function waLink(num) {
  let t = String(num || '').replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x06F0))
    .replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x0660)).trim();
  if (!t) return '';
  if (/[^0-9+\s().\-\u200c\u200e\u200f]/.test(t)) {
    // Words around a number ("09121234567 WhatsApp") keep the number; a handle or an email never
    // has a run of ten digits, and anything with an @ is never read as a number.
    const run = !/@/.test(t) && t.match(/\+?\d[\d\s().\-]{8,}\d/);
    if (!run || run[0].replace(/\D/g, '').length < 10) return '';
    t = run[0];
  }
  const plus = /^\+/.test(t);
  let d = t.replace(/[^0-9]/g, '');
  if (!plus && /^00/.test(d)) d = d.slice(2);
  else if (!plus && /^09\d{9}$/.test(d)) d = '98' + d.slice(1);
  else if (!plus && /^9\d{9}$/.test(d)) d = '98' + d;
  if (/^980\d{10}$/.test(d)) d = '98' + d.slice(3);
  if (/^0/.test(d) || d.length < 8 || d.length > 15) return '';
  return 'https://wa.me/' + d;
}

function intakeCard(i) {
  const name = intakeName(i);
  const st = i.status || 'new';
  const langPill = `<span class="ipill ${i.lang === 'fa' ? 'fa' : 'en'}">${i.lang === 'fa' ? 'FA' : 'EN'}</span>`;
  const progPill = i.programme ? `<span class="ipill prog">${esc(i.programme)}</span>` : '';

  const rows = [];
  const p = i.payload || {};
  Object.keys(p).forEach(k => {
    if (INTAKE_SKIP.has(k)) return;
    const val = intakeVal(p[k], i.lang === 'fa');
    if (!val.trim()) return;
    const rtl = RTL_RE.test(val);
    rows.push(`<tr><td class="k" dir="auto">${esc(k)}</td><td class="v${rtl ? ' rtl' : ''}" dir="${rtl ? 'rtl' : 'auto'}">${esc(val)}</td></tr>`);
  });
  const qa = rows.length ? `<table class="meta-table">${rows.join('')}</table>` : '<p class="empty">No further answers.</p>';

  const contact = i.contact || '', email = i.email || '', wa = waLink(contact);
  const cbits = [];
  if (email) cbits.push(`<a href="mailto:${esc(email)}">${esc(email)}</a> <button class="btn sm copy-btn-js" data-url="${esc(email)}">Copy</button>`);
  if (contact) cbits.push((wa ? `<a href="${esc(wa)}" target="_blank" rel="noopener">${esc(contact)}</a>` : esc(contact)) + ` <button class="btn sm copy-btn-js" data-url="${esc(contact)}">Copy</button>`);
  const contactLine = cbits.join('<span class="dot">·</span>') || '<span class="muted">No contact given</span>';

  let acts;
  if (st === 'new')      acts = `<button class="btn sm primary intake-act" data-id="${esc(i.id)}" data-to="handled">Mark handled</button><button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="archived">Archive</button>`;
  else if (st === 'handled') acts = `<button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="new">Reopen</button><button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="archived">Archive</button>`;
  else                   acts = `<button class="btn sm intake-act" data-id="${esc(i.id)}" data-to="new">Reopen</button>`;

  return `<details class="intake-card ${st}"${st === 'new' ? ' open' : ''}>
    <summary><span class="ava">${esc(initials(name))}</span><span class="i-name">${esc(name)}</span>${langPill}${progPill}<span class="i-when">${esc(timeAgo(i.created_at))}</span></summary>
    <div class="i-body"><div class="i-contact">${contactLine}</div>${qa}<div class="i-actions">${acts}</div></div>
  </details>`;
}

async function intakeSetStatus(id, to, btn) {
  if (btn) btn.disabled = true;
  if (!DEMO) {
    const { error } = await sb.rpc('set_intake_status', { p_id: id, p_status: to });
    if (error) { if (btn) btn.disabled = false; toast('Could not update — try Refresh'); return; }
  }
  const row = (S.intake || []).find(x => String(x.id) === String(id));
  if (row) row.status = to;
  renderIntake(); renderRail();
}

function renderIntake() {
  const all = (S.intake || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const g = { new: [], handled: [], archived: [] };
  all.forEach(i => (g[i.status] || g.new).push(i));

  let html = `<section class="panel"><div class="phead"><span class="t hd">New applications</span><span class="r">${g.new.length} waiting</span></div>`;
  html += g.new.length ? g.new.map(intakeCard).join('')
    : '<p class="empty">No new applications. When someone submits the apply form (English or Farsi), it lands here — and Amir still gets the Web3Forms email.</p>';
  html += `</section>`;
  if (g.handled.length) html += `<section class="panel" style="margin-top:16px"><div class="phead"><span class="t hd">Handled</span><span class="r">${g.handled.length}</span></div>${g.handled.map(intakeCard).join('')}</section>`;
  if (g.archived.length) html += `<section class="panel" style="margin-top:16px"><details><summary class="arch-toggle">Archived · ${g.archived.length}</summary><div style="margin-top:12px">${g.archived.map(intakeCard).join('')}</div></details></section>`;

  $('content').innerHTML = html;
  $('content').querySelectorAll('.copy-btn-js').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); copyText(btn.dataset.url, btn); }));
  $('content').querySelectorAll('.intake-act').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); intakeSetStatus(btn.dataset.id, btn.dataset.to, btn); }));
}

// --- auth + boot -------------------------------------------------------------
if (!DEMO && sb) {
  $('loginBtn').onclick = () =>
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href.split('#')[0] } });
  $('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
} else {
  $('logoutBtn').onclick = () => { location.search = ''; };
}

let booted = false, bootUser = null;
async function boot() {
  if (booted) return; booted = true;
  if (!DEMO && !sb) {
    $('gate').style.display = 'block';
    $('gateErr').textContent = 'The sign-in library did not load (the jsDelivr CDN is blocked or offline). Check the connection and reload.';
    $('loginBtn').disabled = true;
    return;
  }
  if (DEMO) {
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
    $('demoband').style.display = 'block';
    $('who').textContent = 'Demo';
    await loadAll();
    render();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { booted = false; return showGate(); }
  const email = (session.user.email || '').toLowerCase();
  if (email !== COACH_EMAIL.toLowerCase()) {
    await sb.auth.signOut();
    booted = false;
    return showGate('That account isn’t the coach account. Try again.');
  }
  bootUser = session.user.id;
  $('gate').style.display = 'none';
  $('app').style.display = 'block';
  $('who').textContent = session.user.email;
  try { await loadAll(); } catch (e) {
    $('content').innerHTML = `<p class="empty">Could not load the dashboard: ${esc(e.message)}</p>`; return;
  }
  render();
  // Server-scored levels fill in behind the first paint.
  loadLevels().then(() => { if (S.ready) render(); });
}
function showGate(err) { $('app').style.display = 'none'; $('gate').style.display = 'block'; $('gateErr').textContent = err || ''; }
// supabase-js fires an auth event on load, on every hourly token refresh, when the tab comes
// back into focus, and on a real sign-in or sign-out. This used to re-run boot() on ALL of them:
// three full loads on every open, and a full reload and repaint several times an hour that
// threw away an open exercise editor, a typed coach line, the open days and the place on the
// page. Now only a change of WHO is signed in rebuilds the page. setTimeout: calling supabase
// from inside this callback can deadlock its auth lock.
if (sb) sb.auth.onAuthStateChange((event, session) => {
  const uid = session && session.user ? session.user.id : null;
  if (!uid) {
    if (bootUser) { bootUser = null; booted = false; S.ready = false; showGate('You were signed out. Sign in again to carry on.'); }
    return;
  }
  if (booted && (bootUser === null || bootUser === uid)) return;   // booting now, or the same coach
  booted = false; S.ready = false;
  setTimeout(boot, 0);
});
boot();
