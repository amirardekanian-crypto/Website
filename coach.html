  if (c.repsPer) detail.push('reps: ' + esc(c.repsPer));
  // Each set coloured against the target exactly as the athlete's app shows it:
  // clay above the target (range), steel blue below, plain inside it. The mean
  // above keeps its RPE_OVER/UNDER threshold; a single set is shown as it was.
  if (c.rpePer && c.allSets > 1) detail.push('per set: ' + (c.rpeList || []).map(r => {
    const k = !c.tgt ? '' : r > c.tgt.hi ? 'over' : r < c.tgt.lo ? 'under' : '';
    return k ? `<b class="rpe-set ${k}">${esc(r)}</b>` : esc(r);
  }).join(' · '));
  if (c.logged.rounds) detail.push(esc(c.logged.rounds));
  if (c.logged.gear) detail.push(esc(c.logged.gear));
  return bits.join('') + (detail.length ? `<div class="did-detail">${detail.join(' · ')}</div>` : '');
}
function cmpRowHtml(c, lib, athleteId) {
  const rx = c.rx;
  const dose = rxLine(rx);
  // Circuits render from rounds/items rather than chips, so the chip editor
  // would have nothing to act on — they stay read-only until they get their own.
  const editable = !!(athleteId && c.path && c.pex && c.pex.type !== 'circuit');
  const eid = editable
    ? (athleteId + '_' + c.path.day + '_' + c.path.block + '_' + c.path.ex).replace(/[^a-z0-9]/gi, '_')
    : '';
  const warn = c.pex ? Chips.audit(c.pex).concat(Chips.auditRx(c.pex), Chips.auditPill(c.pex)) : [];
  const rxBits = [];
  if (dose) rxBits.push(`<span class="rx-dose">${esc(dose)}</span>`);
  if (rx.target) rxBits.push(`<span class="rx-rpe">RPE ${esc(rpeTarget(rx.target) ? rpeTarget(rx.target).label : rx.target.replace(/^@/, ''))}${
    c.tgt && c.tgt.written ? ` → ${esc(c.tgt.label)} ${c.tgtBy === 'week' ? 'that week' : 'that day'}` : ''}</span>`);
  const rxSub = [];
  if (rx.tempo) rxSub.push('tempo ' + esc(rx.tempo));
  (rx.extras || []).forEach(x => rxSub.push(esc(x.label)));
  // The pill (CHP-2), on the same line: a value on the list in its list spelling, one off the list in clay. A line of its
  // own would push the hover pencil (absolute, at the end of this cell) under the next row.
  if (rx.intent) rxSub.push(Chips.pillSplit(rx.intent).map(p => Chips.pillGroup(p)
    ? `<span class="rx-pill">${esc(Chips.pillCanon(p))}</span>`
    : `<span class="rx-pill off" title="Not on the pill list: open ✎ to move it to the note or drop it">${esc(p)}</span>`).join(' '));
  const v = c.pex ? vidUrl(c.pex, lib) : '';
  const items = (c.pex && c.pex.items && c.pex.items.length)
    ? c.pex.items.map(it => esc(it.name) + (it.detail ? ' (' + esc(it.detail) + ')' : '')).join(' · ')
    : (c.logged && c.logged.items.length ? c.logged.items.map(esc).join(' · ') : '');
  const tone = !c.logged ? 'miss' : c.state === 'skip' ? 'miss' : c.flags.some(f => f.tone === 'miss' || f.tone === 'warn') ? 'warn' : 'ok';
  return `<div class="cmp-row ${tone}">
    <div class="cmp-ex">
      <div class="cmp-nm">${esc(c.name)}${v ? ` <a class="cmp-vid" href="${esc(v)}" target="_blank" rel="noopener" title="Video">▶</a>` : ''}</div>
      ${items ? `<div class="cmp-items">${items}</div>` : ''}
      ${c.pex && c.pex.note ? `<div class="cmp-cnote"><b>Your note:</b> ${esc(c.pex.note)}</div>` : ''}
      ${c.logged && c.logged.note ? `<div class="cmp-anote" dir="auto"><b>They wrote:</b> ${esc(c.logged.note)}</div>` : ''}
    </div>
    <div class="cmp-rx">${rxBits.join('') || '<span class="did-none">—</span>'}
      ${rxSub.length ? `<div class="rx-sub">${rxSub.join(' · ')}</div>` : ''}
      ${editable ? `<button class="rx-edit" title="Edit this prescription"
        aria-label="Edit ${esc(c.pex.name || c.name)}" onclick="openExEditor(${jsq(athleteId)},${Number(c.path.day)},${c.path.block},${c.path.ex},'${eid}',${jsq(c.pex.name)})">✎</button>` : ''}
      ${warn.length ? `<div class="rx-warn" title="${esc(warn.map(w => w.msg).join('\n'))}">⚠ ${esc(warn.length)} chip issue${warn.length > 1 ? 's' : ''}</div>` : ''}
    </div>
    <div class="cmp-did">${cmpCell(c)}</div>
    <div class="cmp-flags">${c.flags.map(f => `<span class="fl ${f.tone === 'note' ? 'quiet' : f.tone}">${esc(f.text)}</span>`).join('')}</div>
    ${editable ? `<div class="rx-editor" id="exed-${eid}" style="display:none"></div>` : ''}
  </div>`;
}

/* ═══ PRESCRIPTION EDITOR ═══════════════════════════════════════════════════
   Edits go through real fields, and chips.js turns them back into correctly
   formatted labels — so the "12 each" green-pill bug cannot be typed into
   existence here. Saving writes the whole programme JSON to public.programs;
   the table's trigger keeps the previous version, which is what replaces git
   as the undo. Nothing here touches session_history: a past log records what
   was actually done and never moves when the prescription changes.
   ═══════════════════════════════════════════════════════════════════════════ */

// Locate an exercise from the path stamped on its comparison row.
function exAt(athleteId, dayId, blockIdx, exIdx) {
  const prog = S.programs[athleteId];
  const days = (prog && prog.workouts && prog.workouts.days) || [];
  const day  = days.find(d => Number(d.id) === Number(dayId));
  const blk  = day && (day.blocks || [])[blockIdx];
  const ex   = blk && (blk.exercises || [])[exIdx];
  return ex ? { prog, day, blk, ex } : null;
}

// "hands off the floor" -> "Hands off the floor." so an old grey line reads as a sentence in a note.
function asSentence(t) {
  t = String(t || '').trim();
  if (!t) return '';
  t = t.charAt(0).toUpperCase() + t.slice(1);
  return /[.!?]$/.test(t) ? t : t + '.';
}

// Typed values of open editors, by editor id: a re-render (a save elsewhere, a refresh,
// opening another day) redraws the row, and the coach's unsaved numbers must survive it.
const _exDrafts = {};
function exDraftFields(eid) {
  const out = {};
  ['exSets', 'exKind', 'exDose', 'exRpe', 'exTempo', 'exRest', 'exNote'].forEach(k => {
    const el = document.getElementById(k + '-' + eid); if (el) out[k] = el.value;
  });
  const side = document.getElementById('exSide-' + eid); if (side) out.exSide = side.checked;
  return out;
}
// Called after the athlete file is redrawn: reopen any editor that was open, with what was typed.
function restoreExDrafts() {
  Object.keys(_exDrafts).forEach(eid => {
    const d = _exDrafts[eid];
    const box = document.getElementById('exed-' + eid);
    if (!box || !d) return;
    openExEditor(d.athleteId, d.dayId, d.blockIdx, d.exIdx, eid, d.name, true);
    Object.keys(d.fields || {}).forEach(k => {
      const el = document.getElementById(k + '-' + eid); if (!el) return;
      if (k === 'exSide') el.checked = !!d.fields[k]; else el.value = d.fields[k];
    });
    paintPills(eid);
  });
}
document.addEventListener('input', ev => {
  const m = ev.target && ev.target.id && ev.target.id.match(/^ex(Sets|Kind|Dose|Rpe|Tempo|Rest|Note|Side)-(.+)$/);
  if (m && _exDrafts[m[2]]) _exDrafts[m[2]].fields = exDraftFields(m[2]);
  if (m && (m[1] === 'Rpe' || m[1] === 'Tempo') && _exDrafts[m[2]]) paintPills(m[2]);   // the hold and pace warnings read them
});
document.addEventListener('change', ev => {
  const m = ev.target && ev.target.id && ev.target.id.match(/^ex(Kind|Side)-(.+)$/);
  if (m && _exDrafts[m[2]]) _exDrafts[m[2]].fields = exDraftFields(m[2]);
});

// ── The pill picker (CHP-2, 2026-10-11) ─────────────────────────────────────────────────
// The card's `intent` from the closed list in chips.js (Chips.PILLS): at most two values, never two from one group. A tap
// puts a value on; a second tap takes it off; a value from a group already on takes its place. A value already on the card
// that is not on the list (an old pill: "3s eccentric", "glute focus") is shown in clay with two ways out: into the note,
// or dropped. Left alone it is kept, so nothing is lost, and check_program.py flags it. A new value joins the list only on
// Amir's word, so there is no box to type one.
const PILL_GROUP_NAME = { hands: 'Hands', lead: 'Lead side', intent: 'Intent', hold: 'Hold · tempo iso', brakes: 'Brakes', pace: 'Pace · no RPE' };
function pillWarnings(eid, vals) {
  const val = id => String((document.getElementById(id + '-' + eid) || {}).value || '').trim();
  const out = [], groups = {};
  vals.forEach(v => { const g = Chips.pillGroup(v); if (g) (groups[g] = groups[g] || []).push(v); });
  (groups.hold || []).forEach(v => { if (val('exTempo').toLowerCase() !== 'iso') out.push(`“${v}” needs Tempo iso: a hold is the tempo's Hold.`); });
  (groups.pace || []).forEach(v => { if (val('exRpe')) out.push(`“${v}” goes only on an item with no RPE: clear the RPE or take the pill off.`); });
  Object.keys(groups).forEach(g => { if (groups[g].length > 1) out.push(`Two from the ${(PILL_GROUP_NAME[g] || g).toLowerCase()} group (${groups[g].join(', ')}): keep one.`); });
  if (vals.length > 2) out.push(`${vals.length} pills: two at most.`);
  return out;
}
// Folded (round 3 of the coach UX pass, 2026-10-12): what is on the card shows as chips with a ✕ and one link, "Change pill" (or "Add a pill" when there is none);
// the six groups open only on that tap (`ppOpen` on the draft, so they stay open through a redraw of the screen while the editor is open). A value off the
// list is always in view, in clay, with its two ways out, and so are the warnings.
function pillPickHtml(eid) {
  const d = _exDrafts[eid] || {};
  const vals = d.pills || [];
  const open = !!d.ppOpen;
  const on = v => vals.some(x => x.toLowerCase() === v.toLowerCase());
  const warn = pillWarnings(eid, vals);
  const listed = vals.filter(v => Chips.pillGroup(v));
  return `<div class="pp-sel">${listed.map(v => `<span class="pp-chip">${esc(Chips.pillCanon(v))}<button type="button" class="pp-x" data-fk="x:${esc(v)}" data-v="${esc(v)}" aria-label="Take off ${esc(Chips.pillCanon(v))}" title="Take it off" onclick="pillPick('${eid}', this.dataset.v)">✕</button></span>`).join('')}${
      listed.length ? '' : '<span class="pp-none">No pill</span>'}<button type="button" class="pp-toggle" data-fk="toggle" aria-expanded="${open}" onclick="pillGroups('${eid}')">${open ? 'Done' : listed.length ? 'Change pill' : 'Add a pill'}</button></div>` +
    vals.filter(v => !Chips.pillGroup(v)).map(v => `<div class="pp-off">⚠ “${esc(v)}” is not on the pill list.
      <button type="button" class="btn sm" data-v="${esc(v)}" onclick="pillToNote('${eid}', this.dataset.v)">Move to the note</button>
      <button type="button" class="btn sm" data-v="${esc(v)}" onclick="pillDrop('${eid}', this.dataset.v)">Drop it</button></div>`).join('') +
    (warn.length ? `<div class="pp-note">${warn.map(w => '⚠ ' + esc(w)).join('<br>')}</div>` : '') +
    `<div class="pp-groups"${open ? '' : ' hidden'}>${Chips.PILL_GROUPS.map(g => `<div class="pp-grp"><span class="pp-g">${esc(PILL_GROUP_NAME[g] || g)}</span>${
      Chips.PILLS[g].map(v => `<button type="button" class="pp${on(v) ? ' on' : ''}" aria-pressed="${on(v)}" data-fk="p:${esc(v)}" data-v="${esc(v)}" onclick="pillPick('${eid}', this.dataset.v)">${esc(v)}</button>`).join('')}</div>`).join('')}</div>`;
}
// A repaint replaces the buttons, so the one that had the keyboard focus is found again by its data-fk (a ✕ that was just pressed is gone: the link takes it).
function paintPills(eid) {
  const box = document.getElementById('exPills-' + eid);
  if (!box) return;
  const ae = document.activeElement, fk = ae && box.contains(ae) ? ae.getAttribute('data-fk') : null;
  box.innerHTML = pillPickHtml(eid);
  if (fk) {
    const same = [...box.querySelectorAll('[data-fk]')].find(b => b.getAttribute('data-fk') === fk) || box.querySelector('[data-fk="toggle"]');
    if (same) same.focus();
  }
}
function pillGroups(eid) {
  const d = _exDrafts[eid];
  if (!d) return;
  d.ppOpen = !d.ppOpen;
  paintPills(eid);
}
function pillPick(eid, v) {
  const d = _exDrafts[eid];
  if (!d) return;
  const vals = d.pills || (d.pills = []);
  const i = vals.findIndex(x => x.toLowerCase() === v.toLowerCase());
  if (i >= 0) vals.splice(i, 1);
  else {
    const g = Chips.pillGroup(v), j = vals.findIndex(x => Chips.pillGroup(x) === g);
    if (j >= 0) vals.splice(j, 1, v);
    else if (vals.length >= 2) { toast('Two pills at most: take one off first'); return; }
    else vals.push(v);
  }
  paintPills(eid);
}
function pillDrop(eid, v) {
  const d = _exDrafts[eid];
  if (!d || !d.pills) return;
  d.pills = d.pills.filter(x => x !== v);
  paintPills(eid);
}
// An old pill that says something about this athlete goes to the end of the note, as a sentence.
function pillToNote(eid, v) {
  const note = document.getElementById('exNote-' + eid);
  if (note) {
    note.value = [note.value.trim(), asSentence(v)].filter(Boolean).join(' ');
    if (_exDrafts[eid]) _exDrafts[eid].fields = exDraftFields(eid);
  }
  pillDrop(eid, v);
}
window.pillPick = pillPick;
window.pillGroups = pillGroups;
window.pillDrop = pillDrop;
window.pillToNote = pillToNote;

// `expectName` is the exercise name the row showed. Positions (day, block, index) are only an
// address; the name is the check that the address still points at the exercise the coach chose.
function openExEditor(athleteId, dayId, blockIdx, exIdx, eid, expectName, reopen) {
  const box = document.getElementById('exed-' + eid);
  if (!box) return;
  if (!reopen && box.style.display === 'block') { box.style.display = 'none'; box.innerHTML = ''; delete _exDrafts[eid]; return; }

  const found = exAt(athleteId, dayId, blockIdx, exIdx);
  if (!found || (expectName != null && found.ex.name !== expectName)) {
    delete _exDrafts[eid];
    toast('That exercise has moved in the programme. Refreshing it.');
    reloadPrograms().then(render);
    return;
  }
  if (!_exDrafts[eid]) _exDrafts[eid] = { athleteId, dayId, blockIdx, exIdx, name: found.ex.name, fields: null, pills: null, ppOpen: false };
  // The pill as the card will be saved: an old card's chips fold in (toRx), old spellings become list values.
  if (!_exDrafts[eid].pills) _exDrafts[eid].pills = Chips.pillSplit(Chips.toRx(found.ex).intent);
  const r  = Chips.rxOf(found.ex);
  const st = {
    sets:  r.sets || '',
    dose:  r.dose ? r.dose.value : '',
    kind:  r.dose ? r.dose.kind  : 'reps',
    side:  !!(r.dose && r.dose.side),
    rpe:   r.rpe || '',
    tempo: r.tempo || '',
    restSec: r.rest || '',
    // NO SETUP BOX (Amir, 2026-09-25: "i dont like floating text", then "yes remove the setup box").
    // An old grey line is shown at the start of the note instead, and moves there on save.
    note:  [asSentence(r.setup), found.ex.note].filter(Boolean).join(' ')
  };
  const problems = Chips.audit(found.ex).concat(Chips.auditRx(found.ex));
  const f = (id, label, val, ph, w) =>
    `<label class="exf"><span>${label}</span>
       <input id="${id}-${eid}" value="${esc(val == null ? '' : val)}" placeholder="${esc(ph || '')}"
              style="width:${w || 68}px" autocomplete="off"></label>`;

  // The dose is ONE value plus what kind of thing it is, so a duration can never
  // again land in a cell labelled REPS. A field left blank is NOT PRESCRIBED, and
  // the app draws no cell for it — that is the whole contract of rx.
  const kindSel = `<label class="exf"><span>Dose</span>
      <select id="exKind-${eid}" style="width:96px">
        ${['reps','time','distance','work'].map(k =>
          `<option value="${k}"${st.kind === k ? ' selected' : ''}>${Chips.DOSE_LABEL[k]}</option>`).join('')}
      </select></label>`;
  const sideBox = `<label class="exf"><span>Per side</span>
      <input type="checkbox" id="exSide-${eid}"${st.side ? ' checked' : ''}></label>`;

  box.innerHTML = `
    <div class="exed-title">Editing <b>${esc(found.ex.name)}</b> · Day ${esc(dayId)}</div>
    <div class="exed-grid">
      ${f('exSets',  'Sets',  st.sets,  'e.g. 4')}
      ${kindSel}
      ${f('exDose',  'Value', st.dose,  'reps 8 · time 30s · distance 20m', 150)}
      ${sideBox}
      ${f('exRpe',   'RPE',   st.rpe,   '6–10')}
      ${f('exTempo', 'Tempo', st.tempo, '3-0-1-0 / iso', 108)}
      ${f('exRest',  'Rest',  st.restSec ? st.restSec + 's' : '', 'blank = none', 116)}
    </div>
    <div class="exf exf-wide"><span>Pill · what this athlete changes every rep · at most two, one per group</span>
      <div class="pillpick" id="exPills-${eid}">${pillPickHtml(eid)}</div></div>
    <label class="exf exf-wide"><span>Your note to them · about this athlete: start weight, limit, kit, fallback</span>
      <textarea id="exNote-${eid}" rows="2" placeholder="Optional. One to three short sentences, the point first">${esc(st.note)}</textarea>
    </label>
    ${r.setup ? `<div class="exed-mods">Its old grey line is now the start of your note, and moves there when you save.</div>` : ''}
    ${r.extras.length ? `<div class="exed-mods">Old chips on this card:
      ${r.extras.map(m => `<span class="fl">${esc(m.label)}</span>`).join('')} They are in the pill above now (one that only repeats the tempo is dropped), and move there when you save.</div>` : ''}
    ${problems.length ? `<div class="exed-warn">${problems.map(p => '⚠ ' + esc(p.msg)).join('<br>')}</div>` : ''}
    <div class="exed-acts">
      <button class="btn sm primary" onclick="saveExEditor(${jsq(athleteId)},${Number(dayId)},${blockIdx},${exIdx},'${eid}',${jsq(found.ex.name)}, this)">Save</button>
      <button class="btn sm quiet" onclick="openExEditor(${jsq(athleteId)},${Number(dayId)},${blockIdx},${exIdx},'${eid}',${jsq(found.ex.name)})">Cancel</button>
      <span class="exed-hint">Changes what they see next. Past logs are untouched.</span>
    </div>`;
  box.style.display = 'block';
  paintPills(eid);   // again, now the tempo and RPE boxes exist: the hold and pace warnings read them
}

// What the editor's fields say, checked against the rx contract (SCHEMA.md, PROGRAM-APP.md):
// one whole number of reps, a real duration for time, metres for distance, sets a whole number,
// RPE 6–10 or a 6–10 range. Returns { patch } or { error }.
function readExEditor(eid) {
  const val = id => String((document.getElementById(id + '-' + eid) || {}).value || '').trim();
  const kind = val('exKind') || 'reps';
  const dose = val('exDose'), sets = val('exSets'), rpe = val('exRpe'), tempo = val('exTempo'), restRaw = val('exRest');
  const num = v => /^\d+(\.\d+)?$/.test(v) ? Number(v) : v;   // the pipeline writes numbers; keep it that way
  if (sets && !/^[1-9]\d?$/.test(sets)) return { error: `Sets "${sets}" must be a whole number (1–99), or blank.` };
  if (dose) {
    if (kind === 'reps' && !/^\d{1,3}$/.test(dose))
      return { error: /\d\s*[-–]\s*\d/.test(dose)
        ? `Reps are one number, not a range ("${dose}"): write the one you mean.`
        : Chips.isPureDuration(dose) ? `"${dose}" is a time. Pick Time as the dose, then save.` : `Reps "${dose}" must be one whole number.` };
    if (kind === 'time' && !Chips.isPureDuration(dose)) return { error: `Time "${dose}" is not a duration I understand. Try 30s, 45 sec, 2 min or 1:30.` };
    if (kind === 'distance' && !/^\d+(\.\d+)?\s*(m|km|yd|yds|metres?|meters?)$/i.test(dose)) return { error: `Distance "${dose}" needs a unit: 20m, 400 m, 1 km.` };
  }
  if (rpe) {
    const m = rpe.match(/^(\d+(?:\.\d)?)(?:\s*[-–]\s*(\d+(?:\.\d)?))?$/);
    const ok = m && [m[1], m[2]].filter(Boolean).every(x => Number(x) >= 6 && Number(x) <= 10);
    if (!ok) return { error: `RPE "${rpe}" must be 6 to 10 (or a range like 7-8): the app's selector starts at 6, so anything else cannot be logged.` };
  }
  const restSec = restRaw ? Chips.parseDurationToSec(restRaw) : 0;
  if (restRaw && !restSec) return { error: `Rest "${restRaw}" is not a duration I understand. Try 90s, 2 min, or 1:30.` };
  const patch = { sets: sets ? Number(sets) : '', rpe: num(rpe), tempo, rest: restSec,
                  side: !!(document.getElementById('exSide-' + eid) || {}).checked };
  // The pill: the picker's values, one string joined by " · " (chips.js applyRx puts each in the list's spelling).
  const dr = _exDrafts[eid];
  if (dr && Array.isArray(dr.pills)) patch.intent = Chips.pillJoin(dr.pills);
  patch[kind] = kind === 'reps' ? num(dose) : dose;   // clears the other three doses
  const note = val('exNote');
  return { patch, kind, note };
}
function withEditedEx(ex, form) {
  // Saving an exercise that still carries chips[] also CONVERTS it: toRx() folds the old labels
  // into rx and keeps every leftover technique chip in the pill (`intent`), so an ordinary edit is
  // the migration and no chip is lost. From here the exercise has one source.
  const updated = Chips.applyRx(Chips.toRx(ex), form.patch);
  delete updated.setup;   // no floating text: openExEditor() put any old grey line in the note box
  if (form.kind !== (Chips.rxOf(ex).dose || {}).kind && updated.rx) delete updated.rx.label;
  if (form.note) updated.note = form.note; else delete updated.note;
  return updated;
}

async function saveExEditor(athleteId, dayId, blockIdx, exIdx, eid, expectName, btn) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (S.progSrc[athleteId] !== 'db') { fail('This athlete has no programme in the database, so there is nothing to edit.'); return; }
  const shown = exAt(athleteId, dayId, blockIdx, exIdx);
  if (!shown || shown.ex.name !== expectName) {
    delete _exDrafts[eid];
    await reloadPrograms(); render();
    fail('That exercise has moved in the programme since this page was drawn, so nothing was saved. The page now shows the live programme: open ✎ on the exercise again.');
    return;
  }
  const form = readExEditor(eid);
  if (form.error) { fail(form.error); return; }
  if (JSON.stringify(withEditedEx(shown.ex, form)) === JSON.stringify(shown.ex)) {
    delete _exDrafts[eid]; toast('No change to save'); renderDetailBody(); return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

    .eq('athlete_id', athleteId).eq('updated_at', live.data.updated_at)
    .select('athlete_id, updated_at, updated_by');
  if (!res.error && (!res.data || !res.data.length)) {

  if (DEMO) { box.innerHTML = '<p class="empty">Demo — the real page lists the saves from the previous cycle on here, each with Restore.</p>'; return; }
  const r = await sb.from('program_versions')
    .select('id, saved_at, saved_by')
    .eq('athlete_id', athleteId)
    .order('id', { ascending: false })

  const rows = r.data || [];

    ? `<p class="empty" style="padding:0 0 8px">Each line is the programme as it stood just before a save. <b>What this save changed</b> says, in words, what the save after it did to it. Restoring one puts it back; the current version is kept here too, so a restore can itself be undone. Kept: the last 20 saves, and every save since the previous cycle began (never more than 150).</p>` +
      rows.map((v, i) => `<div class="pvrow">

// --- the session-report email, read back into a session -----------------------
// The page no longer offers it (the "+ Add past session from email" box was removed on 2026-10-12; Amir: "i will never do
// that manually"). It stays here as the ONE reader of the report's format, held to the app's writer by scripts/check_twins.js
// and scripts/test_coach_compare.js, and used by scripts/restore/sessions_from_email.js when a session must be put back from
// an email. Not called by the page.
function parseSessionEmail(text) {
  const t = String(text || '').replace(/\r/g, '');
  const fs = t.indexOf('Full summary');
  let summary = (fs >= 0 ? t.slice(fs + 'Full summary'.length) : t).replace(/^\s*\n/, '').trim();
  if (summary.indexOf('Exercise log:') < 0 && t.indexOf('Exercise log:') >= 0) summary = t.trim();
  const firstLine = (summary.split('\n')[0] || '');
  const dm = firstLine.match(/Day\s+(\d+)\s*[—–-]?\s*(.*)$/) || t.match(/Day\s+(\d+)\s*[—–-]?\s*([^\n]*)/);
  const day = dm ? Number(dm[1]) : null;
  const focus = dm && dm[2] ? dm[2].trim() : '';
  const grab = re => { const m = t.match(re); return m ? m[1].trim() : ''; };
  const status = grab(/Status:?\s*\n?\s*([^\n]+)/) || 'Complete';
  const rpeM = t.match(/Session RPE:?\s*\n?\s*(\d+(?:\.\d+)?)/i);
  const durM = t.match(/Duration:?\s*\n?\s*(\d+)/i);
  // The whole note, every line of it (the summary holds it between "Notes from athlete:" and the
  // exercise log); the email's own field holds only its first line in some mail clients.
  const nb = t.match(/Notes from athlete:\s*\n([\s\S]*?)\n\s*\n\s*Exercise log:/);
  let note = nb ? nb[1].trim() : (grab(/Notes from athlete\s*\n\s*([^\n]+)/) || grab(/Notes from athlete:\s*\n\s*([^\n]+)/));
  if (/^\(?none\)?$/i.test(note)) note = '';
  const who = grab(/^\s*Athlete:?[ \t]*\n?[ \t]*([^\n]+)/m);
  let readiness = null;
  const oneLine = t.match(/Composite\s+([\d.]+)\/5\s*·\s*Sleep\s+(\d+)\s*·\s*Energy\s+(\d+)\s*·\s*Soreness\s+(\d+)\s*·\s*Stress\s+(\d+)\s*·\s*Overall\s+(\d+)/i);
  if (oneLine) {
    readiness = { composite: Number(oneLine[1]), sleep: +oneLine[2], energy: +oneLine[3], soreness: +oneLine[4], stress: +oneLine[5], overall: +oneLine[6] };
  } else if (/Readiness[^\n]*skipped/i.test(t)) {
    readiness = { skipped: true };
  } else {
    const comp = t.match(/composite\s+([\d.]+)\/5/i);
    const q = (re) => { const m = t.match(re); return m ? +m[1] : null; };
    const sleep = q(/sleep last night:?\s*(\d+)/i), energy = q(/energy levels[^:]*:?\s*(\d+)/i),
          soreness = q(/sore[^:]*:?\s*(\d+)/i), stress = q(/stress[^:]*:?\s*(\d+)/i), overall = q(/ready do you feel:?\s*(\d+)/i);
    if (comp || sleep || energy || soreness || stress || overall) {
      readiness = { composite: comp ? Number(comp[1]) : null, sleep, energy, soreness, stress, overall };
    }
  }
  // What the check-in decided for the day (REC-2), when the email says: stored the way the app stores it so
  // the work tab judges the imported session on the day's real targets and "run of low days" counts it.
  if (readiness && !readiness.skipped) {
    const plan = parseCheckinPlan(t);
    if (plan) {
      const four = [readiness.sleep, readiness.energy, readiness.stress, readiness.overall].map(Number);
      Object.assign(readiness, plan, four.every(x => x >= 1 && x <= 5) ? { score: Math.round(four.reduce((a, b) => a + b, 0) / 4 * 100) / 100 } : {});
    }
  }
  return { day, focus, status, session_rpe: rpeM ? rpeM[1] : '', duration_min: durM ? durM[1] : '', readiness, day_note: note, summary, who };
}
// The check-in's verdict, from the words program.html's readinessPlanLine() writes: "Today: lower day (every RPE 1
// lower, never below 6) · sore: jumps and landings halved — trained as written by choice". The email carries it twice:
// on the Readiness field, after the answers ("Composite 3.5/5 · Sleep 3 · … · Overall 3 · lower day …"), and as a
// "Today:" line at the end of the readiness block of the full summary. It is only written when the day was lower or
// short or the athlete was sore, so no line means a normal day OR an email from before 2026-09-26: the two cannot be
// told apart, so this returns null and the import stores no verdict (never a guessed "normal day").
// Returns { level, sore, drop, asWritten } as the app stores it, or null. `base` (the athlete's usual) is not in the email.
// ⚠ ANCHORED on purpose: the words must follow the whole answers line, or sit in the readiness block itself. An
// athlete's own note ("Today: short day (only 40 min)", "Overall 8, lower day (poor sleep)") must never set a level.
function parseCheckinPlan(text) {
  const t = String(text || '').replace(/\r/g, '');
  const WORDS = '(?=short\\s+day\\s*\\(|lower\\s+day\\s*\\(|sore:\\s*jumps\\s+and\\s+landings\\s+(?:halved|skipped))';
  const m = new RegExp(
    '(?:Composite\\s+[\\d.]+/5\\s*·\\s*Sleep\\s+\\d+\\s*·\\s*Energy\\s+\\d+\\s*·\\s*Soreness\\s+\\d+\\s*·\\s*Stress\\s+\\d+\\s*·\\s*Overall\\s+\\d+\\s*·\\s*' +
    '|Readiness \\(at start\\)[^\\n]*(?:\\n[ \\t]*\\S[^\\n]*){1,8}?\\n[ \\t]*Today:[ \\t]*)' + WORDS).exec(t);
  if (!m) return null;
  // The rest of that line, plus a wrapped continuation, up to the next blank line: a mail client may break it.
  let win = t.slice(m.index + m[0].length, m.index + m[0].length + 300);
  const blank = win.search(/\n[ \t]*\n/);
  if (blank >= 0) win = win.slice(0, blank);
  win = win.replace(/\s+/g, ' ');
  // Exactly the words the app writes (case and all). Short/lower day are the first words after the separator, so
  // only the head is read for them. scripts/check_twins.js runs the app's real writer through this.
  const head = win.slice(0, 12);
  const red = /^short day/.test(head), amber = !red && /^lower day/.test(head);
  const sore = /sore:\s*jumps and landings skipped/.test(win) ? 'skip' : /sore:\s*jumps and landings halved/.test(win) ? 'half' : '';
  if (!red && !amber && !sore) return null;
  return { level: red ? 'red' : amber ? 'amber' : 'green', sore, drop: red || amber ? 1 : 0, asWritten: /trained as written by choice/.test(win) };
}

// --- hide a session, and the deletes (ported; coach-only via RLS) -----------------------------------
// A finished session is HIDDEN, not deleted (stage60, audit FILE-11 and ROSTER-9; Amir 2026-10-11: "hide it, keep it recoverable"). A hard delete left the
// report's `_sent_dN` mark in the athlete's progress, so the roster warned "session not synced" for ever, and their phone could send the session again
// and bring it back. Now the row stays, marked hidden: every reader leaves it out, the phone cannot un-hide it, and the athlete's File lists it with
// Restore. One coach-only function does both directions and says how many rows it changed.
function hideFailed(res, verb) {
  if (res.error) {
    const m = res.error.message || '';
    // A database error code means the server answered; no code means the answer never arrived, so the page cannot say whether it went through.
    if (!res.error.code) return `the answer never arrived (${m || 'no reply'}), so the page cannot tell whether it went through. Refresh and look at their File.`;
    if (/Could not find the function|PGRST202/i.test(m + res.error.code)) return 'the server does not have coach_hide_session yet (supabase/stage60_hide_sessions.sql has not been applied).';
    if (/coach only|permission denied|JWT/i.test(m)) return 'your sign-in may have lapsed. Refresh, sign in again if asked, and redo it.';
    return m;
  }
  if (!res.data || !res.data.changed) return verb === 'hide' ? 'the server found no visible session for that day. Refresh and look again.' : 'that session is not hidden any more. Refresh and look again.';
  return '';
}

  const bad = hideFailed(res, 'hide');

  await refetch(['hist']);

async function deleteAthleteNow(athleteId) {
  const name = nameOf(athleteId);

  // It used to be two deletes from this page, and a failure between them left one gone and one standing.

  // turn into "0 rows, no error") is an error or a zero, never a success.
  const res = await sb.rpc('coach_delete_training_history', { p_athlete_id: athleteId });

    // A database error code means the server answered, and an error rolls the whole call back. No code means the answer
    // never arrived (a dropped connection): the delete may have gone through, so say that instead of "nothing was removed".
    if (!res.error.code) {
      fail(`The answer never arrived (${m || 'no reply'}), so the page cannot tell whether ${name}'s training history was deleted.\n\nRefresh and open their File to see; delete again only if it is still there.`);

      : m) + '\n\nNothing was removed: both parts are one step, so a failure undoes it all.');
    return;

  const d = res.data || {}, nS = Number(d.sessions) || 0, nP = Number(d.progress) || 0;

  if (!nS && !nP && had) { fail('Nothing was deleted: the server removed no rows although the dashboard lists some. Refresh and try again.'); hardRefresh(); return; }
  toast(`Deleted ${nS} session${nS === 1 ? '' : 's'}${nP ? ' and the app data' : ''}`);
  hardRefresh();
}

// --- ERASE a whole person (stage54, 2026-10-11) -------------------------------------------------------------------------
// coach_erase_person(kind, key, confirm, intake_ids, dry_run): one call, one transaction. The panel first asks for a DRY RUN
// (the server does exactly the work of a real erasure and undoes it, so the numbers shown are the numbers that would go),
// lists what goes and what stays, and the real run needs the id (athlete) or username (buyer) typed. An inline panel, not a
// native dialog: the list is long and a phone clips a dialog. The server also refuses the demo, the board identity, the
// coach's own login and a login shared by two accounts, and undoes everything when a table it does not know still holds a row.
let _erase = null;   // { kind, key, status: 'loading' | 'ready' | 'busy' | 'error', pv, err, typed, picked: [intake ids] }
const ERASE_KIND = { athlete: 'Athlete', course: 'Course buyer', testing: 'Testing-app buyer' };
// [one, many] for each table the server reports; a table it reports that is not here is shown by its own name.
const ERASE_WHAT = {
  session_history: ['finished session', 'finished sessions'], athlete_progress: ['app data record (personal records, body weight, check-ins)', 'app data records'],
  hab_notes: ['roll-call line', 'roll-call lines'], hab_titles: ['title', 'titles'], hab_season_results: ['season result', 'season results'],
  leaderboard_optin: ['board place', 'board places'], library_sessions: ['library session done', 'library sessions done'],
  messages: ['old message', 'old messages'], call_logs: ['call log', 'call logs'], cycle_reports: ['cycle report', 'cycle reports'],
  coaching_log_versions: ['earlier coaching-log text', 'earlier coaching-log texts'], coaching_logs: ['coaching log', 'coaching logs'],
  program_versions: ['saved programme version', 'saved programme versions'], programs: ['programme', 'programmes'],
  athlete_keys: ['old access key', 'old access keys'], hab_contacts: ['contact record (email, WhatsApp)', 'contact records'],
  athlete_identities: ['login', 'logins'], hab_intake: ['intake form', 'intake forms'], auth_users: ['sign-in account', 'sign-in accounts'],
  tps_accounts: ['course login', 'course logins'], assess_accounts: ['testing-app login', 'testing-app logins'],
  assess_players: ['player', 'players'], assess_notes: ['player note', 'player notes'], assess_results: ['test result', 'test results'],
  buyer_notes: ['note of yours about them', 'notes of yours about them'],
  athlete_status: ['paused or former mark', 'paused or former marks'],
};
// A "backup.<table>" key is a rollback copy the pipeline made before a one-off change to live programmes (backup.onename_2026_10_09 today).
const ERASE_ROLLBACK = ['saved rollback copy of their data', 'saved rollback copies of their data'];
function eraseWhat(k, n) { const w = ERASE_WHAT[k] || (/^backup\./.test(k) ? ERASE_ROLLBACK : null); return w ? (Number(n) === 1 ? w[0] : w[1]) : k; }
function eraseCountLines(counts) {
  return Object.keys(counts || {}).filter(k => Number(counts[k]) > 0)
    .map(k => `<li><b>${Number(counts[k]).toLocaleString()}</b> ${esc(eraseWhat(k, counts[k]))}</li>`).join('');
}
// ── intake forms (athletes only) ────────────────────────────────────────────────────────────────────────────────────────
// The server OFFERS the forms that carry the athlete's email, WhatsApp number or full name (pv.intake_candidates). Most forms cannot
// be tied to an athlete that way (the Farsi names against Latin programme names; no email or number stored for most athletes), so
// the coach can also look for any form here (Amir, 2026-10-11: "pick any form in the Erase panel") and tick the ones that are

const AFF_FIELDS = [

function affIg(handle) {
  const h = String(handle || '').trim().replace(/^@/, '');

}
// Intakes that used a code: the typed "Discount Code", or the "Discount Applied"
// the form fills in once the code checks out (e.g. "NAME10 (10% off)").
// A code as people type it on a phone: spaces anywhere, Persian or Arabic digits, any case.
function normCode(v) {
  return String(v || '').replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660)).replace(/\s+/g, '').toUpperCase();
}
// Applications that used the code (typed, or approved on the form). These are APPLICATIONS, not
// paying clients: nothing here knows who paid, so the card says so. Archived ones (spam, not a fit)
// are left out of the count.
function affUses(code) {
  return (S.intake || []).filter(i => {
    if ((i.status || 'new') === 'archived') return false;
    const p = i.payload || {};
    const typed = normCode(intakeVal(p['Discount Code']));
    const applied = normCode(intakeVal(p['Discount Applied']).trim().split(' ')[0]);
    return typed === code || applied === code;
  });
}

    ? `<button class="btn sm danger aff-retire" data-code="${esc(a.code)}">Retire code</button>`
    : `<button class="btn sm aff-reactivate" data-code="${esc(a.code)}">Reactivate</button>`);

  return `<details class="intake-card${a.active ? '' : ' archived'}"${editing ? ' open' : ''}>
    <summary><span class="aff-code">${esc(a.code)}</span><span class="i-name">${who}</span>${pills}<span class="i-when">${when}</span></summary>
    <div class="i-body">${editing ? affForm(a)
      : `<div class="i-contact">${contactLine}</div>${table}${usedBy}<div class="i-actions">${acts}</div>`}</div>
  </details>`;
}

// PostgREST answers an update that RLS filtered out with success and zero rows,
// so every write asks for the row back and treats "nothing came back" as failure.
async function affWrite(q) {
  const { data, error } = await q.select('code');
  if (error) return error.message;
  if (!data || !data.length) return 'nothing was saved (signed in as the coach?)';
  return null;
}

async function affSave(formEl, btn) {
  const isNew = formEl.dataset.new === '1';
  const row = {};
  formEl.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    let val = String(el.value || '').trim();
    if (k === 'code') val = val.toUpperCase();
    row[k] = val === '' ? null : (k === 'percent' ? Number(val) : val);
  });
  if (!row.code || !/^[A-Z0-9]{2,32}$/.test(row.code)) { toast('Code must be 2–32 letters or digits, no spaces'); return; }
  if (!Number.isInteger(row.percent) || row.percent < 1 || row.percent > 90) { toast('% off must be a whole number from 1 to 90'); return; }
  if (isNew && (S.affiliates || []).some(x => x.code === row.code)) { toast(row.code + ' already exists — edit that one instead'); return; }
  if (btn) btn.disabled = true;
  const code = row.code;
  const patch = Object.assign({}, row); delete patch.code;
  if (DEMO) {
    if (isNew) (S.affiliates = S.affiliates || []).push(Object.assign({ active: true, retired_on: null }, row));
    else Object.assign((S.affiliates || []).find(x => x.code === code) || {}, patch);
  } else {
    const err = await affWrite(isNew ? sb.from('affiliates').insert(row) : sb.from('affiliates').update(patch).eq('code', code));
    if (err) { if (btn) btn.disabled = false; fail('Could not save — ' + err); return; }
  }
  _affEditing = null;
  toast(DEMO ? 'Demo mode — nothing saved' : (isNew ? code + ' is live on both apply forms' : 'Saved'));
  if (DEMO) renderAffiliates(); else await refetch(['affiliates']);
}

async function affSetActive(code, active, btn) {
  if (!active && !confirm(`Retire ${code}?\n\nIt stops working on both apply forms straight away. The row stays, so its history and the intakes that used it are kept.`)) return;
  const patch = active ? { active: true, retired_on: null } : { active: false, retired_on: todayKey() };
  if (btn) btn.disabled = true;
  if (DEMO) {
    Object.assign((S.affiliates || []).find(x => x.code === code) || {}, patch);
  } else {
    const err = await affWrite(sb.from('affiliates').update(patch).eq('code', code));
    if (err) { if (btn) btn.disabled = false; fail('Could not update — ' + err); return; }
  }
  toast(DEMO ? 'Demo mode — nothing saved' : (active ? code + ' is live again' : code + ' retired'));
  if (DEMO) renderAffiliates(); else await refetch(['affiliates']);
}

// The referral codes view as one piece of HTML (Leads → Referral codes, round 2 of the UX pass, 2026-10-12), as intakeViewHtml() is for the applications:
// put it anywhere, then wireAffiliates(the element with id affView). Nothing in here reads $('content').
function affiliatesViewHtml() {
  const all = (S.affiliates || []).slice().sort((a, b) =>
    String(b.applied_on || '').localeCompare(String(a.applied_on || '')) || String(a.code).localeCompare(String(b.code)));
  const live = all.filter(a => a.active), retired = all.filter(a => !a.active);
  const orphans = live.filter(a => !a.coach_name && !a.coach_name_fa).length;

  let html = `<div id="affView"><div class="controls">
      <button class="btn primary sm" id="affAdd">+ Add code</button>
      <span class="empty" data-hint="aff" style="align-self:center">Both apply forms accept these. Changes are live at once.</span>
    </div>`;
  if (_affEditing === '__new__') html += `<section class="panel gap-bottom"><div class="phead"><span class="t hd">New code</span></div>${affForm(null)}</section>`;
  html += `<section class="panel"><div class="phead"><span class="t hd">Live codes</span><span class="r">${live.length} live${orphans ? ` · <span class="t-clay">${orphans} with no owner</span>` : ''}</span></div>`;
  html += live.length ? live.map(affCard).join('')
    : '<p class="empty">No live codes. When you accept a coach from partner-fa.html, add their code here.</p>';
  html += `<p class="psub" data-hint="aff-deal" style="margin:12px 0 0">The coach earns 10% of what the client pays.</p>
    ${howFold('how-aff', ['These are the codes both apply forms accept. Add or retire one and it takes effect straight away — no deploy.', 'The deal: the client gets the code\'s % off; the coach earns 10% of what the client actually pays — first payment and every renewal. Payout details stay in the application email (Gmail, subject:(Affiliate)).'])}</section>`;
  if (retired.length) {
    const openRetired = retired.some(a => a.code === _affEditing) ? ' open' : '';
    html += `<section class="panel gap-top"><details${openRetired}><summary class="arch-toggle">Retired · ${retired.length}</summary><div style="margin-top:12px">${retired.map(affCard).join('')}</div></details></section>`;
  }
  return html + '</div>';
}
// Wire everything inside root (the #affView element, or anything that holds it). Safe to call again on a fresh copy of the HTML.
function wireAffiliates(root) {
  if (!root) return;
  const on = (sel, fn) => root.querySelectorAll(sel).forEach(el => el.addEventListener('click', e => { e.preventDefault(); fn(el); }));
  on('.copy-btn-js', el => copyText(el.dataset.url, el));
  on('#affAdd', () => { _affEditing = '__new__'; renderAffiliates(); });
  on('.aff-edit', el => { _affEditing = el.dataset.code; renderAffiliates(); });
  on('.aff-cancel', () => { _affEditing = null; renderAffiliates(); });
  on('.aff-save', el => affSave(el.closest('.aff-form'), el));
  on('.aff-retire', el => affSetActive(el.dataset.code, false, el));
  on('.aff-reactivate', el => affSetActive(el.dataset.code, true, el));
}
// A redraw of the codes view that is on the page: it replaces #affView only (so it does nothing if the coach has gone to another screen while a save
// was out), and does not replay the panels' entrance. Edit, Cancel, Add and a demo-mode save call this.
function renderAffiliates() {
  const old = $('affView');
  if (!old) return;
  $('content').classList.add('no-anim');
  const tmp = document.createElement('div');
  tmp.innerHTML = affiliatesViewHtml();
  const nv = tmp.firstElementChild;
  old.replaceWith(nv);
  wireAffiliates(nv);
}

// --- BUYER LOGINS: the testing app and the course (one block, built twice: audit MKT-6, 2026-10-11; it was two copies that had drifted) ----------------
// Same pattern as athlete logins: an Edge Function (assess-login, tps-login) makes the auth user on an internal address (assess.<username>@ or
// tps.<username>@amirardekani.com, never read) and hands back a password to send. Revoke bans the login: the testing app keeps the buyer's saved
// players and results, the course app deletes the handbook from their phone the next time it opens online. Restore brings the login back with a new
// password. Buyer data itself is not readable from here, by design ("we don't monitor"); the course stores nothing about buyers.
// Backend: supabase/assess_01_accounts_content_data.sql + supabase/functions/assess-login (the testing app, /tennis-testing/app/, its source is
// tennis-testing/app/ in this repo; /tennis-testing/ is the product page), and supabase/tps_01_accounts_content.sql + supabase/functions/tps-login
// (the Tennis Performance System course app, /tennis/app/, its source is tennis/app/ in this repo).
const ASSESS_URL = SITE + '/tennis-testing/app/';
const COURSE_URL = SITE + '/tennis/app/';

// The note about a buyer ("who bought it") lives in buyer_notes since stage53: the account row's own label is always empty
// now, so a buyer reading their own row no longer sees what Amir wrote. Until that stage is applied the note is still the
// label. A table that is not there yet is expected and quiet; any other failed read leaves the label in place AND is named by the
// "Not everything loaded" banner (it used to show every buyer with no note, silently).
async function loadBuyerNotes() {
  const r = await selectAll('buyer_notes', 'user_id, note', ['user_id']);
  if (r.error) {
    // Before stage53 the table does not exist and the note is still the account's label: not a failure. Any other error is named by the banner.
    const missing = /^(42P01|PGRST205)$/.test(String(r.error.code || '')) || /does not exist|Could not find the table/i.test(r.error.message || '');
    LOAD_ERR.buyerNotes = missing ? '' : (r.error.message || 'unreadable');
    return null;
  }
  LOAD_ERR.buyerNotes = '';
  return Object.fromEntries((r.data || []).map(x => [x.user_id, x.note]));
}
function withBuyerNotes(rows, notes) {
  return (rows || []).map(x => Object.assign({}, x, { label: (notes && notes[x.user_id]) || x.label || '' }));
}

// cfg: key (S[key] and LOAD_ERR[key]), kind (what usedMark() and the Erase panel call it), P (the two-letter prefix of its ids and classes), table, fn
// (the Edge Function), noun (for the error line), demo (the one row demo mode shows), message(username, password) (the Farsi WhatsApp text),
// revokeConfirm(username), introHtml (the full intro, kept in the How this works fold), introShort (the one visible line), newNote. Everything else is the same for both.
function buyerLogins(cfg) {
  const { key, kind, P, table, fn } = cfg;
  // busy: one call at a time (a double tap would be a second one); pw: the username whose password form is open (Change password or Restore);
  // manage: the username whose Manage row is open (Change password, Revoke, Erase…). One at a time, kept here so it survives a redraw.
  const st = { busy: false, pw: null, manage: null };

  async function load() {
    if (DEMO) { S[key] = S[key] || [Object.assign({ created_at: new Date().toISOString(), sent_at: null, revoked_at: null }, cfg.demo)]; return; }
    const [r, notes] = await Promise.all([
      sb.from(table).select('user_id, username, label, created_at, initial_password, password_set_at, sent_at, revoked_at').order('created_at', { ascending: false }),
      loadBuyerNotes()]);
    // A failed read stays "unknown" (null + the error), never an empty list that reads "No logins yet".
    LOAD_ERR[key] = r.error ? r.error.message : '';
    S[key] = r.error ? null : withBuyerNotes(r.data, notes);
  }

  // password: one Amir typed (already checked by typedPassword), or '' to have the function generate one.
  async function action(act, username, label, btn, password) {
    if (DEMO) { toast('Demo mode — nothing saved'); return; }
    if (st.busy) return;
    if (act === 'revoke' && !confirm(cfg.revokeConfirm(username))) return;
    st.busy = true; if (btn) btn.disabled = true;
    const { data, error } = await sb.functions.invoke(fn, { body: { action: act, username, label, password: password || undefined } });
    st.busy = false; if (btn) btn.disabled = false;
    let msg = data && data.error;
    if (!msg && error) { try { msg = (await error.context.json()).error; } catch (e) { msg = error.message; } }
    if (msg) { fail('Could not ' + act + ' the login:\n\n' + msg); return; }
    st.pw = null; st.manage = null;
    await load();
    if (act === 'revoke') { toast(username + ' revoked'); render(); return; }
    copyText(cfg.message(data.username, data.password), null, true);
    render();
    // Like an athlete's login: the message is on the clipboard and the password waits in the list (Copy, Mark sent) until they sign in with
    // it, so a toast is enough. Only when the server could not store the password is this the one place it is shown.
    const what = (data.created ? 'Login created' : act === 'restore' ? 'Login restored' : password ? 'Password changed' : 'New password') + ' for ' + data.username;
    if (data.warning) notice(what, 'Password: ' + data.password + '\n\nThe Farsi WhatsApp message is copied to your clipboard.\n\n⚠ ' + data.warning, { copy: data.password, warn: true });
    else toast(what + ' — the message is copied; send it on WhatsApp');
  }

  async function markSent(username) {
    if (DEMO) { toast('Demo mode — nothing saved'); return; }
    if (!confirm(`Mark ${username}'s login as sent?\n\nThis clears the stored password: after this the only way to see one again is a reset. Do it once the message has reached them.`)) return;
    const res = await sb.from(table).update({ initial_password: null, sent_at: new Date().toISOString() }).eq('username', username).select('username');
    const bad = writeFailed(res, 'marked sent');
    if (bad) { fail('Could not update: ' + bad); return; }
    await load();
    render();
  }

  // box: the element to draw into (Buyers → this tab's body, #buyersBody). Without one it is that body if it is on the page AND is this block's, so a redraw that
  // comes back after a call (a login created, a list loaded) does nothing when the coach has gone to the other tab or another screen meanwhile.
  function render(box) {
    const c = box || $('buyersBody');
    if (!c || c.dataset.buyer !== key) return;
    if (!S[key] && LOAD_ERR[key]) {
      c.innerHTML = `<section class="panel"><p class="empty t-clay">The ${cfg.noun} did not load: ${esc(LOAD_ERR[key])}. Nothing here can be changed until they do.</p>
        <button class="btn sm" onclick="LOAD_ERR.${key}='';${cfg.loadFn}().then(${cfg.renderFn})">↻ Try again</button></section>`;
      return;
    }
    if (!S[key]) {
      c.innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
      load().then(() => render());
      return;
    }
    const rows = S[key];
    const active = rows.filter(r => !r.revoked_at), revoked = rows.filter(r => r.revoked_at);
    const toSend = active.filter(r => r.initial_password).length;
    const day = d => esc(String(d || '').slice(0, 10));
    // Manage holds what is done now and then (Change password, Revoke, Erase…). It is open when it was opened, and while the password form or the
    // Erase panel it led to is open, so the button that opened them stays in view.
    const manageOpen = u => st.manage === u || st.pw === u || !!(_erase && _erase.kind === kind && _erase.key === u);
    const row = r => `<div class="credrow buyer">
      <span class="credname">${esc(r.username)}${r.label ? ` <span class="muted">· ${esc(r.label)}</span>` : ''}</span>
      ${r.initial_password && !r.revoked_at ? `<code class="credpass">${esc(r.initial_password)}</code>${usedMark(kind, r.username)}`
        : `<span class="muted credstate">${r.revoked_at ? 'revoked ' + day(r.revoked_at) : r.sent_at ? 'sent ' + day(r.sent_at) : 'created ' + day(r.created_at)}</span>`}
      <span class="acts">${r.revoked_at
        ? `<button class="btn sm ${P}-pw" data-u="${esc(r.username)}">Restore</button>`
        : (r.initial_password ? `<button class="btn sm primary ${P}-copy" data-u="${esc(r.username)}">Copy message</button><button class="btn sm ${P}-sent" data-u="${esc(r.username)}">Mark sent</button>` : '')}<button class="btn sm ${P}-manage" data-u="${esc(r.username)}" aria-expanded="${manageOpen(r.username)}">Manage</button></span>
      ${manageOpen(r.username) ? `<div class="credmore">${r.revoked_at ? ''
        : `<button class="btn sm ${P}-pw" data-u="${esc(r.username)}">Change password</button><button class="btn sm danger ${P}-act" data-act="revoke" data-u="${esc(r.username)}">Revoke</button>`}<button class="btn sm danger ${P}-erase" data-u="${esc(r.username)}" title="Remove this buyer and everything they stored, for good">Erase…</button></div>` : ''}
    </div>` + (st.pw === r.username ? `<div class="pwform">
      <input class="pwin ${P}-pwin" aria-label="Password (empty to generate one)" placeholder="${r.revoked_at ? 'password' : 'new password'}, or empty to generate one" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button class="btn sm primary ${P}-pwsave" data-act="${r.revoked_at ? 'restore' : 'reset'}" data-u="${esc(r.username)}">${r.revoked_at ? 'Restore' : 'Save password'}</button>
      <button class="btn sm quiet ${P}-pwcancel">Cancel</button>
      <p class="pwhint">${PW_HINT}${r.revoked_at ? '' : ' The old password stops working straight away.'}</p>
    </div>` : '') + erasePanelHtml(kind, r.username);
    let html = `<div class="controls"><span class="empty" data-hint="buyers" style="align-self:center">${cfg.introShort}</span></div>`;
    html += `<section class="panel gap-bottom"><div class="phead"><span class="t hd">New login</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="${P}User" aria-label="Username" placeholder="username: a-z, 0-9, _" autocomplete="off" autocapitalize="none" spellcheck="false" class="pwin">
      <input id="${P}Label" aria-label="Private note for you" placeholder="private note for you: who bought it" autocomplete="off" class="pwin">
      <input id="${P}Pass" aria-label="Password (empty to generate one)" placeholder="password, or empty to generate one" autocomplete="off" autocapitalize="none" spellcheck="false" class="pwin pw-secret">
      <button class="btn primary sm" id="${P}Create">Create login</button>
    </div>
    <p class="psub" data-hint="buyers-new" style="margin:12px 0 0">Creates the login and copies the Farsi WhatsApp message.</p>
    ${howFold('how-buyers', [cfg.introHtml, `${cfg.newNote} ${PW_HINT}`])}</section>`;
    html += `<section class="panel"><div class="phead"><span class="t hd">Logins</span><span class="r">${active.length} active${toSend ? ` · <span class="t-clay">${toSend} to send</span>` : ''}</span></div>` +
      (active.length ? active.map(row).join('') : '<p class="empty">No logins yet.</p>') + `</section>`;
    if (revoked.length) html += `<section class="panel gap-top"><details${revoked.some(r => manageOpen(r.username)) ? ' open' : ''}><summary class="arch-toggle">Revoked · ${revoked.length}</summary><div style="margin-top:12px">${revoked.map(row).join('')}</div></details></section>`;
    c.innerHTML = html;
    const on = (sel, fn2) => c.querySelectorAll(sel).forEach(el => el.addEventListener('click', e => { e.preventDefault(); fn2(el); }));
    on('#' + P + 'Create', el => {
      const u = ($(P + 'User').value || '').trim().toLowerCase();
      if (!/^[a-z0-9_]{3,32}$/.test(u)) { toast('Username: 3 to 32 characters, a-z, 0-9 or _'); return; }
      const t = typedPassword($(P + 'Pass').value, u);
      if (t.error) { fail(t.error); return; }
      action('create', u, ($(P + 'Label').value || '').trim(), el, t.password);
    });
    on('.' + P + '-act', el => action(el.dataset.act, el.dataset.u, '', el));
    on('.' + P + '-pw', el => { st.pw = el.dataset.u; render(); const i = c.querySelector('.' + P + '-pwin'); if (i) i.focus(); });
    on('.' + P + '-pwcancel', () => { st.pw = null; render(); });
    on('.' + P + '-manage', el => {
      const u = el.dataset.u;
      if (manageOpen(u)) {   // closing it also closes what it opened: the password form, and an Erase panel that has not started
        st.manage = null; if (st.pw === u) st.pw = null;
        if (_erase && _erase.kind === kind && _erase.key === u && _erase.status !== 'busy') _erase = null;
      } else st.manage = u;
      render();
      const again = [...c.querySelectorAll('.' + P + '-manage')].find(x => x.dataset.u === u);   // the page was redrawn: keep the keyboard on the button
      if (again) again.focus();
    });
    on('.' + P + '-pwsave', el => {
      const t = typedPassword(c.querySelector('.' + P + '-pwin').value, el.dataset.u);
      if (t.error) { fail(t.error); return; }
      action(el.dataset.act, el.dataset.u, '', el, t.password);
    });
    const pwIn = c.querySelector('.' + P + '-pwin');
    if (pwIn) pwIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); c.querySelector('.' + P + '-pwsave').click(); } });
    on('.' + P + '-sent', el => markSent(el.dataset.u));
    on('.' + P + '-erase', el => eraseOpen(kind, el.dataset.u));
    on('.' + P + '-copy', el => {
      const r = rows.find(x => x.username === el.dataset.u);
      if (r && r.initial_password) { copyText(cfg.message(r.username, r.initial_password), el, true); toast('Message copied — paste it into WhatsApp'); }
    });
    buyersBarRefresh();   // the sub-tab's count of active logins follows a create, a revoke and a restore
  }
  return { load, render, action, markSent, st };
}

// --- BUYERS (round 2 of the UX pass, 2026-10-12): the Course and the Testing app were two tabs; they are one place with two sub-tabs, styled like the athlete
// file's (.subrail / .stab). #buyers is the Course, #buyers/testing the Testing app; each sub-tab's count is its active logins. The block above draws into
// #buyersBody; the other sub-tab's list is read in the background so both counts show.
function buyersBarHtml(sub) {
  return `<div class="subrail buy-subrail" data-sub="${esc(sub)}" role="navigation" aria-label="Buyers">${BUYER_TABS.map(t => {
    const rows = S[t.key], n = rows ? rows.filter(r => !r.revoked_at).length : 0;
    const on = (sub || '') === t.sub;
    return `<a class="stab${on ? ' active' : ''}"${on ? ' aria-current="page"' : ''} href="#buyers${t.sub ? '/' + t.sub : ''}">${t.label}${rows ? `<span class="n quiet" title="${n} active login${n === 1 ? '' : 's'}">${n}</span>` : ''}</a>`;
  }).join('')}</div>`;
}
function buyersBarRefresh() {
  const bar = document.querySelector('.buy-subrail');
  if (!bar) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = buyersBarHtml(bar.dataset.sub);
  bar.replaceWith(tmp.firstElementChild);
}
const _buyerWarm = {};
function buyersWarm(current) {
  BUYER_TABS.forEach(t => {
    if (t.key === current || S[t.key] || LOAD_ERR[t.key] || _buyerWarm[t.key]) return;
    _buyerWarm[t.key] = true;
    BUYER[t.key].load().then(() => { _buyerWarm[t.key] = false; buyersBarRefresh(); paintLoadWarn(); });
  });
}
function renderBuyers() {
  const sub = route().sub || '';
  const tab = BUYER_TABS.find(t => t.sub === sub) || BUYER_TABS[0];
  const c = $('content');
  const prev = c.querySelector('.buy-subrail');
  c.classList.toggle('no-anim', !!prev && prev.dataset.sub === sub);   // a redraw of the sub-tab already showing does not replay the entrance
  c.innerHTML = buyersBarHtml(sub) + `<div id="buyersBody" data-buyer="${tab.key}"></div>`;
  BUYER[tab.key].render($('buyersBody'));
  buyersWarm(tab.key);
}

// --- INTAKE (coaching apply-form submissions) -------------------------------
// form.html / form-fa.html write here via submit_intake(); Amir reads them here.
// The Web3Forms email still fires too — this table is the durable copy so a
// relay outage can't lose a lead. Backend: supabase/stage27_intake.sql.
const INTAKE_SKIP = new Set(['First Name', 'Last Name', 'Email', 'Contact (Instagram/WhatsApp)', 'Programme',
                             'botcheck', 'access_key', 'from_name', 'subject', 'redirect']);
function intakeName(i) {
  const p = i.payload || {};
  return (i.name && i.name.trim()) || [p['First Name'], p['Last Name']].filter(Boolean).join(' ').trim() || 'Unnamed';
}
function intakeVal(v, fa) { return Array.isArray(v) ? v.join(fa ? '\u060C ' : ', ') : String(v == null ? '' : v); }
const RTL_RE = /[\u0600-\u06FF]/;
// A wa.me link only for something that IS a phone number. The intake field is "Contact
// (Instagram/WhatsApp)", and the old version kept whatever digits it found, so "@sara_1990" became
// wa.me/1990 and "sara.k99@gmail.com" wa.me/99: a tap opened a stranger's chat.
// Persian and Arabic digits count (a number typed on a Persian keyboard), 00 and + mean a country
// code follows, an Iranian 09… (or 9… with ten digits, or +98 0…) becomes 989…, and a number that
// still starts with a trunk 0 or is not 8-15 digits long gets no link (copy it instead).
function waLink(num) {
  let t = String(num || '').replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x06F0))
    .replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x0660)).trim();
  if (!t) return '';
  if (/[^0-9+\s().\-\u200c\u200e\u200f]/.test(t)) {
    // Words around a number ("09121234567 WhatsApp") keep the number; a handle or an email never
    // has a run of ten digits, and anything with an @ is never read as a number.
    const run = !/@/.test(t) && t.match(/\+?\d[\d\s().\-]{8,}\d/);
    if (!run || run[0].replace(/\D/g, '').length < 10) return '';
    t = run[0];
  }
  const plus = /^\+/.test(t);
  let d = t.replace(/[^0-9]/g, '');
  if (!plus && /^00/.test(d)) d = d.slice(2);
  else if (!plus && /^09\d{9}$/.test(d)) d = '98' + d.slice(1);
  else if (!plus && /^9\d{9}$/.test(d)) d = '98' + d;
  if (/^980\d{10}$/.test(d)) d = '98' + d.slice(3);
  if (/^0/.test(d) || d.length < 8 || d.length > 15) return '';
  return 'https://wa.me/' + d;
}

// What became of an application (stage61, audit FLOW-17 and SPINE-11; Amir: "link an application to the athlete it became, and let Handled record an
// outcome"). The server keeps the same six; only 'client' and 'free' keep an athlete.
const INTAKE_OUTCOMES = [['client', 'Became a client'], ['free', 'Joined the free tracker'], ['not_a_fit', 'Not a fit'], ['no_reply', 'No reply'], ['declined', 'Said no'], ['other', 'Something else']];
const intakeOutcomeLabel = k => (INTAKE_OUTCOMES.find(o => o[0] === k) || [k, k])[1];
const intakeKeepsAthlete = k => k === 'client' || k === 'free';
// The last 9 digits of a number, Persian and Arabic-Indic digits folded: the same comparison coach_erase_person() makes.
const last9 = v => { const d = String(v == null ? '' : v).replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x06F0)).replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x0660)).replace(/\D/g, ''); return d.length >= 9 ? d.slice(-9) : ''; };
// The athletes an application may have become: everyone on the roster except the demo and the dashboard's own identity, by name.
function intakeAthletes() {
  return Object.values(S.ath || {}).filter(a => !SYSTEM_IDS.includes(a.id) && a.id !== AMIR_ATHLETE_ID)
    .sort((x, y) => String(x.name).localeCompare(String(y.name)) || String(x.id).localeCompare(String(y.id)));
}
// The one athlete this application most likely became: the same email or WhatsApp number on their contact record, or the same full name.
// Only when exactly one fits; the coach still picks.
function intakeGuess(i) {
  const em = String(i.email || '').trim().toLowerCase(), ph = last9(i.contact), nm = intakeName(i).trim().toLowerCase().replace(/\s+/g, ' ');
  const hits = intakeAthletes().filter(a => {

    return (em && String(c.email || '').trim().toLowerCase() === em) || (ph && last9(c.whatsapp) === ph) || (nm && nm !== 'unnamed' && String(a.name || '').trim().toLowerCase().replace(/\s+/g, ' ') === nm);
  });
  return hits.length === 1 ? hits[0].id : '';
}
// The closing row of an application (round 2 of the coach UX pass, 2026-10-12; Amir: the outcome is the main way to close one, Mark handled stays as a

// The questionnaire as a definition grid: each question and its answer side by side in one cell pair, two pairs to a row on a wide screen. An answer

function intakeViewHtml() {
  const all = (S.intake || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const g = { new: [], handled: [], archived: [] };
  all.forEach(i => g[intakeGroupOf(i)].push(i));
  if (_intakeSel && !all.some(i => String(i.id) === _intakeSel)) _intakeSel = '';
  if (!_intakeSel && g.new.length) _intakeSel = String(g.new[0].id);       // the newest new one, else nothing
  const cur = all.find(i => String(i.id) === _intakeSel) || null;
  if (!cur) _intakeOpen = false;

  if (!all.length) {

  }
  const rows = items => items.map(i => intakeRowHtml(i, cur && String(i.id) === _intakeSel)).join('');
  let list = `<h3 class="in-gh${g.new.length ? ' hot' : ''}">New · ${g.new.length}</h3>` +

  if (g.handled.length) list += `<h3 class="in-gh">Handled · ${g.handled.length}</h3>${rows(g.handled)}`;
  if (g.archived.length) list += `<details class="in-arch"${_intakeArch ? ' open' : ''}><summary class="in-gh arch-toggle">Archived · ${g.archived.length}</summary>${rows(g.archived)}</details>`;

// Wire everything inside root (the #inView element, or anything that holds it). Safe to call again on a fresh copy of the HTML.
function wireIntake(root) {
  if (!root) return;
  root.querySelectorAll('.copy-btn-js').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); copyText(btn.dataset.url, btn); }));
  root.querySelectorAll('.intake-act').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); intakeSetStatus(btn.dataset.id, btn.dataset.to, btn); }));
  root.querySelectorAll('.i-out-sel').forEach(sel => sel.addEventListener('change', () => { const w = sel.closest('.i-outcome').querySelector('.i-who'); if (w) w.hidden = !intakeKeepsAthlete(sel.value); }));
  root.querySelectorAll('.intake-outcome-save').forEach(btn => btn.addEventListener('click', (e) => { e.preventDefault(); intakeSaveOutcome(btn); }));
  root.querySelectorAll('.in-row').forEach(btn => btn.addEventListener('click', () => intakePick(btn.dataset.id)));
  root.querySelectorAll('.in-back').forEach(btn => btn.addEventListener('click', intakeBack));
  root.querySelectorAll('.in-arch').forEach(d => d.addEventListener('toggle', () => { _intakeArch = d.open; }));
  // the chosen row stays in view in the list (on a wide screen the list scrolls by itself)
  const list = root.querySelector('.in-list'), on = list && list.querySelector('.in-row.on');
  if (list && on && list.scrollHeight > list.clientHeight) {
    if (on.offsetTop < list.scrollTop) list.scrollTop = on.offsetTop - 8;
    else if (on.offsetTop + on.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = on.offsetTop + on.offsetHeight - list.clientHeight + 8;
  }
}
// A redraw of the Intake view that is already on the page: it replaces #inView only (so it does nothing if the coach has gone to another tab while a
// save was out), keeps the list where it was scrolled, and does not replay the panels' entrance.
function intakeRedraw(focusSel) {
  const old = $('inView');
  if (!old) return;
  const list = old.querySelector('.in-list'), y = list ? list.scrollTop : 0;
  $('content').classList.add('no-anim');
  const tmp = document.createElement('div');
  tmp.innerHTML = intakeViewHtml();
  const nv = tmp.firstElementChild;
  old.replaceWith(nv);
  const nl = nv.querySelector('.in-list');
  if (nl) nl.scrollTop = y;
  wireIntake(nv);
  const f = focusSel && nv.querySelector(focusSel);
  if (f && f.offsetParent !== null) f.focus({ preventScroll: true });
}
function intakePick(id) {
  if (String(id) === _intakeSel && _intakeOpen) return;
  const narrow = !window.matchMedia('(min-width: 1000px)').matches;
  if (narrow) _intakeListY = window.scrollY;
  _intakeSel = String(id); _intakeOpen = true; _intakeTouched = true;
  intakeRedraw(narrow ? '.in-back' : '.in-row.on');
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function intakeBack() {
  _intakeOpen = false;
  intakeRedraw('.in-row.on');
  window.scrollTo({ top: _intakeListY, behavior: 'instant' });
}

async function intakeSetStatus(id, to, btn) {
  if (btn) btn.disabled = true;
  if (!DEMO) {
    const { error } = await sb.rpc('set_intake_status', { p_id: id, p_status: to });
    if (error) { if (btn) btn.disabled = false; fail('Could not update — try Refresh'); return; }
  }
  const row = (S.intake || []).find(x => String(x.id) === String(id));
  if (row) { row.status = to; row.handled_at = to === 'new' ? null : (row.handled_at || new Date().toISOString()); }   // the server stamps handled_at the first time it leaves new
  intakeRedraw('.in-title'); renderRail();
}

async function intakeSaveOutcome(btn) {
  const box = btn.closest('.i-outcome'), id = box.dataset.id;
  const outcome = box.querySelector('.i-out-sel').value || null;
  const athlete = intakeKeepsAthlete(outcome) ? (box.querySelector('.i-ath-sel').value || null) : null;
  if (outcome === 'client' && !athlete) { fail('Pick the athlete this application became.'); return; }
  if (!DEMO) {
    btn.disabled = true;
    const res = await sb.rpc('set_intake_outcome', { p_id: id, p_outcome: outcome, p_athlete_id: athlete });
    if (res.error) {
      btn.disabled = false;
      const m = res.error.message || '';
      fail('Could not save the outcome: ' + (/Could not find the function|PGRST202/i.test(m + (res.error.code || '')) ? 'the server does not have set_intake_outcome yet (supabase/stage61_intake_outcome.sql has not been applied).' : m));
      return;
    }
  }
  const row = (S.intake || []).find(x => String(x.id) === String(id));
  if (row) {
    row.linked_at = !athlete ? null : (row.athlete_id === athlete ? row.linked_at : new Date().toISOString());
    row.outcome = outcome; row.athlete_id = athlete;
    if (outcome && (row.status || 'new') === 'new') { row.status = 'handled'; row.handled_at = new Date().toISOString(); }
  }
  invalidateDetail();       // the athlete's File says where they came from
  intakeRedraw('.in-title'); renderRail();
  toast(outcome ? 'Outcome saved' : 'Outcome cleared');
}

// --- auth + boot -------------------------------------------------------------
if (!DEMO && sb) {
  $('loginBtn').onclick = () =>
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href.split('#')[0] } });
  $('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
} else {
  $('logoutBtn').onclick = () => { location.search = ''; };
}

let booted = false, bootUser = null;
async function boot() {
  if (booted) return; booted = true;
  if (!DEMO && !sb) {
    $('gate').style.display = 'block';
    $('gateErr').textContent = 'The sign-in library did not load (the jsDelivr CDN is blocked or offline). Check the connection and reload.';
    $('loginBtn').disabled = true;
    return;
  }
  if (DEMO) {
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
    $('demoband').style.display = 'block';
    $('who').textContent = 'Demo';
    await loadAll();
    render();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { booted = false; return showGate(); }
  const email = (session.user.email || '').toLowerCase();
  if (email !== COACH_EMAIL.toLowerCase()) {
    await sb.auth.signOut();
    booted = false;
    return showGate('That account isn’t the coach account. Try again.');
  }
  bootUser = session.user.id;
  $('gate').style.display = 'none';
  $('app').style.display = 'block';
  $('who').textContent = session.user.email;
  try { await loadAll(); } catch (e) {
    $('content').innerHTML = `<p class="empty">Could not load the dashboard: ${esc(e.message)}</p>`; return;
  }
  render();
  // Server-scored levels fill in behind the first paint.
  loadLevels().then(() => { if (S.ready) paintLevels(); });
}
function showGate(err) { failDismissAll(); $('app').style.display = 'none'; $('gate').style.display = 'block'; $('gateErr').textContent = err || ''; }
// supabase-js fires an auth event on load, on every hourly token refresh, when the tab comes
// back into focus, and on a real sign-in or sign-out. This used to re-run boot() on ALL of them:
// three full loads on every open, and a full reload and repaint several times an hour that
// threw away an open exercise editor, a typed coach line, the open days and the place on the
// page. Now only a change of WHO is signed in rebuilds the page. setTimeout: calling supabase
// from inside this callback can deadlock its auth lock.
if (sb) sb.auth.onAuthStateChange((event, session) => {
  const uid = session && session.user ? session.user.id : null;
  if (!uid) {
    if (bootUser) { bootUser = null; booted = false; S.ready = false; showGate('You were signed out. Sign in again to carry on.'); }
    return;
  }
  if (booted && (bootUser === null || bootUser === uid)) return;   // booting now, or the same coach
  booted = false; S.ready = false;
  setTimeout(boot, 0);
});
boot();
