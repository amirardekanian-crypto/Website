// Bulk version of athleteLoginAction — same Edge Function, action:'create_many'
// instead of one 'create' per athlete. Nothing new to build for distribution:
// every password lands in athlete_identities same as a single create, so the
// existing "Logins to send" panel picks all of them up automatically.
async function bulkCreateLogins() {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (loginsUnknown()) return;
  const ids = athletesNeedingLogin();
  if (!ids.length) return;
  if (!confirm(
    `Create logins for ${ids.length} athlete${ids.length === 1 ? '' : 's'}?\n\n${ids.join(', ')}\n\n` +
    'Each gets a new username/password, ready to copy under "Logins to send".'
  )) return;
  const { data, error } = await sb.functions.invoke('athlete-login', {
    body: { action: 'create_many', athlete_ids: ids },
  });
  if (error || (data && data.error)) {
    fail('Could not create logins:\n\n' + ((data && data.error) || error.message));
    return;
  }
  await loadLogins();
  const failed = data.failed || [];
  _credsOpen = true;
  render();
  // Failures are named, not left in the console where nobody looks.
  const why = f => (f && (f.athlete_id || f.id) ? (f.athlete_id || f.id) + ': ' + (f.error || f.message || 'failed') : String(f));
  const skipped = data.skipped || [];   // already had a login: left exactly as it was
  if (failed.length || skipped.length) alert(`${data.created} login${data.created === 1 ? '' : 's'} created.` +
    (skipped.length ? `\n\nAlready had a login, left as it was: ${skipped.join(', ')}` : '') +
    (failed.length ? `\n\n${failed.length} failed:\n` + failed.map(why).join('\n') : ''));
  else toast(`${data.created} login${data.created === 1 ? '' : 's'} created — copy & send from "Logins to send" below`);
}
window.bulkCreateLogins = bulkCreateLogins;

/* ═══ BACKUP ════════════════════════════════════════════════════════════════
   The Supabase project is on the free plan, which takes NO automatic backups.
   378 session logs and every athlete's progress blob exist in exactly one place;
   programmes at least also sit in git history and a local folder, but the training
   record does not. If the project were deleted tomorrow, this file is the only
   thing that would bring it back.

   Runs entirely in Amir's signed-in session — RLS decides what it can read, so
   there is no service key anywhere. Download it weekly and keep it off this PC too.
   Keep only the LAST 12 (Amir, 2026-10-04, "rolling"): the privacy notice promises that a
   deleted record leaves the backups within about three months, so delete older files on
   both copies. scripts/prune_backups.py lists them.
   ═══════════════════════════════════════════════════════════════════════════ */
// ⚠️ This list must hold EVERY table in the public schema. A backup that
// silently misses one is worse than no backup, because you only find out on the
// day you need it. Check it against:
//   select tablename from pg_tables where schemaname = 'public' order by 1;
// and remember that a table with RLS on and no coach policy reads back as zero
// rows rather than an error — hab_season_results did exactly that until
// 2026-09-12, and it is the one table nothing else could rebuild.
// 2026-10-05: 13 of the 35 tables were missing from this list. Added: the course lessons
// (tps_content, course_en), the exercise library (exercises, exercise_coach, qualities), the
// testing app's content and accounts (assess_content, assess_accounts) and tps_accounts.
// Left out on purpose: assess_publish_keys and tps_publish_keys (hashes of revoked keys).
// 2026-10-11 (stage50, Amir's yes): assess_players, assess_notes and assess_results are in too. They are a buyer's own
// players (name, birth year and month, sex, hand, squad), notes and test results; only the member who owns them could
// read them, so before stage50 the coach read ZERO rows and a backup would have looked fine while empty. The coach now
// has a read-only policy on each (no write), so the dashboard still cannot change a buyer's data.
// hab_season_results got its SELECT grant in stage46 (2026-10-10); coaching_log_versions (stage47)
// is every earlier text of a coaching log, kept by a trigger. spine_versions (stage49) is the same for the
// Spine: every row of exercises, exercise_coach and qualities as it was before a change, deletes included.
// 2026-10-11: buyer_notes (stage53) is the private note about each buyer, moved out of the buyer's reach; erasure_log
// (stage54) is the receipt of every full erasure (a hash, the counts, no personal data). A restore from an old backup
// brings erased people back: hash each restored id and check it against the receipts (stage54's header says how).
const BACKUP_TABLES = [
  'programs', 'program_versions', 'coaching_logs', 'athlete_identities',
  'athlete_progress', 'session_history', 'messages', 'hab_notes', 'hab_contacts',
  'hab_titles', 'hab_intake', 'leaderboard_optin', 'seasons', 'xp_rules',
  'call_logs', 'cycle_reports', 'hab_season_results', 'athlete_keys',
  'library', 'library_categories', 'library_sessions',
  'affiliates',
  'tps_content', 'course_en', 'tps_accounts', 'assess_content', 'assess_accounts',
  'assess_players', 'assess_notes', 'assess_results',
  'exercises', 'exercise_coach', 'qualities', 'coaching_log_versions', 'spine_versions',
  'buyer_notes', 'erasure_log',
];

const PASSWORD_TABLES = ['athlete_identities', 'tps_accounts', 'assess_accounts'];
// Only a COMPLETE backup counts as the weekly one. An incomplete one (a table could not be read, or came back short) is saved
// under another name and is not a restore point, so it must not silence the weekly reminder either (audit TOOLS-3, pile B2).
const LAST_BACKUP_KEY = 'coach_last_backup';
const LAST_BAD_BACKUP_KEY = 'coach_last_backup_incomplete';
function lastBackupAt() { try { return localStorage.getItem(LAST_BACKUP_KEY) || ''; } catch (e) { return ''; } }
// The latest INCOMPLETE try, only while it is newer than the last good backup (a good one after it clears the memory of it).
function lastBadBackupAt() {
  try { const bad = localStorage.getItem(LAST_BAD_BACKUP_KEY) || '', ok = lastBackupAt(); return bad && (!ok || bad > ok) ? bad : ''; } catch (e) { return ''; }
}
async function downloadBackup(btn) {
  if (DEMO) { toast('Demo mode — nothing to back up'); return; }
  const label = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Backing up…'; }

  const out = {
    exported_at: new Date().toISOString(),
    project: SB_URL,
    note: 'Export of the rows of every table in BACKUP_TABLES, taken from the coach dashboard: data only, no ' +
          'schema, functions or policies (those are in supabase/*.sql). See "could_not_read" for anything that could not be read. ' +
          'A restore is not a plain import: login tables point at auth users that must exist first. ' +
          'Unsent login passwords (initial_password) are blanked on purpose: reset a login to issue a new one. ' +
          'Keep the last 12 weekly files only (python scripts/prune_backups.py <folder>). ' +
          'A file named aa-backup-INCOMPLETE-<date>.json (complete: false, with "could_not_read") is NOT a restore point.',
    tables: {},
  };
  const problems = [];

  for (const t of BACKUP_TABLES) {
    // Paged in key order (selectAll), so no row is skipped or repeated between pages.
    const r = await selectAll(t, '*');
    if (r.error) { problems.push(t + ': ' + r.error.message); continue; }
    let rows = r.data;
    if (r.short) problems.push(`${t}: only ${rows.length} of ${r.total} rows came back`);
    // Login passwords are kept only until the coach sends them (Logins to send). A backup file
    // sits on a PC and a second drive for three months; it never needs them, because restoring
    // an account means a new password anyway. They are blanked here, not in the database.
    if (PASSWORD_TABLES.includes(t)) rows = rows.map(x => ('initial_password' in x) ? Object.assign({}, x, { initial_password: null }) : x);
    out.tables[t] = rows;
  }

  const counts = Object.entries(out.tables).map(([t, r]) => `${t}: ${r.length}`);
  out.row_counts = Object.fromEntries(Object.entries(out.tables).map(([t, r]) => [t, r.length]));
  const incomplete = problems.length > 0;
  out.complete = !incomplete;
  if (incomplete) out.could_not_read = problems;

  // The name says what the file is: an incomplete one must never sit among the weekly files looking like a restore point,
  // and scripts/prune_backups.py reads the name to keep it out of the 12 it keeps.
  const stamp = new Date().toISOString().slice(0, 10);
  const fileName = `aa-backup-${incomplete ? 'INCOMPLETE-' : ''}${stamp}.json`;
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);

  if (btn) { btn.disabled = false; btn.textContent = label; }
  // A complete backup is "the last backup"; an incomplete one is remembered separately, so the reminder keeps asking.
  try { localStorage.setItem(incomplete ? LAST_BAD_BACKUP_KEY : LAST_BACKUP_KEY, new Date().toISOString()); } catch (e) {}
  const total = Object.values(out.tables).reduce((s, r) => s + r.length, 0);
  alert((incomplete
        ? `⚠ INCOMPLETE backup — saved as ${fileName}.\n\nIt is NOT a restore point and does not count as this week's backup: some tables could not be read, so a restore from it would be missing data. Fix what is listed below, then take the backup again, and delete this file.\n\n`
        : '') +
        `Backup downloaded — ${total} rows across ${Object.keys(out.tables).length} tables.\n\n` +
        counts.join('\n') +
        (incomplete ? '\n\n⚠ INCOMPLETE — could not read everything:\n' + problems.join('\n') : '') +
        '\n\nKeep a copy somewhere that is not this computer.' +
        '\n\nKeep only the last 12 weekly backups, on both, and delete older ones: the privacy notice promises a deleted record leaves the backups within about three months.');
}

// Add coaching logs from .md files, ONLY for athletes who have none on the server yet.
// Since 2026-09-07 the server copy is the record: publish_cycle() splices into it and /cycle-report
// appends its Debrief there, so a local .md is always older. This used to replace the server log
// wholesale (no history, no warning), wiping every Debrief written since. It now never overwrites.
function pickCoachingLogs() {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (LOAD_ERR.clogs) { fail('The list of coaching logs did not load, so I cannot tell which athletes already have one. Tap ↻ Refresh first.'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.md,text/markdown';
  input.multiple = true;
  input.onchange = async () => {
    const files = [...(input.files || [])].filter(f => /\.md$/i.test(f.name) && !/^README/i.test(f.name));
    if (!files.length) { fail('No .md files selected.'); return; }
    const rows = [], skipped = [], kept = [];
    for (const f of files) {
      const id = f.name.replace(/\.md$/i, '');
      if (!/^[A-Za-z0-9_]+$/.test(id) || !S.ath[id]) { skipped.push(f.name + ' (no athlete with that id)'); continue; }
      if ((S.clogs || {})[id]) { kept.push(id); continue; }
      rows.push({ athlete_id: id, body: await f.text() });
    }
    if (!rows.length) {
      alert('Nothing to add.' + (kept.length ? `\n\nAlready on the server (left exactly as they are):\n${kept.join(', ')}` : '') +
            (skipped.length ? `\n\nSkipped:\n${skipped.join('\n')}` : ''));
      return;
    }
    if (!confirm(`Add ${rows.length} new coaching log(s)?\n\n${rows.map(r => r.athlete_id).join(', ')}\n\n` +
                 'They become coach-only records on the server.' +
                 (kept.length ? `\n\n${kept.length} athlete(s) already have one on the server; those are NOT touched: ${kept.join(', ')}` : ''))) return;
    const failed = [];
    for (let i = 0; i < rows.length; i += 10) {
      const slice = rows.slice(i, i + 10);
      // ignoreDuplicates: insert only. If a log appeared on the server meanwhile, it wins.
      const { error } = await sb.from('coaching_logs').upsert(slice, { onConflict: 'athlete_id', ignoreDuplicates: true });
      if (error) slice.forEach(r => failed.push(r.athlete_id + ': ' + error.message));
    }
    await loadCoachingLogs();
    render();
    alert(`Added ${rows.length - failed.length} of ${rows.length}.` +
          (skipped.length ? `\n\nSkipped:\n` + skipped.join('\n') : '') +
          (failed.length ? `\n\nFailed:\n` + failed.join('\n') : ''));
  };
  input.click();
}

async function loadCoachingLogs() {
  const r = await sb.from('coaching_logs').select('athlete_id, updated_at');
  LOAD_ERR.clogs = r.error ? r.error.message : '';
  if (r.error) return;
  S.clogs = {};
  (r.data || []).forEach(row => { S.clogs[row.athlete_id] = row; });
}

// Loaded on demand — a coaching log is long prose and there is no reason to pull
// 28 of them on every dashboard boot.
async function openCoachingLog(athleteId) {
  const box = $('clog-body');
  if (!box) return;
  if (DEMO) { box.textContent = 'Demo — no coaching log.'; return; }
  box.textContent = 'Loading…';
  const { data, error } = await sb.from('coaching_logs')
    .select('body, updated_at').eq('athlete_id', athleteId).maybeSingle();
  if (error) { box.textContent = 'Could not load: ' + error.message; return; }
  box.textContent = data ? data.body : 'No coaching log for this athlete yet.';

// Publish a workout or article into the Library.
//
// The /workout and /article skills still write the JSON; this is how it goes live.
// There is no manifest to update any more — the category comes from the file's own
// `category` field and the card details are read off the item itself, which is what
// used to make adding a workout a two-file job.
function pickLibraryFile(kind) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (LOAD_ERR.library) { fail('The library did not load (' + LOAD_ERR.library + '), so nothing can be published: its categories are unknown. Tap ↻ Refresh first.'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.multiple = true;
  input.onchange = async () => {
    const files = [...(input.files || [])];
    if (!files.length) return;

    const rows = [], bad = [];
    for (const f of files) {
      let d;
      try { d = JSON.parse(await f.text()); }
      catch (e) { bad.push(f.name + ': not valid JSON'); continue; }
      const id  = String(d.id || '').trim();
      const cat = String(d.category || '').trim();
      // A Farsi translation is a web page source, never an app article: if one carried id and
      // category it would overwrite the English article for every athlete (CLAUDE.md).
      if (/\.fa\.json$/i.test(f.name) || d.lang === 'fa' || d.sourceHash || d.translationOf) {
        bad.push(f.name + ': a Farsi translation (.fa.json) — it builds the website page, it never goes in the app'); continue;
      }
      const looksWorkout = 'countsAs' in d || 'focusTag' in d || 'duration' in d;
      if (kind === 'article' && looksWorkout) { bad.push(f.name + ': this is a workout file — use + Publish workout'); continue; }
      if (kind === 'workout' && !looksWorkout && ('readMins' in d || 'date' in d)) { bad.push(f.name + ': this is an article file — use + Publish article'); continue; }
      if (!id)  { bad.push(f.name + ': no "id" field'); continue; }
      if (!cat) { bad.push(f.name + ': no "category" field, which decides its shelf'); continue; }
      // Workouts name the shelf by its id ("conditioning"), articles by its title ("Pre-Competition").
      const shelf = (S.libCats || []).find(c => c.kind === kind &&
        (c.id === cat || String(c.title || '').toLowerCase() === cat.toLowerCase() || c.id === cat.toLowerCase()));
      if (!shelf) { bad.push(f.name + ': category "' + cat + '" does not exist yet'); continue; }
      rows.push({
        slug: (kind === 'workout' ? 'workouts/' : 'articles/') + shelf.id + '/' + id,
        kind, category_id: shelf.id, data: d, published: true,
      });
    }

    const NL = String.fromCharCode(10);
    if (bad.length && !rows.length) { fail('Nothing published:' + NL + NL + bad.join(NL)); return; }
    const preview = rows.map(r => '· ' + (r.data.title || r.slug)).join(NL);
    const skipped = bad.length ? NL + NL + 'Skipped:' + NL + bad.join(NL) : '';
    if (!confirm('Publish ' + rows.length + ' ' + kind + '(s)?' + NL + NL + preview + skipped)) return;

    const res = await sb.from('library').upsert(rows, { onConflict: 'slug' }).select('slug');
    const badW = writeFailed(res, 'published');
    if (badW) { fail('Could not publish: ' + badW); return; }
    await loadLibrary();
    render();
    if (skipped) alert('Published ' + rows.length + '.' + skipped); else toast('Published ' + rows.length);
  };
  input.click();
}

async function loadLibrary() {
  S.libCats = [];
  S.lib = [];
  const [c, l] = await Promise.all([
    sb.from('library_categories').select('*').order('sort_order'),
    sb.from('library').select('slug, kind, category_id, published, updated_at, data').order('sort_order'),
  ]);
  if (!c.error) S.libCats = c.data || [];
  if (!l.error) S.lib = l.data || [];
  LOAD_ERR.library = (c.error || l.error) ? (c.error || l.error).message : '';
}

// Open an athlete's own app in a new tab, read-only.
//
// No impersonation needed: get_program() and the athlete RPCs accept the coach, so
// Amir's own session already resolves their programme. `preview=1` is what stops the
// app writing — it loads their real data but skips every cloud write, so looking
// around cannot land a stray tick or note in the athlete's logged record.
function viewAsAthlete(athleteId, which) {
  const page = which === 'habits' ? 'habits.html' : 'program.html';
  // The demo's athletes are made up: show the public demo programme instead.
  if (DEMO) { window.open(`${SITE}/${page}?client=demo`, '_blank', 'noopener'); return; }
  window.open(`${SITE}/${page}?client=${encodeURIComponent(athleteId)}&preview=1`, '_blank', 'noopener');
}

// The same "counts as a logged day" test contact_list() uses server-side: the
// day's value is an object with at least one key. Presence, not score.
// ── Body weight ───────────────────────────────────────────────────────────
// Proof writes weight to its OWN key in the same progress blob — never into the
// habit log, because the server pays XP for unrecognised keys in a day object
// and a weight in there would score on the leaderboard and nowhere else. It is
// read-only here: the coach watches the trend, the athlete owns the record.
// Shape: { '2026-09-01': { kg: 78.4, t: 1756... } }
const WT_AVG_WINDOW = 7;
function wtOf(blob, id) {
  const wt = jparse(blob ? blob[id + '_hab_wt'] : null);
  const out = {};
  if (wt && typeof wt === 'object') {
    Object.keys(wt).forEach(k => {
      const e = wt[k];
      if (e && typeof e.kg === 'number' && isFinite(e.kg)) out[k] = e.kg;
    });
  }
  return out;
}
function wtDaysOf(wt) { return Object.keys(wt).sort(); }
// The same trailing-average the app draws, so the coach and the athlete are
// never looking at two different lines for the same body.
function wtAvgSeriesOf(wt, days) {
  const from = addDays(todayKey(), -(days - 1));
  const keys = wtDaysOf(wt);
  return keys.filter(k => k >= from).map(k => {
    const lo = addDays(k, -(WT_AVG_WINDOW - 1));
    const win = keys.filter(x => x <= k && x >= lo).map(x => wt[x]);
    return { day: k, v: win.reduce((s, v) => s + v, 0) / win.length };
  });
}
function wtChangeOf(wt, days) {
  const s = wtAvgSeriesOf(wt, days);
  if (s.length < 2) return null;
  return { delta: s[s.length - 1].v - s[0].v, n: s.length };
}
function fmtDeltaKg(v) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + round1(Math.abs(v)).toFixed(1); }

// ── Personal records (estimated 1RM) ──────────────────────────────────────
// program.html writes "<id>_1rm" into the same progress blob: one entry per
// lift per day, { lift, kg, w, r, rpe, d, t, test? }, where `kg` is the
// estimate and w/r/rpe the set it came from. Read-only here.
//
// ⚠ A deleted entry arrives as a TOMBSTONE ({ del: true }), not as a missing
// row — that is what stops the athlete's other phone handing it straight back.
// Filtering them out is this function's whole job; a coach looking at a number
// the athlete has already deleted is worse than showing nothing.
function oneRmOf(blob, id) {
  const raw = jparse(blob ? blob[id + '_1rm'] : null);
  if (!Array.isArray(raw)) return [];
  return raw.filter(e => e && e.lift && e.d && !e.del && e.kg > 0);
}

// The athlete's own name matching, ported so the two never disagree about
// whether a renamed lift is one lift or two — see ceilAliasMap() in
// program.html. Same four tiers, same "exactly one on each side" rule.
const EX_ABBREV_C = { db: 'dumbbell', bb: 'barbell', kb: 'kettlebell' };
function normExNameC(s) {
  return String(s || '').toLowerCase()
    .normalize('NFKD').replace(/[^\x00-\x7f]/g, '')
    .replace(/'/g, '').replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function exNameVariantsC(sfx) {
  const base = normExNameC(sfx);
  const toks = base.split(' ').filter(Boolean);
  const abbrev = toks.map(t => EX_ABBREV_C[t] || t).join(' ');
  const noMachine = abbrev.split(' ').filter(t => t && t !== 'machine').sort().join(' ');
  const noParen = normExNameC(String(sfx).replace(/\([^)]*\)/g, ' '));
  return [base, abbrev, noMachine, noParen];
}
function ceilAliasMapC(entries, current) {
  if (!current.length) return {};
  const cur = {};
  current.forEach(n => { cur[n] = 1; });
  const orphans = [];
  entries.forEach(e => { if (!cur[e.lift] && orphans.indexOf(e.lift) === -1) orphans.push(e.lift); });
  if (!orphans.length) return {};
  const index = names => {
    const store = [{}, {}, {}, {}];
    names.forEach(n => exNameVariantsC(n).forEach((v, tier) => {
      if (!v) return;
      (store[tier][v] || (store[tier][v] = [])).push(n);
    }));
    return store;
  };
  const curIdx = index(current), orpIdx = index(orphans), map = {};
  orphans.forEach(o => {
    const vs = exNameVariantsC(o);
    for (let tier = 0; tier < vs.length; tier++) {
      const v = vs[tier];
      if (!v) continue;
      if ((curIdx[tier][v] || []).length !== 1 || (orpIdx[tier][v] || []).length !== 1) continue;
      map[o] = curIdx[tier][v][0];
      break;
    }
  });
  return map;
}
// One row per lift: the latest estimate, the change since the first one, and
// how long the athlete has gone without putting a number on it.
function oneRmLifts(entries, current) {
  const alias = ceilAliasMapC(entries, current || []);
  const by = {};
  entries.forEach(e => {
    const lift = alias[e.lift] || e.lift;
    const day = (by[lift] = by[lift] || {});
    if (!day[e.d] || (e.t || 0) > (day[e.d].t || 0)) day[e.d] = e;
  });
  return Object.keys(by).map(lift => {
    const es = Object.keys(by[lift]).sort().map(d => by[lift][d]);
    const latest = es[es.length - 1];
    return { lift: lift, entries: es, latest: latest, delta: latest.kg - es[0].kg,
             age: daysSince(latest.d + 'T12:00:00') };
  }).sort((a, b) => (a.latest.d < b.latest.d ? 1 : -1));
}

function habDaysOf(blob, id) {
  const raw = blob ? blob[id + '_hab_log'] : null;
  const log = jparse(raw);
  const days = {};
  if (log && typeof log === 'object') {
    Object.keys(log).forEach(k => {
      const v = log[k];
      if (v && typeof v === 'object' && Object.keys(v).length) days[k] = true;
    });
  }
  return days;
}

// ── Sessions that reached the inbox but never reached the dashboard ───────────
// The app writes session_history itself (save_session) AND emails the report.
// Those are two independent calls, so one can succeed while the other fails —
// and when save_session is the one that fails it is completely silent: the
// payload goes into a localStorage retry queue that only drains on a future app
// open. Behnam, 2026-09-05: report emailed at 17:16, session_history row never
// written, found only because a "Done" pill looked wrong to Amir. Every athlete
// carries `<id>_sent_d<N>` (an ISO timestamp of the last send for that day), so
// a send with no matching history row is a session the dashboard is missing.
// It is the athlete's own record, not a guess. Since WK-04 (2026-09-27) the report
// can go hours or days after the session (it waits on the phone for signal), so the
// app also writes `<id>_senton_d<N>`, the date the session is filed under, and that
// is the date matched; the send's own UTC date is only the fallback for older sends.
function syncGapsOf(blob, id, sessions) {
  const gaps = [];
  if (!blob) return gaps;
  // supabase-js hands `date` columns back as 'YYYY-MM-DD' strings today, but a
  // Date here would silently stringify to "Mon Aug 10 2026" and mismatch EVERY
  // row — turning this into a false "not synced" warning on the whole roster,
  // which is worse than not having the check at all. Normalise both shapes.
  const dkey = v => (v instanceof Date)
    ? (isNaN(v.getTime()) ? '' : v.toISOString().slice(0, 10))
    : String(v == null ? '' : v).slice(0, 10);
  const have = new Set((sessions || []).map(s => Number(s.day) + '|' + dkey(s.completed_on)));
  const pre = id + '_sent_d';
  Object.keys(blob).forEach(k => {
    if (k.indexOf(pre) !== 0) return;
    const day = k.slice(pre.length);
    if (!/^\d+$/.test(day)) return;
    const filed = String(blob[id + '_senton_d' + day] || '');
    const on = /^\d{4}-\d{2}-\d{2}$/.test(filed) ? filed : String(blob[k] || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(on)) return;
    if (!have.has(Number(day) + '|' + on)) gaps.push({ day: Number(day), on });
  });
  return gaps.sort((x, y) => String(y.on).localeCompare(String(x.on)));
}

function assemble() {
  const map = {};
  const get = (id) => (map[id] = map[id] || {
    id, name: id, lastActive: null, sessions: [], finished: 0,
    habDays: {}, habLast: null, isHab: false, contact: null,
    toReply: 0,
  });
  S.prog.forEach(r => {
    const a = get(r.athlete_id);
    if (r.athlete_name) a.name = r.athlete_name;
    if (r.updated_at && (!a.lastActive || r.updated_at > a.lastActive)) a.lastActive = r.updated_at;
    a.habDays = habDaysOf(r.data, r.athlete_id);
    a.wt = wtOf(r.data, r.athlete_id);
    a.oneRm = oneRmOf(r.data, r.athlete_id);
    a.blob = r.data;                       // kept for syncGapsOf below (a reference, not a copy)
    const dk = Object.keys(a.habDays).sort();
    a.isHab = dk.length > 0;
    a.habLast = dk.length ? dk[dk.length - 1] : null;
  });
  S.hist.forEach(r => {
    const a = get(r.athlete_id);
    if (r.athlete_name) a.name = r.athlete_name;
    if (r.updated_at && (!a.lastActive || r.updated_at > a.lastActive)) a.lastActive = r.updated_at;
    a.finished++;
    a.sessions.push(r);
  });
  // Everyone with a programme gets a roster row, even if they have never logged a
  // session. This used to walk athlete_keys, which is empty now that the old
  // links are retired.
  Object.keys(S.programs || {}).forEach(id => get(id));
  S.contacts.forEach(c => { const a = get(c.athlete_id); a.contact = c; });

  Object.values(map).forEach(a => {
    const p = S.programs[a.id];
    if (p && p.athlete) {
      const nm = [p.athlete.firstName, p.athlete.lastName].filter(Boolean).join(' ');
      if (nm) a.name = nm;
    }
    if (a.name === a.id) {
      const o = S.optin[a.id];
      if (o && o.display_name) a.name = o.display_name;
      else if (a.contact && (a.contact.shown_as || a.contact.display_name)) a.name = a.contact.shown_as || a.contact.display_name;
      else a.name = unslug(a.id);
    }
    // Free tier lives at data.athlete.tier — that is the field isFree() reads in
    // habits.html, and every free row on the server carries it there, none at the
    // top level. Reading only p.tier showed all 13 free athletes as "Coached" here,
    // in the tier filter, and to athletesNeedingLogin(). Both spellings accepted so a
    // hand-written row either way still reads right.
    const ptier = p && (p.tier || (p.athlete && p.athlete.tier));
    a.tier = ptier === 'free' ? 'free' : (p ? 'coached' : (a.isHab ? 'proof' : 'unknown'));
    a.perWeek = (p && p.workouts && p.workouts.days && p.workouts.days.length) || 0;
    a.onBoard = !!S.optin[a.id];
    a.lastSession = a.sessions.length ? a.sessions.map(s => s.completed_on).sort().slice(-1)[0] : null;
    // Needs both halves, so it runs here rather than in either pass above.
    a.syncGaps = syncGapsOf(a.blob, a.id, a.sessions);
    a.lowRun = a.tier === 'coached' ? lowRunOf(a.sessions) : '';
    // Split unanswered notes at the window: `recent` is what "waiting" means
    // anywhere a count is shown; `stale` is backlog. Every note still keeps its
    // own reply buttons on the athlete's file regardless of age. Age is the day the
    // note ARRIVED (noteArrivedOn), newest first, so the row on Today opens the latest one.
    const cut = addDays(todayKey(), -NEEDS_WINDOW_DAYS);
    a.needReplySessions = a.sessions.filter(sessionNeedsReply).sort(byArrival);
    a.needReplyRecent = a.needReplySessions.filter(s => noteArrivedOn(s) >= cut);
    a.needReplyStale = a.needReplySessions.length - a.needReplyRecent.length;
    a.toReply = a.needReplyRecent.length;
    const t = todayKey();
    a.habToday = !!a.habDays[t];
    a.hab7 = 0; for (let i = 0; i < 7; i++) if (a.habDays[addDays(t, -i)]) a.hab7++;
    a.habGap = a.isHab ? daysBetween(a.habLast, t) : null;
    a.cycle = cycleDatesOf(p);
    a.hasLogin = !!(S.logins || {})[a.id];
    const seen = [a.lastSession, a.habLast, a.lastActive && dkey(new Date(a.lastActive)),
                  a.contact && a.contact.signed_up && dkey(new Date(a.contact.signed_up))].filter(Boolean).sort();
    a.lastSeen = seen.length ? seen[seen.length - 1] : null;
  });
  Object.values(map).forEach(a => { a.reasons = reasonsOf(a); });
  S.ath = map;
  S.stamp++;
}

// ── Who needs you, and why: ONE rule ─────────────────────────────────────────
// Used by Today's Needs you, the roster's reason chips, its "Needs you" group and filter, and its
// sort. Until 2026-10-10 there were four versions (the Today panel, rosterReasons, the roster
// sort and the counters), and they disagreed: sync gaps and upgrade leads never reached Today,
// new signups never reached the roster, and a run of low days did not move the sort.
const SYSTEM_IDS = ['demo'];          // the public marketing demo: on the roster, never a client
const LAPSED_DAYS = 30;               // nothing from them (session, habit, app sync) for this long
const CYCLE_SOON_DAYS = 7;            // "cycle ends in N days": time for /cycle-report and the next cycle
const CYCLE_RENEW_DAYS = 14;          // "cycle ended N days ago — renew?" for this long after the end
function cycleDatesOf(p) {
  const cyc = p && p.cycles && p.cycles[Number.isInteger(p.currentCycleIndex) ? p.currentCycleIndex : 0];
  if (!cyc) return null;
  const ok = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')) ? String(v) : null;   // a missing date is "no date", never "ended"
  return { name: cyc.name || '', weeks: cyc.weeks || '', start: ok(cyc.startDate), end: ok(cyc.endDate) };
}
function reasonsOf(a) {
  const out = [];
  const add = (key, tone, text, weight, sub) => out.push({ key, tone, text, weight, sub });
  const t = todayKey();
  a.lapsed = false;
  if (SYSTEM_IDS.includes(a.id) || a.id === AMIR_ATHLETE_ID) return out;
  const n = a.needReplyRecent ? a.needReplyRecent.length : 0;
  if (n) add('note', 'warn', n + ' note' + (n === 1 ? '' : 's') + ' to read', 100 + n, 'work');
  if (a.syncGaps && a.syncGaps.length) {
    const g = a.syncGaps[0];
    // Ranked high: every session-derived number on the dashboard is wrong for them until it is resolved.
    add('sync', 'warn', a.syncGaps.length === 1 ? `session not synced — Day ${g.day}, ${g.on}`
      : `${a.syncGaps.length} sessions not synced — latest Day ${g.day}, ${g.on}`, 80, 'work');
  }
  if (a.lowRun) add('lowrun', 'warn', 'run of low days', 70, 'work');
  const idle = a.lastSession ? daysBetween(a.lastSession, t) : null;
  const ended = a.cycle && a.cycle.end ? daysBetween(a.cycle.end, t) : null;   // > 0: days since it ended
  // A coached athlete inside a dated cycle that has not ended is never "gone quiet": they are paying
  // for this cycle, so a month without a session is someone to chase, not someone to fold away.
  const inCycle = a.tier === 'coached' && ended != null && ended <= 0;
  a.lapsed = (!inCycle && !!(a.lastSeen && daysBetween(a.lastSeen, t) > LAPSED_DAYS && !n))
          || !!(a.tier === 'coached' && ended != null && ended > CYCLE_RENEW_DAYS && (idle == null || idle > CYCLE_RENEW_DAYS));
  if (a.tier === 'coached' && ended != null) {
    if (ended >= -CYCLE_SOON_DAYS && ended <= 0) add('cycle', 'note', ended === 0 ? 'cycle ends today' : `cycle ends in ${-ended} day${ended === -1 ? '' : 's'}`, 45, 'work');
    else if (ended > 0 && ended <= CYCLE_RENEW_DAYS) add('renew', 'warn', `cycle ended ${ended} day${ended === 1 ? '' : 's'} ago — renew?`, 60, 'file');
  }
  const noLogin = S.progSrc[a.id] === 'db' && !a.hasLogin && !LOAD_ERR.logins;
  if (!a.lapsed && noLogin) add('login', 'warn', 'no login — cannot open the app', 50, 'file');
  // Someone locked out since the links were retired produces no activity, so they drift into Gone
  // quiet; the row still says why, without putting them in Needs you.
  a.quietFlags = a.lapsed && noLogin ? [{ tone: 'warn', text: 'no login — cannot open the app' }] : [];
  if (a.contact && a.contact.signed_up && daysSince(a.contact.signed_up) <= 7)
    add('signup', 'note', 'new signup · ' + timeAgo(a.contact.signed_up), 35, 'proof');
  if (a.lapsed) return out;
  if (a.tier === 'coached' && idle != null && idle > QUIET_SESSION_DAYS && !(ended != null && ended > 0))
    add('idle', 'note', 'no session for ' + idle + ' days', 30, 'work');
  // Proof silence is a reason for habit-only athletes. A coached athlete ticks habits on the
  // training app's Home now and then; their training is the signal, so their dots stay on the row.
  if (a.tier !== 'coached' && a.isHab && a.habGap >= QUIET_HABIT_DAYS)
    add('silent', 'note', 'silent on Proof — ' + a.habGap + ' days', 20 + Math.min(a.habGap, 14), 'proof');
  if (a.tier === 'free' && a.contact && a.contact.days_logged >= UPGRADE_DAYS)
    add('upgrade', 'good', 'ready to upgrade?', 25, 'proof');
  return out.sort((x, y) => y.weight - x.weight);
}

// Server-scored season level per Proof athlete (cached; never computed here).
// coach_season_levels() (stage46, coach only) answers for every athlete in one call. The per-athlete
// hab_season_level is the fallback while that is missing; since stage46 athletes cannot call it.
async function loadLevels() {
  if (DEMO || loadLevels._done) return;
  loadLevels._done = true;
  const ids = Object.values(S.ath).filter(a => a.isHab).map(a => a.id);
  if (!ids.length) return;
  const all = await sb.rpc('coach_season_levels', { p_ids: ids });
  if (!all.error && Array.isArray(all.data)) {
    all.data.forEach(r => { if (r && r.level != null) S.levels[r.athlete_id] = r.level; });
    LOAD_ERR.levels = '';
    return;
  }
  const LANES = 6;
  let next = 0, failed = 0;
  const lane = async () => {
    while (next < ids.length) {
      const id = ids[next++];
      try {
        const r = await sb.rpc('hab_season_level', { p_athlete_id: id });
        if (!r.error && r.data != null) S.levels[id] = r.data; else if (r.error) failed++;
      } catch (e) { failed++; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(LANES, ids.length) }, lane));
  LOAD_ERR.levels = failed === ids.length ? (all.error && all.error.message) || 'no level came back' : '';
}

// --- season helpers ---------------------------------------------------------
function currentSeason() {
  const t = todayKey();
  const live = S.seasons.filter(s => s.starts_on <= t).sort((a, b) => b.starts_on.localeCompare(a.starts_on));
  return live[0] || null;
}
function seasonDay() {
  const s = currentSeason();
  return s ? daysBetween(s.starts_on, todayKey()) + 1 : null;
}

// --- quest helpers ----------------------------------------------------------
function questPool() { return (S.rules && S.rules.quests) || []; }
// The runs as habits.html reads them: an entry with no start date or no quest list is skipped.
function questRuns() { return ((S.rules && S.rules.questRuns) || []).filter(x => x && typeof x.start === 'string' && Array.isArray(x.ids)); }
// A run's last live day, worked out exactly as habits.html runEndKey() does (audit TODAY-14, 2026-10-11): its seventh day, CLIPPED the day before
// the next run starts (two runs never both score a day), or the day the coach ENDED it (end_quests(), stage55: what was earned keeps counting).
// It used to ignore the next run, so with two runs overlapping or one scheduled ahead it showed a longer week than the athletes' app does.
function questRunEnd(r) {
  let end = addDays(r.start, 6);
  const next = questRuns().map(x => x.start).filter(s => s > r.start).sort()[0];
  if (next) { const dayBefore = addDays(next, -1); if (dayBefore < end) end = dayBefore; }
  if (typeof r.end === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.end) && r.end < end) end = r.end;
  return end;
}
// The run covering today: the LATEST-STARTING one, as activeQuestRun() in habits.html (a week announced mid-week takes over from its own start;
// it used to take the last one in the list, which is a different run when one is scheduled ahead).
function activeQuestRun() {
  const t = todayKey();
  const covering = questRuns().filter(r => r.start <= t && t <= questRunEnd(r));
  return covering.length ? covering.reduce((best, r) => (r.start > best.start ? r : best)) : null;
}
function questById(id) { return questPool().find(q => q.id === id) || { id, note: id, xp: '' }; }

function wallLines(daysBack) {

      || (a.athlete_id === COACH_NOTE_ID ? -1 : b.athlete_id === COACH_NOTE_ID ? 1 : 0)
      || String(a.created_at).localeCompare(String(b.created_at)));
}

// --- training-load + readiness analytics (ported) ---------------------------
// All derived from session_history. Load uses Foster's session-RPE method
// (load = session RPE × duration in minutes). ACWR = acute (7-day) ÷ chronic
// (28-day weekly average). Hex colours because var() is unreliable in SVG attrs.
// `amber` is a legacy name: the warn colour is plum (--ochre) since 2026-09-26.
const C = { green: '#0E4A36', red: '#C7552F', amber: '#7A4E6E', grey: '#5C5C5C' };
function dailyLoad(sessions) {
  const m = {};
  sessions.forEach(s => {
    if (s.session_rpe != null && s.duration_min != null && s.completed_on)
      m[s.completed_on] = (m[s.completed_on] || 0) + Number(s.session_rpe) * Number(s.duration_min);
  });
  return m;
}
function computeAcwr(daily, ref) {
  const keys = Object.keys(daily);
  if (!keys.length) return { ratio: null, acute: 0, chronicWeekly: 0, enough: false, spanDays: 0 };
  const r = ref || new Date();
  const refMid = new Date(r.getFullYear(), r.getMonth(), r.getDate());
  let acute = 0, chronic = 0, earliest = null;
  keys.forEach(iso => {
    const d = pDate(iso), diff = Math.floor((refMid - d) / 86400000);
    if (earliest === null || d < earliest) earliest = d;
    if (diff >= 0 && diff < 7)  acute   += daily[iso];
    if (diff >= 0 && diff < 28) chronic += daily[iso];
  });
  const spanDays = earliest !== null ? Math.floor((refMid - earliest) / 86400000) : 0;
  // The weekly average over the weeks that actually have history in the 28-day window. Dividing by
  // 4 regardless made every new athlete read a false "High load" (1.7 at two weeks) for about a week.
  const weeksCovered = Math.min(4, (Math.min(spanDays, 27) + 1) / 7);
  const chronicWeekly = weeksCovered > 0 ? chronic / weeksCovered : 0;
  return { ratio: chronicWeekly > 0 ? acute / chronicWeekly : null,

}
// Sessions in the 28-day window with no load (no duration or no session RPE): they count as zero
// in the ratio and the bars, so the card says how many there are.
function loadCoverage(sessions, ref) {
  const r = ref || new Date();
  const from = addDays(dkey(r), -27);
  const inWin = sessions.filter(s => s.completed_on && s.completed_on >= from && s.completed_on <= dkey(r));
  return { total: inWin.length, withLoad: inWin.filter(s => s.session_rpe != null && s.duration_min != null).length };
}
function acwrZone(r) {
  if (r == null) return { label: '—', cls: '' };
  if (r > 1.5)  return { label: 'High load', cls: 'red' };
  if (r > 1.3)  return { label: 'Climbing',  cls: 'amber' };
  if (r >= 0.8) return { label: 'Optimal',   cls: 'green' };
  return { label: 'Low load', cls: 'amber' };
}
// The check-in as the athlete's app scores it (REC-2, 2026-09-26; audit TWIN-3 and TODAY-11, fixed 2026-10-11): the score S is the mean of
// sleep, energy, stress and how ready they feel (soreness is left out: it only moves impact work), and their "usual" is the mean of
// their last ten scores BEFORE this one, once there are five. readinessS() and readinessBase() in program.html are the twins;
// scripts/check_twins.js runs both on the same check-ins. The chart used to plot the old composite (soreness in, how ready they feel
// out) against an all-time mean, so it could disagree with the number above it, which reads the app's own verdict.
const READY_FOUR_C = ['sleep', 'energy', 'stress', 'overall'];
const READY_BASE_N_C = 10, READY_BASE_MIN_C = 5;
function readinessSC(r) {
  if (!r || r.skipped) return null;
  const v = READY_FOUR_C.map(k => Number(r[k]));
  return v.every(x => x >= 1 && x <= 5) ? v.reduce((a, b) => a + b, 0) / 4 : null;
}
function usualC(scoresNewestFirst) {
  const last = scoresNewestFirst.slice(0, READY_BASE_N_C);

}

function checkinOrderC(a, b) {
  return String(a.iso).localeCompare(String(b.iso)) || String(a.at || '').localeCompare(String(b.at || ''));
}
// One point per answered check-in, oldest first: { iso, v: the score, base: their usual then, or null }. The app stores both with the

function readinessSeries(sessions) {

    .map(s => ({ iso: s.completed_on, rd: jparse(s.readiness) }))
    .filter(x => x.iso && x.rd && typeof x.rd === 'object' && !x.rd.skipped)
    .map(x => {

function weeklyLoad(daily, weeks, ref) {

  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const buckets = [];
  for (let i = weeks - 1; i >= 0; i--) { const start = new Date(monday); start.setDate(start.getDate() - i * 7); buckets.push({ start, load: 0 }); }
  Object.keys(daily).forEach(iso => {
    const d = pDate(iso);
    for (let i = buckets.length - 1; i >= 0; i--) { if (d >= buckets[i].start) { buckets[i].load += daily[iso]; break; } }
  });

  const r = ref || new Date();
  const refMid = new Date(r.getFullYear(), r.getMonth(), r.getDate());
  if (!earliest) return null;
  const daysActive = Math.floor((refMid - earliest) / 86400000) + 1;
  // Pro-rated to the days since they started (at most the window). Charging a whole week of
  // planned sessions for a week that had only begun read a perfectly adherent new athlete as 33%.
  const effDays = Math.max(1, Math.min(weeks * 7, daysActive));
  const effWeeks = Math.max(1, Math.round(effDays / 7));

  sessions.forEach(s => { if (!s.completed_on) return; const d = pDate(s.completed_on);
    if (d >= start && d <= refMid) done += isPartialStatus(s.status) ? 0.5 : 1; });
  const expected = Math.max(1, Math.round(daysPerWeek * effDays / 7));
  const raw = Math.round((done / expected) * 100);

function athleteMetrics(sessions, lastActive, daysPerWeek) {
  const daily = dailyLoad(sessions);
  const rser  = readinessSeries(sessions);
  const loadPts = sessions
    .filter(s => s.session_rpe != null && s.duration_min != null && s.completed_on)
    .slice().sort((a, b) => String(a.completed_on).localeCompare(String(b.completed_on)))
    .map(s => Number(s.session_rpe) * Number(s.duration_min));
  const byRecent = sessions.slice().sort((a, b) => String(b.completed_on).localeCompare(String(a.completed_on)));
  const lastPartial = byRecent.length ? isPartialStatus(byRecent[0].status) : false;
  const latestRd = sessions
    .map(s => { const rd = jparse(s.readiness); return { iso: s.completed_on, at: rd && rd.timestamp, rd }; })
    .filter(x => x.iso && x.rd && typeof x.rd === 'object' && !x.rd.skipped && (x.rd.level || x.rd.composite != null))
    .sort((a, b) => checkinOrderC(b, a))[0];

  // nobody can tell. While any exist the ratio is not shown at all: "not enough data" (Amir, 2026-10-11: skip them and grey out the
  // ratio, no invented figures). The bars and totals still use the sessions that do have a load.
  if (cover.total > cover.withLoad) { acwr.enough = false; acwr.partial = true; }
  return { daily, acwr, cover, rser, readiness: readinessStats(rser),

// --- tiny inline-SVG charts (ported) ----------------------------------------
function sparkline(values, color, w, h) {
  w = w || 400; h = h || 40;
  const pts = values.filter(v => v != null && !isNaN(v));
  if (pts.length < 2) return '<span class="muted" style="font-size:11px">not enough data yet</span>';
  const min = Math.min(...pts), max = Math.max(...pts), rng = (max - min) || 1;
  const X = i => (i / (pts.length - 1)) * (w - 2) + 1;
  const Y = v => h - 2 - ((v - min) / rng) * (h - 4);
  const d = pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const lx = X(pts.length - 1), ly = Y(pts[pts.length - 1]);
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}
function barsSVG(buckets, color) {
  const w = 320, h = 96, base = h - 4, top = 8, n = buckets.length || 1;
  const max = Math.max(1, ...buckets.map(b => b.load)), slot = w / n;
  const bars = buckets.map((b, i) => {
    const bh = (b.load / max) * (base - top), x = i * slot + slot * 0.18, bw = slot * 0.64, y = base - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="2" fill="${color}" opacity="${b.load ? 0.85 : 0.18}"></rect>`;
  }).join('');
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}
function lineSVG(series, opts) {
  opts = opts || {};
  const w = 320, h = 96, top = 10, bot = h - 14, left = 4, right = w - 4;
  const yMin = opts.yMin != null ? opts.yMin : 1, yMax = opts.yMax != null ? opts.yMax : 5;
  const X = i => series.length > 1 ? left + (i / (series.length - 1)) * (right - left) : (left + right) / 2;
  const Y = v => bot - ((v - yMin) / ((yMax - yMin) || 1)) * (bot - top);
  const d = series.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  // Dots by default — the readiness chart plots a handful of sessions and each
  // one is a real event worth marking. A long daily series (body weight, 90
  // points) turns that into a caterpillar, so it can ask for the line alone.
  const dots = opts.dots === false ? ''
    : series.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.2" fill="${opts.color}"/>`).join('');
  let baseLine = '';
  if (opts.baseline != null) { const by = Y(opts.baseline).toFixed(1); baseLine = `<line x1="${left}" y1="${by}" x2="${right}" y2="${by}" stroke="${C.grey}" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>`; }
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${baseLine}<path d="${d}" fill="none" stroke="${opts.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

  const azColor = az.cls === 'red' ? 'var(--clay)' : az.cls === 'amber' ? 'var(--ochre)' : az.cls === 'green' ? 'var(--court)' : 'var(--ink)';
  const hasLoad = Object.keys(m.daily).length > 0;

         <div class="chart-sub">${Math.round(m.acwr.acute)} AU this week vs ${Math.round(m.acwr.chronicWeekly)} AU weekly average${m.acwr.spanDays < 27 ? ` (over ${Math.min(m.acwr.spanDays + 1, 28)} days of history)` : ''}</div>`
      : m.acwr.partial
        ? `<div class="chart-big" style="font-size:17px;color:var(--muted)">Not enough data</div>

         <div class="chart-sub">${r.delta == null ? 'Their usual starts once they have five check-ins to go on.' : (r.delta >= 0 ? '+' : '') + round1(r.delta) + ' vs their usual (the mean of their last ten check-ins before this one)'}</div>
         ${lineSVG(m.rser, { color: C.green, baseline: r.baseline, yMin: 1, yMax: 5 })}
         <div class="chart-legend">The check-in score per session (1–5: sleep, energy, stress and how ready they feel; higher = fresher), as the athlete's app scores it · dashed = their usual now</div>`
      : `<p class="empty">No readiness check-ins yet.</p>`}
  </div>`;
  const adh = m.adherence;
  const adhColor = !adh || adh.pct == null ? 'var(--muted)' : adh.pct >= 85 ? 'var(--court)' : adh.pct >= 60 ? 'var(--ochre)' : 'var(--clay)';

      ? `<div class="chart-big" style="color:${adhColor}">${adh.pct}%<span style="font-size:13px;color:var(--muted);margin-left:4px">last ${adh.days < 28 ? adh.days + ' days' : '4 wks'}</span></div>
         <div class="chart-sub">${adhDone} of ${adh.expected} planned sessions completed${adh.extra ? ` (${adh.extra % 1 ? adh.extra.toFixed(1) : adh.extra} more than planned)` : ''}</div>
         <div class="bar"><div class="bar-fill" style="width:${Math.min(adh.pct, 100)}%;background:${adhColor}"></div></div>
         <div class="chart-legend">Planned = ${adh.perWeek}/week (their program), over the last ${adh.days} day${adh.days === 1 ? '' : 's'}</div>`
      : `<p class="empty">Needs a program file and at least one finished session.</p>`}
  </div>`;
  return `<div class="charts">${loadCard}${readyCard}${adhCard}</div>`;
}

function tierChip(a) {

  if (nums.every(n => n === 0)) return '';

  if (lo === hi) return String(lo);

// One prescribed exercise against its log line. Returns only what is actually
// known. Reps are logged per set since 2026-09-24 ("×5"); older sessions have
// none, and nothing here claims a rep count that was never recorded.
function compareExercise(pex, logged, drop, rd, note) {
  const rx = legacyRx(pex);
  const want = rx.sets ? parseInt(rx.sets, 10) : null;
  const tgt = dayTargetC(rpeTarget(rx.target), drop, note);
  const c = {
    name: (pex && pex.name) || (logged && logged.name) || '', pex, rx, tgt, logged,
    state: 'none', doneSets: 0, allSets: 0, load: '', rpeMean: null, rpePer: '', repsPer: '',
    flags: [], extra: !pex, want,
  };
  if (!logged) return c;                // prescribed but nothing logged against it
  const sets = logged.sets || [];
  c.allSets = sets.length;
  c.doneSets = sets.filter(s => s.done).length;
  c.load = loadSummary(sets);
  const rpes = sets.map(s => parseFloat(s.rpe)).filter(n => !isNaN(n));
  if (rpes.length) {
    c.rpeMean = Math.round((rpes.reduce((a, b) => a + b, 0) / rpes.length) * 10) / 10;
    c.rpePer = rpes.join(' · ');
    c.rpeList = rpes;
  }
  const reps = sets.filter(s => s.reps != null).map(s => s.reps);
  if (reps.length) c.repsPer = reps.join(' · ');
  const touched = c.doneSets > 0 || rpes.length > 0 || sets.some(s => s.w) || logged.rounds || logged.gear;
  c.state = logged.done ? 'done' : (touched ? 'part' : 'skip');
  // Left out because the day's check-in said so ("optional today", "skipped today: sore"):
  // not a miss. The athlete did what the day asked.
  if (c.state === 'skip' && /^(optional today|skipped today)/.test(logged.label || '')) {
    c.state = 'excused';
    c.flags.push({ tone: 'note', text: logged.label });
    return c;
  }
  // Optional work done in part is still optional: what they did is a bonus, not a miss.
  if (c.state === 'part' && /^optional today/.test(logged.label || '')) {
    c.state = 'excused';
    c.flags.push({ tone: 'note', text: 'optional today: ' + c.doneSets + (want ? ' of ' + want : '') + ' sets' });
    return c;
  }
  // A sore check-in halves the jumps (REC-2, "sore: jumps halved"). Exactly half the sets on that
  // day is the plan for the day, not a shortfall. (Which lifts are jumps is the app's call; the
  // dashboard does not keep a second copy of that rule, so it reads the half itself.)
  const halved = rd && rd.sore === 'half' && !rd.asWritten && want && c.doneSets &&
                 (c.doneSets === Math.floor(want / 2) || c.doneSets === Math.ceil(want / 2));

    c.flags.push({ tone: 'note', text: 'half the sets today (sore)', onPlan: true });
  else if (want && c.doneSets && c.doneSets < want)
    c.flags.push({ tone: 'miss', text: (want - c.doneSets) + ' set' + (want - c.doneSets === 1 ? '' : 's') + ' short' });
  else if (want && c.doneSets > want)
    c.flags.push({ tone: 'note', text: (c.doneSets - want) + ' extra set' + (c.doneSets - want === 1 ? '' : 's') });
  // Touched (a weight or an RPE typed) but no set ticked: not "exactly as prescribed".
  else if (want && !c.doneSets && c.state === 'part')
    c.flags.push({ tone: 'warn', text: '0 of ' + want + ' sets ticked' });
  if (tgt && c.rpeMean != null && c.state !== 'skip') {
    if (c.rpeMean - tgt.hi >= RPE_OVER)       c.flags.push({ tone: 'warn', text: round1(c.rpeMean - tgt.hi) + ' over target RPE' });
    else if (tgt.lo - c.rpeMean >= RPE_UNDER) c.flags.push({ tone: 'under', text: round1(tgt.lo - c.rpeMean) + ' under target RPE' });

    const short = reps.filter(n => n < plannedReps).length;
    if (short) c.flags.push({ tone: 'warn', text: short + ' set' + (short === 1 ? '' : 's') + ' under ' + plannedReps + ' reps' });
  }

}
// A whole day: every prescribed exercise, in program order and grouped by
// block, plus anything logged that was never prescribed.
// `cycle` is the cycle the day is judged against (its week notes); without one only the check-in lowers a target.
function compareDay(programDay, session, cycle) {
  const blocks = parseSessionLog(session && session.summary);
  // The summary is frozen text, but the structured log (session.log, written in the same loop and
  // in the same order) is kept in step when an exercise is renamed (the one-name move of
  // 2026-10-09). When the two line up one to one, the log's names win, so a renamed lift still
  // matches its prescription instead of reading "not logged" plus a stray "not in the plan".
  const flat = [];
  blocks.forEach(b => b.exercises.forEach(e => flat.push(e)));
  const log = jparse(session && session.log);
  if (Array.isArray(log) && log.length === flat.length)
    flat.forEach((e, i) => { const n = log[i] && log[i].ex; if (typeof n === 'string' && n.trim()) e.name = n.trim(); });
  // Name → every logged entry with that name, taken in order: the same exercise twice in one day
  // (a squat in two blocks) used to show the last log on both rows.
  const queue = {};
  flat.forEach(e => { (queue[normEx(e.name)] = queue[normEx(e.name)] || []).push(e); });
  const used = new Set();
  const take = name => { const q = queue[normEx(name)]; const e = q && q.shift(); if (e) used.add(e); return e; };
  const groups = [];
  const drop = dayDropC(session && session.readiness);
  const rd = jparse(session && session.readiness);
  const note = drop && cycle && session && session.completed_on ? weekNoteOnC(cycle, session.completed_on) : null;
  ((programDay && programDay.blocks) || []).forEach((b, bi) => {
    const rows = (b.exercises || []).map((pex, ei) => {
      const row = compareExercise(pex, take(pex.name), drop, rd, note);
      // Where this exercise lives in the programme, so the editor can write it
      // back. Index-based rather than name-based: two blocks can hold the same
      // movement, and a rename would otherwise lose the row.
      row.path = { day: programDay.id, block: bi, ex: ei };
      return row;
    });
    if (rows.length) groups.push({ title: b.title || '', icon: b.icon || '', rows });
  });
  const extras = [];
  flat.forEach(e => { if (!used.has(e)) extras.push(compareExercise(null, e)); });
  if (extras.length) groups.push({ title: 'Logged, not prescribed', icon: '', rows: extras });
  return { groups, hasLog: blocks.length > 0, extras: extras.length };
}
function dayVerdict(groups) {
  let total = 0, clean = 0, off = 0, missing = 0;
  groups.forEach(g => g.rows.forEach(r => {
    if (r.extra || r.state === 'excused') return;
    total++;
    if (r.state === 'skip' || r.state === 'none') missing++;
    else if (r.flags.some(f => !f.onPlan)) off++;   // a note that IS the day's plan (sore: halved) is not off plan
    else clean++;
  }));
  return { total, clean, off, missing };
}

function cmpCell(c) {
  if (!c.logged) return '<span class="did-none">— not logged</span>';
  const bits = [];
  // Circuits and timed pieces carry no set rows at all — "0 sets" would read as
  // a miss on work that was actually done, so those just say "done".
  const setTxt = c.state === 'excused' ? c.logged.label
    : c.state === 'skip' ? 'skipped'
    : c.want ? `${c.doneSets}/${c.want} sets`
    : c.allSets > 1 ? `${c.doneSets} sets`
    : 'done';
  const tone = c.state === 'done' ? 'ok' : c.state === 'part' ? 'warn' : c.state === 'excused' ? 'note' : 'miss';
  bits.push(`<span class="did-sets ${tone}">${esc(setTxt)}</span>`);
  if (c.load) bits.push(`<span class="did-load">${esc(c.load)}${/[a-z]/i.test(c.load) ? '' : ' kg'}</span>`);
  if (c.rpeMean != null) {
    const over = c.tgt && c.rpeMean - c.tgt.hi >= RPE_OVER;
    const under = c.tgt && c.tgt.lo - c.rpeMean >= RPE_UNDER;
    bits.push(`<span class="did-rpe ${over ? 'warn' : under ? 'under' : 'ok'}">RPE ${esc(c.rpeMean)}</span>`);
  }

  if (c.repsPer) detail.push('reps: ' + esc(c.repsPer));

  // clay above the target (range), steel blue below, plain inside it. The mean
  // above keeps its RPE_OVER/UNDER threshold; a single set is shown as it was.
  if (c.rpePer && c.allSets > 1) detail.push('per set: ' + (c.rpeList || []).map(r => {
    const k = !c.tgt ? '' : r > c.tgt.hi ? 'over' : r < c.tgt.lo ? 'under' : '';
    return k ? `<b class="rpe-set ${k}">${esc(r)}</b>` : esc(r);
  }).join(' · '));
  if (c.logged.rounds) detail.push(esc(c.logged.rounds));
  if (c.logged.gear) detail.push(esc(c.logged.gear));

}

/* ═══ PRESCRIPTION EDITOR ═══════════════════════════════════════════════════
   Edits go through real fields, and chips.js turns them back into correctly
   formatted labels — so the "12 each" green-pill bug cannot be typed into
   existence here. Saving writes the whole programme JSON to public.programs;
   the table's trigger keeps the previous version, which is what replaces git
   as the undo. Nothing here touches session_history: a past log records what
   was actually done and never moves when the prescription changes.

// Locate an exercise from the path stamped on its comparison row.
function exAt(athleteId, dayId, blockIdx, exIdx) {
  const prog = S.programs[athleteId];
  const days = (prog && prog.workouts && prog.workouts.days) || [];
  const day  = days.find(d => Number(d.id) === Number(dayId));
  const blk  = day && (day.blocks || [])[blockIdx];
  const ex   = blk && (blk.exercises || [])[exIdx];
  return ex ? { prog, day, blk, ex } : null;
}

// "hands off the floor" -> "Hands off the floor." so an old grey line reads as a sentence in a note.
function asSentence(t) {
  t = String(t || '').trim();
  if (!t) return '';
  t = t.charAt(0).toUpperCase() + t.slice(1);
  return /[.!?]$/.test(t) ? t : t + '.';
}

// Typed values of open editors, by editor id: a re-render (a save elsewhere, a refresh,

const _exDrafts = {};
function exDraftFields(eid) {

// one whole number of reps, a real duration for time, metres for distance, sets a whole number,
// RPE 6–10 or a 6–10 range. Returns { patch } or { error }.
function readExEditor(eid) {
  const val = id => String((document.getElementById(id + '-' + eid) || {}).value || '').trim();

  const dose = val('exDose'), sets = val('exSets'), rpe = val('exRpe'), tempo = val('exTempo'), restRaw = val('exRest');

  if (dose) {

        ? `Reps are one number, not a range ("${dose}"): write the one you mean.`
        : Chips.isPureDuration(dose) ? `"${dose}" is a time. Pick Time as the dose, then save.` : `Reps "${dose}" must be one whole number.` };
    if (kind === 'time' && !Chips.isPureDuration(dose)) return { error: `Time "${dose}" is not a duration I understand. Try 30s, 45 sec, 2 min or 1:30.` };
    if (kind === 'distance' && !/^\d+(\.\d+)?\s*(m|km|yd|yds|metres?|meters?)$/i.test(dose)) return { error: `Distance "${dose}" needs a unit: 20m, 400 m, 1 km.` };
  }

async function saveExEditor(athleteId, dayId, blockIdx, exIdx, eid, expectName, btn) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (S.progSrc[athleteId] !== 'db') { fail('This athlete has no programme in the database, so there is nothing to edit.'); return; }
  const shown = exAt(athleteId, dayId, blockIdx, exIdx);
  if (!shown || shown.ex.name !== expectName) {
    delete _exDrafts[eid];
    await reloadPrograms(); render();
    fail('That exercise has moved in the programme since this page was drawn, so nothing was saved. The page now shows the live programme: open ✎ on the exercise again.');
    return;
  }
  const form = readExEditor(eid);
  if (form.error) { fail(form.error); return; }
  if (JSON.stringify(withEditedEx(shown.ex, form)) === JSON.stringify(shown.ex)) {
    delete _exDrafts[eid]; toast('No change to save'); renderDetailBody(); return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const done = () => { if (btn) { btn.disabled = false; btn.textContent = 'Save'; } };

  // The programme on this page can be hours old (a new cycle published by the pipeline, another
  // tab, a restore). Saving it whole would put the old programme back, so the edit is applied to
  // the LIVE row, and only if nobody has written it since this page loaded.
  const live = await sb.from('programs').select('data, updated_at, updated_by').eq('athlete_id', athleteId).maybeSingle();
  if (live.error || !live.data) { done(); fail('Could not read the live programme, so nothing was saved: ' + (live.error ? live.error.message : 'no row')); return; }
  const seen = (S.progMeta[athleteId] || {}).updated_at;
  const stale = async (why) => {
    done(); delete _exDrafts[eid];
    await reloadPrograms(); render();
    fail(why + '\n\nNothing was saved. The page now shows the live programme: open ✎ again and redo the change.');
  };
  if (seen && live.data.updated_at !== seen) {
    return stale(`${nameOf(athleteId)}'s programme changed on the server after this page loaded ` +
      `(saved ${String(live.data.updated_at).slice(0, 16).replace('T', ' ')} UTC by ${live.data.updated_by || 'someone'}).`);
  }
  const fresh = live.data.data;
  const fd = ((fresh && fresh.workouts && fresh.workouts.days) || []).find(d => Number(d.id) === Number(dayId));
  const fb = fd && (fd.blocks || [])[blockIdx];
  const fex = fb && (fb.exercises || [])[exIdx];
  if (!fex || fex.name !== expectName) return stale('That exercise is no longer at the same place in the live programme.');
  fb.exercises[exIdx] = withEditedEx(fex, form);

  const res = await sb.from('programs').update({ data: fresh })
    .eq('athlete_id', athleteId).eq('updated_at', live.data.updated_at)
    .select('athlete_id, updated_at, updated_by');
  if (!res.error && (!res.data || !res.data.length)) {
    // Either someone saved in the second between the read and the write, or the session lapsed.
    return stale('The programme was not updated: it changed again while saving, or your sign-in lapsed.');
  }
  if (res.error) { done(); fail('Could not save: ' + res.error.message); return; }
  S.programs[athleteId] = fresh;
  S.progMeta[athleteId] = { updated_at: res.data[0].updated_at, updated_by: res.data[0].updated_by };
  delete _exDrafts[eid];
  assemble();
  toast('Saved — they see it next time they open the app');
  render();
}

// --- import a past session from a coach email (ported) ----------------------
function parseSessionEmail(text) {
  const t = String(text || '').replace(/\r/g, '');
  const fs = t.indexOf('Full summary');
  let summary = (fs >= 0 ? t.slice(fs + 'Full summary'.length) : t).replace(/^\s*\n/, '').trim();
  if (summary.indexOf('Exercise log:') < 0 && t.indexOf('Exercise log:') >= 0) summary = t.trim();
  const firstLine = (summary.split('\n')[0] || '');
  const dm = firstLine.match(/Day\s+(\d+)\s*[—–-]?\s*(.*)$/) || t.match(/Day\s+(\d+)\s*[—–-]?\s*([^\n]*)/);
  const day = dm ? Number(dm[1]) : null;
  const focus = dm && dm[2] ? dm[2].trim() : '';
  const grab = re => { const m = t.match(re); return m ? m[1].trim() : ''; };
  const status = grab(/Status:?\s*\n?\s*([^\n]+)/) || 'Complete';
  const rpeM = t.match(/Session RPE:?\s*\n?\s*(\d+(?:\.\d+)?)/i);
  const durM = t.match(/Duration:?\s*\n?\s*(\d+)/i);
  // The whole note, every line of it (the summary holds it between "Notes from athlete:" and the
  // exercise log); the email's own field holds only its first line in some mail clients.
  const nb = t.match(/Notes from athlete:\s*\n([\s\S]*?)\n\s*\n\s*Exercise log:/);
  let note = nb ? nb[1].trim() : (grab(/Notes from athlete\s*\n\s*([^\n]+)/) || grab(/Notes from athlete:\s*\n\s*([^\n]+)/));
  if (/^\(?none\)?$/i.test(note)) note = '';
  const who = grab(/^\s*Athlete:?[ \t]*\n?[ \t]*([^\n]+)/m);
  let readiness = null;
  const oneLine = t.match(/Composite\s+([\d.]+)\/5\s*·\s*Sleep\s+(\d+)\s*·\s*Energy\s+(\d+)\s*·\s*Soreness\s+(\d+)\s*·\s*Stress\s+(\d+)\s*·\s*Overall\s+(\d+)/i);
  if (oneLine) {
    readiness = { composite: Number(oneLine[1]), sleep: +oneLine[2], energy: +oneLine[3], soreness: +oneLine[4], stress: +oneLine[5], overall: +oneLine[6] };
  } else if (/Readiness[^\n]*skipped/i.test(t)) {
    readiness = { skipped: true };
  } else {
    const comp = t.match(/composite\s+([\d.]+)\/5/i);
    const q = (re) => { const m = t.match(re); return m ? +m[1] : null; };
    const sleep = q(/sleep last night:?\s*(\d+)/i), energy = q(/energy levels[^:]*:?\s*(\d+)/i),
          soreness = q(/sore[^:]*:?\s*(\d+)/i), stress = q(/stress[^:]*:?\s*(\d+)/i), overall = q(/ready do you feel:?\s*(\d+)/i);
    if (comp || sleep || energy || soreness || stress || overall) {
      readiness = { composite: comp ? Number(comp[1]) : null, sleep, energy, soreness, stress, overall };
    }
  }
  // What the check-in decided for the day (REC-2), when the email says: stored the way the app stores it so
  // the work tab judges the imported session on the day's real targets and "run of low days" counts it.
  if (readiness && !readiness.skipped) {
    const plan = parseCheckinPlan(t);
    if (plan) {
      const four = [readiness.sleep, readiness.energy, readiness.stress, readiness.overall].map(Number);
      Object.assign(readiness, plan, four.every(x => x >= 1 && x <= 5) ? { score: Math.round(four.reduce((a, b) => a + b, 0) / 4 * 100) / 100 } : {});
    }
  }
  return { day, focus, status, session_rpe: rpeM ? rpeM[1] : '', duration_min: durM ? durM[1] : '', readiness, day_note: note, summary, who };
}
// The check-in's verdict, from the words program.html's readinessPlanLine() writes: "Today: lower day (every RPE 1
// lower, never below 6) · sore: jumps and landings halved — trained as written by choice". The email carries it twice:
// on the Readiness field, after the answers ("Composite 3.5/5 · Sleep 3 · … · Overall 3 · lower day …"), and as a
// "Today:" line at the end of the readiness block of the full summary. It is only written when the day was lower or
// short or the athlete was sore, so no line means a normal day OR an email from before 2026-09-26: the two cannot be
// told apart, so this returns null and the import stores no verdict (never a guessed "normal day").
// Returns { level, sore, drop, asWritten } as the app stores it, or null. `base` (the athlete's usual) is not in the email.
// ⚠ ANCHORED on purpose: the words must follow the whole answers line, or sit in the readiness block itself. An
// athlete's own note ("Today: short day (only 40 min)", "Overall 8, lower day (poor sleep)") must never set a level.
function parseCheckinPlan(text) {
  const t = String(text || '').replace(/\r/g, '');
  const WORDS = '(?=short\\s+day\\s*\\(|lower\\s+day\\s*\\(|sore:\\s*jumps\\s+and\\s+landings\\s+(?:halved|skipped))';
  const m = new RegExp(
    '(?:Composite\\s+[\\d.]+/5\\s*·\\s*Sleep\\s+\\d+\\s*·\\s*Energy\\s+\\d+\\s*·\\s*Soreness\\s+\\d+\\s*·\\s*Stress\\s+\\d+\\s*·\\s*Overall\\s+\\d+\\s*·\\s*' +
    '|Readiness \\(at start\\)[^\\n]*(?:\\n[ \\t]*\\S[^\\n]*){1,8}?\\n[ \\t]*Today:[ \\t]*)' + WORDS).exec(t);
  if (!m) return null;
  // The rest of that line, plus a wrapped continuation, up to the next blank line: a mail client may break it.
  let win = t.slice(m.index + m[0].length, m.index + m[0].length + 300);
  const blank = win.search(/\n[ \t]*\n/);
  if (blank >= 0) win = win.slice(0, blank);
  win = win.replace(/\s+/g, ' ');
  // Exactly the words the app writes (case and all). Short/lower day are the first words after the separator, so
  // only the head is read for them. scripts/check_twins.js runs the app's real writer through this.
  const head = win.slice(0, 12);
  const red = /^short day/.test(head), amber = !red && /^lower day/.test(head);
  const sore = /sore:\s*jumps and landings skipped/.test(win) ? 'skip' : /sore:\s*jumps and landings halved/.test(win) ? 'half' : '';
  if (!red && !amber && !sore) return null;
  return { level: red ? 'red' : amber ? 'amber' : 'green', sore, drop: red || amber ? 1 : 0, asWritten: /trained as written by choice/.test(win) };
}
// Does the email's "Athlete" line name this athlete? Loose on purpose (first name, either order).
function emailNamesAthlete(who, athleteId) {
  if (!who) return true;
  const words = x => String(x || '').toLowerCase().replace(/[^a-z\u0600-\u06ff0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 1);
  const p = S.programs[athleteId], ath = p && p.athlete;
  const mine = new Set(words([nameOf(athleteId), ath && ath.firstName, ath && ath.lastName, unslug(athleteId)].join(' ')));
  return words(who).some(w => mine.has(w));
}

    if (!res.error.code) {

// --- AFFILIATES (referral-code roster) --------------------------------------
// public.affiliates is the ONE list of discount codes. form.html and form-fa.html
// ask check_discount() whether a typed code is live, so a code added here works on
// both forms immediately and a retired one stops. Coach-only table; payout / card
// details are deliberately NOT stored — they stay in the Web3Forms application
// email, so the Backup file never carries them. Backend: supabase/stage29_affiliates.sql.
const AFF_FIELDS = [
  ['code', 'Code', 'text'], ['percent', '% off', 'number'],
  ['coach_name', 'Coach name', 'text'], ['coach_name_fa', 'Name (Farsi)', 'text'],
  ['instagram', 'Instagram', 'text'], ['whatsapp', 'WhatsApp', 'text'],
  ['email', 'Email', 'text'], ['athlete_id', 'Athlete id (if they train with you)', 'text'],
  ['applied_on', 'Applied', 'date'],
];
let _affEditing = null;   // the code whose card is in edit mode, '__new__' for the add form, or null

// Iranian mobiles are typed 09…; wa.me needs the country code instead of the 0.
function affWa(num) { return waLink(num); }   // one builder: waLink() (Intake) handles Persian digits too
function affIg(handle) {
  const h = String(handle || '').trim().replace(/^@/, '');
  return h ? 'https://instagram.com/' + encodeURIComponent(h) : '';
}
// Intakes that used a code: the typed "Discount Code", or the "Discount Applied"
// the form fills in once the code checks out (e.g. "NAME10 (10% off)").
// A code as people type it on a phone: spaces anywhere, Persian or Arabic digits, any case.
function normCode(v) {
  return String(v || '').replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660)).replace(/\s+/g, '').toUpperCase();
}
// Applications that used the code (typed, or approved on the form). These are APPLICATIONS, not
// paying clients: nothing here knows who paid, so the card says so. Archived ones (spam, not a fit)
// are left out of the count.
function affUses(code) {
  return (S.intake || []).filter(i => {
    if ((i.status || 'new') === 'archived') return false;
    const p = i.payload || {};
    const typed = normCode(intakeVal(p['Discount Code']));
    const applied = normCode(intakeVal(p['Discount Applied']).trim().split(' ')[0]);
    return typed === code || applied === code;
  });
}

function affForm(a) {
  const isNew = !a;
  const v = a || { percent: 10 };
  const field = ([k, label, type]) => {
    const locked = k === 'code' && !isNew;
    const val = v[k] == null ? '' : v[k];
    const extra = (type === 'number' ? ' min="1" max="90" step="1"' : '') +
                  (locked ? ' readonly' : '') + (k === 'code' ? ' style="text-transform:uppercase"' : '');
    return `<label class="exf"><span>${esc(label)}</span><input type="${type}" data-k="${k}" value="${esc(val)}"${extra}></label>`;
  };
  return `<div class="aff-form" data-new="${isNew ? 1 : 0}">
    <div class="exed-grid">${AFF_FIELDS.map(field).join('')}</div>
    <label class="exf exf-wide"><span>Notes</span><textarea data-k="notes" rows="3">${esc(v.notes || '')}</textarea></label>
    ${isNew ? '<p class="empty" style="padding:8px 0 0">Convention is NAME10 — uppercase letters and digits, no spaces. Payout / card details stay in the application email, never here.</p>'
            : '<p class="empty" style="padding:8px 0 0">A code can’t be renamed — it is the key. Retire it and add the new one, so intakes that used the old code still add up.</p>'}
    <div class="i-actions"><button class="btn sm primary aff-save">${isNew ? 'Add code' : 'Save'}</button><button class="btn sm aff-cancel">Cancel</button></div>
  </div>`;
}

function affCard(a) {

  const when = a.active ? (a.applied_on ? 'since ' + esc(a.applied_on) : '') : 'retired ' + esc(a.retired_on || '');

  const cbits = [];

    ? `<div class="aff-uses">Applications with this code (not payments): ${uses.map(i => `${esc(intakeName(i))} (${esc(String(i.created_at || '').slice(0, 10))}${(i.status || 'new') === 'handled' ? ', handled' : ', new'})`).join(', ')}</div>` : '';

}

// PostgREST answers an update that RLS filtered out with success and zero rows,
// so every write asks for the row back and treats "nothing came back" as failure.
async function affWrite(q) {
  const { data, error } = await q.select('code');
  if (error) return error.message;
  if (!data || !data.length) return 'nothing was saved (signed in as the coach?)';
  return null;
}

async function affSave(formEl, btn) {
  const isNew = formEl.dataset.new === '1';
  const row = {};
  formEl.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    let val = String(el.value || '').trim();
    if (k === 'code') val = val.toUpperCase();
    row[k] = val === '' ? null : (k === 'percent' ? Number(val) : val);
  });
  if (!row.code || !/^[A-Z0-9]{2,32}$/.test(row.code)) { toast('Code must be 2–32 letters or digits, no spaces'); return; }
  if (!Number.isInteger(row.percent) || row.percent < 1 || row.percent > 90) { toast('% off must be a whole number from 1 to 90'); return; }
  if (isNew && (S.affiliates || []).some(x => x.code === row.code)) { toast(row.code + ' already exists — edit that one instead'); return; }
  if (btn) btn.disabled = true;
  const code = row.code;
  const patch = Object.assign({}, row); delete patch.code;
  if (DEMO) {
    if (isNew) (S.affiliates = S.affiliates || []).push(Object.assign({ active: true, retired_on: null }, row));
    else Object.assign((S.affiliates || []).find(x => x.code === code) || {}, patch);
  } else {
    const err = await affWrite(isNew ? sb.from('affiliates').insert(row) : sb.from('affiliates').update(patch).eq('code', code));
    if (err) { if (btn) btn.disabled = false; fail('Could not save — ' + err); return; }
  }
  _affEditing = null;
  toast(DEMO ? 'Demo mode — nothing saved' : (isNew ? code + ' is live on both apply forms' : 'Saved'));
  if (DEMO) renderAffiliates(); else await refetch(['affiliates']);
}

async function affSetActive(code, active, btn) {
  if (!active && !confirm(`Retire ${code}?\n\nIt stops working on both apply forms straight away. The row stays, so its history and the intakes that used it are kept.`)) return;
  const patch = active ? { active: true, retired_on: null } : { active: false, retired_on: todayKey() };
  if (btn) btn.disabled = true;
  if (DEMO) {
    Object.assign((S.affiliates || []).find(x => x.code === code) || {}, patch);
  } else {
    const err = await affWrite(sb.from('affiliates').update(patch).eq('code', code));
    if (err) { if (btn) btn.disabled = false; fail('Could not update — ' + err); return; }
  }
  toast(DEMO ? 'Demo mode — nothing saved' : (active ? code + ' is live again' : code + ' retired'));
  if (DEMO) renderAffiliates(); else await refetch(['affiliates']);
}

function renderAffiliates() {
  const all = (S.affiliates || []).slice().sort((a, b) =>
    String(b.applied_on || '').localeCompare(String(a.applied_on || '')) || String(a.code).localeCompare(String(b.code)));
  const live = all.filter(a => a.active), retired = all.filter(a => !a.active);
  const orphans = live.filter(a => !a.coach_name && !a.coach_name_fa).length;

  let html = `<div class="controls">
      <button class="btn primary sm" id="affAdd">+ Add code</button>
      <span class="empty" style="align-self:center">These are the codes both apply forms accept. Add or retire one and it takes effect straight away — no deploy.</span>
    </div>`;
  if (_affEditing === '__new__') html += `<section class="panel" style="margin-bottom:16px"><div class="phead"><span class="t hd">New code</span></div>${affForm(null)}</section>`;
  html += `<section class="panel"><div class="phead"><span class="t hd">Live codes</span><span class="r">${live.length} live${orphans ? ` · <span style="color:var(--clay-ink)">${orphans} with no owner</span>` : ''}</span></div>`;
  html += live.length ? live.map(affCard).join('')
    : '<p class="empty">No live codes. When you accept a coach from partner-fa.html, add their code here.</p>';
  html += `<p class="psub" style="margin:12px 0 0">The deal: the client gets the code's % off; the coach earns 10% of what the client actually pays — first payment and every renewal. Payout details stay in the application email (Gmail, subject:(Affiliate)).</p></section>`;
  if (retired.length) {
    const openRetired = retired.some(a => a.code === _affEditing) ? ' open' : '';
    html += `<section class="panel" style="margin-top:16px"><details${openRetired}><summary class="arch-toggle">Retired · ${retired.length}</summary><div style="margin-top:12px">${retired.map(affCard).join('')}</div></details></section>`;
  }

  const c = $('content');
  c.innerHTML = html;
  const on = (sel, fn) => c.querySelectorAll(sel).forEach(el => el.addEventListener('click', e => { e.preventDefault(); fn(el); }));
  on('.copy-btn-js', el => copyText(el.dataset.url, el));
  on('#affAdd', () => { _affEditing = '__new__'; renderAffiliates(); });
  on('.aff-edit', el => { _affEditing = el.dataset.code; renderAffiliates(); });
  on('.aff-cancel', () => { _affEditing = null; renderAffiliates(); });
  on('.aff-save', el => affSave(el.closest('.aff-form'), el));
  on('.aff-retire', el => affSetActive(el.dataset.code, false, el));
  on('.aff-reactivate', el => affSetActive(el.dataset.code, true, el));
}
