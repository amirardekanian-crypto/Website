<!DOCTYPE html>
<!--
  THE COACH'S BOX — coach.html
  Amir's private mission control for the whole operation: coached athletes
  (program.html / session_history) AND the Proof habit crew (habits.html).

  Access: Google sign-in locked to the coach email (UX gate only — Row Level
  Security in the database is the real gate; every coach-only table policy and
  RPC checks auth.jwt()->>'email').

  ⚠ SCORING INVARIANT: this page never computes XP, levels, streaks or day
  scores itself. Proof is already scored twice (habits.html client + Supabase
  plpgsql) and a third scorer would drift. The dashboard shows only:
    - raw presence facts (a day's hab_log entry is a non-empty object — the
      same test contact_list() uses), and
    - numbers returned by the server's own scorers (hab_season_level,
      leaderboard_top, contact_list).

  Preview without signing in: coach.html?demo=1 renders synthetic data.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Coach's Box</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E4A36">
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Pinned (2026-10-10): "@2" let any new 2.x build change how the dashboard signs in or reads
     with no change here. 2.117.3 is what @2 served that day and was tested against. To move on,
     bump the number and run the coach harness (Content/COACH-AUDIT.md). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<!-- Chip semantics, shared with program.html so the editor and the athlete app
     can never disagree about what a prescription says. See chips-selftest.html. -->
<script src="/assets/js/chips.js?v=20260925a"></script>
<style>
  :root {
    --paper: #FAF7F2; --card: #FFFFFF; --ink: #1A1A1A;
    --court: #0E4A36; --court-deep: #0B3B2B; --court-100: rgba(14,74,54,0.08);
    --clay: #C7552F; --clay-100: rgba(199,85,47,0.10);
    /* The "warn" middle between court green (good) and clay (bad). It was ochre
       until 2026-09-26, retired with the rest of the gold: it is a muted plum now.
       The name --ochre is legacy, kept so no reference needs renaming. */
    --ochre: #7A4E6E; --ochre-100: rgba(122,78,110,0.12);
    /* RPE UNDER target (2026-09-24). Same steel blue as program.html's --rpe-under,
       so a set reads the same colour on the athlete's phone and here: clay over,
       blue under. Used only for an RPE against its target. */
    --rpe-under: #3E6A92; --rpe-under-100: rgba(62,106,146,0.12);
    --line: #E4DCCC; --rule: rgba(26,26,26,0.08);
    /* Raised 2026-10-10 (audit BROWSER-8): .56/.42 measured 3.9:1 and 2.6:1, below WCAG AA for the
       small labels that carry most of this page. .65/.62 read 5.3:1 and 4.8:1 on paper. */
    --muted: rgba(26,26,26,0.65); --muted-soft: rgba(26,26,26,0.62);
    /* Clay as TEXT, and as the fill under white text: #C7552F is 4.1-4.4:1 there. The brand clay
       stays for bars, borders and dots. */
    --clay-ink: #B04A27; --clay-fill: #B04A27;
    --stick: 58px;   /* height of the sticky top bar; the tab rail sits under it */
    --track: rgba(26,26,26,0.10);
    --shadow: 0 10px 24px -18px rgba(14,74,54,0.35);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--paper); color: var(--ink); font-family: 'Barlow', system-ui, sans-serif;
         font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--court); outline-offset: 2px; border-radius: 6px; }
  /* On the dark green surfaces a green ring is invisible. The ring sits 2px OUTSIDE the element, over what
     surrounds it, so a green button or the active tab on a light page keeps the green ring (white vanished there). */
  .topbar :focus-visible, .board :focus-visible, .cycbar :focus-visible, .wline.coachline :focus-visible { outline-color: #fff; }

  .hd { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; }
  .mono { font-family: 'Space Mono', ui-monospace, Menlo, monospace; }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }

  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

  /* ── Top bar ── */
  .topbar { position: sticky; top: 0; z-index: 60; background: var(--court);
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 13px 22px; }
  .topbar::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--clay); }
  .brand { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .18em;
           color: #fff; text-decoration: none; text-transform: uppercase; white-space: nowrap; }
  .brand span { opacity: .6; font-weight: 400; }
  .topbar .right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .06em; color: rgba(255,255,255,.75);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbtn { font-size: 12px; font-weight: 600; color: #fff; border: 1px solid rgba(255,255,255,.4);
          padding: 6px 12px; border-radius: 999px; white-space: nowrap; transition: background .15s, border-color .15s; }
  .tbtn:hover { background: rgba(255,255,255,.12); border-color: #fff; }
  /* The signed-in address is reassurance, not navigation — drop it before it
     crushes the brand on a phone. */
  @media (max-width: 560px) { .who { display: none; } }
  @media (max-width: 480px) { .tb-lbl { display: none; } .tbtn { padding: 6px 10px; } }
  @media (max-width: 360px) { .topbar { padding: 12px 14px; } .brand { letter-spacing: .08em; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
                              .brand span { display: none; } }

  /* ── Tab rail ── */
  .rail { position: sticky; top: var(--stick); z-index: 55; background: var(--paper);
          border-bottom: 1px solid var(--line); }
  .rail-in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 8px; align-items: center;
             overflow-x: auto; scrollbar-width: none; }
  .rail-in::-webkit-scrollbar { display: none; }
  .tab { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
         font-size: 16px; color: var(--muted); padding: 7px 16px; border-radius: 999px; border: 1px solid transparent;
         display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: color .15s, background .15s; }
  .tab { text-decoration: none; }
  .tab:hover { color: var(--ink); background: var(--court-100); }
  /* The second group: product and marketing admin, used now and then. Same pages, quieter. */
  .tab.more { font-size: 14px; padding: 6px 12px; }
  .rail-sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; flex: none; }
  .rail-grp { display: flex; gap: 8px; align-items: center; }
  /* On a phone: the four daily tabs on one row, the occasional five on a second row that scrolls
     sideways with a fade at the edge (it used to hide six of nine tabs with no sign they were there).
     The rail stops being sticky, so it does not eat the screen. */
  @media (max-width: 760px) {
    .rail { position: static; }
    .rail-in { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 12px 6px; overflow: visible; }
    .rail-grp { gap: 4px; }
    /* Scrolls in place if it is ever wider than the phone (a slow font, big counts), never the page. */
    .rail-grp.main { justify-content: space-between; overflow-x: auto; scrollbar-width: none; }
    .rail-grp.main::-webkit-scrollbar { display: none; }
    .rail-grp.main .tab { font-size: 14px; letter-spacing: .03em; padding: 6px 9px; gap: 5px; }
    .rail-grp.more { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
                     -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
    .rail-grp.more::-webkit-scrollbar { display: none; }
    .tab.more { font-size: 12.5px; padding: 4px 10px; }
    .rail-sep { display: none; }
  }
  @media (max-width: 370px) {
    .rail-grp.main .tab { font-size: 12.5px; letter-spacing: 0; padding: 5px 7px; }
    .rail-grp.main .tab .n { padding: 1px 5px; min-width: 16px; }
  }
  .tab.active { background: var(--court); color: #fff; }
  .tab .n { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; background: var(--clay-fill); color: #fff;
            min-width: 19px; text-align: center; padding: 2px 6px; border-radius: 999px; line-height: 1.2; }
  .tab.active .n { background: rgba(255,255,255,.22); }
  .rail-spacer { flex: 1; }
  .refresh { font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 12px; border-radius: 999px;
             border: 1px solid var(--line); background: var(--card); white-space: nowrap; }
  .refresh:hover { color: var(--court); border-color: var(--court); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 90px; }
  @media (max-width: 480px) { .wrap { padding: 16px 14px 90px; } }
  /* Jump links (the Today counters) land below the sticky bar and rail, not under them. */
  .panel, section, .wday { scroll-margin-top: calc(var(--stick) + 64px); }
  .loadwarn { max-width: 1180px; margin: 12px auto 0; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5;
              background: var(--clay-100); color: var(--ink); border-left: 3px solid var(--clay); }
  .loadwarn .btn { margin-left: 8px; }
  .loadwarn .lw-why { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  @media (max-width: 1220px) { .loadwarn { margin: 12px 20px 0; } }

  /* ── Login gate ── */
  .gate { max-width: 430px; margin: 14vh auto; text-align: center; background: var(--card);
          border: 1px solid var(--line); border-radius: 24px; padding: 44px 34px; box-shadow: var(--shadow); }
  .gate .mark { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .3em;
                color: var(--clay-ink); margin-bottom: 14px; }
  .gate h1 { font-size: 38px; line-height: .95; margin-bottom: 10px; }
  .gate p { color: var(--muted); font-size: 14px; margin-bottom: 26px; line-height: 1.55; }
  .gate .err { color: var(--clay-ink); font-size: 13px; margin-top: 16px; min-height: 18px; }

  .btn { font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--card);
         padding: 9px 18px; border-radius: 999px; transition: border-color .15s, background .15s, color .15s; }
  .btn:hover { border-color: var(--court); color: var(--court); }
  .btn.primary { background: var(--court); border-color: var(--court); color: #fff; }
  .btn.primary:hover { background: var(--court-deep); color: #fff; }
  .btn.clay { background: var(--clay-fill); border-color: var(--clay-fill); color: #fff; }
  .btn.clay:hover { opacity: .92; color: #fff; }
  .btn.danger { color: var(--clay-ink); }
  .btn.danger:hover { border-color: var(--clay); background: var(--clay-100); }
  .btn.sm { font-size: 12px; padding: 5px 12px; }
  @media (max-width: 480px) { .btn.sm { min-height: 34px; } }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .loading { text-align: center; color: var(--muted); padding: 70px 0; }
  .spinner { width: 34px; height: 34px; border-radius: 999px; border: 3px solid var(--track);
             border-top-color: var(--court); margin: 0 auto 14px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Scoreboard hero (TODAY) ── */
  .board { position: relative; overflow: hidden; border-radius: 26px; color: #fff; padding: 26px 28px 24px;
           background: radial-gradient(120% 160% at 12% 0%, #14684C 0%, var(--court) 46%, var(--court-deep) 100%);
           box-shadow: var(--shadow); animation: riseIn .4s cubic-bezier(.16,1,.3,1) both; }
  .board::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--clay); }
  .board-top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .board-date { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
                color: rgba(255,255,255,.72); }
  .board-season { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
                  color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
                  padding: 5px 12px; border-radius: 999px; }
  .board-season b { color: #FFD9C9; font-weight: 700; }
  .board h1 { font-size: clamp(34px, 5vw, 52px); line-height: .92; letter-spacing: -.01em; margin: 14px 0 20px; }
  .board h1 span { color: rgba(255,255,255,.5); }
  .counters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .counter { display: block; text-decoration: none; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
             border-radius: 18px; padding: 13px 16px 12px; transition: background .15s, transform .15s; }
  .counter:hover { background: rgba(255,255,255,.14); transform: translateY(-2px); }
  .counter .n { font-family: 'Space Mono', monospace; font-size: 30px; font-weight: 700; line-height: 1; }
  .counter .n small { font-size: 15px; color: rgba(255,255,255,.55); }
  .counter .l { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
                color: rgba(255,255,255,.66); margin-top: 6px; }
  .counter.hot .n { color: #FFB99F; }
  @media (max-width: 760px) { .counters { grid-template-columns: repeat(2, 1fr); } }

  /* ── Panels ── */
  .cols { display: grid; grid-template-columns: 7fr 5fr; gap: 16px; margin-top: 16px; align-items: start; }
  .colstack { display: grid; gap: 16px; }
  /* Grid items default to min-width:auto, so one nowrap label inside a panel
     can push the whole column past its track and scroll the page sideways. */
  .cols > *, .colstack > *, .counters > * { min-width: 0; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .cols > .colstack:last-child { order: -1; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px;
           box-shadow: var(--shadow); animation: riseIn .4s cubic-bezier(.16,1,.3,1) both; }
  .panel + .panel { margin-top: 0; }
  /* A redraw of the screen already showing (a search keystroke, a save) does not replay the entrance. */
  .no-anim .panel { animation: none; }
  /* The Spine editor is 1300-2400 px tall: its Save stays in reach at the bottom of the screen. */
  .spine-acts { position: sticky; bottom: 0; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
                margin: 14px -20px -18px; padding: 10px 20px; background: var(--paper, #FAF7F2); border-top: 1px solid var(--line);
                border-radius: 0 0 22px 22px; }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .phead .t { font-size: 21px; }
  .phead .r { font-size: 12px; color: var(--muted); }
  .psub { font-size: 12.5px; color: var(--muted); margin: -8px 0 12px; }

  .empty { color: var(--muted); font-size: 13.5px; padding: 10px 0 4px; }
  /* ── Intake (coaching apply-form submissions) ── */
  .intake-card { border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; background: var(--card); overflow: hidden; }
  .intake-card[open] { border-color: var(--court); }
  .intake-card.archived { opacity: .7; }
  .intake-card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; row-gap: 6px; }
  .intake-card > summary::-webkit-details-marker { display: none; }
  .intake-card > summary:hover { background: var(--court-100); }
  .intake-card .ava { width: 30px; height: 30px; border-radius: 999px; background: var(--court); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
  .intake-card .i-name { font-weight: 700; font-size: 15px; }
  .intake-card .i-when { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .ipill { font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
  .ipill.en { background: var(--court-100); color: var(--court); }
  .ipill.fa { background: var(--clay-100); color: var(--clay-ink); }
  .ipill.prog { background: var(--court); color: #fff; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .i-body { padding: 12px 14px 14px; border-top: 1px solid var(--rule); }
  .i-contact { font-size: 13px; margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .i-contact a { color: var(--court); border-bottom: 1px solid var(--court-100); }
  .i-contact .dot { color: var(--muted-soft); }
  .i-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .arch-toggle { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }

  /* ── Affiliates (referral-code roster — public.affiliates, stage29) ── */
  .aff-code { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
  .ipill.pct { background: var(--court-100); color: var(--court); }
  .ipill.warn { background: var(--clay-100); color: var(--clay-ink); }
  .ipill.used { background: var(--paper); color: var(--muted); border: 1px solid var(--line); text-transform: none; letter-spacing: 0; font-weight: 600; }
  .aff-form { padding: 14px 16px; background: var(--court-100); border-radius: 12px; }
  .aff-form .exf input { min-width: 160px; }
  .aff-uses { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

  /* ── Needs you ── */
  .need { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
          padding: 10px 12px; border-radius: 14px; border: 1px solid var(--rule); margin-bottom: 8px;
          background: var(--paper); transition: border-color .15s, transform .12s; }
  .need:hover { border-color: var(--court); transform: translateY(-1px); }
  .need:last-child { margin-bottom: 0; }
  .need .dot { flex: none; width: 8px; height: 8px; border-radius: 999px; }
  .need .dot.clay { background: var(--clay); } .need .dot.ochre { background: var(--ochre); }
  .need .b { flex: 1; min-width: 0; }
  .need .n { font-weight: 700; font-size: 13.5px; }
  .need .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .need .s.more { font-size: 11.5px; }
  .need .dot.court { background: var(--court); }
  a.need { text-decoration: none; color: inherit; }
  .need .go { flex: none; font-size: 11px; color: var(--muted-soft); }

  /* ── The wall ── */
  .mic { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; background: var(--paper); margin-bottom: 14px; }
  .mic .cap { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .mic textarea { width: 100%; min-height: 44px; resize: vertical; border: 1px solid var(--line); border-radius: 10px;
                  background: var(--card); padding: 9px 11px; font-size: 14px; line-height: 1.45; }
  .mic textarea:focus { border-color: var(--court); }
  .mic .row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .mic .count { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--muted-soft); margin-left: auto; }
  .wallday { margin: 16px 0 8px; display: flex; align-items: center; gap: 10px; }
  .wallday .d { font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .wallday::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
  .wline { display: flex; gap: 11px; padding: 9px 4px; border-radius: 12px; align-items: flex-start; }
  .wline.hid { opacity: .45; }
  .wline .ava { flex: none; width: 34px; height: 34px; border-radius: 999px; background: var(--court); color: #fff;
                display: flex; align-items: center; justify-content: center;
                font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; }
  .wline .bd { flex: 1; min-width: 0; }
  /* NOT .who — that is the topbar's signed-in label (white, nowrap) and it
     would paint these names white-on-white. */
  .wline .wtop { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .wline .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px;
               text-transform: uppercase; letter-spacing: .02em; }
  .wline .pct { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--court); font-weight: 700; }
  .wline .txt { font-size: 14px; line-height: 1.45; margin-top: 1px; overflow-wrap: anywhere; }
  .wline .hidetag { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--clay-ink); text-transform: uppercase; }
  .wline .modbtn { flex: none; font-size: 11px; font-weight: 600; color: var(--muted-soft); padding: 3px 9px;
                   border: 1px solid var(--rule); border-radius: 999px; }
  .wline .modbtn:hover { color: var(--clay-ink); border-color: var(--clay); }
  .wline.coachline { background: var(--court); color: #fff; border-radius: 14px; padding: 11px 13px; }
  .wline.coachline .ava { background: var(--clay); }
  .wline.coachline .nm, .wline.coachline .pct { color: #FFD9C9; }
  .showweek { width: 100%; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted);
              padding: 9px 0 3px; }
  .showweek:hover { color: var(--court); }

  /* ── Quest panel ── */
  .questrun { border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; background: var(--paper); }
  .questrun .qtop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
  .questrun .qday { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: var(--clay-ink); }
  .qchip { display: flex; align-items: baseline; gap: 9px; padding: 7px 0; border-top: 1px solid var(--rule); }
  .qchip .qn { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; font-size: 15px; letter-spacing: .03em; }
  .qchip .qd { font-size: 12px; color: var(--muted); flex: 1; }
  .qchip .qx { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--court); white-space: nowrap; }
  .qpick { border-top: 1px solid var(--rule); margin-top: 12px; padding-top: 12px; }
  .qopt { display: flex; align-items: baseline; gap: 10px; padding: 6px 2px; border-radius: 10px; cursor: pointer; }
  .qopt:hover { background: var(--court-100); }
  .qopt input { accent-color: var(--court); transform: translateY(1px); }
  .qopt .qn { font-weight: 700; font-size: 13px; }
  .qopt .qd { font-size: 12px; color: var(--muted); flex: 1; }
  .qopt .qx { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--muted); white-space: nowrap; }

  /* ── Pulse (7-day presence) ── */
  .pulse { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 8px 6px;
           border-radius: 12px; border-bottom: 1px solid var(--rule); }
  .pulse:last-of-type { border-bottom: 0; }
  .pulse:hover { background: var(--court-100); }
  .pulse .nm { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse .nm small { display: block; font-weight: 400; font-size: 11px; color: var(--muted-soft); }
  .dots { display: inline-flex; gap: 4px; flex: none; }
  .dt { width: 13px; height: 13px; border-radius: 5px; background: var(--track); }
  .dt.on { background: var(--court); }
  .dt.today { box-shadow: inset 0 0 0 2px var(--clay); background: var(--card); }
  .dt.today.on { background: var(--court); box-shadow: inset 0 0 0 2px var(--clay); }
  .pulse .tag { flex: none; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .pulse .tag.warn { color: var(--clay-ink); font-weight: 700; }

  /* ── Chips ── */
  .chip { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
          padding: 3px 9px; border-radius: 999px; background: var(--track); color: var(--muted); white-space: nowrap; }
  .chip.court { background: var(--court-100); color: var(--court); }
  .chip.clay { background: var(--clay-100); color: var(--clay-ink); }
  .chip.ochre { background: var(--ochre-100); color: var(--ochre); }
  .chip.solid { background: var(--court); color: #fff; }
  .lvchip { font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; color: var(--court);
            border: 1px solid var(--court); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }

  /* ── Coach tools (Athletes tab): occasional, global, kept out of the roster's way ── */
  .tools { margin-bottom: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
  .tools > summary { cursor: pointer; list-style: none; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tools > summary::-webkit-details-marker { display: none; }
  .tools > summary::before { content: '▸ '; } .tools[open] > summary::before { content: '▾ '; }
  .tools-in { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px; align-items: center; }
  .tools-note { flex-basis: 100%; font-size: 12px; color: var(--muted); }
  /* ── Roster ── */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .controls input[type=search], .controls select { font-size: 14px; padding: 9px 14px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--card); }
  .controls input[type=search] { flex: 1; min-width: 170px; }
  .controls input[type=search]:focus, .controls select:focus { border-color: var(--court); }
  .roster { display: flex; flex-direction: column; gap: 9px; }
  .ath { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card);
         border: 1px solid var(--line); border-radius: 18px; padding: 13px 16px;
         transition: border-color .15s, transform .12s, box-shadow .15s; }
  .ath:hover { border-color: var(--court); transform: translateY(-1px); box-shadow: var(--shadow); }
  .ath.flag { border-left: 3px solid var(--clay); }
  .ath .ava { flex: none; width: 40px; height: 40px; border-radius: 999px; background: var(--court); color: #fff;
              display: flex; align-items: center; justify-content: center;
              font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; }
  .ath.freeath .ava { background: var(--ochre); }
  .ath .main { flex: 1; min-width: 0; }
  .ath .nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 19px; text-transform: uppercase;
             letter-spacing: .01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ath .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .ath .side { flex: none; display: flex; align-items: center; gap: 14px; }
  .ath .side .tag { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); text-align: right; }
  .ath .side .tag.warn { color: var(--clay-ink); font-weight: 700; }
  @media (max-width: 700px) { .ath .side .dots { display: none; } }

  /* ── Detail ── */
  .back { display: inline-block; font-size: 13px; color: var(--court); font-weight: 700; margin-bottom: 14px; text-decoration: none; padding: 6px 0; }
  .dethead { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .dethead h2 { font-size: 40px; line-height: .95; }
  .dethead .sub { font-size: 13px; color: var(--muted); margin-top: 5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .detacts { display: flex; gap: 8px; flex-wrap: wrap; }
  .keyline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .keyline input { flex: 1; min-width: 230px; font-family: 'Space Mono', monospace; font-size: 11.5px; padding: 8px 11px;
                   border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted); }
  .sec { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
         font-size: 17px; color: var(--muted); margin: 26px 0 12px; display: flex; align-items: center;
         justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .sec .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ── Athlete file: identity + sub-tabs ── */
  .det-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .det-id > div { min-width: 0; }
  .dethead h2 { overflow-wrap: anywhere; }
  .det-ava { flex: none; width: 54px; height: 54px; border-radius: 999px; background: var(--court); color: #fff;
             display: flex; align-items: center; justify-content: center;
             font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 21px; }
  .subrail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line);
             margin-bottom: 18px; padding-bottom: 0; }
  .subrail::-webkit-scrollbar { display: none; }
  .stab { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
          font-size: 15px; color: var(--muted); padding: 9px 15px; text-decoration: none; white-space: nowrap;
          border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 7px; }
  .stab:hover { color: var(--ink); }
  .stab.active { color: var(--court); border-bottom-color: var(--clay); }
  .stab .n { font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; background: var(--clay-fill); color: #fff;
             min-width: 18px; text-align: center; padding: 1px 6px; border-radius: 999px; }
  .stab .n.quiet { background: var(--track); color: var(--muted); }

  /* ── Metric strip (the three numbers, charts behind one tap) ── */
  .mstrip { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 10px; margin-bottom: 16px; align-items: stretch; }
  .mp { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 11px 14px; min-width: 0; text-align: left; }
  .mp-l { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .mp-v { font-family: 'Space Mono', monospace; font-size: 23px; font-weight: 700; line-height: 1.15; margin-top: 2px; }
  .mp-v small { font-size: 12px; color: var(--muted); }
  .mp-s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .mp.green .mp-v { color: var(--court); } .mp.amber .mp-v { color: var(--ochre); } .mp.red .mp-v { color: var(--clay-ink); }
  .mp-more { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .mp-more:hover { border-color: var(--court); color: var(--court); }
  .chartbox { margin-bottom: 16px; }
  @media (max-width: 760px) { .mstrip { grid-template-columns: repeat(3, 1fr); } .mp-more { grid-column: 1 / -1; justify-content: center; } }

  .cycbar { background: var(--court); color: #fff; border-radius: 18px; padding: 13px 18px; margin-bottom: 14px; }
  .cyc-nm { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 19px; letter-spacing: .02em; }
  .cyc-fo { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .cyc-dt { font-family: 'Space Mono', monospace; font-size: 12px; color: rgba(255,255,255,.82); margin-top: 3px; }
  .cyc-fo span { font-size: 11.5px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2);
                 padding: 3px 10px; border-radius: 999px; }

  /* ── A day of work: prescribed and done on one line ── */
  .wday { background: var(--card); border: 1px solid var(--line); border-radius: 20px; margin-bottom: 12px; overflow: clip;
          box-shadow: var(--shadow); }
  .wday.warn { border-left: 3px solid var(--ochre); }
  .wday.idle { box-shadow: none; background: transparent; }
  .wday-top { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 18px; }
  .wday-top:hover { background: rgba(0,0,0,.02); }
  .wday-n { flex: none; width: 34px; height: 34px; border-radius: 11px; background: var(--court-100); color: var(--court);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px; }
  .wday.idle .wday-n { background: var(--track); color: var(--muted); }
  .wday-main { flex: 1; min-width: 0; }
  .wday-title { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px;
                text-transform: uppercase; letter-spacing: .01em; line-height: 1.15; }
  .wday-meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .wday-right { flex: none; display: flex; align-items: center; gap: 10px; text-align: right; }
  .dv { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; font-size: 15px; letter-spacing: .03em; }
  .dv.ok { color: var(--court); } .dv.warn { color: var(--ochre); } .dv.miss { color: var(--clay-ink); }
  .dv-sub { display: block; font-size: 10.5px; color: var(--muted-soft); font-family: 'Space Mono', monospace; }
  .wday-body { display: none; padding: 0 18px 18px; }
  .wday.open .wday-body { display: block; }
  .wday.open .day-c-chev { transform: rotate(180deg); }
  /* Narrow: the verdict is nowrap and would squeeze the title down to one word
     per line, so give it its own row under the day name instead. */
  @media (max-width: 900px) {
    .wday-top { flex-wrap: wrap; row-gap: 9px; }
    .wday-n { order: 1; }
    .wday-main { order: 2; flex: 1 1 auto; min-width: 0; }
    .wday-top .day-c-chev { order: 3; }   /* stays on row one, not stranded below */
    .wday-right { order: 4; flex: 1 1 100%; flex-wrap: wrap; justify-content: flex-start; text-align: left; }
    .wday-right .dv-sub { display: none; }
    .wday-title { font-size: 18px; }
  }

  .sesspick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 0 4px; border-top: 1px solid var(--rule); }
  .sp { font-family: 'Space Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 999px;
        border: 1px solid var(--line); color: var(--muted); }
  .sp:hover { border-color: var(--court); color: var(--court); }
  .sp.on { background: var(--court); border-color: var(--court); color: #fff; }
  .sp-lbl { font-size: 11px; color: var(--muted-soft); margin-left: auto; }

  .stalewarn { background: var(--ochre-100); border-left: 3px solid var(--ochre); border-radius: 10px;
               padding: 10px 14px; margin-top: 12px; font-size: 13px; line-height: 1.5; }
  .daynote { background: var(--paper); border-left: 3px solid var(--clay); border-radius: 10px; padding: 11px 14px; margin-top: 12px; }
  .daynote .dn-txt { font-size: 14.5px; line-height: 1.5; }
  .daynote .dn-read { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-soft); margin-top: 6px; }

  .cmp-grp { margin-top: 16px; }
  .cmp-grp-t { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700;
               border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  .cmp-head, .cmp-row { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.15fr) minmax(0, 1.5fr) minmax(0, .95fr);
                        gap: 12px; align-items: start; }
  .cmp-head { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-soft);
              padding: 14px 0 0; position: sticky; top: calc(var(--stick) + 54px); background: var(--card); z-index: 2; }
  .cmp-row { padding: 10px 0; border-bottom: 1px solid var(--rule); position: relative; }
  .cmp-row:last-child { border-bottom: 0; }
  .cmp-row::before { content: ''; position: absolute; left: -12px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; }
  .cmp-row.warn::before { background: var(--ochre); }
  .cmp-row.miss::before { background: var(--clay); }
  .cmp-nm { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .cmp-vid { text-decoration: none; color: var(--court); font-size: 12px; }
  .cmp-items { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .cmp-cnote, .cmp-anote { font-size: 12px; line-height: 1.45; margin-top: 5px; padding: 5px 9px; border-radius: 7px; background: var(--paper); }
  .cmp-cnote { border-left: 2px solid var(--court); }
  .cmp-anote { border-left: 2px solid var(--clay); }
  .cmp-rx { font-family: 'Space Mono', monospace; font-size: 12.5px; line-height: 1.5; }
  .rx-dose { display: inline-block; }
  .rx-rpe { display: inline-block; margin-left: 7px; color: var(--court); }
  .rx-sub { font-family: 'Barlow', sans-serif; font-size: 11px; color: var(--muted-soft); margin-top: 2px; line-height: 1.4; }

  /* ── Prescription editor ─────────────────────────────────────────────── */
  /* The pencil stays quiet until the row is hovered — 800 exercises with a
     permanent button on each reads as a form, not a comparison. */
  .rx-edit { opacity: 0; transition: opacity .12s; background: none; border: 0; cursor: pointer;
             color: var(--court); font-size: 13px; padding: 2px 5px; margin-top: 3px; border-radius: 5px; }
  .cmp-row:hover .rx-edit, .rx-edit:focus { opacity: 1; }
  /* No hover on a touch screen: the pencil is always there, with a finger-sized target. */
  @media (hover: none) { .rx-edit { opacity: 1; padding: 8px 12px; margin-left: -12px; font-size: 15px; }
    /* iOS zooms the page into any field under 16 px when it gets focus. */
    .exf input, .exf textarea, .exf select, .pwin, .controls input[type=search], .controls select { font-size: 16px; }
    .sp { padding: 8px 12px; } }
  /* On a pointer screen the hidden pencil takes no line of its own. */
  @media (hover: hover) { .rx-edit { position: absolute; margin-top: 0; } .cmp-rx { position: relative; } }
  .rx-edit:hover { background: var(--court-100); }
  .rx-warn { font-family: 'Barlow', sans-serif; font-size: 10.5px; color: var(--clay-ink);
             margin-top: 3px; cursor: help; }
  .rx-editor { grid-column: 1 / -1; margin: 10px 0 4px; padding: 14px 16px;
               background: var(--court-100); border-radius: 10px; }
  .exed-title { font-family: 'Barlow', sans-serif; font-size: 12.5px; color: var(--ink); margin-bottom: 10px; }
  .exed-grid { display: flex; flex-wrap: wrap; gap: 14px 18px; }
  .exf { display: flex; flex-direction: column; gap: 4px; font-family: 'Barlow', sans-serif; }
  .exf > span { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .exf input, .exf textarea { font-family: 'Space Mono', monospace; font-size: 12.5px; padding: 7px 9px;
    border: 1px solid var(--rule); border-radius: 7px; background: var(--card); color: var(--ink); }
  .exf input:focus, .exf textarea:focus { outline: 2px solid var(--court); outline-offset: -1px; border-color: transparent; }
  .exf-wide { margin-top: 12px; }
  .exf-wide textarea { width: 100%; box-sizing: border-box; resize: vertical; }
  .exed-mods { margin-top: 11px; font-family: 'Barlow', sans-serif; font-size: 11px; color: var(--muted); }
  .exed-warn { margin-top: 11px; padding: 8px 11px; border-radius: 7px; background: var(--clay-100);
               color: var(--clay-ink); font-family: 'Barlow', sans-serif; font-size: 11.5px; line-height: 1.5; }
  .exed-acts { margin-top: 13px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .exed-hint { font-family: 'Barlow', sans-serif; font-size: 11px; color: var(--muted-soft); }
  .pvlist { margin-top: 4px; }
  .pvrow { display: flex; align-items: center; gap: 12px; padding: 7px 0;
           border-bottom: 1px solid var(--rule); font-family: 'Barlow', sans-serif; font-size: 12px; }
  .pvrow:last-child { border-bottom: 0; }
  .pvwhen { min-width: 150px; font-weight: 600; }
  .pvtime { color: var(--muted-soft); font-weight: 400; margin-left: 5px; }
  .pvwho { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* An entry's history (Exercises → an entry → History): one block per change, what it changed under it. */
  .spvrow { padding: 9px 0; border-bottom: 1px solid var(--rule); font-family: 'Barlow', sans-serif; font-size: 13px; }
  .spvrow:last-child { border-bottom: 0; }
  .spvtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spvwhen { font-weight: 600; }
  .spvwho { flex: 1; min-width: 120px; color: var(--muted); }
  .spvchg { margin-top: 5px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
  .spvchg b { font-weight: 600; color: var(--ink); }

  /* ── Logins waiting to be sent ───────────────────────────────────────── */
  .creds { margin-bottom: 14px; border-left: 3px solid var(--clay); }
  .creds-top { display: flex; width: 100%; align-items: center; justify-content: space-between;
    background: none; border: 0; padding: 2px 0; cursor: pointer; font: inherit; color: inherit; }
  .creds-t { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 9px; }
  .creds-n { background: var(--clay-fill); color: #fff; border-radius: 999px; font-size: 11px;
    font-family: 'Barlow', sans-serif; letter-spacing: 0; padding: 1px 8px; font-weight: 700; }
  .creds-chev { color: var(--muted); }
  .credrow { display: flex; align-items: center; gap: 12px; padding: 8px 0;
    border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .credrow:last-child { border-bottom: 0; }
  .credname { font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 13px; min-width: 150px; }
  .credpass { font-family: 'Space Mono', monospace; font-size: 12.5px; background: var(--court-100);
    padding: 3px 9px; border-radius: 6px; flex: 1; min-width: 190px; }
  .credrow .acts { display: flex; gap: 7px; flex-wrap: wrap; }
  /* Typing a login password (Athletes, Testing app, Course): the box, its buttons, and the rule under them. */
  .pwform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 0 12px;
    border-bottom: 1px solid var(--rule); }
  .pwform:last-child { border-bottom: 0; }
  .pwin { flex: 1; min-width: 190px; font-family: 'Space Mono', monospace; font-size: 14px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  .pwin:focus { border-color: var(--court); }
  .pwhint { flex-basis: 100%; font-size: 12px; color: var(--muted); margin: 0; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }

  /* Toast + demo banner */

  .failbar { position: sticky; top: var(--stick); z-index: 58; max-width: 1180px; margin: 10px auto 0; padding: 0 20px;
             display: flex; flex-direction: column; gap: 6px; align-items: stretch; max-height: 45vh; overflow: auto; }

  @media (max-width: 1220px) { .failbar { padding: 0 20px; } }

  .demoband { background: var(--ochre); color: #fff; text-align: center; font-size: 12px; font-weight: 700;

<!-- LOGIN GATE -->
<div id="gate" class="gate" style="display:none">
  <div class="mark">AA · COACH</div>

// "Waiting on you" means this fortnight. Notes are only marked read when the

// ── Reading and writing safely ────────────────────────────────────────────────
// PostgREST answers at most 1000 rows per request (the project's max_rows) with a 200 and NO
// error, so a plain select of a growing table silently drops rows: session_history alone grows
// by about 135 a month. selectAll() pages through in the table's primary-key order, so no row is
// skipped or read twice between pages.
const TABLE_KEYS = {
  session_history: ['athlete_id', 'day', 'completed_on'], hab_notes: ['athlete_id', 'day'],
  hab_titles: ['athlete_id', 'title'], hab_season_results: ['athlete_id', 'starts_on'],
  library_categories: ['kind', 'id'], library_sessions: ['athlete_id', 'slug', 'completed_on'],
  assess_results: ['player_id', 'test', 'day'], affiliates: ['code'], assess_accounts: ['user_id'],
  assess_content: ['key'], tps_content: ['key'], tps_accounts: ['user_id'], athlete_identities: ['user_id'],
  library: ['slug'], buyer_notes: ['user_id'],
};
function keysOf(table) {
  return TABLE_KEYS[table] || (['programs', 'athlete_progress', 'coaching_logs', 'hab_contacts', 'leaderboard_optin', 'athlete_keys']
    .includes(table) ? ['athlete_id'] : ['id']);
}
// `apply` narrows the read ((q) => q.eq('athlete_id', id)); the paging and the key order stay the same.
async function selectAll(table, cols, orderCols, apply) {
  const order = orderCols || keysOf(table);
  let from = 0, rows = [], total = null, cap = 1000;
  for (;;) {
    let q = sb.from(table).select(cols || '*', from === 0 ? { count: 'exact' } : undefined);
    if (apply) q = apply(q);
    order.forEach(c => { q = q.order(c, { ascending: true }); });
    const { data, error, count } = await q.range(from, from + 999);
    if (error) return { data: null, error };
    const got = data || [];
    if (from === 0) {
      if (typeof count === 'number') total = count;
      // A server set to fewer than 1000 rows a page answers short without saying so: learn its page.
      if (total != null && got.length && got.length < 1000 && total > got.length) cap = got.length;
    }
    rows = rows.concat(got);
    from += got.length;
    if (!got.length || got.length < cap) break;
  }
  // A row written while paging can shift a page by one and repeat a row: keep one per key.
  if (rows.length && order.every(k => k in rows[0])) {
    const seen = new Set();
    rows = rows.filter(r => { const k = order.map(c => String(r[c])).join('\u0001'); if (seen.has(k)) return false; seen.add(k); return true; });
  }
  return { data: rows, error: null, total, short: total != null && rows.length < total };
}
// A write that must change a row. With a lapsed session supabase-js sends the request as the
// anonymous key, RLS lets nothing through, and an UPDATE or DELETE comes back as a success that
// touched no rows. Ask for the rows back (.select()) and treat none as a failure.
function writeFailed(res, what) {
  if (res.error) return res.error.message;
  if (!res.data || !res.data.length) return `Nothing was ${what || 'saved'}: the server changed no row. ` +
    'Your sign-in may have lapsed, or the record has moved. Refresh, sign in again if asked, and redo it.';
  return '';
}
// Errors from the slices that loadAll() treats as optional. Each one used to fail silently, so a
// failed read looked exactly like an empty table: every athlete without a programme, every login
// missing. The banner under the tabs names what did not load.
const LOAD_ERR = {};

// --- tiny helpers -----------------------------------------------------------
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
// A value passed as a JS string argument inside an inline handler: onclick="f(${jsq(x)})".
// esc() alone is not enough there: the browser decodes &#39; back to ' BEFORE the handler
// runs, so a quote in the value (a contact's email, a note) ends the string and the rest
// runs as code in the coach's signed-in session. JSON.stringify makes a real JS string
// literal; esc() then keeps that literal intact inside the double-quoted attribute.
function jsq(s) { return esc(JSON.stringify(String(s ?? ''))); }
function jparse(v) { if (v == null) return null; if (typeof v === 'object') return v; try { return JSON.parse(v); } catch { return null; } }
function pad2(n) { return String(n).padStart(2, '0'); }
function dkey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayKey() { return dkey(new Date()); }
function addDays(iso, n) { const p = String(iso).split('-'); const d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return dkey(d); }
function pDate(iso) { const p = String(iso).split('-'); return new Date(+p[0], (+p[1]) - 1, +p[2]); }
function daysBetween(isoA, isoB) { return Math.round((pDate(isoB) - pDate(isoA)) / 86400000); }
function timeAgo(iso) {
  if (!iso) return '—';
  const d = daysSince(iso);
  if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; return d + ' days ago';
}
function daysSince(iso) {
  if (!iso) return 9999;
  // A date-only value ('2026-10-09', or one the callers wrote as '2026-10-09T12:00:00') is aged in
  // calendar days from today: the clock maths read yesterday as "today" before noon and gave a
  // weigh-in from this morning "-1 days ago".
  const m = String(iso).match(/^(\d{4}-\d{2}-\d{2})(?:T12:00:00)?$/);
  if (m) return Math.max(0, daysBetween(m[1], todayKey()));
  const d = new Date(iso);   // a timestamp: the local calendar day it fell on
  return isNaN(d) ? 9999 : Math.max(0, daysBetween(dkey(d), todayKey()));
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function prettyDate(iso) {
  if (!iso) return '';
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  return `${DOWS[d.getDay()]} ${+p[2]} ${MONTHS[+p[1] - 1]} ${p[0]}`;
}
function wallDayLabel(iso) {
  const t = todayKey();
  if (iso === t) return 'Today';
  if (iso === addDays(t, -1)) return 'Yesterday';
  // An athlete east of the coach (Tehran is 3.5 hours ahead of London) is on tomorrow's date for the last hours of the coach's day: their line is
  // filed under their day, so it says so instead of a bare date (audit TODAY-4, 2026-10-11).
  if (iso === addDays(t, 1)) return 'Tomorrow, their time';
  return prettyDate(iso);
}
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}
function unslug(s) { return String(s || '').replace(/_/g, ' '); }
function round1(n) { return Math.round(n * 10) / 10; }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('on'), 2600);
}
// ── How the page says what happened (audit BROWSER-10, FLOW-22, MKT-13; pile B5) ───────────────────────────────────────────────────
//   it worked           toast()    a line at the bottom that goes away by itself
//   it did not work     fail()     a line at the bottom that STAYS until you dismiss it. A failed save used to be a 2.6-second toast in
//                                  some tabs (easy to miss) and a pop-up in others (it stopped everything and was gone once dismissed)
//   a question          confirm()
//   something to read or copy once (a first password, the backup summary, an erasure receipt)   alert()
// A line is the same words the pop-up used to carry. The same words twice become one line with a count; at most four stay.
const FAILS = []; let _failId = 0;
function fail(msg) {
  const text = String(msg == null ? '' : msg).trim();
  if (!text) return;
  const same = FAILS.find(f => f.text === text);
  if (same) same.n++;
  else { FAILS.push({ id: ++_failId, text, n: 1 }); while (FAILS.length > 4) FAILS.shift(); }
  renderFails();
}
function failDismiss(id) { const i = FAILS.findIndex(f => f.id === id); if (i >= 0) FAILS.splice(i, 1); renderFails(); }
function failDismissAll() { FAILS.length = 0; renderFails(); }
function renderFails() {
  const el = $('failbar');
  if (!el) return;
  el.hidden = !FAILS.length;
  el.innerHTML = FAILS.map(f => `<div class="fb-line" data-fid="${f.id}"><span class="fb-msg" dir="auto">${esc(f.text)}${f.n > 1 ? ` <b>×${f.n}</b>` : ''}</span>` +
      `<button class="fb-x" aria-label="Dismiss" onclick="failDismiss(${f.id})">✕</button></div>`).join('') +
    (FAILS.length > 1 ? `<button class="btn sm fb-all" onclick="failDismissAll()">Dismiss all</button>` : '');
}
function copyText(t, btn) {
  navigator.clipboard.writeText(t).then(() => {
    toast('Copied');
    if (btn) { const o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = o, 1400); }
  }, () => alert('Copy failed — here it is:\n\n' + t));
}
function isPartialStatus(s) { return String(s || '').toLowerCase().indexOf('partial') === 0; }
// A "Note:" line with nothing after it is not a note (two old sessions carry one): it is not something to read.
function sessionHasNote(s) { return !!((s.day_note && s.day_note.trim()) || (s.summary && /\n\s+Note:[ \t]*\S/.test(s.summary))); }
function sessionNeedsReply(s) { return sessionHasNote(s) && (s.coach_status || 'new') === 'new'; }
// When a session's note reached the server, as a day in the coach's own time zone: the row's updated_at
// (save_session stamps it on every save, and the coach marking a note read does not touch it). A note's age
// is counted from here, not from the day the athlete trained: a phone that syncs a fortnight late delivers
// a note that is new to the coach, and filing it by its training day dropped it straight into "older notes"
// where it never reached Needs you (audit TODAY-2). The training day is the fallback for a row with no stamp.
function noteArrivedOn(s) {
  const t = s && s.updated_at ? new Date(s.updated_at) : null;
  return t && !isNaN(t.getTime()) ? dkey(t) : String((s && s.completed_on) || '');
}
// Newest arrival first; ties fall back to the later training day, then the later Day number.
function byArrival(a, b) {
  return String(b.updated_at || '').localeCompare(String(a.updated_at || ''))
    || String(b.completed_on || '').localeCompare(String(a.completed_on || '')) || (Number(b.day) || 0) - (Number(a.day) || 0);
}
function sessionNoteText(s) {
  if (s.day_note && s.day_note.trim()) return s.day_note.trim();
  const notes = [];
  (s.summary || '').split('\n').forEach(ln => { const m = ln.match(/^\s+Note:\s*(.+)/); if (m) notes.push(m[1].trim()); });
  return notes.join(' · ');
}

// --- store ------------------------------------------------------------------
// One load, one in-memory store, views render from it. refetch(parts) updates
// slices after a write. All Proof numbers here are presence facts or server
// RPC results — never scored locally (see the header comment).
const S = {
  ready: false,
  prog: [],        // athlete_progress rows
  hist: [],        // session_history rows, LIGHT: no `summary` and no `log` (see loadHistory); an athlete's are merged in when their file opens
  histVer: 0,      // bumped by every loadHistory(): the rows are new objects, so what was merged into the old ones is gone
  fullFor: {},     // athlete_id -> the histVer their summary + log were merged for (ensureSessionsFull)
  keys: {},        // athlete_id -> secret_key
  notes: [],       // hab_notes rows, last 7 days, hidden included
  contacts: [],    // contact_list() rows
  intake: [],      // intake_list() rows — coaching apply-form submissions
  rules: null,     // xp_rules.rules jsonb
  seasons: [],     // seasons rows, newest first
  titles: [],      // hab_titles recent
  optin: {},       // athlete_id -> {display_name, title}
  programs: {},    // athlete_id -> programme JSON (the row in public.programs)
  progSrc: {},     // athlete_id -> 'db' | 'none'. Demo mode never calls
                   // loadPrograms(), so this has to start as an object, not undefined.
  progMeta: {},    // athlete_id -> { updated_at, updated_by } of that row: the editor's
                   // freshness check and the "last published" line read it.
  lib: [],         // public.library rows (workouts + articles)
  libCats: [],     // public.library_categories rows
  logins: {},      // athlete_id -> athlete_identities row, for athletes with a
                   // username/password. Same reason as above: must not be undefined.
  clogs: {},       // athlete_id -> coaching_logs row (metadata only; the body is
                   // fetched on demand, it is long prose).
  affiliates: [],  // public.affiliates rows — the referral-code roster (coach only).
  assess: null,    // public.assess_accounts rows — testing-app logins, loaded when that tab opens.
  course: null,    // public.tps_accounts rows — course app (/tennis/app/) logins, loaded when that tab opens.
  ath: {},         // assembled per-athlete records
  levels: {},      // athlete_id -> server season level
  board: { season: null, week: null },
  boardAt: {},     // scope -> when the board was read (it is kept until ↻ Refresh, or a quest week starts or ends)
  boardErr: '',    // why the last board read failed
  callLogs: {},    // athlete_id -> rows (fetched on detail)
  // Bumped by every assemble(). The athlete file caches its own context so that
  // switching sub-tabs costs nothing; this is what tells it the cache is stale
  // after a refetch, instead of it quietly showing pre-write data for ever.
  stamp: 0,
};

// session_history is the one table that grows without limit (about 135 sessions a month), and 78% of its bytes are two
// columns the numbers never read: `summary` (the plain-text log) and `log` (the structured one). Every open and every
// refresh used to download all of it (about 750 kB for 501 sessions). Now (audit TODAY-12, 2026-10-11):
//  - boot reads every session's numbers (HIST_LIGHT), and ONLY the text of the unread sessions that contain "Note:",
//    because an exercise note lives inside the text and is what puts someone in Needs you (sessionHasNote);
//  - an athlete's own text and log are read when their file opens (ensureSessionsFull), once, and again only after the
//    list itself was reloaded.
const HIST_LIGHT = 'athlete_id, athlete_name, day, completed_on, status, session_rpe, duration_min, readiness, day_note, focus, updated_at, coach_status';
const HIST_HEAVY = 'athlete_id, day, completed_on, summary, log';
const histKey = h => h.athlete_id + '|' + h.day + '|' + h.completed_on;
async function loadHistory() {
  const [light, withNote] = await Promise.all([
    selectAll('session_history', HIST_LIGHT),
    selectAll('session_history', 'athlete_id, day, completed_on, summary', null,
      q => q.or('coach_status.is.null,coach_status.eq.new').like('summary', '%Note:%')),
  ]);
  // A failed read of either half is a failed load: without the second, an exercise-only note would silently
  // stop counting and the athlete would drop out of Needs you.
  if (light.error) return light;
  if (withNote.error) return { data: null, error: withNote.error };
  const byKey = {};
  light.data.forEach(h => { byKey[histKey(h)] = h; });
  (withNote.data || []).forEach(n => { const h = byKey[histKey(n)]; if (h) h.summary = n.summary; });
  S.histVer++; S.fullFor = {};
  return light;
}
// Merge an athlete's `summary` and `log` into the rows already in memory (the athlete file's comparison and raw log read
// them). Resolves { ok: true } or { ok: false, error }: a failed read must not look like a day nobody logged.
const _fullBusy = {};
function ensureSessionsFull(athleteId) {
  if (DEMO) return Promise.resolve({ ok: true });     // the demo's rows were built whole
  const mine = () => (S.hist || []).filter(h => h.athlete_id === athleteId);
  if (!mine().length || S.fullFor[athleteId] === S.histVer) return Promise.resolve({ ok: true });
  if (_fullBusy[athleteId]) return _fullBusy[athleteId];
  const job = (async () => {
    for (let tries = 0; tries < 3; tries++) {
      const ver = S.histVer;
      const r = await selectAll('session_history', HIST_HEAVY, null, q => q.eq('athlete_id', athleteId));
      if (r.error) return { ok: false, error: r.error.message || 'no answer' };
      if (ver !== S.histVer) continue;     // the list was reloaded while this was on its way: those rows are gone, ask again
      const byKey = {};
      mine().forEach(h => { byKey[histKey(h)] = h; });
      (r.data || []).forEach(n => { const h = byKey[histKey(n)]; if (h) { h.summary = n.summary; h.log = n.log; } });
      S.fullFor[athleteId] = ver;
      return { ok: true };
    }
    return { ok: false, error: 'the session list kept changing while it loaded' };
  })();
  _fullBusy[athleteId] = job;
  job.then(() => { delete _fullBusy[athleteId]; }, () => { delete _fullBusy[athleteId]; });
  return job;
}

async function loadAll() {
  if (DEMO) { demoStore(); S.ready = true; return; }
  const [prog, hist, notes, contacts, rules, seasons, titles, optin, intake, affs] = await Promise.all([
    selectAll('athlete_progress', 'athlete_id, athlete_name, data, updated_at'),
    loadHistory(),
    sb.from('hab_notes').select('*').gte('day', addDays(todayKey(), -7)),
    sb.rpc('contact_list'),
    sb.from('xp_rules').select('rules').eq('id', 1).maybeSingle(),
    sb.from('seasons').select('*').order('starts_on', { ascending: false }),
    sb.from('hab_titles').select('*').order('earned_on', { ascending: false }).limit(30),
    sb.from('leaderboard_optin').select('athlete_id, display_name, title'),
    sb.rpc('intake_list'),
    sb.from('affiliates').select('*').order('code'),
  ]);
  const firstErr = [prog, hist, notes, rules, seasons, titles, optin].find(r => r && r.error);
  if (firstErr) throw new Error(firstErr.error.message);
  S.prog = prog.data || [];
  S.hist = hist.data || [];
  S.notes = notes.data || [];
  S.contacts = (contacts && contacts.data) || [];
  S.rules = (rules.data && rules.data.rules) || null;
  S.seasons = seasons.data || [];
  S.titles = titles.data || [];
  S.optin = {}; (optin.data || []).forEach(r => S.optin[r.athlete_id] = r);
  S.intake = (intake && intake.data) || [];
  S.affiliates = (affs && !affs.error && affs.data) || [];
  // These three still load the page when they fail, but the banner says so: an empty
  // funnel, inbox or code list must not look like a real one.
  LOAD_ERR.contacts = contacts && contacts.error ? contacts.error.message : '';
  LOAD_ERR.intake = intake && intake.error ? intake.error.message : '';
  LOAD_ERR.affiliates = affs && affs.error ? affs.error.message : '';
  await Promise.all([loadLogins(), loadCoachingLogs(), loadLibrary(), loadPrograms()]);
  assemble();
  S.ready = true;
}

// What failed to load, in words, under the tabs. Empty when everything came back.
const LOAD_ERR_LABEL = {
  programs: 'programmes', logins: 'athlete logins', contacts: 'Proof contacts', intake: 'intake forms',
  assess: 'testing-app logins', course: 'course logins', buyerNotes: 'your notes about buyers', spine: 'the exercise library (Spine)',
  affiliates: 'affiliate codes', library: 'the library', clogs: 'coaching logs', levels: 'Proof levels',

    `What you see for ${bad.length === 1 ? 'it' : 'them'} may be empty or out of date, and the actions that depend on ` +

}

// Refetch just the slices a write touched, then re-render.
async function refetch(parts) {
  if (DEMO) { render(); return; }
  const jobs = [], bad = [];
  // A slice that fails to come back is TOLD, not skipped: a save that worked and then showed the old wall, quest week or contact list looked like
  // nothing had happened (audit TODAY-13, 2026-10-11; only the session list used to say so). Programmes report through the banner (LOAD_ERR).
  const take = (label, p, apply) => jobs.push(Promise.resolve(p).then(
    r => { if (r && r.error) bad.push(`${label} (${r.error.message})`); else apply(r); },
    e => { bad.push(`${label} (${(e && e.message) || e})`); }));
  if (parts.includes('notes')) take('the crew wall', sb.from('hab_notes').select('*').gte('day', addDays(todayKey(), -7)), r => { S.notes = r.data || []; });
  if (parts.includes('rules')) take('the quest and XP rules', sb.from('xp_rules').select('rules').eq('id', 1).maybeSingle(), r => { S.rules = (r.data && r.data.rules) || null; });
  if (parts.includes('contacts')) take('the Proof contacts', sb.rpc('contact_list'), r => { S.contacts = r.data || []; });
  if (parts.includes('intake')) take('the intake forms', sb.rpc('intake_list'), r => { S.intake = r.data || []; });
  if (parts.includes('affiliates')) take('the affiliate codes', sb.from('affiliates').select('*').order('code'), r => { S.affiliates = r.data || []; });
  if (parts.includes('hist')) take('the session list', loadHistory(), r => { S.hist = r.data || []; });
  if (parts.includes('programs')) jobs.push(loadPrograms());
  if (parts.includes('prog')) take('the athletes\' progress', selectAll('athlete_progress', 'athlete_id, athlete_name, data, updated_at'), r => { S.prog = r.data || []; });
  if (parts.includes('optin')) take('the leaderboard names', sb.from('leaderboard_optin').select('athlete_id, display_name, title'), r => { S.optin = {}; (r.data || []).forEach(x => S.optin[x.athlete_id] = x); });
  await Promise.all(jobs);
  if (bad.length) fail(`Saved, but ${bad.join(' and ')} could not be reloaded, so what you see for ${bad.length === 1 ? 'it' : 'them'} may be out of date. Tap ↻ Refresh.`);
  // Everything that feeds the roster and the athlete file is rebuilt in one place, after all the
  // reads: a contact forgotten, a programme replaced, a progress blob deleted. (Only 'hist' did
  // this before, so a forgotten contact kept their dots and board name until ↻ Refresh.)
  if (parts.some(x => ['hist', 'programs', 'prog', 'optin', 'contacts'].includes(x))) assemble();
  render();
}

// Load every athlete's programme. Names, tier, sessions/week for adherence, and
// the prescribed plan for the detail view. The programs table IS the roster: every
// athlete, free or coached, has a row. (Until 2026-10-10 an id with no row was looked
// up as data/<id>.json, a file that has been gone from the live site since 2026-09-07;
// on a failed read that turned every athlete into a 404 or, on a local server, into a
// stale local file shown as their live programme.)
async function loadPrograms() {
  const r = await selectAll('programs', 'athlete_id, data, updated_at, updated_by');
  LOAD_ERR.programs = r.error ? r.error.message : '';
  if (r.error) return;   // keep what was loaded before: an error must not empty the roster
  S.programs = {}; S.progSrc = {}; S.progMeta = {};
  (r.data || []).forEach(row => {
    S.programs[row.athlete_id] = row.data;
    S.progSrc[row.athlete_id] = 'db';
    S.progMeta[row.athlete_id] = { updated_at: row.updated_at, updated_by: row.updated_by };
  });
}
// After anything that replaces S.programs: rebuild the roster and the athlete file from the
// new copy. assemble() bumps S.stamp, which is what tells an open athlete file that its cached
// programme is stale; without it the file kept drawing the old programme while the editor wrote
// into the new one, by position, so an edit could land on a different exercise.
async function reloadPrograms() {
  await loadPrograms();
  assemble();
}

// Which athletes have a username/password login. The identity row is the record —
// there is no way to list auth users from the browser, and no need to.
async function loadLogins() {
  const r = await sb.from('athlete_identities')
    .select('athlete_id, email, linked_at, initial_password, password_set_at, sent_at');
  // A failed read must not look like "nobody has a login": the bulk tool would then offer to
  // create logins for everyone, and the server's create resets an existing password.
  LOAD_ERR.logins = r.error ? r.error.message : '';
  if (r.error) return;

// The message that actually goes to the athlete. One place, so the wording is the
// same whether it came from a single create or the bulk run.
function loginMessage(username, password) {
  // The username IS the athlete id, so the roster knows their tier. A free-tier
  // athlete has no programme — program.html would open on an empty one — and Proof
  // is their whole app. Same login either way; only the door differs.
  const a = (S.ath || {})[username];
  const free = a && a.tier === 'free';
  return (free ? `Your habit tracker\n\n` : `Your training app\n\n`) +
         `Open: ${SITE}/${free ? 'habits.html' : 'program.html'}\n` +
         `Username: ${username}\n` +
         `Password: ${password}\n\n` +
         `Save it when your phone offers to — then it opens straight into your ` +
         (free ? `tracker` : `programme`) + ` next time, no typing.\n\n` +
         `To keep it on your home screen: open the link, then Share → Add to Home Screen.`;
}


// A password typed in coach.html for any login (Athletes, Testing app, Course), tidied the way it
// gets typed: spaces at the ends dropped, Persian or Arabic digits turned into 0-9. Empty means
// "generate one". The rule is the same as checkTyped() in the three login functions, which check it
// again: 8-72 printable English characters, no spaces, not the username. Returns { password } or { error }.
function typedPassword(raw, username) {
  const p = String(raw || '').trim()
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660));
  if (!p) return { password: '' };
  if (!/^[\x21-\x7E]{8,72}$/.test(p)) return { error: 'Password: 8 to 72 characters, English letters, numbers and symbols only, no spaces.' };
  if (p.toLowerCase() === String(username || '').toLowerCase()) return { error: 'The password can’t be the same as the username.' };
  return { password: p };
}
const PW_HINT = 'Password: 8+ characters, English letters, numbers and symbols, no spaces. Leave it empty to generate one.';

// Create / reset / revoke an athlete's login. All three go through the
// athlete-login Edge Function, because creating a user needs the service-role key
// and that must never exist in a page anyone can view source on. A create or reset
// can carry a password Amir typed (checked by typedPassword first, and again by the
// function); without one, the function generates it.
async function athleteLoginAction(athleteId, action, password) {
  if (DEMO) { toast('Demo mode — nothing saved'); return; }
  if (action === 'create' && loginsUnknown()) return;
  const { data, error } = await sb.functions.invoke('athlete-login', {
    body: { action, athlete_id: athleteId, password: password || undefined },
  });
  let msg = data && data.error;
  if (!msg && error) { try { msg = (await error.context.json()).error; } catch (e) { msg = error.message; } }
  if (msg) { fail('Could not ' + action + ' the login:\n\n' + msg); return; }
  _athPwOpen = null;
  await loadLogins();
  assemble();
  render();

  if (action === 'revoke') { toast(data.revoked === false ? 'There was no login to remove' : 'Login removed'); return; }
  // The password and its message now sit on the athlete's File tab (and under "Logins to send")
  // with Copy and Mark sent, so nothing depends on a dialog that is gone once dismissed.
  copyText(loginMessage(data.username, data.password));
  // Unless the server could not store it (athlete-login v6 says so): then this is the only place it is shown.
  if (data.warning) { alert('Password ' + (password ? 'changed' : 'reset') + ' for ' + data.username + ', but ' + data.warning + '.\n\nPassword: ' + data.password + '\n\nThe WhatsApp message is copied to your clipboard.'); return; }
  toast((data.created ? 'Login created' : password ? 'Password changed' : 'Password reset') + ' — the message is copied; send it on WhatsApp');
}

// exactly the trap a migration-cutover athlete falls into: their old secret link
// is dead and there is nothing to replace it, so the app looks empty even though
// their history is intact server-side. (Someone who hasn't trained yet isn't at
// risk of that scare, so they're left off this list — they still get a normal
// single "Create login" from their own page whenever you're ready for them.)
function athletesNeedingLogin() {
  return Object.values(S.ath)
    .filter(a => a.id !== 'demo' && a.tier === 'coached' && a.finished > 0 && !S.logins[a.id])
    .map(a => a.id);
