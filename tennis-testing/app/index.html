<!--
  Tennis physical testing app (coach-facing). Source lives in the private assess-content repo.
  Served at amirardekani.com/tennis-testing/app/; its product page is /tennis-testing/ (Website repo).
  Site images use absolute paths, so the app works at any depth.
  Signed in (the default): content comes from Supabase (assess_content, readable only by an
  active buyer account) and players, results and notes save to the account.
  ?sample=1: the clickable sample, with local content files and made-up players, nothing saved.
  Built on the course app's base (tps-content/app). The sign-in screen is program.html's.
  Vazirmatn (fonts/, with its OFL licence) and supabase-js 2.116.0 (lib/) are self-hosted, the same files
  as the course app, so nothing waits on Google Fonts or jsDelivr, which may not load from Iran.
-->
<script>
  // Is anybody signed in on this device? Answered here, synchronously, from localStorage, so
  // the sign-in screen paints without waiting for the Supabase SDK (program.html does the same).
  // This app's Supabase client stores its session under its own key, "assess-auth", so a
  // program.html or coach.html session on the same website is never mistaken for a buyer's.
  (function () {
    var q = new URLSearchParams(location.search);
    window.SAMPLE = q.get('sample') === '1';
    // ?stub=1, local testing only: a fake Supabase in localStorage, already signed in (_dev is never deployed).
    if (q.get('stub') === '1') {
      try { if (!localStorage.getItem('assess-auth')) localStorage.setItem('assess-auth', '{"stub":true}'); } catch (e) {}
      document.write('<script src="_dev/stub-supabase.js"><\/script>');
    }
    document.documentElement.classList.toggle('is-sample', window.SAMPLE);
    window.HAS_SESSION = false;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && /^assess-auth(\.\d+)?$/.test(k)) { window.HAS_SESSION = true; break; }
      }
    } catch (e) { window.HAS_SESSION = true; }   // storage blocked: take the slow path, don't guess
    window.NEEDS_SIGNIN = !window.SAMPLE && !window.HAS_SESSION;
    // The username from the last successful sign-in, prefilled. A convenience, never an authority.
    try { window.LAST_USER = localStorage.getItem('assess_last_user') || ''; } catch (e) { window.LAST_USER = ''; }
  })();
</script>

<body>
<div class="sample-bar">نسخهٔ نمونه · در حال ساخت</div>

<!-- ═══ SIGN IN ═══ program.html's sign-in screen, in Farsi. The buyer types the username Amir sent;
     app.js adds the internal address on submit, so nobody sees or types an email. The autocomplete
     names are what let the phone's password manager offer to save and fill it. -->
<div class="signin-screen" id="signin-screen">
  <form class="signin-card" id="signin-form" autocomplete="on" onsubmit="return false">
    <div class="si-hero">
      <img class="si-hero-img" src="/court-sessions.jpg" alt="" aria-hidden="true"
           fetchpriority="high" decoding="async" onload="this.classList.add('in')" onerror="this.remove()">
      <div class="si-hero-scrim"></div>
      <div class="si-hero-copy">
        <img class="signin-mark" src="/assets/img/icon-192.png" alt="AA Performance" width="52" height="52"
             decoding="async" onerror="this.remove()">
        <div class="si-eyebrow" dir="ltr">AA Performance</div>
        <h1 class="signin-title">آزمون آمادگی <em>جسمانی</em> تنیس</h1>
        <p class="si-mantra">بدانید بازیکن‌هایتان کجا هستند، و تمرین جواب داده یا نه.</p>
      </div>
    </div>
    <div class="si-sheet">
      <label class="signin-f">
        <span>نام کاربری</span>
        <input id="si-user" name="username" autocomplete="username" autocapitalize="none"
               autocorrect="off" spellcheck="false" dir="ltr" required>
      </label>
      <label class="signin-f">
        <span>رمز عبور</span>
        <div class="si-wrap">
          <input id="si-pass" name="password" type="password" autocomplete="current-password" dir="ltr" required>
          <button type="button" class="si-eye" id="si-eye" aria-label="نمایش رمز" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.8 12S5.6 5.4 12 5.4 22.2 12 22.2 12 18.4 18.6 12 18.6 1.8 12 1.8 12Z"/>
              <circle cx="12" cy="12" r="3.1"/>
              <line class="si-eye-slash" x1="3.6" y1="20.4" x2="20.4" y2="3.6"/>
            </svg>
          </button>
        </div>
      </label>
      <button class="signin-go" id="si-go" type="submit">ورود</button>
      <div class="signin-err" id="si-err" hidden></div>
      <p class="signin-help">نام کاربری یا رمز را گم کرده‌اید؟ به امیر پیام بدهید تا اطلاعات تازه بفرستد.</p>
      <div class="signin-foot" dir="ltr">amirardekani.com</div>
    </div>
  </form>
</div>
<script>
  // Painted from here, not from app.js: nobody signed in means nothing to load. The
  // onsubmit="return false" above keeps a native submit from putting the password in the URL
  // until app.js wires the form.
  if (window.NEEDS_SIGNIN) document.getElementById('signin-screen').classList.add('visible');
</script>
